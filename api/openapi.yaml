  /api/internal/workers/{id}/logs:
    post:
      operationId: pushWorkerLogs
      tags: [workers]
      summary: Push log lines from a remote worker
      security:
        - WorkerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Logs received

  # ── Monitor ─────────────────────────────────────────────────────────────
  /api/daemon/config:
    get:
      operationId: getDaemonConfig
      tags: [monitor]
      summary: Effective resolved daemon config
      responses:
        "200":
          description: Resolved daemon config
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    description: >-
                      Effective resolved daemon configuration, embedded verbatim
                      as opaque JSON (json.RawMessage). Inner shape is not decoded
                      by this handler.
        "503":
          description: Daemon config could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/daemon/supervisor:
    get:
      operationId: getDaemonSupervisor
      tags: [monitor]
      summary: Daemon supervisor state and supervised agents
      responses:
        "200":
          description: Supervisor state
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [pid, started_at, uptime_seconds, agents]
                    properties:
                      pid:
                        type: integer
                      started_at:
                        type: string
                        format: date-time
                      uptime_seconds:
                        type: number
                        format: double
                      agents:
                        type: array
                        items:
                          type: object
                          required: [worktree, role, pid, status, restart_count]
                          properties:
                            worktree:
                              type: string
                            role:
                              type: string
                            repo:
                              type: string
                            pid:
                              type: integer
                            status:
                              type: string
                            task_id:
                              type: string
                            epic_id:
                              type: string
                            current_backend:
                              type: string
                            restart_count:
                              type: integer
                            last_start:
                              type: string
                              format: date-time
                            last_exit:
                              type: string
                              format: date-time
                            last_exit_code:
                              type: integer
                            stop_reason:
                              type: string
                            stopped_at:
                              type: string
                              format: date-time
                            worktree_path:
                              type: string
                            last_error_class:
                              type: string
                            no_work_count:
                              type: integer
                            backoff_until:
                              type: string
                              format: date-time
                            remote_branch:
                              type: string
        "503":
          description: Daemon is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to read daemon state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/monitor/status:
    get:
      operationId: getMonitorStatus
      tags: [monitor]
      summary: Full monitor dashboard data
      responses:
        "200":
          description: Dashboard status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStatusResponse"
        "503":
          description: Data collection unavailable

  /api/monitor/agents:
    get:
      operationId: getMonitorAgents
      tags: [monitor]
      summary: Agent list with optional workspace grouping
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorAgentsResponse"
        "503":
          description: Data collection unavailable

  /api/monitor/tasks:
    get:
      operationId: getMonitorTasks
      tags: [monitor]
      summary: Task distribution by status
      responses:
        "200":
          description: Task breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorTasksResponse"
        "503":
          description: Data collection unavailable

  /api/monitor/stats:
    get:
      operationId: getMonitorStats
      tags: [monitor]
      summary: Monitor statistics (distinct from /api/stats issue stats)
      responses:
        "200":
          description: Monitor stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStatsResponse"
        "503":
          description: Data collection unavailable

  /api/monitor/sync:
    get:
      operationId: getMonitorSync
      tags: [monitor]
      summary: Git sync status
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorSyncResponse"
        "503":
          description: Data collection unavailable

  /api/monitor/workspaces:
    get:
      operationId: getMonitorWorkspaces
      tags: [monitor]
      summary: Workspace topology metadata
      responses:
        "200":
          description: Workspace info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorWorkspacesResponse"

  /api/monitor/stale-detector:
    get:
      operationId: getStaleDetector
      tags: [monitor]
      summary: Stale detector status
      responses:
        "200":
          description: Stale detector status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaleDetectorStatus"

  /api/monitor/usage:
    get:
      operationId: getMonitorUsage
      tags: [monitor]
      summary: Token usage aggregates
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: backend
          in: query
          schema:
            type: string
        - name: epic
          in: query
          schema:
            type: string
        - name: since
          in: query
          description: "YYYY-MM-DD"
          schema:
            type: string
        - name: until
          in: query
          description: "YYYY-MM-DD"
          schema:
            type: string
      responses:
        "200":
          description: Usage data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          description: Invalid date parameter
        "503":
          description: Usage store not initialized

  /metrics:
    get:
      operationId: getPrometheusMetrics
      tags: [monitor]
      summary: Prometheus scrape endpoint
      security: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  # ── Observability ───────────────────────────────────────────────────────
  /api/observability/metrics:
    get:
      operationId: getObservabilityMetrics
      tags: [observability]
      summary: Event metrics snapshot
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityMetricsResponse"
        "503":
          description: Observability not configured

  /api/observability/events:
    get:
      operationId: getObservabilityEvents
      tags: [observability]
      summary: Paginated event log
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: type
          in: query
          description: Event type filter
          schema:
            type: string
        - name: agent
          in: query
          description: Agent name filter
          schema:
            type: string
        - name: since
          in: query
          description: RFC3339 timestamp filter
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityEventsResponse"
        "400":
          description: Invalid parameters

  # ── Auth Token ──────────────────────────────────────────────────────────
  /api/auth/token:
    get:
      operationId: getAuthToken
      tags: [config]
      summary: Auth token endpoint (external auth mode)
      security: []
      responses:
        "200":
          description: Token info
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key authentication. The key is a 64-character hex string generated
        from 32 random bytes. Configured via `LOOM_AUTH_API_KEY` env var or
        loaded from `~/.loom/api-key`. Supports fallback to `?token=` query
        parameter for WebSocket/EventSource connections.

    WorkerToken:
      type: http
      scheme: bearer
      description: |
        Static token for internal worker API endpoints. Configured via
        `LOOM_WORKER_TOKEN` env var. If not set, worker API returns 503.

    FleetApiKey:
      type: apiKey
      in: header
      name: X-Fleet-API-Key
      description: |
        API key for fleet registration. Configured via `LOOM_FLEET_API_KEY`
        env var. Constant-time comparison with optional per-IP rate limiting.

    FleetJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token for fleet claim/heartbeat endpoints. HMAC-SHA256 signed.
        Configured via `LOOM_FLEET_JWT_KEY` env var. Token expiry: 1 hour.

    TaskRunLease:
      type: http
      scheme: bearer
      description: |
        Per-task-run lease-token Bearer auth for the task-run SDK transport,
        verified in-handler (not by the user-JWT middleware) through fleet-db's
        fenced task-run checks. The token is accompanied by `X-Loom-Task-Run-*`
        identity headers (run id + fencing token, optional node/lease id); a
        superseded lease or a terminal run is rejected. Not user-JWT, not
        fleet-JWT.

  parameters:
    WorkspaceId:
      name: ws
      in: path
      required: true
      description: Workspace identifier
      schema:
        type: string

    IssueId:
      name: id
      in: path
      required: true
      description: Issue identifier
      schema:
        type: string

    AgentName:
      name: name
      in: path
      required: true
      description: Agent worktree name
      schema:
        type: string

  schemas:
    # ── Response Envelopes ──────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        code:
          type: string
        retryable:
          type: boolean
        details:
          type: object

    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string

    FileMutationResponse:
      type: object
      required: [success, version]
      properties:
        success:
          type: boolean
        version:
          type: string

    FileStatResponse:
      type: object
      required: [path, is_dir, size, mod_time, version]
      properties:
        path:
          type: string
        is_dir:
          type: boolean
        size:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time
        version:
          type: string

    FileTreeEntry:
      type: object
      required: [name, is_dir, size, mod_time]
      properties:
        name:
          type: string
        is_dir:
          type: boolean
        size:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time

    FileCapabilitiesResponse:
      type: object
      required: [read, write, sensitive]
      properties:
        read:
          type: boolean
        write:
          type: boolean
        sensitive:
          type: boolean

    FileTreeResponse:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileTreeEntry"

    FileReadResponse:
      type: object
      required: [path, size, binary, truncated, version]
      properties:
        path:
          type: string
        content:
          type: string
        size:
          type: integer
          format: int64
        binary:
          type: boolean
        truncated:
          type: boolean
        version:
          type: string

    FileIndexResponse:
      type: object
      required: [paths, truncated, partial_reasons]
      properties:
        paths:
          type: array
          items:
            type: string
        truncated:
          type: boolean
        partial_reasons:
          type: array
          items:
            $ref: "#/components/schemas/FilePartialReason"

    FilePartialReason:
      type: string
      enum: [file_count, result_count, byte_limit, file_size, deadline, canceled]

    FileSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        repo:
          type: string
          description: Optional repo qualifier, valid only when scope=agent.
        regex:
          type: boolean
          default: false
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          nullable: true
          items:
            type: string
        caseSensitive:
          type: boolean
          default: false

    FileSearchMatch:
      type: object
      required: [line, col, preview]
      properties:
        line:
          type: integer
        col:
          type: integer
        preview:
          type: string

    FileSearchFileResult:
      type: object
      required: [path, matches]
      properties:
        path:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/FileSearchMatch"

    FileSearchResponse:
      type: object
      required: [results, limitHit, partial_reasons]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/FileSearchFileResult"
        limitHit:
          type: boolean
        partial_reasons:
          type: array
          items:
            $ref: "#/components/schemas/FilePartialReason"

    FileGitStatusResponse:
      type: object
      required: [status, partial, limit_hit, errors]
      properties:
        status:
          type: object
          additionalProperties:
            type: string
            minLength: 2
            maxLength: 2
        partial:
          type: boolean
        limit_hit:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FileCheckoutError"

    FileCheckoutError:
      type: object
      required: [kind, repo, error]
      properties:
        kind:
          type: string
          enum: [agent, repo]
        agent:
          type: string
        repo:
          type: string
        error:
          type: string

    FileCheckout:
      type: object
      required: [kind, repo, exists, change_count]
      properties:
        kind:
          type: string
          enum: [agent, repo]
        agent:
          type: string
        repo:
          type: string
        exists:
          type: boolean
        branch:
          type: string
        change_count:
          type: integer
        status_error:
          type: boolean
        error:
          type: string
        partial:
          type: boolean
        limit_hit:
          type: boolean

    FileCheckoutsResponse:
      type: object
      required: [checkouts, partial, limit_hit, errors]
      properties:
        checkouts:
          type: array
          items:
            $ref: "#/components/schemas/FileCheckout"
        partial:
          type: boolean
        limit_hit:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FileCheckoutError"

    FileCheckoutRepairRequest:
      type: object
      required: [scope, target]
      properties:
        scope:
          type: string
          enum: [agent, repo]
        target:
          type: string
        repo:
          type: string
          description: Repo qualifier, valid when scope=agent.
        force:
          type: boolean

    FileCheckoutRepairResponse:
      type: object
      required: [repaired, method, message]
      properties:
        repaired:
          type: boolean
        method:
          type: string
          enum: [repair, recreate, provision, none]
        requires_force:
          type: boolean
        backup_path:
          type: string
        message:
          type: string

    FileDiffResponse:
      type: object
      required: [path, patch, partial, limit_hit]
      properties:
        path:
          type: string
        patch:
          type: string
        partial:
          type: boolean
        limit_hit:
          type: boolean

    FileBlameLine:
      type: object
      required: [line, lines, sha, author, time, summary]
      properties:
        line:
          type: integer
        lines:
          type: integer
        sha:
          type: string
        author:
          type: string
        time:
          type: string
        summary:
          type: string

    FileBlameResponse:
      type: object
      required: [path, skipped, lines, partial, limit_hit]
      properties:
        path:
          type: string
        skipped:
          type: boolean
        reason:
          type: string
        message:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/FileBlameLine"
        partial:
          type: boolean
        limit_hit:
          type: boolean

    FileHistoryEntry:
      type: object
      required: [kind, sha, author, time, summary]
      properties:
        kind:
          type: string
          enum: [commit]
        sha:
          type: string
        author:
          type: string
        time:
          type: string
        summary:
          type: string

    FileHistoryResponse:
      type: object
      required: [path, entries, partial, limit_hit]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileHistoryEntry"
        partial:
          type: boolean
        limit_hit:
          type: boolean

    FileWriteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        repo:
          type: string
          description: Optional repo qualifier, valid only when scope=agent.

    FileRepoQualifierRequest:
      type: object
      properties:
        repo:
          type: string
          description: Optional repo qualifier, valid only when scope=agent.

    FileMoveRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        repo:
          type: string
          description: Optional repo qualifier, valid only when scope=agent.
        overwrite:
          type: boolean
          default: false
        source_version:
          type: string
          description: Required by the server; current strong version of the source path.
        destination_version:
          type: string
          description: Required when overwriting an existing regular file.

    RuntimeReadyResponse:
      type: object
      required: [ready, mode, workspace]
      properties:
        ready:
          type: boolean
        mode:
          type: string
          enum: [daemon, fleet]
        workspace:
          type: string
        reason:
          type: string

    # ── Pull Request Schemas ────────────────────────────────────────────
    PullRequestDetail:
      type: object
      required:
        - number
        - state
        - title
        - is_draft
        - head_ref_name
        - base_ref_name
        - head_sha
        - merged
      properties:
        number:
          type: integer
        state:
          type: string
        title:
          type: string
        is_draft:
          type: boolean
        head_ref_name:
          type: string
        base_ref_name:
          type: string
        head_sha:
          type: string
        merged:
          type: boolean

    PullRequestDiff:
      type: object
      required: [files, diff]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestDiffFile"
        diff:
          type: string

    PullRequestDiffFile:
      type: object
      required: [path, status, additions, deletions, patch]
      properties:
        path:
          type: string
        status:
          type: string
        additions:
          type: integer
        deletions:
          type: integer
        patch:
          type: string

    PullRequestReviewRequest:
      type: object
      required: [event, expected_head_sha]
      properties:
        event:
          type: string
          enum: [approve, request_changes, comment]
        body:
          type: string
        expected_head_sha:
          type: string

    PullRequestReviewResult:
      type: object
      properties:
        review_id:
          type: integer
        state:
          type: string

    ReviewerEnsureResult:
      type: object
      required: [agent_name, checked_out_sha, seeded]
      properties:
        agent_name:
          type: string
        checked_out_sha:
          type: string
        seeded:
          type: boolean

    ReviewerMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string

    ReviewerMessageResult:
      type: object
      required: [state, reason]
      properties:
        state:
          type: string
        reason:
          type: string

    ReviewerMessage:
      type: object
      required: [turn_id, item_id, role, text]
      properties:
        turn_id:
          type: string
        item_id:
          type: string
        role:
          type: string
          # user | assistant. Deliberately NOT an enum: oapi-codegen resolves
          # enum value-name collisions globally, so an enum here renames the
          # unrelated TranscriptEntryRole* constants in the generated package.
          description: user | assistant
        text:
          type: string
        phase:
          type: string

    ReviewerConversation:
      type: object
      required: [state, messages]
      properties:
        state:
          type: string
          description: >
            starting | reconnecting | idle | running | failed | unsupported.
            failed: the reviewer runtime died or its conversation is
            unreadable. unsupported: the reviewer's backend has no readable
            conversation (the terminal tab still works); detail says why.
        detail:
          type: string
          description: Human-readable context for failed/unsupported states.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerMessage"

    # ── Issue Schemas ───────────────────────────────────────────────────
    Issue:
      type: object
      description: |
        Core issue type used in list endpoints. Maps to `types.Issue` json
        serialization. Some list endpoints return this shape directly (not
        the richer IssueResponse). Fields marked optional may be absent
        depending on issue state.
      required: [id, title, priority, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        design:
          type: string
          description: Hydrated design body when available; collection responses may omit it.
        design_artifact_id:
          type: string
          description: Managed FleetDB artifact reference for the design body.
        design_format:
          type: string
          enum: [markdown, html]
          description: Durable format of the hydrated design body.
        has_design:
          type: boolean
          description: True for either a legacy inline or artifact-backed design.
        acceptance_criteria:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [open, in_progress, blocked, deferred, review, closed]
          description: |
            User-facing statuses. Internal statuses (tombstone, pinned, hooked)
            are not settable via the API and excluded from this enum.
        priority:
          type: integer
          minimum: 0
          maximum: 4
        issue_type:
          type: string
          enum: [bug, feature, task, epic, chore]
        assignee:
          type: string
        owner:
          type: string
        estimated_minutes:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        close_reason:
          type: string
        due_at:
          type: [string, "null"]
          format: date-time
        defer_until:
          type: [string, "null"]
          format: date-time
        external_ref:
          type: [string, "null"]
        source_system:
          type: string
        source_repo:
          type: string
        labels:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        pinned:
          type: boolean
        agent_state:
          type: string
          enum: [idle, spawning, running, working, stuck, done, stopped, dead]
        last_activity:
          type: [string, "null"]
          format: date-time
        role_type:
          type: string
        rig:
          type: string
        mol_type:
          type: string
        parent:
          type: string

    IssueResponse:
      type: object
      description: Full issue detail returned by get-single-issue endpoint. Includes dependency/dependent refs, comments, and counts.
      required:
        - id
        - title
        - status
        - priority
        - issue_type
        - created_at
        - updated_at
        - labels
        - dependencies
        - dependents
        - comments
        - dependency_count
        - dependent_count
        - pinned
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        design:
          type: string
