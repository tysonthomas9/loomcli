        - title
        - status
        - priority
        - issue_type
        - created_at
        - updated_at
        - labels
        - dependencies
        - dependents
        - comments
        - dependency_count
        - dependent_count
        - pinned
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        design:
          type: string
        design_artifact_id:
          type: string
          description: Managed FleetDB artifact reference for the design body.
        design_format:
          type: string
          enum: [markdown, html]
          description: Durable format of the hydrated design body.
        has_design:
          type: boolean
          description: True for either a legacy inline or artifact-backed design.
        acceptance_criteria:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [open, in_progress, blocked, deferred, review, closed]
        priority:
          type: integer
          minimum: 0
          maximum: 4
        issue_type:
          type: string
          enum: [bug, feature, task, epic, chore]
        assignee:
          type: string
        owner:
          type: string
        estimated_minutes:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        close_reason:
          type: string
        due_at:
          type: [string, "null"]
          format: date-time
        defer_until:
          type: [string, "null"]
          format: date-time
        external_ref:
          type: [string, "null"]
        source_repo:
          type: string
        labels:
          type: array
          items:
            type: string
          default: []
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyRef"
          default: []
        dependents:
