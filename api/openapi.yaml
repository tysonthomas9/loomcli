  # ── Dependencies ────────────────────────────────────────────────────────
  /api/workspaces/{ws}/issues/{id}/dependencies:
    get:
      operationId: listDependencies
      tags: [dependencies]
      summary: List an issue's dependencies
      description: |
        Returns the issue's dependencies projected as the *related* issue plus a
        dependency_type discriminator (the FE IssueWithDependencyMetadata shape),
        not the raw types.Dependency relation. Each entry's `id` is the issue on
        the other side of the edge, not the issue being viewed.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Issue dependencies (empty array when the issue has none)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, priority, created_at, dependency_type]
                      properties:
                        id:
                          type: string
                          description: The related issue on the other side of the dependency edge
                        title:
                          type: string
                        status:
                          type: string
                        priority:
                          type: integer
                        created_at:
                          type: string
                          format: date-time
                        dependency_type:
                          type: string
                        issue_type:
                          type: string
                        created_by:
                          type: string
        "400":
          description: Missing issue ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addDependency
      tags: [dependencies]
      summary: Add a dependency to an issue
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDependencyRequest"
      responses:
        "200":
          description: Dependency added
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "400":
          description: Invalid dependency
        "404":
          description: Issue not found

