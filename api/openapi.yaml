  /api/workspaces/{ws}/blocked:
    get:
      operationId: listBlocked
      tags: [blocked]
      summary: List blocked issues with blocker details
      description: |
        Returns canonical blocked work from the issue backend. For FleetDB-backed
        workspaces this includes explicit status=blocked issues, issues blocked
        by non-terminal dependencies, and descendants of blocked parents.
        Dependency blocker IDs/details are returned when known; explicit
        status-only and parent-only blocked issues may have no dependency
        blocker IDs.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: parent_id
          in: query
          schema:
            type: string
        - name: assignee
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [bug, feature, task, epic, chore]
        - name: priority
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 4
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 1000
      responses:
        "200":
          description: Blocked issues
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlockedIssue"

