    # ── Terminal Schemas ────────────────────────────────────────────────
    TabMetadata:
      type: object
      description: Terminal tab metadata (Redis-backed)
      required: [session_name, label, notes, sort_order, pinned, created_at, updated_at, attachable, attached_clients]
      properties:
        session_name:
          type: string
        workspace:
          type: string
        label:
          type: string
        notes:
          type: string
        sort_order:
          type: integer
        pinned:
          type: boolean
        issue_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attachable:
          type: boolean
          description: |
            Whether connecting to this tab will yield a working PTY. True when a
            PTY is live in this server process, and also when the tab's metadata
            was created during this server process — such a tab has no PTY until
            the first WebSocket connects, and connecting spawns one.

            This is NOT a process-liveness check: true does not guarantee the
            child process is still running, only that the manager has not
            released the session. False means the tab metadata outlived its
            server (e.g. a restart) or its PTY has exited; clients should render
            the tab as "session ended" and prompt before reconnecting, since
            reconnecting spawns a fresh session.
        attached_clients:
          type: integer
          description: |
            Count of concurrent WebSocket clients currently viewing this
            session. 0 means no one is attached (but the PTY may still be
            live, within its grace window). Values ≥2 can be surfaced as
            a "multiple viewers" indicator so users can be warned before
            destructive tab-close actions.
        replaced_at:
          type: string
          format: date-time
          description: |
            When this tab's shell was replaced by a fresh one — the previous
            PTY died with a previous server process. Absent means never
            replaced, or the marker was dismissed via PATCH. Unlike
            pty_alive this is persisted, so the marker survives a reload and
            is visible to every client.
        replaced_reason:
          type: string
          enum: [server_restart]
          description: |
            Why the shell was replaced. Server-written only; clients cannot
            set it. Present only alongside replaced_at.

    TabPutRequest:
      type: object
      required: [label, sort_order, notes, pinned]
      properties:
        label:
          type: string
        sort_order:
          type: integer
        notes:
          type: string
        pinned:
          type: boolean

    TabPatchRequest:
      type: object
      description: All fields optional for partial update
      properties:
        label:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        sort_order:
          type: [integer, "null"]
        pinned:
          type: [boolean, "null"]
        issue_id:
          type: [string, "null"]
        replaced_at:
          type: [string, "null"]
          description: |
            Dismiss the session-replacement marker by sending an empty
            string. A non-empty value must be an RFC3339 timestamp;
            anything else is rejected with 400. replaced_reason is not
            client-settable — the server owns its enum.

