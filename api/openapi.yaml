  # ── Ready ───────────────────────────────────────────────────────────────
  /api/workspaces/{ws}/ready:
    get:
      operationId: listReady
      tags: [ready]
      summary: List ready (unblocked) issues
      description: |
        Returns the canonical ready availability view from the issue backend:
        open, non-epic work that is not canonically blocked and not currently
        deferred. Filters may narrow this view, but they must not make
        non-open statuses or epics ready.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: assignee
          in: query
          schema:
            type: string
        - name: type
          in: query
          description: Filter by issue type. Epics are always excluded from the ready view.
          schema:
            type: string
            enum: [bug, feature, task, epic, chore]
        - name: parent_id
          in: query
          schema:
            type: string
        - name: mol_type
          in: query
          schema:
            type: string
            enum: [swarm, patrol, work]
        - name: sort
          in: query
          schema:
            type: string
            enum: [hybrid, priority, oldest]
        - name: unassigned
          in: query
          schema:
            type: boolean
        - name: priority
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 4
        - name: limit
          in: query
          schema:
            type: integer
        - name: labels
          in: query
          description: Comma-separated labels (all must match)
          schema:
            type: string
        - name: labels_any
          in: query
          description: Comma-separated labels (any match)
          schema:
            type: string
        - name: source_repos
          in: query
          description: Comma-separated source repo filters
          schema:
            type: string
      responses:
        "200":
          description: Ready issues
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Issue"
        "400":
          description: Invalid parameters

