    # ── Pull Request Schemas ────────────────────────────────────────────
    PullRequestDetail:
      type: object
      required:
        - number
        - state
        - title
        - is_draft
        - head_ref_name
        - base_ref_name
        - head_sha
        - merged
      properties:
        number:
          type: integer
        state:
          type: string
        title:
          type: string
        is_draft:
          type: boolean
        head_ref_name:
          type: string
        base_ref_name:
          type: string
        head_sha:
          type: string
        merged:
          type: boolean

    PullRequestDiff:
      type: object
      required: [files, diff]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestDiffFile"
        diff:
          type: string

    PullRequestDiffFile:
      type: object
      required: [path, status, additions, deletions, patch]
      properties:
        path:
          type: string
        status:
          type: string
        additions:
          type: integer
        deletions:
          type: integer
        patch:
          type: string

    PullRequestReviewRequest:
      type: object
      required: [event, expected_head_sha]
      properties:
        event:
          type: string
          enum: [approve, request_changes, comment]
        body:
          type: string
        expected_head_sha:
          type: string

    PullRequestReviewResult:
      type: object
      properties:
        review_id:
          type: integer
        state:
          type: string

    ReviewerEnsureResult:
      type: object
      required: [agent_name, checked_out_sha, seeded]
      properties:
        agent_name:
          type: string
        checked_out_sha:
          type: string
        seeded:
          type: boolean

    ReviewerMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string

    ReviewerMessageResult:
      type: object
      required: [state, reason]
      properties:
        state:
          type: string
        reason:
          type: string

    ReviewerMessage:
      type: object
      required: [turn_id, item_id, role, text]
      properties:
        turn_id:
          type: string
        item_id:
          type: string
        role:
          type: string
          # user | assistant. Deliberately NOT an enum: oapi-codegen resolves
          # enum value-name collisions globally, so an enum here renames the
          # unrelated TranscriptEntryRole* constants in the generated package.
          description: user | assistant
        text:
          type: string
        phase:
          type: string
        kind:
          type: string
          description: >
            text | tool_use. Omitted or empty means a normal chat bubble (text).
            tool_use is rendered as a collapsed pill; tool_result is paired into
            tool_result rather than emitted as its own message.
        tool_name:
          type: string
          description: Tool name when kind is tool_use.
        tool_use_id:
          type: string
          description: Native tool-call id used to pair results (when available).
        tool_input:
          type: string
          description: Tool arguments as JSON text or a plain command/path preview.
        tool_result:
          type: string
          description: Paired tool output when available.

    ReviewerConversation:
      type: object
      required: [state, messages]
      properties:
        state:
          type: string
          description: >
            starting | reconnecting | idle | running | failed | unsupported.
            failed: the reviewer runtime died or its conversation is
            unreadable. unsupported: the reviewer's backend has no readable
            conversation (the terminal tab still works); detail says why.
        detail:
          type: string
          description: Human-readable context for failed/unsupported states.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerMessage"

    # ── Issue Schemas ───────────────────────────────────────────────────
    Issue:
      type: object
      description: |
        Core issue type used in list endpoints. Maps to `types.Issue` json
        serialization. Some list endpoints return this shape directly (not
        the richer IssueResponse). Fields marked optional may be absent
        depending on issue state.
      required: [id, title, priority, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        design:
          type: string
          description: Hydrated design body when available; collection responses may omit it.
        design_artifact_id:
          type: string
          description: Managed FleetDB artifact reference for the design body.
        design_format:
          type: string
          enum: [markdown, html]
          description: Durable format of the hydrated design body.
        has_design:
          type: boolean
          description: True for either a legacy inline or artifact-backed design.
        acceptance_criteria:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [open, in_progress, blocked, deferred, review, closed]
          description: |
            User-facing statuses. Internal statuses (tombstone, pinned, hooked)
            are not settable via the API and excluded from this enum.
        priority:
          type: integer
          minimum: 0
          maximum: 4
        issue_type:
          type: string
          enum: [bug, feature, task, epic, chore]
        assignee:
          type: string
        owner:
          type: string
        estimated_minutes:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        close_reason:
          type: string
        due_at:
          type: [string, "null"]
          format: date-time
        defer_until:
          type: [string, "null"]
          format: date-time
        external_ref:
          type: [string, "null"]
        source_system:
          type: string
        source_repo:
          type: string
        labels:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        pinned:
          type: boolean
        agent_state:
          type: string
          enum: [idle, spawning, running, working, stuck, done, stopped, dead]
        last_activity:
          type: [string, "null"]
          format: date-time
        role_type:
          type: string
        rig:
          type: string
        mol_type:
          type: string
        parent:
          type: string

    IssueResponse:
      type: object
      description: Full issue detail returned by get-single-issue endpoint. Includes dependency/dependent refs, comments, and counts.
      required:
