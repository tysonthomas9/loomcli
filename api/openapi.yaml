openapi: 3.1.0
info:
  title: Loom CLI API
  description: |
    REST API for the Loom CLI web UI and daemon. Covers workspace management,
    issue tracking, agent lifecycle, terminal sessions, git operations, fleet
    coordination, monitoring, and observability.
  version: 0.1.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server (post-consolidation single server)

tags:
  - name: health
    description: Health checks and metrics
  - name: config
    description: Authentication and backend configuration
  - name: workspaces
    description: Workspace CRUD and topology
  - name: issues
    description: Issue CRUD, search, and lifecycle
  - name: comments
    description: Issue comments
  - name: dependencies
    description: Issue dependency management
  - name: ready
    description: Ready (unblocked) issue queue
  - name: blocked
    description: Blocked issues listing
  - name: graph
    description: Dependency graph visualization
  - name: stats
    description: Workspace and project statistics
  - name: events
    description: Issue audit events and SSE mutation stream
  - name: sessions
    description: Session audit trail (task-scoped)
  - name: session-history
    description: Session history (issue-scoped, Redis-backed)
  - name: logs
    description: Agent and task log retrieval
  - name: terminal
    description: Terminal session management, spawning, scrollback
  - name: terminal-tabs
    description: Terminal tab metadata (Redis-backed)
  - name: terminal-state
    description: Terminal UI state persistence
  - name: agent-terminal
    description: Per-agent terminal info and WebSocket
  - name: agent-control
    description: Agent lifecycle (start/stop/restart/yield)
  - name: git
    description: Git operations (status, push, pull, sync, PR, reset)
  - name: pull-requests
    description: Pull request review read APIs
  - name: diff
    description: Diff and commit inspection
  - name: files
    description: File tree browsing and editing
  - name: editors
    description: External editor detection and launch
  - name: fleet
    description: Fleet worker coordination
  - name: workers
    description: Internal worker API
  - name: issue-tabs
    description: Issue detail tab state (Redis-backed)
  - name: monitor
    description: Daemon monitor dashboard and metrics
  - name: observability
    description: Event metrics and paginated event log
  - name: approvals
    description: Await-approval resolution
  - name: driver
    description: Driver run SDK transport (run-scoped auth)
  - name: workflows
    description: Workflow and driver run management
  - name: task-run
    description: Task-run SDK transport (lease-scoped auth)
  - name: triggers
    description: Persisted trigger events and deliveries (webhook audit trail)
  - name: webhooks
    description: Inbound webhook ingestion

security:
  - BearerAuth: []

paths:
  # ── Health ──────────────────────────────────────────────────────────────
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check for load balancers
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/health:
    get:
      operationId: getApiHealth
      tags: [health]
      summary: API health check with daemon status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/metrics:
    get:
      operationId: getMetrics
      tags: [health]
      summary: SSE hub metrics snapshot
      responses:
        "200":
          description: Hub metrics
          content:
            application/json:
              schema:
                type: object

  # ── Config ──────────────────────────────────────────────────────────────
  /api/config:
    get:
      operationId: getAuthConfig
      tags: [config]
      summary: Auth mode discovery (public, rate-limited)
      security: []
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum: [none, api_key, external]
                  auth_url:
                    type: string
                    description: External auth service URL (only when mode=external)
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer

  /api/config/terminal:
    get:
      operationId: getTerminalConfig
      tags: [terminal]
      summary: Terminal session lifecycle configuration
      responses:
        "200":
          description: Terminal lifecycle config snapshot
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [grace_period_ms, idle_timeout_ms, max_sessions]
                    properties:
                      grace_period_ms:
                        type: integer
                        format: int64
                        description: >-
                          Grace period (ms) a detached session is kept alive before
                          auto-kill. Zero means disabled.
                      idle_timeout_ms:
                        type: integer
                        format: int64
                        description: Idle reap timeout (ms). Zero means disabled.
                      max_sessions:
                        type: integer
                        description: Maximum concurrent terminal sessions.

  /api/local/settings:
    get:
      operationId: getLocalSettings
      tags: [config]
      summary: Get desktop-local runtime settings (secret-sanitized)
      responses:
        "200":
          description: Sanitized local settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalSettingsResponse"
        "500":
          description: Failed to load local settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchLocalSettings
      tags: [config]
      summary: Update desktop-local runtime settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalSettingsPatchRequest"
      responses:
        "200":
          description: Settings saved (returns sanitized settings)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalSettingsResponse"
        "400":
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to load existing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/backends:
    get:
      operationId: getBackendsHealth
      tags: [config]
      summary: Backend availability health check
      responses:
        "200":
          description: Backend health statuses
          content:
            application/json:
              schema:
                type: object

  # ── Client Error Reporting ──────────────────────────────────────────────
  /api/client-errors:
    post:
      operationId: reportClientError
      tags: [health]
      summary: Client-side error reporting (rate-limited, 10 req/min/IP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Error recorded
        "429":
          description: Rate limited

  # ── Stats ───────────────────────────────────────────────────────────────
  /api/workspaces/{ws}/stats:
    get:
      operationId: getWorkspaceStats
      tags: [stats]
      summary: Per-workspace statistics
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"

  # ── Workspaces ──────────────────────────────────────────────────────────
  /api/workspaces/active:
    get:
      operationId: getActiveWorkspace
      tags: [workspaces]
      summary: Get full topology for the default workspace
      responses:
        "200":
          description: Active workspace topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "404":
          description: No default workspace configured

  /api/workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List all workspaces
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceSummary"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a new workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, path]
              properties:
                name:
                  type: string
                path:
                  type: string
      responses:
        "202":
          description: Workspace creation started (async job)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  job_id:
                    type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Get workspace topology
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "404":
          description: Workspace not found
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      summary: Delete a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Workspace not found

  /api/workspaces/{ws}/repos:
    get:
      operationId: listWorkspaceRepos
      tags: [workspaces]
      summary: List a workspace's repos
      description: |
        Lightweight endpoint returning only the workspace's repo list, for
        clients that do not need the full workspace topology payload.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Repo list
          content:
            application/json:
              schema:
                type: object
                required: [success, repos]
                properties:
                  success:
                    type: boolean
                  repos:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceRepo"
        "400":
          description: Missing workspace ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addWorkspaceRepos
      tags: [workspaces]
      summary: Add repos to a workspace
      description: |
        Attaches existing local git repos and/or clones remote git URLs into
        the workspace, then returns the refreshed workspace topology.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAddReposRequest"
      responses:
        "201":
          description: Repos added; refreshed workspace topology
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/WorkspaceResponse"
                  warnings:
                    type: array
                    items:
                      type: string
        "400":
          description: Missing workspace ID or invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/monitor/status:
    get:
      operationId: getWorkspaceMonitorStatus
      tags: [monitor]
      summary: Full monitor dashboard data for a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Dashboard status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStatusResponse"
        "404":
          description: Workspace not found
        "503":
          description: Data collection unavailable

  /api/workspaces/jobs/{id}:
    get:
      operationId: getWorkspaceJob
      tags: [workspaces]
      summary: Poll workspace creation job status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, running, completed, failed]
                  error:
                    type: string
        "404":
          description: Job not found

  /api/workspaces/order:
    put:
      operationId: reorderWorkspaces
      tags: [workspaces]
      summary: Set workspace display order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/workspaces/default:
    put:
      operationId: setDefaultWorkspace
      tags: [workspaces]
      summary: Set the default workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace:
                  type: string
      responses:
        "200":
          description: Default set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      operationId: clearDefaultWorkspace
      tags: [workspaces]
      summary: Clear the default workspace
      responses:
        "200":
          description: Default cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/workspaces/{ws}/name:
    patch:
      operationId: renameWorkspace
      tags: [workspaces]
      summary: Rename a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRenameRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/config/backend:
    get:
      operationId: getWorkspaceBackendConfig
      tags: [config]
      summary: Get workspace-scoped backend configuration
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Backend config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendConfigResponse"
    patch:
      operationId: patchWorkspaceBackend
      tags: [config]
      summary: Set workspace backend override
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceBackendPatchRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/workspaces/{ws}/config/design-format:
    patch:
      operationId: patchWorkspaceDesignFormat
      tags: [config]
      summary: Set the workspace planner design format
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceDesignFormatPatchRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid design format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/readyz:
    get:
      operationId: getWorkspaceRuntimeReady
      tags: [health]
      summary: Workspace-scoped runtime readiness
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Runtime is ready to serve agent work for the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeReadyResponse"
        "503":
          description: Runtime is not ready to serve agent work for the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeReadyResponse"

  # ── Issues ──────────────────────────────────────────────────────────────
  /api/workspaces/{ws}/issues:
    get:
      operationId: listIssues
      tags: [issues]
      summary: List issues with filtering and search
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, blocked, deferred, review, closed]
        - name: type
          in: query
          schema:
            type: string
            enum: [bug, feature, task, epic, chore]
        - name: assignee
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Free-text search query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 4
        - name: labels
          in: query
          description: Comma-separated label filters (all must match)
          schema:
            type: string
        - name: source_repos
          in: query
          description: Comma-separated source repo filters
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 1000
        - name: title_contains
          in: query
          schema:
            type: string
        - name: description_contains
          in: query
          schema:
            type: string
        - name: notes_contains
          in: query
          schema:
            type: string
        - name: created_after
          in: query
          description: RFC3339 or YYYY-MM-DD
          schema:
            type: string
        - name: created_before
          in: query
          description: RFC3339 or YYYY-MM-DD
          schema:
            type: string
        - name: updated_after
          in: query
          description: RFC3339 or YYYY-MM-DD
          schema:
            type: string
        - name: updated_before
          in: query
          description: RFC3339 or YYYY-MM-DD
          schema:
            type: string
        - name: empty_description
          in: query
          schema:
            type: boolean
        - name: no_assignee
          in: query
          schema:
            type: boolean
        - name: no_labels
          in: query
          schema:
            type: boolean
        - name: pinned
          in: query
          schema:
            type: boolean
        - name: exclude_status
          in: query
          description: Comma-separated statuses to exclude
          schema:
            type: string
        - name: include_blocked
          in: query
          description: Include blocked dependency info
          schema:
            type: boolean
      responses:
        "200":
          description: Issue list
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Issue"
        "400":
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Create a new issue
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/IssueResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/issues/search:
    get:
      operationId: searchIssues
      tags: [issues]
      summary: Full-text search issues in a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: q
          in: query
          required: true
          description: Full-text search query, forwarded to the issue backend
          schema:
            type: string
        - name: limit
          in: query
          description: >-
            Max results. Defaults to 100 and is clamped to a maximum of 500;
            invalid or non-positive values fall back to 100.
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Matching issues
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Issue"
        "400":
          description: Missing search query 'q'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/issues/{id}:
    get:
      operationId: getIssue
      tags: [issues]
      summary: Get a single issue with full details
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Issue details
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/IssueResponse"
        "404":
          description: Issue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchIssue
      tags: [issues]
      summary: Partially update an issue
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchIssueRequest"
      responses:
        "200":
          description: Issue updated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/IssueResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Issue not found
    delete:
      operationId: deleteIssue
      tags: [issues]
      summary: Delete an issue (tombstone)
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Issue deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Issue not found

  /api/workspaces/{ws}/issues/{id}/close:
    post:
      operationId: closeIssue
      tags: [issues]
      summary: Close an issue with optional reason
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseRequest"
      responses:
        "200":
          description: Issue closed
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        "404":
          description: Issue not found

  /api/workspaces/{ws}/issues/{id}/reopen:
    post:
      operationId: reopenIssue
      tags: [issues]
      summary: Reopen a closed issue
      description: |
        Transitions a closed issue back to open status. The request body is
        optional; an empty body or {} yields a status-only reopen. When `reason`
        is set the backend records it as a comment on the issue (best-effort).
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional reason, recorded as a comment (best-effort)
      responses:
        "200":
          description: Issue reopened
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "400":
          description: Missing issue ID or invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Issue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/issues/{id}/claim:
    post:
      operationId: claimIssue
      tags: [issues]
      summary: Atomically claim an issue for the server-side actor
      description: |
        Claims an issue for the LOOM_AGENT_NAME configured on the server. Returns 409
        Conflict if the issue is already claimed by another agent. The claim
        operation is atomic — only one of N concurrent callers will succeed.
        Blocked issues with open ready-work dependencies cannot be claimed.
        Sets assignee and transitions status to in_progress in a single step.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Issue claimed
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/IssueResponse"
        "400":
          description: Missing issue ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Issue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Issue already claimed by another agent or blocked by an open dependency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/issues/{id}/move:
    post:
      operationId: moveIssue
      tags: [issues]
      summary: Move an issue to another workspace
      parameters:
