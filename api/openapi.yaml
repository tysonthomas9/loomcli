    MonitorAgentStatus:
      type: object
      required: [name, branch, status, ahead, behind, workspace]
      properties:
        name:
          type: string
        branch:
          type: string
        status:
          type: string
        ahead:
          type: integer
        behind:
          type: integer
        role:
          type: string
        role_kind:
          type: string
          enum: [interactive, worker]
        repo:
          type: string
        workspace:
          type: string
        daemon_managed:
          type: boolean
        parent:
          type: string
          description: Active epic assignment for lead/workers.
        orchestrator_session_id:
          type: string
          description: Lead/orchestrator session that spawned or owns the agent.
        task_id:
          type: string
          description: Latest task session associated with this agent.
        session_id:
          type: string
          description: Latest control-plane session associated with this agent.
        mode:
          type: string
          description: Assignment mode, such as persistent or ephemeral.
        desired_state:
          type: string
          description: Requested daemon state for the agent.
        commits:
          type: array
          items:
            $ref: "#/components/schemas/MonitorCommitDetail"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/MonitorFileChange"
        current_task_id:
          type: string
          description: >-
            Task this daemon-managed agent has currently claimed. Empty
            between tasks (just spawned, polling, finished). UI joins this
            against issue.id to render which agent is working each card.
        last_activity_at:
          type: string
          format: date-time
          description: >-
            Most recent PTY-output observation from the agent's supervised
            backend (claude/codex/gemini), forwarded over IPC. Compare to
            "now" to detect stuck agents. Zero/absent when no observation
            yet or agent isn't daemon-managed.
        live_status:
          type: string
          description: >-
            Fleet-db's DERIVED liveness signal ("working" or "idle"), computed
            server-side from the running-session + fresh-lease join (never
            re-derived by loom). "working" means the agent has a live session
            right now. Absent when liveness was not computed (no fleet-db
            store). The UI prefers this over the lock-derived status, which
            stays "idle" for a provably-working agent on serve-only
            deployments.
        active_task_id:
          type: string
          description: >-
            Task id of the agent's live session, set only when
            live_status == "working".
        active_phase:
          type: string
          description: >-
            Phase of the agent's live session (e.g. "planning",
            "implementation"), set only when live_status == "working".
        last_error_class:
          type: string
          description: >-
            Fleet-db's DERIVED error_class of the agent's most recent terminal
            session, set only when that latest run failed and the agent is
            currently idle (a newer success clears it). Lets the UI explain a
            stalled idle agent (e.g. "SpawnFailure") instead of a bare "agent
            missing". Absent when liveness was not computed or the last run
            succeeded.

