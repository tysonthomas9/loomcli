      operationId: getMonitorUsage
      tags: [monitor]
      summary: Token usage aggregates
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: backend
          in: query
          schema:
            type: string
        - name: epic
          in: query
          schema:
            type: string
        - name: since
          in: query
          description: "YYYY-MM-DD"
          schema:
            type: string
        - name: until
          in: query
          description: "YYYY-MM-DD"
          schema:
            type: string
      responses:
        "200":
          description: Usage data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          description: Invalid date parameter
        "503":
          description: Usage store not initialized

  /metrics:
    get:
      operationId: getPrometheusMetrics
      tags: [monitor]
      summary: Prometheus scrape endpoint
      security: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  # ── Observability ───────────────────────────────────────────────────────
  /api/observability/metrics:
    get:
      operationId: getObservabilityMetrics
      tags: [observability]
      summary: Event metrics snapshot
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityMetricsResponse"
        "503":
          description: Observability not configured

  /api/observability/events:
    get:
      operationId: getObservabilityEvents
      tags: [observability]
      summary: Paginated event log
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: type
          in: query
          description: Event type filter
          schema:
            type: string
        - name: agent
          in: query
          description: Agent name filter
          schema:
            type: string
        - name: since
          in: query
          description: RFC3339 timestamp filter
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityEventsResponse"
        "400":
          description: Invalid parameters

  # ── Auth Token ──────────────────────────────────────────────────────────
  /api/auth/token:
    get:
      operationId: getAuthToken
      tags: [config]
      summary: Auth token endpoint (external auth mode)
      security: []
      responses:
        "200":
          description: Token info
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key authentication. The key is a 64-character hex string generated
        from 32 random bytes. Configured via `LOOM_AUTH_API_KEY` env var or
        loaded from `~/.loom/api-key`. Supports fallback to `?token=` query
        parameter for WebSocket/EventSource connections.

    WorkerToken:
      type: http
      scheme: bearer
      description: |
        Static token for internal worker API endpoints. Configured via
        `LOOM_WORKER_TOKEN` env var. If not set, worker API returns 503.

    FleetApiKey:
      type: apiKey
      in: header
      name: X-Fleet-API-Key
      description: |
        API key for fleet registration. Configured via `LOOM_FLEET_API_KEY`
        env var. Constant-time comparison with optional per-IP rate limiting.

    FleetJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token for fleet claim/heartbeat endpoints. HMAC-SHA256 signed.
        Configured via `LOOM_FLEET_JWT_KEY` env var. Token expiry: 1 hour.

  parameters:
    WorkspaceId:
      name: ws
      in: path
      required: true
      description: Workspace identifier
      schema:
        type: string

    IssueId:
      name: id
      in: path
      required: true
      description: Issue identifier
      schema:
        type: string

    AgentName:
      name: name
      in: path
      required: true
      description: Agent worktree name
      schema:
        type: string

  schemas:
    # ── Response Envelopes ──────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        code:
          type: string
        details:
          type: object

    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string

    RuntimeReadyResponse:
      type: object
      required: [ready, mode, workspace]
      properties:
        ready:
          type: boolean
        mode:
          type: string
          enum: [daemon, fleet]
        workspace:
          type: string
        reason:
          type: string

    # ── Issue Schemas ───────────────────────────────────────────────────
    Issue:
      type: object
      description: |
        Core issue type used in list endpoints. Maps to `types.Issue` json
        serialization. Some list endpoints return this shape directly (not
        the richer IssueResponse). Fields marked optional may be absent
        depending on issue state.
      required: [id, title, priority, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        design:
          type: string
        acceptance_criteria:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [open, in_progress, blocked, deferred, review, closed]
          description: |
            User-facing statuses. Internal statuses (tombstone, pinned, hooked)
            are not settable via the API and excluded from this enum.
        priority:
          type: integer
          minimum: 0
          maximum: 4
        issue_type:
          type: string
          enum: [bug, feature, task, epic, chore]
        assignee:
          type: string
        owner:
          type: string
        estimated_minutes:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        close_reason:
          type: string
        due_at:
          type: [string, "null"]
          format: date-time
        defer_until:
          type: [string, "null"]
          format: date-time
        external_ref:
          type: [string, "null"]
        source_system:
          type: string
        source_repo:
          type: string
        labels:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        pinned:
          type: boolean
        agent_state:
          type: string
          enum: [idle, spawning, running, working, stuck, done, stopped, dead]
        last_activity:
          type: [string, "null"]
          format: date-time
        role_type:
          type: string
        rig:
          type: string
        mol_type:
          type: string
        parent:
          type: string

    IssueResponse:
      type: object
      description: Full issue detail returned by get-single-issue endpoint. Includes dependency/dependent refs, comments, and counts.
      required:
        - id
        - title
        - status
        - priority
        - issue_type
        - created_at
        - updated_at
        - labels
        - dependencies
        - dependents
        - comments
        - dependency_count
        - dependent_count
        - pinned
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        design:
          type: string
        acceptance_criteria:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [open, in_progress, blocked, deferred, review, closed]
        priority:
          type: integer
          minimum: 0
          maximum: 4
        issue_type:
          type: string
          enum: [bug, feature, task, epic, chore]
        assignee:
          type: string
        owner:
          type: string
        estimated_minutes:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        close_reason:
          type: string
        due_at:
          type: [string, "null"]
          format: date-time
        defer_until:
          type: [string, "null"]
          format: date-time
        external_ref:
          type: [string, "null"]
        source_repo:
          type: string
        labels:
          type: array
          items:
            type: string
          default: []
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyRef"
          default: []
        dependents:
          type: array
          items:
            $ref: "#/components/schemas/DependencyRef"
          default: []
        comments:
          type: array
          items:
            $ref: "#/components/schemas/CommentResponse"
          default: []
        parent:
          type: [string, "null"]
        parent_title:
          type: [string, "null"]
        dependency_count:
          type: integer
        dependent_count:
          type: integer
        pinned:
          type: boolean

    DependencyRef:
      type: object
      description: Slim reference to a dependency/dependent issue
      required: [id, title, status, priority, type, issue_type]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        priority:
          type: integer
        type:
          type: string
          description: Dependency type (e.g. "blocks")
        issue_type:
          type: string

    Dependency:
      type: object
      description: Full dependency relation from types.Dependency
      required: [issue_id, depends_on_id, type, created_at]
      properties:
        issue_id:
          type: string
        depends_on_id:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        metadata:
          type: string
        thread_id:
          type: string

    Comment:
      type: object
      description: Comment from types.Comment
      required: [id, issue_id, author, text, created_at]
      properties:
        id:
          type: integer
          format: int64
        issue_id:
          type: string
        author:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time

    CommentResponse:
      type: object
      description: Comment in IssueResponse (dto.CommentResponse)
      required: [id, author, text, created_at]
      properties:
        id:
          type: integer
          format: int64
        author:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
        parent_id:
          type: [integer, "null"]
          format: int64
        edited_at:
          type: [string, "null"]
          format: date-time

    BlockedIssue:
      type: object
      description: Canonically blocked issue with blocking information when available.
      allOf:
        - $ref: "#/components/schemas/Issue"
        - type: object
          required: [blocked_by_count, blocked_by]
          properties:
            blocked_by_count:
              type: integer
            blocked_by:
              type: array
              description: Dependency blocker IDs when known. May be empty for explicit status-only or parent-propagated blocking.
              items:
                type: string
            blocked_by_details:
              type: array
              items:
                $ref: "#/components/schemas/BlockerRef"

    BlockerRef:
      type: object
      required: [id, title, priority]
      properties:
        id:
          type: string
        title:
          type: string
        priority:
          type: integer

    TreeNode:
      type: object
      description: Node in a dependency tree for graph visualization
      allOf:
        - $ref: "#/components/schemas/Issue"
        - type: object
          required: [depth, parent_id, truncated]
          properties:
            depth:
              type: integer
            parent_id:
              type: string
            truncated:
              type: boolean

    IssueEvent:
      type: object
      description: Audit trail entry for an issue
      required: [id, issue_id, event_type, actor, created_at]
      properties:
        id:
          type: integer
          format: int64
        issue_id:
          type: string
        event_type:
          type: string
        actor:
          type: string
        old_value:
          type: [string, "null"]
        new_value:
          type: [string, "null"]
        comment:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    Statistics:
      type: object
      required:
        - total_issues
        - open_issues
        - in_progress_issues
        - closed_issues
        - blocked_issues
        - deferred_issues
        - ready_issues
        - tombstone_issues
        - pinned_issues
        - epics_eligible_for_closure
        - average_lead_time_hours
      properties:
        total_issues:
          type: integer
        open_issues:
          type: integer
        in_progress_issues:
          type: integer
        closed_issues:
          type: integer
        blocked_issues:
          type: integer
        deferred_issues:
          type: integer
        ready_issues:
          type: integer
        tombstone_issues:
          type: integer
        pinned_issues:
          type: integer
        epics_eligible_for_closure:
          type: integer
        average_lead_time_hours:
          type: number
          format: double

    # ── Request Schemas ─────────────────────────────────────────────────
    CreateIssueRequest:
      type: object
      required: [title, issue_type, priority]
      properties:
        title:
          type: string
        issue_type:
          type: string
          enum: [bug, feature, task, epic, chore]
        priority:
          type: integer
          minimum: 0
          maximum: 4
        id:
          type: string
        parent:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, deferred]
        design:
          type: string
        acceptance_criteria:
          type: string
        notes:
          type: string
        assignee:
          type: string
        owner:
          type: string
        created_by:
          type: string
        external_ref:
          type: string
        estimated_minutes:
          type: [integer, "null"]
        labels:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: string
        due_at:
          type: string
        defer_until:
          type: string

    PatchIssueRequest:
      type: object
      description: All fields are optional for partial update. Pointer types in Go map to nullable here.
      properties:
        title:
          type: [string, "null"]
        description:
          type: [string, "null"]
        status:
          type: [string, "null"]
          enum: [open, in_progress, blocked, deferred, review, closed, null]
        priority:
          type: [integer, "null"]
        assignee:
          type: [string, "null"]
        owner:
          type: [string, "null"]
        design:
          type: [string, "null"]
        acceptance_criteria:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        external_ref:
          type: [string, "null"]
        estimated_minutes:
          type: [integer, "null"]
        issue_type:
          type: [string, "null"]
        add_labels:
          type: array
          items:
            type: string
        remove_labels:
          type: array
          items:
            type: string
        set_labels:
          type: array
          items:
            type: string
        pinned:
          type: [boolean, "null"]
        parent:
          type: [string, "null"]
        due_at:
          type: [string, "null"]
        defer_until:
          type: [string, "null"]
        agent_state:
          type: [string, "null"]
          enum: [idle, spawning, running, working, stuck, done, stopped, dead, null]

    CloseRequest:
      type: object
      properties:
        reason:
          type: string
        session:
          type: string
        suggest_next:
          type: boolean
        force:
          type: boolean

    MoveIssueRequest:
      type: object
      required: [target_workspace]
      properties:
        target_workspace:
          type: string

    MoveResult:
      type: object
      required: [source_id, target_id]
      properties:
        source_id:
          type: string
        target_id:
          type: string
        warnings:
          type: array
          items:
            type: string

    CommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string

    AddDependencyRequest:
      type: object
      required: [depends_on_id]
      properties:
        depends_on_id:
          type: string
        dep_type:
          type: string

    # ── Workspace Schemas ───────────────────────────────────────────────
    WorkspaceResponse:
      type: object
      required: [id, name, path, repos, groups, agents, workspaces, default_workspace]
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        repos:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRepo"
          default: []
        groups:
          type: array
          items:
            type: string
          default: []
        agents:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceAgentInfo"
          default: []
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
          default: []
        workspace_order:
          type: array
          items:
            type: string
        default_workspace:
          type: string

    WorkspaceSummary:
      type: object
      required: [id, name, path, active, repo_count, is_default]
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        active:
          type: boolean
        repo_count:
          type: integer
        is_default:
          type: boolean
        backend:
          type: string

    WorkspaceRepo:
      type: object
      required: [name, path, default_branch, remote, groups]
      properties:
        name:
          type: string
        path:
          type: string
        default_branch:
          type: string
        remote:
          type: string
        remote_url:
          type: string
        source_repo_id:
          type: string
        groups:
          type: array
          items:
            type: string
          default: []

    WorkspaceAgentInfo:
      type: object
      required: [name, repos, repo_groups, cross_repo]
      properties:
        name:
          type: string
        repos:
          type: array
          items:
            type: string
          default: []
        repo_groups:
          type: array
          items:
            type: string
          default: []
        cross_repo:
          type: boolean

    WorkspaceRenameRequest:
      type: object
      required: [new_name]
      properties:
        new_name:
          type: string

    WorkspaceBackendPatchRequest:
      type: object
      required: [backend]
      properties:
        backend:
          type: string

    # ── Config Schemas ──────────────────────────────────────────────────
    BackendConfigResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            backend:
              type: string
            source:
              type: string
            available:
              type: array
              items:
                type: string
            agents:
              type: array
              items:
                $ref: "#/components/schemas/AgentBackendOverride"
        error:
          type: string

    AgentBackendOverride:
      type: object
      required: [worktree, role, backend]
      properties:
        worktree:
          type: string
        role:
          type: string
        backend:
          type: string

    # ── Agent Schemas ───────────────────────────────────────────────────
    AgentStatusResponse:
      type: object
      description: Agent entity from dto.AgentStatusResponse
      required: [id, title, created_at, updated_at, labels]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        agent_state:
          type: string
          enum: [idle, spawning, running, working, stuck, done, stopped, dead]
        role_type:
          type: string
        rig:
          type: string
        last_activity:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        labels:
          type: array
          items:
            type: string
          default: []

    AgentControlEntry:
      type: object
      description: Agent entry from daemon control socket list
      required: [name, role, status]
      properties:
        name:
          type: string
        role:
          type: string
        status:
          type: string

    # ── Session Schemas ─────────────────────────────────────────────────
    SessionResponse:
      type: object
      description: Session audit record from dto.SessionResponse
      required:
        - session_id
        - task_id
        - agent_name
        - backend
        - started_at
        - status
        - exit_code
        - input_tokens
        - output_tokens
        - cache_read_tokens
        - cache_write_tokens
        - estimated_cost_usd
        - files_changed
        - lines_added
        - lines_removed
        - attempt_num
        - is_active
        - has_transcript
        - has_diff
      properties:
        session_id:
          type: string
        task_id:
          type: string
        epic_id:
          type: string
        agent_name:
          type: string
        backend:
          type: string
        model:
          type: string
        phase:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        duration_s:
          type: number
          format: double
        status:
          type: string
        exit_code:
          type: integer
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cache_read_tokens:
          type: integer
          format: int64
        cache_write_tokens:
          type: integer
          format: int64
        estimated_cost_usd:
          type: number
          format: double
        files_changed:
          type: integer
        lines_added:
          type: integer
        lines_removed:
          type: integer
        files_touched:
          type: array
          items:
            type: string
        attempt_num:
          type: integer
        error_class:
          type: string
        is_active:
          type: boolean
        has_transcript:
          type: boolean
        has_diff:
          type: boolean
        last_error:
          type: string

    TranscriptEntry:
      type: object
      description: Single transcript entry from a session
      required: [seq, ts, role, type]
      properties:
        seq:
          type: integer
        ts:
          type: string
          format: date-time
        role:
          type: string
          enum: [user, assistant, system, tool]
        type:
          type: string
          enum: [text, tool_use, tool_result]
        content:
          type: string
        tool_name:
          type: string
        tool_input:
          type: string
        raw:
          type: string

    SessionHistoryRecord:
      type: object
      description: Session history record (Redis-backed, per-issue)
      required: [id, session_name, issue_id, backend, status, launcher, started_at]
      properties:
        id:
          type: string
        session_name:
          type: string
        issue_id:
          type: string
        backend:
          type: string
        status:
          type: string
          enum: [active, completed]
        launcher:
          type: string
          enum: [user, start-work]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        scrollback_path:
          type: string

    # ── Terminal Schemas ────────────────────────────────────────────────
    TerminalSessionInfo:
      type: object
      required: [name, label, created]
      properties:
        name:
          type: string
        label:
          type: string
        created:
          type: integer
          format: int64
          description: Unix timestamp
        issue_id:
          type: string

    TerminalSpawnRequest:
      type: object
      required: [session_name, backend]
      properties:
        session_name:
          type: string
        backend:
          type: string

    TerminalSpawnData:
      type: object
      required: [session_name, backend, command, created]
      properties:
        session_name:
          type: string
        backend:
          type: string
        command:
          type: string
        created:
          type: boolean

    SeedRequest:
      type: object
      required: [issue_id, title]
      properties:
        issue_id:
          type: string
        title:
          type: string
        description:
          type: string
        design:
          type: string
        blockers:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: string
              title:
                type: string

    TabMetadata:
      type: object
      description: Terminal tab metadata (Redis-backed)
      required: [session_name, label, notes, sort_order, pinned, created_at, updated_at, pty_alive, attached_clients]
      properties:
        session_name:
          type: string
        workspace:
          type: string
        label:
          type: string
        notes:
          type: string
        sort_order:
          type: integer
        pinned:
          type: boolean
        issue_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        pty_alive:
          type: boolean
          description: |
            Whether the backend PTY for this tab is currently alive in the
            server process. False means the tab metadata survived (e.g. a
            server restart) but the PTY did not; clients should render the
            tab as "session ended" and prompt before reconnecting (which
            will spawn a fresh session).
        attached_clients:
          type: integer
          description: |
            Count of concurrent WebSocket clients currently viewing this
            session. 0 means no one is attached (but the PTY may still be
            live, within its grace window). Values ≥2 can be surfaced as
            a "multiple viewers" indicator so users can be warned before
            destructive tab-close actions.

