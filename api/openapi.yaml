          type: object
          additionalProperties:
            type: number
        tasks_by_role:
          type: object
          additionalProperties:
            type: integer
        tasks_by_epic:
          type: object
          additionalProperties:
            type: integer
        tasks_by_agent:
          type: object
          additionalProperties:
            type: integer
        hourly_completions:
          type: array
          items:
            $ref: "#/components/schemas/HourlyBucket"
        total_tasks_completed:
          type: integer
          format: int64
        total_tasks_failed:
          type: integer
          format: int64
        total_restarts:
          type: integer
          format: int64

    HourlyBucket:
      type: object
      required: [hour, completed, failed, avg_duration]
      properties:
        hour:
          type: string
          format: date-time
        completed:
          type: integer
        failed:
          type: integer
        avg_duration:
          type: number
          format: double

    ObservabilityEventsResponse:
      type: object
      required: [success, data, total, page, per_page]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ObservabilityEvent"
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        error:
          type: string

    ObservabilityEvent:
      type: object
      required: [type, timestamp]
      properties:
        type:
          type: string
          enum:
            - task.claimed
            - task.started
            - task.completed
            - task.failed
            - agent.started
            - agent.restarted
            - agent.stopped
            - epic.assigned
            - epic.exhausted
            - pr.created
            - conflict.resolved
            - system.health_check
            - system.config_reloaded
        timestamp:
          type: string
          format: date-time
        agent:
          type: string
        role:
          type: string
        epic_id:
          type: string
        data:
          type: object
          description: Event-type-specific data (JSON object)

    DriverRun:
      type: object
      description: |
        One execution of a driver (workflow) version. Created by the workflow
        run endpoint or by trigger dispatch, then advanced by the executor that
        holds its lease.
      required: [workspace_key, run_id, driver_id, driver_version_id, status, created_at, updated_at]
      properties:
        workspace_key:
          type: string
        run_id:
          type: string
        driver_id:
          type: string
        driver_version_id:
          type: string
        entrypoint:
          type: string
        source_kind:
          type: string
          description: What created the run, e.g. `api` or `trigger`.
        source_ref:
          type: string
          description: Request path or trigger route that created the run.
        epic_id:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
            - needs_review
            - cancelled
            - suspended_awaiting_event
        node_id:
          type: string
          description: Executor node currently holding the run.
        lease_id:
          type: string
        fencing_token:
          type: integer
          format: int64
          description: Monotonic token that fences stale lease holders out of writes.
        idempotency_key:
          type: string
        payload:
          description: The raw JSON payload the run was created with.
        output:
          type: object
          additionalProperties:
            type: string
        summary:
          type: string
        error_class:
          type: string
        started_at:
          type: string
          format: date-time
        last_heartbeat:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        parent_run_id:
          type: string
          description: |
            Parent workflow run when this run was spawned by composition.
            Empty means a root/detached run.
        suspended_at:
          type: string
          format: date-time
          nullable: true
        cancel_requested_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Set when a cooperative cancel was requested against a running run.
            The run still terminalizes through its normal fenced finish.
        cancel_requested_reason:
          type: string
        resume_source_event_id:
          type: string
          description: Trigger event that resolved the await and resumed the run.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PlatformEvent:
      type: object
      required: [id, timestamp, actor, action, entity_type, entity_id, workspace_id]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
          description: Dotted action name, e.g. `run.started`.
        entity_type:
          type: string
        entity_id:
          type: string
        workspace_id:
          type: string
        before:
          type: string
        after:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    PlatformEventsPage:
      type: object
      required: [events, cursor]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/PlatformEvent"
        cursor:
          type: string
          description: Opaque cursor to pass as `after` for the next page.

    TriggerEvent:
      type: object
      description: |
        A durable record of one event ingested by the trigger layer, written
        before any dispatch. Records persisted before structural provenance
        existed normalize to `origin: external` on read.
      required: [workspace_key, event_id, source_kind, event_type, occurred_at, received_at]
      properties:
        workspace_key:
          type: string
        event_id:
          type: string
        trigger_binding_id:
          type: string
        source_kind:
          type: string
          description: Ingest source, e.g. `github`.
        source_event_id:
          type: string
          description: The source's own delivery id, used as the idempotency anchor.
        event_type:
          type: string
        subject_ref:
          type: string
        actor_ref:
          type: string
        origin:
          type: string
          description: Server-stamped provenance.
          enum: [external, workflow, system]
        hop_depth:
          type: integer
          description: |
            Workflow re-trigger hops from the originating external or system
            event, which sit at depth 0.
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
        raw_payload_ref:
          type: string
        raw_payload_digest:
          type: string
          description: '`sha256:<hex>` digest of the raw delivery body.'
        signature_status:
          type: string
        replay_of_event_id:
          type: string

    TriggerDeliveryStatus:
      type: string
      description: |
        Lifecycle of one delivery leg. `superseded` marks a delivery replaced
        by a newer event for the same subject key; `held` marks one queued
        behind an active run for its subject key.
      enum:
        - accepted
        - rejected
        - duplicate
        - queued
        - dispatched
        - failed
        - replayed
        - superseded
        - held

    TriggerDelivery:
      type: object
      description: |
        One fan-out leg of a dispatched trigger event: the binding that matched
        it and the driver run it enqueued.
      required: [workspace_key, delivery_id, trigger_event_id, trigger_binding_id, status, attempt, created_at, updated_at]
      properties:
        workspace_key:
          type: string
        delivery_id:
          type: string
        trigger_event_id:
          type: string
        trigger_binding_id:
          type: string
        status:
          $ref: "#/components/schemas/TriggerDeliveryStatus"
        subject_key:
          type: string
          description: |
            Rendered concurrency subject key — the binding's subject key
            template output, or `binding_id|subject_ref` when it has none.
        rejection_reason:
          type: string
        driver_run_id:
          type: string
        attempt:
          type: integer
        next_retry_at:
          type: string
          format: date-time
          nullable: true
        error_class:
          type: string
          description: |
            Terminal error class. `retries_exhausted` marks a failed delivery
            whose binding retry budget is spent; it leaves the retry due-index.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TriggerEventsResponse:
      type: object
      required: [trigger_events, count]
      properties:
        trigger_events:
          type: array
          items:
            $ref: "#/components/schemas/TriggerEvent"
        count:
          type: integer

    TriggerDeliveriesResponse:
      type: object
      required: [trigger_deliveries, count]
      properties:
        trigger_deliveries:
          type: array
          items:
            $ref: "#/components/schemas/TriggerDelivery"
        count:
          type: integer

    CreateWorkflowVersionRequest:
      type: object
      required: [files]
      properties:
        files:
          type: object
          description: |
            Workflow sources keyed by repo-relative path. At least one entry is
            required and the entrypoint must be among them.
          additionalProperties:
            type: string
        entrypoint:
          type: string
          description: |
            Entrypoint path. Defaults to `workflows/{name}.ts` and must live
            under the workflow's own directory.
        activate:
          type: boolean
          default: true
          description: Whether to make the new version the driver's active one.

    Driver:
      type: object
      description: A registered workflow driver.
      required: [workspace_key, driver_id, name, owner_type, status, created_at, updated_at]
      properties:
        workspace_key:
          type: string
        driver_id:
          type: string
        name:
          type: string
        owner_type:
          type: string
          enum: [user, team, lead_agent, system]
        owner_ref:
          type: string
        description:
          type: string
        active_version_id:
          type: string
        status:
          type: string
          enum: [draft, active, disabled]
        trust_level:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DriverVersion:
      type: object
      description: One content-addressed version of a driver's bundled sources.
      required: [workspace_key, version_id, driver_id, version, source_ref, source_digest, bundle_ref, bundle_digest, validation_status, created_at]
      properties:
        workspace_key:
          type: string
        version_id:
          type: string
        driver_id:
          type: string
        version:
          type: integer
          description: Monotonic version number within the driver.
        source_ref:
          type: string
        source_digest:
          type: string
        bundle_ref:
          type: string
        bundle_digest:
          type: string
        runtime:
          type: string
        manifest:
          type: object
          additionalProperties:
            type: string
        build_diagnostics:
          type: string
        validation_status:
          type: string
          enum: [pending, passed, failed]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    DriverBundle:
      type: object
      description: The built bundle produced for a driver version.
      required: [root, bundle_ref, source_ref, source_digest, bundle_digest, manifest]
      properties:
        root:
          type: string
        bundle_ref:
          type: string
        source_ref:
          type: string
        source_digest:
          type: string
        bundle_digest:
          type: string
        manifest:
          type: object
          additionalProperties:
            type: string
        diagnostics:
          type: string

    WorkflowVersionResult:
      type: object
      description: |
        Outcome of a version registration. Exactly one of `created_version` and
        `reused_version` is true — re-posting identical sources reuses the
        existing version.
      required: [driver, version, created_driver, created_version, reused_version, activated]
      properties:
        driver:
          $ref: "#/components/schemas/Driver"
        version:
          $ref: "#/components/schemas/DriverVersion"
        bundle:
          $ref: "#/components/schemas/DriverBundle"
        created_driver:
          type: boolean
        created_version:
          type: boolean
        reused_version:
          type: boolean
        activated:
          type: boolean
          description: Whether this version is now the driver's active version.
        build_diagnostics:
          type: string
          description: Bundler output, empty on a clean build.

    WebhookDelivery:
      type: object
      description: One fan-out leg of a webhook dispatch, as reported on ingest.
      required: [delivery_id, trigger_binding_id, driver_run_id, status]
      properties:
        delivery_id:
          type: string
        trigger_binding_id:
          type: string
        driver_run_id:
          type: string
        status:
          $ref: "#/components/schemas/TriggerDeliveryStatus"
        rejection_reason:
          type: string

    WebhookDispatchResult:
      type: object
      description: |
        The 202 ingest wire. Legs are in dispatch order: the exact route-key
        binding first when present and enabled, then pattern matches in
        binding-id order.
      required: [status, route_key, idempotency_key, deliveries]
      properties:
        status:
          type: string
          const: accepted
        route_key:
          type: string
          description: Derived route key, e.g. `github.pull_request.opened`.
        idempotency_key:
          type: string
          description: '`{adapter}:{delivery-id}`.'
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"

    TerminalLifecycleConfig:
      type: object
      description: Terminal lifecycle limits. A zero millisecond value disables that limit.
      required: [grace_period_ms, idle_timeout_ms, max_sessions]
      properties:
        grace_period_ms:
          type: integer
          format: int64
          description: How long a detached session is held before it is killed.
        idle_timeout_ms:
          type: integer
          format: int64
          description: How long an idle session is held before it is reaped.
        max_sessions:
          type: integer

    TerminalLifecycleConfigResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/TerminalLifecycleConfig"

    DaemonClaimHold:
      type: object
      description: |
        A workspace-level refusal to start new work. Carried on the supervisor
        response so the banner costs no extra round trip.
      required: [held, actor, reason, since]
      properties:
        held:
          type: boolean
        actor:
          type: string
        reason:
          type: string
        since:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    DaemonAgentEntry:
      type: object
      description: One supervised agent in the supervisor snapshot.
      required: [worktree, role, pid, status, restart_count]
      properties:
        worktree:
          type: string
        role:
          type: string
        repo:
          type: string
        pid:
          type: integer
        status:
          type: string
        task_id:
          type: string
        epic_id:
          type: string
        current_backend:
          type: string
        restart_count:
          type: integer
        last_start:
          type: string
          format: date-time
        last_exit:
          type: string
          format: date-time
        last_exit_code:
          type: integer
        stop_reason:
          type: string
        stopped_at:
          type: string
          format: date-time
        worktree_path:
          type: string
        last_error_class:
          type: string
        no_work_count:
          type: integer
        backoff_until:
          type: string
          format: date-time
        remote_branch:
          type: string
        claims_gated:
          type: boolean
          description: Cycling, but gated by an active claim hold.

    DaemonSupervisorData:
      type: object
      required: [pid, started_at, uptime_seconds, agents]
      properties:
        pid:
          type: integer
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: number
        agents:
          type: array
          items:
            $ref: "#/components/schemas/DaemonAgentEntry"
        claim_hold:
          $ref: "#/components/schemas/DaemonClaimHold"

    DaemonSupervisorResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/DaemonSupervisorData"

    DaemonConfigResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true
          description: |
            The effective daemon config, embedded verbatim. Its shape follows
            the daemon config file, not a fixed API schema.

    SanitizedRedisConfig:
      type: object
      description: Redis settings for embedded fleet-db, with the password reduced to a flag.
      required: [enabled, db, tls, password_set]
      properties:
        enabled:
          type: boolean
        addr:
          type: string
        db:
          type: integer
        tls:
          type: boolean
        password_set:
          type: boolean

    SanitizedAgentRuntimeConfig:
      type: object
      required: [default]
      properties:
        default:
          type: string
          description: Where app-triggered task agents run by default.

    SanitizedLocalTaskRunnerConfig:
      type: object
      properties:
        opencode_model:
          type: string

    SanitizedRuntimeCredential:
      type: object
      description: Credential presence only — the value itself is never returned.
      required: [configured]
      properties:
        configured:
          type: boolean
        updated_at:
          type: string

    SanitizedRuntimeCredentialSet:
      type: object
      required: [daytona, github]
      properties:
        daytona:
          $ref: "#/components/schemas/SanitizedRuntimeCredential"
        github:
          $ref: "#/components/schemas/SanitizedRuntimeCredential"

    SanitizedLocalSettings:
      type: object
      required: [version, fleetdb_redis, agent_runtime, local_task_runner, runtime_credentials]
      properties:
        version:
          type: integer
        fleetdb_redis:
          $ref: "#/components/schemas/SanitizedRedisConfig"
        agent_runtime:
          $ref: "#/components/schemas/SanitizedAgentRuntimeConfig"
        local_task_runner:
          $ref: "#/components/schemas/SanitizedLocalTaskRunnerConfig"
        runtime_credentials:
          $ref: "#/components/schemas/SanitizedRuntimeCredentialSet"

    LocalSettingsResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/SanitizedLocalSettings"
        message:
          type: string
          description: Set on a successful PATCH.

    LocalSettingsRedisPatch:
      type: object
      description: |
        `redis_url`, when non-empty, is parsed first and supplies the whole
        config; the discrete fields then override what it set.
      properties:
        enabled:
          type: boolean
        redis_url:
          type: string
        addr:
          type: string
        password:
          type: string
          description: Ignored when empty. Use `clear_password` to unset.
        clear_password:
          type: boolean
        db:
          type: integer
        tls:
          type: boolean

    LocalSettingsAgentRuntimePatch:
      type: object
      properties:
        default:
          type: string
          description: Normalized and validated before it is stored.

    LocalSettingsTaskRunnerPatch:
      type: object
      properties:
        opencode_model:
          type: string

    LocalSettingsCredentialPatch:
      type: object
      description: |
        Supply the credential under whichever field the provider uses; GitHub
        prefers `token`, Daytona prefers `api_key`, and each falls back to the
        other. An empty value is a no-op. The value is sealed before it is
        written and never returned.
      properties:
        api_key:
          type: string
        token:
          type: string
        clear:
          type: boolean
          description: Removes the stored credential; takes precedence over any value.

    LocalSettingsCredentialsPatch:
      type: object
      properties:
        daytona:
          $ref: "#/components/schemas/LocalSettingsCredentialPatch"
        github:
          $ref: "#/components/schemas/LocalSettingsCredentialPatch"

    LocalSettingsPatchRequest:
      type: object
      description: Only the sections present are applied; omitted ones are untouched.
      properties:
        fleetdb_redis:
          $ref: "#/components/schemas/LocalSettingsRedisPatch"
        agent_runtime:
          $ref: "#/components/schemas/LocalSettingsAgentRuntimePatch"
        local_task_runner:
          $ref: "#/components/schemas/LocalSettingsTaskRunnerPatch"
        runtime_credentials:
          $ref: "#/components/schemas/LocalSettingsCredentialsPatch"
