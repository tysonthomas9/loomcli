  # ── Workflows & Runs ────────────────────────────────────────────────────
  /api/workspaces/{ws}/workflows/{name}:
    post:
      operationId: createWorkflowRun
      tags: [workflows]
      summary: Start a workflow run
      description: |
        Resolves the named workflow to a driver (self-healing builtins on
        demand), runs an AI-CLI-backend preflight when the run would execute
        locally, then creates and enqueues a driver run. The request body is
        the opaque driver run payload passed through verbatim; an empty body
        is treated as {}. A recognised convention is an optional epic_id.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: name
          in: path
          required: true
          description: Workflow name
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional idempotency key for run creation.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: |
                Opaque workflow run payload, passed through to the driver run.
                Free-form; may include epic_id. Empty body defaults to {}.
              additionalProperties: true
      responses:
        "202":
          description: Run accepted and enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "400":
          description: Invalid payload or failed runner preflight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Run creation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/workflows/{name}/versions:
    post:
      operationId: createWorkflowVersion
      tags: [workflows]
      summary: Register a workflow version from uploaded source
      description: |
        Builds the uploaded TypeScript source tree and registers it as a
        driver version for the named workflow. Request body is limited to
        4 MiB. When activate is omitted it defaults to true.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: name
          in: path
          required: true
          description: Workflow name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: object
                  description: Map of workspace-relative file path to file source.
                  additionalProperties:
                    type: string
                entrypoint:
                  type: string
                  description: Entry file path; defaults to workflows/{name}.ts.
                activate:
                  type: boolean
                  description: Activate this version after registering. Defaults to true.
      responses:
        "201":
          description: Version registered (or reused)
          content:
            application/json:
              schema:
                type: object
                required:
                  [created_driver, created_version, reused_version, activated]
                properties:
                  driver:
                    type: object
                    description: The registered driver record (domain.Driver).
                  version:
                    type: object
                    description: The registered driver version (domain.DriverVersion).
                  bundle:
                    type: object
                    nullable: true
                    description: The built bundle metadata, when present.
                  created_driver:
                    type: boolean
                  created_version:
                    type: boolean
                  reused_version:
                    type: boolean
                  activated:
                    type: boolean
                  build_diagnostics:
                    type: string
                    description: Build output/diagnostics from the bundler.
        "400":
          description: Missing/invalid files, entrypoint, or build failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/runs/{runId}:
    get:
      operationId: getWorkflowRun
      tags: [workflows]
      summary: Get a workflow/driver run
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: runId
          in: path
          required: true
          description: Driver run identifier
          schema:
            type: string
      responses:
        "200":
          description: Driver run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/runs/{runId}/events:
    get:
      operationId: getWorkflowRunEvents
      tags: [workflows]
      summary: List a run's events (paginated)
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: runId
          in: path
          required: true
          description: Driver run identifier
          schema:
            type: string
        - name: after
          in: query
          description: Opaque cursor; return events after this position.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size; defaults to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformEventsPage"
        "400":
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Run event stream unavailable for this store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/runs/{runId}/stream:
    get:
      operationId: streamWorkflowRunEvents
      tags: [workflows]
      summary: Stream a run's events (SSE)
      description: |
        Server-Sent Events stream of a run's events. Each new event is sent as
        an SSE frame `event: event` whose data is a PlatformEvent JSON object;
        reader errors are sent as `event: error` with a {error} payload. The
        server polls roughly once per second until the client disconnects.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: runId
          in: path
          required: true
          description: Driver run identifier
          schema:
            type: string
        - name: after
          in: query
          description: Opaque cursor; stream events after this position. Defaults to "0".
          schema:
            type: string
            default: "0"
      responses:
        "200":
          description: SSE stream of run events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames. `event: event` frames carry a PlatformEvent JSON
                  object; `event: error` frames carry {"error": string}.
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Streaming unavailable (response writer cannot flush)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Run event stream unavailable for this store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Driver API ──────────────────────────────────────────────────────────
  /api/workspaces/{ws}/driver/events/await:
    post:
      operationId: awaitDriverEvent
      tags: [driver]
      summary: Register-and-check the run's next await (suspend or resolve inline)
      description: >-
        Register-and-check the calling run's next durable await. Responds
        `satisfied`/`timed_out` inline (including idempotent replay of an
        already-finished awaitIndex, with the recorded event) or suspends the
        run and responds `suspended` (the runner then exits; resume re-runs
        from the top). Authentication is run-scoped and enforced in-handler,
        not by the user-JWT middleware: present a run-scoped Bearer token
        (identity derived from its claims) OR the legacy X-Loom-Driver-*
        header quad, optionally with a shared static Bearer token. The await
        instance key is derived server-side from the verified run id, never
        from the body.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: X-Loom-Driver-Run-Id
          in: header
          required: false
          description: Parent DriverRun id. Required on the legacy header-quad transport; omitted when authenticating with a run-scoped Bearer token. A value conflicting with the token is rejected 401 identity_mismatch.
          schema:
            type: string
        - name: X-Loom-Driver-Node-Id
          in: header
          required: false
          description: Parent DriverRun node id (legacy header transport only).
          schema:
            type: string
        - name: X-Loom-Driver-Lease-Id
          in: header
          required: false
          description: Parent DriverRun lease id (legacy header transport only).
          schema:
            type: string
        - name: X-Loom-Driver-Fencing-Token
          in: header
          required: false
          description: Positive int64 fencing token as a decimal string (legacy header transport only).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeoutMs, awaitIndex]
              properties:
                pattern:
                  type: string
                  description: Fully rendered subject-scoped key to wait for (eventType:subject, exact equality, no glob).
                actor:
                  description: Optional eligible-resolver allow-list; accepts a single string or an array of strings.
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                timeoutMs:
                  type: integer
                  format: int64
                  description: Mandatory await timeout in milliseconds.
                awaitIndex:
                  type: integer
                  description: 1-based ordinal of this await within the run.
      responses:
        "200":
          description: Await outcome — suspended, or satisfied/timed_out with the recorded event inline.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [suspended, satisfied, timed_out, cancelled]
                  instanceKey:
                    type: string
                    description: Canonical await identity runID#await-{n}.
                  pattern:
                    type: string
                  deadline:
                    type: string
                    format: date-time
                  event:
                    type: object
                    description: Recorded resolving event; present on terminal outcomes (absent when suspended).
                    required: [id, occurredAt]
                    properties:
                      id:
                        type: string
                      payload:
                        description: Size-capped resume payload (raw JSON), returned inline on first resolution and every replay.
                      actor:
                        type: string
                        description: Resolving actor when the event is journaled; absent for synthetic timeout events.
                      occurredAt:
                        type: string
                        format: date-time
        "400":
          description: Invalid request (e.g. unscoped pattern, missing timeout, malformed instance key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "401":
          description: Unauthenticated, expired run token, or identity_mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "403":
          description: Caller does not own the parent run, or actor not permitted to resolve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "404":
          description: Parent DriverRun not found or no longer running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "409":
          description: Conflict (e.g. run already resumed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"

  /api/workspaces/{ws}/driver/events/awaits:
    get:
      operationId: listDriverEventAwaits
      tags: [driver]
      summary: List the calling run's awaits in index order
      description: >-
        Returns the verified run's await registrations in instance-index order
        (terminal rows carry their recorded event and inline resume payload;
        pending rows are included) so a resumed workflow can rebuild context.
        Run-scoped auth is enforced in-handler (run token or legacy
        X-Loom-Driver-* header quad), not by the user-JWT middleware.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: X-Loom-Driver-Run-Id
          in: header
          required: false
          description: Parent DriverRun id (legacy header transport; omitted with a run-scoped Bearer token).
          schema:
            type: string
        - name: X-Loom-Driver-Node-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Lease-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Fencing-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The run's awaits in index order.
          content:
            application/json:
              schema:
                type: object
                required: [runId, awaits]
                properties:
                  runId:
                    type: string
                  awaits:
                    type: array
                    items:
                      type: object
                      required: [workspaceKey, instanceKey, runID, pattern, deadline, registeredAt, status]
                      properties:
                        workspaceKey:
                          type: string
                        instanceKey:
                          type: string
                          description: Canonical identity runID#await-{n}, n >= 1.
                        runID:
                          type: string
                        pattern:
                          type: string
                          description: Fully rendered subject-scoped key matched by exact equality.
                        actorAllow:
                          type: array
                          items:
                            type: string
                          description: Actors eligible to resolve this await; empty means any actor.
                        deadline:
                          type: string
                          format: date-time
                        registeredAt:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum: [pending, satisfied, timed_out, cancelled]
                        satisfiedByEventID:
                          type: string
                          description: Trigger event (or synthetic timeout event) that resolved the await.
                        satisfiedPayload:
                          description: Size-capped resume payload (raw JSON) persisted on the satisfied row.
                        resumedAt:
                          type: string
                          format: date-time
                          nullable: true
        "401":
          description: Unauthenticated, expired run token, or identity_mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "404":
          description: Parent DriverRun not found or no longer running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"

  /api/workspaces/{ws}/driver/watch/epic:
    get:
      operationId: watchDriverEpic
      tags: [driver]
      summary: SSE stream of TaskRun journal events for an epic
      description: >-
        Server-Sent Events stream of TaskRun journal events scoped to an epic.
        Handshake frame `event: snapshot` carries the epic scheduling snapshot
        plus the parent run's active task runs (id = cursor); each subsequent
        `event: taskRun` frame carries one journal event (id = the event Seq).
        Resume with the `Last-Event-ID` header or the `afterSeq` query param as
        an exclusive int64 Seq cursor. Every reconciliation tick re-verifies
        the parent run and re-sends a snapshot; when the parent is no longer
        running the stream ends with `event: closed` {code:"parent_not_running"}.
        Run-scoped auth is enforced in-handler; errors that occur before the
        stream commits to text/event-stream use the driver JSON error envelope.
        The epic id comes from the epicId query param, falling back to the
        parent run's epic.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: epicId
          in: query
          required: false
          description: Epic to scope the stream to. Falls back to the parent DriverRun's epic id; required if neither is present (400).
          schema:
            type: string
        - name: afterSeq
          in: query
          required: false
          description: Exclusive int64 Seq resume cursor (alternative to the Last-Event-ID header). 0/absent streams from the start of the journal.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: SSE reconnect cursor (exclusive int64 Seq); takes precedence over afterSeq.
          schema:
            type: string
        - name: X-Loom-Driver-Run-Id
          in: header
          required: false
          description: Parent DriverRun id (legacy header transport; omitted with a run-scoped Bearer token).
          schema:
            type: string
        - name: X-Loom-Driver-Node-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Lease-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Fencing-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >-
            SSE stream. Frames: `snapshot` (epic + active task runs),
            `taskRun` (one journal event, id = Seq), `closed`
            (terminal, e.g. {code:"parent_not_running"}).
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Missing epic id or malformed resume cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "401":
          description: Unauthenticated, expired run token, or identity_mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "404":
          description: Parent DriverRun not found or no longer running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "500":
          description: Internal error or streaming unsupported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"

  /api/workspaces/{ws}/driver/workflows/await:
    post:
      operationId: awaitDriverWorkflow
      tags: [driver]
      summary: Await a child workflow run's completion
      description: >-
        Await sugar over the pattern `run.finished:{childRunId}`: validates the
        child belongs to the caller, then runs the standard events/await flow
        (same suspended / satisfied / timed_out wire shapes), consuming a
        normal awaitIndex slot. A non-suspended response additionally carries
        the child's terminal status, summary and errorClass so a resumed parent
        branches without a second fetch. Run-scoped auth enforced in-handler.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: X-Loom-Driver-Run-Id
          in: header
          required: false
          description: Parent DriverRun id (legacy header transport; omitted with a run-scoped Bearer token).
          schema:
            type: string
        - name: X-Loom-Driver-Node-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Lease-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Fencing-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childRunId, timeoutMs, awaitIndex]
              properties:
                childRunId:
                  type: string
                timeoutMs:
                  type: integer
                  format: int64
                  description: Mandatory await timeout in milliseconds.
                awaitIndex:
                  type: integer
                  description: 1-based await ordinal (consumes a normal await slot).
      responses:
        "200":
          description: Await outcome plus the awaited child's state (child absent when suspended).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [suspended, satisfied, timed_out, cancelled]
                  instanceKey:
                    type: string
                  pattern:
                    type: string
                  deadline:
                    type: string
                    format: date-time
                  event:
                    type: object
                    description: Recorded resolving event (present on terminal outcomes).
                    required: [id, occurredAt]
                    properties:
                      id:
                        type: string
                      payload: {}
                      actor:
                        type: string
                      occurredAt:
                        type: string
                        format: date-time
                  child:
                    type: object
                    description: Awaited child outcome; present on non-suspended outcomes (a timed-out await reports the child's current, possibly non-terminal, state).
                    required: [runId, status]
                    properties:
                      runId:
                        type: string
                      status:
                        type: string
                      summary:
                        type: string
                      errorClass:
                        type: string
        "400":
          description: Invalid request (missing timeout, bad await index, malformed child reference).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "401":
          description: Unauthenticated, expired run token, or identity_mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "403":
          description: Caller does not own the parent run or the referenced child.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "404":
          description: Parent DriverRun or child run not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"

  /api/workspaces/{ws}/driver/workflows/start:
    post:
      operationId: startDriverWorkflow
      tags: [driver]
      summary: Start (or idempotently re-read) a child workflow run
      description: >-
        Create — or idempotently re-read — the deterministic child run of the
        verified caller: re-entry re-issuing the same start returns the same
        childRunId, never a duplicate. Provide `idempotencyKey`, or omit it and
        supply the SDK's 1-based per-run `startIndex`. Run-scoped auth enforced
        in-handler.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: X-Loom-Driver-Run-Id
          in: header
          required: false
          description: Parent DriverRun id (legacy header transport; omitted with a run-scoped Bearer token).
          schema:
            type: string
        - name: X-Loom-Driver-Node-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Lease-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Fencing-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflowName]
              properties:
                workflowName:
                  type: string
                  description: Registered workflow (driver) to run.
                input:
                  description: Child's initial payload (raw JSON); empty means {}.
                idempotencyKey:
                  type: string
                  description: Keys the deterministic child identity. When absent, startIndex is required.
                startIndex:
                  type: integer
                  description: SDK 1-based per-run start counter; required when idempotencyKey is absent.
      responses:
        "200":
          description: The created (or replayed) child run.
          content:
            application/json:
              schema:
                type: object
                required: [childRunId, workflowName, status, parentRunId]
                properties:
                  childRunId:
                    type: string
                  workflowName:
                    type: string
                  status:
                    type: string
                  parentRunId:
                    type: string
        "400":
          description: Invalid request (missing workflowName, or neither idempotencyKey nor startIndex).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "401":
          description: Unauthenticated, expired run token, or identity_mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "404":
          description: Parent DriverRun not found or no longer running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "409":
          description: Conflict on deterministic child identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"

  /api/workspaces/{ws}/driver/{op}:
    post:
      operationId: dispatchDriverOp
      tags: [driver]
      summary: Driver-op dispatcher (opaque op path parameter)
      description: >-
        Single-segment driver-op dispatcher (SDK v2 transport). The `{op}` path
        segment selects the operation; the request body is an op-specific
        camelCase JSON object and the 200 response is an op-specific JSON object.
        An empty body is treated as `{}`; bodies are capped at 8 MiB. Run-scoped
        auth is enforced in-handler (run token or legacy X-Loom-Driver-* header
        quad + optional shared static token); most ops additionally prove the
        caller owns a running parent DriverRun. Errors use the driver envelope
        {error:{code,message,retryable,details?}}; an unknown op returns 404
        unknown_op. The op set is defined as the keys of the ops map in
        driverapi.NewModule (internal/webui/handlers/driverapi/module.go). NOTE:
        the two-segment paths events/await, events/awaits, workflows/start,
        workflows/await and watch/epic are registered as their own routes and
        are not dispatched here.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: op
          in: path
          required: true
          description: The driver operation to invoke.
          schema:
            type: string
            enum:
              - claim-ready
              - epic-get
              - epic-snapshot
              - list-agents
              - agent-orchestration-session
              - update-agent-parent
              - deliver-lead-assignment
              - deliver-agent-message
              - exec-task
              - task-run-get
              - active-task-runs
              - recover-stale-tasks
              - complete-task
              - release-task
              - connector-dispatch
              - emit-event
        - name: X-Loom-Driver-Run-Id
          in: header
          required: false
          description: Parent DriverRun id (legacy header transport; omitted with a run-scoped Bearer token).
          schema:
            type: string
        - name: X-Loom-Driver-Node-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Lease-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Loom-Driver-Fencing-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        description: Op-specific camelCase JSON parameters (decoded per op). Empty body is treated as {}.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Op-specific result (each op returns its own JSON object).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request payload or op parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "401":
          description: Unauthenticated, expired run token, or identity_mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "403":
          description: Caller does not own the parent run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "404":
          description: Unknown op, or a referenced resource / parent run not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "409":
          description: Conflict (e.g. already claimed, invalid transition, unschedulable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOpError"

  # ── Task Run API ─────────────────────────────────────────────────────────
  /api/workspaces/{ws}/task-run/artifacts/{artifactId}/content:
    put:
      operationId: uploadTaskRunArtifactContent
      tags: [task-run]
      summary: Upload raw content for a task-run artifact
      description: |
        Uploads the raw bytes of a task-run artifact declared earlier via the
        `artifact-declare` op. The request body is the content itself (which is
        why this cannot ride the JSON `{op}` route), and the request
        `Content-Type` header is stored as the artifact's MIME type. The
        artifact must belong to the caller's verified task run; a foreign or
        unknown artifact is reported as `not_found`. Max body size: 64 MiB.
      security:
        - TaskRunLease: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: artifactId
          in: path
          required: true
          description: Artifact identifier, scoped to the caller's task run
          schema:
            type: string
        - name: X-Loom-Task-Run-Id
          in: header
          required: true
          description: Task-run identity (mirrors LOOM_TASK_RUN_ID)
          schema:
            type: string
        - name: X-Loom-Task-Run-Fencing-Token
          in: header
          required: true
          description: Monotonic lease fencing token; must be a positive integer
          schema:
            type: integer
            format: int64
        - name: X-Loom-Task-Run-Node-Id
          in: header
          required: false
          description: Node identity for the fenced ownership check (mirrors LOOM_TASK_RUN_NODE_ID)
          schema:
            type: string
        - name: X-Loom-Task-Run-Lease-Id
          in: header
          required: false
          description: Lease identity for the fenced ownership check (mirrors LOOM_TASK_RUN_LEASE_ID)
          schema:
            type: string
      requestBody:
        required: true
        description: Raw artifact content. The request Content-Type is stored as the artifact MIME type.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Content uploaded; the updated artifact record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunArtifact"
        "400":
          description: Invalid request (unreadable body or over the size cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"
        "401":
          description: Missing/invalid lease credentials, or the lease is superseded or the run is terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"
        "404":
          description: Artifact does not exist or does not belong to the caller's task run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"

  /api/workspaces/{ws}/task-run/{op}:
    post:
      operationId: taskRunOp
      tags: [task-run]
      summary: Task-run operation dispatcher (opaque op)
      description: |
        Opaque operation dispatcher for the task-runner API — the same transport
        shape as the driver `{op}` route. `{op}` selects one of a fixed set of
        operations; the request and response bodies are op-specific camelCase
        JSON. The op set is defined in
        `internal/webui/handlers/taskrunapi/module.go` (`NewModule`):
        `get`, `task-get`, `heartbeat`, `log-append`, `complete`,
        `runtime-credential`, `artifact-declare`, `artifact-get`,
        `artifact-list`, `artifact-finalize`. An unknown op returns 404 with
        code `unknown_op`. An empty request body is treated as `{}`. Read-only
        and artifact ops first prove lease ownership via a fenced no-op
        heartbeat; mutating ops (`heartbeat`, `log-append`, `complete`) pass the
        lease credentials straight through to fleet-db's fenced task-run
        methods. Errors use the structured envelope
        `{error:{code,message,retryable,details}}`.
      security:
        - TaskRunLease: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: op
          in: path
          required: true
          description: Task-run operation name
          schema:
            type: string
            enum:
              - get
              - task-get
              - heartbeat
              - log-append
              - complete
              - runtime-credential
              - artifact-declare
              - artifact-get
              - artifact-list
              - artifact-finalize
        - name: X-Loom-Task-Run-Id
          in: header
          required: true
          description: Task-run identity (mirrors LOOM_TASK_RUN_ID)
          schema:
            type: string
        - name: X-Loom-Task-Run-Fencing-Token
          in: header
          required: true
          description: Monotonic lease fencing token; must be a positive integer
          schema:
            type: integer
            format: int64
        - name: X-Loom-Task-Run-Node-Id
          in: header
          required: false
          description: Node identity for the fenced ownership check (mirrors LOOM_TASK_RUN_NODE_ID)
          schema:
            type: string
        - name: X-Loom-Task-Run-Lease-Id
          in: header
          required: false
          description: Lease identity for the fenced ownership check (mirrors LOOM_TASK_RUN_LEASE_ID)
          schema:
            type: string
      requestBody:
        required: false
        description: |
          Op-specific camelCase JSON parameters. The shape depends on `{op}`;
          see the op handlers in
          `internal/webui/handlers/taskrunapi/module.go` and `artifacts.go`.
          An empty body is treated as `{}`. Max size: 8 MiB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: |
            Op-specific result. Depending on `{op}` this is a task-run view
            (`get`, `heartbeat`), a `{taskRun, task}` pair (`task-get`), a log
            entry (`log-append`), a `{completion, taskRun}` pair (`complete`),
            an artifact view or `{artifacts:[...]}` (artifact ops), or a
            runtime-credential payload (`runtime-credential`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid op payload (code `invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"
        "401":
          description: Missing/invalid lease credentials, or the lease is superseded, or the run is terminal (code `unauthenticated` or `lease_denied`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"
        "403":
          description: Fenced pass-through op rejected ownership (code `not_owner`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"
        "404":
          description: Unknown op or referenced resource not found (code `unknown_op` or `not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"
        "409":
          description: Op-level conflict or invalid state transition (code `conflict` or `invalid_transition`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunOpError"

  # ── Triggers & Webhooks ──────────────────────────────────────────────────
  /api/workspaces/{ws}/trigger-events:
    get:
      operationId: listTriggerEvents
      tags: [triggers]
      summary: List persisted trigger events (webhook ingest audit trail)
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: source_kind
          in: query
          description: Filter by event source kind (e.g. github)
          schema:
            type: string
        - name: trigger_binding_id
          in: query
          description: Filter by the trigger binding that matched the event
          schema:
            type: string
        - name: limit
          in: query
          description: Max rows to return (1-1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Trigger event list
          content:
            application/json:
              schema:
                type: object
                required: [trigger_events, count]
                properties:
                  trigger_events:
                    type: array
                    items:
                      $ref: "#/components/schemas/TriggerEvent"
                  count:
                    type: integer
        "400":
          description: Invalid limit parameter (bare {error} body, not the standard ErrorResponse envelope)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "500":
          description: List failed (bare {error} body)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /api/workspaces/{ws}/trigger-events/{eventId}:
    get:
      operationId: getTriggerEvent
      tags: [triggers]
      summary: Get a single persisted trigger event
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: eventId
          in: path
          required: true
          description: Trigger event identifier
          schema:
            type: string
      responses:
        "200":
          description: Trigger event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerEvent"
        "404":
          description: Trigger event not found (bare {error} body, not the standard ErrorResponse envelope)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /api/workspaces/{ws}/trigger-deliveries:
    get:
      operationId: listTriggerDeliveries
      tags: [triggers]
      summary: List persisted trigger deliveries (fan-out dispatch audit trail)
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: trigger_event_id
          in: query
          description: Filter by the originating trigger event
          schema:
            type: string
        - name: trigger_binding_id
          in: query
          description: Filter by the trigger binding that produced the delivery
          schema:
            type: string
        - name: status
          in: query
          description: Filter by delivery lifecycle status
          schema:
            type: string
            enum: [accepted, rejected, duplicate, queued, dispatched, failed, replayed, superseded, held]
        - name: limit
          in: query
          description: Max rows to return (1-1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Trigger delivery list
          content:
            application/json:
              schema:
                type: object
                required: [trigger_deliveries, count]
                properties:
                  trigger_deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/TriggerDelivery"
                  count:
                    type: integer
        "400":
          description: Invalid limit parameter (bare {error} body, not the standard ErrorResponse envelope)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "500":
          description: List failed (bare {error} body)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /api/workspaces/{ws}/trigger-deliveries/{deliveryId}:
    get:
      operationId: getTriggerDelivery
      tags: [triggers]
      summary: Get a single persisted trigger delivery
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: deliveryId
          in: path
          required: true
          description: Trigger delivery identifier
          schema:
            type: string
      responses:
        "200":
          description: Trigger delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerDelivery"
        "404":
          description: Trigger delivery not found (bare {error} body, not the standard ErrorResponse envelope)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /api/workspaces/{ws}/webhooks/{name}:
    post:
      operationId: receiveWebhook
      tags: [webhooks]
      summary: Ingest an inbound webhook delivery for the named adapter
      description: |
        Public endpoint (no user-JWT). The request is authenticated inside the
        handler by the named adapter's per-binding signature verification
        (e.g. GitHub `X-Hub-Signature-256`). The adapter normalizes
        adapter-specific HTTP headers (delivery id, event type, subject/actor)
        into routing metadata; the JSON request body is the raw provider
        payload and is not otherwise interpreted. On success the delivery is
        durably dispatched (fan-out) and 202 is returned with one entry per
        matched binding.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: name
          in: path
          required: true
          description: Registered webhook adapter name (e.g. github)
          schema:
            type: string
      requestBody:
        required: true
        description: |
          Raw provider webhook payload. Must be valid JSON (an empty body is
          treated as {}). Not decoded into a fixed schema; the concrete shape
          depends on the adapter and provider event.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Delivery accepted and durably dispatched
          content:
            application/json:
              schema:
                type: object
                required: [status, route_key, idempotency_key, deliveries]
                properties:
                  status:
                    type: string
                    const: accepted
                  route_key:
                    type: string
                  idempotency_key:
                    type: string
                    description: "name:deliveryId, derived from the adapter delivery id"
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/TriggerRouteDelivery"
        "400":
          description: Malformed payload, empty/invalid JSON, or missing adapter delivery id (bare {error} body)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "401":
          description: Signature verification failed (bare {error} body)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "404":
          description: No adapter registered for {name}, or no enabled trigger binding for the resolved route (bare {error} body)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "501":
          description: Trigger dispatch is unavailable for this store (bare {error} body)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

