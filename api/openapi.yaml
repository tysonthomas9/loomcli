        - name: session
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TabPatchRequest"
      responses:
        "200":
          description: Tab updated
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
    delete:
      operationId: deleteTerminalTab
      tags: [terminal-tabs]
      summary: Delete terminal tab metadata
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: session
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tab deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

  /api/workspaces/{ws}/terminal/sessions/by-issue:
    get:
      operationId: listSessionsByIssue
      tags: [terminal-tabs]
      summary: List terminal sessions grouped by issue
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: issue_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sessions by issue
          content:
            application/json:
              schema:
                type: object

  # ── Terminal State ──────────────────────────────────────────────────────
  /api/workspaces/{ws}/terminal/state:
    get:
      operationId: getTerminalState
      tags: [terminal-state]
      summary: Get persisted terminal UI state
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Terminal state
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_tab:
                    type: string
    patch:
      operationId: patchTerminalState
      tags: [terminal-state]
      summary: Update terminal UI state
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active_tab:
                  type: string
      responses:
        "200":
          description: State updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_tab:
                    type: string

  # ── Terminal Setup ──────────────────────────────────────────────────────
  /api/workspaces/{ws}/terminal/setup:
    post:
      operationId: startTerminalSetup
      tags: [terminal-tabs]
      summary: Start a backend-owned setup command in a setup terminal
      description: |
        Opens or reuses the workspace's per-backend setup terminal and runs the
        requested action (install / login / configure / test). For supported
        backends (claude, codex, gemini, opencode, cursor) the resolved command
        is run inside the PTY; for backends flagged as manual (cursor login)
        the terminal shows credential guidance instead.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backend, action]
              properties:
                backend:
                  type: string
                  description: AI backend name (claude, codex, gemini, opencode, cursor)
                action:
                  type: string
                  enum: [install, login, configure, test]
      responses:
        "201":
          description: Setup terminal created or reused
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_name:
                    type: string
                  label:
                    type: string
                  backend:
                    type: string
                  action:
                    type: string
                  command:
                    type: string
                  title:
                    type: string
                  message:
                    type: string
                  manual:
                    type: boolean
                  created:
                    type: boolean
        "400":
          description: Invalid backend or action
        "503":
          description: Terminal manager not available

  # ── Onboarding ──────────────────────────────────────────────────────────
  /api/workspaces/{ws}/onboarding/first-task:
    post:
      operationId: runOnboardingFirstTask
      tags: [onboarding]
      summary: Create the onboarding first task and queue an agent start
      description: |
        Creates an open, unassigned issue and requests the named agent start
        working on it via the lifecycle backend. If the lifecycle request
        fails the just-created issue is deleted in a bounded cleanup so the
        kanban does not accumulate orphans on disconnect.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_name, title]
              properties:
                agent_name:
                  type: string
                title:
                  type: string
                description:
                  type: string
                issue_type:
                  type: string
                  default: task
                priority:
                  type: integer
                source_repo:
                  type: string
      responses:
        "201":
          description: Issue created and agent start queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  issue:
                    type: object
                  agent_name:
                    type: string
                  started:
                    type: boolean
                  queued:
                    type: boolean
        "400":
          description: Validation error (missing agent_name or title)
        "404":
          description: Agent not found
        "503":
          description: Agent lifecycle backend unavailable

  # ── Agent Terminal ──────────────────────────────────────────────────────
  /api/workspaces/{ws}/agents/{name}/terminal/info:
    get:
      operationId: getAgentTerminalInfo
      tags: [agent-terminal]
      summary: Get terminal info for a specific agent
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent terminal info
          content:
            application/json:
              schema:
                type: object

  /api/workspaces/{ws}/agents/{name}/terminal/token:
    get:
      operationId: getAgentTerminalToken
      tags: [agent-terminal]
      summary: Generate one-time WebSocket token for agent terminal
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: One-time token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string

  /api/workspaces/{ws}/agents/{name}/terminal/ws:
    get:
      operationId: connectAgentTerminalWS
      tags: [agent-terminal]
      summary: WebSocket terminal relay for agent
      description: |
        WebSocket endpoint for agent-specific terminal I/O. Uses the same
        binary/text frame protocol as the main terminal WebSocket.
        The frontend's `terminalConnection.ts` handles this directly.

        **Authentication**: One-time token via the `token` query parameter
        only, on the same terms as the main terminal WebSocket. The user JWT
        middleware treats this as a public route and the handler does its own
        check; an `Authorization` header is never read.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)
        "401":
          description: Invalid or expired token

  /api/workspaces/{ws}/agents/{name}/terminal/session:
    post:
      operationId: ensureAgentTerminalSession
      tags: [agent-terminal]
      summary: Ensure a persisted terminal session for an agent
      description: |
        Resolves an agent name to a persisted UUID terminal session and
        returns its tab metadata, creating or rebuilding the tab's launch spec
        when needed. Takes no request body. The response wraps the tab metadata
        in a `{success, data}` envelope; error cases set `success:false` with an
        `error` message.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Ensured agent terminal session
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TabMetadata"
                  error:
                    type: string
        "400":
          description: Invalid agent name or agent has no launch spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Terminal service or agent store not initialized
          content:
            application/json:
              schema:
                type: object
                required: [success, error]
                properties:
                  success:
                    type: boolean
                    const: false
                  error:
                    type: string

  # ── Approvals ───────────────────────────────────────────────────────────
  /api/workspaces/{ws}/approvals:
    post:
      operationId: postWorkspaceApproval
      tags: [approvals]
      summary: Record an approval or rejection decision for a pending await
      description: >-
        Records one approval/rejection by the VERIFIED session user and feeds it
        to the await machinery (journal-first, then dispatch-time matching). The
        actor is always the authenticated session identity, never request data.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectRef]
              properties:
                subjectRef:
                  type: string
                  description: Rendered subject the approval targets, e.g. "acme/widgets#7@shaA".
                eventType:
                  type: string
                  description: Await event type. Defaults to "approval".
                decision:
                  type: string
                  enum: [approved, rejected]
                  description: Approval decision. Defaults to "approved".
                note:
                  type: string
                  description: Optional free-form reviewer note carried on the payload.
      responses:
        "200":
          description: Decision recorded (and any pending awaits resolved)
          content:
            application/json:
              schema:
                type: object
                required: [status, eventId, actor, subjectKey, pendingMatched]
                properties:
                  status:
                    type: string
                    description: The recorded decision (approved | rejected).
                  eventId:
                    type: string
                  actor:
                    type: string
                    description: Verified approver ref (session email, or user id when absent).
                  subjectKey:
                    type: string
                    description: The rendered await key (eventType:subjectRef).
                  pendingMatched:
                    type: integer
                    description: >-
                      Count of pending awaits on the key at decision time (zero means
                      the event was journaled for a future registration).
                  resolutions:
                    type: array
                    items:
                      type: object
                      required: [instanceKey, runId, outcome]
                      properties:
                        instanceKey:
                          type: string
                        runId:
                          type: string
                        outcome:
                          type: string
        "400":
          description: Invalid body, or subjectRef/eventType do not render a subject-scoped key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"
        "401":
          description: Missing verified session identity (fail closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"
        "403":
          description: Session actor is not an eligible approver for the subject key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"
        "501":
          description: Await store unavailable for this backend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"

  # ── Agent Control───────────────────────────────────────────────────────
  /api/workspaces/{ws}/interactive-prompts:
    get:
      operationId: listInteractivePrompts
      tags: [agent-control]
      summary: List built-in interactive terminal prompt options
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Built-in interactive prompts
          content:
            application/json:
              schema:
                type: object
                required: [prompts]
                properties:
                  prompts:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id:
                          type: string
                        label:
                          type: string

  /api/workspaces/{ws}/agents:
    get:
      operationId: listAgents
      tags: [agent-control]
      summary: List agents via daemon control socket
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentControlEntry"
        "503":
          description: Daemon unavailable
    post:
      operationId: createAgent
      tags: [agent-control]
      summary: Create an agent assignment
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role_name]
              properties:
                workspace_key:
                  type: string
                name:
                  type: string
                role_name:
                  type: string
                kind:
                  type: string
                  description: Optional role kind for creating an interactive role.
                prompt:
                  type: string
                  description: Literal inline prompt text for interactive roles.
                prompt_file:
                  type: string
                  description: Custom or builtin prompt selector for interactive roles.
                auto:
                  type: boolean
                backend:
                  type: string
                fallback_backends:
                  type: array
                  items:
                    type: string
                repos:
                  type: array
                  items:
                    type: string
                repo_groups:
                  type: array
                  items:
                    type: string
                cross_repo:
                  type: boolean
                parent:
                  type: string
                desired_state:
                  type: string
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAgentInfo"
        "400":
          description: Invalid agent create request
        "409":
          description: Agent already exists
        "503":
          description: Agent service unavailable

  /api/workspaces/{ws}/agents/{name}:
    patch:
      operationId: updateAgent
      tags: [agent-control]
      summary: Partial-update an agent assignment
      description: |
        Applies a partial update to an existing agent. Every field is
        optional; only present fields are changed. `state` accepts
        `idle`|`active`|`stopped` and `desired_state` accepts
        `stopped`|`idle`|`running`|`draining` (an empty/omitted value leaves
        the field unchanged). Broadcasts an `agent.refresh` mutation on success.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields optional; only present fields are updated.
              properties:
                role_name:
                  type: string
                auto:
                  type: boolean
                backend:
                  type: string
                fallback_backends:
                  type: array
                  items:
                    type: string
                repos:
                  type: array
                  items:
                    type: string
                repo_groups:
                  type: array
                  items:
                    type: string
                cross_repo:
                  type: boolean
                parent:
                  type: string
                state:
                  type: string
                  enum: [idle, active, stopped]
                desired_state:
                  type: string
                  enum: [stopped, idle, running, draining]
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Invalid update (bad state, desired_state, or body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAgent
      tags: [agent-control]
      summary: Delete an agent assignment
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/agents/{name}/queue:
    get:
      operationId: getAgentQueue
      tags: [agent-control]
      summary: Ranked task queue for a single agent (daemon-backed)
      description: |
        Returns the daemon's ranked candidate task queue for one agent.
        Served by the daemon-control-socket module; in fleet-db store mode the
        same path is instead served by a stub that returns 501 Not Implemented
        ("agent-specific queue is not available in fleet-db store mode; use
        monitor task queues").
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Ranked agent task queue
          content:
            application/json:
              schema:
                type: object
                required: [success, data, total]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentQueueEntry"
                  total:
                    type: integer
        "404":
          description: Agent not found in daemon config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Not available in fleet-db store mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Daemon unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/workspaces/{ws}/agents/{name}/stop:
    post:
      operationId: stopAgent
      tags: [agent-control]
      summary: Stop an agent (yield by default, force with body)
      description: |
        Without `force` (or empty body): sends `agent_yield` to the daemon,
        returns 202 Accepted. With `{"force": true}`: sends `agent_stop(force=true)`,
        returns 200.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Agent force-stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "202":
          description: Yield signal sent (graceful stop in progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "503":
          description: Daemon unavailable

  /api/workspaces/{ws}/agents/{name}/start:
    post:
      operationId: startAgent
      tags: [agent-control]
      summary: Start an agent
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "503":
          description: Daemon unavailable

  /api/workspaces/{ws}/agents/{name}/restart:
    post:
      operationId: restartAgent
      tags: [agent-control]
      summary: Restart an agent
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "503":
          description: Daemon unavailable

  /api/workspaces/{ws}/agents/{name}/yield:
    post:
      operationId: yieldAgent
      tags: [agent-control]
      summary: Yield an agent (graceful stop at next safe point)
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "202":
          description: Yield signal sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "503":
          description: Daemon unavailable

