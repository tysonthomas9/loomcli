          required: [daytona, github]
          properties:
            daytona:
              $ref: "#/components/schemas/SanitizedRuntimeCredential"
            github:
              $ref: "#/components/schemas/SanitizedRuntimeCredential"

    SanitizedRuntimeCredential:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        updated_at:
          type: string

    LocalSettingsPatchRequest:
      type: object
      description: All top-level fields are optional partial patches (nil = leave unchanged).
      properties:
        fleetdb_redis:
          type: object
          properties:
            enabled:
              type: boolean
            redis_url:
              type: string
            addr:
              type: string
            password:
              type: string
            clear_password:
              type: boolean
            db:
              type: integer
            tls:
              type: boolean
        agent_runtime:
          type: object
          properties:
            default:
              type: string
        local_task_runner:
          type: object
          properties:
            opencode_model:
              type: string
        runtime_credentials:
          type: object
          properties:
            daytona:
              $ref: "#/components/schemas/RuntimeCredentialPatch"
            github:
              $ref: "#/components/schemas/RuntimeCredentialPatch"

    RuntimeCredentialPatch:
      type: object
      properties:
        api_key:
          type: string
        token:
          type: string
        clear:
          type: boolean
