                    type: string

  /api/workspaces/{ws}/terminal/ws:
    get:
      operationId: connectTerminalWS
      tags: [terminal]
      summary: WebSocket terminal relay
      description: |
        WebSocket endpoint for terminal I/O relay. Not a standard REST
        operation. Uses binary frames for terminal data and text frames
        for control messages. The frontend's `terminalConnection.ts`
        consumes this directly.

        **Authentication**: One-time token via the `token` query parameter
        only, generated by `GET /api/workspaces/{ws}/terminal/token`. The user
        JWT middleware treats this as a public route and the handler does its
        own check; an `Authorization` header is never read.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: session
          in: query
          description: Terminal session name
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)
        "401":
          description: Invalid or expired token

