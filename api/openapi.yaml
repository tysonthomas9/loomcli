  # ── Driver Runs ─────────────────────────────────────────────────────────
  /api/workspaces/{ws}/runs/{runId}:
    get:
      operationId: getDriverRun
      tags: [runs]
      summary: Fetch one driver (workflow) run
      description: |
        Returns the persisted `DriverRun` record for a run created by
        `POST /api/workspaces/{ws}/workflows/{name}` or by trigger dispatch.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "500":
          description: Run lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  /api/workspaces/{ws}/runs/{runId}/events:
    get:
      operationId: getDriverRunEvents
      tags: [runs]
      summary: Page through a run's platform events
      description: |
        Cursor-paginated read of the run's event log. Pass the previous page's
        `cursor` back as `after` to fetch the next page; an empty `events`
        array with an unchanged cursor means the run has produced nothing new.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
        - name: after
          in: query
          description: Opaque cursor from a previous page. Omit to start at the beginning.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size. Must be 1-1000; defaults to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: One page of run events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformEventsPage"
        "400":
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "501":
          description: The configured store does not implement run event reads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  /api/workspaces/{ws}/runs/{runId}/stream:
    get:
      operationId: streamDriverRunEvents
      tags: [runs]
      summary: SSE stream of a run's platform events
      description: |
        Server-Sent Events endpoint. The handler polls the run's event log once
        a second and emits every newly appended event; it never terminates on
        its own, so clients close the connection when the run reaches a
        terminal status. The response is committed (flushed) before the first
        poll, so the stream reads as open even when the first page is empty.

        **Event names**

        - `event` — `data:` is one JSON `PlatformEvent`:
          ```json
          {
            "id": "evt-4",
            "timestamp": "2026-09-05T12:00:00Z",
            "actor": "driver",
            "action": "run.started",
            "entity_type": "driver_run",
            "entity_id": "run-abc",
            "workspace_id": "default"
          }
          ```
        - `error` — `data:` is `{"error": "<message>"}`, emitted when a poll
          fails; the stream ends after it.

        No SSE `id:` field is written, so `Last-Event-ID` resumption does not
        apply — resume with the `after` query parameter instead.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
        - name: after
          in: query
          description: |
            Opaque cursor to resume from. Defaults to `"0"`, i.e. the start of
            the run's event log.
          schema:
            type: string
            default: "0"
      responses:
        "200":
          description: SSE stream of run events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Newline-delimited SSE frames; `event: event` frames carry a
                  JSON PlatformEvent, `event: error` frames carry {"error"}.
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "500":
          description: The response writer does not support streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "501":
          description: The configured store does not implement run event reads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  # ── Trigger Audit Trail ─────────────────────────────────────────────────
  /api/workspaces/{ws}/trigger-events:
    get:
      operationId: listTriggerEvents
      tags: [triggers]
      summary: List ingested trigger events
      description: |
        Read-only listing of the durable `TriggerEvent` records written at
        ingest — one per admitted external delivery, persisted before any
        dispatch happens.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: source_kind
          in: query
          description: Filter by ingest source, e.g. `github`.
          schema:
            type: string
        - name: trigger_binding_id
          in: query
          description: Filter by the binding that matched the event.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum records to return. Must be 1-1000 when supplied.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Matching trigger events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerEventsResponse"
        "400":
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "500":
          description: Listing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  /api/workspaces/{ws}/trigger-events/{eventId}:
    get:
      operationId: getTriggerEvent
      tags: [triggers]
      summary: Fetch one trigger event
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: eventId
          in: path
          required: true
          description: Trigger event identifier
          schema:
            type: string
      responses:
        "200":
          description: The trigger event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerEvent"
        "400":
          description: Malformed event identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "404":
          description: Trigger event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "500":
          description: Lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  /api/workspaces/{ws}/trigger-deliveries:
    get:
      operationId: listTriggerDeliveries
      tags: [triggers]
      summary: List trigger deliveries
      description: |
        Read-only listing of `TriggerDelivery` records — one per fan-out leg of
        a dispatched trigger event, linking the event to the binding that
        matched it and the driver run it enqueued.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: trigger_event_id
          in: query
          description: Filter to the legs of one trigger event.
          schema:
            type: string
        - name: trigger_binding_id
          in: query
          description: Filter by the matched binding.
          schema:
            type: string
        - name: status
          in: query
          description: Filter by delivery status.
          schema:
            $ref: "#/components/schemas/TriggerDeliveryStatus"
        - name: limit
          in: query
          description: Maximum records to return. Must be 1-1000 when supplied.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Matching trigger deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerDeliveriesResponse"
        "400":
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "500":
          description: Listing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  /api/workspaces/{ws}/trigger-deliveries/{deliveryId}:
    get:
      operationId: getTriggerDelivery
      tags: [triggers]
      summary: Fetch one trigger delivery
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: deliveryId
          in: path
          required: true
          description: Trigger delivery identifier
          schema:
            type: string
      responses:
        "200":
          description: The trigger delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerDelivery"
        "400":
          description: Malformed delivery identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "404":
          description: Trigger delivery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "500":
          description: Lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  # ── Workflows ───────────────────────────────────────────────────────────
  /api/workspaces/{ws}/workflows/{name}/versions:
    post:
      operationId: createWorkflowVersion
      tags: [workflows]
      summary: Build and register a new workflow version
      description: |
        Bundles the supplied TypeScript sources, registers them as a new
        version of the workflow's driver, and (by default) activates that
        version. Registration is content-addressed: re-posting identical
        sources reuses the existing version instead of creating a new one,
        which is reported back as `reused_version`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkflowName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowVersionRequest"
      responses:
        "201":
          description: Version registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersionResult"
        "400":
          description: |
            Invalid body, empty `files`, an entrypoint outside the workflow's
            own directory, a missing entrypoint file, or a build failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  /api/workspaces/{ws}/workflows/{name}:
    post:
      operationId: createWorkflowRun
      tags: [workflows]
      summary: Start a workflow run
      description: |
        Enqueues a run of the workflow's active driver version. The whole
        request body is passed through to the run as its payload; an empty
        body becomes `{}`. Builtin workflows are registered on demand, so a
        first run of one does not need a prior version upload.

        Before the run is created the resolved runner backend is checked
        (installed and authenticated), so a misconfigured runner fails here
        rather than deep inside the worker.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkflowName"
        - name: Idempotency-Key
          in: header
          description: |
            Repeat key. A second request carrying the same key returns the
            already-admitted run instead of creating a second one.
          schema:
            type: string
      requestBody:
        required: false
        description: |
          Arbitrary JSON payload handed to the workflow. `epic_id`, when
          present, is lifted onto the run.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Run accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "400":
          description: Payload is not valid JSON, or the runner preflight failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "500":
          description: Run creation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  # ── Inbound Webhooks ────────────────────────────────────────────────────
  /api/workspaces/{ws}/webhooks/{name}:
    post:
      operationId: receiveWebhook
      tags: [webhooks]
      summary: Ingest an inbound provider webhook
      description: |
        Provider-facing ingest endpoint. `{name}` selects the adapter;
        `github` is the only one registered today.

        The handler normalizes headers and body into a route key, resolves the
        enabled binding for it, verifies the signature, then dispatches
        durably: one `TriggerEvent` plus one queued `DriverRun` and
        `TriggerDelivery` per matched binding. It never executes work inline.

        Dispatch is idempotent on `{adapter}:{delivery-id}`, so provider
        redelivery heals each fan-out leg independently rather than
        duplicating runs.

        **Wire note**: the 202 body carries `deliveries[]` only. There is no
        top-level `driver_run_id` or `driver_run` — fetch the run by
        `deliveries[i].driver_run_id`.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: name
          in: path
          required: true
          description: Adapter name. `github` is the only registered adapter.
          schema:
            type: string
            enum: [github]
        - name: X-GitHub-Event
          in: header
          required: true
          description: GitHub event name; part of the derived route key.
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: |
            GitHub delivery id. Used as the idempotency anchor, so an empty
            one is rejected rather than collapsing every delivery onto one key.
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: |
            `sha256=<hex>` HMAC over the raw body, verified against the
            source connector's inbound secret (the previous secret is accepted
            inside the rotation window).
          schema:
            type: string
      requestBody:
        required: true
        description: The raw provider payload. Must be valid JSON; an empty body becomes `{}`.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Delivery accepted and dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDispatchResult"
        "400":
          description: |
            Unreadable body, a missing required header, an empty delivery id,
            or a payload that is not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "401":
          description: Signature missing, malformed, or not matching
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "404":
          description: |
            No adapter registered for `{name}`, or no enabled trigger binding
            for the derived route key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "409":
          description: Conflicting dispatch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "500":
          description: Dispatch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "501":
          description: The configured store does not implement trigger dispatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  # ── Terminal Lifecycle Config ───────────────────────────────────────────
  /api/config/terminal:
    get:
      operationId: getTerminalConfig
      tags: [config]
      summary: Terminal lifecycle limits
      description: |
        Serves the server's terminal lifecycle snapshot. The frontend uses it
        to bound auto-reconnect: the client's retry ceiling must stay at or
        under `grace_period_ms`, or it gives up while the server still holds
        the shell open. A zero millisecond value means that limit is disabled.
      responses:
        "200":
          description: Lifecycle config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalLifecycleConfigResponse"

  # ── Daemon ──────────────────────────────────────────────────────────────
  /api/daemon/supervisor:
    get:
      operationId: getDaemonSupervisor
      tags: [daemon]
      summary: Supervisor state and supervised agents
      description: |
        Reads the daemon's state file. Registered only when the server was
        built with a supervisor reader; otherwise the path 404s as an unknown
        API route.
      responses:
        "200":
          description: Supervisor snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonSupervisorResponse"
        "500":
          description: The state file exists but could not be read or parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Daemon is not running (no state file)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/daemon/config:
    get:
      operationId: getDaemonConfig
      tags: [daemon]
      summary: Effective resolved daemon config
      description: |
        Returns the daemon's effective configuration verbatim, embedded under
        `data` as raw JSON. The shape follows the daemon's config file rather
        than a fixed API schema, so it is deliberately unconstrained here.
        Registered only when the server was built with a config loader.
      responses:
        "200":
          description: Effective config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonConfigResponse"
        "503":
          description: Config could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Desktop-Local Settings ──────────────────────────────────────────────
  /api/local/settings:
    get:
      operationId: getLocalSettings
      tags: [local-settings]
      summary: Read desktop-local runtime settings
      description: |
        Returns the sanitized desktop-local settings: secrets are never echoed,
        only whether each one is set. Registered only when the server has a
        local settings directory configured.
      responses:
        "200":
          description: Sanitized settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalSettingsResponse"
        "500":
          description: Settings directory unconfigured or unreadable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchLocalSettings
      tags: [local-settings]
      summary: Update desktop-local runtime settings
      description: |
        Partial update: only the sections present in the body are touched, and
        within a section only the fields present. Credential values are sealed
        before they are written and are never returned — the response is the
        same sanitized view as the GET.

        Redis changes take effect on the next restart, because embedded
        fleet-db reads them at startup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalSettingsPatchRequest"
      responses:
        "200":
          description: Saved; body carries the sanitized settings and a message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalSettingsResponse"
        "400":
          description: Malformed body, or a rejected value (bad Redis URL, unknown agent runtime)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Settings directory unconfigured or unreadable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key authentication. The key is a 64-character hex string generated
        from 32 random bytes. Configured via `LOOM_AUTH_API_KEY` env var or
        loaded from `~/.loom/api-key`. Supports fallback to `?token=` query
        parameter for WebSocket/EventSource connections.

    WorkerToken:
      type: http
      scheme: bearer
      description: |
        Static token for internal worker API endpoints. Configured via
        `LOOM_WORKER_TOKEN` env var. If not set, worker API returns 503.

    FleetApiKey:
      type: apiKey
      in: header
      name: X-Fleet-API-Key
      description: |
        API key for fleet registration. Configured via `LOOM_FLEET_API_KEY`
        env var. Constant-time comparison with optional per-IP rate limiting.

    FleetJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token for fleet claim/heartbeat endpoints. HMAC-SHA256 signed.
        Configured via `LOOM_FLEET_JWT_KEY` env var. Token expiry: 1 hour.

  parameters:
    WorkspaceId:
      name: ws
      in: path
      required: true
      description: Workspace identifier
      schema:
        type: string

    IssueId:
      name: id
      in: path
      required: true
      description: Issue identifier
      schema:
        type: string

    AgentName:
      name: name
      in: path
      required: true
      description: Agent worktree name
      schema:
        type: string

    RunId:
      name: runId
      in: path
      required: true
      description: Driver run identifier
      schema:
        type: string

    WorkflowName:
      name: name
      in: path
      required: true
      description: Workflow name
      schema:
        type: string

  schemas:
    # ── Response Envelopes ──────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        code:
          type: string
        retryable:
          type: boolean
        details:
          type: object

    SimpleErrorResponse:
      type: object
      description: The bare error wire written by handler.RespondError.
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string

    FileMutationResponse:
      type: object
      required: [success, version]
      properties:
        success:
          type: boolean
        version:
          type: string

    FileStatResponse:
      type: object
      required: [path, is_dir, size, mod_time, version]
      properties:
        path:
          type: string
        is_dir:
          type: boolean
        size:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time
        version:
          type: string

    FileTreeEntry:
      type: object
      required: [name, is_dir, size, mod_time]
      properties:
        name:
          type: string
        is_dir:
          type: boolean
        size:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time

    FileCapabilitiesResponse:
      type: object
      required: [read, write, sensitive]
      properties:
        read:
          type: boolean
        write:
          type: boolean
        sensitive:
          type: boolean

    FileTreeResponse:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileTreeEntry"

    FileReadResponse:
      type: object
      required: [path, size, binary, truncated, version]
      properties:
        path:
          type: string
        content:
          type: string
        size:
          type: integer
          format: int64
        binary:
          type: boolean
        truncated:
          type: boolean
        version:
          type: string

    FileIndexResponse:
      type: object
      required: [paths, truncated, partial_reasons]
      properties:
        paths:
          type: array
          items:
            type: string
        truncated:
          type: boolean
        partial_reasons:
          type: array
          items:
            $ref: "#/components/schemas/FilePartialReason"

    FilePartialReason:
      type: string
      enum: [file_count, result_count, byte_limit, file_size, deadline, canceled]

    FileSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        repo:
          type: string
          description: Optional repo qualifier, valid only when scope=agent.
        regex:
          type: boolean
          default: false
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          nullable: true
          items:
            type: string
        caseSensitive:
          type: boolean
          default: false

    FileSearchMatch:
      type: object
      required: [line, col, preview]
      properties:
        line:
          type: integer
        col:
          type: integer
        preview:
          type: string

    FileSearchFileResult:
      type: object
      required: [path, matches]
      properties:
        path:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/FileSearchMatch"

    FileSearchResponse:
      type: object
      required: [results, limitHit, partial_reasons]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/FileSearchFileResult"
        limitHit:
          type: boolean
        partial_reasons:
          type: array
          items:
            $ref: "#/components/schemas/FilePartialReason"

    FileGitStatusResponse:
      type: object
      required: [status, partial, limit_hit, errors]
      properties:
        status:
          type: object
          additionalProperties:
            type: string
            minLength: 2
            maxLength: 2
        partial:
          type: boolean
        limit_hit:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FileCheckoutError"

    FileCheckoutError:
      type: object
      required: [kind, repo, error]
      properties:
        kind:
          type: string
          enum: [agent, repo]
        agent:
          type: string
        repo:
          type: string
        error:
          type: string

    FileCheckout:
      type: object
      required: [kind, repo, exists, change_count]
      properties:
        kind:
          type: string
          enum: [agent, repo]
        agent:
          type: string
        repo:
          type: string
        exists:
          type: boolean
        branch:
          type: string
        change_count:
          type: integer
        status_error:
          type: boolean
        error:
          type: string
        partial:
          type: boolean
        limit_hit:
          type: boolean

    FileCheckoutsResponse:
      type: object
      required: [checkouts, partial, limit_hit, errors]
      properties:
        checkouts:
          type: array
          items:
            $ref: "#/components/schemas/FileCheckout"
        partial:
          type: boolean
        limit_hit:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FileCheckoutError"

    FileCheckoutRepairRequest:
      type: object
      required: [scope, target]
      properties:
        scope:
          type: string
          enum: [agent, repo]
        target:
          type: string
        repo:
          type: string
          description: Repo qualifier, valid when scope=agent.
        force:
          type: boolean

    FileCheckoutRepairResponse:
      type: object
      required: [repaired, method, message]
      properties:
        repaired:
          type: boolean
        method:
          type: string
          enum: [repair, recreate, provision, none]
        requires_force:
          type: boolean
        backup_path:
          type: string
        message:
          type: string

    FileDiffResponse:
      type: object
      required: [path, patch, partial, limit_hit]
      properties:
        path:
          type: string
        patch:
          type: string
        partial:
          type: boolean
        limit_hit:
          type: boolean

    FileBlameLine:
      type: object
      required: [line, lines, sha, author, time, summary]
      properties:
        line:
          type: integer
        lines:
          type: integer
