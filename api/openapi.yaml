                      $ref: "#/components/schemas/TreeNode"

  # ── SSE Events ──────────────────────────────────────────────────────────
  /api/workspaces/{ws}/events:
    get:
      operationId: subscribeEvents
      tags: [events]
      summary: SSE mutation event stream
      description: |
        Server-Sent Events endpoint that streams real-time mutations.
        Not expressible as a standard REST operation in OpenAPI.
        The frontend's `useSSE` hook consumes this stream directly.

        **Event format**: Each SSE `data:` line contains a JSON `MutationPayload`:
        ```json
        {
          "type": "update",
          "entity_type": "issue",
          "entity_id": "proj-abc.5",
          "action": "issue.update",
          "issue_id": "proj-abc.5",
          "title": "Fix login bug",
          "assignee": "agent-1",
          "actor": "agent-1",
          "timestamp": "2026-04-06T12:00:00Z",
          "old_status": "open",
          "new_status": "in_progress",
          "parent_id": "proj-abc",
          "step_count": 3,
          "priority": 1,
          "source_repo": "my-repo",
          "workspace_id": "default"
        }
        ```

        **Mutation types**: `create`, `update`, `delete`, `comment`, `status`,
        `bonded`, `squashed`, `burned`, `refresh`, `terminal_metadata`,
        `terminal_session_change`, `issue_tabs`, `session_change`

        **Authentication**: One-time token via the `token` query parameter
        only. The user JWT middleware treats this as a public route and the
        handler does its own check, which never reads an `Authorization`
        header. In external auth mode, obtain the one-time SSE token from
        `GET /api/workspaces/{ws}/events/token`; anything else — including a
        valid SSE token sent as a Bearer header — returns `401`. In open auth
        mode no credential is required.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: token
          in: query
          description: One-time SSE auth token (for EventSource clients)
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events with JSON MutationPayload data

  /api/workspaces/{ws}/events/token:
    get:
      operationId: getSSEToken
      tags: [events]
      summary: Get one-time SSE auth token status
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: One-time token in external auth mode, or disabled marker in open mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: One-time SSE auth token
                  disabled:
                    type: boolean
                    description: True when SSE token exchange is disabled in open mode

