  /api/workspaces/{ws}/files:
    get:
      operationId: readScopedFile
      tags: [files]
      summary: Read a file from a scoped file browser root
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [workspace, repo, agent]
            default: workspace
        - name: target
          in: query
          required: false
          schema:
            type: string
        - name: repo
          in: query
          required: false
          description: Optional repo qualifier, valid only when scope=agent.
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: rev
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: File content
          headers:
            ETag:
              description: Strong SHA-256 version for the current file (not revision reads).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReadResponse"
    put:
      operationId: writeScopedFile
      tags: [files]
      summary: Create or update a file in a scoped file browser root
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [workspace, repo, agent]
            default: workspace
        - name: target
          in: query
          required: false
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: Optional strong version for replace/restore callers. Ordinary editor saves omit it and remain last-write-wins.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: Use * for create-only writes.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileWriteRequest"
      responses:
        "200":
          description: File written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
        "412":
          description: A supplied file precondition no longer matches
    delete:
      operationId: deleteScopedFile
      tags: [files]
      summary: Delete a file or directory in a scoped file browser root
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [workspace, repo, agent]
            default: workspace
        - name: target
          in: query
          required: false
          schema:
            type: string
        - name: repo
          in: query
          required: false
          description: Optional repo qualifier, valid only when scope=agent.
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
        - name: If-Match
          in: header
          required: true
          description: Strong current source version from file stat/read.
          schema:
            type: string
      responses:
        "200":
          description: File or directory deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "412":
          description: Source version no longer matches
        "428":
          description: Source version is required

