          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TabMetadata"
        "404":
          description: Tab not found
    put:
      operationId: putTerminalTab
      tags: [terminal-tabs]
      summary: Create or replace terminal tab metadata
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
