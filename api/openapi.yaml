  # ── Terminal ────────────────────────────────────────────────────────────
  /api/workspaces/{ws}/terminal/token:
    get:
      operationId: getTerminalToken
      tags: [terminal]
      summary: Generate one-time WebSocket auth token
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: One-time token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string

  /api/workspaces/{ws}/terminal/ws:
    get:
      operationId: connectTerminalWS
      tags: [terminal]
      summary: WebSocket terminal relay
      description: |
        WebSocket endpoint for terminal I/O relay. Not a standard REST
        operation. Uses binary frames for terminal data and text frames
        for control messages. The frontend's `terminalConnection.ts`
        consumes this directly.

        **Authentication**: One-time token via `token` query parameter,
        generated by `GET /api/workspaces/{ws}/terminal/token`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: session
          in: query
          description: Terminal session name
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)
        "401":
          description: Invalid or expired token

