            application/json:
              schema:
                type: object

  # ── Pull Requests ───────────────────────────────────────────────────────
  /api/workspaces/{ws}/pull-requests:
    get:
      operationId: listWorkspacePullRequests
      tags: [pull-requests]
      summary: List pull requests across the workspace's repos (gh-backed fallback)
      description: |
        Aggregates pull requests across every repo in the workspace via the
        gh CLI. Registered only in serve modes without a store; store-backed
        serve exposes the richer connector-primary listing at the same path.
        Per-repo failures (non-GitHub remote, auth) are reported in warnings
        without failing the whole listing.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: state
          in: query
          description: Filter by PR state; defaults to all when omitted.
          schema:
            type: string
            enum: [all, open, merged, review]
            default: all
      responses:
