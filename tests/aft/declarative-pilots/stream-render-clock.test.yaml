# Staged authoring draft. Original campaign is unchanged.
# skip guards unresolved preservation gaps; it is never validation evidence.
suite: declarative-pilot-stream-render-clock
profile: declarative
baseUrl: ${AFT_BASE_URL}
timeoutMs: 30000
setup:
  - bind:
      as: run
      value:
        literal: ${RUN_ID}
  - bind:
      as: loomRevision
      value:
        literal:
          repository: loomcli
          commit: ${AFT_LOOM_COMMIT}
          tree: ${AFT_LOOM_TREE}
          sourceManifestSha256: ${AFT_LOOM_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_LOOM_BUILD_MANIFEST_SHA256}
  - bind:
      as: fleetRevision
      value:
        literal:
          repository: fleet-db
          commit: ${AFT_FLEET_COMMIT}
          tree: ${AFT_FLEET_TREE}
          sourceManifestSha256: ${AFT_FLEET_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_FLEET_BUILD_MANIFEST_SHA256}
  - bind:
      as: selectionDigest
      value:
        literal: ${AFT_SELECTION_SHA256}
  - capability:
      request:
        id: loom.fixture.acquire
        version: 1
        input:
          runId:
            ref:
              binding: run
          profile:
            literal: agents-real-opencode
          loomRevision:
            ref:
              binding: loomRevision
          fleetRevision:
            ref:
              binding: fleetRevision
          model:
            literal: ${AFT_REAL_MODEL}
          maxCases:
            literal: 1
          selectionSha256:
            ref:
              binding: selectionDigest
      as: fixture
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /workspaceId
            - literal: ${AFT_WS}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /filesOrigin
            - literal: ${AFT_BASE_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /apiOrigin
            - literal: ${AFT_API_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /repo
            - literal: ${AFT_AGENT_FLOW_REPO}
exports:
  lease:
    resource:
      binding: fixture
      pointer: /lease/id
  ownedRun:
    data:
      binding: run
  apiOrigin:
    data:
      binding: fixture
      pointer: /apiOrigin
  filesOrigin:
    data:
      binding: fixture
      pointer: /filesOrigin
  repo:
    data:
      binding: fixture
      pointer: /repo
teardown:
  - capability:
      request:
        id: loom.fixture.release
        version: 1
        input:
          leaseId:
            ref:
              binding: fixture
              pointer: /lease/id
      as: released
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /released
            - literal: true
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /remainingOwnedResources
            - literal: []
tests:
  - name: real repo reply renders markdown tools motion and copy after reload
    intent: Person creates Lead/selects model and sends grounded prompt; engine passively observes actual browser stream and frames before navigation/Send. Authoring draft; unresolved preservation obligations are recorded in preservation.json.
    skip: true
    steps:
      - open: /ws/${AFT_WS}/agents
        intent: Open the owned workspace's Agents page
      - screenshot: stream-render-clock-s01
        intent: Open the owned workspace's Agents page
      - expect:
          count:
            role: button
            name: + Add agent
            exact: true
            equals: 1
        intent: Wait for New Agent
      - screenshot: stream-render-clock-s02
        intent: Wait for New Agent
      - screenshot: stream-render-clock-s03
        intent: Passively observe the future owned Chat EventSource before UI navigation, without sending an event
      - click:
          role: button
          name: + Add agent
          exact: true
        intent: Open the New Agent form
      - screenshot: stream-render-clock-s04
        intent: Open the New Agent form
      - click:
          testid: create-agent-template-lead
        intent: Choose the Lead template
      - screenshot: stream-render-clock-s05
        intent: Choose the Lead template
      - fill:
          testid: create-agent-name
          value: aft-${RUN_ID}-cov-visual-render
        intent: Name this run's rendering Lead
      - screenshot: stream-render-clock-s06
        intent: Name this run's rendering Lead
      - select:
          testid: create-agent-backend
          value: ${AFT_REAL_BACKEND}
        intent: Select the real OpenCode backend
      - screenshot: stream-render-clock-s07
        intent: Select the real OpenCode backend
      - await:
          observation:
