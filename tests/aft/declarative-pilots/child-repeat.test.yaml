# Staged authoring draft. Original campaign is unchanged.
# skip guards unresolved preservation gaps; it is never validation evidence.
suite: declarative-pilot-child-repeat
profile: declarative
baseUrl: ${AFT_BASE_URL}
timeoutMs: 30000
setup:
  - bind:
      as: run
      value:
        literal: ${RUN_ID}
  - bind:
      as: loomRevision
      value:
        literal:
          repository: loomcli
          commit: ${AFT_LOOM_COMMIT}
          tree: ${AFT_LOOM_TREE}
          sourceManifestSha256: ${AFT_LOOM_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_LOOM_BUILD_MANIFEST_SHA256}
  - bind:
      as: fleetRevision
      value:
        literal:
          repository: fleet-db
          commit: ${AFT_FLEET_COMMIT}
          tree: ${AFT_FLEET_TREE}
          sourceManifestSha256: ${AFT_FLEET_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_FLEET_BUILD_MANIFEST_SHA256}
  - bind:
      as: selectionDigest
      value:
        literal: ${AFT_SELECTION_SHA256}
  - capability:
      request:
        id: loom.fixture.acquire
        version: 1
        input:
          runId:
            ref:
              binding: run
          profile:
            literal: agents-real-opencode
          loomRevision:
            ref:
              binding: loomRevision
          fleetRevision:
            ref:
              binding: fleetRevision
          model:
            literal: ${AFT_REAL_MODEL}
          maxCases:
            literal: 1
          selectionSha256:
            ref:
              binding: selectionDigest
      as: fixture
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /workspaceId
            - literal: ${AFT_WS}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /filesOrigin
            - literal: ${AFT_BASE_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /apiOrigin
            - literal: ${AFT_API_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /repo
            - literal: ${AFT_AGENT_FLOW_REPO}
exports:
  lease:
    resource:
      binding: fixture
      pointer: /lease/id
  ownedRun:
    data:
      binding: run
  apiOrigin:
    data:
      binding: fixture
      pointer: /apiOrigin
  filesOrigin:
    data:
      binding: fixture
      pointer: /filesOrigin
  repo:
    data:
      binding: fixture
      pointer: /repo
teardown:
  - capability:
      request:
        id: loom.fixture.release
        version: 1
        input:
          leaseId:
            ref:
              binding: fixture
              pointer: /lease/id
      as: released
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /released
            - literal: true
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /remainingOwnedResources
            - literal: []
tests:
  - name: repeated child attempts keep two keyed results and one final Lead summary
    intent: Person sends Lead request; real Lead agent_create/agent_send tools create/reuse task child; UI actions open tray/cards/sidebar. Adapter cannot create children on its behalf. Authoring draft; unresolved preservation obligations are recorded in preservation.json.
    skip: true
    steps:
      - open: /ws/${AFT_WS}/agents
        intent: Original step 1
      - screenshot: child-repeat-s01
        intent: Original unnamed checkpoint 1
      - click:
          role: button
          name: + Add agent
          exact: true
        intent: Original step 2
      - screenshot: child-repeat-s02
        intent: Original unnamed checkpoint 2
      - await:
          observation:
            source: dom
            locator:
              selector: "[data-testid=create-agent-overlay]"
            view: count
            as: childOverlay
          satisfies:
            op: eq
            args:
              - ref:
                  binding: childOverlay
              - literal: 1
          deadline:
            clockId: host
            withinMs: 30000
        intent: Wait for the actual Lead creation form
      - screenshot: child-repeat-s03
        intent: Wait for the actual Lead creation form
      - click:
          testid: create-agent-template-lead
        intent: Original step 4
      - screenshot: child-repeat-s04
        intent: Original unnamed checkpoint 4
      - fill:
          testid: create-agent-name
          value: cov-child-repeat-lead-${RUN_ID}
        intent: Original step 5
      - screenshot: child-repeat-s05
        intent: Original unnamed checkpoint 5
      - select:
          testid: create-agent-backend
          value: opencode
        intent: Original step 6
      - screenshot: child-repeat-s06
        intent: Original unnamed checkpoint 6
      - click:
          testid: create-agent-submit
        intent: Original step 7
      - screenshot: child-repeat-s07
        intent: Original unnamed checkpoint 7
      - wait:
          url: /ws/${AFT_WS}/chat/
        intent: Original step 8
      - screenshot: child-repeat-s08
        intent: Original unnamed checkpoint 8
      - screenshot: child-repeat-s09
        intent: Show the selected real model before the first user Send
      - capture:
          source: url
          view: path-segments
          as: leadSegments
        intent: Bind the UI Lead to an exact saved Agent API ID
      - assert:
          all:
            - op: eq
              args:
                - op: count
                  args:
                    - ref:
                        binding: leadSegments
                - literal: 4
            - op: eq
              args:
                - ref:
                    binding: leadSegments
                    pointer: /0
                - literal: ws
            - op: eq
              args:
                - ref:
                    binding: leadSegments
                    pointer: /1
                - literal: ${AFT_WS}
            - op: eq
              args:
                - ref:
                    binding: leadSegments
                    pointer: /2
                - literal: chat
        intent: Bind the UI Lead to an exact saved Agent API ID
      - bind:
          as: leadId
          value:
            ref:
              binding: leadSegments
              pointer: /3
        intent: Bind the UI Lead to an exact saved Agent API ID
      - assert:
          all:
            - op: matches
              args:
                - ref:
                    binding: leadId
                - literal: ^agt_[A-Za-z0-9_-]*$
            - op: ne
              args:
                - ref:
                    binding: leadId
                - literal: agt_
        intent: Bind the UI Lead to an exact saved Agent API ID
      - capability:
          request:
            id: loom.agent.bind
            version: 1
            input:
              leaseId:
                ref:
                  binding: lease
              workspaceId:
                literal: ${AFT_WS}
              agentId:
                ref:
                  binding: leadId
          as: leadBound
        intent: Bind the UI Lead to an exact saved Agent API ID
      - api:
          method: GET
          path: /
          as: leadRow
          status: 200
          deadlineMs: 15000
        resolve:
          /api/path:
            op: concat
            args:
              - ref:
                  binding: apiOrigin
              - literal: /api/workspaces/${AFT_WS}/v1/agents/
              - ref:
                  binding: leadId
        intent: Bind the UI Lead to an exact saved Agent API ID
      - assert:
          all:
            - op: eq
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/agent_id
                - ref:
                    binding: leadId
            - op: eq
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/name
                - literal: cov-child-repeat-lead-${RUN_ID}
            - op: eq
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/repo
                - ref:
                    binding: repo
            - op: eq
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/workspace_id
                - literal: ${AFT_WS}
            - op: eq
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/harness
                - literal: opencode
            - op: eq
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/preset
                - literal: lead
            - op: eq
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/created_by_kind
                - literal: user
            - op: eq
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/parent_agent_id
                - literal: null
            - op: eq
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/root_agent_id
                - literal: null
            - op: ne
              args:
                - ref:
                    binding: leadRow
                    pointer: /body/worktree_path
                - literal: ""
        intent: Bind the UI Lead to an exact saved Agent API ID
      - screenshot: child-repeat-s10
        intent: Bind the UI Lead to an exact saved Agent API ID
      - fill:
          label: Message
          value: Before delegating, use your OpenCode execute tool to run exactly `return Object.keys(tools.loom)` and let that read-only runtime result list the installed Loom tools. Do not call any tool or HTTP for this inventory, and do not infer names from this request. Then use Loom agent_create to delegate one task child named cov-child-repeat-${RUN_ID}. Brief it to inspect README.md, BACKLOG.md, package.json, server.js, app.js, and app.test.js in its assigned worktree, then run `node --test app.test.js` once there before creating only aft-child-fixtures/${RUN_ID}/first.txt with the words first complete, git add and commit that file on its assigned branch, and report its result. Do not push. When its task_completed notice reaches you, give only one brief acknowledgement naming first; do not use agent_get. I will ask you to reopen the same child after that acknowledgement.
        intent: Original step 11
      - screenshot: child-repeat-s11
        intent: Original unnamed checkpoint 11
      - press: Enter
        intent: Original step 12
      - screenshot: child-repeat-s12
        intent: Original unnamed checkpoint 12
      - await:
