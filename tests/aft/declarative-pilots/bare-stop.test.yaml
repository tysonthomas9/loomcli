# Staged authoring draft. Original campaign is unchanged.
# skip guards unresolved preservation gaps; it is never validation evidence.
suite: declarative-pilot-bare-stop
profile: declarative
baseUrl: ${AFT_BASE_URL}
timeoutMs: 30000
setup:
  - bind:
      as: run
      value:
        literal: ${RUN_ID}
  - bind:
      as: loomRevision
      value:
        literal:
          repository: loomcli
          commit: ${AFT_LOOM_COMMIT}
          tree: ${AFT_LOOM_TREE}
          sourceManifestSha256: ${AFT_LOOM_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_LOOM_BUILD_MANIFEST_SHA256}
  - bind:
      as: fleetRevision
      value:
        literal:
          repository: fleet-db
          commit: ${AFT_FLEET_COMMIT}
          tree: ${AFT_FLEET_TREE}
          sourceManifestSha256: ${AFT_FLEET_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_FLEET_BUILD_MANIFEST_SHA256}
  - bind:
      as: selectionDigest
      value:
        literal: ${AFT_SELECTION_SHA256}
  - capability:
      request:
        id: loom.fixture.acquire
        version: 1
        input:
          runId:
            ref:
              binding: run
          profile:
            literal: agents-real-opencode
          loomRevision:
            ref:
              binding: loomRevision
          fleetRevision:
            ref:
              binding: fleetRevision
          model:
            literal: ${AFT_REAL_MODEL}
          maxCases:
            literal: 1
          selectionSha256:
            ref:
              binding: selectionDigest
      as: fixture
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /workspaceId
            - literal: ${AFT_WS}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /filesOrigin
            - literal: ${AFT_BASE_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /apiOrigin
            - literal: ${AFT_API_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /repo
            - literal: ${AFT_AGENT_FLOW_REPO}
  - assert:
      op: matches
      args:
        - ref:
            binding: fixture
            pointer: /fixtureRunId
        - literal: ^af[a-z0-9]{8}$
    intent: Require the actual source-compatible fixture RUN_ID captured from the same owned container.
exports:
  lease:
    resource:
      binding: fixture
      pointer: /lease/id
  ownedRun:
    data:
      binding: run
  apiOrigin:
    data:
      binding: fixture
      pointer: /apiOrigin
  filesOrigin:
    data:
      binding: fixture
      pointer: /filesOrigin
  repo:
    data:
      binding: fixture
      pointer: /repo
  fixtureRunId:
    data:
      binding: fixture
      pointer: /fixtureRunId
teardown:
  - capability:
      request:
        id: loom.fixture.release
        version: 1
        input:
          leaseId:
            ref:
              binding: fixture
              pointer: /lease/id
      as: released
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /released
            - literal: true
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /remainingOwnedResources
            - literal: []
tests:
  - name: OC1 bare Chat Stop loses the native ask without executing it and permits a real next turn
    intent: Explicit public API creates reviewer-style ask-policy agent; person triggers real shell ask, clicks bare Chat Stop, reloads and sends recovery question. No Decline/Cancel/Respond substitute. Authoring draft; unresolved preservation obligations are recorded in preservation.json.
    skip: true
    steps:
      - api:
          method: POST
          path: /
          as: created
          status: 201
          deadlineMs: 30000
          body:
            preset: pr-review-interactive
            name: cov-controls-stop-${RUN_ID}
            repo: ${AFT_AGENT_FLOW_REPO}
            base_ref: main
            overrides:
              harness: opencode
              model: ${AFT_REAL_MODEL}
          headers:
            Idempotency-Key: cov-controls-stop-${RUN_ID}-create
        resolve:
          /api/path:
            op: concat
            args:
              - ref:
                  binding: apiOrigin
              - literal: /api/workspaces/${AFT_WS}/v1/agents
          /api/body/name:
            op: concat
            args:
              - literal: cov-controls-stop-
              - ref:
                  binding: fixtureRunId
              - literal: ""
          /api/headers/Idempotency-Key:
            op: concat
            args:
              - literal: cov-controls-stop-
              - ref:
                  binding: fixtureRunId
              - literal: -create
        intent: Create an owned production ask-policy Agent API actor with the real model
      - bind:
          as: leadId
          value:
            ref:
              binding: created
              pointer: /body/agent_id
        intent: Create an owned production ask-policy Agent API actor with the real model
      - capability:
          request:
            id: loom.agent.bind
            version: 1
            input:
              leaseId:
                ref:
                  binding: lease
              workspaceId:
                literal: ${AFT_WS}
              agentId:
                ref:
                  binding: leadId
          as: leadBound
        intent: Create an owned production ask-policy Agent API actor with the real model
      - api:
