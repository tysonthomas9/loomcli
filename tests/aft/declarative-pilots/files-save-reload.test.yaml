          value: ${AFT_REAL_BACKEND}
        intent: Choose real OpenCode
      - screenshot: files-save-reload-s06
        intent: Choose real OpenCode
      - click:
          testid: create-agent-submit
        intent: Create the Lead in the UI
      - screenshot: files-save-reload-s07
        intent: Create the Lead in the UI
      - wait:
          url: /ws/${AFT_WS}/chat/agt_
        intent: Show the actual Agent API Chat route
      - screenshot: files-save-reload-s08
        intent: Show the actual Agent API Chat route
      - capture:
          source: url
          view: path-segments
          as: leadSegments
        intent: Bind the route to the saved Lead ID and canonical repo
