# Staged authoring draft. Original campaign is unchanged.
# skip guards unresolved preservation gaps; it is never validation evidence.
suite: declarative-pilot-files-save-reload
profile: declarative
baseUrl: ${AFT_BASE_URL}
timeoutMs: 30000
setup:
  - bind:
      as: run
      value:
        literal: ${RUN_ID}
  - bind:
      as: loomRevision
      value:
        literal:
          repository: loomcli
          commit: ${AFT_LOOM_COMMIT}
          tree: ${AFT_LOOM_TREE}
          sourceManifestSha256: ${AFT_LOOM_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_LOOM_BUILD_MANIFEST_SHA256}
  - bind:
      as: fleetRevision
      value:
        literal:
          repository: fleet-db
          commit: ${AFT_FLEET_COMMIT}
          tree: ${AFT_FLEET_TREE}
          sourceManifestSha256: ${AFT_FLEET_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_FLEET_BUILD_MANIFEST_SHA256}
  - bind:
      as: selectionDigest
      value:
        literal: ${AFT_SELECTION_SHA256}
  - capability:
      request:
        id: loom.fixture.acquire
        version: 1
        input:
          runId:
            ref:
              binding: run
          profile:
            literal: agents-real-opencode
          loomRevision:
            ref:
              binding: loomRevision
          fleetRevision:
            ref:
              binding: fleetRevision
          model:
            literal: ${AFT_REAL_MODEL}
          maxCases:
            literal: 1
          selectionSha256:
            ref:
              binding: selectionDigest
      as: fixture
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /workspaceId
            - literal: ${AFT_WS}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /filesOrigin
            - literal: ${AFT_BASE_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /apiOrigin
            - literal: ${AFT_API_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /repo
            - literal: ${AFT_AGENT_FLOW_REPO}
exports:
  lease:
    resource:
      binding: fixture
      pointer: /lease/id
  ownedRun:
    data:
      binding: run
  apiOrigin:
    data:
      binding: fixture
      pointer: /apiOrigin
  filesOrigin:
    data:
      binding: fixture
      pointer: /filesOrigin
  repo:
    data:
      binding: fixture
      pointer: /repo
teardown:
  - capability:
      request:
        id: loom.fixture.release
        version: 1
        input:
          leaseId:
            ref:
              binding: fixture
              pointer: /lease/id
      as: released
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /released
            - literal: true
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /remainingOwnedResources
            - literal: []
tests:
  - name: GF1 UI editor Save updates this Agent API checkout and survives every tab reload
    intent: Person creates Lead, edits CodeMirror and clicks Save in UI; API readback only. No shell/API write substitutes. Authoring draft; unresolved preservation obligations are recorded in preservation.json.
    skip: true
    steps:
      - open: /ws/${AFT_WS}/agents
        intent: Open Agents in the owned fixture
      - screenshot: files-save-reload-s01
        intent: Open Agents in the owned fixture
      - click:
          role: button
          name: + Add agent
          exact: true
        intent: Open New Agent
      - screenshot: files-save-reload-s02
        intent: Open New Agent
      - await:
          observation:
            source: dom
            locator:
              selector: "[data-testid=create-agent-overlay]"
            view: count
            as: overlay
          satisfies:
            op: eq
            args:
              - ref:
                  binding: overlay
              - literal: 1
          deadline:
            clockId: host
            withinMs: 30000
        intent: Show the Lead template
      - screenshot: files-save-reload-s03
        intent: Show the Lead template
      - click:
          testid: create-agent-template-lead
        intent: Choose Lead
      - screenshot: files-save-reload-s04
        intent: Choose Lead
      - fill:
