# Staged authoring draft. Original campaign is unchanged.
# skip guards unresolved preservation gaps; it is never validation evidence.
suite: declarative-pilot-sse-cursor
profile: declarative
baseUrl: ${AFT_BASE_URL}
timeoutMs: 30000
setup:
  - bind:
      as: run
      value:
        literal: ${RUN_ID}
  - bind:
      as: loomRevision
      value:
        literal:
          repository: loomcli
          commit: ${AFT_LOOM_COMMIT}
          tree: ${AFT_LOOM_TREE}
          sourceManifestSha256: ${AFT_LOOM_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_LOOM_BUILD_MANIFEST_SHA256}
  - bind:
      as: fleetRevision
      value:
        literal:
          repository: fleet-db
          commit: ${AFT_FLEET_COMMIT}
          tree: ${AFT_FLEET_TREE}
          sourceManifestSha256: ${AFT_FLEET_SOURCE_MANIFEST_SHA256}
          buildManifestSha256: ${AFT_FLEET_BUILD_MANIFEST_SHA256}
  - bind:
      as: selectionDigest
      value:
        literal: ${AFT_SELECTION_SHA256}
  - capability:
      request:
        id: loom.fixture.acquire
        version: 1
        input:
          runId:
            ref:
              binding: run
          profile:
            literal: agents-real-opencode
          loomRevision:
            ref:
              binding: loomRevision
          fleetRevision:
            ref:
              binding: fleetRevision
          model:
            literal: ${AFT_REAL_MODEL}
          maxCases:
            literal: 1
          selectionSha256:
            ref:
              binding: selectionDigest
      as: fixture
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /workspaceId
            - literal: ${AFT_WS}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /filesOrigin
            - literal: ${AFT_BASE_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /apiOrigin
            - literal: ${AFT_API_URL}
        - op: eq
          args:
            - ref:
                binding: fixture
                pointer: /repo
            - literal: ${AFT_AGENT_FLOW_REPO}
exports:
  lease:
    resource:
      binding: fixture
      pointer: /lease/id
  ownedRun:
    data:
      binding: run
  apiOrigin:
    data:
      binding: fixture
      pointer: /apiOrigin
  filesOrigin:
    data:
      binding: fixture
      pointer: /filesOrigin
  repo:
    data:
      binding: fixture
      pointer: /repo
teardown:
  - capability:
      request:
        id: loom.fixture.release
        version: 1
        input:
          leaseId:
            ref:
              binding: fixture
              pointer: /lease/id
      as: released
  - assert:
      all:
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /released
            - literal: true
        - op: eq
          args:
            - ref:
                binding: released
                pointer: /remainingOwnedResources
            - literal: []
tests:
  - name: LIVE filtered SSE cursor reconnect matches paged events and full delivered text
    intent: Person creates two Leads and sends actual messages; API client subscribes/reconnects; runtime actor restarts only owned serve. Authoring draft; unresolved preservation obligations are recorded in preservation.json.
    skip: true
    steps:
      - screenshot: sse-cursor-s01
        intent: Confirm this run owns the serve restart and real-model selector
      - open: /ws/${AFT_WS}/agents
        intent: Original step 2
      - screenshot: sse-cursor-s02
        intent: Original unnamed checkpoint 2
      - click:
          role: button
          name: + Add agent
          exact: true
        intent: Original step 3
      - screenshot: sse-cursor-s03
        intent: Original unnamed checkpoint 3
      - click:
          testid: create-agent-template-lead
        intent: Original step 4
      - screenshot: sse-cursor-s04
        intent: Original unnamed checkpoint 4
      - fill:
