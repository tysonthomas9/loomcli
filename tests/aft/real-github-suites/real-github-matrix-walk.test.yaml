# PX.7 Git settings matrix: stacked PR walk-through W1-W8. Generated by tests/aft/scripts/gen-matrix-suites.py;
# edit the generator, not this file. REAL tier: real GitHub sandbox repo + real codex; only via run-aft.sh --real-github.
suite: real-github-matrix-walk
classification: { area: git, feature: git-settings-matrix, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: >-
  for c in walk; do bash "$AFT_TESTS_DIR/scripts/loomgit-matrix.sh" teardown "$c" || true; done
tests:
  - name: "W1-W8 stacked PR walk-through"
    intent: "Stacked PRs with Lead may approve on and Lead may merge off: a human builds A, B, C as one stack, merges it bottom-up through a review fix-up, switches to PR per task and meets a hand push"
    steps:
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" setup walk native"
        intent: "Fixture: one repo, one Loom workspace and its lead (real tier: a clone of the run's sandbox repo)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" settings walk stack on off"
        intent: "Human sets Delivery mode stack, Lead may approve on, Lead may merge off in Settings > Git; the server and a reload agree"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" task walk a -"
        intent: "API client creates task a in its own epic and starts its run; it writes its own file"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev walk a 1 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (1/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev walk a 2 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (2/4)"
