      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" settings n1 stack off off"
        intent: "Human sets Delivery mode stack, Lead may approve off, Lead may merge off in Settings > Git; the server and a reload agree"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" task n1 a -"
