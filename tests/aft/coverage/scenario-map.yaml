executionInvariants:
  - Every graph leaf is an independent execution with a fresh browser session.
  - Shared graph setup and teardown run once per graph package when fixtureScope is graph.
  - A leaf replays every shared transition on its path; no prior leaf supplies product state.
  - Product journeys and surface contracts remain separate graphs when their fixture or proof semantics differ.
  - A migrated graph preserves the legacy scenario name, intent, route stubs, and ordered mechanics; graph-state assertions may add explicit observable proofs.
  - Known failures remain represented until the underlying product or scenario defect is fixed.

