# Surface tier: pins the degraded-mode PR reviewer API error contract (HTTP
# status codes + code fields). The user-visible degraded behavior lives in the
# tier-1 pr-workspace-degraded suite; promote or fold this back when a
# fake-connector seam exists (FINDINGS §3.9 staleness note).
suite: pr-contracts-surface
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: >-
  name="aft-prc-${RUN_ID:-local}"; list_code="$(curl -sS -o "$AFT_WORK_DIR/prc-workspaces.setup.json" -w "%{http_code}" "$AFT_BASE_URL/api/workspaces")"; [ "$list_code" = 200 ] || { echo "workspace list failed with HTTP $list_code:"; cat "$AFT_WORK_DIR/prc-workspaces.setup.json"; exit 1; }; existing="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); target=sys.argv[2]; print(next((w.get("id","") for w in d.get("workspaces",[]) if w.get("name")==target or w.get("id")==target), ""))' "$AFT_WORK_DIR/prc-workspaces.setup.json" "$name")"; if [ -n "$existing" ]; then delete_code="$(curl -sS -o "$AFT_WORK_DIR/prc-delete-stale.resp.json" -w "%{http_code}" -X DELETE "$AFT_BASE_URL/api/workspaces/$existing")"; [ "$delete_code" = 200 ] || [ "$delete_code" = 404 ] || { echo "stale workspace delete failed with HTTP $delete_code:"; cat "$AFT_WORK_DIR/prc-delete-stale.resp.json"; exit 1; }; fi; python3 -c 'import json,os; run=os.environ.get("RUN_ID") or "local"; print(json.dumps({"name":"aft-prc-"+run,"type":"empty"}))' > "$AFT_WORK_DIR/prc-create-workspace.json"; create_code="$(curl -sS -o "$AFT_WORK_DIR/prc-create-workspace.resp.json" -w "%{http_code}" -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/prc-create-workspace.json")"; [ "$create_code" = 201 ] || { echo "workspace create failed with HTTP $create_code:"; cat "$AFT_WORK_DIR/prc-create-workspace.resp.json"; exit 1; }; python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); data=d.get("data") or {}; assert data.get("id"), d; print(data["id"])' "$AFT_WORK_DIR/prc-create-workspace.resp.json" > "$AFT_WORK_DIR/prc-ws.id"
teardown: >-
  if [ -s "$AFT_WORK_DIR/prc-ws.id" ]; then AFT_WS="$(cat "$AFT_WORK_DIR/prc-ws.id")" "$AFT_TESTS_DIR/scripts/close-open-issues.sh" || true; delete_code="$(curl -sS -o "$AFT_WORK_DIR/prc-delete-workspace.resp.json" -w "%{http_code}" -X DELETE "$AFT_BASE_URL/api/workspaces/$(cat "$AFT_WORK_DIR/prc-ws.id")")"; [ "$delete_code" = 200 ] || [ "$delete_code" = 404 ] || { echo "workspace teardown delete failed with HTTP $delete_code:"; cat "$AFT_WORK_DIR/prc-delete-workspace.resp.json"; exit 1; }; fi

tests:
  # Surface-only because the test probes endpoint contracts without a user-facing flow;
  # promote or fold it back when a fake-connector seam supports a faithful scenario.
  # covers: PR reviewer/conversation degraded-mode endpoint contracts
  - name: pr reviewer endpoints return degraded codes without github access
    intent: An API client probes the PR reviewer endpoints on a gh-less stack and receives the documented degraded codes
    steps:
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/prc-ws.id")"; repo="$AFT_WORK_DIR/prc-widgets-${RUN_ID:-local}"; rm -rf "$repo"; mkdir -p "$repo"; git -C "$repo" init -q; printf '%s\n' "widgets ${RUN_ID:-local}" > "$repo/README.md"; git -C "$repo" add README.md; git -C "$repo" -c user.email=e2e@x -c user.name=e2e commit -m init -q; git -C "$repo" branch -M main; git -C "$repo" remote add origin https://github.com/acme/widgets; basename "$repo" > "$AFT_WORK_DIR/prc-repo.name"; python3 -c 'import json,sys; print(json.dumps({"repos":[sys.argv[1]]}))' "$repo" > "$AFT_WORK_DIR/prc-add-repo.json"; repo_code="$(curl -sS -o "$AFT_WORK_DIR/prc-add-repo.resp.json" -w "%{http_code}" -X POST "$AFT_BASE_URL/api/workspaces/$ws/repos" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/prc-add-repo.json")"; [ "$repo_code" = 201 ] || { echo "repo add failed with HTTP $repo_code:"; cat "$AFT_WORK_DIR/prc-add-repo.resp.json"; exit 1; }; python3 -c 'import json,os,sys; run=os.environ.get("RUN_ID") or "local"; repo=open(sys.argv[1]).read().strip(); print(json.dumps({"title":"pr contracts "+run,"issue_type":"task","priority":2,"external_ref":"https://github.com/acme/widgets/pull/7","source_repo":repo}))' "$AFT_WORK_DIR/prc-repo.name" > "$AFT_WORK_DIR/prc-issue.json"; issue_code="$(curl -sS -o "$AFT_WORK_DIR/prc-issue.resp.json" -w "%{http_code}" -X POST "$AFT_BASE_URL/api/workspaces/$ws/issues" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/prc-issue.json")"; [ "$issue_code" = 201 ] || { echo "PR issue create failed with HTTP $issue_code:"; cat "$AFT_WORK_DIR/prc-issue.resp.json"; exit 1; }
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/prc-ws.id")"; reviewer_code="$(curl -sS -o "$AFT_WORK_DIR/prc-reviewer.resp.json" -w "%{http_code}" -X POST "$AFT_BASE_URL/api/workspaces/$ws/pull-requests/acme/widgets/7/reviewer")"; [ "$reviewer_code" = 503 ] || { echo "reviewer create returned unexpected HTTP $reviewer_code:"; cat "$AFT_WORK_DIR/prc-reviewer.resp.json"; exit 1; }; python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("code")=="egress_unavailable", d' "$AFT_WORK_DIR/prc-reviewer.resp.json"; conversation_code="$(curl -sS -o "$AFT_WORK_DIR/prc-conversation.resp.json" -w "%{http_code}" "$AFT_BASE_URL/api/workspaces/$ws/pull-requests/acme/widgets/7/conversation")"; [ "$conversation_code" = 404 ] || { echo "conversation returned unexpected HTTP $conversation_code:"; cat "$AFT_WORK_DIR/prc-conversation.resp.json"; exit 1; }; python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("code")=="reviewer_not_started", d' "$AFT_WORK_DIR/prc-conversation.resp.json"
