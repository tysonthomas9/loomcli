# Surface tier: task-runner lifecycle endpoints have no complete mounted
# operator controls yet, and the repo-less workspace case is a hollow fixture.
# Promote individual tests when a normal product surface drives the same call.
suite: agent-lifecycle-contracts
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: |
  set -e
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-CTL" >/dev/null || true
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-NOREPO" >/dev/null || true

  repo="$AFT_WORK_DIR/task-ctl-repo"
  rm -rf "$repo"
  mkdir -p "$repo"
  git -C "$repo" init -q
  git -C "$repo" config user.name "Loom AFT"
  git -C "$repo" config user.email "aft@example.test"
  git -C "$repo" commit --allow-empty -m init -q
  printf 'gate:\n\t@true\n' > "$repo/Makefile"
  mkdir -p "$repo/epic-runner-output"
  : > "$repo/epic-runner-output/.gitkeep"
  git -C "$repo" add Makefile epic-runner-output/.gitkeep
  git -C "$repo" commit -m "add aft task fixtures" -q
  git -C "$repo" branch -M main

  python3 - "$repo" > "$AFT_WORK_DIR/task-ctl-workspace.json" <<'PY'
  import json, sys
  print(json.dumps({"name": "e2e-ws-task-ctl", "type": "empty", "repos": [sys.argv[1]]}))
  PY
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces" \
    -H "Content-Type: application/json" \
    -d @"$AFT_WORK_DIR/task-ctl-workspace.json" \
    > "$AFT_WORK_DIR/task-ctl-workspace.resp.json"
  python3 - "$AFT_WORK_DIR/task-ctl-workspace.resp.json" "$AFT_WORK_DIR" <<'PY'
  import json, pathlib, sys
  data = json.load(open(sys.argv[1])).get("data") or {}
  work = pathlib.Path(sys.argv[2])
  work.joinpath("task-ctl-workspace.path").write_text(data["path"], encoding="utf-8")
  repo = (data.get("repos") or [])[0]
  work.joinpath("task-ctl-repo.name").write_text(repo["name"], encoding="utf-8")
  work.joinpath("task-ctl-repo.source").write_text(repo.get("source_repo_id") or repo["name"], encoding="utf-8")
  PY

  printf '%s\n' '{"name":"e2e-ws-task-norepo","type":"empty","repos":[]}' > "$AFT_WORK_DIR/task-norepo-workspace.json"
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces" \
    -H "Content-Type: application/json" \
    -d @"$AFT_WORK_DIR/task-norepo-workspace.json" \
    > "$AFT_WORK_DIR/task-norepo-workspace.resp.json"
teardown: |
  set +e
  for ws in E2E-WS-TASK-CTL E2E-WS-TASK-NOREPO; do
    AFT_WS="$ws" "$AFT_TESTS_DIR/scripts/close-open-issues.sh"
    curl -s "$AFT_BASE_URL/api/workspaces/$ws/agents" > "$AFT_WORK_DIR/task-$ws-agents.teardown.json" || true
    python3 - "$AFT_WORK_DIR/task-$ws-agents.teardown.json" "${RUN_ID:-local}" <<'PY' > "$AFT_WORK_DIR/task-$ws-agents.teardown.list"
  import json, sys
  try:
      d = json.load(open(sys.argv[1]))
  except Exception:
      d = {}
  run = sys.argv[2]
  agents = d.get("data") if isinstance(d, dict) else []
  for a in agents or []:
      name = a.get("name", "")
      if name.endswith("-" + run):
          print(name)
  PY
    while read -r agent; do
      [ -n "$agent" ] && curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/$ws/agents/$agent" >/dev/null || true
    done < "$AFT_WORK_DIR/task-$ws-agents.teardown.list"
    curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/$ws" >/dev/null || true
  done

tests:
  # covers: TSK-D6; repo-less workspace Task Runner create rejection; create-agent-no-repos contradiction; TSK-B11 defect pin
  - name: repo-less task runner create explains repo requirement
    intent: An API client and then an operator both discover that a repo-less workspace rejects a Task Runner without repos and the modal explains the requirement
    steps:
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-NOREPO/agents"
          body:
            name: "orphan-${RUN_ID:-local}"
            role_name: "task"
            auto: false
            cross_repo: true
            repos: []
            backend: "codex"
          status: 400
          assert:
            - path: "kind"
              equals: "validation_error"
            - path: "error"
              contains: "workspace has no repos for agent"
        intent: "An API client probes task-agent creation in a repo-less workspace"
      - run: |
          set -e
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-NOREPO/agents" > "$AFT_WORK_DIR/tsk-d6-agents.json"
          python3 - "$AFT_WORK_DIR/tsk-d6-agents.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get("data") == [], d
          PY
        intent: "An API client confirms the failed repo-less create left no agent row behind"
      - open: /ws/E2E-WS-TASK-NOREPO/agents
      - wait:
          fn: &agentsPageReady >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the repo-less workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: &createAgentDialogOpen >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the repo-less agent creation dialog is open"
      - wait:
          fn: >-
            (() => {
              const text = document.querySelector('[data-testid=create-agent-no-repos]')?.textContent?.replace(/\s+/g, ' ').trim() || '';
              return text === 'No repos in this workspace yet — background agents need at least one repo; interactive agents run with workspace scope.';
            })()
        intent: "Wait until the modal renders the exact repo-less requirement copy"
      - click: { testid: create-agent-template-task }
      - fill: { testid: create-agent-name, value: "orphan-ui-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            document.querySelector('[data-testid=create-agent-error]')?.textContent.includes('This workspace has no repos yet — add one from the sidebar first.')
        intent: "Wait until the repo-less modal submit surfaces the service validation error"
      - expect: { visible: { testid: create-agent-error } }
      - expect: { visible: { testid: create-agent-overlay } }
      - run: |
          set -e
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-NOREPO/agents" > "$AFT_WORK_DIR/tsk-d6-agents-after-ui.json"
          python3 - "$AFT_WORK_DIR/tsk-d6-agents-after-ui.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get("data") == [], d
          PY
        intent: "An operator confirms the failed browser submit also left no agent row behind"

  # covers: TSK-D8a; POST /agents/{name}/start not-found contract
  - name: starting a missing task runner returns not found
    intent: An API client that starts an agent which no longer exists gets a clean not-found response
    steps:
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/no-such-agent-${RUN_ID:-local}/start"
          status: 404
        intent: "An API client probes the lifecycle start endpoint for a missing agent"

  # covers: TSK-D14a; DELETE /agents/{name}; agents rail and monitor removal; name reuse
  - name: deleting a fresh task runner removes it from surfaces and frees its name
    intent: An API client deletes a freshly modal-created Task Runner, while an operator sees it disappear and verifies its name is reusable
    steps:
      - open: /ws/E2E-WS-TASK-CTL/agents
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the lifecycle-control agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: *createAgentDialogOpen
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-task }
      - fill: { testid: create-agent-name, value: "delete-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('delete-${RUN_ID:-local}')
        intent: "Wait until the fresh delete-target worker appears"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="delete-$run"
          repo="$(cat "$AFT_WORK_DIR/task-ctl-repo.name")"
          ws_path="$(cat "$AFT_WORK_DIR/task-ctl-workspace.path")"
          wt="$ws_path/worktrees/$repo/$name"
          [ -e "$wt/.git" ] || { echo "missing worktree before delete: $wt"; exit 1; }
          git -C "$wt" rev-parse --is-inside-work-tree >/dev/null
        intent: "An operator confirms the fresh delete-target worktree exists before deletion"
      - api:
          method: "DELETE"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/delete-${RUN_ID:-local}"
          status: 200
          assert:
            - path: "message"
              equals: "agent deleted"
        intent: "An API client deletes the fresh Task Runner through the lifecycle surface"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="delete-$run"
          # budget: db-persist (10s) - fleet-db delete must disappear from list readback.
          for i in $(seq 1 10); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-CTL/agents" > "$AFT_WORK_DIR/tsk-d14-agents.json" &&
            python3 - "$AFT_WORK_DIR/tsk-d14-agents.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          agents = d.get("data") if isinstance(d, dict) else []
          assert isinstance(agents, list), d
          assert not any(a.get("name") == name for a in agents or []), agents
          PY
            sleep 1
          done
          echo "deleted agent still listed"
          cat "$AFT_WORK_DIR/tsk-d14-agents.json" 2>/dev/null || true
          exit 1
        intent: "An operator reads back that the deleted agent is gone from the agent list"
      - wait: { ms: 5500 }
      - reload: true
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })() &&
            !document.querySelector("[aria-label='Agent: delete-${RUN_ID:-local}']")
        intent: "Wait until the agents rail store refresh no longer renders the deleted agent"
      - open: /ws/E2E-WS-TASK-CTL/monitor
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=agent-activity-panel]')
        intent: "Wait until the lifecycle-control monitor panel is mounted"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="delete-$run"
          # budget: monitor-cache (16s) - monitor/status can lag fleet-db deletion.
          for i in $(seq 1 16); do
            curl -sf "$AFT_BASE_URL/api/monitor/status?workspace=E2E-WS-TASK-CTL" > "$AFT_WORK_DIR/tsk-d14-monitor.json" &&
            python3 - "$AFT_WORK_DIR/tsk-d14-monitor.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          agents = d.get("agents")
          assert isinstance(agents, list), d
          assert not any(a.get("name") == sys.argv[2] for a in agents), agents
          PY
            sleep 1
          done
          echo "deleted agent still listed in monitor status"
          cat "$AFT_WORK_DIR/tsk-d14-monitor.json" 2>/dev/null || true
          exit 1
        intent: "An operator polls monitor status until the deleted agent leaves the cache"
      - reload: true
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=agent-activity-panel]') &&
            !document.body.textContent.includes('delete-${RUN_ID:-local}')
        intent: "Wait until the monitor status cache refresh no longer renders the deleted agent"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="delete-$run"
          repo="$(cat "$AFT_WORK_DIR/task-ctl-repo.name")"
          ws_path="$(cat "$AFT_WORK_DIR/task-ctl-workspace.path")"
          wt="$ws_path/worktrees/$repo/$name"
          [ -e "$wt/.git" ] || { echo "worktree should remain after delete: $wt"; exit 1; }
          git -C "$wt" rev-parse --is-inside-work-tree >/dev/null
        intent: "An operator confirms deleting the fleet-db row does not remove the local worktree directory"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents"
          body:
            name: "delete-${RUN_ID:-local}"
            role_name: "task"
            auto: false
            backend: "codex"
          status: 201
          assert:
            - path: "name"
              equals: "delete-${RUN_ID:-local}"
        intent: "An API client recreates the Task Runner to prove the deleted name is reusable"

  # covers: TSK-D15; lifecycle endpoint contracts; invalid lifecycle PATCH; queue 501
  - name: task runner lifecycle endpoints write the daemon reconciliation contract
    intent: An API client exercises start, stop, restart, yield, payload start, invalid patches, and the unsupported queue endpoint for a Task Runner
    steps:
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents"
          body:
            name: "life-${RUN_ID:-local}"
            role_name: "task"
            auto: false
            backend: "codex"
          status: 201
          assert:
            - path: "name"
              equals: "life-${RUN_ID:-local}"
        intent: "An API client provisions a Task Runner for lifecycle contract probing"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/issues"
          body:
            title: "task-runner lifecycle ${RUN_ID:-local}"
            issue_type: "task"
            priority: 2
          save:
            - from: "data.id"
              as: "tskD15TaskId"
        intent: "An API client creates a task id used by the lifecycle start payload"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/life-${RUN_ID:-local}/start"
          status: 200
          assert:
            - path: "message"
              equals: "agent \"life-${RUN_ID:-local}\" started"
        intent: "An API client starts the Task Runner through the fleet-db lifecycle endpoint"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="life-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-CTL/agents" > "$AFT_WORK_DIR/tsk-d15-start.json"
          python3 - "$AFT_WORK_DIR/tsk-d15-start.json" "$name" active running <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name, state, desired = sys.argv[2:5]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("state") == state, a
          assert a.get("desired_state") == desired, a
          PY
        intent: "An API client reads back the active/running state pair after start"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/life-${RUN_ID:-local}/stop"
          status: 200
          assert:
            - path: "message"
              equals: "agent \"life-${RUN_ID:-local}\" stopped"
        intent: "An API client stops the Task Runner through the fleet-db lifecycle endpoint"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="life-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-CTL/agents" > "$AFT_WORK_DIR/tsk-d15-stop.json"
          python3 - "$AFT_WORK_DIR/tsk-d15-stop.json" "$name" stopped stopped <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name, state, desired = sys.argv[2:5]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("state") == state, a
          assert a.get("desired_state") == desired, a
          PY
        intent: "An API client reads back the stopped/stopped state pair after stop"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/life-${RUN_ID:-local}/restart"
          status: 202
          assert:
            - path: "message"
              equals: "agent \"life-${RUN_ID:-local}\" restart requested"
        intent: "An API client requests a Task Runner restart through the fleet-db lifecycle endpoint"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="life-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-CTL/agents" > "$AFT_WORK_DIR/tsk-d15-restart.json"
          python3 - "$AFT_WORK_DIR/tsk-d15-restart.json" "$name" active running <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name, state, desired = sys.argv[2:5]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("state") == state, a
          assert a.get("desired_state") == desired, a
          PY
        intent: "An API client reads back the active/running state pair after restart"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/life-${RUN_ID:-local}/yield"
          status: 202
          assert:
            - path: "message"
              equals: "agent \"life-${RUN_ID:-local}\" yield requested"
        intent: "An API client requests a Task Runner yield through the fleet-db lifecycle endpoint"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="life-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-CTL/agents" > "$AFT_WORK_DIR/tsk-d15-yield.json"
          python3 - "$AFT_WORK_DIR/tsk-d15-yield.json" "$name" idle draining <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name, state, desired = sys.argv[2:5]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("state") == state, a
          assert a.get("desired_state") == desired, a
          PY
        intent: "An API client reads back the idle/draining state pair after yield"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/life-${RUN_ID:-local}/start"
          body:
            task_id: "${var:tskD15TaskId}"
          status: 200
          assert:
            - path: "message"
              equals: "agent \"life-${RUN_ID:-local}\" started"
        intent: "An API client starts the Task Runner with a task_id payload"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="life-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-CTL/agents" > "$AFT_WORK_DIR/tsk-d15-start-payload.json"
          python3 - "$AFT_WORK_DIR/tsk-d15-start-payload.json" "$name" active running <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name, state, desired = sys.argv[2:5]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("state") == state, a
          assert a.get("desired_state") == desired, a
          PY
        intent: "An API client reads back the active/running state pair after payload start"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/no-such-life-${RUN_ID:-local}/start"
          status: 404
        intent: "An API client confirms start on an unknown agent returns not found"
      - api:
          method: "PATCH"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/life-${RUN_ID:-local}"
          body:
            state: "bogus"
          status: 400
          assert:
            - path: "kind"
              equals: "validation_error"
            - path: "error"
              contains: "invalid state"
        intent: "An API client confirms invalid stored agent state is rejected"
      - api:
          method: "PATCH"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/life-${RUN_ID:-local}"
          body:
            desired_state: "bogus"
          status: 400
          assert:
            - path: "kind"
              equals: "validation_error"
            - path: "error"
              contains: "invalid desired_state"
        intent: "An API client confirms invalid desired agent state is rejected"
      - api:
          method: "GET"
          path: "/api/workspaces/E2E-WS-TASK-CTL/agents/life-${RUN_ID:-local}/queue"
          status: 501
          assert:
            - path: "kind"
              equals: "not_implemented"
            - path: "error"
              contains: "use monitor task queues"
        intent: "An API client confirms the agent-specific queue endpoint reports the monitor-queue replacement"

  # covers: TSK-D19; agent health wire fields; no mounted health UI
  - name: assigned but idle task runner health fields stay explicit on the wire
    intent: An API client prepares an assigned in-progress task for a modal-created Task Runner and verifies the agent-health wire contract without claiming a UI rendering surface
    steps:
      - open: /ws/E2E-WS-TASK-CTL/agents
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the lifecycle-control agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: *createAgentDialogOpen
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-task }
      - fill: { testid: create-agent-name, value: "health-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('health-${RUN_ID:-local}')
        intent: "Wait until the health-probe Task Runner appears after submit"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK-CTL/issues"
          body:
            title: "task-runner health ${RUN_ID:-local}"
            issue_type: "task"
            priority: 2
          save:
            - from: "data.id"
              as: "tskD19IssueId"
        intent: "An API client creates the issue that will be assigned without starting the agent"
      - api:
          method: "PATCH"
          path: "/api/workspaces/E2E-WS-TASK-CTL/issues/${var:tskD19IssueId}"
          body:
            status: "in_progress"
            assignee: "health-${RUN_ID:-local}"
        intent: "An API client writes the assigned-but-not-running issue state"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="health-$run"
          task="$(cat "$AFT_WORK_DIR/tskD19IssueId")"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-CTL/agents" > "$AFT_WORK_DIR/tsk-d19-agents.json"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK-CTL/issues/$task" > "$AFT_WORK_DIR/tsk-d19-issue.json"
          python3 - "$AFT_WORK_DIR/tsk-d19-agents.json" "$AFT_WORK_DIR/tsk-d19-issue.json" "$name" <<'PY'
          import json, sys
          agents_doc = json.load(open(sys.argv[1]))
          issue_doc = json.load(open(sys.argv[2]))
          name = sys.argv[3]
          agents = agents_doc.get("data") if isinstance(agents_doc, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("live_status", "idle") in ("", "idle"), a
          assert a.get("live_status") != "working", a
          assert not a.get("active_task_id"), a
          assert not a.get("active_phase"), a
          assert not a.get("last_error_class"), a
          issue = issue_doc.get("data") or {}
          assert issue.get("status") == "in_progress", issue
          assert issue.get("assignee") == name, issue
          PY
        intent: "An API client verifies the assigned issue and idle agent-health fields through list readbacks"
