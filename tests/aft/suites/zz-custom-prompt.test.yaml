            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('custmix-${RUN_ID:-local}')
        intent: "Wait until the mixed-case custom agent appears under its normalized name"
      - open: /ws/E2E-WS-CUSTOM/agents/custmix-${RUN_ID:-local}
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the normalized custom agent route renders"
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=terminal-view] [data-testid=terminal-tab-bar], [data-testid=terminal-view] [data-testid=terminal-wrapper]')
        intent: "Wait until the normalized custom agent terminal surface is mounted"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="custmix-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/agents" > "$AFT_WORK_DIR/d17a-agents.json"
          LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" "$AFT_LOOM_BIN" --workspace E2E-WS-CUSTOM role show "$name" --json > "$AFT_WORK_DIR/d17a-role.json"
          python3 - "$AFT_WORK_DIR/d17a-agents.json" "$AFT_WORK_DIR/d17a-role.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          name = sys.argv[3]
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          assert matches[0].get("role_name") == name, matches[0]
          r = json.load(open(sys.argv[2]))
          assert r.get("name") == name, r
          PY
          for i in $(seq 1 60); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/terminal/tabs" > "$AFT_WORK_DIR/d17a-tabs.json" &&
            python3 - "$AFT_WORK_DIR/d17a-tabs.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          tabs = d.get("data") or []
          matches = [t for t in tabs if t.get("agent_id") == name]
          assert matches, tabs
          assert matches[0].get("launch", {}).get("env", {}).get("LOOM_AGENT_ROLE") == name, matches[0]
          PY
            sleep 2
          done
          echo "normalized custom agent terminal launch metadata never appeared"
          cat "$AFT_WORK_DIR/d17a-tabs.json" 2>/dev/null || true
          exit 1
        intent: "An operator polls terminal tabs until the normalized custom agent role env is persisted"

