# CreateAgentModal Custom prompt coverage. This suite owns its workspaces because
# custom-prompt agents leave durable role rows behind until the workspace is deleted.
suite: zz-custom-prompt
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: |
  set -e
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM" >/dev/null || true
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM-CTL" >/dev/null || true
  for pair in custom:e2e-ws-custom ctl:e2e-ws-custom-ctl; do
    suffix="${pair%%:*}"
    name="${pair#*:}"
    repo="$AFT_WORK_DIR/${suffix}-repo"
    mkdir -p "$repo"
    git -C "$repo" init -q
    git -C "$repo" -c user.email=e2e@x -c user.name=e2e commit --allow-empty -m init -q
    python3 -c 'import json,sys; print(json.dumps({"name":sys.argv[1],"type":"empty","repos":[sys.argv[2]]}))' "$name" "$repo" > "$AFT_WORK_DIR/${suffix}-workspace.json"
    curl -sf -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/${suffix}-workspace.json" > "$AFT_WORK_DIR/${suffix}-workspace.resp.json"
  done
teardown: |
  set +e
  for ws in E2E-WS-CUSTOM E2E-WS-CUSTOM-CTL; do
    curl -s "$AFT_BASE_URL/api/workspaces/$ws/agents" > "$AFT_WORK_DIR/custom-${ws}.agents.teardown.json" || true
    python3 - "$AFT_WORK_DIR/custom-${ws}.agents.teardown.json" "${RUN_ID:-local}" <<'PY' > "$AFT_WORK_DIR/custom-${ws}.agents.teardown.list"
  import json, os, sys
  p, run = sys.argv[1], sys.argv[2]
  try:
      d = json.load(open(p))
  except Exception:
      d = {}
  data = d.get("data", d)
  agents = data.get("agents") if isinstance(data, dict) else data
  for a in agents or []:
      name = a.get("name", "")
      if name.endswith("-" + run) or name in {"orchestrator", "pr-review"}:
          print(name)
  PY
    while read -r agent; do
      [ -n "$agent" ] && curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/$ws/agents/$agent" >/dev/null || true
    done < "$AFT_WORK_DIR/custom-${ws}.agents.teardown.list"
    curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/$ws" >/dev/null || true
  done

tests:
  # covers: CUS-D1; CreateAgentModal custom-prompt template; POST /api/workspaces/:ws/agents; GET /api/workspaces/:ws/agents; /api/monitor/status; role show
  - name: custom prompt creates an interactive role with byte-exact instructions
    intent: An operator defines a terminal teammate with inline instructions through CreateAgentModal and verifies the stored agent, role, and prompt
    steps:
      - open: /ws/E2E-WS-CUSTOM/agents
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the custom workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-custom-prompt }
      - expect: { visible: { testid: create-agent-interactive-prompt } }
      - fill: { testid: create-agent-name, value: "cust-${RUN_ID:-local}" }
      - fill: { testid: create-agent-interactive-prompt, value: "You are a release-notes reviewer. AFT-PROMPT-MARKER-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('cust-${RUN_ID:-local}')
        intent: "Wait until the modal closes and the new custom agent appears through the agents store"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="cust-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/agents" > "$AFT_WORK_DIR/d1-agents.json"
          python3 - "$AFT_WORK_DIR/d1-agents.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("role_name") == name, a
          assert a.get("backend") == "codex", a
          assert not a.get("auto"), a
          PY
        intent: "An operator's readback selects the created custom agent from the unordered agent list"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="cust-$run"
          for i in $(seq 1 16); do
            curl -sf "$AFT_BASE_URL/api/monitor/status?workspace=E2E-WS-CUSTOM" > "$AFT_WORK_DIR/d1-monitor.json" &&
            python3 - "$AFT_WORK_DIR/d1-monitor.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          matches = [a for a in d.get("agents", []) if a.get("name") == name]
          assert len(matches) == 1, d.get("agents")
          a = matches[0]
          assert a.get("role_kind") == "interactive", a
          assert a.get("role") == name, a
          PY
            sleep 1
          done
          echo "monitor status never exposed custom interactive agent"
          cat "$AFT_WORK_DIR/d1-monitor.json" 2>/dev/null || true
          exit 1
        intent: "An operator's readback confirms the monitor resolves the custom role as interactive"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="cust-$run"
          prompt="You are a release-notes reviewer. AFT-PROMPT-MARKER-$run"
          LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" "$AFT_LOOM_BIN" --workspace E2E-WS-CUSTOM role show "$name" --json > "$AFT_WORK_DIR/d1-role.json"
          python3 - "$AFT_WORK_DIR/d1-role.json" "$prompt" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          want = sys.argv[2]
          assert r.get("kind") == "interactive", r
          assert r.get("prompt") == want, r
          assert not r.get("prompt_file"), r
          assert r.get("description") == "Interactive terminal agent", r
          PY
        intent: "An operator's CLI readback confirms the role stores exactly the prompt text"

