kind: graph-steps
version: 1
flow: lead-agents
blocks:
  wait-for-agents-page:
    params:
      - intent
    steps:
      - wait:
          fn: |-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "{{intent}}"
  open-agents-page:
    params:
      - path
      - readyIntent
    steps:
      - open: "{{path}}"
      - use: wait-for-agents-page
        with:
          intent: "{{readyIntent}}"
  wait-for-create-agent-dialog:
    params:
      - intent
    steps:
      - wait:
          fn: |-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "{{intent}}"
  open-create-agent-dialog:
    params:
      - path
      - readyIntent
      - dialogIntent
    steps:
      - use: open-agents-page
        with:
          path: "{{path}}"
          readyIntent: "{{readyIntent}}"
      - click:
          role: button
          name: + Add agent
          exact: true
      - use: wait-for-create-agent-dialog
        with:
          intent: "{{dialogIntent}}"
  choose-lead-template:
    params:
      - path
      - readyIntent
      - dialogIntent
    steps:
      - use: open-create-agent-dialog
        with:
          path: "{{path}}"
          readyIntent: "{{readyIntent}}"
          dialogIntent: "{{dialogIntent}}"
      - click:
          testid: create-agent-template-lead
  open-lead-terminal:
    params:
      - name
    steps:
      - open: /ws/E2E-WS-LEAD/agents/{{name}}
        intent: An operator opens {{name}} and waits for its embedded Lead terminal evidence.
  show-lead-info:
    params:
      - name
    steps:
      - open: /ws/E2E-WS-LEAD/agents/{{name}}
        intent: An operator opens {{name}} so its Lead definition is the review subject.
      - wait:
          fn: |-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const card = document.querySelector("[aria-label='Agent: {{name}}']");
              const root = document.querySelector('[data-testid=agent-editor-groups]');
              const info = Array.from(root?.querySelectorAll('button[draggable="true"]') || [])
                .find((button) => (button.textContent || '').trim() === 'Info');
              return location.pathname.endsWith('/agents/{{name}}') && !!page && !!card && !!root && !!info;
            })()
        intent: Wait until {{name}} and its editor tabs are ready.
      - click:
          role: button
          name: Info
          exact: true
        intent: An operator selects {{name}}'s Info tab.
      - wait:
          fn: |-
            (() => {
              const root = document.querySelector('[data-testid=agent-editor-groups]');
              const info = Array.from(root?.querySelectorAll('button[draggable="true"]') || [])
                .find((button) => (button.textContent || '').trim() === 'Info');
              const pane = Array.from(root?.querySelectorAll('[role=tabpanel]:not([data-hidden])') || [])
                .find((candidate) => !candidate.parentElement?.closest('[role=tabpanel]'));
              const text = (pane?.textContent || '').replace(/\s+/g, ' ').trim();
              return info?.getAttribute('aria-current') === 'page' &&
                text.includes('{{name}}') && text.includes('Lead agent');
            })()
        intent: Wait until {{name}}'s Info pane visibly identifies the Lead definition.
  controlled-codex-lead-connected:
    params:
      - name
    steps:
      - wait:
          fn: |-
            (() => {
              const wrapper = document.querySelector('[data-testid=terminal-wrapper]');
              if (!wrapper) return false;
              const rows = Array.from(wrapper.querySelectorAll('.term-row')).map((el) => el.textContent || '').join('\n');
              const text = rows || wrapper.textContent || '';
              const failure = [
                'Error running agent',
                'backend is not installed',
                'codex app-server exited before ready',
                'codex remote stub failed to connect',
                'Dropping into a shell'
              ].find((message) => text.includes(message));
              if (failure) {
                throw new Error('controlled Lead failed before connection: ' + text.slice(-400));
              }
              return text.includes('Starting LEAD mode') &&
                text.includes('Launching controlled Codex lead session...') &&
                text.includes('Controlled Codex stub connected: {{name}}');
            })()
        intent: Wait until {{name}} completes the controlled Codex bootstrap without falling back to a shell.
      - wait:
          fn: |-
            (async () => {
              const response = await fetch('/api/workspaces/E2E-WS-LEAD/terminal/tabs', { cache: 'no-store' });
              if (!response.ok) return false;
              const payload = await response.json();
              const tabs = Array.isArray(payload.data) ? payload.data : [];
              const matches = tabs.filter((tab) =>
                tab.agent_id === '{{name}}' &&
                tab.kind === 'agent' &&
                tab.role === 'lead' &&
                tab.backend === 'codex');
              return matches.length === 1 && matches[0].pty_alive === true;
            })()
        intent: Confirm {{name}} owns exactly one live Codex-backed Lead terminal.
      - expect:
          visible:
            testid: terminal-wrapper
  controlled-claude-lead-connected:
    params:
      - name
    steps:
      - wait:
          fn: |-
            (() => {
              const wrapper = document.querySelector('[data-testid=terminal-wrapper]');
              if (!wrapper) return false;
              const rows = Array.from(wrapper.querySelectorAll('.term-row')).map((el) => el.textContent || '').join('\n');
              const text = rows || wrapper.textContent || '';
              const failure = [
                'Error running agent',
                'backend is not installed',
                'Dropping into a shell'
              ].find((message) => text.includes(message));
              if (failure) {
                throw new Error('controlled Claude Lead failed before connection: ' + text.slice(-400));
              }
              const session = /Controlled Claude session: [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
              return text.includes('Controlled Claude stub ready: {{name}}') &&
                session.test(text);
            })()
        intent: Wait until {{name}} completes the controlled Claude bootstrap and reports its session identity without falling back to a shell.
      - wait:
          fn: |-
            (async () => {
              const response = await fetch('/api/workspaces/E2E-WS-LEAD/terminal/tabs', { cache: 'no-store' });
              if (!response.ok) return false;
              const payload = await response.json();
              const tabs = Array.isArray(payload.data) ? payload.data : [];
              const matches = tabs.filter((tab) =>
                tab.agent_id === '{{name}}' &&
                tab.kind === 'agent' &&
                tab.role === 'lead' &&
                tab.backend === 'claude');
              return matches.length === 1 && matches[0].pty_alive === true;
            })()
        intent: Confirm {{name}} owns exactly one live Claude-backed Lead terminal.
      - expect:
          visible:
            testid: terminal-wrapper
        intent: Confirm {{name}}'s connected Claude terminal is visible to the reviewer.
  lead-launch-attribution-ready:
    params:
      - name
    steps:
      - wait:
          fn: |-
            (async () => {
              const response = await fetch('/api/workspaces/E2E-WS-LEAD/terminal/tabs', { cache: 'no-store' });
              if (!response.ok) return false;
              const payload = await response.json();
              const tabs = Array.isArray(payload.data) ? payload.data : [];
              const matches = tabs.filter((tab) =>
                tab.agent_id === '{{name}}' && tab.kind === 'agent' && tab.pty_alive === true);
              if (matches.length !== 1) return false;
              const tab = matches[0];
              const launch = tab.launch || {};
              const argv = (launch.argv || []).map(String).join(' ');
              const env = launch.env || {};
              return tab.role === 'lead' &&
                tab.writable === true &&
                String(tab.session_name || '').startsWith('term_') &&
                argv.trim().endsWith("'lead'") &&
                argv.includes("'--workspace' 'E2E-WS-LEAD'") &&
                !argv.includes('--prompt') &&
                env.LOOM_AGENT_NAME === '{{name}}' &&
                env.LOOM_AGENT_ROLE === 'lead' &&
                env.LOOM_AGENT_TERMINAL_ID === tab.session_name &&
                env.LOOM_WORKSPACE === 'E2E-WS-LEAD' &&
                env.LOOM_BACKEND === tab.backend &&
                String(env.LOOM_ORCHESTRATOR_SESSION_ID || '').startsWith('lead-');
            })()
        intent: Confirm the connected Lead terminal carries the exact workspace and orchestration attribution contract.
  remove-case-agent-and-tabs:
    params:
      - name
    steps:
      - run: |-
          set -e
          name="{{name}}"
          safe_name="$(printf '%s' "$name" | tr -c 'A-Za-z0-9_-' '_')"
          tabs_file="$AFT_WORK_DIR/prereq-${AFT_CASE_ID:-local}-$safe_name-tabs.json"
          sessions_file="$AFT_WORK_DIR/prereq-${AFT_CASE_ID:-local}-$safe_name-sessions.txt"
          curl -s "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$tabs_file" || printf '%s' '{"data":[]}' > "$tabs_file"
          python3 - "$tabs_file" "$name" <<'PY' > "$sessions_file"
          import json, sys
          try:
              doc = json.load(open(sys.argv[1]))
          except Exception:
              doc = {}
          for tab in doc.get("data") or []:
              if tab.get("agent_id") == sys.argv[2] and tab.get("session_name"):
                  print(tab["session_name"])
          PY
          while read -r session; do
            [ -n "$session" ] && curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs/$session" >/dev/null || true
          done < "$sessions_file"
          curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name" >/dev/null || true
        intent: Reset the case-owned agent and any surviving terminal tabs before independently replaying this path.
  ensure-lead-agent:
    params:
      - name
    steps:
      - use: remove-case-agent-and-tabs
        with:
          name: "{{name}}"
      - api:
          method: POST
          path: /api/workspaces/E2E-WS-LEAD/agents
          body:
            name: "{{name}}"
            role_name: lead
            auto: false
            cross_repo: true
            repos: []
            backend: codex
          status: 201
        intent: Create the independent path prerequisite as a codex-backed interactive Lead.
  prepare-primary-lead:
    steps:
      - use: ensure-lead-agent
        with:
          name: atlas-${RUN_ID:-local}
  assign-primary-lead:
    steps:
      - api:
          method: POST
          path: /api/workspaces/E2E-WS-LEAD/issues
          body:
            title: lead badge prerequisite ${RUN_ID:-local}-${AFT_CASE_ID:-local}
            issue_type: epic
            priority: 2
          status: 201
          save:
            - from: data.id
              as: prerequisiteAssignedEpicId
        intent: Create the assigned epic prerequisite for the Lead claim-badge path.
      - api:
          method: PATCH
          path: /api/workspaces/E2E-WS-LEAD/agents/atlas-${RUN_ID:-local}
          body:
            parent: ${var:prerequisiteAssignedEpicId}
          status: 200
        intent: Assign the primary Lead to the prerequisite epic before reviewing lane badges.
