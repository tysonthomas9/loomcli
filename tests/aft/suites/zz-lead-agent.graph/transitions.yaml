kind: graph-transitions
version: 1
flow: lead-agents
group: legacy-scenario-leaves
transitions:
  prove-01-terminal-page-increments-codex-lead-tab-names:
    intent: An operator opens the Terminal page and adds a second codex lead tab whose label and session name increment without collision
    actor: human
    via: ui
    steps:
      - use: case-01-terminal-page-increments-codex-lead-tab-names
  prove-02-shell-lead-tab-is-not-an-ai-lead-runtime:
    intent: An operator adds a shell tab from the lead terminal menu and verifies it is a login shell session rather than a loom lead runtime
    actor: human
    via: ui
    steps:
      - use: case-02-shell-lead-tab-is-not-an-ai-lead-runtime
  prove-03-lead-template-creates-an-interactive-lead-agent-and-role:
    intent: An operator creates a Lead agent through CreateAgentModal and verifies the stored agent, role, and absence of an agent worktree
    actor: human
    via: ui
    steps:
      - use: case-03-lead-template-creates-an-interactive-lead-agent-and-role
  prove-04-lead-backend-dropdown-selects-the-runtime:
    intent: An operator creates a Lead agent with the Claude backend selected and verifies the choice reaches the agent record and launch spec
    actor: human
    via: ui
    steps:
      - use: case-04-lead-backend-dropdown-selects-the-runtime
  prove-05-lead-repo-scope-round-trips-workspace-wide-and-pinned-ch:
    intent: An operator creates one workspace-wide Lead and one repo-pinned Lead and verifies the derived repo scope on both agent records
    actor: human
    via: ui
    steps:
      - use: case-05-lead-repo-scope-round-trips-workspace-wide-and-pinned-ch
  prove-06-lead-name-validation-blocks-invalid-submit:
    intent: An operator cannot submit invalid Lead agent names, while uppercase input is normalized into a valid stored name
    actor: human
    via: ui
    steps:
      - use: case-06-lead-name-validation-blocks-invalid-submit
  prove-07-duplicate-lead-name-renders-the-server-error-inline:
    intent: An operator retrying an existing Lead agent name sees the server conflict in the dialog without creating another agent
    actor: human
    via: ui
    steps:
      - use: case-07-duplicate-lead-name-renders-the-server-error-inline
  prove-08-second-lead-reuses-the-existing-lead-role:
    intent: An operator creates a second Lead agent and verifies both agents share the single workspace lead role
    actor: human
    via: ui
    steps:
      - use: case-08-second-lead-reuses-the-existing-lead-role
  prove-09-unassigned-lead-reads-no-epic-assigned-without-idle-nois:
    intent: An operator viewing a fresh unassigned Lead sees the no-epic header state and does not see a leading idle status segment
    actor: human
    via: ui
    steps:
      - use: case-09-unassigned-lead-reads-no-epic-assigned-without-idle-nois
  prove-10-lead-work-panel-offers-epic-filters-while-worker-panel-d:
    intent: An operator sees Lead-only epic filter pills on an unassigned Lead agent, while a task worker receives task-status filters instead
    actor: human
    via: ui
    steps:
      - use: case-10-lead-work-panel-offers-epic-filters-while-worker-panel-d
  prove-11-opening-a-lead-agent-launches-loom-lead-with-attribution:
    intent: An operator opens a Lead agent and verifies the embedded terminal is backed by a loom lead launch spec for that exact agent
    actor: human
    via: ui
    steps:
      - use: case-11-opening-a-lead-agent-launches-loom-lead-with-attribution
  prove-12-starting-a-lead-terminal-creates-its-orchestration-sessi:
    intent: An operator verifies the lead terminal's orchestration session id is stable and matches the id inherited by the child launch environment
    actor: system
    via: cli
    steps:
      - use: case-12-starting-a-lead-terminal-creates-its-orchestration-sessi
  prove-13-reopening-a-lead-reuses-its-terminal-session:
    intent: An operator returning to their Lead agent reattaches to the same terminal session instead of spawning a second agent-bound tab
    actor: human
    via: ui
    steps:
      - use: case-13-reopening-a-lead-reuses-its-terminal-session
  prove-14-migrating-a-lead-backend-rebuilds-the-launch-spec:
    intent: An operator switching a Lead agent from codex to claude receives a fresh terminal launch spec while the prior tab's current survival is pinned
    actor: api-client
    via: api
    steps:
      - use: case-14-migrating-a-lead-backend-rebuilds-the-launch-spec
  prove-15-stopped-lead-keeps-its-terminal-pane:
    intent: An operator stopping a Lead agent still sees and can resolve its terminal, unlike stopped daemon workers
    actor: human
    via: ui
    steps:
      - use: case-15-stopped-lead-keeps-its-terminal-pane
  prove-16-deleting-a-lead-leaves-its-terminal-pty-running-until-ta:
    intent: An operator deletes a disposable Lead agent while its terminal is running and observes the current orphan-tab behavior before reclaiming it
    actor: human
    via: ui
    steps:
      - use: case-16-deleting-a-lead-leaves-its-terminal-pty-running-until-ta
  prove-17-assigning-an-epic-marks-the-lead-context-delivery-state:
    intent: An orchestration client assigns an epic to the Lead agent and an operator sees the assigned-epic and captured delivery header state
    actor: human
    via: ui
    steps:
      - use: case-17-assigning-an-epic-marks-the-lead-context-delivery-state
  prove-18-lead-claim-badge-appears-on-the-assigned-epic-lane:
    intent: A reviewer opening the list view can see the lead that owns one epic and the unclaimed state on another epic
    actor: human
    via: ui
    steps:
      - use: case-18-lead-claim-badge-appears-on-the-assigned-epic-lane
  prove-19-slide-over-run-epic-control-is-inert-pinned-defect:
    intent: An operator clicks Run epic from issue detail and verifies the current pinned defect where no epic runner is queued
    actor: human
    via: ui
    steps:
      - use: case-19-slide-over-run-epic-control-is-inert-pinned-defect
  prove-20-list-lane-run-epic-creates-the-same-purpose-named-lead:
    intent: An operator starts an epic run from the list lane control and verifies the same lead naming contract as issue detail
    actor: human
    via: ui
    steps:
      - use: case-20-list-lane-run-epic-creates-the-same-purpose-named-lead
  prove-21-agents-page-run-epic-reuses-the-selected-lead:
    intent: An operator starts an epic run from an unassigned Lead's work panel and verifies the selected lead is reused instead of minting another one
    actor: human
    via: ui
    steps:
      - use: case-21-agents-page-run-epic-reuses-the-selected-lead
  prove-22-leads-sort-ahead-of-workers-in-the-rail:
    intent: An operator with a mixed fleet finds Lead agents ahead of task workers and sees the worker under the Background grouping
    actor: human
    via: ui
    steps:
      - use: case-22-leads-sort-ahead-of-workers-in-the-rail
  prove-23-lead-files-tab-exposes-the-no-worktree-checkout-state:
    intent: An operator browsing files from a Lead agent sees the current missing-checkout state while API readbacks confirm the lead has no agent worktree
    actor: human
    via: ui
    steps:
      - use: case-23-lead-files-tab-exposes-the-no-worktree-checkout-state
  clear-primary-lead:
    intent: The runner clears the primary Lead identity before the independent UI creation path.
    actor: system
    via: cli
    steps:
      - use: remove-case-agent-and-tabs
        with:
          name: atlas-${RUN_ID:-local}
  prepare-primary-lead:
    intent: An API client creates a fresh primary Lead prerequisite for this independent branch.
    actor: api-client
    via: api
    steps:
      - use: prepare-primary-lead
  start-primary-lead-session:
    intent: The runtime starts a live terminal session required by the session lifecycle branches.
    actor: system
    via: runtime
    steps:
      - use: start-primary-lead-session
  assign-primary-lead:
    intent: An API client gives the primary Lead an epic prerequisite for the claim-badge branch.
    actor: api-client
    via: api
    steps:
      - use: assign-primary-lead
  clear-second-lead:
    intent: The runner clears the secondary Lead identity before the independent UI creation path.
    actor: system
    via: cli
    steps:
      - use: remove-case-agent-and-tabs
        with:
          name: atlas-b-${RUN_ID:-local}
  prepare-second-lead:
    intent: An API client creates a fresh secondary Lead prerequisite for its independent branches.
    actor: api-client
    via: api
    steps:
      - use: ensure-lead-agent
        with:
          name: atlas-b-${RUN_ID:-local}
