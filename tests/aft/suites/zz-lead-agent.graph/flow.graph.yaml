    assign-primary-lead: primary-lead-assigned
    clear-second-lead: second-lead-cleared
    prove-07-duplicate-lead-name-renders-the-server-error-inline: verified-07-duplicate-lead-name-renders-the-server-error-inline
    prove-09-unassigned-lead-reads-no-epic-assigned-without-idle-nois: verified-09-unassigned-lead-reads-no-epic-assigned-without-idle-nois
    prove-11-opening-a-lead-agent-launches-loom-lead-with-attribution: verified-11-opening-a-lead-agent-launches-loom-lead-with-attribution
    prove-17-assigning-an-epic-marks-the-lead-context-delivery-state: verified-17-assigning-an-epic-marks-the-lead-context-delivery-state
    prove-23-lead-files-tab-exposes-the-no-worktree-checkout-state: verified-23-lead-files-tab-exposes-the-no-worktree-checkout-state
  primary-lead-connected:
    prove-12-starting-a-lead-terminal-creates-its-orchestration-sessi: verified-12-starting-a-lead-terminal-creates-its-orchestration-sessi
    prove-13-reopening-a-lead-reuses-its-terminal-session: verified-13-reopening-a-lead-reuses-its-terminal-session
    prove-14-migrating-a-lead-backend-rebuilds-the-launch-spec: verified-14-migrating-a-lead-backend-rebuilds-the-launch-spec
    prove-15-stopped-lead-keeps-its-terminal-pane: verified-15-stopped-lead-keeps-its-terminal-pane
