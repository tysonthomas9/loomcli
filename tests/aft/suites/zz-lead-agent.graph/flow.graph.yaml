kind: graph
version: 1
suite: zz-lead-agent
classification:
  area: agents
  feature: lead-agents
  surface: mixed
  purpose: journey
flow: lead-agents
intent: Operators create, launch, attribute, assign, and inspect interactive Lead agents.
fixtureScope: graph
baseUrl: ${AFT_BASE_URL:-http://127.0.0.1:3100}
setup: |
  set -e
  "$AFT_TESTS_DIR/scripts/clean-test-workspace.sh" E2E-WS-LEAD
  repo="$AFT_WORK_DIR/lead-repo"
  mkdir -p "$repo"
  git -C "$repo" init -q
  printf '%s\n' "lead fixture ${RUN_ID:-local}" > "$repo/README.md"
  git -C "$repo" add README.md
  git -C "$repo" -c user.email=e2e@x -c user.name=e2e commit -q -m init
  python3 -c 'import json,sys; print(json.dumps({"name":sys.argv[1],"type":"empty","repos":[sys.argv[2]]}))' "e2e-ws-lead" "$repo" > "$AFT_WORK_DIR/lead-workspace.json"
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/lead-workspace.json" > "$AFT_WORK_DIR/lead-workspace.resp.json"
  python3 - "${RUN_ID:-local}" > "$AFT_WORK_DIR/lead-worker.json" <<'PY'
  import json, sys
  run = sys.argv[1]
  print(json.dumps({
      "name": f"worker-{run}",
      "role_name": "task",
      "auto": False,
      "cross_repo": True,
      "repos": [],
      "backend": "codex",
  }))
  PY
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents" \
    -H "Content-Type: application/json" \
    -d @"$AFT_WORK_DIR/lead-worker.json" \
    > "$AFT_WORK_DIR/lead-worker.resp.json"
teardown: |
  set +e
  AFT_WS=E2E-WS-LEAD "$AFT_TESTS_DIR/scripts/close-open-issues.sh"
  "$AFT_TESTS_DIR/scripts/clean-test-workspace.sh" E2E-WS-LEAD
imports:
  - shared-steps.yaml
  - steps/terminal-tabs.yaml
  - steps/creation.yaml
  - steps/runtime.yaml
  - steps/epics.yaml
  - steps/rail-and-files.yaml
  - states.yaml
  - transitions.yaml
start: browser-ready
graph:
  browser-ready:
    prove-01-terminal-page-increments-codex-lead-tab-names: verified-01-terminal-page-increments-codex-lead-tab-names
    prove-02-shell-lead-tab-is-not-an-ai-lead-runtime: verified-02-shell-lead-tab-is-not-an-ai-lead-runtime
    prove-04-lead-backend-dropdown-selects-the-runtime: verified-04-lead-backend-dropdown-selects-the-runtime
    prove-05-lead-repo-scope-round-trips-workspace-wide-and-pinned-ch: verified-05-lead-repo-scope-round-trips-workspace-wide-and-pinned-ch
    prove-06-lead-name-validation-blocks-invalid-submit: verified-06-lead-name-validation-blocks-invalid-submit
    prepare-disposable-lead-runtime: disposable-lead-connected
    prove-19-slide-over-run-epic-control-is-inert-pinned-defect: verified-19-slide-over-run-epic-control-is-inert-pinned-defect
    prove-20-list-lane-run-epic-creates-the-same-purpose-named-lead: verified-20-list-lane-run-epic-creates-the-same-purpose-named-lead
    clear-primary-lead: primary-lead-cleared
    prepare-primary-lead: primary-lead-ready
    prepare-second-lead: second-lead-ready
  primary-lead-cleared:
    prove-03-lead-template-creates-an-interactive-lead-agent-and-role: verified-03-lead-template-creates-an-interactive-lead-agent-and-role
  primary-lead-ready:
