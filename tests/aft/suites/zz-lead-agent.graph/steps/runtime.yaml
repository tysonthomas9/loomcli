kind: graph-steps
version: 1
flow: lead-agents
blocks:
  case-09-unassigned-lead-reads-no-epic-assigned-without-idle-nois:
    steps:
      - open: /ws/E2E-WS-LEAD/agents/atlas-${RUN_ID:-local}
      - wait:
          fn: |-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: Wait until the unassigned lead detail page is ready
      - wait:
          fn: |-
            (() => {
              const marker = Array.from(document.querySelectorAll('span'))
                .find((s) => (s.textContent || '').trim() === 'No epic assigned');
              const row = marker ? marker.parentElement : null;
              if (!row) return false;
              const first = row.children[0];
              return !(first && first.tagName === 'SPAN' && first.getAttribute('aria-hidden') === 'true');
            })()
        intent: Wait until the lead header meta row omits the idle status dot segment
  terminal-09-unassigned-lead-reads-no-epic-assigned-without-idle-nois:
    steps:
      - expect:
          text: No epic assigned
  case-10-lead-work-panel-offers-epic-filters-while-worker-panel-d:
    steps:
      - open: /ws/E2E-WS-LEAD/agents/atlas-b-${RUN_ID:-local}
      - wait:
          fn: |-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })() && !!document.querySelector("[role=group][aria-label='Filter epics']")
        intent: Wait until the unassigned lead work panel renders the epic filter group
      - expect:
          count:
            selector: "[role=group][aria-label='Filter epics']"
            equals: 1
      - expect:
          text: Not running
      - open: /ws/E2E-WS-LEAD/agents/worker-${RUN_ID:-local}
      - wait:
          fn: |-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })() && !!document.querySelector("[role=group][aria-label='Filter tasks by status']")
        intent: Wait until the worker detail page renders the task-status filter group
      - expect:
          count:
            selector: "[role=group][aria-label='Filter epics']"
            equals: 0
  terminal-10-lead-work-panel-offers-epic-filters-while-worker-panel-d:
    steps:
      - expect:
          count:
            selector: "[role=group][aria-label='Filter tasks by status']"
            equals: 1
  case-11-opening-a-lead-agent-launches-loom-lead-with-attribution:
    steps:
      - use: open-lead-terminal
        with:
          name: atlas-${RUN_ID:-local}
  terminal-11-opening-a-lead-agent-launches-loom-lead-with-attribution:
    steps:
      - use: controlled-codex-lead-connected
        with:
          name: atlas-${RUN_ID:-local}
      - use: lead-launch-attribution-ready
        with:
          name: atlas-${RUN_ID:-local}
  case-12-starting-a-lead-terminal-creates-its-orchestration-sessi:
    steps:
      - run: |
          set -e
          name="atlas-${RUN_ID:-local}"
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name/terminal/session" > "$AFT_WORK_DIR/lead-d9-session-a.json"
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name/terminal/session" > "$AFT_WORK_DIR/lead-d9-session-b.json"
          python3 - "$AFT_WORK_DIR/lead-d9-session-a.json" "$AFT_WORK_DIR/lead-d9-session-b.json" "$name" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1]))["data"]
          b = json.load(open(sys.argv[2]))["data"]
          assert a.get("session_name") == b.get("session_name"), (a, b)
          assert a.get("agent_id") == sys.argv[3] and b.get("agent_id") == sys.argv[3], (a, b)
          ae = (a.get("launch") or {}).get("env") or {}
          be = (b.get("launch") or {}).get("env") or {}
          assert ae.get("LOOM_ORCHESTRATOR_SESSION_ID", "").startswith("lead-"), ae
          assert ae.get("LOOM_ORCHESTRATOR_SESSION_ID") == be.get("LOOM_ORCHESTRATOR_SESSION_ID"), (ae, be)
          PY
        intent: An operator re-reads the connected Lead terminal session and confirms its identity and inherited orchestration id remain stable.
  terminal-12-starting-a-lead-terminal-creates-its-orchestration-sessi:
    steps:
      - wait:
          fn: |-
            (async () => {
              const name = 'atlas-${RUN_ID:-local}';
              const [monitorResponse, tabsResponse] = await Promise.all([
                fetch('/api/monitor/status?workspace=E2E-WS-LEAD', { cache: 'no-store' }),
                fetch('/api/workspaces/E2E-WS-LEAD/terminal/tabs', { cache: 'no-store' })
              ]);
              if (!monitorResponse.ok || !tabsResponse.ok) return false;
              const monitor = await monitorResponse.json();
              const tabsPayload = await tabsResponse.json();
              const agents = Array.isArray(monitor.agents) ? monitor.agents : [];
              const tabs = Array.isArray(tabsPayload.data) ? tabsPayload.data : [];
              const agent = agents.find((entry) => entry.name === name);
              const sessionId = String(agent?.orchestrator_session_id || '');
              const matches = tabs.filter((tab) => tab.kind === 'agent' && tab.agent_id === name);
              const inheritedIds = matches.map((tab) =>
                String((tab.launch?.env || {}).LOOM_ORCHESTRATOR_SESSION_ID || ''));
              return sessionId.startsWith('lead-') &&
                matches.length > 0 &&
                inheritedIds.includes(sessionId);
            })()
        intent: Confirm monitor status joins the Lead's orchestration session id to the child launch environment after the cache settles.
      - wait:
          fn: |-
            (async () => {
              const [monitorResponse, tabsResponse] = await Promise.all([
                fetch('/api/monitor/status?workspace=E2E-WS-LEAD', { cache: 'no-store' }),
                fetch('/api/workspaces/E2E-WS-LEAD/terminal/tabs', { cache: 'no-store' })
              ]);
              if (!monitorResponse.ok || !tabsResponse.ok) return false;
              const monitor = await monitorResponse.json();
              const tabsPayload = await tabsResponse.json();
              const agents = Array.isArray(monitor.agents) ? monitor.agents : [];
              const tabs = Array.isArray(tabsPayload.data) ? tabsPayload.data : [];
              const agent = agents.find((entry) => entry.name === 'atlas-${RUN_ID:-local}');
              const sessionId = String(agent?.orchestrator_session_id || '');
              const matches = tabs.filter((tab) =>
                tab.agent_id === 'atlas-${RUN_ID:-local}' && tab.kind === 'agent' && tab.pty_alive === true);
              return sessionId.startsWith('lead-') &&
                matches.length === 1 &&
                (matches[0].launch?.env || {}).LOOM_ORCHESTRATOR_SESSION_ID === sessionId;
            })()
        intent: Confirm the connected Lead and its live terminal share the same orchestration session id.
      - expect:
          visible:
            testid: terminal-wrapper
  case-13-reopening-a-lead-reuses-its-terminal-session:
    steps:
      - run: |
          set -e
          name="atlas-${RUN_ID:-local}"
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name/terminal/session" > "$AFT_WORK_DIR/lead-d12-session-a.json"
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name/terminal/session" > "$AFT_WORK_DIR/lead-d12-session-b.json"
          python3 - "$AFT_WORK_DIR/lead-d12-session-a.json" "$AFT_WORK_DIR/lead-d12-session-b.json" "$AFT_WORK_DIR/leadSession-atlas-d12" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1]))["data"]
          b = json.load(open(sys.argv[2]))["data"]
          assert a.get("session_name") == b.get("session_name"), (a, b)
          open(sys.argv[3], "w", encoding="utf-8").write(a["session_name"])
          PY
        intent: An operator records the current lead terminal session and confirms immediate session reuse
      - open: /ws/E2E-WS-LEAD/kanban
      - wait:
          fn: "!!document.querySelector('[data-testid=board-toolbar]')"
        intent: Wait until the kanban page is ready before returning to the lead
      - open: /ws/E2E-WS-LEAD/agents/atlas-${RUN_ID:-local}
      - wait:
          fn: "!!document.querySelector('[data-testid=terminal-wrapper][data-terminal-renderer=xterm] .xterm')"
        intent: Wait until the returning lead detail page reattaches a terminal
      - run: |
          set -e
          name="atlas-${RUN_ID:-local}"
          want="$(cat "$AFT_WORK_DIR/leadSession-atlas-d12")"
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name/terminal/session" > "$AFT_WORK_DIR/lead-d12-session-c.json"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$AFT_WORK_DIR/lead-d12-tabs.json"
          python3 - "$AFT_WORK_DIR/lead-d12-session-c.json" "$AFT_WORK_DIR/lead-d12-tabs.json" "$name" "$want" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1]))["data"]
          tabs = json.load(open(sys.argv[2])).get("data") or []
          name, want = sys.argv[3], sys.argv[4]
          assert c.get("session_name") == want, c
          matches = [t for t in tabs if t.get("kind") == "agent" and t.get("agent_id") == name]
          assert len(matches) == 1, tabs
          assert matches[0].get("session_name") == want, matches[0]
          PY
        intent: An operator confirms navigation away and back still leaves exactly one agent-bound lead tab
  terminal-13-reopening-a-lead-reuses-its-terminal-session:
    steps:
      - use: controlled-codex-lead-connected
        with:
          name: atlas-${RUN_ID:-local}
  case-14-migrating-a-lead-backend-rebuilds-the-launch-spec:
    steps:
      - run: |
          set -e
          name="atlas-${RUN_ID:-local}"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$AFT_WORK_DIR/lead-d13-before-tabs.json"
          python3 - "$AFT_WORK_DIR/lead-d13-before-tabs.json" "$AFT_WORK_DIR/leadSession-atlas" "$name" <<'PY'
          import json, sys
          tabs = json.load(open(sys.argv[1])).get("data") or []
          session_file, name = sys.argv[2], sys.argv[3]
          matches = [t for t in tabs if t.get("agent_id") == name and t.get("backend") == "codex" and t.get("pty_alive") is True]
          assert len(matches) == 1, tabs
          assert ((matches[0].get("launch") or {}).get("env") or {}).get("LOOM_BACKEND") == "codex", matches[0]
          open(session_file, "w", encoding="utf-8").write(matches[0]["session_name"])
          PY
        intent: An operator records the connected Codex terminal before changing the Lead's backend.
      - api:
          method: PATCH
          path: /api/workspaces/E2E-WS-LEAD/agents/atlas-${RUN_ID:-local}
          body:
            backend: claude
          status: 200
        intent: An operator changes the Lead's configured backend to Claude.
      - run: |
          set -e
          name="atlas-${RUN_ID:-local}"
          old="$(cat "$AFT_WORK_DIR/leadSession-atlas")"
          # budget: terminal-launch (40s) - backend switch replaces session metadata after launch.
          for i in $(seq 1 20); do
            curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name/terminal/session" > "$AFT_WORK_DIR/lead-d13-session.json" &&
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$AFT_WORK_DIR/lead-d13-after-tabs.json" &&
            python3 - "$AFT_WORK_DIR/lead-d13-session.json" "$AFT_WORK_DIR/lead-d13-after-tabs.json" "$old" "$AFT_WORK_DIR/leadSession-atlas-claude" <<'PY' && exit 0
          import json, sys
          meta = json.load(open(sys.argv[1]))["data"]
          tabs = json.load(open(sys.argv[2])).get("data") or []
          old = sys.argv[3]
          assert meta.get("session_name") != old, meta
          assert meta.get("backend") == "claude", meta
          launch = meta.get("launch") or {}
          argv = " ".join(str(x) for x in (launch.get("argv") or []))
          env = launch.get("env") or {}
          assert "'--backend' 'claude'" in argv, argv
          assert env.get("LOOM_BACKEND") == "claude", env
          old_tabs = [t for t in tabs if t.get("session_name") == old]
          assert old_tabs, "old tab is gone - product behavior changed, re-pin this case"
          assert old_tabs[0].get("pty_alive") is True, "old PTY was reaped - product behavior changed, re-pin this case"
          open(sys.argv[4], "w", encoding="utf-8").write(meta["session_name"])
          PY
            sleep 2
          done
          echo "lead backend migration did not return a fresh claude launch spec"
          cat "$AFT_WORK_DIR/lead-d13-session.json" 2>/dev/null || true
          cat "$AFT_WORK_DIR/lead-d13-after-tabs.json" 2>/dev/null || true
          exit 1
        intent: An operator confirms the fresh Claude launch spec while the prior Codex PTY remains live; this does not claim Claude connected.
  terminal-14-migrating-a-lead-backend-rebuilds-the-launch-spec:
    steps:
      - use: controlled-codex-lead-connected
        with:
          name: atlas-${RUN_ID:-local}
  case-15-stopped-lead-keeps-its-terminal-pane:
    steps:
      - api:
          method: POST
          path: /api/workspaces/E2E-WS-LEAD/agents/atlas-${RUN_ID:-local}/stop
          status: 200
        intent: An operator stops the connected Lead through the lifecycle API.
      - use: open-lead-terminal
        with:
          name: atlas-${RUN_ID:-local}
      - run: |
          set -e
          name="atlas-${RUN_ID:-local}"
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name/terminal/session" > "$AFT_WORK_DIR/lead-d14-session.json"
          python3 - "$AFT_WORK_DIR/lead-d14-session.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))["data"]
          assert d.get("agent_id") == sys.argv[2], d
          assert d.get("launch"), d
          assert d.get("writable") is True, d
          PY
        intent: An operator confirms the stopped interactive Lead still resolves a writable terminal launch spec.
  terminal-15-stopped-lead-keeps-its-terminal-pane:
    steps:
      - use: controlled-codex-lead-connected
        with:
          name: atlas-${RUN_ID:-local}
      - wait:
          fn: |-
            (async () => {
              const response = await fetch('/api/workspaces/E2E-WS-LEAD/agents', { cache: 'no-store' });
              if (!response.ok) return false;
              const payload = await response.json();
              const data = payload.data ?? payload;
              const agents = Array.isArray(data) ? data : (Array.isArray(data.agents) ? data.agents : []);
              const lead = agents.find((agent) => agent.name === 'atlas-${RUN_ID:-local}');
              return lead?.desired_state === 'stopped';
            })()
        intent: Confirm the Lead remains explicitly stopped while its existing terminal stays available for review.
      - expect:
          notText: This agent does not have a live terminal session.
  prepare-disposable-lead-runtime:
    steps:
      - api:
          method: POST
          path: /api/workspaces/E2E-WS-LEAD/agents
          body:
            name: doomed-${RUN_ID:-local}
            role_name: lead
            auto: false
            cross_repo: true
            repos: []
            backend: codex
          status: 201
        intent: An operator creates a disposable Lead whose live terminal can be observed before deletion.
      - use: open-lead-terminal
        with:
          name: doomed-${RUN_ID:-local}
  delete-disposable-lead:
    steps:
      - run: |
          set -e
          name="doomed-${RUN_ID:-local}"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$AFT_WORK_DIR/lead-d15-tabs-before.json"
          python3 - "$AFT_WORK_DIR/lead-d15-tabs-before.json" "$AFT_WORK_DIR/leadSession-doomed" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          tabs = d.get("data") or []
          assert isinstance(tabs, list), type(tabs)
          name = sys.argv[3]
          matches = [t for t in tabs if t.get("kind") == "agent" and t.get("agent_id") == name]
          assert len(matches) == 1, tabs
          tab = matches[0]
          assert tab.get("role") == "lead", tab
          assert tab.get("backend") == "codex", tab
          assert tab.get("pty_alive") is True, tab
          assert ((tab.get("launch") or {}).get("env") or {}).get("LOOM_AGENT_NAME") == name, tab
          open(sys.argv[2], "w", encoding="utf-8").write(tab["session_name"])
          PY
        intent: An operator records the exact live controlled-Codex terminal that belongs to the disposable Lead.
      - api:
          method: DELETE
          path: /api/workspaces/E2E-WS-LEAD/agents/doomed-${RUN_ID:-local}
          status: 200
        intent: An operator deletes the disposable Lead while its connected terminal is still running.
      - api:
          method: POST
          path: /api/workspaces/E2E-WS-LEAD/agents/doomed-${RUN_ID:-local}/terminal/session
          status: 404
          assert:
            - path: error
              contains: agent not found
        intent: Confirm the deleted Lead can no longer resolve a new terminal session.
  reclaim-disposable-lead-terminal:
    steps:
      - run: |
          set -e
          session="$(cat "$AFT_WORK_DIR/leadSession-doomed")"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$AFT_WORK_DIR/lead-d15-tabs-after.json"
          python3 - "$AFT_WORK_DIR/lead-d15-tabs-after.json" "$session" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          tabs = d.get("data") or []
          assert isinstance(tabs, list), type(tabs)
          matches = [t for t in tabs if t.get("session_name") == sys.argv[2]]
          assert matches, "orphan tab is gone - product behavior changed, re-pin this case"
          assert matches[0].get("pty_alive") is True, "orphan PTY was reaped - product behavior changed, re-pin this case"
          PY
        intent: Confirm the deleted Lead still leaves its exact controlled-Codex terminal alive as an orphaned tab.
      - run: |
          set -e
          session="$(cat "$AFT_WORK_DIR/leadSession-doomed")"
          curl -sf -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs/$session" >/dev/null
          for i in $(seq 1 20); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$AFT_WORK_DIR/lead-d15-tabs-cleanup.json" &&
            python3 - "$AFT_WORK_DIR/lead-d15-tabs-cleanup.json" "$session" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          tabs = d.get("data")
          assert isinstance(tabs, list), d
          assert not [t for t in tabs if t.get("session_name") == sys.argv[2]], tabs
          PY
            sleep 1
          done
          echo "orphaned disposable Lead terminal was not reclaimed"
          cat "$AFT_WORK_DIR/lead-d15-tabs-cleanup.json" 2>/dev/null || true
          exit 1
        intent: An operator explicitly reclaims the orphaned terminal tab and confirms its PTY is gone.
      - open: /ws/E2E-WS-LEAD/kanban
        intent: An operator returns to the active workspace after reclaiming the disposable Lead terminal.
      - wait:
          fn: "!!document.querySelector('[data-testid=board-toolbar]')"
        intent: Wait until the workspace board is ready for continued work.
  terminal-16-deleting-a-lead-leaves-its-terminal-pty-running-until-ta:
    steps:
      - wait:
          fn: |-
            (async () => {
              const response = await fetch('/api/workspaces/E2E-WS-LEAD/terminal/tabs', { cache: 'no-store' });
              if (!response.ok) return false;
              const payload = await response.json();
              const tabs = Array.isArray(payload.data) ? payload.data : [];
              return !tabs.some((tab) => tab.agent_id === 'doomed-${RUN_ID:-local}');
            })()
        intent: Confirm no terminal tab remains bound to the reclaimed disposable Lead.
      - expect:
          visible:
            testid: board-toolbar
