kind: graph-states
version: 1
flow: lead-agents
states:
  browser-ready:
    intent: A fresh graph path begins in the runner's blank browser page.
    assert:
      - expect:
          url: about:blank
  verified-01-terminal-page-increments-codex-lead-tab-names:
    intent: terminal page increments codex lead tab names
    testIntent: An operator opens the Terminal page and adds a second codex lead tab whose label and session name increment without collision
    terminal: true
    assert:
      - use: terminal-01-terminal-page-increments-codex-lead-tab-names
  verified-02-shell-lead-tab-is-not-an-ai-lead-runtime:
    intent: shell lead tab is not an AI lead runtime
    testIntent: An operator adds a shell tab from the lead terminal menu and verifies it is a login shell session rather than a loom lead runtime
    terminal: true
    assert:
      - use: terminal-02-shell-lead-tab-is-not-an-ai-lead-runtime
  verified-03-lead-template-creates-an-interactive-lead-agent-and-role:
    intent: lead template creates an interactive lead agent and role
    testIntent: An operator creates a Lead agent through CreateAgentModal and verifies the stored agent, role, and absence of an agent worktree
    terminal: true
    assert:
      - use: terminal-03-lead-template-creates-an-interactive-lead-agent-and-role
  verified-04-lead-backend-dropdown-selects-the-runtime:
    intent: The Claude-backed Lead is connected to the selected runtime with exact attribution.
    testIntent: An operator creates a Lead with Claude selected, opens that exact agent, and sees its controlled Claude terminal connected with the matching live launch metadata
    terminal: true
    assert:
      - use: terminal-04-lead-backend-dropdown-selects-the-runtime
  verified-05-lead-repo-scope-round-trips-workspace-wide-and-pinned-ch:
    intent: lead repo scope round trips workspace-wide and pinned choices
    testIntent: An operator creates one workspace-wide Lead and one repo-pinned Lead and verifies the derived repo scope on both agent records
    terminal: true
    assert:
      - use: terminal-05-lead-repo-scope-round-trips-workspace-wide-and-pinned-ch
  verified-06-lead-name-validation-blocks-invalid-submit:
    intent: lead name validation blocks invalid submit
    testIntent: An operator cannot submit invalid Lead agent names, while uppercase input is normalized into a valid stored name
    terminal: true
    assert:
      - use: terminal-06-lead-name-validation-blocks-invalid-submit
  verified-07-duplicate-lead-name-renders-the-server-error-inline:
    intent: duplicate lead name renders the server error inline
    testIntent: An operator retrying an existing Lead agent name sees the server conflict in the dialog without creating another agent
    terminal: true
    assert:
      - use: terminal-07-duplicate-lead-name-renders-the-server-error-inline
  verified-08-second-lead-reuses-the-existing-lead-role:
    intent: second lead reuses the existing lead role
    testIntent: An operator creates a second Lead agent and verifies both agents share the single workspace lead role
    terminal: true
    assert:
      - use: terminal-08-second-lead-reuses-the-existing-lead-role
  verified-09-unassigned-lead-reads-no-epic-assigned-without-idle-nois:
    intent: unassigned lead reads no epic assigned without idle noise
    testIntent: An operator viewing a fresh unassigned Lead sees the no-epic header state and does not see a leading idle status segment
    terminal: true
    assert:
      - use: terminal-09-unassigned-lead-reads-no-epic-assigned-without-idle-nois
  verified-10-lead-work-panel-offers-epic-filters-while-worker-panel-d:
    intent: lead work panel offers epic filters while worker panel does not
    testIntent: An operator sees Lead-only epic filter pills on an unassigned Lead agent, while a task worker receives task-status filters instead
    terminal: true
    assert:
      - use: terminal-10-lead-work-panel-offers-epic-filters-while-worker-panel-d
  verified-11-opening-a-lead-agent-launches-loom-lead-with-attribution:
    intent: The default Lead is connected to controlled Codex with exact workspace attribution.
    testIntent: An operator opens a Lead and sees a connected controlled Codex terminal whose live launch metadata belongs to that exact agent and workspace
    terminal: true
    assert:
      - use: terminal-11-opening-a-lead-agent-launches-loom-lead-with-attribution
  verified-12-starting-a-lead-terminal-creates-its-orchestration-sessi:
    intent: The connected Lead keeps one stable orchestration session across every readback.
    testIntent: An operator verifies the connected Lead terminal keeps one orchestration session id matching the id inherited by its child launch environment
    terminal: true
    assert:
      - use: terminal-12-starting-a-lead-terminal-creates-its-orchestration-sessi
  verified-13-reopening-a-lead-reuses-its-terminal-session:
    intent: Returning to the Lead reattaches its original connected terminal.
    testIntent: An operator returning to the connected Lead reattaches to the same terminal session instead of spawning a second agent-bound tab
    terminal: true
    assert:
      - use: terminal-13-reopening-a-lead-reuses-its-terminal-session
  verified-14-migrating-a-lead-backend-rebuilds-the-launch-spec:
    intent: Switching to Claude builds a fresh launch spec while the prior Codex terminal survives.
    testIntent: An operator switching a connected Lead from Codex to Claude receives a fresh Claude launch spec while the prior Codex terminal remains live; Claude connection is not asserted
    terminal: true
    assert:
      - use: terminal-14-migrating-a-lead-backend-rebuilds-the-launch-spec
  verified-15-stopped-lead-keeps-its-terminal-pane:
    intent: Stopping the Lead keeps its connected terminal pane available.
    testIntent: An operator stopping a connected Lead still sees and can resolve its existing terminal, unlike stopped daemon workers
    terminal: true
    assert:
      - use: terminal-15-stopped-lead-keeps-its-terminal-pane
  verified-16-deleting-a-lead-leaves-its-terminal-pty-running-until-ta:
    intent: Deleting the Lead leaves one live orphan terminal until its tab is explicitly reclaimed.
    testIntent: An operator deletes a connected disposable Lead, observes its live orphan terminal, then reclaims that tab and returns to the active workspace
    terminal: true
    assert:
      - use: terminal-16-deleting-a-lead-leaves-its-terminal-pty-running-until-ta
  verified-17-assigning-an-epic-marks-the-lead-context-delivery-state:
    intent: assigning an epic marks the lead context delivery state
    testIntent: An orchestration client assigns an epic to the Lead agent and an operator sees the assigned-epic and captured delivery header state
    terminal: true
    assert:
      - use: terminal-17-assigning-an-epic-marks-the-lead-context-delivery-state
  verified-18-lead-claim-badge-appears-on-the-assigned-epic-lane:
    intent: lead claim badge appears on the assigned epic lane
    testIntent: A reviewer opening the list view can see the lead that owns one epic and the unclaimed state on another epic
    terminal: true
    assert:
      - use: terminal-18-lead-claim-badge-appears-on-the-assigned-epic-lane
  verified-19-slide-over-run-epic-control-is-inert-pinned-defect:
    intent: slide-over run epic control is inert -- pinned defect
    testIntent: An operator clicks Run epic from issue detail and verifies the current pinned defect where no epic runner is queued
    terminal: true
    assert:
      - use: terminal-19-slide-over-run-epic-control-is-inert-pinned-defect
  verified-20-list-lane-run-epic-creates-the-same-purpose-named-lead:
    intent: list lane run epic creates the same purpose-named lead
    testIntent: An operator starts an epic run from the list lane control and verifies the same lead naming contract as issue detail
    terminal: true
    assert:
      - use: terminal-20-list-lane-run-epic-creates-the-same-purpose-named-lead
  verified-21-agents-page-run-epic-reuses-the-selected-lead:
    intent: agents page run epic reuses the selected lead
    testIntent: An operator starts an epic run from an unassigned Lead's work panel and verifies the selected lead is reused instead of minting another one
    terminal: true
    assert:
      - use: terminal-21-agents-page-run-epic-reuses-the-selected-lead
  verified-22-leads-sort-ahead-of-workers-in-the-rail:
    intent: leads sort ahead of workers in the rail
    testIntent: An operator with a mixed fleet finds Lead agents ahead of task workers and sees the worker under the Background grouping
    terminal: true
    assert:
      - use: terminal-22-leads-sort-ahead-of-workers-in-the-rail
  verified-23-lead-files-tab-exposes-the-no-worktree-checkout-state:
    intent: lead files tab exposes the no-worktree checkout state
    testIntent: An operator browsing files from a Lead agent sees the current missing-checkout state while API readbacks confirm the lead has no agent worktree
    terminal: true
    assert:
      - use: terminal-23-lead-files-tab-exposes-the-no-worktree-checkout-state
  primary-lead-cleared:
    intent: The primary Lead identity is free for an independent UI creation path.
    assert:
      - expect:
          url: about:blank
  primary-lead-ready:
    intent: A fresh, unassigned primary Lead exists for this independent branch.
    assert:
      - expect:
          url: about:blank
  primary-lead-connected:
    intent: The primary Lead has completed controlled Codex bootstrap for independent lifecycle checks.
    assert:
      - use: controlled-codex-lead-connected
        with:
          name: atlas-${RUN_ID:-local}
  primary-lead-assigned:
    intent: The primary Lead is assigned to a case-owned prerequisite epic.
    assert:
      - expect:
          url: about:blank
  second-lead-cleared:
    intent: The secondary Lead identity is free for an independent UI creation path.
    assert:
      - expect:
          url: about:blank
  second-lead-ready:
    intent: A fresh, unassigned secondary Lead exists for this independent branch.
    assert:
      - expect:
          url: about:blank
  disposable-lead-connected:
    intent: The disposable Lead is connected to controlled Codex before deletion.
    assert:
      - use: controlled-codex-lead-connected
        with:
          name: doomed-${RUN_ID:-local}
  disposable-lead-orphaned:
    intent: The deleted Lead's controlled Codex terminal remains live as an orphaned tab.
    assert:
      - use: controlled-codex-lead-connected
        with:
          name: doomed-${RUN_ID:-local}
