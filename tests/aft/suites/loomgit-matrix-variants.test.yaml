# PX.7 Git settings matrix: lead, negative, recovery and dependent-run variants N1-N4, R1, D1-D3, X1-X2. Generated by tests/aft/scripts/gen-matrix-suites.py;
# edit the generator, not this file. Fake-forge tier: runs on every make test-aft (--suite 'loomgit-matrix-*' --no-agent).
suite: loomgit-matrix-variants
classification: { area: git, feature: git-settings-matrix, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: >-
  for c in n1 n2 n3 n4 r1 d1 d2 d3 x1 x2; do bash "$AFT_TESTS_DIR/scripts/loomgit-matrix.sh" teardown "$c" || true; done
