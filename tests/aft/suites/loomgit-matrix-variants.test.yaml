# PX.7 Git settings matrix: lead, negative and recovery variants L1, N1-N3, R1. Generated by tests/aft/scripts/gen-matrix-suites.py;
# edit the generator, not this file. Fake-forge tier: runs on every make test-aft (--suite 'loomgit-matrix-*' --no-agent).
suite: loomgit-matrix-variants
classification: { area: git, feature: git-settings-matrix, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: >-
  for c in l1 n1 n2 n3 r1; do bash "$AFT_TESTS_DIR/scripts/loomgit-matrix.sh" teardown "$c" || true; done
tests:
  - name: "L1 Mid-session epic assignment to a running lead"
    intent: "The seam live-interactive ll-lead-assignment leaves open: assignment delivered into a lead that is already running"
    steps:
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" setup l1"
        intent: "Fixture: one repo, one Loom workspace and its lead (real tier: a clone of the run's sandbox repo)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-start l1"
        intent: "Real tier: the workspace's real codex lead is started from its agent page and its controlled runtime comes up"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-epic-midsession l1"
        intent: "Real tier: an epic assigned to the ALREADY RUNNING lead is delivered to it mid-session (fake tier: no running lead, skipped)"
  - name: "N1 The lead's CLI approve cannot bypass Lead may approve off"
    intent: "loom git approve run by the lead must not record a human approval"
    steps:
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" setup n1"
        intent: "Fixture: one repo, one Loom workspace and its lead (real tier: a clone of the run's sandbox repo)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-start n1"
        intent: "Real tier: the workspace's real codex lead is started from its agent page and its controlled runtime comes up"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" settings n1 stack off off"
        intent: "Human sets Delivery mode stack, Lead may approve off, Lead may merge off in Settings > Git; the server and a reload agree"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" task n1 a -"
        intent: "API client creates task a in its own epic and starts its run; it writes its own file"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n1 a 1 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (1/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n1 a 2 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (2/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n1 a 3 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (3/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n1 a 4 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (4/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-do n1 cli-approve a refused"
        intent: "The lead (a real codex lead, told mid-session in its terminal, on the real tier) runs loom git approve on A with Lead may approve off; no verdict is recorded and A stays in review"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" no-pr n1 a 5"
        intent: "No PR opens"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" open-task n1 a"
        intent: "Human opens task a"
      - click:
          role: tab
          name: Changes
          exact: true
        intent: "Human opens the Changes tab of task a"
      - wait:
          fn: "!!document.querySelector('[data-testid=task-changes-tab]')"
        intent: The Changes panel is mounted
      - wait:
          text: matrix-n1-a.txt
        intent: The task's file is in the diff
      - expect:
          enabled:
            testid: approve-create-pr
        intent: "Approve and create PR is offered for task a"
      - click:
          testid: approve-create-pr
        intent: "Human clicks Approve and create PR on task a"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" pr n1 a main"
        intent: "PR of a opens on the forge based on main, and the task shows it"
  - name: "N2 Approve and merge on a red PR, then recovery"
    intent: "A red PR's Approve and merge blocks; a review fix-up cancels it; approving the green fix-up merges"
    steps:
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" setup n2"
        intent: "Fixture: one repo, one Loom workspace and its lead (real tier: a clone of the run's sandbox repo)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-start n2"
        intent: "Real tier: the workspace's real codex lead is started from its agent page and its controlled runtime comes up"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" settings n2 trunk off off"
        intent: "Human sets Delivery mode trunk, Lead may approve off, Lead may merge off in Settings > Git; the server and a reload agree"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" task n2 a - FAIL"
        intent: "API client creates task a in its own epic and starts its run; it writes a file containing FAIL, so its check is red"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n2 a 1 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (1/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n2 a 2 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (2/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n2 a 3 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (3/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n2 a 4 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (4/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" open-task n2 a"
        intent: "Human opens task a"
      - click:
          role: tab
          name: Changes
          exact: true
        intent: "Human opens the Changes tab of task a"
      - wait:
          fn: "!!document.querySelector('[data-testid=task-changes-tab]')"
        intent: The Changes panel is mounted
      - wait:
          text: matrix-n2-a.txt
        intent: The task's file is in the diff
      - expect:
          enabled:
            testid: approve-create-pr
        intent: "Approve and create PR is offered for task a"
      - click:
          testid: approve-create-pr
        intent: "Human clicks Approve and create PR on task a"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" pr n2 a main"
        intent: "PR of a opens on the forge based on main, and the task shows it"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" checks n2 a red"
        intent: "A's required check is red"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" open-task n2 a"
        intent: "Human opens task a"
      - wait:
          fn: "!!document.querySelector('[data-testid=approve-merge]:not([disabled])')"
        intent: "Approve and merge is offered for task a"
      - click:
          testid: approve-merge
        intent: "Human clicks Approve and merge on task a"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" merge-state n2 a blocked"
        intent: "Approve and merge on red A waits as blocked"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" hold-open n2 6 a"
        intent: "Red A does not merge"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" comment n2 a 'The check fails: remove the line FAIL from matrix-n2-a.txt and keep the rest.'"
        intent: "A reviewer asks for A's fix"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" fixup n2 a green"
        intent: "The feedback agent removes FAIL"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" fixup-pushed n2 a"
        intent: "A's PR is updated with the fix-up"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" merge-state n2 a cancelled 'approve it again'"
        intent: "The fix-up cancels the old Approve and merge"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" checks n2 a green"
        intent: "A is green now"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" open-task n2 a"
        intent: "Human opens task a"
      - wait:
          fn: "!!document.querySelector('[data-testid=approve-merge]:not([disabled])')"
        intent: "Approve and merge is offered for task a"
      - click:
          testid: approve-merge
        intent: "Human clicks Approve and merge on task a"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" merged n2 a"
        intent: "The second Approve and merge merges A"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" ui n2 a merged"
        intent: "Task A shows its PR merged"
  - name: "N3 The lead's merge request needs a human"
    intent: "With Lead may merge off the lead can only request a merge; it runs after a human confirms"
    steps:
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" setup n3"
        intent: "Fixture: one repo, one Loom workspace and its lead (real tier: a clone of the run's sandbox repo)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-start n3"
        intent: "Real tier: the workspace's real codex lead is started from its agent page and its controlled runtime comes up"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" settings n3 stack on off"
        intent: "Human sets Delivery mode stack, Lead may approve on, Lead may merge off in Settings > Git; the server and a reload agree"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" task n3 a -"
        intent: "API client creates task a in its own epic and starts its run; it writes its own file"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n3 a 1 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (1/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n3 a 2 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (2/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n3 a 3 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (3/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n3 a 4 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (4/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-do n3 approve a ok"
        intent: "The lead (a real codex lead, told mid-session in its terminal, on the real tier) approves task a; Loom records a policy verdict by the lead and opens its PR"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" pr n3 a main"
        intent: "PR of a opens on the forge based on main, and the task shows it"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" task n3 b a"
        intent: "API client creates task b, blocked by task a in its own epic and starts its run; it writes its own file"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n3 b 1 4"
        intent: "Task b runs (real codex on the real tier) until it records a revision and waits in review (1/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n3 b 2 4"
        intent: "Task b runs (real codex on the real tier) until it records a revision and waits in review (2/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n3 b 3 4"
        intent: "Task b runs (real codex on the real tier) until it records a revision and waits in review (3/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev n3 b 4 4"
        intent: "Task b runs (real codex on the real tier) until it records a revision and waits in review (4/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-do n3 approve b ok"
        intent: "The lead (a real codex lead, told mid-session in its terminal, on the real tier) approves task b; Loom records a policy verdict by the lead and opens its PR"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" pr n3 b a"
        intent: "PR of b opens on the forge based on a, and the task shows it"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-request-merge n3 b"
        intent: "The lead asks a human to merge the stack through B; the request is pending"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" hold-open n3 6 a b"
        intent: "Nothing merges before a human confirms"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" confirm-merge-request n3"
        intent: "A human confirms the lead's request (API: the UI has no confirm control)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" merged n3 a b"
        intent: "A and B merge"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" ui n3 b merged"
        intent: "Task B shows its PR merged"
  - name: "R1 Reject, rerun, approve"
    intent: "A rejected task runs again and its new revision opens the PR"
    steps:
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" setup r1"
        intent: "Fixture: one repo, one Loom workspace and its lead (real tier: a clone of the run's sandbox repo)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" lead-start r1"
        intent: "Real tier: the workspace's real codex lead is started from its agent page and its controlled runtime comes up"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" settings r1 stack off off"
        intent: "Human sets Delivery mode stack, Lead may approve off, Lead may merge off in Settings > Git; the server and a reload agree"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" task r1 a -"
        intent: "API client creates task a in its own epic and starts its run; it writes its own file"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev r1 a 1 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (1/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev r1 a 2 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (2/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev r1 a 3 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (3/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev r1 a 4 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (4/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" open-task r1 a"
        intent: "Human opens task A"
      - click:
          testid: detail-reject-button
        intent: Human clicks Reject on task A
      - fill: { testid: detail-reject-comment, value: "Rejected by the matrix: try again." }
        intent: Human writes why
      - click:
          testid: detail-reject-submit
        intent: Human sends the rejection
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" reject r1 a"
        intent: "Task A is open again, with a reject verdict and no PR"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" rerun r1 a"
        intent: "The epic runner runs A again"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev r1 a 1 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (1/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev r1 a 2 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (2/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev r1 a 3 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (3/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev r1 a 4 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (4/4)"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" open-task r1 a"
        intent: "Human opens task a"
      - click:
          role: tab
          name: Changes
          exact: true
        intent: "Human opens the Changes tab of task a"
      - wait:
          fn: "!!document.querySelector('[data-testid=task-changes-tab]')"
        intent: The Changes panel is mounted
      - wait:
          text: matrix-r1-a.txt
        intent: The task's file is in the diff
      - expect:
          enabled:
            testid: approve-create-pr
        intent: "Approve and create PR is offered for task a"
      - click:
          testid: approve-create-pr
        intent: "Human clicks Approve and create PR on task a"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" pr r1 a main"
        intent: "PR of a opens on the forge based on main, and the task shows it"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" ui r1 a open"
        intent: "Task A shows its PR"
