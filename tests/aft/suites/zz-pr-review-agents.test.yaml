# PR Review interactive agent-template coverage. This suite owns its workspace
# because built-in interactive agents leave durable role rows behind.
suite: zz-pr-review-agents
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: |
  set -e
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-PRR" >/dev/null || true
  repo="$AFT_WORK_DIR/prr-repo"
  mkdir -p "$repo"
  git -C "$repo" init -q
  git -C "$repo" -c user.email=e2e@x -c user.name=e2e commit --allow-empty -m init -q
  python3 -c 'import json,sys; print(json.dumps({"name":sys.argv[1],"type":"empty","repos":[sys.argv[2]]}))' "e2e-ws-prr" "$repo" > "$AFT_WORK_DIR/prr-workspace.json"
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/prr-workspace.json" > "$AFT_WORK_DIR/prr-workspace.resp.json"
teardown: |
  set +e
  AFT_WS=E2E-WS-PRR "$AFT_TESTS_DIR/scripts/close-open-issues.sh"
  for agent in "prr-${RUN_ID:-local}" "prr2-${RUN_ID:-local}" "prrbad-${RUN_ID:-local}" "prrhidden-${RUN_ID:-local}"; do
    curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-PRR/agents/$agent" >/dev/null || true
  done
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-PRR" >/dev/null || true

tests:
  # covers: PRR-D1; CreateAgentModal PR Review template; POST /api/workspaces/:ws/agents; GET /api/workspaces/:ws/agents
  - name: modal creates a PR Review interactive agent
    intent: An operator creates a PR Review terminal agent from the agent templates and verifies the stored agent uses the built-in PR-review role
    steps:
      - open: /ws/E2E-WS-PRR/agents
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the PRR workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-interactive-pr-review }
      - fill: { testid: create-agent-name, value: "prr-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('prr-${RUN_ID:-local}')
        intent: "Wait until the PR Review agent appears after submit"
      - expect: { visible: { selector: "[aria-label='Agent: prr-${RUN_ID:-local}']" } }
      - run: |
          set -e
          name="prr-${RUN_ID:-local}"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-PRR/agents" > "$AFT_WORK_DIR/prr-d1-agents.json"
          python3 - "$AFT_WORK_DIR/prr-d1-agents.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          matches = [a for a in agents or [] if a.get("name") == sys.argv[2]]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("role_name") == "pr-review", a
          assert a.get("backend"), a
          assert not a.get("auto"), a
          PY
        intent: "An operator's readback selects the created PR Review agent from the unordered agent list"

