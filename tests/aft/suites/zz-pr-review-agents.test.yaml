              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the PRR workspace agents page is ready with the prompt-list route aborted"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open with the prompt request failed"
      - wait: { text: "Prompt list unavailable; showing built-in defaults." }
      - expect: { visible: { testid: create-agent-template-lead } }
      - expect: { visible: { testid: create-agent-template-interactive-pr-review } }
      - expect: { notText: "Something went wrong" }
      - click: { testid: create-agent-close }

  # covers: PRR-D5; TerminalView PR Review launch.argv; /api/workspaces/:ws/terminal/tabs
  - name: PR Review terminal launch carries the built-in prompt
    intent: An operator opening their PR Review agent gets a mounted terminal launched with the built-in PR-review prompt
    steps:
      - open: /ws/E2E-WS-PRR/agents/prr-${RUN_ID:-local}
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=terminal-view]')
        intent: "Wait until the PR Review agent terminal view is ready"
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=terminal-wrapper] .wterm')
        intent: "Wait until the PR Review terminal grid mounts"
      - run: |
          set -e
          name="prr-${RUN_ID:-local}"
          for i in $(seq 1 60); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-PRR/terminal/tabs" > "$AFT_WORK_DIR/prr-d5-tabs.json" &&
            python3 - "$AFT_WORK_DIR/prr-d5-tabs.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          tabs = d.get("data") or []
          matches = [t for t in tabs if t.get("agent_id") == name]
          assert matches, tabs
          t = matches[0]
          launch = t.get("launch") or {}
          argv = launch.get("argv") or []
          joined = " ".join(str(x) for x in argv)
          env = launch.get("env") or {}
          assert t.get("kind") == "agent", t
          assert "lead" in joined, joined
          assert "--prompt" in joined, joined
          assert "builtin:pr-review" in joined, joined
          assert env.get("LOOM_AGENT_ROLE") == "pr-review", env
          assert env.get("LOOM_AGENT_NAME") == name, env
          assert t.get("pty_alive") is True, t
          PY
            sleep 2
          done
          echo "PR Review launch metadata never appeared"
          cat "$AFT_WORK_DIR/prr-d5-tabs.json" 2>/dev/null || true
          exit 1
        intent: "An operator polls terminal tabs until the exact PR Review agent launch spec is persisted"

  # covers: PRR-D6a; shared pr-review role reuse across modal-created agents; GET /api/workspaces/:ws/agents
  - name: second PR Review agent reuses the shared role
    intent: An operator creates a second PR Review agent and verifies both agents share the workspace PR-review role
    steps:
      - open: /ws/E2E-WS-PRR/agents
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the PRR workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-interactive-pr-review }
      - fill: { testid: create-agent-name, value: "prr2-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('prr2-${RUN_ID:-local}')
        intent: "Wait until the second PR Review agent appears after submit"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-PRR/agents" > "$AFT_WORK_DIR/prr-d6a-agents.json"
          python3 - "$AFT_WORK_DIR/prr-d6a-agents.json" "prr-$run" "prr2-$run" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          by_name = {a.get("name"): a for a in agents or []}
          for name in sys.argv[2:]:
              assert name in by_name, agents
              assert by_name[name].get("role_name") == "pr-review", by_name[name]
          PY
        intent: "An operator's readback confirms both modal-created PR Review agents reuse the PR-review role"

  # covers: PRR-D6b; role-name conflict with different prompt; POST /api/workspaces/:ws/agents validation
  # covers: surface-tier content colocated in the product suite, mirroring the D14 precedent
  - name: conflicting prompt cannot reuse the PR Review role
    intent: An API client that tries to reuse the PR-review role with a different prompt receives the documented role-conflict error
    steps:
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-PRR/agents"
          body:
            name: "pr-review"
            role_name: "pr-review"
            kind: "interactive"
            prompt: "totally different PR Review prompt ${RUN_ID:-local}"
            auto: false
            backend: "codex"
          status: 400
          assert:
            - path: "kind"
              equals: "validation_error"
            - path: "error"
              contains: "already exists with a different prompt"
        intent: "An API client probes the shared PR Review role conflict semantics"

  # covers: PRR-D20; unknown built-in prompt launch error; hidden checkout prompt create-time acceptance
  - name: unknown built-in prompt fails visibly at terminal launch
    intent: An operator whose interactive agent names an unknown built-in prompt sees the terminal report the prompt-loading error while the hidden checkout prompt remains API-accepted
    steps:
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-PRR/agents"
          body:
            name: "prrbad-${RUN_ID:-local}"
            role_name: "prrbad-${RUN_ID:-local}"
            kind: "interactive"
            prompt_file: "builtin:not-a-prompt"
            auto: false
            backend: "codex"
          status: 201
          assert:
            - path: "name"
              equals: "prrbad-${RUN_ID:-local}"
            - path: "role_name"
              equals: "prrbad-${RUN_ID:-local}"
        intent: "An API client provisions an interactive agent whose role stores an unknown built-in prompt"
      - open: /ws/E2E-WS-PRR/agents/prrbad-${RUN_ID:-local}
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=terminal-wrapper] .wterm')
        intent: "Wait until the bad-prompt agent terminal grid mounts"
      - wait:
          fn: >-
            (() => {
              const wrapper = document.querySelector('[data-testid=terminal-wrapper]');
              if (!wrapper) return false;
              const rows = Array.from(wrapper.querySelectorAll('.term-row')).map((el) => el.textContent || '').join('\n');
              const text = rows || wrapper.textContent || '';
              return text.includes('Error loading terminal prompt:') &&
                text.includes('unknown built-in interactive prompt');
            })()
        intent: "Wait until the bad built-in prompt error is visible in the surviving terminal"
      - expect: { notText: "Something went wrong" }
      - run: |
          set -e
          name="prrbad-${RUN_ID:-local}"
          for i in $(seq 1 60); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-PRR/terminal/tabs" > "$AFT_WORK_DIR/prr-d20-tabs.json" &&
            python3 - "$AFT_WORK_DIR/prr-d20-tabs.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          tabs = d.get("data") or []
          matches = [t for t in tabs if t.get("agent_id") == name]
          assert matches, tabs
          t = matches[0]
          launch = t.get("launch") or {}
          argv = launch.get("argv") or []
          joined = " ".join(str(x) for x in argv)
          assert t.get("kind") == "agent", t
          assert "builtin:not-a-prompt" in joined, joined
          assert t.get("pty_alive") is True, t
          PY
            sleep 2
          done
          echo "bad-prompt launch metadata never appeared"
          cat "$AFT_WORK_DIR/prr-d20-tabs.json" 2>/dev/null || true
          exit 1
        intent: "An operator polls terminal tabs until the bad-prompt launch spec is persisted"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-PRR/agents"
          body:
            name: "prrhidden-${RUN_ID:-local}"
            role_name: "prrhidden-${RUN_ID:-local}"
            kind: "interactive"
            prompt_file: "builtin:pr-review-checkout"
            auto: false
            backend: "codex"
          status: 201
          assert:
            - path: "name"
              equals: "prrhidden-${RUN_ID:-local}"
            - path: "role_name"
              equals: "prrhidden-${RUN_ID:-local}"
        intent: "An API client confirms the hidden checkout built-in prompt is accepted at create time"
