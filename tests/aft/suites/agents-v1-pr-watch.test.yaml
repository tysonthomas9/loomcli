# OR10 PR-watch register and unregister (AFT map S8, case H1), API only on the
# deterministic tier. A Lead calls the Agent API's github/watch and
# github/unwatch with its own bridge token (tests/aft/scripts/agent-bridge-call.py),
# and the host GitHub connector reads fixtures/fake-github through
# LOOM_CONNECTOR_GITHUB_BASE_URL, which run-aft.sh sets for this tier, with a
# fixture token this suite puts in the host settings and clears afterwards.
# W1-W4 cover OR8's wakes: each waits for the dispatcher's real two-minute
# PR-watch sweep, which it sees in fake-github's request log, and counts the
# Lead's wakes as saved events sent by loom:pr-watch.
suite: agents-v1-pr-watch
classification: { area: agents, feature: agent-api-pr-watch, surface: api, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: |
  set -e
  : "${AFT_FAKE_GH_BASE:?fake-github is not running; run this suite on the deterministic tier}"
  curl -sf -X POST "$AFT_FAKE_GH_BASE/__reset" >/dev/null
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-AGV1-PRWATCH" >/dev/null || true
  # Host settings are global: the last case (and teardown) clears this fixture token.
  curl -sf -X PATCH "$AFT_BASE_URL/api/local/settings" -H "Content-Type: application/json" \
    -d '{"runtime_credentials":{"github":{"token":"aft-fixture-token"}}}' >/dev/null
  gh="$AFT_WORK_DIR/agv1-prwatch-repo"
  sib="$AFT_WORK_DIR/agv1-prwatch-sib"
  other="$AFT_WORK_DIR/agv1-prwatch-other"
  for r in "$gh" "$sib" "$other"; do
    mkdir -p "$r"
    git -C "$r" init -q -b main
    git -C "$r" -c user.email=e2e@x -c user.name=e2e commit -q --allow-empty -m init
  done
  git -C "$gh" remote add origin https://github.com/loom-e2e/agv1-prwatch.git
  git -C "$sib" remote add origin https://github.com/loom-e2e/agv1-prwatch-sib.git
  git -C "$other" remote add origin https://gitlab.com/loom-e2e/agv1-prwatch-other.git
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" \
    -d '{"name":"e2e-agv1-prwatch","type":"empty","repos":[]}' >/dev/null
  printf '{"repos":["%s","%s","%s"]}' "$gh" "$sib" "$other" |
    curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-AGV1-PRWATCH/repos" -H "Content-Type: application/json" -d @- \
    > "$AFT_WORK_DIR/agv1-prwatch-ws.json"
  for which in gh other; do
    python3 - "$AFT_WORK_DIR/agv1-prwatch-ws.json" "$which" "agv1-prwatch-$which-${RUN_ID:-local}" \
      > "$AFT_WORK_DIR/agv1-prwatch-$which-create.json" <<'PY'
  import json, sys
  url = {"gh": "https://github.com/loom-e2e/agv1-prwatch", "other": "https://gitlab.com/loom-e2e/agv1-prwatch-other"}[sys.argv[2]]
  repos = [r for r in json.load(open(sys.argv[1]))["data"]["repos"] if r["remote_url"].removesuffix(".git") == url]
  assert len(repos) == 1, repos
  r = repos[0]
  print(json.dumps({"preset": "lead", "name": sys.argv[3], "repo": r["path"], "base_ref": r["default_branch"], "overrides": {"harness": "opencode"}}))
  PY
    curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-AGV1-PRWATCH/v1/agents" -H "Content-Type: application/json" \
      -H "Idempotency-Key: agv1-prwatch-$which-${RUN_ID:-local}" -d @"$AFT_WORK_DIR/agv1-prwatch-$which-create.json" |
      python3 -c 'import json,sys; print(json.load(sys.stdin)["agent_id"])' > "$AFT_WORK_DIR/agv1PrWatch-$which-Id"
  done
teardown: |
  set +e
  curl -s -X PATCH "$AFT_BASE_URL/api/local/settings" -H "Content-Type: application/json" \
    -d '{"runtime_credentials":{"github":{"clear":true}}}' >/dev/null
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-AGV1-PRWATCH" >/dev/null

tests:
  - name: H1a a Lead registers a watch on a PR of its own GitHub repo
    intent: A Lead whose repo's origin is on GitHub watches PR 7 and gets the watch on that repo with the host viewer; watching it again keeps the one watch, and every GitHub read went to that repo only
    steps:
      - run: |
          set -e
          curl -sf -X POST "$AFT_FAKE_GH_BASE/__reset" >/dev/null
          call="$AFT_TESTS_DIR/scripts/agent-bridge-call.py"
          id="$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")"
          "$call" E2E-AGV1-PRWATCH "$id" github/watch '{"number":7}' > "$AFT_WORK_DIR/agv1-prwatch-h1a-1.json"
          "$call" E2E-AGV1-PRWATCH "$id" github/watch '{"number":7}' > "$AFT_WORK_DIR/agv1-prwatch-h1a-2.json"
          curl -sf "$AFT_FAKE_GH_BASE/__requests" > "$AFT_WORK_DIR/agv1-prwatch-h1a-gh.json"
          python3 - "$AFT_WORK_DIR" <<'PY'
          import json, sys
          d = sys.argv[1]
          first = json.load(open(d + "/agv1-prwatch-h1a-1.json"))
          again = json.load(open(d + "/agv1-prwatch-h1a-2.json"))
          want = {"owner": "loom-e2e", "repo": "agv1-prwatch", "number": 7, "viewer": "aft-viewer"}
          assert first["status"] == 200, first
          assert first["body"] == dict(want, created=True), first
          assert again["status"] == 200, again
          assert again["body"] == want, "a second watch must keep the one watch (no created): %r" % again
          reqs = json.load(open(d + "/agv1-prwatch-h1a-gh.json"))
          paths = [r["url"].split("?")[0] for r in reqs]
          assert all(r["method"] == "GET" for r in reqs), reqs
          assert "/repos/loom-e2e/agv1-prwatch/pulls/7" in paths, paths
          assert "/user" in paths, paths
          others = [p for p in paths if p != "/user" and not p.startswith("/repos/loom-e2e/agv1-prwatch/")]
          assert not others, "PR-watch reads outside the registered repo: %r" % others
          PY
        intent: "Watch PR 7 twice as the Lead on the GitHub repo, and check the watch and the GitHub reads"

  - name: H1b a PR watch on another repo is refused
    intent: A Lead whose repo is not a GitHub repo of the workspace is refused as github_denied with no GitHub read, and a Lead that names the workspace's other GitHub repo in the body still watches, and reads, only its own repo
    steps:
      - run: |
          set -e
          curl -sf -X POST "$AFT_FAKE_GH_BASE/__reset" >/dev/null
          call="$AFT_TESTS_DIR/scripts/agent-bridge-call.py"
          "$call" E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-other-Id")" github/watch '{"number":7}' \
            > "$AFT_WORK_DIR/agv1-prwatch-h1b-other.json"
          curl -sf "$AFT_FAKE_GH_BASE/__requests" > "$AFT_WORK_DIR/agv1-prwatch-h1b-gh-other.json"
          "$call" E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" github/watch \
            '{"number":7,"owner":"loom-e2e","repo":"agv1-prwatch-sib"}' > "$AFT_WORK_DIR/agv1-prwatch-h1b-named.json"
          curl -sf "$AFT_FAKE_GH_BASE/__requests" > "$AFT_WORK_DIR/agv1-prwatch-h1b-gh-named.json"
          python3 - "$AFT_WORK_DIR" <<'PY'
          import json, sys
          d = sys.argv[1]
          other = json.load(open(d + "/agv1-prwatch-h1b-other.json"))
          assert other["status"] == 403, other
          assert other["body"]["code"] == "github_denied", other
          assert "is not a GitHub repo of workspace" in other["body"]["error"], other
          assert json.load(open(d + "/agv1-prwatch-h1b-gh-other.json")) == [], "a refused watch read GitHub"
          named = json.load(open(d + "/agv1-prwatch-h1b-named.json"))
          assert named["status"] == 200, named
          assert (named["body"]["owner"], named["body"]["repo"]) == ("loom-e2e", "agv1-prwatch"), named
          paths = [r["url"].split("?")[0] for r in json.load(open(d + "/agv1-prwatch-h1b-gh-named.json"))]
          assert "/repos/loom-e2e/agv1-prwatch/pulls/7" in paths, paths
          others = [p for p in paths if p != "/user" and not p.startswith("/repos/loom-e2e/agv1-prwatch/")]
          assert not others, "a watch naming another repo read outside the Lead's own repo: %r" % others
          PY
        intent: "Watch as the Lead on the GitLab repo, then as the GitHub Lead naming the sibling GitHub repo, and check both"

  - name: H1c unregister clears the watch
    intent: The Lead's unwatch removes its watch on PR 7, a second unwatch finds none, and watching again makes a new watch
    steps:
      - run: |
          set -e
          call="$AFT_TESTS_DIR/scripts/agent-bridge-call.py"
          id="$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")"
          "$call" E2E-AGV1-PRWATCH "$id" github/watch '{"number":7}' > "$AFT_WORK_DIR/agv1-prwatch-h1c-0.json"
          "$call" E2E-AGV1-PRWATCH "$id" github/unwatch '{"number":7}' > "$AFT_WORK_DIR/agv1-prwatch-h1c-1.json"
          "$call" E2E-AGV1-PRWATCH "$id" github/unwatch '{"number":7}' > "$AFT_WORK_DIR/agv1-prwatch-h1c-2.json"
          "$call" E2E-AGV1-PRWATCH "$id" github/watch '{"number":7}' > "$AFT_WORK_DIR/agv1-prwatch-h1c-3.json"
          "$call" E2E-AGV1-PRWATCH "$id" github/unwatch '{"number":7}' > "$AFT_WORK_DIR/agv1-prwatch-h1c-4.json"
          python3 - "$AFT_WORK_DIR" <<'PY'
          import json, sys
          r = [json.load(open("%s/agv1-prwatch-h1c-%d.json" % (sys.argv[1], i))) for i in range(5)]
          assert all(x["status"] == 200 for x in r), r
          assert r[1]["body"] == {"number": 7, "removed": True}, r[1]
          assert r[2]["body"] == {"number": 7}, "a second unwatch must find no watch: %r" % r[2]
          assert r[3]["body"].get("created") is True, "watching again after unwatch must make a new watch: %r" % r[3]
          assert r[4]["body"] == {"number": 7, "removed": True}, r[4]
          PY
        intent: "Watch, unwatch twice, watch again and unwatch as the GitHub Lead, and check each answer"

  - name: W1 a sweep with no news wakes no one (OR8)
    intent: After the Lead watches PR 7, the next PR-watch sweep reads the PR, finds nothing new since the watch, and hands the Lead nothing
    steps:
      - run: |
          set -e
          curl -sf -X POST "$AFT_FAKE_GH_BASE/__reset" >/dev/null
          curl -sf -X POST "$AFT_FAKE_MODEL_URL/__reset" >/dev/null
          python3 -c 'import json; print(json.dumps({"steps": [{"text": "AGV1-PRW-WOKE"}] * 4}))' |
            curl -sf -X POST "$AFT_FAKE_MODEL_URL/__script" -H "Content-Type: application/json" -d @- >/dev/null
          "$AFT_TESTS_DIR/scripts/agent-bridge-call.py" E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" github/watch '{"number":7}' |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["status"] == 200 and r["body"].get("created") is True, r'
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" begin-sweep "$AFT_WORK_DIR/agv1-prwatch-w1"
        intent: "Script the Lead's replies, watch PR 7, and start waiting for the next sweep"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w1"'
        intent: "Wait for a whole sweep after the watch (poll 1 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w1"'
        intent: "Wait for a whole sweep after the watch (poll 2 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w1"'
        intent: "Wait for a whole sweep after the watch (poll 3 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w1"'
        intent: "Wait for a whole sweep after the watch (poll 4 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" end "$AFT_WORK_DIR/agv1-prwatch-w1"'
        intent: "Check the wait for wait for a whole sweep after the watch is over"
      - run: |
          set -e
          n="$("$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" pr-events E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")")"
          [ "$n" = 0 ] || { echo "a sweep with no news sent the Lead $n PR-watch wake events" >&2; exit 1; }
        intent: "Check the sweep sent the Lead no wake, handed or waiting"

  - name: W2 news wakes the Lead once, without the host's own comment (OR8)
    intent: A failed check, a new conflict and a comment by someone else wake the Lead with one message telling all three, the host viewer's own comment is left out, and the next sweep tells nothing again
    steps:
      - run: |
          set -e
          # Patched right after W1's sweep ended, so the next sweep sees all of it at once.
          curl -sf -X POST "$AFT_FAKE_GH_BASE/__fixture" -H "Content-Type: application/json" -d '{
            "pr": {"mergeable_state": "dirty"},
            "checkRuns": [{"id": 101, "name": "ci", "status": "completed", "conclusion": "failure"}],
            "issueComments": [{"id": 501, "user": {"login": "octocat"}, "body": "please fix"},
                              {"id": 502, "user": {"login": "aft-viewer"}, "body": "the host itself"}]}' >/dev/null
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" begin-wakes "$AFT_WORK_DIR/agv1-prwatch-w2" E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" 1
        intent: "Add a failed check, a conflict, a comment by octocat and one by the host viewer, and start waiting for a wake"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w2"'
        intent: "Wait for the Lead's wake (poll 1 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w2"'
        intent: "Wait for the Lead's wake (poll 2 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w2"'
        intent: "Wait for the Lead's wake (poll 3 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w2"'
        intent: "Wait for the Lead's wake (poll 4 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" end "$AFT_WORK_DIR/agv1-prwatch-w2"'
        intent: "Check the wait for wait for the lead's wake is over"
      - run: |
          set -e
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" wakes E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" > "$AFT_WORK_DIR/agv1-prwatch-w2-wakes.json"
          python3 - "$AFT_WORK_DIR/agv1-prwatch-w2-wakes.json" <<'PY'
          import json, sys
          got = json.load(open(sys.argv[1]))
          assert len(got) == 1, "want one wake, got %r" % got
          t = got[0]
          assert t.startswith("Update on pull request loom-e2e/agv1-prwatch#7, which Loom is watching for you:"), t
          news = [line for line in t.splitlines() if line.startswith("- ")]
          assert news == ["- Checks finished on 0000000; 1 of 1 failed: ci.",
                          "- The branch now conflicts with its base.",
                          "- 1 new comment: octocat (issue 501)."], "news: %r" % news
          for bad in ("aft-viewer", "502", "the host itself"):
              assert bad not in t, "the host viewer's own comment was told: %r" % t
          PY
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" pr-events E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" > "$AFT_WORK_DIR/agv1-prwatch-w2-events"
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" begin-sweep "$AFT_WORK_DIR/agv1-prwatch-w2b"
        intent: "Check the one wake tells the failed check, the conflict and octocat's comment but not the host's, and start waiting for the next sweep"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w2b"'
        intent: "Wait for the sweep after the wake (poll 1 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w2b"'
        intent: "Wait for the sweep after the wake (poll 2 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w2b"'
        intent: "Wait for the sweep after the wake (poll 3 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w2b"'
        intent: "Wait for the sweep after the wake (poll 4 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" end "$AFT_WORK_DIR/agv1-prwatch-w2b"'
        intent: "Check the wait for wait for the sweep after the wake is over"
      - run: |
          set -e
          n="$("$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" pr-events E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")")"
          [ "$n" = "$(cat "$AFT_WORK_DIR/agv1-prwatch-w2-events")" ] || { echo "the next sweep sent a PR-watch wake again ($n events)" >&2; exit 1; }
        intent: "Check the next sweep told nothing again"

  - name: W3 a closed PR wakes the Lead once and ends the watch (OR8)
    intent: When the watched PR closes, the Lead is told it was closed and that Loom stopped watching, and the watch is gone
    steps:
      - run: |
          set -e
          curl -sf -X POST "$AFT_FAKE_GH_BASE/__fixture" -H "Content-Type: application/json" -d '{"pr": {"state": "closed"}}' >/dev/null
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" begin-wakes "$AFT_WORK_DIR/agv1-prwatch-w3" E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" 2
        intent: "Close PR 7 and start waiting for a second wake"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w3"'
        intent: "Wait for the close wake (poll 1 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w3"'
        intent: "Wait for the close wake (poll 2 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w3"'
        intent: "Wait for the close wake (poll 3 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w3"'
        intent: "Wait for the close wake (poll 4 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" end "$AFT_WORK_DIR/agv1-prwatch-w3"'
        intent: "Check the wait for wait for the close wake is over"
      - run: |
          set -e
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" wakes E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" > "$AFT_WORK_DIR/agv1-prwatch-w3-wakes.json"
          "$AFT_TESTS_DIR/scripts/agent-bridge-call.py" E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" github/unwatch '{"number":7}' \
            > "$AFT_WORK_DIR/agv1-prwatch-w3-unwatch.json"
          python3 - "$AFT_WORK_DIR" <<'PY'
          import json, sys
          d = sys.argv[1]
          got = json.load(open(d + "/agv1-prwatch-w3-wakes.json"))
          assert len(got) == 2, "want the W2 wake and one close wake, got %r" % got
          assert "- It was closed, so Loom stopped watching it. Watch it again if it reopens." in got[1], got[1]
          un = json.load(open(d + "/agv1-prwatch-w3-unwatch.json"))
          assert un == {"status": 200, "body": {"number": 7}}, "the closed PR's watch was not ended: %r" % un
          PY
        intent: "Check the close wake's text and that the watch is gone"

  - name: W4 a merged PR ends the watch quietly (OR8)
    intent: When a watched PR is merged, the next sweep ends the watch without waking the Lead
    steps:
      - run: |
          set -e
          call="$AFT_TESTS_DIR/scripts/agent-bridge-call.py"
          "$call" E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" github/unwatch '{"number":7}' >/dev/null  # in case W3 left one
          curl -sf -X POST "$AFT_FAKE_GH_BASE/__reset" >/dev/null
          "$call" E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" github/watch '{"number":7}' |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["status"] == 200 and r["body"].get("created") is True, r'
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" pr-events E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" > "$AFT_WORK_DIR/agv1-prwatch-w4-before"
          curl -sf -X POST "$AFT_FAKE_GH_BASE/__fixture" -H "Content-Type: application/json" \
            -d '{"pr": {"state": "closed", "merged": true, "merged_at": "2026-01-02T00:00:00Z"}}' >/dev/null
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" begin-sweep "$AFT_WORK_DIR/agv1-prwatch-w4"
        intent: "Watch the reopened PR 7 again, merge it, and start waiting for the next sweep"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w4"'
        intent: "Wait for a whole sweep after the merge (poll 1 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w4"'
        intent: "Wait for a whole sweep after the merge (poll 2 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w4"'
        intent: "Wait for a whole sweep after the merge (poll 3 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" poll "$AFT_WORK_DIR/agv1-prwatch-w4"'
        intent: "Wait for a whole sweep after the merge (poll 4 of 4)"
      - run: '"$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" end "$AFT_WORK_DIR/agv1-prwatch-w4"'
        intent: "Check the wait for wait for a whole sweep after the merge is over"
      - run: |
          set -e
          "$AFT_TESTS_DIR/scripts/agv1-prwatch-wait.py" pr-events E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" > "$AFT_WORK_DIR/agv1-prwatch-w4-after"
          "$AFT_TESTS_DIR/scripts/agent-bridge-call.py" E2E-AGV1-PRWATCH "$(cat "$AFT_WORK_DIR/agv1PrWatch-gh-Id")" github/unwatch '{"number":7}' \
            > "$AFT_WORK_DIR/agv1-prwatch-w4-unwatch.json"
          python3 - "$AFT_WORK_DIR" <<'PY'
          import json, sys
          d = sys.argv[1]
          before = int(open(d + "/agv1-prwatch-w4-before").read())
          after = int(open(d + "/agv1-prwatch-w4-after").read())
          assert after == before, "a merged PR sent the Lead a wake (%d PR-watch events, then %d)" % (before, after)
          un = json.load(open(d + "/agv1-prwatch-w4-unwatch.json"))
          assert un == {"status": 200, "body": {"number": 7}}, "the merged PR's watch was not ended: %r" % un
          PY
        intent: "Check no wake came and the watch is gone"

  - name: H1z the host GitHub fixture token is cleared
    intent: Host settings are global, so the suite removes its fixture GitHub token and later suites see GitHub unconfigured again
    steps:
      - run: |
          set -e
          curl -sf -X PATCH "$AFT_BASE_URL/api/local/settings" -H "Content-Type: application/json" \
            -d '{"runtime_credentials":{"github":{"clear":true}}}' >/dev/null
          curl -sf "$AFT_BASE_URL/api/local/settings" |
            python3 -c 'import json,sys; g=json.load(sys.stdin)["data"]["runtime_credentials"]["github"]; assert g["configured"] is False, g'
        intent: "Clear the fixture GitHub token and check the host reports GitHub unconfigured"
