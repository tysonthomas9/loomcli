# Issue detail panel coverage for the real v5 kanban shell. Cards are article
# elements with no testid, so this suite opens the lone ready card after API
# seeding and then exercises verified IssueDetailPanel/StatusDropdown anchors.
suite: issue-detail
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: '"$AFT_TESTS_DIR/scripts/close-open-issues.sh"'

tests:
  # covers: LCLI-WP-002, LCLI-WP-006; LCLI-WP-003 partial (metadata/assignment
  # persistence only — the AssigneePrompt is wired to kanban DRAG open->in_progress
  # in v5, not to panel status changes, so it cannot fire on this path)
  - name: detail panel edits markdown status and persists metadata
    intent: A card opens the detail panel, description markdown saves and survives reload, priority and labels persist, and panel status changes close and reopen the issue
    steps:
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues"
          -H "Content-Type: application/json"
          -d "{\"title\":\"detail panel $RUN_ID\",\"issue_type\":\"task\",\"priority\":2,\"description\":\"Initial detail description $RUN_ID\"}"
          | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])"
          > "$AFT_WORK_DIR/detail.id"
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - wait: { text: detail panel }
      - expect: { count: { selector: "section[data-status=ready] article", equals: 1 } }
      - click: { selector: "section[data-status=ready] article", first: true }
      - wait:
          fn: >-
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-state') === 'open'
      - expect: { visible: { testid: issue-header } }
      - expect: { visible: { testid: status-dropdown } }
      - expect: { text: "detail panel ${RUN_ID:-local}" }
      # the panel's sections render async after data-state=open and re-render as
      # issue data loads — settle on networkidle so the edit button is stable
      # before clicking (clicking the just-mounted node loses the event)
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=description-edit-button]')
      - wait: { load: networkidle }
      - click: { testid: description-edit-button }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=description-textarea]')
      - expect: { visible: { testid: description-textarea } }
      - fill:
          testid: description-textarea
          value: |-
            Updated **bold detail** ${RUN_ID:-local}

            Panel markdown persists.
      - click: { testid: description-save }
      - wait:
          fn: >-
            Array.from(document.querySelectorAll('[data-testid=markdown-content] strong')).some((node) => node.textContent === 'bold detail')
      - expect: { text: Panel markdown persists. }
      - reload: true
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - click: { selector: "section[data-status=ready] article", first: true }
      - wait:
          fn: >-
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-state') === 'open'
      - wait:
          fn: >-
            Array.from(document.querySelectorAll('[data-testid=markdown-content] strong')).some((node) => node.textContent === 'bold detail')
      - expect: { text: Panel markdown persists. }
      - run: >-
          curl -sf -X PATCH "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues/$(cat "$AFT_WORK_DIR/detail.id")"
          -H "Content-Type: application/json"
          -d "{\"priority\":1,\"add_labels\":[\"detail-label-$RUN_ID\"]}"
          >/dev/null
      - click: { testid: header-close-button }
      - open: /ws/E2E-WS/kanban?priority=1&labels=detail-label-${RUN_ID:-local}
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - wait: { text: detail panel }
      - expect: { count: { selector: "section[data-status=ready] article", equals: 1 } }
      - expect: { attr: { selector: "section[data-status=ready] article", name: data-priority, equals: "1" } }
      - run: >-
          curl -sf "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues/$(cat "$AFT_WORK_DIR/detail.id")"
          | python3 -c "import os,sys,json; data=json.load(sys.stdin)['data']; assert data['priority'] == 1, data; assert ('detail-label-' + os.environ['RUN_ID']) in data.get('labels', []), data.get('labels')"
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - wait: { text: detail panel }
      - click: { selector: "section[data-status=ready] article", first: true }
      - wait:
          fn: >-
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-state') === 'open'
      - select: { testid: status-dropdown, value: in_progress }
      - wait:
          fn: >-
            document.querySelector('[data-testid=status-dropdown]')?.getAttribute('data-status') === 'in_progress'
      - select: { testid: status-dropdown, value: closed }
      - wait:
          fn: >-
            document.querySelector('[data-testid=status-dropdown]')?.getAttribute('data-status') === 'closed'
      - select: { testid: status-dropdown, value: open }
      - wait:
          fn: >-
            document.querySelector('[data-testid=status-dropdown]')?.getAttribute('data-status') === 'open'
      - click: { testid: header-close-button }
      - wait:
          fn: >-
            document.querySelectorAll('section[data-status=ready] article').length === 1
      # persistence proof beyond the dropdown's optimistic data-status
      - run: >-
          curl -sf "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues/$(cat "$AFT_WORK_DIR/detail.id")"
          | python3 -c "import sys,json; data=json.load(sys.stdin)['data']; assert data['status'] == 'open', data['status']"
      - expect: { count: { selector: "section[data-status=in_progress] article", equals: 0 } }
      # scope to this issue: other suites' teardown-closed issues populate Done in a full run
      - expect: { count: { selector: "section[data-status=done] article[aria-label*='detail panel ${RUN_ID:-local}']", equals: 0 } }
