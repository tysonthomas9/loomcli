# Workspace switching uses the sidebar WorkspaceSelectorBar plus the
# WorkspaceSwitcher dialog. Suite setup provisions e2e-ws-2 as a shared fixture;
# the product-correct creation scenario uses CreateWorkspaceModal's Empty mode.
suite: workspaces
classification: { area: workspaces, feature: workspace-management, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: >-
  curl -s -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json"
  -d '{"name":"e2e-ws-2","type":"empty"}' >/dev/null; echo "ensured e2e-ws-2"
teardown: >-
  "$AFT_TESTS_DIR/scripts/close-open-issues.sh"; if [ -s "$AFT_WORK_DIR/workspaces-empty.id" ]; then curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/$(cat "$AFT_WORK_DIR/workspaces-empty.id")" >/dev/null || true; fi

tests:
  # covers: LCLI-PS-001 partial; CreateWorkspaceModal empty mode; routable board
  - name: empty-mode modal creates a workspace with a routable board
    intent: An operator creates an empty workspace through the modal and reaches its empty kanban board
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
        intent: "Wait until the workspace board is ready"
      - click: { selector: "button[aria-label^='Active workspace:']" }
      - click: { role: button, name: "+ New Workspace", exact: true }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=create-workspace-overlay]')
        intent: "Wait until the workspace creation dialog is open"
      - click: { testid: create-workspace-mode-empty }
      - fill: { testid: create-workspace-name, value: e2e-ws-3 }
      - click: { testid: create-workspace-submit }
      # Read back the server-assigned id from the human UI action; its casing is
      # intentionally not part of the product scenario.
      - run: >-
          for i in $(seq 1 20); do curl -sf "$AFT_BASE_URL/api/workspaces" > "$AFT_WORK_DIR/workspaces-after-empty.json" && ws="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next((w.get("id","") for w in d.get("workspaces",[]) if w.get("name")=="e2e-ws-3"), ""))' "$AFT_WORK_DIR/workspaces-after-empty.json")" && if [ -n "$ws" ]; then printf '%s\n' "$ws" > "$AFT_WORK_DIR/workspaces-empty.id"; exit 0; fi; sleep 1; done; echo "empty-mode workspace never appeared"; exit 1
        intent: "An operator's readback waits for the modal-created workspace and records its identity"
      - run: >-
          agent-browser --session "$AFT_SESSION" open "$AFT_BASE_URL/ws/$(cat "$AFT_WORK_DIR/workspaces-empty.id")/kanban"
        intent: "An operator opens the server-assigned workspace route in the active browser session"
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
        intent: "Wait until the workspace board is ready"
      # the empty-state marker renders only after the (empty) issue fetch settles,
      # and can blink through a skeleton re-render under load — so proving it is
      # laid out at ONE instant is not enough: the following expect can still land
      # inside a blink. Require it to stay laid out across samples before asserting.
      - wait:
          fn: >-
            (() => {
              const el = document.querySelector('[data-testid=empty-workspace-board]');
              if (!el || el.offsetParent === null) {
                window.__aftEmptyBoardStableAt = 0;
                return false;
              }
              if (!window.__aftEmptyBoardStableAt) {
                window.__aftEmptyBoardStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftEmptyBoardStableAt >= 500;
            })()
        intent: "Wait until the new workspace empty board stays visibly laid out across a re-render window"
      - expect: { visible: { testid: empty-workspace-board } }

  # covers: LCLI-PS-002
  - name: workspace selector switches route and board scope
    intent: An agent creates an issue in E2E-WS through the API, then an operator switches to e2e-ws-2 and sees the route and board scope change
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
        intent: "Wait until the workspace board is ready"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS/issues"
          body:
            title: "workspace-primary-${RUN_ID:-local}"
            issue_type: "task"
            priority: 2
          save:
            - from: "data.id"
              as: "workspacePrimaryId"
        intent: "An agent creates the primary-workspace issue at priority 2"
      - wait: { text: "workspace-primary-${RUN_ID:-local}" }
      - expect: { count: { selector: "section[data-status=ready] article[aria-label*='workspace-primary-${RUN_ID:-local}']", equals: 1 } }
      - click: { selector: "button[aria-label*='Click to switch.']", first: true }
      - wait:
          fn: >-
            !!document.querySelector('[role=dialog][aria-label="Switch workspace"]')
        intent: "Wait until the workspace switcher dialog is open"
      - fill: { placeholder: "Switch workspace...", value: e2e-ws-2 }
      - wait:
          fn: >-
            document.querySelectorAll('[data-workspace-item]').length === 1
        intent: "Wait until workspace search isolates exactly the second workspace"
      - click: { selector: "[data-workspace-item]", first: true }
      - wait: { url: "**/ws/E2E-WS-2/kanban**" }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
        intent: "Wait until the workspace board is ready"
      - expect: { visible: { testid: empty-workspace-board } }
      - expect: { notText: "workspace-primary-${RUN_ID:-local}" }
      - api:
          method: "GET"
          path: "/api/workspaces/E2E-WS-2/issues?include_blocked=true&limit=100"
          save:
            - from: "data"
              as: "secondaryWorkspaceIssues"
        intent: "An operator reads back the second workspace issue scope"
      - run: >-
          python3 -c 'import json,os; title="workspace-primary-"+os.environ["RUN_ID"]; issues=json.load(open(os.environ["AFT_WORK_DIR"]+"/secondaryWorkspaceIssues")); assert all(i.get("title") != title for i in issues), issues'
        intent: "An operator's readback confirms the primary issue is absent from the second workspace"
      - api:
          method: "GET"
          path: "/api/workspaces/E2E-WS-2/issues/${var:workspacePrimaryId}"
          status: 404
        intent: "An operator's cross-workspace read confirms the primary issue is not addressable from the second workspace"

  # covers: LCLI-PS-002
  - name: second workspace deep link opens scoped empty board
    intent: An operator follows a direct link to the second workspace and sees its correctly scoped empty board without visiting the primary workspace first
    steps:
      - open: /ws/E2E-WS-2/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
        intent: "Wait until the workspace board is ready"
      - wait: { url: "**/ws/E2E-WS-2/kanban**" }
      - expect: { visible: { testid: empty-workspace-board } }
