kind: graph-transitions
version: 1
flow: planner-agent
group: zz-planner-agent
transitions:
  open-planner-dialog:
    intent: An operator opens the Planner creation dialog.
    actor: human
    via: ui
    steps:
    - use: open-create-agent-dialog
  choose-planner-template:
    intent: An operator selects the Planner template.
    actor: human
    via: ui
    steps:
    - use: choose-planner-template
  create-default-planner:
    intent: An operator submits the default Planner and opens its persisted worker metadata in Info.
    actor: human
    via: ui
    steps:
    - use: create-default-planner-agent
  run-scenario-1-planner-template-creates-plan-role-agent:
    intent: An operator records the shared, fully verified Planner definition as the creation scenario's outcome
    actor: human
    via: ui
    steps:
    - click:
        role: button
        name: Info
        exact: true
      intent: An operator keeps the shared, fully verified Planner definition open as this scenario's review outcome
  run-scenario-2-invalid-planner-name-keeps-create-disabl:
    intent: An operator typing invalid Planner names sees Create stay disabled and no agent is created
    actor: human
    via: ui
    steps:
    - fill:
        testid: create-agent-name
        value: "-bad"
    - expect:
        enabled:
          testid: create-agent-submit
          equals: false
    - fill:
        testid: create-agent-name
        value: has space
    - expect:
        enabled:
          testid: create-agent-submit
          equals: false
    - fill:
        testid: create-agent-name
        value: trailing.
    - expect:
        enabled:
          testid: create-agent-submit
          equals: false
    - fill:
        testid: create-agent-name
        value: ''
    - expect:
        enabled:
          testid: create-agent-submit
          equals: false
    - fill:
        testid: create-agent-name
        value: planner-valid-${RUN_ID:-local}
    - expect:
        enabled:
          testid: create-agent-submit
          equals: true
    - run: |
        set -e
        curl -sf "$AFT_BASE_URL/api/workspaces/E2E-PL-${AFT_CASE_KEY}/agents" > "$AFT_WORK_DIR/pln-d2-agents.json"
        python3 - "$AFT_WORK_DIR/pln-d2-agents.json" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        data = d.get("data", d)
        agents = data.get("agents") if isinstance(data, dict) else data
        names = {a.get("name") for a in agents or []}
        for bad in ("-bad", "has space", "trailing."):
            assert bad not in names, names
        PY
      intent: An operator confirms disabled invalid-name probes did not persist any agent
  run-scenario-3-duplicate-planner-name-surfaces-server-c:
    intent: An operator who reuses an existing Planner name sees the workspace duplicate error inside the Planner form and no second agent is created
    actor: human
    via: ui
    steps:
    - open: "/ws/E2E-PL-${AFT_CASE_KEY}/agents"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the planner workspace agents page is ready
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open
    - click:
        testid: create-agent-template-planner
    - fill:
        testid: create-agent-name
        value: planner-${RUN_ID:-local}
    - click:
        testid: create-agent-submit
    - wait:
        fn: "!!document.querySelector('[data-testid=create-agent-error]')"
      intent: Wait until the duplicate-name error is rendered before asserting visibility
  run-scenario-4-backend-dropdown-persists-on-planner:
    intent: An operator picks a non-default AI backend for the Planner and the workspace records that backend on the agent
    actor: human
    via: ui
    steps:
    - fill:
        testid: create-agent-name
        value: planner-be-${RUN_ID:-local}
    - wait:
        fn: document.querySelector('[data-testid=create-agent-backend]')?.options.length > 1
      intent: Wait until backend options from /api/backends have rendered before selecting claude
    - select:
        testid: create-agent-backend
        value: claude
    - expect:
        value:
          testid: create-agent-backend
          equals: claude
    - click:
        testid: create-agent-submit
      intent: An operator submits the Planner with the selected Claude backend
    - use: show-planner-info
      with:
        name: planner-be-${RUN_ID:-local}
  run-scenario-5-repo-chip-deselect-makes-planner-workspa:
    intent: An operator deselects the preselected repo so the Planner gets workspace-wide scope and the workspace records cross-repo with no repos
    actor: human
    via: ui
    steps:
    - expect:
        text: Pick every repo this agent works in. Leave all unselected for workspace scope.
    - click:
        selector: "[data-testid='create-agent-repo-chips'] button"
        first: true
    - wait:
        fn: document.querySelector("[data-testid='create-agent-repo-chips'] button")?.getAttribute("aria-pressed") === "false"
      intent: Wait until the selected repo chip is visibly deselected
    - expect:
        text: No repo selected — the agent gets workspace-wide scope.
    - fill:
        testid: create-agent-name
        value: planner-scope-${RUN_ID:-local}
    - click:
        testid: create-agent-submit
      intent: An operator submits the workspace-scope Planner form
    - use: show-planner-info
      with:
        name: planner-scope-${RUN_ID:-local}
  run-scenario-6-repo-less-planner-creation-shows-promise:
    intent: An operator creating a Planner in a workspace with no repos is told the agent will get workspace scope and then sees the create fail
    actor: human
    via: ui
    steps:
    - api:
        method: POST
        path: "/api/workspaces"
        body:
          name: E2E-PE-${AFT_CASE_KEY}
          type: empty
        status: 201
        assert:
        - path: data.id
          equals: E2E-PE-${AFT_CASE_KEY}
      intent: An API client creates the repo-less workspace for the no-repos Planner defect pin
    - open: "/ws/E2E-PE-${AFT_CASE_KEY}/agents"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the repo-less workspace agents page is ready
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open
    - click:
        testid: create-agent-template-planner
    - expect:
        visible:
          testid: create-agent-no-repos
    - wait:
        fn: |-
          (() => {
            const text = document.querySelector('[data-testid=create-agent-no-repos]')?.textContent?.replace(/\s+/g, ' ').trim() || '';
            return text === 'No repos in this workspace yet — background agents need at least one repo; interactive agents run with workspace scope.';
          })()
      intent: Wait until the no-repos hint exactly explains the background-agent repo requirement
    - expect:
        count:
          testid: create-agent-repo-chips
          equals: 0
    - fill:
        testid: create-agent-name
        value: planner-empty-${RUN_ID:-local}
    - click:
        testid: create-agent-submit
    - wait:
        fn: "!!document.querySelector('[data-testid=create-agent-error]')"
      intent: Wait until the repo-less create error is rendered before asserting visibility
  run-scenario-7-planner-appears-in-rail-background-group:
    intent: An operator sees the newly created Planner in the agents rail with its Plan role and idle status and in the monitor activity panel
    actor: human
    via: ui
    steps:
    - open: "/ws/E2E-PL-${AFT_CASE_KEY}/agents/planner-${RUN_ID:-local}"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the Planner detail route is ready
    - expect:
        url: "**/agents/planner-${RUN_ID:-local}**"
    - wait:
        fn: document.body.textContent.includes('planner-${RUN_ID:-local}')
      intent: Wait until the Planner appears in the current agent surface
    - run: |
        set -e
        name="planner-${RUN_ID:-local}"
        # budget: monitor-cache (16s) - monitor/status must observe the planner before rail assertions.
        for i in $(seq 1 16); do
          curl -sf "$AFT_BASE_URL/api/monitor/status?workspace=E2E-PL-${AFT_CASE_KEY}" > "$AFT_WORK_DIR/pln-d7-monitor-before-rail.json" &&
          python3 - "$AFT_WORK_DIR/pln-d7-monitor-before-rail.json" "$name" <<'PY' && exit 0
        import json, sys
        d = json.load(open(sys.argv[1]))
        name = sys.argv[2]
        matches = [a for a in d.get("agents", []) if a.get("name") == name]
        assert matches, d.get("agents")
        a = matches[0]
        assert a.get("role") == "plan", a
        assert (a.get("status") or "idle") in {"idle", "configured"}, a
        PY
          sleep 1
        done
        echo "monitor status never exposed planner before rail assertion"
        cat "$AFT_WORK_DIR/pln-d7-monitor-before-rail.json" 2>/dev/null || true
        exit 1
      intent: An operator polls monitor status before asserting monitor-derived Planner rail fields
    - reload: true
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the Planner detail route remounts after monitor polling
    - wait:
        fn: document.querySelector('[data-testid=agent-section-background]')?.textContent.includes('planner-${RUN_ID:-local}')
      intent: Wait until the workspace tree renders the Planner under the Background subgroup after the monitor cache window
    - expect:
        visible:
          testid: agent-section-background
    - wait:
        fn: |-
          (() => {
            const el = document.querySelector("[aria-label='Agent: planner-${RUN_ID:-local}']");
            const text = el?.textContent || '';
            return !!el && text.includes('Plan') && text.includes('Idle');
          })()
      intent: Wait until the Planner card renders its Plan role and Idle status
    - expect:
        attr:
          selector: "[aria-label='Agent: planner-${RUN_ID:-local}']"
          name: data-status
          equals: idle
    - click:
        role: button
        name: Info
        exact: true
    - wait:
        fn: |-
          (() => {
            const activePane = () => {
              const root = document.querySelector('[data-testid=agent-editor-groups]');
              return Array.from(root?.querySelectorAll('[role=tabpanel]:not([data-hidden])') || [])
                .find((pane) => !pane.parentElement?.closest('[role=tabpanel]'));
            };
            const pane = activePane();
            const text = (pane?.textContent || '').replace(/\s+/g, ' ').trim();
            const fieldValue = (label) => {
              const term = Array.from(pane?.querySelectorAll('dt') || [])
                .find((node) => (node.textContent || '').trim() === label);
              const value = term?.nextElementSibling;
              return value?.tagName === 'DD' ? (value.textContent || '').trim() : null;
            };
            return text.includes('Plan agent') &&
              fieldValue('Role') === 'Plan' && fieldValue('Scope') === 'plan-repo';
          })()
      intent: Wait until the Info tab reports the Planner role and repo scope
    - open: "/ws/E2E-PL-${AFT_CASE_KEY}/monitor"
    - wait:
        fn: "!!document.querySelector('[data-testid=agent-activity-panel]')"
      intent: Wait until the monitor activity panel is mounted
    - run: |
        set -e
        name="planner-${RUN_ID:-local}"
        # budget: monitor-cache (16s) - activity panel data follows the monitor/status cache.
        for i in $(seq 1 16); do
          curl -sf "$AFT_BASE_URL/api/monitor/status?workspace=E2E-PL-${AFT_CASE_KEY}" > "$AFT_WORK_DIR/pln-d7-monitor.json" &&
          python3 - "$AFT_WORK_DIR/pln-d7-monitor.json" "$name" <<'PY' && exit 0
        import json, sys
        d = json.load(open(sys.argv[1]))
        name = sys.argv[2]
        matches = [a for a in d.get("agents", []) if a.get("name") == name]
        assert len(matches) == 1, d.get("agents")
        a = matches[0]
        assert a.get("role") == "plan", a
        assert (a.get("status") or "idle") in {"idle", "configured"}, a
        PY
          sleep 1
        done
        echo "monitor status never exposed planner"
        cat "$AFT_WORK_DIR/pln-d7-monitor.json" 2>/dev/null || true
        exit 1
      intent: An operator polls monitor status until it exposes the Planner
    - reload: true
  run-scenario-8-modal-created-planner-claims-no-work-wit:
    intent: An operator confirms that a configured Planner without a supervisor starts no worker process and leaves a design-less task open, unassigned, and sessionless
    actor: human
    via: ui
    steps:
    - api:
        method: POST
        path: "/api/workspaces/E2E-PL-${AFT_CASE_KEY}/issues"
        body:
          title: planner-idle ${RUN_ID:-local}
          issue_type: task
          priority: 2
        save:
        - from: data.id
          as: plannerIdleTaskId
      intent: An API client creates a design-less task that the daemonless Planner must not claim
    - open: "/ws/E2E-PL-${AFT_CASE_KEY}/kanban"
    - wait:
        fn: "!!document.querySelector('[data-testid=board-toolbar]')"
      intent: Wait until the workspace board is ready
    - wait:
        text: planner-idle ${RUN_ID:-local}
      intent: Wait until the design-less idle probe task appears on the board
    - wait:
        ms: 8000
      intent: Wait one agent-store poll margin to prove the daemonless Planner does not claim the task
    - api:
        method: GET
        path: "/api/workspaces/E2E-PL-${AFT_CASE_KEY}/issues/${var:plannerIdleTaskId}"
        assert:
        - path: data.status
          equals: open
        - path: data.assignee
          exists: false
        - path: data.has_design
          equals: false
        - path: data.design
          exists: false
      intent: An operator confirms the design-less task remained open, unassigned, and unplanned
    - run: |
        set -e
        name="planner-${RUN_ID:-local}"
        curl -sf "$AFT_BASE_URL/api/workspaces/E2E-PL-${AFT_CASE_KEY}/agents" > "$AFT_WORK_DIR/pln-d8-agents.json"
        python3 - "$AFT_WORK_DIR/pln-d8-agents.json" "$name" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        data = d.get("data", d)
        agents = data.get("agents") if isinstance(data, dict) else data
        matches = [a for a in agents or [] if a.get("name") == sys.argv[2]]
        assert len(matches) == 1, agents
        a = matches[0]
        assert not a.get("state") or a.get("state") == "idle", a
        assert not a.get("active_task_id"), a
        PY
      intent: An operator verifies the Planner assignment itself is still idle with no active task
    - api:
        method: GET
        path: "/api/workspaces/E2E-PL-${AFT_CASE_KEY}/tasks/${var:plannerIdleTaskId}/sessions"
        assert:
        - path: data.sessions.0
          exists: false
      intent: An operator confirms no planning session was recorded for the untouched task
  run-scenario-9-assigned-in-progress-planner-renders-act:
    intent: An orchestration client assigns in-progress tasks and an operator reviews the synthesized Planning and Working projections plus assignee identity without treating them as process-health evidence
    actor: human
    via: ui
    steps:
    - api:
        method: POST
        path: "/api/workspaces/E2E-PL-${AFT_CASE_KEY}/agents"
        body:
          name: planner-task-${RUN_ID:-local}
          role_name: task
          auto: false
          cross_repo: false
          repos:
          - plan-repo
          backend: codex
        status: 201
      intent: An API client provisions a task-role contrast agent without starting it
    - api:
        method: POST
        path: "/api/workspaces/E2E-PL-${AFT_CASE_KEY}/issues"
        body:
          title: planner-planning ${RUN_ID:-local}
          issue_type: task
          priority: 2
        save:
        - from: data.id
          as: plannerPlanningTaskId
      intent: An orchestration client creates the design-less task used for the Planner planning badge
    - api:
        method: PATCH
        path: "/api/workspaces/E2E-PL-${AFT_CASE_KEY}/issues/${var:plannerPlanningTaskId}"
        body:
          assignee: planner-${RUN_ID:-local}
          status: in_progress
      intent: An orchestration client assigns the task to the Planner and marks it in progress
    - api:
        method: POST
        path: "/api/workspaces/E2E-PL-${AFT_CASE_KEY}/issues"
        body:
          title: planner-working-contrast ${RUN_ID:-local}
          issue_type: task
          priority: 2
        save:
        - from: data.id
          as: plannerWorkingTaskId
      intent: An orchestration client creates the contrast task for a task-role agent
    - api:
        method: PATCH
        path: "/api/workspaces/E2E-PL-${AFT_CASE_KEY}/issues/${var:plannerWorkingTaskId}"
        body:
          assignee: planner-task-${RUN_ID:-local}
          status: in_progress
      intent: An orchestration client assigns the contrast task to the task-role agent
    - open: "/ws/E2E-PL-${AFT_CASE_KEY}/agents/planner-${RUN_ID:-local}"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the Planner agents page is mounted before the monitor cache window
    - run: |
        set -e
        planner="planner-${RUN_ID:-local}"
        task="planner-task-${RUN_ID:-local}"
        # budget: monitor-cache (16s) - synthesized planner/task statuses flow through monitor/status.
        for i in $(seq 1 16); do
          curl -sf "$AFT_BASE_URL/api/monitor/status?workspace=E2E-PL-${AFT_CASE_KEY}" > "$AFT_WORK_DIR/pln-d9-monitor.json" &&
          python3 - "$AFT_WORK_DIR/pln-d9-monitor.json" "$planner" "$task" <<'PY' && exit 0
        import json, sys
        d = json.load(open(sys.argv[1]))
        planner, task = sys.argv[2], sys.argv[3]
        by_name = {a.get("name"): a for a in d.get("agents", [])}
        assert (by_name.get(planner, {}).get("status") or "").startswith("planning"), by_name
        assert (by_name.get(task, {}).get("status") or "").startswith("working"), by_name
        PY
          sleep 1
        done
        echo "monitor status never synthesized planner planning/task working"
        cat "$AFT_WORK_DIR/pln-d9-monitor.json" 2>/dev/null || true
        exit 1
      intent: An operator polls monitor status before checking synthesized agent statuses
    - reload: true
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the agents page remounts after the monitor cache window
    - wait:
        fn: |-
          (() => {
            const planner = document.querySelector("[aria-label='Agent: planner-${RUN_ID:-local}']");
            const task = document.querySelector("[aria-label='Agent: planner-task-${RUN_ID:-local}']");
            const plannerTask = planner?.querySelector('[data-task=true]');
            const taskTask = task?.querySelector('[data-task=true]');
            return !!planner && planner.getAttribute('data-status') === 'planning' && !!plannerTask?.textContent?.trim() &&
              !!task && task.getAttribute('data-status') === 'working' && !!taskTask?.textContent?.trim();
          })()
      intent: Wait until metrics synthesis renders planning and working states with active-task badges
    - expect:
        attr:
          selector: "[aria-label='Agent: planner-${RUN_ID:-local}']"
          name: data-status
          equals: planning
    - expect:
        attr:
          selector: "[aria-label='Agent: planner-task-${RUN_ID:-local}']"
          name: data-status
          equals: working
    - open: "/ws/E2E-PL-${AFT_CASE_KEY}/kanban"
    - wait:
        fn: "!!document.querySelector('[data-testid=board-toolbar]')"
      intent: Wait until the workspace board is ready before opening the issue panel
    - fill:
        testid: search-input-field
        value: planner-planning ${RUN_ID:-local}
    - wait:
        fn: Array.from(document.querySelectorAll("article")).some((el) => el.textContent.includes('planner-planning ${RUN_ID:-local}'))
      intent: Wait until the assigned Planner issue is visible on the board
    - click:
        selector: article[aria-label*='planner-planning ${RUN_ID:-local}']
        first: true
  run-scenario-10-stopped-planner-shows-no-terminal-empty-:
    intent: An operator who stops the Planner sees the agents page explain that there is no live terminal session instead of attaching to one
    actor: human
    via: ui
    steps:
    - api:
        method: PATCH
        path: "/api/workspaces/E2E-PL-${AFT_CASE_KEY}/agents/planner-${RUN_ID:-local}"
        body:
          desired_state: stopped
        status: 200
      intent: An API client stops the Planner by patching desired_state, not the unprojected state field
    - run: |
        set -e
        name="planner-${RUN_ID:-local}"
        curl -sf "$AFT_BASE_URL/api/workspaces/E2E-PL-${AFT_CASE_KEY}/agents" > "$AFT_WORK_DIR/pln-d10-stopped.json"
        python3 - "$AFT_WORK_DIR/pln-d10-stopped.json" "$name" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        data = d.get("data", d)
        agents = data.get("agents") if isinstance(data, dict) else data
        matches = [a for a in agents or [] if a.get("name") == sys.argv[2]]
        assert len(matches) == 1, agents
        assert matches[0].get("desired_state") == "stopped", matches[0]
        PY
      intent: An operator reads the unordered agent list and confirms desired_state stopped persisted
    - open: "/ws/E2E-PL-${AFT_CASE_KEY}/agents/planner-${RUN_ID:-local}"
      intent: An operator opens the stopped Planner's detail route
    - click:
        selector: "[data-testid=agent-editor-groups] button"
        first: true
      intent: An operator selects Terminal to review the stopped background worker's no-session explanation
  run-scenario-11-planner-can-be-deleted-and-recreated:
    intent: An operator archives the Planner from the agents rail and recreates it from the modal under the same name
    actor: human
    via: ui
    steps:
    - hover:
        selector: "[data-testid=sortable-agent-row]:has([aria-label='Agent: planner-${RUN_ID:-local}'])"
      intent: An operator reveals the Planner row actions in the agents rail
    - click:
        selector: "[aria-label='Archive planner-${RUN_ID:-local}']"
      intent: An operator archives the Planner through its visible row action
    - wait:
        fn: document.body.textContent.includes('Agent planner-${RUN_ID:-local} archived')
      intent: Confirm the UI reports that the Planner was archived
    - wait:
        fn: |-
          !document.querySelector(
            "[data-testid=sortable-agent-row]:has([aria-label='Agent: planner-${RUN_ID:-local}'])"
          )
      intent: Confirm the archived Planner disappears from the agents rail
    - run: |
        set -e
        name="planner-${RUN_ID:-local}"
        # budget: db-persist (10s) - archived planner must disappear from list readback.
        for i in $(seq 1 10); do
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-PL-${AFT_CASE_KEY}/agents" > "$AFT_WORK_DIR/pln-d11-after-delete.json" &&
          python3 - "$AFT_WORK_DIR/pln-d11-after-delete.json" "$name" <<'PY' && exit 0
        import json, sys
        d = json.load(open(sys.argv[1]))
        data = d.get("data", d)
        agents = data.get("agents") if isinstance(data, dict) else data
        assert isinstance(agents, list), d
        assert not [a for a in agents or [] if a.get("name") == sys.argv[2]], agents
        PY
          sleep 1
        done
        echo "Planner still listed after archive"
        cat "$AFT_WORK_DIR/pln-d11-after-delete.json" 2>/dev/null || true
        exit 1
      intent: Confirm storage no longer lists the Planner archived through the UI
    - open: "/ws/E2E-PL-${AFT_CASE_KEY}/agents"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })() && !Array.from(document.querySelectorAll("[aria-label='Agent: planner-${RUN_ID:-local}']")).length
      intent: Wait until the archived Planner remains absent after the agents page settles
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open for recreate
    - click:
        testid: create-agent-template-planner
    - fill:
        testid: create-agent-name
        value: planner-${RUN_ID:-local}
    - click:
        testid: create-agent-submit
      intent: An operator submits the recreated Planner definition
    - use: show-planner-info
      with:
        name: planner-${RUN_ID:-local}
    - run: |
        set -e
        name="planner-${RUN_ID:-local}"
        curl -sf "$AFT_BASE_URL/api/workspaces/E2E-PL-${AFT_CASE_KEY}/agents" > "$AFT_WORK_DIR/pln-d11-agents.json"
        python3 - "$AFT_WORK_DIR/pln-d11-agents.json" "$name" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        data = d.get("data", d)
        agents = data.get("agents") if isinstance(data, dict) else data
        matches = [a for a in agents or [] if a.get("name") == sys.argv[2]]
        assert len(matches) == 1, agents
        assert matches[0].get("role_name") == "plan", matches[0]
        PY
      intent: An operator filters the unordered agent list and verifies the recreated Planner uses the plan role
