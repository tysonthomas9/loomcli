# View switching via the board toolbar's ViewSubSwitcher (role=tab buttons
# "Kanban" and "List"; List routes to /ws/:id/list, the data table stays at
# /ws/:id/table). The suite seeds one issue so the views have data.
suite: views
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: >-
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues" -H "Content-Type: application/json"
  -d "{\"title\":\"views seed $RUN_ID\",\"issue_type\":\"task\",\"priority\":2}" >/dev/null
  && echo "seeded 1 issue"
teardown: '"$AFT_TESTS_DIR/scripts/close-open-issues.sh"'

tests:
  - name: view tabs switch views and sync the URL
    intent: Switching between the Kanban and List views via the toolbar tabs updates the route and renders each view
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - expect: { visible: { selector: "[role=tablist][aria-label='View mode']" } }
      - wait: { text: views seed }
      - click: { role: tab, name: List, exact: true }
      - wait: { url: "**/ws/*/list**" }
      - expect: { text: views seed }
      - click: { role: tab, name: Kanban, exact: true }
      - wait: { url: "**/ws/*/kanban**" }
      - expect: { visible: { testid: board-toolbar } }

  - name: a deep link straight to the table view works
    intent: Opening /ws/E2E-WS/table directly renders the table without visiting the kanban first
    steps:
      - open: /ws/E2E-WS/table
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=issue-table]')
      - expect: { visible: { testid: issue-table } }
      - expect: { text: views seed }

  # covers: LCLI-DV-002
  - name: search survives list switch and table deep link
    intent: A URL-backed search filter stays applied when moving from Kanban to List and opening the table route directly
    steps:
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues" -H "Content-Type: application/json"
          -d "{\"title\":\"views-filter-match-${RUN_ID:-local}\",\"issue_type\":\"task\",\"priority\":2}" >/dev/null
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues" -H "Content-Type: application/json"
          -d "{\"title\":\"views-filter-miss-${RUN_ID:-local}\",\"issue_type\":\"task\",\"priority\":2}" >/dev/null
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - wait:
          fn: >-
            Array.from(document.querySelectorAll('section[data-status=ready] article')).some((el) => el.textContent.includes('views-filter-match-${RUN_ID:-local}'))
      - fill: { testid: search-input-field, value: "views-filter-match-${RUN_ID:-local}" }
      - wait: { url: "**search=views-filter-match-${RUN_ID:-local}**" }
      - expect: { count: { selector: "section[data-status=ready] article", equals: 1 } }
      - expect: { text: "views-filter-match-${RUN_ID:-local}" }
      - expect: { notText: "views-filter-miss-${RUN_ID:-local}" }
      - click: { role: tab, name: List, exact: true }
      - wait: { url: "**/ws/*/list**search=views-filter-match-${RUN_ID:-local}**" }
      - expect: { visible: { testid: list-page } }
      - expect: { value: { testid: search-input-field, equals: "views-filter-match-${RUN_ID:-local}" } }
      - expect: { text: "views-filter-match-${RUN_ID:-local}" }
      - expect: { notText: "views-filter-miss-${RUN_ID:-local}" }
      - open: /ws/E2E-WS/table?search=views-filter-match-${RUN_ID:-local}
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=issue-table]')
      - wait: { url: "**/ws/E2E-WS/table?search=views-filter-match-${RUN_ID:-local}**" }
      - expect: { visible: { testid: issue-table } }
      - expect: { value: { testid: search-input-field, equals: "views-filter-match-${RUN_ID:-local}" } }
      - expect: { text: "views-filter-match-${RUN_ID:-local}" }
      - expect: { notText: "views-filter-miss-${RUN_ID:-local}" }
