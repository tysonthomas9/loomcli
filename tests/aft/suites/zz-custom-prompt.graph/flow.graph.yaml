    prove-03-whitespace-only-custom-prompt-keeps-submit-disabled: verified-03-whitespace-only-custom-prompt-keeps-submit-disabled
    prove-07-xss-shaped-custom-prompt-is-inert-in-agents-ui: verified-07-xss-shaped-custom-prompt-is-inert-in-agents-ui
    prove-09-custom-prompt-named-task-is-rejected-by-the-seeded-worke: verified-09-custom-prompt-named-task-is-rejected-by-the-seeded-worke
    prove-10-custom-prompt-named-plan-is-rejected-by-the-seeded-worke: verified-10-custom-prompt-named-plan-is-rejected-by-the-seeded-worke
    prove-11-custom-prompt-named-lead-is-rejected-by-the-seeded-lead-: verified-11-custom-prompt-named-lead-is-rejected-by-the-seeded-lead-
    prove-12-custom-prompt-named-orchestrator-deterministically-creat: verified-12-custom-prompt-named-orchestrator-deterministically-creat
    prove-13-custom-prompt-trims-surrounding-whitespace-and-preserves: verified-13-custom-prompt-trims-surrounding-whitespace-and-preserves
    prove-14-backend-selection-reaches-custom-agent-row-and-terminal-: verified-14-backend-selection-reaches-custom-agent-row-and-terminal-
