kind: graph
version: 1
suite: zz-custom-prompt
classification:
  area: agents
  feature: custom-prompts
  surface: mixed
  purpose: journey
flow: custom-prompts
intent: Operators configure, validate, launch, and review interactive agents with custom prompts.
fixtureScope: graph
baseUrl: ${AFT_BASE_URL:-http://127.0.0.1:3100}
setup: |
  set -e
  "$AFT_TESTS_DIR/scripts/clean-test-workspace.sh" E2E-WS-CUSTOM
  "$AFT_TESTS_DIR/scripts/clean-test-workspace.sh" E2E-WS-CUSTOM-CTL
  for pair in custom:e2e-ws-custom ctl:e2e-ws-custom-ctl; do
    suffix="${pair%%:*}"
    name="${pair#*:}"
    repo="$AFT_WORK_DIR/${suffix}-repo"
    workspace="$AFT_WORK_DIR/${suffix}-workspace"
    mkdir -p "$repo"
    git -C "$repo" init -q
    git -C "$repo" -c user.email=e2e@x -c user.name=e2e commit --allow-empty -m init -q
    python3 -c 'import json,sys; print(json.dumps({"name":sys.argv[1],"type":"empty","path":sys.argv[2],"repos":[sys.argv[3]]}))' "$name" "$workspace" "$repo" > "$AFT_WORK_DIR/${suffix}-workspace.json"
    curl -sf -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/${suffix}-workspace.json" > "$AFT_WORK_DIR/${suffix}-workspace.resp.json"
  done
teardown: |
  set +e
  for ws in E2E-WS-CUSTOM E2E-WS-CUSTOM-CTL; do
    AFT_WS="$ws" "$AFT_TESTS_DIR/scripts/close-open-issues.sh"
    "$AFT_TESTS_DIR/scripts/clean-test-workspace.sh" "$ws"
  done
imports:
  - shared-steps.yaml
  - steps/persistence.yaml
  - steps/validation.yaml
  - steps/runtime.yaml
  - steps/realtime.yaml
  - states.yaml
  - transitions.yaml
start: browser-ready
graph:
  browser-ready:
    request-create-agent-dialog: create-agent-dialog-ready
    prove-04-multiline-metacharacter-prompt-persists-byte-exact: verified-04-multiline-metacharacter-prompt-persists-byte-exact
    prove-08-thirty-two-kilobyte-custom-prompt-survives-the-ui-round-: verified-08-thirty-two-kilobyte-custom-prompt-survives-the-ui-round-
    prove-22-built-in-pr-review-template-works-in-a-clean-control-wor: verified-22-built-in-pr-review-template-works-in-a-clean-control-wor
    clear-primary-custom-agent: primary-custom-agent-cleared
    seed-primary-custom-agent: primary-custom-agent-ready
    reset-template-prompt-subject: template-prompt-subject-cleared
