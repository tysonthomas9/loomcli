        intent: Wait until the claude-backed custom agent appears after submit
      - use: choose-custom-prompt-template
        with:
          path: /ws/E2E-WS-CUSTOM/agents
          readyIntent: Wait until the custom workspace agents page is ready for the default backend companion
          dialogIntent: Wait until the agent creation dialog is open for the default backend companion
      - fill:
          testid: create-agent-name
          value: cust-be-default-${RUN_ID:-local}
      - fill:
          testid: create-agent-interactive-prompt
          value: AFT-BACKEND-DEFAULT-${RUN_ID:-local}
      - click:
          testid: create-agent-submit
      - wait:
          fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('cust-be-default-${RUN_ID:-local}')"
        intent: Wait until the codex-backed default custom agent appears after submit
      - api:
          method: GET
          path: /api/backends
          assert:
            - path: data
              contains: codex
            - path: data
              contains: claude
            - path: data
              contains: cursor
            - path: data
              contains: opencode
            - path: data
              contains: gemini
        intent: An operator confirms the registered backend list includes every first-class backend
      - open: /ws/E2E-WS-CUSTOM/agents/cust-be-${RUN_ID:-local}
      - wait:
          fn: |-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: Wait until the claude-backed custom agent detail page is ready
      - wait:
          fn: "!!document.querySelector('[data-testid=terminal-view] [data-testid=terminal-tab-bar], [data-testid=terminal-view] [data-testid=terminal-wrapper]')"
        intent: Wait until the claude-backed custom agent terminal surface is mounted
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="cust-be-$run"
          default_name="cust-be-default-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/agents" > "$AFT_WORK_DIR/d10-agents.json"
          python3 - "$AFT_WORK_DIR/d10-agents.json" "$name" "$default_name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          by_name = {a.get("name"): a for a in agents or []}
          assert by_name[sys.argv[2]].get("backend") == "claude", by_name[sys.argv[2]]
          assert by_name[sys.argv[3]].get("backend") == "codex", by_name[sys.argv[3]]
          PY
          # budget: terminal-launch (120s) - backend-specific launch argv appears after tab creation.
          for i in $(seq 1 60); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/terminal/tabs" > "$AFT_WORK_DIR/d10-tabs.json" &&
            python3 - "$AFT_WORK_DIR/d10-tabs.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          tabs = d.get("data") or []
          matches = [t for t in tabs if t.get("agent_id") == name]
          assert matches, tabs
          t = matches[0]
          launch = t.get("launch") or {}
          argv = launch.get("argv") or []
          cmd = argv[1] if len(argv) > 1 else ""
          env = launch.get("env") or {}
          assert t.get("kind") == "agent", t
          assert t.get("role") == name, t
          assert t.get("backend") == "claude", t
          assert argv and argv[0] == "-c", argv
          assert "'--backend' 'claude'" in cmd, cmd
          assert cmd.endswith("'lead'"), cmd
          assert "--prompt" not in cmd, cmd
          assert env.get("LOOM_AGENT_ROLE") == name, env
          assert env.get("LOOM_AGENT_NAME") == name, env
          assert launch.get("cwd", "") == "", launch
          PY
            sleep 2
          done
          echo "claude backend terminal launch metadata never appeared"
          cat "$AFT_WORK_DIR/d10-tabs.json" 2>/dev/null || true
          exit 1
        intent: An operator polls terminal tabs until the claude-backed launch spec is persisted and verifies argv env and cwd
