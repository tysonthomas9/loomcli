              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: Wait until the repo-scoped custom agent detail page is ready
      - wait:
          fn: "!!document.querySelector('[data-testid=terminal-view] [data-testid=terminal-tab-bar], [data-testid=terminal-view] [data-testid=terminal-wrapper]')"
        intent: Wait until the repo-scoped custom agent terminal surface is mounted
      - open: /ws/E2E-WS-CUSTOM/agents/cust-cross-${RUN_ID:-local}
      - wait:
          fn: |-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: Wait until the workspace-wide custom agent detail page is ready
      - wait:
          fn: "!!document.querySelector('[data-testid=terminal-view] [data-testid=terminal-tab-bar], [data-testid=terminal-view] [data-testid=terminal-wrapper]')"
        intent: Wait until the workspace-wide custom agent terminal surface is mounted
      - run: |
          set -e
          run="${RUN_ID:-local}"
          repo_agent="cust-repo-$run"
          cross_agent="cust-cross-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM" > "$AFT_WORK_DIR/d11-workspace.json"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/agents" > "$AFT_WORK_DIR/d11-agents.json"
          python3 - "$AFT_WORK_DIR/d11-workspace.json" "$AFT_WORK_DIR/d11-agents.json" "$repo_agent" "$cross_agent" <<'PY'
          import json, pathlib, sys
          ws = json.load(open(sys.argv[1]))["data"]
          d = json.load(open(sys.argv[2]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          by_name = {a.get("name"): a for a in agents or []}
          repo = ws["repos"][0]["name"]
          repo_agent, cross_agent = sys.argv[3], sys.argv[4]
          a = by_name[repo_agent]
          assert not a.get("cross_repo"), a
          assert a.get("repos") == [repo], (a, repo)
          b = by_name[cross_agent]
          assert b.get("cross_repo") is True, b
          assert not b.get("repos"), b
          for name in [repo_agent, cross_agent]:
              path = pathlib.Path(ws["path"]) / "worktrees" / repo / name
              assert not path.exists(), str(path)
          PY
          for agent in "$repo_agent" "$cross_agent"; do
            # budget: terminal-launch (120s) - each terminal tab must persist its launch env.
            for i in $(seq 1 60); do
              curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/terminal/tabs" > "$AFT_WORK_DIR/d11-tabs-$agent.json" &&
              python3 - "$AFT_WORK_DIR/d11-tabs-$agent.json" "$agent" <<'PY' && break
          import json, sys
          d = json.load(open(sys.argv[1]))
          agent = sys.argv[2]
          tabs = d.get("data") or []
          matches = [t for t in tabs if t.get("agent_id") == agent]
          assert matches, tabs
          launch = matches[0].get("launch") or {}
          assert launch.get("cwd", "") == "", launch
          PY
              sleep 2
            done
            python3 - "$AFT_WORK_DIR/d11-tabs-$agent.json" "$agent" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          agent = sys.argv[2]
          tabs = d.get("data") or []
          matches = [t for t in tabs if t.get("agent_id") == agent]
          assert matches, tabs
          assert (matches[0].get("launch") or {}).get("cwd", "") == "", matches[0]
          PY
          done
        intent: An operator reads back repo scope, absent agent worktrees, and empty launch cwd from API and terminal tabs
