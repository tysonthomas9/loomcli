kind: graph-steps
version: 1
flow: custom-prompts
blocks:
  case-06-custom-prompt-reaches-codex-argv-in-the-noninteractive-r:
    steps:
      - api:
          method: POST
          path: /api/workspaces/E2E-WS-CUSTOM/agents
          body:
            name: cust-both-argv-${RUN_ID:-local}
            role_name: cust-both-argv-${RUN_ID:-local}
            kind: interactive
            prompt: AFT-INLINE-${RUN_ID:-local}
            prompt_file: builtin:pr-review
            auto: false
            backend: codex
          status: 201
        intent: An API client provisions the prompt precedence subject used by the same argv probe
      - run: |
          set -e
          python3 - "$AFT_WORK_DIR" "$AFT_LOOM_BIN" "$AFT_LOOM_CONFIG_DIR" "${RUN_ID:-local}" <<'PY'
          import os, pathlib, shlex, stat, subprocess, sys
          work = pathlib.Path(sys.argv[1]).resolve()
          loom = sys.argv[2]
          config_dir = sys.argv[3]
          run = sys.argv[4]
          stub_dir = work / "cus-d14-stubbin"
          stub_dir.mkdir(parents=True, exist_ok=True)
          stub = stub_dir / "codex"
          def write_stub(log):
              log_arg = shlex.quote(str(log))
              stub.write_text(f"""#!/bin/sh
          printf '%s\\0' "$@" >> {log_arg}
          printf -- '--\\0' >> {log_arg}
          printf '{{"status":"completed","output":"stub"}}\\n'
          exit 0
          """, encoding="utf-8")
              stub.chmod(stub.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          def run_probe(agent, fixture=None, inline=None):
              log = work / f"{agent}.argv"
              out = work / f"{agent}.lead.out"
              if log.exists():
                  log.unlink()
              write_stub(log)
              env = os.environ.copy()
              env.update({
                  "PATH": str(stub_dir) + os.pathsep + env.get("PATH", ""),
                  "LOOM_CONFIG_DIR": config_dir,
                  "LOOM_LEAD_CONTROLLED": "0",
                  "LOOM_AGENT_NAME": agent,
                  "LOOM_AGENT_ROLE": agent,
              })
              env.pop("LOOM_AGENT_EFFORT", None)
              env.pop("LOOM_CLAUDE_EFFORT", None)
              with out.open("wb") as fh:
                  try:
                      subprocess.run([loom, "--workspace", "E2E-WS-CUSTOM", "--backend", "codex", "lead"], input=b"", stdout=fh, stderr=subprocess.STDOUT, env=env, timeout=60, check=True)
                  except Exception:
                      sys.stderr.write(out.read_text(encoding="utf-8", errors="replace"))
                      if log.exists():
                          sys.stderr.write(repr(log.read_bytes()) + "\n")
                      raise
              raw = log.read_bytes()
              records = [r for r in raw.split(b"--\0") if r]
              assert records, raw
              exec_records = [
                  r for r in records
                  if ([x.decode("utf-8") for x in r.split(b"\0") if x] or [""])[0] == "exec"
              ]
              assert exec_records, raw
              first = [x.decode("utf-8") for x in exec_records[0].split(b"\0") if x]
              assert first[:3] == ["exec", "--json", "--dangerously-bypass-approvals-and-sandbox"], first
              prompt = first[-1]
              if fixture:
                  want = pathlib.Path(fixture).read_text(encoding="utf-8")
                  assert prompt.startswith(want), (prompt[:120], want)
                  assert "{{ .AgentName }}" in prompt, prompt
                  assert agent not in prompt, prompt
              if inline:
                  assert prompt.startswith(inline), prompt[:120]
                  assert "builtin:pr-review" not in prompt, prompt
              assert prompt.count("\n\n### Multi-Agent Safety Rules") == 1, prompt
              assert "## INTERACTIVE MODE: Project Lead" not in prompt, prompt
              for rec in exec_records[1:]:
                  assert rec == exec_records[0], raw

          run_probe(f"cust-tmpl-{run}", fixture=work / "cus-d5.prompt")
          run_probe(f"cust-both-argv-{run}", inline=f"AFT-INLINE-{run}")
          PY
        intent: The local runtime probes codex argv with a per-test stub and verifies the custom prompt is final and literal
  terminal-06-custom-prompt-reaches-codex-argv-in-the-noninteractive-r:
    steps:
      - expect:
          visible:
            selector: "[aria-label='Agent: cust-tmpl-${RUN_ID:-local}']"
  case-12-custom-prompt-named-orchestrator-deterministically-creat:
    steps:
      - click:
          testid: create-agent-template-custom-prompt
      - fill:
          testid: create-agent-name
          value: orchestrator
      - wait:
          fn: document.querySelectorAll('[data-testid=create-agent-backend] option').length > 1
        intent: Wait until backend options are loaded before selecting claude
      - select:
          testid: create-agent-backend
          value: claude
      - fill:
          testid: create-agent-interactive-prompt
          value: AFT-D8D-${RUN_ID:-local}
      - use: capture-controlled-claude-authored-prompt
        with:
          fingerprintKey: orchestrator
      - click:
          testid: create-agent-submit
      - wait:
          fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('orchestrator')"
        intent: Wait until the orchestrator custom agent appears after submit
      - expect:
          count:
            testid: create-agent-error
            equals: 0
      - run: |
          set -e
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/agents" > "$AFT_WORK_DIR/d8d-agents.json"
          python3 - "$AFT_WORK_DIR/d8d-agents.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          matches = [a for a in agents or [] if a.get("name") == "orchestrator"]
          assert len(matches) == 1, agents
          assert matches[0].get("role_name") == "orchestrator", matches[0]
          PY
        intent: An operator's public readback confirms orchestrator owns one custom role identity
      - run: |
          set -e
          LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" "$AFT_LOOM_BIN" --workspace E2E-WS-CUSTOM role show orchestrator --json > "$AFT_WORK_DIR/d8d-role.json"
          python3 - "$AFT_WORK_DIR/d8d-role.json" "${RUN_ID:-local}" <<'PY'
          import hashlib, json, sys
          role = json.load(open(sys.argv[1]))
          prompt = role.get("prompt")
          prompt_bytes = prompt.encode("utf-8") if isinstance(prompt, str) else None
          summary = {
              "name": role.get("name"),
              "kind": role.get("kind"),
              "description": role.get("description"),
              "prompt_bytes": len(prompt_bytes) if prompt_bytes is not None else None,
              "prompt_sha256": hashlib.sha256(prompt_bytes).hexdigest() if prompt_bytes is not None else None,
          }
          assert role.get("kind") == "interactive", summary
          assert prompt == "AFT-D8D-" + sys.argv[2], summary
          assert role.get("description") == "Lead/orchestrator interactive", summary
          PY
        intent: Confirm the orchestrator role stores the exact custom prompt and legacy interactive description
      - open: /ws/E2E-WS-CUSTOM/agents/orchestrator
        intent: An operator opens the orchestrator-named agent to verify its controlled Claude session
  terminal-12-custom-prompt-named-orchestrator-deterministically-creat:
    steps:
      - use: assert-controlled-agent-terminal
        with:
          workspace: E2E-WS-CUSTOM
          agent: orchestrator
          role: orchestrator
          backend: claude
          readyText: "Controlled Claude stub ready: orchestrator"
      - use: assert-controlled-claude-authored-prompt
        with:
          fingerprintKey: orchestrator
      - wait:
          fn: |-
            (async () => {
              const [tabResponse, monitorResponse] = await Promise.all([
                fetch('/api/workspaces/E2E-WS-CUSTOM/terminal/tabs', { cache: 'no-store' }),
                fetch('/api/monitor/status?workspace=E2E-WS-CUSTOM', { cache: 'no-store' }),
              ]);
              if (!tabResponse.ok || !monitorResponse.ok) return false;
              const payload = await tabResponse.json();
              const monitor = await monitorResponse.json();
              const tabs = Array.isArray(payload.data) ? payload.data : [];
              const matches = tabs.filter((tab) => tab.agent_id === 'orchestrator');
              const projected = Array.isArray(monitor.agents)
                ? monitor.agents.filter((agent) => agent.name === 'orchestrator')
                : [];
              return matches.length === 1 &&
                matches[0]?.launch?.env?.LOOM_AGENT_ROLE === 'orchestrator' &&
                projected.length === 1 &&
                projected[0].role === 'orchestrator' &&
                projected[0].role_kind === 'interactive';
            })()
        intent: Confirm the live launch and monitor projection both resolve orchestrator as the interactive role
  case-14-backend-selection-reaches-custom-agent-row-and-terminal-:
    steps:
      - click:
          testid: create-agent-template-custom-prompt
      - fill:
          testid: create-agent-name
          value: cust-be-${RUN_ID:-local}
      - wait:
          fn: document.querySelectorAll('[data-testid=create-agent-backend] option').length > 1
        intent: Wait until backend options are loaded before selecting claude
      - select:
          testid: create-agent-backend
          value: claude
      - fill:
          testid: create-agent-interactive-prompt
          value: AFT-BACKEND-${RUN_ID:-local}
      - use: capture-controlled-claude-authored-prompt
        with:
          fingerprintKey: cust-be-${RUN_ID:-local}
      - click:
          testid: create-agent-submit
      - wait:
          fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('cust-be-${RUN_ID:-local}')"
        intent: Wait until the claude-backed custom agent appears after submit
      - use: choose-custom-prompt-template
        with:
          path: /ws/E2E-WS-CUSTOM/agents
          readyIntent: Wait until the custom workspace agents page is ready for the default backend companion
          dialogIntent: Wait until the agent creation dialog is open for the default backend companion
      - fill:
          testid: create-agent-name
          value: cust-be-default-${RUN_ID:-local}
      - fill:
          testid: create-agent-interactive-prompt
          value: AFT-BACKEND-DEFAULT-${RUN_ID:-local}
      - click:
          testid: create-agent-submit
      - wait:
          fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('cust-be-default-${RUN_ID:-local}')"
        intent: Wait until the codex-backed default custom agent appears after submit
      - api:
          method: GET
          path: /api/backends
          assert:
            - path: data
              contains: codex
            - path: data
              contains: claude
            - path: data
              contains: cursor
            - path: data
              contains: opencode
            - path: data
              contains: gemini
        intent: An operator confirms the registered backend list includes every first-class backend
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="cust-be-$run"
          default_name="cust-be-default-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/agents" > "$AFT_WORK_DIR/d10-agents.json"
          python3 - "$AFT_WORK_DIR/d10-agents.json" "$name" "$default_name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          by_name = {a.get("name"): a for a in agents or []}
          assert by_name[sys.argv[2]].get("backend") == "claude", by_name[sys.argv[2]]
          assert by_name[sys.argv[3]].get("backend") == "codex", by_name[sys.argv[3]]
          PY
        intent: An operator's readback confirms the selected agent uses Claude while its default-backend companion uses Codex
      - open: /ws/E2E-WS-CUSTOM/agents/cust-be-${RUN_ID:-local}
        intent: An operator opens the Claude-backed agent to verify the selected backend actually starts
  terminal-14-backend-selection-reaches-custom-agent-row-and-terminal-:
    steps:
      - use: assert-controlled-agent-terminal
        with:
          workspace: E2E-WS-CUSTOM
          agent: cust-be-${RUN_ID:-local}
          role: cust-be-${RUN_ID:-local}
          backend: claude
          readyText: "Controlled Claude stub ready: cust-be-${RUN_ID:-local}"
      - use: assert-controlled-claude-authored-prompt
        with:
          fingerprintKey: cust-be-${RUN_ID:-local}
      - wait:
          fn: |-
            (async () => {
              const name = 'cust-be-${RUN_ID:-local}';
              const response = await fetch('/api/workspaces/E2E-WS-CUSTOM/terminal/tabs', { cache: 'no-store' });
              if (!response.ok) return false;
              const payload = await response.json();
              const tabs = Array.isArray(payload.data) ? payload.data : [];
              const matches = tabs.filter((tab) => tab.agent_id === name);
              if (matches.length !== 1) return false;
              const tab = matches[0];
              const launch = tab.launch || {};
              const argv = launch.argv || [];
              const command = argv.length > 1 ? argv[1] : '';
              const env = launch.env || {};
              return argv[0] === '-c' &&
                command.includes("'--backend' 'claude'") &&
                command.endsWith("'lead'") &&
                !command.includes('--prompt') &&
                env.LOOM_AGENT_ROLE === name &&
                env.LOOM_AGENT_NAME === name &&
                (launch.cwd || '') === '';
            })()
        intent: Confirm the connected Claude terminal preserves the selected backend, agent identity, and no-worktree launch contract
  case-15-repo-scoping-persists-but-custom-interactive-launch-has-:
    steps:
      - click:
          testid: create-agent-template-custom-prompt
      - fill:
          testid: create-agent-name
          value: cust-repo-${RUN_ID:-local}
      - wait:
          fn: document.querySelectorAll('[data-testid=create-agent-backend] option').length > 1
        intent: Wait until backend options are loaded before selecting claude
      - select:
          testid: create-agent-backend
          value: claude
      - fill:
          testid: create-agent-interactive-prompt
          value: AFT-REPO-SCOPED-${RUN_ID:-local}
      - use: capture-controlled-claude-authored-prompt
        with:
          fingerprintKey: cust-repo-${RUN_ID:-local}
      - click:
          testid: create-agent-submit
      - wait:
          fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('cust-repo-${RUN_ID:-local}')"
        intent: Wait until the repo-scoped custom agent appears after submit
      - use: choose-custom-prompt-template
        with:
          path: /ws/E2E-WS-CUSTOM/agents
          readyIntent: Wait until the custom workspace agents page is ready for workspace-wide scope
          dialogIntent: Wait until the agent creation dialog is open for workspace-wide scope
      - fill:
          testid: create-agent-name
          value: cust-cross-${RUN_ID:-local}
      - wait:
          fn: document.querySelectorAll('[data-testid=create-agent-backend] option').length > 1
        intent: Wait until backend options are loaded before selecting claude
      - select:
          testid: create-agent-backend
          value: claude
      - fill:
          testid: create-agent-interactive-prompt
          value: AFT-CROSS-REPO-${RUN_ID:-local}
      - use: capture-controlled-claude-authored-prompt
        with:
          fingerprintKey: cust-cross-${RUN_ID:-local}
      - wait:
          fn: |-
            (() => {
              const chips = document.querySelector('[data-testid="create-agent-repo-chips"]');
              const button = chips?.querySelector('button');
              if (!chips || !button) return false;
              let scroller = chips.parentElement;
              while (scroller && scroller !== document.body) {
                const style = getComputedStyle(scroller);
                if (/(auto|scroll)/.test(style.overflowY) && scroller.scrollHeight > scroller.clientHeight) break;
                scroller = scroller.parentElement;
              }
              chips.scrollIntoView({ block: 'center', inline: 'nearest' });
              const rect = button.getBoundingClientRect();
              const bounds = scroller && scroller !== document.body
                ? scroller.getBoundingClientRect()
                : { top: 0, bottom: window.innerHeight || document.documentElement.clientHeight };
              return rect.top >= bounds.top && rect.bottom <= bounds.bottom;
            })()
        intent: Scroll the modal body until the repo chips are visible before toggling workspace scope
      - click:
          selector: "[data-testid='create-agent-repo-chips'] button"
          first: true
      - click:
          testid: create-agent-submit
      - wait:
          fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('cust-cross-${RUN_ID:-local}')"
        intent: Wait until the workspace-wide custom agent appears after submit
      - run: |
          set -e
          run="${RUN_ID:-local}"
          repo_agent="cust-repo-$run"
          cross_agent="cust-cross-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM" > "$AFT_WORK_DIR/d11-workspace.json"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/agents" > "$AFT_WORK_DIR/d11-agents.json"
          python3 - "$AFT_WORK_DIR/d11-workspace.json" "$AFT_WORK_DIR/d11-agents.json" "$repo_agent" "$cross_agent" <<'PY'
          import json, pathlib, sys
          ws = json.load(open(sys.argv[1]))["data"]
          d = json.load(open(sys.argv[2]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          by_name = {a.get("name"): a for a in agents or []}
          repo = ws["repos"][0]["name"]
          repo_agent, cross_agent = sys.argv[3], sys.argv[4]
          a = by_name[repo_agent]
          assert not a.get("cross_repo"), a
          assert a.get("repos") == [repo], (a, repo)
          b = by_name[cross_agent]
          assert b.get("cross_repo") is True, b
          assert not b.get("repos"), b
          for name in [repo_agent, cross_agent]:
              path = pathlib.Path(ws["path"]) / "worktrees" / repo / name
              assert not path.exists(), str(path)
          PY
        intent: An operator reads back repo scope and confirms neither interactive agent receives a filesystem worktree
      - open: /ws/E2E-WS-CUSTOM/agents/cust-repo-${RUN_ID:-local}
        intent: An operator opens the repo-scoped agent and waits for its controlled Claude session
      - use: assert-controlled-agent-terminal
        with:
          workspace: E2E-WS-CUSTOM
          agent: cust-repo-${RUN_ID:-local}
          role: cust-repo-${RUN_ID:-local}
          backend: claude
          readyText: "Controlled Claude stub ready: cust-repo-${RUN_ID:-local}"
      - use: assert-controlled-claude-authored-prompt
        with:
          fingerprintKey: cust-repo-${RUN_ID:-local}
      - wait:
          fn: |-
            (async () => {
              const name = 'cust-repo-${RUN_ID:-local}';
              const response = await fetch('/api/workspaces/E2E-WS-CUSTOM/terminal/tabs', { cache: 'no-store' });
              if (!response.ok) return false;
              const payload = await response.json();
              const tabs = Array.isArray(payload.data) ? payload.data : [];
              const matches = tabs.filter((tab) => tab.agent_id === name);
              return matches.length === 1 && (matches[0].launch?.cwd || '') === '';
            })()
        intent: Confirm the connected repo-scoped agent starts without a terminal worktree cwd
      - open: /ws/E2E-WS-CUSTOM/agents/cust-cross-${RUN_ID:-local}
        intent: An operator opens the workspace-wide agent to verify the second independent Claude session
  terminal-15-repo-scoping-persists-but-custom-interactive-launch-has-:
    steps:
      - use: assert-controlled-agent-terminal
        with:
          workspace: E2E-WS-CUSTOM
          agent: cust-cross-${RUN_ID:-local}
          role: cust-cross-${RUN_ID:-local}
          backend: claude
          readyText: "Controlled Claude stub ready: cust-cross-${RUN_ID:-local}"
      - use: assert-controlled-claude-authored-prompt
        with:
          fingerprintKey: cust-cross-${RUN_ID:-local}
      - wait:
          fn: |-
            (async () => {
              const names = ['cust-repo-${RUN_ID:-local}', 'cust-cross-${RUN_ID:-local}'];
              const response = await fetch('/api/workspaces/E2E-WS-CUSTOM/terminal/tabs', { cache: 'no-store' });
              if (!response.ok) return false;
              const payload = await response.json();
              const tabs = Array.isArray(payload.data) ? payload.data : [];
              return names.every((name) => {
                const matches = tabs.filter((tab) => tab.agent_id === name);
                return matches.length === 1 &&
                  matches[0].pty_alive === true &&
                  (matches[0].launch?.cwd || '') === '';
              });
            })()
        intent: Confirm both independently launched agents remain connected without terminal worktree cwd values
  case-16-custom-prompt-is-not-visible-or-editable-after-creation:
    steps:
      - open: /ws/E2E-WS-CUSTOM/agents/cust-${RUN_ID:-local}
      - wait:
          fn: |-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: Wait until the previously created custom agent detail page is ready
      - wait:
          fn: |-
            (() => {
              const group = document.querySelector("[data-testid=agent-editor-groups]");
              if (!group) return false;
              const labels = Array.from(group.querySelectorAll('button[draggable="true"]')).map((b) => b.textContent.trim()).filter(Boolean);
              return JSON.stringify(labels) === JSON.stringify(["Terminal", "Info", "Git", "Logs", "Diff", "Files"]);
            })()
        intent: Wait until the agent editor tab labels exactly match the promptless tab set
      - expect:
          notText: AFT-PROMPT-MARKER
      - api:
          method: PATCH
          path: /api/workspaces/E2E-WS-CUSTOM/agents/cust-${RUN_ID:-local}
          body:
            prompt: AFT-SHOULD-NOT-CHANGE
          status: 200
        intent: An operator probes the agent patch API with a prompt field that the service ignores
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="cust-$run"
          want="You are a release-notes reviewer. AFT-PROMPT-MARKER-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/agents" > "$AFT_WORK_DIR/d12-agents.json"
          LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" "$AFT_LOOM_BIN" --workspace E2E-WS-CUSTOM role show "$name" --json > "$AFT_WORK_DIR/d12-role.json"
          python3 - "$AFT_WORK_DIR/d12-agents.json" "$AFT_WORK_DIR/d12-role.json" "$name" "$want" <<'PY'
          import hashlib, json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          matches = [a for a in agents or [] if a.get("name") == sys.argv[3]]
          assert len(matches) == 1, agents
          assert matches[0].get("role_name") == sys.argv[3], matches[0]
          assert matches[0].get("backend") == "codex", matches[0]
          role = json.load(open(sys.argv[2]))
          prompt = role.get("prompt")
          prompt_bytes = prompt.encode("utf-8") if isinstance(prompt, str) else None
          summary = {
              "name": role.get("name"),
              "kind": role.get("kind"),
              "prompt_bytes": len(prompt_bytes) if prompt_bytes is not None else None,
              "prompt_sha256": hashlib.sha256(prompt_bytes).hexdigest() if prompt_bytes is not None else None,
          }
          assert role.get("name") == sys.argv[3], summary
          assert role.get("kind") == "interactive", summary
          assert prompt == sys.argv[4], summary
          PY
        intent: Confirm the unsupported prompt patch leaves both the agent contract and exact persisted role prompt unchanged
  terminal-16-custom-prompt-is-not-visible-or-editable-after-creation:
    steps:
      - use: assert-controlled-agent-terminal
        with:
          workspace: E2E-WS-CUSTOM
          agent: cust-${RUN_ID:-local}
          role: cust-${RUN_ID:-local}
          backend: codex
          readyText: "Controlled Codex stub connected: cust-${RUN_ID:-local}"
      - wait:
          fn: |-
            (async () => {
              const authored = 'You are a release-notes reviewer. AFT-PROMPT-MARKER-${RUN_ID:-local}';
              const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(authored));
              const hash = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
              const wrapper = document.querySelector('[data-testid=terminal-wrapper]');
              if (!wrapper) return false;
              const rows = Array.from(wrapper.querySelectorAll('.term-row')).map((el) => el.textContent || '').join('\n');
              const text = rows || wrapper.textContent || '';
              return text.includes('Controlled Codex prompt contract: prefix-sha256=' + hash + ' safety-blocks=1');
            })()
        intent: Confirm the post-patch process still receives the original hidden prompt fingerprint and one safety block
