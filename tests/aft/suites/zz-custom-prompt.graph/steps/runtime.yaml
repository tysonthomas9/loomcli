kind: graph-steps
version: 1
flow: custom-prompts
blocks:
  case-06-custom-prompt-reaches-codex-argv-in-the-noninteractive-r:
    steps:
      - api:
          method: POST
          path: /api/workspaces/E2E-WS-CUSTOM/agents
          body:
            name: cust-both-argv-${RUN_ID:-local}
            role_name: cust-both-argv-${RUN_ID:-local}
            kind: interactive
            prompt: AFT-INLINE-${RUN_ID:-local}
            prompt_file: builtin:pr-review
            auto: false
            backend: codex
          status: 201
        intent: An API client provisions the prompt precedence subject used by the same argv probe
      - run: |
          set -e
          python3 - "$AFT_WORK_DIR" "$AFT_LOOM_BIN" "$AFT_LOOM_CONFIG_DIR" "${RUN_ID:-local}" <<'PY'
          import os, pathlib, shlex, stat, subprocess, sys
          work = pathlib.Path(sys.argv[1]).resolve()
          loom = sys.argv[2]
          config_dir = sys.argv[3]
          run = sys.argv[4]
          stub_dir = work / "cus-d14-stubbin"
          stub_dir.mkdir(parents=True, exist_ok=True)
          stub = stub_dir / "codex"
          def write_stub(log):
              log_arg = shlex.quote(str(log))
              stub.write_text(f"""#!/bin/sh
          printf '%s\\0' "$@" >> {log_arg}
          printf -- '--\\0' >> {log_arg}
          printf '{{"status":"completed","output":"stub"}}\\n'
          exit 0
          """, encoding="utf-8")
              stub.chmod(stub.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          def run_probe(agent, fixture=None, inline=None):
              log = work / f"{agent}.argv"
              out = work / f"{agent}.lead.out"
              if log.exists():
                  log.unlink()
              write_stub(log)
              env = os.environ.copy()
              env.update({
                  "PATH": str(stub_dir) + os.pathsep + env.get("PATH", ""),
                  "LOOM_CONFIG_DIR": config_dir,
                  "LOOM_LEAD_CONTROLLED": "0",
                  "LOOM_AGENT_NAME": agent,
                  "LOOM_AGENT_ROLE": agent,
              })
              env.pop("LOOM_AGENT_EFFORT", None)
              env.pop("LOOM_CLAUDE_EFFORT", None)
              with out.open("wb") as fh:
                  try:
                      subprocess.run([loom, "--workspace", "E2E-WS-CUSTOM", "--backend", "codex", "lead"], input=b"", stdout=fh, stderr=subprocess.STDOUT, env=env, timeout=60, check=True)
                  except Exception:
                      sys.stderr.write(out.read_text(encoding="utf-8", errors="replace"))
                      if log.exists():
                          sys.stderr.write(repr(log.read_bytes()) + "\n")
                      raise
              raw = log.read_bytes()
              records = [r for r in raw.split(b"--\0") if r]
              assert records, raw
              exec_records = [
                  r for r in records
                  if ([x.decode("utf-8") for x in r.split(b"\0") if x] or [""])[0] == "exec"
              ]
              assert exec_records, raw
              first = [x.decode("utf-8") for x in exec_records[0].split(b"\0") if x]
              assert first[:3] == ["exec", "--json", "--dangerously-bypass-approvals-and-sandbox"], first
              prompt = first[-1]
              if fixture:
                  want = pathlib.Path(fixture).read_text(encoding="utf-8")
                  assert prompt.startswith(want), (prompt[:120], want)
                  assert "{{ .AgentName }}" in prompt, prompt
                  assert agent not in prompt, prompt
              if inline:
                  assert prompt.startswith(inline), prompt[:120]
                  assert "builtin:pr-review" not in prompt, prompt
              assert prompt.count("\n\n### Multi-Agent Safety Rules") == 1, prompt
              assert "## INTERACTIVE MODE: Project Lead" not in prompt, prompt
              for rec in exec_records[1:]:
                  assert rec == exec_records[0], raw

          run_probe(f"cust-tmpl-{run}", fixture=work / "cus-d5.prompt")
          run_probe(f"cust-both-argv-{run}", inline=f"AFT-INLINE-{run}")
          PY
        intent: The local runtime probes codex argv with a per-test stub and verifies the custom prompt is final and literal
  terminal-06-custom-prompt-reaches-codex-argv-in-the-noninteractive-r:
    steps:
      - expect:
          visible:
            selector: "[aria-label='Agent: cust-tmpl-${RUN_ID:-local}']"
  case-12-custom-prompt-named-orchestrator-deterministically-creat:
    steps:
      - click:
          testid: create-agent-template-custom-prompt
      - fill:
          testid: create-agent-name
          value: orchestrator
      - wait:
          fn: document.querySelectorAll('[data-testid=create-agent-backend] option').length > 1
        intent: Wait until backend options are loaded before selecting claude
      - select:
          testid: create-agent-backend
          value: claude
      - fill:
          testid: create-agent-interactive-prompt
          value: AFT-D8D-${RUN_ID:-local}
      - click:
          testid: create-agent-submit
      - wait:
          fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('orchestrator')"
        intent: Wait until the orchestrator custom agent appears after submit
      - expect:
          count:
            testid: create-agent-error
            equals: 0
      - run: |
          set -e
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/agents" > "$AFT_WORK_DIR/d8d-agents.json"
          python3 - "$AFT_WORK_DIR/d8d-agents.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          matches = [a for a in agents or [] if a.get("name") == "orchestrator"]
          assert len(matches) == 1, agents
          assert matches[0].get("role_name") == "orchestrator", matches[0]
          PY
        intent: An operator's readback confirms the orchestrator-named custom agent exists
      - run: |
          set -e
          LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" "$AFT_LOOM_BIN" --workspace E2E-WS-CUSTOM role show orchestrator --json > "$AFT_WORK_DIR/d8d-role.json"
          python3 - "$AFT_WORK_DIR/d8d-role.json" "${RUN_ID:-local}" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          want = "AFT-D8D-" + sys.argv[2]
          assert r.get("kind") == "interactive", r
          assert r.get("prompt") == want, r
          assert r.get("description") == "Lead/orchestrator interactive", r
          PY
        intent: An operator's CLI readback confirms the orchestrator role prompt and legacy description
      - open: /ws/E2E-WS-CUSTOM/agents/orchestrator
      - wait:
          fn: |-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: Wait until the orchestrator agent detail page is ready
      - wait:
          fn: "!!document.querySelector('[data-testid=terminal-view] [data-testid=terminal-tab-bar], [data-testid=terminal-view] [data-testid=terminal-wrapper]')"
        intent: Wait until the orchestrator terminal surface is mounted
      - run: |
          set -e
          # budget: terminal-launch (120s) - orchestrator terminal launch spec can lag PTY spawn.
          for i in $(seq 1 60); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-CUSTOM/terminal/tabs" > "$AFT_WORK_DIR/d8d-tabs.json" &&
            python3 - "$AFT_WORK_DIR/d8d-tabs.json" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          tabs = d.get("data") or []
          matches = [t for t in tabs if t.get("agent_id") == "orchestrator"]
          assert matches, tabs
          t = matches[0]
          assert t.get("backend") == "claude", t
          assert t.get("launch", {}).get("env", {}).get("LOOM_AGENT_ROLE") == "orchestrator", t
          PY
            sleep 2
          done
          echo "orchestrator terminal launch metadata never appeared"
          cat "$AFT_WORK_DIR/d8d-tabs.json" 2>/dev/null || true
          exit 1
        intent: An operator polls terminal tabs until the orchestrator launch env is persisted
  terminal-12-custom-prompt-named-orchestrator-deterministically-creat:
    steps:
      - expect:
          count:
            testid: create-agent-error
            equals: 0
  case-14-backend-selection-reaches-custom-agent-row-and-terminal-:
    steps:
      - click:
          testid: create-agent-template-custom-prompt
      - fill:
          testid: create-agent-name
          value: cust-be-${RUN_ID:-local}
      - wait:
