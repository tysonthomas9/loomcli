kind: graph-steps
version: 1
flow: pr-review-agents
blocks:
  blank-browser:
    steps:
    - expect:
        url: about:blank
  open-prr-agent-list:
    steps:
    - open: "/ws/E2E-WS-PRR/agents"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the PRR workspace agents page is ready
  open-create-agent-dialog:
    steps:
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open
  create-case-primary-pr-review-agent:
    params:
    - agentName
    steps:
    - use: open-create-agent-dialog
    - click:
        testid: create-agent-template-interactive-pr-review
    - fill:
        testid: create-agent-name
        value: "{{agentName}}"
    - click:
        testid: create-agent-submit
  assert-pr-review-agent-definition:
    params:
    - agentName
    steps:
    - wait:
        fn: "!document.querySelector('[data-testid=create-agent-overlay]') && !!document.querySelector(\"[aria-label='Agent: {{agentName}}']\")"
      intent: Wait until the creation dialog closes and the exact PR Review agent appears
    - wait:
        fn: |-
          (async () => {
            const response = await fetch('/api/workspaces/E2E-WS-PRR/agents', { cache: 'no-store' });
            if (!response.ok) return false;
            const payload = await response.json();
            const data = payload.data ?? payload;
            const agents = Array.isArray(data) ? data : (Array.isArray(data.agents) ? data.agents : []);
            const matches = agents.filter((agent) => agent.name === '{{agentName}}');
            return matches.length === 1 &&
              matches[0].role_name === 'pr-review' &&
              !!matches[0].backend &&
              matches[0].auto === false;
          })()
      intent: Confirm the persisted agent uses the PR Review role, has a backend, and is not auto-started
    - expect:
        visible:
          selector: "[aria-label='Agent: {{agentName}}']"
      intent: Keep the exact created PR Review agent visible while its persisted definition is reviewed
  assert-two-pr-review-agents-share-role:
    params:
    - primaryName
    - secondaryName
    steps:
    - wait:
        fn: |-
          (async () => {
            const response = await fetch('/api/workspaces/E2E-WS-PRR/agents', { cache: 'no-store' });
            if (!response.ok) return false;
            const payload = await response.json();
            const data = payload.data ?? payload;
            const agents = Array.isArray(data) ? data : (Array.isArray(data.agents) ? data.agents : []);
            const byName = new Map(agents.map((agent) => [agent.name, agent]));
            const primary = byName.get('{{primaryName}}');
            const secondary = byName.get('{{secondaryName}}');
            return !!primary && !!secondary &&
              primary.role_name === 'pr-review' && secondary.role_name === 'pr-review';
          })()
      intent: Confirm both independently named PR Review agents reuse the same persisted PR Review role
    - expect:
        visible:
          selector: "[aria-label='Agent: {{secondaryName}}']"
      intent: Keep the second PR Review agent visible while shared-role reuse is reviewed
  assert-connected-pr-review-terminal:
    params:
    - agentName
    steps:
    - wait:
        fn: |-
          (() => {
            const wrapper = document.querySelector('[data-testid=terminal-wrapper]');
            if (!wrapper) return false;
            const rows = Array.from(wrapper.querySelectorAll('.term-row')).map((el) => el.textContent || '').join('\n');
            const text = rows || wrapper.textContent || '';
            if (text.includes('Error running agent') || text.includes('backend is not installed')) {
              throw new Error('PR Review agent failed to start: ' + text.slice(-400));
            }
            return text.includes('Controlled Codex stub connected: {{agentName}}') &&
              text.includes('Controlled Codex prompt contract:') &&
              text.includes('Controlled Codex prompt identity: pr-review') &&
              text.includes('safety-blocks=1');
          })()
      intent: Wait until the controlled Codex process identifies the built-in PR Review prompt and connects without a startup error
    - wait:
        fn: |-
          (async () => {
            const response = await fetch('/api/workspaces/E2E-WS-PRR/terminal/tabs', { cache: 'no-store' });
            if (!response.ok) return false;
            const payload = await response.json();
            const tabs = Array.isArray(payload.data) ? payload.data : [];
            const matches = tabs.filter((tab) =>
              tab.agent_id === '{{agentName}}' &&
              tab.kind === 'agent' &&
              tab.role === 'pr-review' &&
              tab.backend === 'codex');
            if (matches.length !== 1 || matches[0].pty_alive !== true) return false;
            const launch = matches[0].launch || {};
            const argv = Array.isArray(launch.argv) ? launch.argv.map(String).join(' ') : '';
            const env = launch.env || {};
            return argv.includes('lead') &&
              argv.includes('--prompt') &&
              argv.includes('builtin:pr-review') &&
              env.LOOM_AGENT_ROLE === 'pr-review' &&
              env.LOOM_AGENT_NAME === '{{agentName}}';
          })()
      intent: Confirm exactly one live Codex tab owns this PR Review agent and carries the built-in review launch contract
    - expect:
        visible:
          testid: terminal-wrapper
      intent: Keep the connected PR Review terminal visible beside its grouped runtime checks
