kind: graph-transitions
version: 1
flow: pr-review-agents
group: zz-pr-review-agents
transitions:
  open-prr-agent-list:
    intent: An operator opens the PR Review workspace agent list.
    actor: human
    via: ui
    steps:
    - use: open-prr-agent-list
  create-primary-agent-for-scenario-1:
    intent: An operator creates a PR Review terminal agent from the agent templates and verifies the stored agent uses the built-in PR-review role
    actor: human
    via: ui
    steps:
    - use: create-case-primary-pr-review-agent
      with:
        agentName: prr-${RUN_ID:-local}
  create-primary-agent-prerequisite:
    intent: An operator independently creates the primary PR Review agent required by role-reuse and terminal scenarios.
    actor: human
    via: ui
    steps:
    - use: create-case-primary-pr-review-agent
      with:
        agentName: prr-${RUN_ID:-local}-${AFT_CASE_ID}
  open-create-agent-dialog:
    intent: An operator opens the agent creation dialog from the settled PR Review agent list.
    actor: human
    via: ui
    steps:
    - use: open-create-agent-dialog
  verify-2-pr-review-template-selection-documents-the-true-default:
    intent: An operator opening the agent templates sees Task Runner preselected and can switch to the PR Review template
    actor: human
    via: ui
    steps:
    - click:
        testid: create-agent-template-interactive-pr-review
  verify-3-interactive-prompts-expose-only-visible-templates:
    intent: The public prompt catalog confirms that only the visible built-in interactive prompts are published
    actor: api-client
    via: api
    steps:
    - api:
        method: GET
        path: "/api/workspaces/E2E-WS-PRR/interactive-prompts"
        status: 200
        assert:
        - path: prompts.0.id
          equals: lead
        - path: prompts.1.id
          equals: pr-review
        - path: prompts.1.label
          equals: PR Review
        - path: prompts.2
          exists: false
      intent: An operator confirms the interactive prompt endpoint omits hidden built-ins
  verify-4-prompt-list-failure-keeps-built-in-templates-visible:
    intent: An operator whose prompt list fails to load still sees the built-in interactive templates and an honest fallback notice
    actor: human
    via: ui
    steps:
    - open: "/ws/E2E-WS-PRR/agents"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the PRR workspace agents page is ready with the prompt-list route aborted
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open with the prompt request failed
    routes:
    - url: "**/api/workspaces/E2E-WS-PRR/interactive-prompts"
      abort: true
  exercise-5-pr-review-terminal-launch-carries-the-built-in-prompt:
    intent: An operator opens their PR Review agent to review its connected built-in prompt session
    actor: human
    via: ui
    steps:
    - open: "/ws/E2E-WS-PRR/agents/prr-${RUN_ID:-local}-${AFT_CASE_ID}"
  exercise-6-second-pr-review-agent-reuses-the-shared-role:
    intent: An operator creates a second PR Review agent and verifies both agents share the workspace PR-review role
    actor: human
    via: ui
    steps:
    - use: open-prr-agent-list
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open
    - click:
        testid: create-agent-template-interactive-pr-review
    - fill:
        testid: create-agent-name
        value: prr2-${RUN_ID:-local}
    - click:
        testid: create-agent-submit
  exercise-7-conflicting-prompt-cannot-reuse-the-pr-review-role:
    intent: An API client that tries to reuse the PR-review role with a different prompt receives the documented role-conflict error
    actor: api-client
    via: api
    steps:
    - api:
        method: POST
        path: "/api/workspaces/E2E-WS-PRR/agents"
        body:
          name: pr-review
          role_name: pr-review
          kind: interactive
          prompt: totally different PR Review prompt ${RUN_ID:-local}
          auto: false
          backend: codex
        status: 400
        assert:
        - path: kind
          equals: validation_error
        - path: error
          contains: already exists with a different prompt
      intent: An API client probes the shared PR Review role conflict semantics
  exercise-8-unknown-built-in-prompt-fails-visibly-at-terminal-launch:
    intent: An operator whose interactive agent names an unknown built-in prompt sees the terminal report the prompt-loading error while the hidden checkout prompt remains API-accepted
    actor: human
    via: ui
    steps:
    - api:
        method: POST
        path: "/api/workspaces/E2E-WS-PRR/agents"
        body:
          name: prrbad-${RUN_ID:-local}
          role_name: prrbad-${RUN_ID:-local}
          kind: interactive
          prompt_file: builtin:not-a-prompt
          auto: false
          backend: codex
        status: 201
        assert:
        - path: name
          equals: prrbad-${RUN_ID:-local}
        - path: role_name
          equals: prrbad-${RUN_ID:-local}
      intent: An API client provisions an interactive agent whose role stores an unknown built-in prompt
    - open: "/ws/E2E-WS-PRR/agents/prrbad-${RUN_ID:-local}"
    - api:
        method: POST
        path: "/api/workspaces/E2E-WS-PRR/agents"
        body:
          name: prrhidden-${RUN_ID:-local}
          role_name: prrhidden-${RUN_ID:-local}
          kind: interactive
          prompt_file: builtin:pr-review-checkout
          auto: false
          backend: codex
        status: 201
        assert:
        - path: name
          equals: prrhidden-${RUN_ID:-local}
        - path: role_name
          equals: prrhidden-${RUN_ID:-local}
      intent: An API client confirms the hidden checkout built-in prompt is accepted at create time
