# Product-correct operator coverage for clone validation, local-repository
# workspace creation, repo management, and rename. API-only reorder coverage
# lives in surface-suites/workspace-order.
suite: workspace-mgmt
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: >-
  seed="$AFT_WORK_DIR/wm-seed"; extra="$AFT_WORK_DIR/wm-extra"; rm -rf "$seed" "$extra"; mkdir -p "$seed" "$extra"; git -C "$seed" init -q; printf '%s\n' "seed ${RUN_ID:-local}" > "$seed/README.md"; git -C "$seed" add README.md; git -C "$seed" -c user.email=e2e@x -c user.name=e2e commit -m init -q; git -C "$seed" branch -M main; git -C "$extra" init -q; printf '%s\n' "extra ${RUN_ID:-local}" > "$extra/README.md"; git -C "$extra" add README.md; git -C "$extra" -c user.email=e2e@x -c user.name=e2e commit -m init -q; git -C "$extra" branch -M main; basename "$extra" > "$AFT_WORK_DIR/wm-extra.repo"
teardown: >-
  for name in "aft-wm-${RUN_ID:-local}" "aft-wm-ren-${RUN_ID:-local}"; do curl -sf "$AFT_BASE_URL/api/workspaces" > "$AFT_WORK_DIR/wm-workspaces.teardown.json" || continue; ws="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); target=sys.argv[2]; print(next((w.get("id","") for w in d.get("workspaces",[]) if w.get("name")==target or w.get("id")==target), ""))' "$AFT_WORK_DIR/wm-workspaces.teardown.json" "$name")"; [ -z "$ws" ] || curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/$ws" >/dev/null || true; done

tests:
  # covers: /api/workspaces; /api/workspaces/jobs/:id readback; /api/workspaces/:ws/repos; /repos/:repo; /name; CreateWorkspaceModal clone/local modes; AddRepoModal; ConfirmDialog; WorkspaceSwitcher; WorkspaceContextMenu
  - name: create local workspace manage repos and rename
    intent: An operator sees clone mode reject a file URL, creates a workspace from a local repository through local mode, manages its repositories, and renames it through the WorkspaceSwitcher
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - click: { selector: "button[aria-label^='Active workspace:']" }
      - click: { role: button, name: "+ New Workspace", exact: true }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=create-workspace-overlay]')
      - fill:
          testid: create-workspace-name
          value: "aft-wm-${RUN_ID:-local}"
      - fill:
          testid: create-workspace-clone-url
          value: "file://${AFT_WORK_DIR}/wm-seed"
      - click: { role: button, name: Add, exact: true }
      - click: { testid: create-workspace-submit }
      - wait:
          fn: >-
            document.querySelector('[data-testid=create-workspace-error]')?.textContent.includes('clone URL must start with https:// or git@')
      - expect: { visible: { testid: create-workspace-error } }
      - expect: { text: "clone URL must start with https:// or git@" }
      - click: { testid: create-workspace-mode-local }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=create-workspace-local-path]')
      - fill:
          testid: create-workspace-local-path
          value: "${AFT_WORK_DIR}/wm-seed"
      - click: { testid: create-workspace-submit }
      # API polling is a readback of the modal action: capture the server-assigned
      # id, wait for its provisioning job, and only then navigate to the board.
      - run: >-
          target="aft-wm-${RUN_ID:-local}"; for i in $(seq 1 20); do curl -sf "$AFT_BASE_URL/api/workspaces" > "$AFT_WORK_DIR/wm-workspaces.json" && ws="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); target=sys.argv[2]; print(next((w.get("id","") for w in d.get("workspaces",[]) if w.get("name")==target), ""))' "$AFT_WORK_DIR/wm-workspaces.json" "$target")" && if [ -n "$ws" ]; then printf '%s\n' "$ws" > "$AFT_WORK_DIR/wm-ws.id"; break; fi; sleep 1; done; [ -s "$AFT_WORK_DIR/wm-ws.id" ] || { echo "modal-created workspace never appeared"; exit 1; }; ws="$(cat "$AFT_WORK_DIR/wm-ws.id")"; for i in $(seq 1 20); do code="$(curl -sS -o "$AFT_WORK_DIR/wm-workspace-job.json" -w "%{http_code}" "$AFT_BASE_URL/api/workspaces/jobs/$ws")"; if [ "$code" = 200 ] && python3 -c 'import json,sys; ws=sys.argv[2]; d=json.load(open(sys.argv[1])); assert d.get("success") is True, d; assert d.get("status")=="done", d; assert d.get("workspace_id")==ws, d; assert not d.get("error"), d' "$AFT_WORK_DIR/wm-workspace-job.json" "$ws"; then exit 0; fi; sleep 1; done; echo "workspace provisioning job never completed"; cat "$AFT_WORK_DIR/wm-workspace-job.json"; exit 1
      - run: >-
          agent-browser --session "$AFT_SESSION" open "$AFT_BASE_URL/ws/$(cat "$AFT_WORK_DIR/wm-ws.id")/kanban"
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - click: { role: button, name: "+ Add Repo" }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=add-repo-overlay]')
      - fill:
          label: Repository URL
          value: "${AFT_WORK_DIR}/wm-extra"
      - fill:
          label: Default branch
          value: main
      - click: { role: button, name: "Add Repository", exact: true }
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/wm-ws.id")"; repo="$(cat "$AFT_WORK_DIR/wm-extra.repo")"; for i in $(seq 1 10); do curl -sf "$AFT_BASE_URL/api/workspaces/$ws/repos" > "$AFT_WORK_DIR/wm-repos.json" && python3 -c 'import json,sys; repo=sys.argv[2]; d=json.load(open(sys.argv[1])); assert any(r.get("name")==repo for r in d.get("repos",[])), d' "$AFT_WORK_DIR/wm-repos.json" "$repo" && exit 0; sleep 1; done; echo "added repo never appeared"; exit 1
      - run: >-
          repo="$(cat "$AFT_WORK_DIR/wm-extra.repo")"; for i in 1 2 3; do agent-browser --session "$AFT_SESSION" find role button click --name "More actions for repo $repo" && exit 0 || true; sleep 1; done; echo "repo overflow button never clicked"; exit 1
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=confirm-dialog-overlay]')
      - click: { testid: confirm-dialog-confirm }
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/wm-ws.id")"; repo="$(cat "$AFT_WORK_DIR/wm-extra.repo")"; for i in $(seq 1 10); do curl -sf "$AFT_BASE_URL/api/workspaces/$ws/repos" > "$AFT_WORK_DIR/wm-repos-after-delete.json" && python3 -c 'import json,sys; repo=sys.argv[2]; d=json.load(open(sys.argv[1])); assert not any(r.get("name")==repo for r in d.get("repos",[])), d' "$AFT_WORK_DIR/wm-repos-after-delete.json" "$repo" && exit 0; sleep 1; done; echo "deleted repo still present"; exit 1
      # the primary workspace's display name is lowercase (e2e-ws), so switcher
      # name-matching is brittle — the workspaces suite covers switcher clicks;
      # navigate by URL here
      - open: /ws/E2E-WS/kanban
      - wait: { url: "**/ws/E2E-WS/kanban**" }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      # rename via the real browser path (FINDINGS §1.12 fixed): the
      # per-workspace overflow → Rename now lives in the WorkspaceSwitcher
      # overlay. Open it and isolate the created workspace by search; the pinned
      # active row keeps its own overflow, so target the created workspace's exact
      # overflow testid, rename inline, then blur to commit (the switcher saves on
      # blur/Enter).
      - click: { selector: "button[aria-label^='Active workspace:']" }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=search-input-field]')
      - fill:
          testid: search-input-field
          value: "aft-wm-${RUN_ID:-local}"
      - wait:
          fn: >-
            !!document.querySelector('[data-testid="workspace-overflow-aft-wm-${RUN_ID:-local}"]')
      - click: { testid: "workspace-overflow-aft-wm-${RUN_ID:-local}" }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=workspace-context-menu]')
      - click: { testid: workspace-context-menu-rename }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=workspace-rename-input]')
      - fill:
          testid: workspace-rename-input
          value: "aft-wm-ren-${RUN_ID:-local}"
      # commit via Enter (the switcher saves on blur/Enter): the context-menu
      # overlay covers the search field while rename mode is active, so a
      # blur-by-clicking-elsewhere step gets hit-test blocked
      - press: Enter
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/wm-ws.id")"; for i in $(seq 1 10); do curl -sf "$AFT_BASE_URL/api/workspaces/$ws" > "$AFT_WORK_DIR/wm-renamed.json" && python3 -c 'import json,sys; d=json.load(open(sys.argv[1]))["data"]; assert d.get("name")==sys.argv[2], d.get("name")' "$AFT_WORK_DIR/wm-renamed.json" "aft-wm-ren-${RUN_ID:-local}" && exit 0; sleep 1; done; echo "workspace rename via UI did not persist"; exit 1
