# Workspace management coverage for create validation, API creation, repo
# management, rename, and order persistence.
suite: workspace-mgmt
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: >-
  for name in "aft-wm-${RUN_ID:-local}" "aft-wm-ren-${RUN_ID:-local}"; do curl -sf "$AFT_BASE_URL/api/workspaces" > "$AFT_WORK_DIR/wm-workspaces.teardown.json" || continue; ws="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); target=sys.argv[2]; print(next((w.get("id","") for w in d.get("workspaces",[]) if w.get("name")==target or w.get("id")==target), ""))' "$AFT_WORK_DIR/wm-workspaces.teardown.json" "$name")"; [ -z "$ws" ] || curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/$ws" >/dev/null || true; done

tests:
  # covers: /api/workspaces; /api/workspaces/jobs/:id; /api/workspaces/:ws/repos; /repos/:repo; /name; /api/workspaces/order; CreateWorkspaceModal; AddRepoModal; ConfirmDialog; WorkspaceContextMenu
  - name: create workspace manage repos rename reorder
    intent: CreateWorkspaceModal rejects an unsupported local clone URL, while an API-created workspace remains routable and supports repo add/delete, rename, and order persistence
    steps:
      - run: >-
          seed="$AFT_WORK_DIR/wm-seed"; extra="$AFT_WORK_DIR/wm-extra"; rm -rf "$seed" "$extra"; mkdir -p "$seed" "$extra"; git -C "$seed" init -q; printf '%s\n' "seed ${RUN_ID:-local}" > "$seed/README.md"; git -C "$seed" add README.md; git -C "$seed" -c user.email=e2e@x -c user.name=e2e commit -m init -q; git -C "$seed" branch -M main; git -C "$extra" init -q; printf '%s\n' "extra ${RUN_ID:-local}" > "$extra/README.md"; git -C "$extra" add README.md; git -C "$extra" -c user.email=e2e@x -c user.name=e2e commit -m init -q; git -C "$extra" branch -M main; basename "$extra" > "$AFT_WORK_DIR/wm-extra.repo"
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - click: { selector: "button[aria-label^='Active workspace:']" }
      - click: { role: button, name: "+ New Workspace", exact: true }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=create-workspace-overlay]')
      - fill:
          testid: create-workspace-name
          value: "aft-wm-${RUN_ID:-local}"
      - fill:
          testid: create-workspace-clone-url
          value: "file://${AFT_WORK_DIR}/wm-seed"
      - click: { role: button, name: Add, exact: true }
      - click: { testid: create-workspace-submit }
      - wait:
          fn: >-
            document.querySelector('[data-testid=create-workspace-error]')?.textContent.includes('clone URL must start with https:// or git@')
      - expect: { visible: { testid: create-workspace-error } }
      - expect: { text: "clone URL must start with https:// or git@" }
      - click: { testid: create-workspace-cancel }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-workspace-overlay]')
      - run: >-
          python3 -c 'import json,os; print(json.dumps({"name":"aft-wm-"+(os.environ.get("RUN_ID") or "local"),"type":"empty"}))' > "$AFT_WORK_DIR/wm-create-workspace.json"; create_code="$(curl -sS -o "$AFT_WORK_DIR/wm-create-workspace.resp.json" -w "%{http_code}" -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/wm-create-workspace.json")"; [ "$create_code" = 201 ] || { echo "workspace create failed with HTTP $create_code:"; cat "$AFT_WORK_DIR/wm-create-workspace.resp.json"; exit 1; }; python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); data=d.get("data") or {}; assert data.get("id"), d; print(data["id"])' "$AFT_WORK_DIR/wm-create-workspace.resp.json" > "$AFT_WORK_DIR/wm-ws.id"; ws="$(cat "$AFT_WORK_DIR/wm-ws.id")"; job_code="$(curl -sS -o "$AFT_WORK_DIR/wm-workspace-job.json" -w "%{http_code}" "$AFT_BASE_URL/api/workspaces/jobs/$ws")"; [ "$job_code" = 200 ] || { echo "workspace job fallback failed with HTTP $job_code:"; cat "$AFT_WORK_DIR/wm-workspace-job.json"; exit 1; }; python3 -c 'import json,sys; ws=sys.argv[2]; d=json.load(open(sys.argv[1])); assert d.get("success") is True, d; assert d.get("status")=="done", d; assert d.get("workspace_id")==ws, d; assert not d.get("error"), d' "$AFT_WORK_DIR/wm-workspace-job.json" "$ws"
      - run: >-
          agent-browser --session "$AFT_SESSION" open "$AFT_BASE_URL/ws/$(cat "$AFT_WORK_DIR/wm-ws.id")/kanban"
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - click: { role: button, name: "+ Add Repo" }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=add-repo-overlay]')
      - fill:
          label: Repository URL
          value: "${AFT_WORK_DIR}/wm-extra"
      - fill:
          label: Default branch
          value: main
      - click: { role: button, name: "Add Repository", exact: true }
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/wm-ws.id")"; repo="$(cat "$AFT_WORK_DIR/wm-extra.repo")"; for i in $(seq 1 10); do curl -sf "$AFT_BASE_URL/api/workspaces/$ws/repos" > "$AFT_WORK_DIR/wm-repos.json" && python3 -c 'import json,sys; repo=sys.argv[2]; d=json.load(open(sys.argv[1])); assert any(r.get("name")==repo for r in d.get("repos",[])), d' "$AFT_WORK_DIR/wm-repos.json" "$repo" && exit 0; sleep 1; done; echo "added repo never appeared"; exit 1
      - run: >-
          repo="$(cat "$AFT_WORK_DIR/wm-extra.repo")"; for i in 1 2 3; do agent-browser --session "$AFT_SESSION" find role button click --name "More actions for repo $repo" && exit 0 || true; sleep 1; done; echo "repo overflow button never clicked"; exit 1
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=confirm-dialog-overlay]')
      - click: { testid: confirm-dialog-confirm }
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/wm-ws.id")"; repo="$(cat "$AFT_WORK_DIR/wm-extra.repo")"; for i in $(seq 1 10); do curl -sf "$AFT_BASE_URL/api/workspaces/$ws/repos" > "$AFT_WORK_DIR/wm-repos-after-delete.json" && python3 -c 'import json,sys; repo=sys.argv[2]; d=json.load(open(sys.argv[1])); assert not any(r.get("name")==repo for r in d.get("repos",[])), d' "$AFT_WORK_DIR/wm-repos-after-delete.json" "$repo" && exit 0; sleep 1; done; echo "deleted repo still present"; exit 1
      # the primary workspace's display name is lowercase (e2e-ws), so switcher
      # name-matching is brittle — the workspaces suite covers switcher clicks;
      # navigate by URL here
      - open: /ws/E2E-WS/kanban
      - wait: { url: "**/ws/E2E-WS/kanban**" }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      # rename UI gap: the per-workspace overflow/rename sidebar
      # (OtherWorkspacesSection + SortableWorkspaceEntry + WorkspaceContextMenu) is
      # exported but never mounted in the current app, so there is no browser path
      # to rename — cover the endpoint contract via the API instead
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/wm-ws.id")"; code="$(curl -sS -o "$AFT_WORK_DIR/wm-rename.resp.json" -w "%{http_code}" -X PATCH "$AFT_BASE_URL/api/workspaces/$ws/name" -H "Content-Type: application/json" -d "{\"new_name\":\"aft-wm-ren-${RUN_ID:-local}\"}")"; [ "$code" = 200 ] || { echo "rename failed with $code"; cat "$AFT_WORK_DIR/wm-rename.resp.json"; exit 1; }; for i in $(seq 1 10); do curl -sf "$AFT_BASE_URL/api/workspaces/$ws" > "$AFT_WORK_DIR/wm-renamed.json" && python3 -c 'import json,sys; d=json.load(open(sys.argv[1]))["data"]; assert d.get("name")==sys.argv[2], d.get("name")' "$AFT_WORK_DIR/wm-renamed.json" "aft-wm-ren-${RUN_ID:-local}" && exit 0; sleep 1; done; echo "workspace rename did not persist"; exit 1
      # sidebar DnD is uncovered here: dnd-kit PointerSensor uses an activation distance, which is not deterministic for the AFT drag command in this stack.
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/wm-ws.id")"; curl -sf "$AFT_BASE_URL/api/workspaces" > "$AFT_WORK_DIR/wm-order-before.json"; python3 -c 'import json,sys; ws=open(sys.argv[2]).read().strip(); ids=[w["id"] for w in json.load(open(sys.argv[1])).get("workspaces",[])]; order=[ws]+[i for i in ids if i != ws]; print(json.dumps({"order": order}))' "$AFT_WORK_DIR/wm-order-before.json" "$AFT_WORK_DIR/wm-ws.id" > "$AFT_WORK_DIR/wm-order.json"; curl -sf -X PUT "$AFT_BASE_URL/api/workspaces/order" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/wm-order.json" > "$AFT_WORK_DIR/wm-order-after.json"; python3 -c 'import json,sys; ws=open(sys.argv[2]).read().strip(); d=json.load(open(sys.argv[1]))["data"]; order=d.get("workspace_order") or [w.get("id") for w in d.get("workspaces",[])]; assert order and order[0]==ws, order' "$AFT_WORK_DIR/wm-order-after.json" "$AFT_WORK_DIR/wm-ws.id"
