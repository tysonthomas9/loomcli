# Full issue lifecycle driven through the workspace HTTP API, with the kanban
# board following live via SSE at every transition — no reloads anywhere.
suite: issue-lifecycle
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: '"$AFT_TESTS_DIR/scripts/close-open-issues.sh"'

tests:
  - name: issue travels open to in progress to closed, board follows live
    intent: An issue created, started, and closed via the API moves across the kanban columns in realtime
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - expect: { count: { selector: "section[data-status=ready] article", equals: 0 } }
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues"
          -H "Content-Type: application/json"
          -d "{\"title\":\"lifecycle $RUN_ID\",\"issue_type\":\"task\",\"priority\":2}"
          | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])"
          > "$AFT_WORK_DIR/lifecycle.id"
      - wait: { text: lifecycle }
      - expect: { count: { selector: "section[data-status=ready] article", equals: 1 } }
      - run: >-
          curl -sf -X PATCH "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues/$(cat "$AFT_WORK_DIR/lifecycle.id")"
          -H "Content-Type: application/json" -d '{"status":"in_progress"}'
      - wait:
          fn: >-
            document.querySelectorAll('section[data-status=in_progress] article').length === 1
      - expect: { count: { selector: "section[data-status=ready] article", equals: 0 } }
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues/$(cat "$AFT_WORK_DIR/lifecycle.id")/close"
          -H "Content-Type: application/json" -d '{"reason":"aft lifecycle test"}'
      - wait:
          fn: >-
            document.querySelectorAll('section[data-status=in_progress] article').length === 0
      # positive confirmation of the close: the server state is closed and the
      # SSE-closed card lands in Done. Scope to this run's title because closed
      # issues accumulate across suites and Done only renders the newest cards.
      - run: >-
          curl -sf "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues/$(cat "$AFT_WORK_DIR/lifecycle.id")"
          | python3 -c "import sys,json; data=json.load(sys.stdin)['data']; assert data['status'] == 'closed', data; assert data.get('close_reason') == 'aft lifecycle test', data; assert data.get('closed_at'), data"
      - run: >-
          curl -sf "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues/$(cat "$AFT_WORK_DIR/lifecycle.id")/events"
          | python3 -c "import sys,json; events=json.load(sys.stdin)['data']; closes=[e for e in events if e.get('event_type')=='issue.closed']; assert len(closes)==1, events; event=closes[0]; assert event.get('comment')=='aft lifecycle test', event"
      - wait:
          fn: >-
            document.querySelectorAll("section[data-status=done] article[aria-label*='lifecycle ${RUN_ID:-local}']").length === 1
      - expect: { count: { selector: "section[data-status=done] article[aria-label*='lifecycle ${RUN_ID:-local}']", equals: 1 } }
      - expect: { count: { selector: "section[data-status=ready] article[aria-label*='lifecycle ${RUN_ID:-local}']", equals: 0 } }
      - expect: { count: { selector: "section[data-status=ready] article", equals: 0 } }
      - click: { selector: "section[data-status=done] article[aria-label*='lifecycle ${RUN_ID:-local}']", first: true }
      - wait: { text: aft lifecycle test }
