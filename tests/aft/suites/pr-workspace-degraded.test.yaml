# PR workspace degraded coverage in an owned workspace. This intentionally does
# not mutate E2E-WS, because other suites assert its shared empty PR state.
suite: pr-workspace-degraded
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: >-
  name="aft-pr-${RUN_ID:-local}"; list_code="$(curl -sS -o "$AFT_WORK_DIR/pr-workspaces.setup.json" -w "%{http_code}" "$AFT_BASE_URL/api/workspaces")"; [ "$list_code" = 200 ] || { echo "workspace list failed with HTTP $list_code:"; cat "$AFT_WORK_DIR/pr-workspaces.setup.json"; exit 1; }; existing="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); target=sys.argv[2]; print(next((w.get("id","") for w in d.get("workspaces",[]) if w.get("name")==target or w.get("id")==target), ""))' "$AFT_WORK_DIR/pr-workspaces.setup.json" "$name")"; if [ -n "$existing" ]; then delete_code="$(curl -sS -o "$AFT_WORK_DIR/pr-delete-stale.resp.json" -w "%{http_code}" -X DELETE "$AFT_BASE_URL/api/workspaces/$existing")"; [ "$delete_code" = 200 ] || [ "$delete_code" = 404 ] || { echo "stale workspace delete failed with HTTP $delete_code:"; cat "$AFT_WORK_DIR/pr-delete-stale.resp.json"; exit 1; }; fi; python3 -c 'import json,os; run=os.environ.get("RUN_ID") or "local"; print(json.dumps({"name":"aft-pr-"+run,"type":"empty"}))' > "$AFT_WORK_DIR/pr-create-workspace.json"; create_code="$(curl -sS -o "$AFT_WORK_DIR/pr-create-workspace.resp.json" -w "%{http_code}" -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/pr-create-workspace.json")"; [ "$create_code" = 201 ] || { echo "workspace create failed with HTTP $create_code:"; cat "$AFT_WORK_DIR/pr-create-workspace.resp.json"; exit 1; }; python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); data=d.get("data") or {}; assert data.get("id"), d; print(data["id"])' "$AFT_WORK_DIR/pr-create-workspace.resp.json" > "$AFT_WORK_DIR/pr-ws.id"
teardown: >-
  if [ -s "$AFT_WORK_DIR/pr-ws.id" ]; then AFT_WS="$(cat "$AFT_WORK_DIR/pr-ws.id")" "$AFT_TESTS_DIR/scripts/close-open-issues.sh" || true; delete_code="$(curl -sS -o "$AFT_WORK_DIR/pr-delete-workspace.resp.json" -w "%{http_code}" -X DELETE "$AFT_BASE_URL/api/workspaces/$(cat "$AFT_WORK_DIR/pr-ws.id")")"; [ "$delete_code" = 200 ] || [ "$delete_code" = 404 ] || { echo "workspace teardown delete failed with HTTP $delete_code:"; cat "$AFT_WORK_DIR/pr-delete-workspace.resp.json"; exit 1; }; fi

tests:
  # covers: /prs; PRReviewWorkspace; PRDiscussionPanel degraded state; issue external_ref review routing
  - name: pr discussion degrades without github access
    intent: An API client creates a GitHub-shaped review fixture, and a reviewer opens Discuss PR and sees a graceful degraded state when connector egress is unavailable
    steps:
      - run: >-
          ws="$(cat "$AFT_WORK_DIR/pr-ws.id")"; repo="$AFT_WORK_DIR/pr-widgets-${RUN_ID:-local}"; rm -rf "$repo"; mkdir -p "$repo"; git -C "$repo" init -q; printf '%s\n' "widgets ${RUN_ID:-local}" > "$repo/README.md"; git -C "$repo" add README.md; git -C "$repo" -c user.email=e2e@x -c user.name=e2e commit -m init -q; git -C "$repo" branch -M main; git -C "$repo" remote add origin https://github.com/acme/widgets; basename "$repo" > "$AFT_WORK_DIR/pr-repo.name"; python3 -c 'import json,sys; print(json.dumps({"repos":[sys.argv[1]]}))' "$repo" > "$AFT_WORK_DIR/pr-add-repo.json"; repo_code="$(curl -sS -o "$AFT_WORK_DIR/pr-add-repo.resp.json" -w "%{http_code}" -X POST "$AFT_BASE_URL/api/workspaces/$ws/repos" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/pr-add-repo.json")"; [ "$repo_code" = 201 ] || { echo "repo add failed with HTTP $repo_code:"; cat "$AFT_WORK_DIR/pr-add-repo.resp.json"; exit 1; }; python3 -c 'import json,os,sys; run=os.environ.get("RUN_ID") or "local"; repo=open(sys.argv[1]).read().strip(); print(json.dumps({"title":"pr degraded "+run,"issue_type":"task","priority":2,"external_ref":"https://github.com/acme/widgets/pull/7","source_repo":repo}))' "$AFT_WORK_DIR/pr-repo.name" > "$AFT_WORK_DIR/pr-issue.json"; issue_code="$(curl -sS -o "$AFT_WORK_DIR/pr-issue.resp.json" -w "%{http_code}" -X POST "$AFT_BASE_URL/api/workspaces/$ws/issues" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/pr-issue.json")"; [ "$issue_code" = 201 ] || { echo "PR issue create failed with HTTP $issue_code:"; cat "$AFT_WORK_DIR/pr-issue.resp.json"; exit 1; }; python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["id"])' "$AFT_WORK_DIR/pr-issue.resp.json" > "$AFT_WORK_DIR/pr-issue.id"; review_code="$(curl -sS -o "$AFT_WORK_DIR/pr-issue-review.resp.json" -w "%{http_code}" -X PATCH "$AFT_BASE_URL/api/workspaces/$ws/issues/$(cat "$AFT_WORK_DIR/pr-issue.id")" -H "Content-Type: application/json" -d '{"status":"review"}')"; [ "$review_code" = 200 ] || { echo "PR issue review transition failed with HTTP $review_code:"; cat "$AFT_WORK_DIR/pr-issue-review.resp.json"; exit 1; }; python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert (d.get("data") or {}).get("status")=="review", d' "$AFT_WORK_DIR/pr-issue-review.resp.json"
      - run: >-
          agent-browser --session "$AFT_SESSION" open "$AFT_BASE_URL/ws/$(cat "$AFT_WORK_DIR/pr-ws.id")/prs"
      - wait: { text: "pr degraded ${RUN_ID:-local}" }
      # rows are li[role=button] aria-label="Review <title>"; GitHub enrichment can re-render them, so retry until the review param lands
      - run: >-
          for i in 1 2 3; do agent-browser --session "$AFT_SESSION" find role button click --name "pr degraded ${RUN_ID:-local}" || true; sleep 1; agent-browser --session "$AFT_SESSION" eval "location.search" | grep -q "review=" && exit 0; done; echo "PR row click never opened the review workspace"; exit 1
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=pr-review-workspace]')
      - expect: { visible: { testid: pr-review-workspace } }
      - click: { testid: pr-discuss-button }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=pr-discussion-panel]') &&
            !!document.querySelector('[data-testid=pr-discussion-error]') &&
            !!document.querySelector('[data-testid=pr-discussion-retry]')
      - expect: { notText: Something went wrong }
