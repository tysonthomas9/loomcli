# Agent execution flow with a STUB backend (e2e/stubs/codex on the server's PATH —
# wired by run-aft.sh; exits 0, no real LLM). Engine B: `loom serve` already runs the
# driver executor + task workers, so POST /workflows/epic-runner drives the whole
# claim → execute → close cycle in-process. No daemon required.
#
# Named zz- so it runs LAST: it creates an agent definition and run artifacts that
# earlier suites' empty-state assertions (monitor "No agents found", agents-page
# "Select an agent", observability zero-metrics) assume absent.
suite: zz-agent-flow
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
# also best-effort delete the agentdef so anything ordered after zz- (or a rerun
# against a warm server) starts agent-free like every other suite expects
teardown: >-
  "$AFT_TESTS_DIR/scripts/close-open-issues.sh";
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/agents/nova" >/dev/null || true

tests:
  # covers: agent-definition visibility (LCLI-AD group, UI surface slice)
  - name: created agent definition appears in agents page and monitor
    intent: An agent definition created through the workspace API renders in the agents rail and the monitor activity panel, and start is accepted
    steps:
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/agents"
          -H "Content-Type: application/json"
          -d '{"name":"nova","role_name":"lead"}'
          >/dev/null
      # deep link straight to the agent detail route — the bare /agents auto-select
      # depends on the agent store's first fetch and can exceed the step timeout
      - open: /ws/E2E-WS/agents/nova
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=agents-page]')
      - expect: { url: "**/ws/*/agents/nova**" }
      - expect: { visible: { testid: agents-page } }
      # textContent, not rendered text: the rail capitalizes names via CSS text-transform
      - wait:
          fn: >-
            document.body.textContent.includes('nova')
      - click: { role: button, name: Logs, exact: true }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=log-viewer]')
      - expect: { visible: { testid: archive-empty } }
      - expect: { text: No logs available for this agent yet. }
      - run: >-
          d="$AFT_TESTS_DIR/../../tmp/e2e-workspace/.loom-config/.loom/logs/E2E-WS/agents";
          mkdir -p "$d";
          printf '%s\n' "nova lead log line one" "nova lead AFT-LOG-MARKER $RUN_ID" > "$d/nova.log"
      - click: { selector: "div:has(> [data-testid='log-viewer']) > button" }
      - wait: { text: AFT-LOG-MARKER }
      - expect: { visible: { testid: terminal-container } }
      - open: /ws/E2E-WS/monitor
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=agent-activity-panel]')
      # the panel renders from the agent store, which refreshes on a 5s poll; after a
      # long run its first fetch can lag past the step timeout — let one poll cycle
      # pass, then reload so the mount fetch (server already lists nova) renders it
      - wait: { ms: 5500 }
      - reload: true
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=agent-activity-panel]')
      - wait:
          fn: >-
            document.body.textContent.includes('nova')
      - expect: { notText: No agents found }
      # store-backed serve accepts start and flips desired state (no daemon involved)
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/agents/nova/start" >/dev/null

  # covers: LCLI-RA group partial — serve-driven epic run with stub backend
  - name: epic runner drives a stub agent to complete a task
    intent: Triggering the epic-runner workflow makes a stub-backed worker claim the seeded task, execute, and close it, with the board and session records following
    steps:
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues"
          -H "Content-Type: application/json"
          -d "{\"title\":\"agent-flow epic $RUN_ID\",\"issue_type\":\"epic\",\"priority\":2}"
          | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])"
          > "$AFT_WORK_DIR/agent-epic.id"
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues"
          -H "Content-Type: application/json"
          -d "{\"title\":\"agent-flow task $RUN_ID\",\"issue_type\":\"task\",\"priority\":2,\"parent\":\"$(cat "$AFT_WORK_DIR/agent-epic.id")\"}"
          | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])"
          > "$AFT_WORK_DIR/agent-task.id"
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - wait: { text: agent-flow task }
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/workflows/epic-runner"
          -H "Content-Type: application/json"
          -d "{\"epicId\":\"$(cat "$AFT_WORK_DIR/agent-epic.id")\"}"
          > "$AFT_WORK_DIR/agent-run.json"
      # The POST above carries the (synchronous) workflow-bundle build; this step only
      # covers execution. Keep the poll well under the 120s run-step ceiling: 40 x ~2s
      # plus cheap grep instead of a python startup per iteration.
      - run: >-
          for i in $(seq 1 40); do
          curl -sf "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues/$(cat "$AFT_WORK_DIR/agent-task.id")"
          | grep -q '"status":"closed"' && exit 0; sleep 2; done;
          echo "task never closed"; exit 1
      # a task session was recorded during execution — this is what the Runs tab reads
      - run: >-
          curl -sf "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/tasks/$(cat "$AFT_WORK_DIR/agent-task.id")/sessions"
          | python3 -c "import sys,json; d=json.load(sys.stdin); items=d.get('data', d if isinstance(d, list) else []); assert len(items) >= 1, d"
      # board followed via SSE: the closed card is removed from the board entirely
      - wait:
          fn: >-
            !Array.from(document.querySelectorAll("section[data-status=ready] article")).some((el) => el.textContent.includes('agent-flow task'))
      - expect: { count: { selector: "section[data-status=ready] article[aria-label*='agent-flow task ${RUN_ID:-local}']", equals: 0 } }
