        intent: "Human sets Delivery mode stack, Lead may approve on, Lead may merge off in Settings > Git; the server and a reload agree"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" chain walk a b:a c:b"
        intent: "API client creates the tasks (a b:a c:b) in one epic and starts it once; a dependent runs when its blocker's agent finishes"
      - run: "bash \"$AFT_TESTS_DIR/scripts/loomgit-matrix.sh\" wait-rev walk a 1 4"
        intent: "Task a runs (real codex on the real tier) until it records a revision and waits in review (1/4)"
