# Issue creation through the UI — v5 has a New Issue modal (title is the only
# required field; priority is fixed at 2; new issues default to status open).
suite: issue-create-ui
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: '"$AFT_TESTS_DIR/scripts/close-open-issues.sh"'

tests:
  # covers: LCLI-WP-001
  - name: create an issue through the New Issue modal
    intent: A user creates an issue via the New Issue modal and it appears in the Open column
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      # first interaction of a fresh browser session: settle hydration before clicking
      - wait: { load: networkidle }
      - click: { testid: new-issue-button }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=create-issue-title]')
      - expect: { visible: { testid: create-issue-title } }
      - fill: { testid: create-issue-title, value: "ui created ${RUN_ID:-local}" }
      - click: { testid: create-issue-submit }
      - wait: { text: ui created }
      # title-scoped: board-global counts break on reorder or teardown leaks
      - expect: { count: { selector: "section[data-status=ready] article[aria-label*='ui created ${RUN_ID:-local}']", equals: 1 } }
      - run: >-
          curl -sf "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues?limit=100"
          | python3 -c "import os,sys,json,urllib.request; base=os.environ['AFT_BASE_URL']; ws=os.environ.get('AFT_WS','E2E-WS'); title='ui created '+os.environ['RUN_ID']; issues=json.load(sys.stdin)['data']; matches=[i for i in issues if i.get('title')==title]; assert len(matches)==1, matches; issue=matches[0]; events=json.load(urllib.request.urlopen(f'{base}/api/workspaces/{ws}/issues/{issue[\"id\"]}/events'))['data']; creates=[e for e in events if e.get('event_type')=='issue.created']; assert len(creates)==1, events"

  # covers: LCLI-WP-001
  - name: empty title keeps submit disabled
    intent: The New Issue modal prevents submitting a blank title
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - click: { testid: new-issue-button }
      - expect: { visible: { testid: create-issue-title } }
      - expect: { enabled: { testid: create-issue-submit, equals: false } }

  # covers: LCLI-WP-001 (type + description + create-time deferred status)
  # DEFECT FIXED: the frontend createIssue() client omitted status from the
  # POST body. The server and fleet-db preserve create-time status once sent.
  - name: full-field create preserves type and description
    intent: Creating an issue with type, description, and deferred status renders the saved values in the detail panel and persists them via the API
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - click: { testid: new-issue-button }
      - expect: { visible: { testid: create-issue-title } }
      - fill: { testid: create-issue-title, value: "ui-full-field-${RUN_ID:-local}" }
      - select: { testid: create-issue-type, value: bug }
      - select: { testid: create-issue-status, value: deferred }
      - fill: { testid: create-issue-description, value: "full-field description ${RUN_ID:-local}" }
      - click: { testid: create-issue-submit }
      - wait: { text: "ui-full-field-${RUN_ID:-local}" }
      - expect: { visible: { testid: issue-detail-panel } }
      - wait:
          fn: >-
            document.querySelector('[data-testid=metadata-type]')?.textContent?.includes('Bug')
      - expect: { text: "full-field description ${RUN_ID:-local}" }
      # deferred issues are excluded from the PLAIN list (fleet-db adds
      # status != 'deferred' when no filter is given) — a lookup must either
      # pass status=deferred or use the board's enriched query
      # (include_blocked=true routes through the kanban path, which merges a
      # deferred overlay). The board itself always sends include_blocked=true,
      # so the Backlog column shows deferred issues even across reloads.
      - run: >-
          issue_id=$(curl -sf "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues?status=deferred&limit=100"
          | python3 -c "import os,sys,json; data=json.load(sys.stdin)['data']; title='ui-full-field-' + os.environ['RUN_ID']; matches=[issue for issue in data if issue.get('title') == title]; assert matches, data; print(matches[0]['id'])");
          curl -sf "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues/$issue_id"
          | python3 -c "import os,sys,json; issue=json.load(sys.stdin)['data']; assert issue.get('issue_type') == 'bug', issue; assert issue.get('description') == 'full-field description ' + os.environ['RUN_ID'], issue; assert issue.get('status') == 'deferred', issue"
      # server-side proof in the UI: a fresh load (not local store state) puts
      # the deferred card in the Backlog column via the enriched board query
      - reload: true
      - wait:
          fn: >-
            document.querySelectorAll("section[data-status=backlog] article[aria-label*='ui-full-field-${RUN_ID:-local}']").length === 1

  # covers: LCLI-WP-001
  # This is fleet-db's documented SOFT-DUPLICATE GUARD, not a title upsert: when the
  # same actor creates an open issue with the same title and type within 60 seconds,
  # the existing issue is returned (200 + `X-Idempotency-Warning: soft-duplicate`)
  # rather than minting a duplicate. Bypass with `X-Idempotency-Force: true`.
  # It is deliberate anti-double-submit protection (fleet-db c758a0e). The UI now
  # surfaces the warning and offers "Create anyway"; earlier it swallowed the header,
  # which made the guard look like silent data loss.
  - name: duplicate titles hit the soft-duplicate guard
    intent: Submitting the same title twice within the guard window yields a single card — the second create returns the existing issue with a soft-duplicate warning
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - click: { testid: new-issue-button }
      - expect: { visible: { testid: create-issue-title } }
      - fill: { testid: create-issue-title, value: "ui-duplicate-${RUN_ID:-local}" }
      - click: { testid: create-issue-submit }
      - wait:
          fn: >-
            document.querySelectorAll("section[data-status=ready] article[aria-label*='ui-duplicate-${RUN_ID:-local}']").length === 1
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - click: { testid: new-issue-button }
      - expect: { visible: { testid: create-issue-title } }
      - fill: { testid: create-issue-title, value: "ui-duplicate-${RUN_ID:-local}" }
      - click: { testid: create-issue-submit }
      # deterministic guard proof: creating the same title again returns the SAME id
      # (a timed board-count alone couldn't distinguish the guard from slow rendering)
      - run: >-
          id1=$(curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues"
          -H "Content-Type: application/json"
          -d "{\"title\":\"ui-duplicate-$RUN_ID\",\"issue_type\":\"task\",\"priority\":2}"
          | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])");
          id2=$(curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues"
          -H "Content-Type: application/json"
          -d "{\"title\":\"ui-duplicate-$RUN_ID\",\"issue_type\":\"task\",\"priority\":2}"
          | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])");
          [ -n "$id1" ] && [ "$id1" = "$id2" ] || { echo "expected upsert, got '$id1' vs '$id2'"; exit 1; }
      - expect: { count: { selector: "section[data-status=ready] article[aria-label*='ui-duplicate-${RUN_ID:-local}']", equals: 1 } }
      - expect: { notText: Something went wrong }
