      - fill: { testid: create-agent-name, value: "" }
      - expect: { enabled: { testid: create-agent-submit, equals: false } }
      - fill: { testid: create-agent-name, value: "planner-valid-${RUN_ID:-local}" }
      - expect: { enabled: { testid: create-agent-submit, equals: true } }
      - run: |
          set -e
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-PLAN/agents" > "$AFT_WORK_DIR/pln-d2-agents.json"
          python3 - "$AFT_WORK_DIR/pln-d2-agents.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
