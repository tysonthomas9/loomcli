# Planner template coverage. This suite owns E2E-WS-PLAN because planner
# agents leave durable fleet-db rows and local worktrees behind.
suite: zz-planner-agent
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: |
  set -e
  run="${RUN_ID:-local}"
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-PLAN" >/dev/null || true
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-PLANEMPTY-$run" >/dev/null || true
  repo="$AFT_WORK_DIR/plan-repo"
  mkdir -p "$repo"
  git -C "$repo" init -q
  git -C "$repo" -c user.email=e2e@x -c user.name=e2e commit --allow-empty -m init -q
  python3 -c 'import json,sys; print(json.dumps({"name":sys.argv[1],"type":"empty","repos":[sys.argv[2]]}))' "e2e-ws-plan" "$repo" > "$AFT_WORK_DIR/plan-workspace.json"
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/plan-workspace.json" > "$AFT_WORK_DIR/plan-workspace.resp.json"
  python3 - "$run" > "$AFT_WORK_DIR/plan-lead-companion.json" <<'PY'
  import json, sys
  run = sys.argv[1]
  print(json.dumps({
      "name": f"lead-{run}",
      "role_name": "lead",
      "auto": False,
      "cross_repo": True,
      "repos": [],
      "backend": "codex",
  }))
  PY
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-PLAN/agents" \
    -H "Content-Type: application/json" \
    -d @"$AFT_WORK_DIR/plan-lead-companion.json" \
    > "$AFT_WORK_DIR/plan-lead-companion.resp.json"
teardown: |
  set +e
  run="${RUN_ID:-local}"
  AFT_WS=E2E-WS-PLAN "$AFT_TESTS_DIR/scripts/close-open-issues.sh"
  for agent in "planner-${RUN_ID:-local}" "planner-be-${RUN_ID:-local}" "planner-scope-${RUN_ID:-local}" "planner-task-${RUN_ID:-local}" "lead-${RUN_ID:-local}"; do
    curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-PLAN/agents/$agent" >/dev/null || true
  done
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-PLANEMPTY-$run" >/dev/null || true
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-PLAN" >/dev/null || true

tests:
  # covers: PLN-D1; CreateAgentModal Planner template; POST /api/workspaces/:ws/agents; GET /api/workspaces/:ws/agents
  - name: planner template creates plan role agent
    intent: An operator creates a Planner background agent through CreateAgentModal and confirms the workspace records it with the plan role and no auto-start
    steps:
      - open: /ws/E2E-WS-PLAN/agents
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the planner workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open"
      - expect: { visible: { testid: create-agent-template-planner } }
      - click: { testid: create-agent-template-planner }
      - expect: { attr: { testid: create-agent-template-planner, name: aria-pressed, equals: "true" } }
      - fill: { testid: create-agent-name, value: "planner-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('planner-${RUN_ID:-local}')
        intent: "Wait until the Planner modal closes and the new agent appears"
      - run: |
          set -e
          name="planner-${RUN_ID:-local}"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-PLAN/agents" > "$AFT_WORK_DIR/pln-d1-agents.json"
          python3 - "$AFT_WORK_DIR/pln-d1-agents.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          matches = [a for a in agents or [] if a.get("name") == sys.argv[2]]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("role_name") == "plan", a
          assert not a.get("auto"), a
          assert not a.get("cross_repo"), a
          assert len(a.get("repos") or []) == 1, a
          assert not a.get("state") or a.get("state") == "idle", a
          assert not a.get("mode"), a
          PY
        intent: "An operator filters the unordered agent list and verifies the Planner create contract"

