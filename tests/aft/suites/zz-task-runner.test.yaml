# Task Runner template coverage. This suite owns E2E-WS-TASK because
# task-runner agents create durable fleet-db rows and local worktrees.
suite: zz-task-runner
classification: { area: agents, feature: task-runners, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: |
  set -e
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK" >/dev/null || true

  for suffix in a b; do
    repo="$AFT_WORK_DIR/task-repo-$suffix"
    rm -rf "$repo"
    mkdir -p "$repo"
    git -C "$repo" init -q
    git -C "$repo" config user.name "Loom AFT"
    git -C "$repo" config user.email "aft@example.test"
    git -C "$repo" commit --allow-empty -m init -q
    printf 'gate:\n\t@true\n' > "$repo/Makefile"
    mkdir -p "$repo/epic-runner-output"
    : > "$repo/epic-runner-output/.gitkeep"
    git -C "$repo" add Makefile epic-runner-output/.gitkeep
    git -C "$repo" commit -m "add aft task fixtures" -q
    git -C "$repo" branch -M main
  done

  rm -rf "$AFT_WORK_DIR/task-remote-a"
  git init --bare "$AFT_WORK_DIR/task-remote-a" -q
  git -C "$AFT_WORK_DIR/task-repo-a" remote add origin "$AFT_WORK_DIR/task-remote-a"
  git -C "$AFT_WORK_DIR/task-repo-a" push -u origin main -q

  python3 - "$AFT_WORK_DIR/task-repo-a" "$AFT_WORK_DIR/task-repo-b" > "$AFT_WORK_DIR/task-workspace.json" <<'PY'
  import json, sys
  print(json.dumps({
      "name": "e2e-ws-task",
      "type": "empty",
      "repos": [sys.argv[1], sys.argv[2]],
  }))
  PY
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces" \
    -H "Content-Type: application/json" \
    -d @"$AFT_WORK_DIR/task-workspace.json" \
    > "$AFT_WORK_DIR/task-workspace.resp.json"
  python3 - "$AFT_WORK_DIR/task-workspace.resp.json" "$AFT_WORK_DIR/task-repo-a" "$AFT_WORK_DIR/task-repo-b" "$AFT_WORK_DIR" <<'PY'
  import json, pathlib, sys
  resp, repo_a, repo_b, work = sys.argv[1:]
  data = json.load(open(resp)).get("data") or {}
  pathlib.Path(work, "task-workspace.path").write_text(data["path"], encoding="utf-8")
  repos = data.get("repos") or []
  by_name = {r.get("name"): r for r in repos}
  for suffix, repo_path in [("a", repo_a), ("b", repo_b)]:
      repo = by_name[pathlib.Path(repo_path).name]
      pathlib.Path(work, f"task-repo-{suffix}.name").write_text(repo["name"], encoding="utf-8")
      pathlib.Path(work, f"task-repo-{suffix}.source").write_text(repo.get("source_repo_id") or repo["name"], encoding="utf-8")
  PY
  run="${RUN_ID:-local}"
  repo_a="$(cat "$AFT_WORK_DIR/task-repo-a.name")"
  python3 - "$run" "$repo_a" > "$AFT_WORK_DIR/task-worker-a.json" <<'PY'
  import json, sys
  run, repo = sys.argv[1], sys.argv[2]
  print(json.dumps({
      "name": f"worker-a-{run}",
      "role_name": "task",
      "auto": False,
      "cross_repo": False,
      "repos": [repo],
      "backend": "codex",
  }))
  PY
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" \
    -H "Content-Type: application/json" \
    -d @"$AFT_WORK_DIR/task-worker-a.json" \
    > "$AFT_WORK_DIR/task-worker-a.resp.json"
  python3 - "$run" > "$AFT_WORK_DIR/task-lead-companion.json" <<'PY'
  import json, sys
  run = sys.argv[1]
  print(json.dumps({
      "name": f"lead-task-{run}",
      "role_name": "lead",
      "auto": False,
      "cross_repo": True,
      "repos": [],
      "backend": "codex",
  }))
  PY
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" \
    -H "Content-Type: application/json" \
    -d @"$AFT_WORK_DIR/task-lead-companion.json" \
    > "$AFT_WORK_DIR/task-lead-companion.resp.json"
teardown: |
  set +e
  AFT_WS=E2E-WS-TASK "$AFT_TESTS_DIR/scripts/close-open-issues.sh"
  curl -s "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" > "$AFT_WORK_DIR/task-agents.teardown.json" || true
  python3 - "$AFT_WORK_DIR/task-agents.teardown.json" "${RUN_ID:-local}" <<'PY' > "$AFT_WORK_DIR/task-agents.teardown.list"
  import json, sys
  try:
      d = json.load(open(sys.argv[1]))
  except Exception:
      d = {}
  run = sys.argv[2]
  agents = d.get("data") if isinstance(d, dict) else []
  for a in agents or []:
      name = a.get("name", "")
      if name.endswith("-" + run):
          print(name)
  PY
  while read -r agent; do
    [ -n "$agent" ] && curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents/$agent" >/dev/null || true
  done < "$AFT_WORK_DIR/task-agents.teardown.list"
  pkill -f "loom .*--workspace E2E-WS-TASK .* task .*-${RUN_ID:-local}" >/dev/null 2>&1 || true
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK" >/dev/null || true

tests:
  # covers: TSK-D1; CreateAgentModal Task Runner single-repo scope; worktree transaction
  - name: task runner modal creates a single-repo worker with a worktree
    intent: An operator creates a Task Runner scoped to one repo through CreateAgentModal and verifies the stored agent plus materialized worktree
    steps:
      - open: /ws/E2E-WS-TASK/agents
      - wait:
          fn: &agentsPageReady >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the Task Runner workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: &createAgentDialogOpen >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-task }
      - fill: { testid: create-agent-name, value: "worker-modal-a-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('worker-modal-a-${RUN_ID:-local}')
        intent: "Wait until the modal closes and the single-repo worker appears"
      - expect: { visible: { selector: "[aria-label='Agent: worker-modal-a-${RUN_ID:-local}']" } }
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="worker-modal-a-$run"
          repo_a="$(cat "$AFT_WORK_DIR/task-repo-a.name")"
          # budget: db-persist (10s) - modal submit writes the agent row before readback.
          for i in $(seq 1 10); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" > "$AFT_WORK_DIR/tsk-d1-agents.json" &&
            python3 - "$AFT_WORK_DIR/tsk-d1-agents.json" "$name" "$repo_a" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name, repo_a = sys.argv[2], sys.argv[3]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("role_name") == "task", a
          assert not a.get("auto"), a
          assert not a.get("cross_repo"), a
          assert a.get("repos") == [repo_a], a
          assert a.get("backend") == "codex", a
          PY
            sleep 1
          done
          echo "single-repo worker readback never matched"
          cat "$AFT_WORK_DIR/tsk-d1-agents.json" 2>/dev/null || true
          exit 1
        intent: "An operator reads back the created worker from the unordered agent list"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="worker-modal-a-$run"
          repo_a="$(cat "$AFT_WORK_DIR/task-repo-a.name")"
          ws_path="$(cat "$AFT_WORK_DIR/task-workspace.path")"
          wt="$ws_path/worktrees/$repo_a/$name"
          # budget: worktree-materialization (10s) - local agent worktree is created after the row.
          for i in $(seq 1 10); do
            [ -e "$wt/.git" ] && git -C "$wt" rev-parse --is-inside-work-tree >/dev/null 2>&1 && break
            sleep 1
          done
          [ -e "$wt/.git" ] || { echo "missing worktree $wt"; exit 1; }
          branch="$(git -C "$wt" rev-parse --abbrev-ref HEAD)"
          [ "$branch" = "$name" ] || { echo "branch $branch != $name"; exit 1; }
        intent: "An operator confirms the create transaction materialized a git worktree on the agent branch"

  # covers: TSK-D2; CreateAgentModal Task Runner cross-repo scope; all-repo worktree creation
  - name: task runner modal creates a workspace-scope worker in every repo
    intent: An operator deselects every repo chip so a Task Runner takes workspace-wide scope and gets a worktree for every repo
    steps:
      - open: /ws/E2E-WS-TASK/agents
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the Task Runner workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: *createAgentDialogOpen
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-task }
      - fill: { testid: create-agent-name, value: "worker-cross-${RUN_ID:-local}" }
      - click: { selector: "[data-testid='create-agent-repo-chips'] button:first-of-type" }
      - wait:
          fn: >-
            (() => {
              const chip = document.querySelector("[data-testid='create-agent-repo-chips'] button:first-of-type");
              return chip?.getAttribute('aria-pressed') === 'false' &&
                document.body.textContent.includes('No repo selected') &&
                document.body.textContent.includes('workspace-wide scope');
            })()
        intent: "Wait until the first repo chip is deselected and the workspace-scope hint renders"
      - expect: { attr: { selector: "[data-testid='create-agent-repo-chips'] button:first-of-type", name: aria-pressed, equals: "false" } }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('worker-cross-${RUN_ID:-local}')
        intent: "Wait until the modal closes and the cross-repo worker appears"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="worker-cross-$run"
          # budget: db-persist (10s) - modal submit writes the cross-repo agent row.
          for i in $(seq 1 10); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" > "$AFT_WORK_DIR/tsk-d2-agents.json" &&
            python3 - "$AFT_WORK_DIR/tsk-d2-agents.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("role_name") == "task", a
          assert a.get("cross_repo") is True, a
          assert not a.get("repos"), a
          PY
            sleep 1
          done
          echo "cross-repo worker readback never matched"
          cat "$AFT_WORK_DIR/tsk-d2-agents.json" 2>/dev/null || true
          exit 1
        intent: "An operator reads back the cross-repo worker scope from the unordered agent list"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="worker-cross-$run"
          ws_path="$(cat "$AFT_WORK_DIR/task-workspace.path")"
          repo_a="$(cat "$AFT_WORK_DIR/task-repo-a.name")"
          repo_b="$(cat "$AFT_WORK_DIR/task-repo-b.name")"
          for repo in "$repo_a" "$repo_b"; do
            wt="$ws_path/worktrees/$repo/$name"
            [ -e "$wt/.git" ] || { echo "missing cross-repo worktree $wt"; exit 1; }
            git -C "$wt" rev-parse --is-inside-work-tree >/dev/null
            branch="$(git -C "$wt" rev-parse --abbrev-ref HEAD)"
            [ "$branch" = "$name" ] || { echo "branch $branch != $name for $repo"; exit 1; }
          done
        intent: "An operator confirms workspace-scope creation materialized one worktree per repo"

  # covers: TSK-D3; CreateAgentModal backend select; GET /api/backends; agent backend persistence
  - name: task runner backend dropdown selection is honored
    intent: An operator selects a non-default backend for a Task Runner and verifies that backend is stored on the agent
    steps:
      - open: /ws/E2E-WS-TASK/agents
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the Task Runner workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: *createAgentDialogOpen
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-task }
      - fill: { testid: create-agent-name, value: "worker-claude-${RUN_ID:-local}" }
      - wait:
          fn: >-
            (() => {
              const select = document.querySelector('[data-testid=create-agent-backend]');
              if (!select) return false;
              const values = Array.from(select.options).map((o) => o.value);
              return select.value === 'codex' &&
                ['codex', 'claude', 'cursor', 'opencode'].every((v) => values.includes(v));
            })()
        intent: "Wait until backend options load before selecting the non-default backend"
      - expect: { value: { testid: create-agent-backend, equals: codex } }
      - select: { testid: create-agent-backend, value: claude }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('worker-claude-${RUN_ID:-local}')
        intent: "Wait until the claude-backed worker appears after submit"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="worker-claude-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" > "$AFT_WORK_DIR/tsk-d3-agents.json"
          python3 - "$AFT_WORK_DIR/tsk-d3-agents.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          assert matches[0].get("backend") == "claude", matches[0]
          PY
        intent: "An operator reads back the selected claude backend from the agent list"

  # covers: TSK-D4; CreateAgentModal Task Runner name validation; normalizeStoredAgentName
  - name: task runner name validation blocks invalid names and lowercases valid names
    intent: An operator cannot submit invalid Task Runner names and sees a valid uppercase entry normalized to lowercase storage
    steps:
      - open: /ws/E2E-WS-TASK/agents
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the Task Runner workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: *createAgentDialogOpen
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-task }
      - expect: { enabled: { testid: create-agent-submit, equals: false } }
      - fill: { testid: create-agent-name, value: "Worker One" }
      - expect: { enabled: { testid: create-agent-submit, equals: false } }
      - fill: { testid: create-agent-name, value: "-leading" }
      - expect: { enabled: { testid: create-agent-submit, equals: false } }
      - fill: { testid: create-agent-name, value: "WORKER-B-${RUN_ID:-local}" }
      - expect: { enabled: { testid: create-agent-submit, equals: true } }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('worker-b-${RUN_ID:-local}')
        intent: "Wait until the normalized lowercase worker appears"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="worker-b-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" > "$AFT_WORK_DIR/tsk-d4-agents.json"
          python3 - "$AFT_WORK_DIR/tsk-d4-agents.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          assert matches[0].get("name") == name, matches[0]
          PY
        intent: "An operator reads back the lowercase stored agent name from the unordered list"

  # covers: TSK-D5; CreateAgentModal duplicate-name conflict; create-agent-error
  - name: duplicate task runner name stays in the dialog with a conflict
    intent: An operator reusing an existing Task Runner name sees the server conflict in the dialog and no second agent is created
    steps:
      - open: /ws/E2E-WS-TASK/agents
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the Task Runner workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: *createAgentDialogOpen
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-task }
      - fill: { testid: create-agent-name, value: "worker-a-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            document.querySelector('[data-testid=create-agent-error]')?.textContent.includes('An agent with this name already exists.')
        intent: "Wait until the duplicate-name conflict is rendered in the modal"
      - expect: { visible: { testid: create-agent-error } }
      - expect: { visible: { testid: create-agent-overlay } }
      - expect: { value: { testid: create-agent-name, equals: "worker-a-${RUN_ID:-local}" } }
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="worker-a-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" > "$AFT_WORK_DIR/tsk-d5-agents.json"
          python3 - "$AFT_WORK_DIR/tsk-d5-agents.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          PY
        intent: "An operator confirms the duplicate submit did not create a second agent"

  # covers: TSK-D7; IssueDetailPanel delegation start gesture; AssigneeDropdown; agent lifecycle readback
  # This asserts control-plane lifecycle fields only; it does not assert a process started.
  - name: delegation assigns and starts the task runner in the control plane
    intent: An operator delegates an open designed task to a UI-created Task Runner and verifies the issue and agent record that work was started
    steps:
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK/issues"
          body:
            title: "task-runner delegation ${RUN_ID:-local}"
            issue_type: "task"
            priority: 2
            design: "AFT delegation design ${RUN_ID:-local}"
          save:
            - from: "data.id"
              as: "tskD7IssueId"
        intent: "An API client creates a designed task that a Task Runner can be assigned to"
      - open: /ws/E2E-WS-TASK/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
        intent: "Wait until the workspace board is ready"
      - wait:
          fn: >-
            Array.from(document.querySelectorAll("section[data-status=ready] article")).some((el) => el.textContent.includes('task-runner delegation ${RUN_ID:-local}'))
        intent: "Wait until the delegation task appears in Ready before assignment"
      - click: { selector: "section[data-status=ready] article[aria-label*='task-runner delegation ${RUN_ID:-local}']", first: true }
      - wait:
          fn: >-
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-state') === 'open'
        intent: "Wait until the delegation issue detail panel opens"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          # budget: ui-click-retry (3s) - popover mount can lag the trigger click.
          for i in 1 2 3; do
            agent-browser --session "$AFT_SESSION" find testid assignee-dropdown-trigger click || true
            sleep 1
            if agent-browser --session "$AFT_SESSION" eval "
              !!document.querySelector('[data-testid=assignee-dropdown-menu]') &&
              !!document.querySelector('[data-testid=\"agent-assignee-worker-a-$run\"]')
            " | grep -q true; then
              exit 0
            fi
          done
          echo "assignee dropdown never listed worker-a-$run"
          exit 1
        intent: "Retry opening the assignee dropdown until it lists the UI-created Task Runner"
      - click: { testid: "agent-assignee-worker-a-${RUN_ID:-local}" }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=assignee-saving]') &&
            !document.querySelector('[data-testid=assignee-error]') &&
            !document.querySelector('[data-testid=assignee-dropdown-menu]')
        intent: "Wait until assignment save and lifecycle start complete without an assignee error"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          task="$(cat "$AFT_WORK_DIR/tskD7IssueId")"
          # budget: db-persist (10s) - assignment and in-progress status persist through fleet-db.
          for i in $(seq 1 10); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/issues/$task" > "$AFT_WORK_DIR/tsk-d7-issue.json" &&
            python3 - "$AFT_WORK_DIR/tsk-d7-issue.json" "worker-a-$run" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1])).get("data") or {}
          assert d.get("assignee") == sys.argv[2], d
          assert d.get("status") == "in_progress", d
          PY
            sleep 1
          done
          echo "delegated issue never reached worker-a in_progress"
          cat "$AFT_WORK_DIR/tsk-d7-issue.json" 2>/dev/null || true
          exit 1
        intent: "An operator polls the delegated issue until assignment and in-progress status persist"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="worker-a-$run"
          # budget: db-persist (10s) - lifecycle start updates state and desired_state.
          for i in $(seq 1 10); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" > "$AFT_WORK_DIR/tsk-d7-agents.json" &&
            python3 - "$AFT_WORK_DIR/tsk-d7-agents.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("state") == "active", a
          assert a.get("desired_state") == "running", a
          PY
            sleep 1
          done
          echo "worker-a lifecycle state never reached active/running"
          cat "$AFT_WORK_DIR/tsk-d7-agents.json" 2>/dev/null || true
          exit 1
        intent: "An operator reads back the Task Runner lifecycle state after delegation"
      - wait:
          fn: >-
            !Array.from(document.querySelectorAll("section[data-status=ready] article")).some((el) => el.textContent.includes('task-runner delegation ${RUN_ID:-local}')) &&
            Array.from(document.querySelectorAll("section[data-status=in_progress] article")).some((el) => el.textContent.includes('task-runner delegation ${RUN_ID:-local}'))
        intent: "Wait until the board moves the delegated issue from Ready to In Progress"

  # covers: TSK-D10; task prompt ready filter; no-work single-task exit; task sessions empty
  - name: task runner with no designed ready work exits idle without a session
    intent: A Task Runner started when only a designless open task exists reports no work and leaves that task untouched
    steps:
      - run: |
          set -e
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/issues" > "$AFT_WORK_DIR/tsk-d10-pre-issues.json"
          python3 - "$AFT_WORK_DIR/tsk-d10-pre-issues.json" "$AFT_WORK_DIR/tsk-d10-designed-open.ids" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          items = d.get("data", d.get("issues", []))
          ids = []
          for issue in items or []:
              if issue.get("issue_type") == "task" and issue.get("status") == "open" and (issue.get("has_design") or issue.get("design")):
                  ids.append(issue["id"])
          open(sys.argv[2], "w", encoding="utf-8").write("\n".join(ids))
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            curl -sf -X PATCH "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/issues/$id" \
              -H "Content-Type: application/json" \
              -d '{"status":"closed"}' >/dev/null
          done < "$AFT_WORK_DIR/tsk-d10-designed-open.ids"
        intent: "TSK-D10 constructs its own no-work pool by closing any prior open designed task before the idle run"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK/issues"
          body:
            title: "task-runner designless ${RUN_ID:-local}"
            issue_type: "task"
            priority: 2
          save:
            - from: "data.id"
              as: "tskD10IssueId"
        intent: "An API client creates an open task without a design to prove the has_design gate"
      - open: /ws/E2E-WS-TASK/agents
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the Task Runner workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: *createAgentDialogOpen
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-task }
      - fill: { testid: create-agent-name, value: "idle-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('idle-${RUN_ID:-local}')
        intent: "Wait until the idle worker appears after submit"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="idle-$run"
          PATH="$AFT_TESTS_DIR/../../e2e/stubs:$PATH" \
          LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" \
          LOOM_SERVER_URL="$AFT_API_URL" \
          LOOM_WORKSPACE_ID=E2E-WS-TASK \
          "$AFT_LOOM_BIN" --workspace E2E-WS-TASK --backend codex task "$name" \
            > "$AFT_WORK_DIR/tsk-d10-task.out" 2>&1
          grep -F "No tasks available for implementation." "$AFT_WORK_DIR/tsk-d10-task.out"
          grep -F "Tasks must be: open status, has design, no needs-revision label, not epics" "$AFT_WORK_DIR/tsk-d10-task.out"
        intent: "The local runtime starts the Task Runner in single-task mode and observes the no-work message"
      - api:
          method: "GET"
          path: "/api/workspaces/E2E-WS-TASK/issues/${var:tskD10IssueId}"
          assert:
            - path: "data.status"
              equals: "open"
            - path: "data.assignee"
              exists: false
        intent: "An operator reads back that the designless issue stayed open and unassigned"
      - run: |
          set -e
          task="$(cat "$AFT_WORK_DIR/tskD10IssueId")"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/tasks/$task/sessions" > "$AFT_WORK_DIR/tsk-d10-sessions.json"
          python3 - "$AFT_WORK_DIR/tsk-d10-sessions.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data") or {}
          sessions = data.get("sessions") if isinstance(data, dict) else data
          assert sessions == [], d
          PY
        intent: "An operator confirms no session was recorded for the skipped designless task"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="idle-$run"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" > "$AFT_WORK_DIR/tsk-d10-agents.json"
          python3 - "$AFT_WORK_DIR/tsk-d10-agents.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("state", "idle") in ("", "idle"), a
          assert a.get("live_status", "idle") in ("", "idle"), a
          assert a.get("live_status") != "working", a
          PY
        intent: "An operator reads back that the idle worker did not enter a working live status"

  # covers: TSK-D13; LOOM_SOURCE_REPOS route filter; IssueCreateRequest source_repo
  - name: task runner source-repo scope filters ready work
    intent: A Task Runner scoped to repo B ignores designed work attributed to repo A, and the positive control proves that repo A work was available
    steps:
      - open: /ws/E2E-WS-TASK/agents
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the Task Runner workspace agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: *createAgentDialogOpen
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-task }
      - fill: { testid: create-agent-name, value: "scoped-${RUN_ID:-local}" }
      - click: { selector: "[data-testid='create-agent-repo-chips'] button:first-of-type" }
      - click: { selector: "[data-testid='create-agent-repo-chips'] button:nth-of-type(2)" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('scoped-${RUN_ID:-local}')
        intent: "Wait until the repo-B-scoped worker appears after submit"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="scoped-$run"
          repo_b="$(cat "$AFT_WORK_DIR/task-repo-b.name")"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/agents" > "$AFT_WORK_DIR/tsk-d13-agents.json"
          python3 - "$AFT_WORK_DIR/tsk-d13-agents.json" "$name" "$repo_b" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          name, repo_b = sys.argv[2], sys.argv[3]
          agents = d.get("data") if isinstance(d, dict) else []
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert not a.get("cross_repo"), a
          assert a.get("repos") == [repo_b], a
          PY
        intent: "An operator reads back that the scoped worker stores only repo B"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          repo_a_source="$(cat "$AFT_WORK_DIR/task-repo-a.source")"
          python3 - "$run" "$repo_a_source" > "$AFT_WORK_DIR/tsk-d13-issue.json" <<'PY'
          import json, sys
          run, repo = sys.argv[1], sys.argv[2]
          print(json.dumps({
              "title": f"task-runner repo-scope {run}",
              "issue_type": "task",
              "priority": 2,
              "design": f"AFT repo-scope design {run}",
              "source_repo": repo,
          }))
          PY
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-TASK/issues" \
            -H "Content-Type: application/json" \
            -d @"$AFT_WORK_DIR/tsk-d13-issue.json" \
            > "$AFT_WORK_DIR/tsk-d13-issue.resp.json"
          python3 - "$AFT_WORK_DIR/tsk-d13-issue.resp.json" > "$AFT_WORK_DIR/tskD13IssueId" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["data"]["id"])
          PY
        intent: "An API client creates a designed task attributed to repo A"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="scoped-$run"
          repo_b_source="$(cat "$AFT_WORK_DIR/task-repo-b.source")"
          PATH="$AFT_TESTS_DIR/../../e2e/stubs:$PATH" \
          LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" \
          LOOM_SERVER_URL="$AFT_API_URL" \
          LOOM_WORKSPACE_ID=E2E-WS-TASK \
          LOOM_SOURCE_REPOS="$repo_b_source" \
          "$AFT_LOOM_BIN" --workspace E2E-WS-TASK --backend codex task "$name" \
            > "$AFT_WORK_DIR/tsk-d13-repo-b.out" 2>&1
          grep -F "No tasks available for implementation." "$AFT_WORK_DIR/tsk-d13-repo-b.out"
        intent: "The local runtime starts the repo-B-scoped Task Runner and verifies repo-A work is filtered out"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          name="scoped-$run"
          repo_a_source="$(cat "$AFT_WORK_DIR/task-repo-a.source")"
          PATH="$AFT_TESTS_DIR/../../e2e/stubs:$PATH" \
          LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" \
          LOOM_SERVER_URL="$AFT_API_URL" \
          LOOM_WORKSPACE_ID=E2E-WS-TASK \
          LOOM_SOURCE_REPOS="$repo_a_source" \
          "$AFT_LOOM_BIN" --workspace E2E-WS-TASK --backend codex task "$name" \
            > "$AFT_WORK_DIR/tsk-d13-repo-a.out" 2>&1
          grep -F "Running IMPLEMENTATION agent in:" "$AFT_WORK_DIR/tsk-d13-repo-a.out"
          if grep -F "No tasks available for implementation." "$AFT_WORK_DIR/tsk-d13-repo-a.out"; then
            echo "repo A control unexpectedly reported no work"
            exit 1
          fi
        intent: "The local runtime reruns with repo A scope and proves the same designed task passes the availability gate"

  # covers: TSK-D16; task-agent archive Logs tab; daemon seed-log; terminal/info archive mode
  - name: task runner logs tab shows archive mode and seeded content
    intent: An operator opens a Task Runner Logs tab, sees the empty archive state, then refreshes runtime-seeded archive content
    steps:
      - open: /ws/E2E-WS-TASK/agents/worker-a-${RUN_ID:-local}
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the worker-a agent detail page is ready"
      - click: { role: button, name: Logs, exact: true }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=log-viewer]')
        intent: "Wait until the task agent archive log viewer is ready"
      - expect: { visible: { testid: archive-empty } }
      - expect: { text: No logs available for this agent yet. }
      - api:
          method: "GET"
          path: "/api/workspaces/E2E-WS-TASK/agents/worker-a-${RUN_ID:-local}/terminal/info"
          assert:
            - path: "data.mode"
              equals: "archive"
        intent: "An operator confirms the task agent Logs tab is using archive mode, not a tmux session"
      - run: >-
          printf '%s\n' "worker-a task log line one" "AFT-TASK-LOG-MARKER ${RUN_ID:-local}" |
          LOOM_TESTSUPPORT=1 LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" "$AFT_LOOM_BIN" daemon seed-log --workspace E2E-WS-TASK --agent "worker-a-${RUN_ID:-local}" --content -
        intent: "The local runtime seeds worker-a with an archived task-agent log marker"
      - click: { testid: log-refresh-button }
      - wait: { text: AFT-TASK-LOG-MARKER }
      - expect: { visible: { testid: terminal-container } }
      - expect: { attr: { testid: log-status, name: "data-state", equals: "connected" } }
      - expect: { text: ARCHIVE SNAPSHOT }

  # covers: TSK-D17; agents rail; WorkspaceTree background group; monitor; deep-link tabs
  - name: task runner appears on every agent surface with background identity
    intent: An operator can discover a newly created Task Runner from the agents rail, workspace tree, monitor, and agent detail deep link
    steps:
      - open: /ws/E2E-WS-TASK/agents/worker-a-${RUN_ID:-local}
      - wait:
          fn: *agentsPageReady
        intent: "Wait until the worker-a agent detail page is ready"
      - expect: { url: "**/ws/*/agents/worker-a-${RUN_ID:-local}**" }
      - expect: { visible: { selector: "[aria-label='Agent: worker-a-${RUN_ID:-local}']" } }
      - wait:
          fn: >-
            document.querySelector('[data-testid=agent-section-background]')?.textContent.includes('worker-a-${RUN_ID:-local}')
        intent: "Wait until the workspace tree renders worker-a under the Background subgroup"
      - wait:
          fn: >-
            (() => {
              const group = document.querySelector('[data-testid=agent-editor-groups]');
              if (!group) return false;
              const labels = Array.from(group.querySelectorAll('button[draggable="true"]')).map((b) => b.textContent.trim()).filter(Boolean);
              return JSON.stringify(labels) === JSON.stringify(["Terminal", "Info", "Git", "Logs", "Diff", "Files"]);
            })()
        intent: "Wait until the agent detail route renders the expected six editor tabs"
      - open: /ws/E2E-WS-TASK/monitor
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=agent-activity-panel]')
        intent: "Wait until the task workspace monitor activity panel is mounted"
      - run: |
          set -e
          name="worker-a-${RUN_ID:-local}"
          # budget: monitor-cache (16s) - monitor/status can lag seeded log visibility.
          for i in $(seq 1 16); do
            curl -sf "$AFT_BASE_URL/api/monitor/status?workspace=E2E-WS-TASK" > "$AFT_WORK_DIR/tsk-d17-monitor.json" &&
            python3 - "$AFT_WORK_DIR/tsk-d17-monitor.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert any(a.get("name") == sys.argv[2] for a in d.get("agents", [])), d.get("agents")
          PY
            sleep 1
          done
          echo "monitor status never exposed worker-a"
          cat "$AFT_WORK_DIR/tsk-d17-monitor.json" 2>/dev/null || true
          exit 1
        intent: "Poll monitor status past its cache window before reloading the monitor UI"
      - reload: true
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=agent-activity-panel]') &&
            document.body.textContent.includes('worker-a-${RUN_ID:-local}')
        intent: "Wait until the monitor status cache refresh exposes worker-a"
      - expect: { notText: No agents found }

  # covers: TSK-D18; quarantined issue rendering; loom:quarantined badge
  - name: quarantined task renders the visible quarantine badge
    intent: An operator sees the board badge for a task whose terminal daemon state marks it quarantined
    steps:
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-TASK/issues"
          body:
            title: "task-runner quarantine ${RUN_ID:-local}"
            issue_type: "task"
            priority: 2
            assignee: ""
            labels: ["loom:quarantined"]
          save:
            - from: "data.id"
              as: "tskD18IssueId"
        intent: "An API client creates the quarantined task before moving it to blocked"
      - api:
          method: "PATCH"
          path: "/api/workspaces/E2E-WS-TASK/issues/${var:tskD18IssueId}"
          body:
            status: "blocked"
        intent: "An API client moves the quarantined task to blocked because create rejects blocked status"
      - open: /ws/E2E-WS-TASK/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
        intent: "Wait until the workspace board is ready"
      - fill: { testid: search-input-field, value: "task-runner quarantine ${RUN_ID:-local}" }
      - wait:
          fn: >-
            Array.from(document.querySelectorAll("section[data-status=blocked] article")).some((el) => el.textContent.includes('task-runner quarantine ${RUN_ID:-local}'))
        intent: "Wait until the quarantined task appears in the Blocked column"
      - expect: { count: { selector: "section[data-status=blocked] article[aria-label*='task-runner quarantine ${RUN_ID:-local}']", equals: 1 } }
      - expect: { visible: { selector: "section[data-status=blocked] article[aria-label*='task-runner quarantine ${RUN_ID:-local}'] [aria-label='Task quarantined']" } }
      - expect: { attr: { selector: "section[data-status=blocked] article[aria-label*='task-runner quarantine ${RUN_ID:-local}'] [aria-label='Task quarantined']", name: title, equals: "Task quarantined by daemon after repeated no-progress kills — see comment for the kill timeline" } }
      - expect: { text: Quarantined }
