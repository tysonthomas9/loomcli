          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-AGV1-LEAD/v1/agents/$id" > "$AFT_WORK_DIR/agv1-ui2-agent.json"
          python3 - "$AFT_WORK_DIR/agv1-ui2-agent.json" <<'PY'
          import json, sys
          spec = json.loads(json.load(open(sys.argv[1]))["spec_json"])
          assert {"ID": "effort", "Value": "high"} in spec.get("Options", []), spec
          PY
        intent: "Check that the pick was saved on the agent through PATCH"
      - reload: true
      - wait:
          fn: >-
            (document.querySelector('[data-chat-traits-picker]')?.textContent || '').includes('High') &&
            (document.querySelector('[data-chat-provider-model-picker]')?.textContent || '').includes('Emulator')
        intent: "Wait until a reload still shows the model and High effort"
      - run: |
          set -e
          curl -sf -X POST "$AFT_FAKE_MODEL_URL/__reset" >/dev/null
          curl -sf -X POST "$AFT_FAKE_MODEL_URL/__script" -H "Content-Type: application/json" \
            -d '{"steps":[{"text":"AGV1-UI2-REPLY"}]}' >/dev/null
        intent: "Script the next reply"
      - fill: { label: Message, value: "ui2 effort turn" }
      - press: Enter
      - wait:
          fn: >-
            (document.querySelector('[data-testid=chat-transcript]')?.textContent || '').includes('AGV1-UI2-REPLY')
        budget: 90000
        intent: "Wait until the reply streams into the transcript"
      - run: |
          set -e
          curl -sf "$AFT_FAKE_MODEL_URL/__requests" > "$AFT_WORK_DIR/agv1-ui2-requests.json"
          python3 - "$AFT_WORK_DIR/agv1-ui2-requests.json" <<'PY'
          import json, sys
          reqs = json.load(open(sys.argv[1]))["requests"]
          turn = [r for r in reqs if "ui2 effort turn" in json.dumps(r)]
          assert turn, f"the message never reached the model: {reqs}"
          assert '"reasoning_effort": "high"' in json.dumps(turn[-1]), turn[-1]
          PY
        intent: "Check that the turn after the pick reached the model at effort high"

  - name: UI4 - an approval shows its command and Always allow this session answers it, and a failed turn says why in the chat
    intent: An operator sees what a review agent asks to run, allows it for the session, gets the reply, and when the next turn fails reads the harness's reason in a banner and in the turn's note
    steps:
      - api:
          method: POST
          path: /api/workspaces/E2E-AGV1-LEAD/v1/agents
          headers: { Idempotency-Key: "agv1-ui4ok-${RUN_ID:-local}" }
          body: { preset: pr-review-interactive, name: "agv1-ui4ok-${RUN_ID:-local}", repo: "${AFT_WORK_DIR}/agv1-lead-repo", base_ref: main, overrides: { harness: opencode } }
          save:
            - from: agent_id
              as: agv1Ui4OkId
        intent: "Create an OpenCode agent whose preset asks before running a shell command"
      - run: |
          set -e
          id="$(cat "$AFT_WORK_DIR/agv1Ui4OkId")"
          curl -sf -X POST "$AFT_FAKE_MODEL_URL/__reset" >/dev/null
          python3 - "$id" "${AFT_EMU_SCENARIOS:-}" "$AFT_FAKE_MODEL_URL" <<'PY'
          import json, sys, urllib.request
          agent, scenarios, model = sys.argv[1:4]
          cmd = "echo AGV1-UI4-RAN"
          fail = "AGV1-UI4-FAIL the model refused the request"
          if scenarios:
              # The emulator asks the scripted permission as OpenCode's bash "ask" rule does.
              turns = [{"tools": [{"id": "call_ui4_bash", "name": "shell", "input": {"command": cmd},
                                   "output": "AGV1-UI4-RAN",
                                   "permission": {"action": "bash", "resources": [cmd], "save": ["echo *"]}}],
                        "text": "AGV1-UI4-AFTER"},
                       {"fail": fail}]
              json.dump({agent: turns}, open(scenarios, "w"))
          else:
              steps = [{"bash": cmd}, {"text": "AGV1-UI4-AFTER"}, {"error": fail}]
              req = urllib.request.Request(model + "/__script", data=json.dumps({"steps": steps}).encode(),
                                           headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req).read()
          PY
          agent-browser --session "$AFT_SESSION" open "$AFT_BASE_URL/ws/E2E-AGV1-LEAD/chat/$id"
        intent: "Script a turn that runs a shell command, then a turn the model refuses, and open the agent's chat"
      - wait:
          fn: >-
            document.querySelector('[data-testid=harness-label]')?.textContent === 'opencode'
        intent: "Wait until the chat for the agent is ready"
      - fill: { label: Message, value: "run the check" }
      - press: Enter
      - wait:
          fn: >-
            (() => { const c = document.querySelector('[data-testid=ask-card]');
              const d = c?.querySelector('[aria-label="Approval request"]')?.textContent || '';
              return d.includes('echo AGV1-UI4-RAN') && Array.from(c.querySelectorAll('button')).map((b) => b.textContent).join('|')
                .includes('Always allow this session'); })()
        budget: 90000
        intent: "Wait until the approval card shows the command it asks to run and offers Always allow this session"
      - click: { role: button, name: Always allow this session, exact: true }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=ask-card]') &&
              (document.querySelector('[data-testid=chat-transcript]')?.textContent || '').includes('AGV1-UI4-AFTER')
        budget: 60000
        intent: "Wait until the card closes and the agent replies after running the command"
      - fill: { label: Message, value: "try again" }
      - press: Enter
      - wait:
          fn: >-
            (() => { const b = document.querySelector('[data-testid=turn-error]');
              const n = document.querySelector('[data-testid=turn-end-error]');
              return (b?.textContent || '').includes('AGV1-UI4-FAIL') && (n?.textContent || '').includes('AGV1-UI4-FAIL'); })()
        budget: 90000
        intent: "Wait until the failed turn's reason shows in the error banner and the turn's note"
      - reload: true
      - wait:
          fn: >-
            (document.querySelector('[data-testid=turn-end-error]')?.textContent || '').includes('AGV1-UI4-FAIL') &&
              (document.querySelector('[data-testid=turn-error]')?.textContent || '').includes('AGV1-UI4-FAIL')
        intent: "Wait until a reload replays the reason from saved events"
      - click: { role: button, name: Dismiss error, exact: true }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=turn-error]') &&
              (document.querySelector('[data-testid=turn-end-error]')?.textContent || '').includes('AGV1-UI4-FAIL')
        intent: "Wait until Dismiss hides the banner and the turn's note keeps the reason"

  - name: UI4 - the agent asks several questions and the operator answers them one by one with an option and a custom answer
