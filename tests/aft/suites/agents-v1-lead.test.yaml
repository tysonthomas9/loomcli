            document.querySelectorAll('[data-model-picker-content] [role=option]').length === 1
        intent: "Wait until searching finds the one Emulator model"
      - press: Escape
      - click: { selector: "[data-chat-traits-picker]" }
      - click: { role: menuitemradio, name: High, exact: true }
      - wait:
          fn: >-
            (document.querySelector('[data-chat-traits-picker]')?.textContent || '').includes('High')
        intent: "Wait until the effort control shows High"
      - run: |
          set -e
