suite: loomgit-merge-stale
classification: { area: reviews, feature: merge-up-to, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: bash "$AFT_TESTS_DIR/scripts/loomgit-merge-stale.sh" setup
teardown: bash "$AFT_TESTS_DIR/scripts/loomgit-merge-stale.sh" teardown

tests:
  - name: Merge up to here after the PR's head moved lands the new head, never the old one
    intent: A real task and Pull/republish move the published head; with no confirmation step to go stale, a human's Merge up to here merges the head now on the PR
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-merge-stale.sh" seed
        intent: Create, approve, apply and publish a real TaskRun change through the product paths
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-merge-stale.sh" advance
        intent: Advance provider trunk, Pull the applied layer and republish its carried-approval head through Loom
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-merge-stale.sh" verify
        intent: Merge up to here queues the new head; trunk ends with the new head's tree and the foreign edit, not the old head
      - open: /ws/E2E-WS-MERGE-STALE/prs
        intent: Open the Pull Requests page after the merge
      - wait:
          fn: "!document.querySelector('[data-testid=merge-queue-entry]')"
        intent: The finished merge has left the merge queue
      - run: agent-browser --session "$AFT_SESSION" screenshot "$AFT_WORK_DIR/merge-stale/merge-stale-prs.png"
        intent: Record the Pull Requests page after the merge
