      head/base/body/count
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" ui-pin review-stack-reject-retry
    intent: The observer checks the published UI revision matches the recorded Git/API head
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" retry-publish review-stack-reject-retry
    intent: The API-client retries Publish after the human action; the existing PR must be adopted once
