    intent: The observer checks identical Git trees, empty API diff, No changes closure and unchanged remote
  - reload: true
    intent: The human reloads the empty task
  - wait:
      fn: (document.querySelector('[data-testid=status-dropdown]') || document.querySelector('[data-testid=issue-status-badge]'))?.getAttribute('data-status')
        === 'closed'
    intent: 'R-trunk-empty-reloaded-task: reload preserves closure'
  - click:
      role: tab
      name: Changes
      exact: true
    intent: The human reviewer opens Changes to review the task patch
  - wait:
      fn: '!!document.querySelector(''[data-testid=revision-no-changes]'') && !document.querySelector(''[data-testid=task-changes-tab]
        button'')'
    intent: 'R-trunk-empty-reloaded: No changes and no actions survive reload'
- name: review-trunk-held
  intent: In trunk delivery mode, unsaved user bytes hold Apply, keeping the approved task in review and opening
    no PR. API-client starts and retry requests are named separately; observers only read product state.
  steps:
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" start review-trunk-held
    intent: The API-client starts the real local TaskRun; the stub AI writes only the requested fixture file
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" finished review-trunk-held
    intent: The system records the completed attempt through product capture and waits for its task state
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" open review-trunk-held
    intent: The human reviewer navigates to the completed task
  - wait:
      fn: (document.querySelector('[data-testid=status-dropdown]') || document.querySelector('[data-testid=issue-status-badge]'))?.getAttribute('data-status')
        === 'review'
    intent: 'R-trunk-held-task: the task has the required completion state'
  - wait:
      fn: '!!document.querySelector(''[data-testid=issue-status-badge]'') && !document.querySelector(''[data-testid=status-dropdown]'')
        && !document.querySelector(''[data-testid=remove-label-code-review]'') && !document.querySelector(''[data-testid=review-action-bar]'')
        && !document.querySelector(''[data-testid=panel-approve-button]'')'
    intent: 'R-trunk-held-locked: code review has a status badge and no header bypass'
  - click:
      role: tab
      name: Changes
      exact: true
    intent: The human reviewer opens Changes to review the task patch
  - wait:
      fn: document.querySelectorAll('[data-testid=task-repo-changes]').length === 1 && document.querySelector('[data-testid=task-changes-tab]')?.textContent.includes('review-trunk-held.txt')
        && document.querySelector('[data-testid=task-changes-tab]')?.textContent.includes('task=') && document.querySelector('[data-testid=task-changes-tab]')?.textContent.includes('
        run=') && !document.querySelector('[data-testid=approve-create-pr]')?.disabled && document.querySelector('[data-testid=revisions-section]')?.textContent.includes('Awaiting
        review')
    intent: 'R-trunk-held-diff: the reviewer sees the actual code before an enabled verdict'
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" check review-trunk-held review
    intent: The observer compares the visible task diff with captured Git refs and verifies no Apply or publish
      before approval
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" ui-pin review-trunk-held
    intent: The observer checks the displayed revision number and head against the product API
  - click:
      testid: approve-create-pr
    intent: The human asks to approve, apply and publish through the mounted review button
  - wait:
      fn: '!!document.querySelector(''[data-testid=revisions-section] [role=alert]'') && document.querySelector(''[data-testid=revisions-section]'')?.textContent.includes(''review-trunk-held.txt'')
        && !document.querySelector(''[data-testid=revision-pr]'')'
    intent: 'R-trunk-held-held: the overlapping edit is named and no PR is shown'
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" check review-trunk-held held
    intent: The observer checks recorded approval, no premature closure, unchanged HEAD/index/user bytes and
      no remote or provider mutation
  - reload: true
    intent: The human reloads the held task
  - wait:
      fn: (document.querySelector('[data-testid=status-dropdown]') || document.querySelector('[data-testid=issue-status-badge]'))?.getAttribute('data-status')
        === 'review'
    intent: 'R-trunk-held-reloaded-task: held delivery still requires attention'
  - click:
      role: tab
      name: Changes
      exact: true
    intent: The human reviewer opens Changes to review the task patch
  - wait:
      fn: document.querySelector('[data-testid=revisions-section]')?.textContent.includes('approve') && [...document.querySelectorAll('[data-testid=revisions-section]
        button')].filter(b => ['Reject','Override','Approve and create PR','▾'].includes(b.textContent.trim())).every(b
        => b.disabled) && !document.querySelector('[data-testid=revision-pr]') && !document.querySelector('[data-testid=create-pr]')
    intent: 'R-trunk-held-reloaded: recorded approval stays locked while the task is held'
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" check review-trunk-held held
    intent: The observer checks reload did not overwrite user edits or publish a held change
