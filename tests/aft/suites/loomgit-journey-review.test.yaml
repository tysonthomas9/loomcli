    intent: The observer checks Reject reopens the task, removes code-review, preserves the revision and opens
      no PR
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" retry review-stack-reject-retry
    intent: The API-client changes only the rejected task design and starts a new TaskRun for that same task
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" retried review-stack-reject-retry
    intent: The system captures a distinct new revision for the same task and change
