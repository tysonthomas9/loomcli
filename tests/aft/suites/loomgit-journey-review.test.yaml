# #943 product journey authoring; execute with the reviewed runner overlay.
# Deterministic: actual serve/FleetDB/Git/processes, stub AI, local fake forge.
# --screenshots records each named R-* wait checkpoint in the AFT report.
# No seeded revisions/verdicts; fixture setup may use API and real Git.
# D29: Approve follows the patch into the existing working area automatically.
# Explicit route: Approve only -> Applied checkpoint -> mounted Create PR.
# Criterion mapping (same case suffix and checkpoints in stack AND trunk):
# A-P1.26.01/.02/.06 + B-024-01 + B-218-02/.04: all changed cases, task/diff/verdict.
# B-R-01 + B-026-03/.11 + B-219-02/.06: explicit/automatic, applied/pr.
# B-211-03 + duplicate request idempotency: explicit/automatic/reject-retry, pr/reloaded.
# A-P1.26.02 + B-218-05: reject-retry, rejected/retry/history/pr.
# A-P1.25.01 + A-P1.26.03 + B-R-04: empty, no-changes/no-actions/reloaded.
# B-026-05 + B-219-04 + A-P1.26.02: held, held/reloaded.
# Unrun/missing fault-specific paths stay explicit in task note df232431-41a7-4a71-9bc5-88f3b2c46772.
suite: loomgit-journey-review
classification:
  area: reviews
  feature: review-apply-publish
  surface: mixed
  purpose: journey
baseUrl: ${AFT_BASE_URL:-http://127.0.0.1:3100}
setup: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" setup
teardown: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" teardown
tests:
- name: review-stack-explicit
  intent: In stack delivery mode, Approve only applies, then the human publishes once. API-client starts and
    retry requests are named separately; observers only read product state.
  steps:
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" start review-stack-explicit
    intent: The API-client starts the real local TaskRun; the stub AI writes only the requested fixture file
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" finished review-stack-explicit
    intent: The system records the completed attempt through product capture and waits for its task state
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" open review-stack-explicit
    intent: The human reviewer navigates to the completed task
  - wait:
      fn: (document.querySelector('[data-testid=status-dropdown]') || document.querySelector('[data-testid=issue-status-badge]'))?.getAttribute('data-status')
        === 'review'
    intent: 'R-stack-explicit-task: the task has the required completion state'
  - wait:
      fn: '!!document.querySelector(''[data-testid=issue-status-badge]'') && !document.querySelector(''[data-testid=status-dropdown]'')
        && !document.querySelector(''[data-testid=remove-label-code-review]'') && !document.querySelector(''[data-testid=review-action-bar]'')
        && !document.querySelector(''[data-testid=panel-approve-button]'')'
    intent: 'R-stack-explicit-locked: code review has a status badge and no header bypass'
  - click:
      role: tab
      name: Changes
      exact: true
    intent: The human reviewer opens Changes to review the task patch
  - wait:
      fn: document.querySelectorAll('[data-testid=task-repo-changes]').length === 1 && document.querySelector('[data-testid=task-changes-tab]')?.textContent.includes('review-stack-explicit.txt')
        && document.querySelector('[data-testid=task-changes-tab]')?.textContent.includes('task=') && document.querySelector('[data-testid=task-changes-tab]')?.textContent.includes('
        run=') && !document.querySelector('[data-testid=approve-create-pr]')?.disabled && document.querySelector('[data-testid=revisions-section]')?.textContent.includes('Awaiting
        review')
    intent: 'R-stack-explicit-diff: the reviewer sees the actual code before an enabled verdict'
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" check review-stack-explicit review
    intent: The observer compares the visible task diff with captured Git refs and verifies no Apply or publish
      before approval
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" ui-pin review-stack-explicit
    intent: The observer checks the displayed revision number and head against the product API
  - click:
      testid: approve-menu-toggle
    intent: The human opens More approve options
  - click:
      testid: approve-only
    intent: The human chooses Approve only; existing working area follows the approved patch
  - wait:
      fn: document.querySelector('[data-testid=revisions-section]')?.textContent.includes('approve') && [...document.querySelectorAll('[data-testid=revisions-section]
        button')].filter(b => ['Reject','Override','Approve and create PR','▾'].includes(b.textContent.trim())).every(b
        => b.disabled)
    intent: 'R-stack-explicit-verdict: the exact head has a locked approval'
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" check review-stack-explicit applied
    intent: The observer checks the human verdict and real Apply result without a provider write
  - wait:
      fn: document.querySelector('[data-testid=revisions-section]')?.textContent.includes('Applied') && !!document.querySelector('[data-testid=create-pr]:not([disabled])')
        && !document.querySelector('[data-testid=revision-pr]')
    intent: 'R-stack-explicit-applied: approved code is in the working area before publication'
  - click:
      testid: create-pr
    intent: The human publishes the applied change with Create PR
  - wait:
      fn: document.querySelector('[data-testid=revision-pr]')?.textContent.includes('is open')
    intent: 'R-stack-explicit-pr: Loom shows the opened PR'
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" check review-stack-explicit published
    intent: The observer compares task/API state, local publication ref, bare remote patch and fake-provider
      head/base/body/count
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" ui-pin review-stack-explicit
    intent: The observer checks the published UI revision matches the recorded Git/API head
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" retry-publish review-stack-explicit
    intent: The API-client retries Publish after the human action; the existing PR must be adopted once
  - reload: true
    intent: The human reloads the published task
  - wait:
      fn: (document.querySelector('[data-testid=status-dropdown]') || document.querySelector('[data-testid=issue-status-badge]'))?.getAttribute('data-status')
        === 'closed'
    intent: 'R-stack-explicit-reloaded-task: delivered task closure survives reload'
  - click:
      role: tab
      name: Changes
      exact: true
    intent: The human reviewer opens Changes to review the task patch
  - wait:
      fn: '!!document.querySelector(''[data-testid=revision-pr]'') && !document.querySelector(''[data-testid=create-pr]'')
        && !document.querySelector(''[data-testid=approve-create-pr]'') && !document.querySelector(''[data-testid=approve-menu-toggle]'')
        && !document.querySelector(''[data-testid=approve-only]'')'
    intent: 'R-stack-explicit-reloaded: the same PR is shown with no duplicate Create PR or Approve only'
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" ui-pin review-stack-explicit
    intent: The observer checks reload remains pinned to the published revision
  - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-review.sh" check review-stack-explicit stable
    intent: The observer verifies retry and reload preserve one PR creation, the same remote head and the same
      publication record
