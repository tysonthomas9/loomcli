kind: graph-steps
version: 1
flow: agent-flow
blocks:
  expect-browser-url:
    params:
    - url
    steps:
    - expect:
        url: "{{url}}"
  blank-browser-ready:
    steps:
    - use: expect-browser-url
      with:
        url: about:blank
  open-agents-page:
    params:
    - path
    steps:
    - open: "{{path}}"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the agents page is ready
  open-create-agent-dialog:
    params:
    - path
    steps:
    - use: open-agents-page
      with:
        path: "{{path}}"
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open
  provision-nova:
    steps:
    - use: open-create-agent-dialog
      with:
        path: "/ws/E2E-AF-${AFT_CASE_KEY}/agents"
    - click:
        testid: create-agent-template-lead
    - fill:
        testid: create-agent-name
        value: nova
    - click:
        testid: create-agent-submit
    - wait:
        fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('nova')"
      intent: Wait until the created agent appears after the modal closes
    - open: "/ws/E2E-AF-${AFT_CASE_KEY}/agents/nova"
      intent: An operator opens nova so the shared trunk ends on the Lead being reviewed, not an incidental agent selection
  controlled-codex-lead-connected:
    params:
    - name
    steps:
    - wait:
        fn: |-
          (() => {
            const wrapper = document.querySelector('[data-testid=terminal-wrapper]');
            if (!wrapper) return false;
            const rows = Array.from(wrapper.querySelectorAll('.term-row')).map((el) => el.textContent || '').join('\n');
            const text = rows || wrapper.textContent || '';
            const failure = [
              'Error running agent',
              'backend is not installed',
              'codex remote stub failed to connect',
              'Dropping into a shell'
            ].find((message) => text.includes(message));
            if (failure) {
              throw new Error('controlled Lead failed before connection: ' + text.slice(-400));
            }
            return text.includes('Starting LEAD mode') &&
              text.includes('Launching controlled Codex lead session...') &&
              text.includes('Controlled Codex stub connected: {{name}}');
          })()
      intent: Wait until {{name}} completes the controlled Codex bootstrap without falling back to a shell
    - wait:
        fn: |-
          (async () => {
            const response = await fetch('/api/workspaces/E2E-AF-${AFT_CASE_KEY}/terminal/tabs', { cache: 'no-store' });
            if (!response.ok) return false;
            const payload = await response.json();
            const tabs = Array.isArray(payload.data) ? payload.data : [];
            const matches = tabs.filter((tab) =>
              tab.agent_id === '{{name}}' &&
              tab.kind === 'agent' &&
              tab.role === 'lead' &&
              tab.backend === 'codex');
            return matches.length === 1 && matches[0].pty_alive === true;
          })()
      intent: Confirm {{name}} owns exactly one live Codex-backed Lead terminal
    - expect:
        visible:
          testid: terminal-wrapper
    - wait:
        fn: |-
          (() => {
            const details = document.querySelector("section[aria-label='Agent details']");
            return location.pathname.endsWith('/agents/{{name}}') &&
              (details?.textContent || '').toLowerCase().includes('{{name}}'.toLowerCase());
          })()
      intent: Confirm the selected agent detail route and visible header still belong to {{name}}
  show-agent-info:
    params:
    - name
    steps:
    - open: "/ws/E2E-AF-${AFT_CASE_KEY}/agents/{{name}}"
      intent: An operator opens {{name}} so its background-agent definition is the review subject
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const card = document.querySelector("[aria-label='Agent: {{name}}']");
            const root = document.querySelector('[data-testid=agent-editor-groups]');
            const info = Array.from(root?.querySelectorAll('button[draggable="true"]') || [])
              .find((button) => (button.textContent || '').trim() === 'Info');
            const ready = location.pathname.endsWith('/agents/{{name}}') && page && card && root && info;
            const sig = [location.pathname, !!card, !!root, !!info].join('|');
            if (!ready) {
              window.__aftAgentInfoReadySig = null;
              window.__aftAgentInfoReadyAt = 0;
              return false;
            }
            if (window.__aftAgentInfoReadySig !== sig) {
              window.__aftAgentInfoReadySig = sig;
              window.__aftAgentInfoReadyAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentInfoReadyAt >= 300;
          })()
      intent: Wait until {{name}} and its editor tabs are ready
    - click:
        role: button
        name: Info
        exact: true
      intent: An operator selects {{name}}'s Info tab
    - wait:
        fn: |-
          (() => {
            const root = document.querySelector('[data-testid=agent-editor-groups]');
            const info = Array.from(root?.querySelectorAll('button[draggable="true"]') || [])
              .find((button) => (button.textContent || '').trim() === 'Info');
            return info?.getAttribute('aria-current') === 'page' &&
              !!root?.querySelector('[role=tabpanel]:not([data-hidden])');
          })()
      intent: Wait until the Info tab is active
  complete-epic-run:
    steps:
    - api:
        method: POST
        path: "/api/workspaces/E2E-AF-${AFT_CASE_KEY}/issues"
        body:
          title: agent-flow epic $RUN_ID
          issue_type: epic
          priority: 2
        save:
        - from: data.id
          as: agentEpicId
      intent: An orchestration client creates the agent-flow epic at priority 2
    - api:
        method: POST
        path: "/api/workspaces/E2E-AF-${AFT_CASE_KEY}/issues"
        body:
          title: agent-flow task $RUN_ID
          issue_type: task
          priority: 2
          parent: "${var:agentEpicId}"
        save:
        - from: data.id
          as: agentTaskId
      intent: An orchestration client creates the child task under the agent-flow epic
    - open: "/ws/E2E-AF-${AFT_CASE_KEY}/kanban"
    - wait:
        fn: "!!document.querySelector('[data-testid=board-toolbar]')"
      intent: Wait until the workspace board is ready
    - wait:
        text: agent-flow task
    - api:
        method: POST
        path: "/api/workspaces/E2E-AF-${AFT_CASE_KEY}/workflows/epic-runner"
        body:
          epicId: "${var:agentEpicId}"
          runner: local-task-runner
        save:
        - from: run_id
          as: agentRunId
      intent: An orchestration client starts the local epic-runner workflow
    - run: for i in $(seq 1 40); do curl -sf "$AFT_BASE_URL/api/workspaces/E2E-AF-${AFT_CASE_KEY}/issues/$(cat "$AFT_WORK_DIR/agentTaskId")" | grep -q '"status":"closed"' && exit 0; sleep 2; done; echo "task never closed"; exit 1
      intent: Wait until the stub-backed task reaches closed state in the workspace API
