kind: graph-states
version: 1
flow: agent-flow
states:
  browser-ready:
    intent: A fresh graph path begins in the runner's blank browser page.
    assert:
    - use: blank-browser-ready
  nova-ready:
    intent: The nova Lead is selected and its controlled Codex process is visibly connected for every dependent path.
    assert:
    - use: controlled-codex-lead-connected
      with:
        name: nova
  scenario-1-created-agent-definition-appears-in-agents-page-:
    intent: created agent definition appears in agents page and monitor
    testIntent: An operator creates nova through CreateAgentModal, confirms its controlled Codex Lead terminal is connected, reviews it in the monitor, and refreshes its runtime-seeded archive log
    terminal: true
    assert:
    - wait:
        fn: "!!document.querySelector('[data-testid=agent-activity-panel]')"
      intent: Wait until the agent activity panel is ready
    - wait:
        fn: |-
          (() => {
            const panel = document.querySelector('[data-testid=agent-activity-panel]');
            return !!panel && !!panel.querySelector('[aria-label="Agent: nova"]');
          })()
      intent: Wait until nova appears as an exact row inside the monitor activity panel
    - expect:
        notText: No agents found
  scenario-2-epic-runner-drives-a-stub-agent-to-complete-a-ta:
    intent: the local task runner closes an epic task and records its session
    testIntent: An orchestration client triggers the epic-runner workflow so its local task-runner path closes the child task and records a session; this does not claim a named agent definition ran
    terminal: true
    assert:
    - wait:
        fn: '!Array.from(document.querySelectorAll("section[data-status=ready] article")).some((el) => el.textContent.includes(''agent-flow task''))'
      intent: Wait until the completed agent-flow task leaves the Ready column
    - expect:
        count:
          selector: section[data-status=ready] article[aria-label*='agent-flow task ${RUN_ID:-local}']
          equals: 0
  scenario-3-agent-diff-tab-opens-changed-file:
    intent: agent diff tab opens changed file
    testIntent: An agent change seeded through the runtime worktree flow appears to an operator in nova's Diff tab and opens as a per-file patch
    terminal: true
    assert:
    - wait:
        text: AFT-DIFF-MARKER
    - expect:
        text: AFT-DIFF-MARKER
  scenario-4-session-detail-transcript-and-diff-tabs-render:
    intent: session detail transcript and diff tabs render
    testIntent: A reviewer opens a completed task from the agent work panel, expanding its epic only when collapsed, and inspects the recorded transcript and unavailable-diff state in the Runs tab
    terminal: true
    assert:
    - expect:
        visible:
          testid: session-detail-view
  scenario-5-create-second-agent-from-modal-without-starting-:
    intent: create second agent from modal without starting it
    testIntent: An operator creates a second task agent through CreateAgentModal, deselects the preselected repo for workspace-wide scope, and verifies it exists without starting it
    terminal: true
    assert:
    - expect:
        url: "**/agents/iris-${RUN_ID:-local}**"
    - expect:
        visible:
          selector: "[aria-label='Agent: iris-${RUN_ID:-local}']"
    - wait:
        fn: |-
          (() => {
            const root = document.querySelector('[data-testid=agent-editor-groups]');
            const pane = Array.from(root?.querySelectorAll('[role=tabpanel]:not([data-hidden])') || [])
              .find((candidate) => !candidate.parentElement?.closest('[role=tabpanel]'));
            const text = (pane?.textContent || '').replace(/\s+/g, ' ').trim();
            const fieldValue = (label) => {
              const term = Array.from(pane?.querySelectorAll('dt') || [])
                .find((node) => (node.textContent || '').trim() === label);
              const value = term?.nextElementSibling;
              return value?.tagName === 'DD' ? (value.textContent || '').trim() : null;
            };
            return text.includes('iris-${RUN_ID:-local}') && text.includes('Task agent') &&
              fieldValue('Role') === 'Task' && fieldValue('Scope') === '—';
          })()
      intent: Confirm Info shows iris as a Task agent with the product's workspace-wide Scope dash
    - wait:
        fn: |-
          (async () => {
            const response = await fetch('/api/workspaces/E2E-AF-${AFT_CASE_KEY}/agents', { cache: 'no-store' });
            if (!response.ok) return false;
            const payload = await response.json();
            const data = payload.data ?? payload;
            const agents = Array.isArray(data) ? data : (data.agents || []);
            const iris = agents.find((agent) => agent.name === 'iris-${RUN_ID:-local}');
            return iris?.role_name === 'task' && iris.auto !== true &&
              iris.cross_repo === true && (iris.repos || []).length === 0;
          })()
      intent: Confirm the persisted iris definition is a non-auto-starting workspace-scope Task worker
  completion-epic-run-ready:
    intent: The standalone stub-backed epic run completed inside this path.
    assert:
    - expect:
        visible:
          testid: board-toolbar
  session-epic-run-ready:
    intent: The session-detail path created its own completed epic, task, run, and session identifiers.
    assert:
    - expect:
        visible:
          testid: board-toolbar
