    run-scenario-7-task-runner-with-no-designed-ready-work-: scenario-7-task-runner-with-no-designed-ready-work-exits-id
    run-scenario-8-task-runner-source-repo-scope-filters-re: scenario-8-task-runner-source-repo-scope-filters-ready-work
    run-scenario-9-task-runner-logs-tab-shows-archive-mode-: scenario-9-task-runner-logs-tab-shows-archive-mode-and-seed
    run-scenario-10-task-runner-appears-on-every-agent-surfa: scenario-10-task-runner-info-ready
    run-scenario-11-quarantined-task-renders-the-visible-qua: scenario-11-quarantined-task-renders-the-visible-quarantine-
  task-runner-dialog-open:
    choose-task-runner-template: task-runner-template-selected
  task-runner-template-selected:
    run-scenario-1-task-runner-modal-creates-a-single-repo-: scenario-1-task-runner-modal-creates-a-single-repo-worker-w
    run-scenario-2-task-runner-modal-creates-a-workspace-sc: scenario-2-task-runner-modal-creates-a-workspace-scope-work
    run-scenario-3-task-runner-backend-dropdown-selection-i: scenario-3-task-runner-backend-dropdown-selection-is-honore
    run-scenario-4-task-runner-name-validation-blocks-inval: scenario-4-task-runner-name-validation-blocks-invalid-names
    run-scenario-5-duplicate-task-runner-name-stays-in-the-: scenario-5-duplicate-task-runner-name-stays-in-the-dialog-w
  scenario-10-task-runner-info-ready:
