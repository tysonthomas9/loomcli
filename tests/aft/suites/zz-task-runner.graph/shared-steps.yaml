kind: graph-steps
version: 1
flow: task-runner
blocks:
  expect-browser-url:
    params:
    - url
    steps:
    - expect:
        url: "{{url}}"
  blank-browser-ready:
    steps:
    - use: expect-browser-url
      with:
        url: about:blank
  open-agents-page:
    params: []
    steps:
    - open: "/ws/E2E-TR-${AFT_CASE_KEY}/agents"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the Task Runner workspace agents page is ready
  open-create-agent-dialog:
    params: []
    steps:
    - use: open-agents-page
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open
  choose-task-template:
    steps:
    - click:
        testid: create-agent-template-task
  show-task-agent-info:
    params:
    - name
    steps:
    - open: "/ws/E2E-TR-${AFT_CASE_KEY}/agents/{{name}}"
      intent: An operator opens {{name}} so its Task agent definition is the review subject
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const card = document.querySelector("[aria-label='Agent: {{name}}']");
            const root = document.querySelector('[data-testid=agent-editor-groups]');
            const info = Array.from(root?.querySelectorAll('button[draggable="true"]') || [])
              .find((button) => (button.textContent || '').trim() === 'Info');
            const ready = location.pathname.endsWith('/agents/{{name}}') && page && card && root && info;
            const sig = [location.pathname, !!card, !!root, !!info].join('|');
            if (!ready) {
              window.__aftTaskInfoReadySig = null;
              window.__aftTaskInfoReadyAt = 0;
              return false;
            }
            if (window.__aftTaskInfoReadySig !== sig) {
              window.__aftTaskInfoReadySig = sig;
              window.__aftTaskInfoReadyAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftTaskInfoReadyAt >= 300;
          })()
      intent: Wait until {{name}} and its editor tabs are ready
    - click:
        role: button
        name: Info
        exact: true
      intent: An operator selects {{name}}'s Info tab
    - wait:
        fn: |-
          (() => {
            const root = document.querySelector('[data-testid=agent-editor-groups]');
            const info = Array.from(root?.querySelectorAll('button[draggable="true"]') || [])
              .find((button) => (button.textContent || '').trim() === 'Info');
            return info?.getAttribute('aria-current') === 'page' &&
              !!root?.querySelector('[role=tabpanel]:not([data-hidden])');
          })()
      intent: Wait until the Info tab is active
  task-agent-info-ready:
    params:
    - name
    - backend
    - scope
    steps:
    - expect:
        url: "**/agents/{{name}}**"
    - expect:
        visible:
          selector: "[aria-label='Agent: {{name}}']"
    - wait:
        fn: |-
          (() => {
            const root = document.querySelector('[data-testid=agent-editor-groups]');
            if (!root) return false;
            const labels = Array.from(root.querySelectorAll('button[draggable="true"]'))
              .map((button) => (button.textContent || '').trim()).filter(Boolean);
            const pane = Array.from(root.querySelectorAll('[role=tabpanel]:not([data-hidden])'))
              .find((candidate) => !candidate.parentElement?.closest('[role=tabpanel]'));
            const text = (pane?.textContent || '').replace(/\s+/g, ' ').trim();
            const fieldValue = (label) => {
              const term = Array.from(pane?.querySelectorAll('dt') || [])
                .find((node) => (node.textContent || '').trim() === label);
              const value = term?.nextElementSibling;
              return value?.tagName === 'DD' ? (value.textContent || '').trim() : null;
            };
            const expectedScopeLabel = '{{scope}}' === 'All repos' ? '—' : '{{scope}}';
            return JSON.stringify(labels) === JSON.stringify(["Terminal", "Info", "Git", "Logs", "Diff", "Files"]) &&
              text.includes('{{name}}') && text.includes('Task agent') &&
              fieldValue('Role') === 'Task' && fieldValue('Scope') === expectedScopeLabel;
          })()
      intent: Confirm the selected Info pane presents {{name}} as a Task agent with the expected human-readable scope
    - wait:
        fn: |-
          (async () => {
            const response = await fetch('/api/workspaces/E2E-TR-${AFT_CASE_KEY}/agents', { cache: 'no-store' });
            if (!response.ok) return false;
            const payload = await response.json();
            const data = payload.data ?? payload;
            const agents = Array.isArray(data) ? data : (data.agents || []);
            const matches = agents.filter((agent) => agent.name === '{{name}}');
            if (matches.length !== 1) return false;
            const worker = matches[0];
            const workspaceScope = '{{scope}}' === 'All repos';
            return worker.role_name === 'task' && worker.backend === '{{backend}}' &&
              worker.auto !== true && (workspaceScope ? worker.cross_repo === true : worker.cross_repo !== true) &&
              (workspaceScope
                ? (worker.repos || []).length === 0
                : (worker.repos || []).length === 1 && worker.repos[0] === '{{scope}}');
          })()
      intent: Confirm storage has exactly one non-auto-starting Task worker with the reviewed backend and exact scope
