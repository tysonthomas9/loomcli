kind: graph-states
version: 1
flow: task-runner
states:
  browser-ready:
    intent: A fresh graph path begins in the runner's blank browser page.
    assert:
    - use: blank-browser-ready
  task-runner-dialog-open:
    intent: The agent creation dialog exposes the Task Runner template.
    assert:
    - expect:
        visible:
          testid: create-agent-template-task
  task-runner-template-selected:
    intent: The Task Runner template is selected and its form is ready.
    assert:
    - expect:
        visible:
          testid: create-agent-name
  scenario-1-task-runner-modal-creates-a-single-repo-worker-w:
    intent: task runner modal creates a single-repo worker with a worktree
    testIntent: An operator creates a Task Runner scoped to one repo through CreateAgentModal and verifies the stored agent plus materialized worktree
    terminal: true
    assert:
    - use: task-agent-info-ready
      with:
        name: worker-modal-a-${RUN_ID:-local}
        backend: codex
        scope: task-repo-a
    - wait:
        fn: |-
          (async () => {
            const response = await fetch('/api/workspaces/E2E-TR-${AFT_CASE_KEY}/files/checkouts', { cache: 'no-store' });
            if (!response.ok) return false;
            const payload = await response.json();
            const data = payload.data ?? payload;
            const matches = (data.checkouts || []).filter((checkout) =>
              checkout.kind === 'agent' && checkout.agent === 'worker-modal-a-${RUN_ID:-local}');
            return matches.length === 1 && matches[0].repo === 'task-repo-a' &&
              matches[0].exists === true && matches[0].branch === 'worker-modal-a-${RUN_ID:-local}' &&
              matches[0].status_error !== true;
          })()
      intent: Confirm the public checkout inventory exposes the reviewed Task agent's exact repo and branch
  scenario-2-task-runner-modal-creates-a-workspace-scope-work:
    intent: task runner modal creates a workspace-scope worker in every repo
    testIntent: An operator deselects every repo chip so a Task Runner takes workspace-wide scope and gets a worktree for every repo
    terminal: true
    assert:
    - use: task-agent-info-ready
      with:
        name: worker-cross-${RUN_ID:-local}
        backend: codex
        scope: All repos
    - wait:
        fn: |-
          (async () => {
            const response = await fetch('/api/workspaces/E2E-TR-${AFT_CASE_KEY}/files/checkouts', { cache: 'no-store' });
            if (!response.ok) return false;
            const payload = await response.json();
            const data = payload.data ?? payload;
            const matches = (data.checkouts || []).filter((checkout) =>
              checkout.kind === 'agent' && checkout.agent === 'worker-cross-${RUN_ID:-local}');
            const repos = matches.map((checkout) => checkout.repo).sort();
            return JSON.stringify(repos) === JSON.stringify(['task-repo-a', 'task-repo-b']) &&
              matches.every((checkout) => checkout.exists === true &&
                checkout.branch === 'worker-cross-${RUN_ID:-local}' && checkout.status_error !== true);
          })()
      intent: Confirm the public checkout inventory exposes one exact-branch worktree for each repo
  scenario-3-task-runner-backend-dropdown-selection-is-honore:
    intent: task runner backend dropdown selection is honored
    testIntent: An operator selects a non-default backend for a Task Runner and verifies that backend is stored on the agent
    terminal: true
    assert:
    - use: task-agent-info-ready
      with:
        name: worker-claude-${RUN_ID:-local}
        backend: claude
        scope: task-repo-a
  scenario-4-task-runner-name-validation-blocks-invalid-names:
    intent: task runner name validation blocks invalid names and lowercases valid names
    testIntent: An operator cannot submit invalid Task Runner names and sees a valid uppercase entry normalized to lowercase storage
    terminal: true
    assert:
    - use: task-agent-info-ready
      with:
        name: worker-b-${RUN_ID:-local}
        backend: codex
        scope: task-repo-a
  scenario-5-duplicate-task-runner-name-stays-in-the-dialog-w:
    intent: duplicate task runner name stays in the dialog with a conflict
    testIntent: An operator reusing an existing Task Runner name sees the server conflict in the dialog and no second agent is created
    terminal: true
    assert:
    - wait:
        fn: document.querySelector('[data-testid=create-agent-error]')?.textContent.includes('An agent with this name already exists.')
      intent: Confirm the duplicate-name conflict is visible in the Task Runner form
    - expect:
        visible:
          testid: create-agent-error
    - expect:
        visible:
          testid: create-agent-overlay
    - expect:
        value:
          testid: create-agent-name
          equals: worker-a-${RUN_ID:-local}
    - wait:
        fn: |-
          (async () => {
            const response = await fetch('/api/workspaces/E2E-TR-${AFT_CASE_KEY}/agents', { cache: 'no-store' });
            if (!response.ok) return false;
            const payload = await response.json();
            const data = payload.data ?? payload;
            const agents = Array.isArray(data) ? data : (data.agents || []);
            return agents.filter((agent) => agent.name === 'worker-a-${RUN_ID:-local}').length === 1;
          })()
      intent: Confirm the rejected duplicate left exactly one worker definition
  scenario-6-delegation-records-control-plane-state:
    intent: delegation records assignment and requested running state in the control plane
    testIntent: An operator delegates a designed task and verifies the issue and agent projections changed; no daemon or worker-process execution is asserted
    terminal: true
    assert:
    - wait:
        fn: '!Array.from(document.querySelectorAll("section[data-status=ready] article")).some((el) => el.textContent.includes(''task-runner delegation ${RUN_ID:-local}'')) && Array.from(document.querySelectorAll("section[data-status=in_progress] article")).some((el) => el.textContent.includes(''task-runner delegation ${RUN_ID:-local}''))'
      intent: Wait until the board moves the delegated issue from Ready to In Progress
    - expect:
        count:
          selector: section[data-status=ready] article[aria-label*='task-runner delegation ${RUN_ID:-local}']
          equals: 0
  scenario-7-task-runner-with-no-designed-ready-work-exits-id:
    intent: task runner with no designed ready work exits idle without a session
    testIntent: A Task Runner started when only a designless open task exists reports no work and leaves that task untouched
    terminal: true
    assert:
    - expect:
        text: idle-${RUN_ID:-local}
  scenario-8-task-runner-source-repo-scope-filters-ready-work:
    intent: task runner source-repo scope filters ready work
    testIntent: A Task Runner scoped to repo B ignores designed work attributed to repo A, and the positive control proves that repo A work was available
    terminal: true
    assert:
    - expect:
        text: scoped-${RUN_ID:-local}
  scenario-9-task-runner-logs-tab-shows-archive-mode-and-seed:
    intent: task runner logs tab shows archive mode and seeded content
    testIntent: An operator opens a Task Runner Logs tab, sees the empty archive state, then refreshes runtime-seeded archive content
    terminal: true
    assert:
    - wait:
        text: AFT-TASK-LOG-MARKER
    - expect:
        visible:
          testid: terminal-container
    - expect:
        attr:
          testid: log-status
          name: data-state
          equals: connected
    - expect:
        text: ARCHIVE SNAPSHOT
  scenario-10-task-runner-appears-on-every-agent-surface-with-:
    intent: monitor presents the stored Task Runner as a background agent
    testIntent: An operator reviews worker-a first in its Info view and then in the warmed monitor projection; neither surface is treated as proof of a live worker process
    terminal: true
    assert:
    - wait:
        fn: |-
          (() => {
            const panel = document.querySelector('[data-testid=agent-activity-panel]');
            return !!panel && !!panel.querySelector('[aria-label="Agent: worker-a-${RUN_ID:-local}"]');
          })()
      intent: Wait until the exact Task Runner row appears inside the monitor activity panel
    - expect:
        notText: No agents found
  scenario-10-task-runner-info-ready:
    intent: worker-a's Info view shows its stored Task role and single-repo scope without implying terminal health.
    assert:
    - use: task-agent-info-ready
      with:
        name: worker-a-${RUN_ID:-local}
        backend: codex
        scope: task-repo-a
    - wait:
        fn: document.querySelector('[data-testid=agent-section-background]')?.textContent.includes('worker-a-${RUN_ID:-local}')
      intent: Confirm the workspace tree classifies worker-a under Background agents
  scenario-11-quarantined-task-renders-the-visible-quarantine-:
    intent: an API-seeded quarantined task renders the visible quarantine badge
    testIntent: An operator sees the board presentation for an issue seeded with blocked status and the quarantine label; this does not assert a daemon produced that state
    terminal: true
    assert:
    - wait:
        fn: Array.from(document.querySelectorAll("section[data-status=blocked] article")).some((el) => el.textContent.includes('task-runner quarantine ${RUN_ID:-local}'))
      intent: Wait until the quarantined task appears in the Blocked column
    - expect:
        count:
          selector: section[data-status=blocked] article[aria-label*='task-runner quarantine ${RUN_ID:-local}']
          equals: 1
    - expect:
        visible:
          selector: section[data-status=blocked] article[aria-label*='task-runner quarantine ${RUN_ID:-local}'] [aria-label='Task quarantined']
    - expect:
        attr:
          selector: section[data-status=blocked] article[aria-label*='task-runner quarantine ${RUN_ID:-local}'] [aria-label='Task quarantined']
          name: title
          equals: Task quarantined by daemon after repeated no-progress kills — see comment for the kill timeline
    - expect:
        text: Quarantined
