  run-scenario-10-task-runner-appears-on-every-agent-surfa:
    intent: An operator opens the existing Task Runner's Info view and reviews its background-worker identity across the detail route, rail, and workspace tree
    actor: human
    via: ui
    steps:
    - use: show-task-agent-info
      with:
        name: worker-a-${RUN_ID:-local}
  review-scenario-10-task-runner-in-monitor:
    intent: An operator opens the monitor only after its status projection contains worker-a; the monitor row is presentation evidence, not proof of a live worker process
    actor: human
    via: ui
    steps:
    - run: |
        set -e
        name="worker-a-${RUN_ID:-local}"
        # budget: monitor-cache (16s) - warm the projection before opening the review surface.
        for i in $(seq 1 16); do
          curl -sf "$AFT_BASE_URL/api/monitor/status?workspace=E2E-TR-${AFT_CASE_KEY}" > "$AFT_WORK_DIR/tsk-d17-monitor.json" &&
          python3 - "$AFT_WORK_DIR/tsk-d17-monitor.json" "$name" <<'PY' && exit 0
        import json, sys
        d = json.load(open(sys.argv[1]))
        matches = [a for a in d.get("agents", []) if a.get("name") == sys.argv[2]]
        assert len(matches) == 1, d.get("agents")
        assert matches[0].get("role") == "task", matches[0]
        PY
          sleep 1
        done
        echo "monitor status never exposed worker-a"
        cat "$AFT_WORK_DIR/tsk-d17-monitor.json" 2>/dev/null || true
        exit 1
      intent: Warm the monitor projection and confirm it classifies worker-a as a Task agent
    - open: "/ws/E2E-TR-${AFT_CASE_KEY}/monitor"
      intent: An operator opens the monitor after its worker projection is ready
    - wait:
        fn: "!!document.querySelector('[data-testid=agent-activity-panel]')"
      intent: Wait until the task workspace monitor activity panel is mounted
  run-scenario-11-quarantined-task-renders-the-visible-qua:
    intent: An operator sees the board badge for a task whose blocked status and quarantine label were seeded through the API; no daemon execution is claimed
    actor: human
    via: ui
    steps:
    - api:
        method: POST
        path: "/api/workspaces/E2E-TR-${AFT_CASE_KEY}/issues"
        body:
          title: task-runner quarantine ${RUN_ID:-local}
          issue_type: task
          priority: 2
          assignee: ''
          labels:
          - loom:quarantined
        save:
        - from: data.id
          as: tskD18IssueId
      intent: An API client creates the quarantine presentation fixture with the quarantine label
    - api:
        method: PATCH
        path: "/api/workspaces/E2E-TR-${AFT_CASE_KEY}/issues/${var:tskD18IssueId}"
        body:
          status: blocked
      intent: An API client seeds the blocked status required for the quarantine badge because create rejects blocked status
    - open: "/ws/E2E-TR-${AFT_CASE_KEY}/kanban"
    - wait:
        fn: "!!document.querySelector('[data-testid=board-toolbar]')"
      intent: Wait until the workspace board is ready
    - fill:
        testid: search-input-field
        value: task-runner quarantine ${RUN_ID:-local}
