kind: graph-transitions
version: 1
flow: task-runner
group: zz-task-runner
transitions:
  open-task-runner-dialog:
    intent: An operator opens the Task Runner creation dialog.
    actor: human
    via: ui
    steps:
    - use: open-create-agent-dialog
  choose-task-runner-template:
    intent: An operator selects the Task Runner template.
    actor: human
    via: ui
    steps:
    - use: choose-task-template
  run-scenario-1-task-runner-modal-creates-a-single-repo-:
    intent: An operator creates a Task Runner scoped to one repo through CreateAgentModal and verifies the stored agent plus materialized worktree
    actor: human
    via: ui
    steps:
    - fill:
        testid: create-agent-name
        value: worker-modal-a-${RUN_ID:-local}
    - click:
        testid: create-agent-submit
      intent: An operator submits the single-repo Task Runner form
    - use: show-task-agent-info
      with:
        name: worker-modal-a-${RUN_ID:-local}
  run-scenario-2-task-runner-modal-creates-a-workspace-sc:
    intent: An operator deselects every repo chip so a Task Runner takes workspace-wide scope and gets a worktree for every repo
    actor: human
    via: ui
    steps:
    - fill:
        testid: create-agent-name
        value: worker-cross-${RUN_ID:-local}
    - click:
        selector: "[data-testid='create-agent-repo-chips'] button:first-of-type"
    - wait:
        fn: |-
          (() => {
            const chip = document.querySelector("[data-testid='create-agent-repo-chips'] button:first-of-type");
            return chip?.getAttribute('aria-pressed') === 'false' &&
              document.body.textContent.includes('No repo selected') &&
              document.body.textContent.includes('workspace-wide scope');
          })()
      intent: Wait until the first repo chip is deselected and the workspace-scope hint renders
    - expect:
        attr:
          selector: "[data-testid='create-agent-repo-chips'] button:first-of-type"
          name: aria-pressed
          equals: 'false'
    - click:
        testid: create-agent-submit
      intent: An operator submits the workspace-scope Task Runner form
    - use: show-task-agent-info
      with:
        name: worker-cross-${RUN_ID:-local}
  run-scenario-3-task-runner-backend-dropdown-selection-i:
    intent: An operator selects a non-default backend for a Task Runner and verifies that backend is stored on the agent
    actor: human
    via: ui
    steps:
    - fill:
        testid: create-agent-name
        value: worker-claude-${RUN_ID:-local}
    - wait:
        fn: |-
          (() => {
            const select = document.querySelector('[data-testid=create-agent-backend]');
            if (!select) return false;
            const values = Array.from(select.options).map((o) => o.value);
            return select.value === 'codex' &&
              ['codex', 'claude', 'cursor', 'opencode'].every((v) => values.includes(v));
          })()
      intent: Wait until backend options load before selecting the non-default backend
    - expect:
        value:
          testid: create-agent-backend
          equals: codex
    - select:
        testid: create-agent-backend
        value: claude
    - click:
        testid: create-agent-submit
      intent: An operator submits the Task Runner with the selected Claude backend
    - use: show-task-agent-info
      with:
        name: worker-claude-${RUN_ID:-local}
  run-scenario-4-task-runner-name-validation-blocks-inval:
    intent: An operator cannot submit invalid Task Runner names and sees a valid uppercase entry normalized to lowercase storage
    actor: human
    via: ui
    steps:
    - expect:
        enabled:
          testid: create-agent-submit
          equals: false
    - fill:
        testid: create-agent-name
        value: Worker One
    - expect:
        enabled:
          testid: create-agent-submit
          equals: false
    - fill:
        testid: create-agent-name
        value: "-leading"
    - expect:
        enabled:
          testid: create-agent-submit
          equals: false
    - fill:
        testid: create-agent-name
        value: WORKER-B-${RUN_ID:-local}
    - expect:
        enabled:
          testid: create-agent-submit
          equals: true
    - click:
        testid: create-agent-submit
      intent: An operator submits the valid uppercase name for normalization
    - use: show-task-agent-info
      with:
        name: worker-b-${RUN_ID:-local}
  run-scenario-5-duplicate-task-runner-name-stays-in-the-:
    intent: An operator reusing an existing Task Runner name sees the server conflict in the dialog and no second agent is created
    actor: human
    via: ui
    steps:
    - fill:
        testid: create-agent-name
        value: worker-a-${RUN_ID:-local}
    - click:
        testid: create-agent-submit
    - wait:
        fn: document.querySelector('[data-testid=create-agent-error]')?.textContent.includes('An agent with this name already exists.')
      intent: Wait until the duplicate-name conflict is rendered in the modal
  run-scenario-6-delegation-records-control-plane-state:
    intent: An operator delegates an open designed task and verifies the resulting issue and requested-agent lifecycle projections without claiming a daemon or worker process ran
    actor: human
    via: ui
    steps:
    - api:
        method: POST
        path: "/api/workspaces/E2E-TR-${AFT_CASE_KEY}/issues"
        body:
          title: task-runner delegation ${RUN_ID:-local}
          issue_type: task
          priority: 2
          design: AFT delegation design ${RUN_ID:-local}
        save:
        - from: data.id
          as: tskD7IssueId
      intent: An API client creates a designed task that a Task Runner can be assigned to
    - open: "/ws/E2E-TR-${AFT_CASE_KEY}/kanban"
    - wait:
        fn: "!!document.querySelector('[data-testid=board-toolbar]')"
      intent: Wait until the workspace board is ready
    - wait:
        fn: Array.from(document.querySelectorAll("section[data-status=ready] article")).some((el) => el.textContent.includes('task-runner delegation ${RUN_ID:-local}'))
      intent: Wait until the delegation task appears in Ready before assignment
    - click:
        selector: section[data-status=ready] article[aria-label*='task-runner delegation ${RUN_ID:-local}']
        first: true
    - wait:
        fn: document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-state') === 'open'
      intent: Wait until the delegation issue detail panel opens
    - run: |
        set -e
        run="${RUN_ID:-local}"
        # budget: ui-click-retry (3s) - popover mount can lag the trigger click.
        for i in 1 2 3; do
          agent-browser --session "$AFT_SESSION" find testid assignee-dropdown-trigger click || true
          sleep 1
          if agent-browser --session "$AFT_SESSION" eval "
            !!document.querySelector('[data-testid=assignee-dropdown-menu]') &&
            !!document.querySelector('[data-testid=\"agent-assignee-worker-a-$run\"]')
          " | grep -q true; then
            exit 0
          fi
        done
        echo "assignee dropdown never listed worker-a-$run"
        exit 1
      intent: Retry opening the assignee dropdown until it lists the UI-created Task Runner
    - click:
        testid: agent-assignee-worker-a-${RUN_ID:-local}
    - wait:
        fn: "!document.querySelector('[data-testid=assignee-saving]') && !document.querySelector('[data-testid=assignee-error]') && !document.querySelector('[data-testid=assignee-dropdown-menu]')"
      intent: Wait until assignment save and the requested lifecycle projection complete without an assignee error
    - run: |
        set -e
        run="${RUN_ID:-local}"
        task="$(cat "$AFT_WORK_DIR/tskD7IssueId")"
        # budget: db-persist (10s) - assignment and in-progress status persist through fleet-db.
        for i in $(seq 1 10); do
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-TR-${AFT_CASE_KEY}/issues/$task" > "$AFT_WORK_DIR/tsk-d7-issue.json" &&
          python3 - "$AFT_WORK_DIR/tsk-d7-issue.json" "worker-a-$run" <<'PY' && exit 0
        import json, sys
        d = json.load(open(sys.argv[1])).get("data") or {}
        assert d.get("assignee") == sys.argv[2], d
        assert d.get("status") == "in_progress", d
        PY
          sleep 1
        done
        echo "delegated issue never reached worker-a in_progress"
        cat "$AFT_WORK_DIR/tsk-d7-issue.json" 2>/dev/null || true
        exit 1
      intent: An operator polls the delegated issue until assignment and in-progress status persist
    - run: |
        set -e
        run="${RUN_ID:-local}"
        name="worker-a-$run"
        # budget: db-persist (10s) - lifecycle start updates state and desired_state.
        for i in $(seq 1 10); do
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-TR-${AFT_CASE_KEY}/agents" > "$AFT_WORK_DIR/tsk-d7-agents.json" &&
          python3 - "$AFT_WORK_DIR/tsk-d7-agents.json" "$name" <<'PY' && exit 0
        import json, sys
        d = json.load(open(sys.argv[1]))
        name = sys.argv[2]
        agents = d.get("data") if isinstance(d, dict) else []
        matches = [a for a in agents or [] if a.get("name") == name]
        assert len(matches) == 1, agents
        a = matches[0]
        assert a.get("state") == "active", a
        assert a.get("desired_state") == "running", a
        PY
          sleep 1
        done
        echo "worker-a lifecycle state never reached active/running"
        cat "$AFT_WORK_DIR/tsk-d7-agents.json" 2>/dev/null || true
        exit 1
      intent: An operator reads back the Task Runner's control-plane active/running request after delegation; this is not process-health evidence
  run-scenario-7-task-runner-with-no-designed-ready-work-:
    intent: A Task Runner started when only a designless open task exists reports no work and leaves that task untouched
    actor: human
    via: ui
    steps:
    - run: |
        set -e
        curl -sf "$AFT_BASE_URL/api/workspaces/E2E-TR-${AFT_CASE_KEY}/issues" > "$AFT_WORK_DIR/tsk-d10-pre-issues.json"
        python3 - "$AFT_WORK_DIR/tsk-d10-pre-issues.json" "$AFT_WORK_DIR/tsk-d10-designed-open.ids" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        items = d.get("data", d.get("issues", []))
        ids = []
        for issue in items or []:
            if issue.get("issue_type") == "task" and issue.get("status") == "open" and (issue.get("has_design") or issue.get("design")):
                ids.append(issue["id"])
        open(sys.argv[2], "w", encoding="utf-8").write("\n".join(ids))
        PY
        while read -r id; do
          [ -n "$id" ] || continue
          curl -sf -X PATCH "$AFT_BASE_URL/api/workspaces/E2E-TR-${AFT_CASE_KEY}/issues/$id" \
            -H "Content-Type: application/json" \
            -d '{"status":"closed"}' >/dev/null
        done < "$AFT_WORK_DIR/tsk-d10-designed-open.ids"
      intent: TSK-D10 constructs its own no-work pool by closing any prior open designed task before the idle run
    - api:
        method: POST
        path: "/api/workspaces/E2E-TR-${AFT_CASE_KEY}/issues"
        body:
          title: task-runner designless ${RUN_ID:-local}
          issue_type: task
          priority: 2
        save:
        - from: data.id
          as: tskD10IssueId
      intent: An API client creates an open task without a design to prove the has_design gate
    - open: "/ws/E2E-TR-${AFT_CASE_KEY}/agents"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the Task Runner workspace agents page is ready
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open
    - click:
        testid: create-agent-template-task
    - fill:
        testid: create-agent-name
        value: idle-${RUN_ID:-local}
    - click:
        testid: create-agent-submit
    - wait:
        fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('idle-${RUN_ID:-local}')"
      intent: Wait until the idle worker appears after submit
    - run: |
        set -e
        run="${RUN_ID:-local}"
        name="idle-$run"
        PATH="$AFT_TESTS_DIR/../../e2e/stubs:$PATH" \
        LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" \
        LOOM_SERVER_URL="$AFT_API_URL" \
        LOOM_WORKSPACE_ID=E2E-TR-${AFT_CASE_KEY} \
        "$AFT_LOOM_BIN" --workspace E2E-TR-${AFT_CASE_KEY} --backend codex task "$name" \
          > "$AFT_WORK_DIR/tsk-d10-task.out" 2>&1
        grep -F "No tasks available for implementation." "$AFT_WORK_DIR/tsk-d10-task.out"
        grep -F "Tasks must be: open status, has design, no needs-revision label, not epics" "$AFT_WORK_DIR/tsk-d10-task.out"
      intent: The local runtime starts the Task Runner in single-task mode and observes the no-work message
    - api:
        method: GET
        path: "/api/workspaces/E2E-TR-${AFT_CASE_KEY}/issues/${var:tskD10IssueId}"
        assert:
        - path: data.status
          equals: open
        - path: data.assignee
          exists: false
      intent: An operator reads back that the designless issue stayed open and unassigned
    - run: |
        set -e
        task="$(cat "$AFT_WORK_DIR/tskD10IssueId")"
        curl -sf "$AFT_BASE_URL/api/workspaces/E2E-TR-${AFT_CASE_KEY}/tasks/$task/sessions" > "$AFT_WORK_DIR/tsk-d10-sessions.json"
        python3 - "$AFT_WORK_DIR/tsk-d10-sessions.json" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        data = d.get("data") or {}
        sessions = data.get("sessions") if isinstance(data, dict) else data
        assert sessions == [], d
        PY
      intent: An operator confirms no session was recorded for the skipped designless task
    - run: |
        set -e
        run="${RUN_ID:-local}"
        name="idle-$run"
        curl -sf "$AFT_BASE_URL/api/workspaces/E2E-TR-${AFT_CASE_KEY}/agents" > "$AFT_WORK_DIR/tsk-d10-agents.json"
        python3 - "$AFT_WORK_DIR/tsk-d10-agents.json" "$name" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        name = sys.argv[2]
        agents = d.get("data") if isinstance(d, dict) else []
        matches = [a for a in agents or [] if a.get("name") == name]
        assert len(matches) == 1, agents
        a = matches[0]
        assert a.get("state", "idle") in ("", "idle"), a
        assert a.get("live_status", "idle") in ("", "idle"), a
        assert a.get("live_status") != "working", a
        PY
      intent: An operator reads back that the idle worker did not enter a working live status
  run-scenario-8-task-runner-source-repo-scope-filters-re:
    intent: A Task Runner scoped to repo B ignores designed work attributed to repo A, and the positive control proves that repo A work was available
    actor: human
    via: ui
    steps:
    - open: "/ws/E2E-TR-${AFT_CASE_KEY}/agents"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the Task Runner workspace agents page is ready
    - click:
        role: button
        name: "+ Add agent"
        exact: true
    - wait:
        fn: |-
          (() => {
            const overlay = document.querySelector('[data-testid=create-agent-overlay]');
            if (overlay) {
              window.__aftCreateAgentOverlayWaitStartedAt = 0;
              return true;
            }
            if (!window.__aftCreateAgentOverlayWaitStartedAt) {
              window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
            }
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
              throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
            }
            return false;
          })()
      intent: Wait until the agent creation dialog is open
    - click:
        testid: create-agent-template-task
    - fill:
        testid: create-agent-name
        value: scoped-${RUN_ID:-local}
    - click:
        selector: "[data-testid='create-agent-repo-chips'] button:first-of-type"
    - click:
        selector: "[data-testid='create-agent-repo-chips'] button:nth-of-type(2)"
    - click:
        testid: create-agent-submit
    - wait:
        fn: "!document.querySelector('[data-testid=create-agent-overlay]') && document.body.textContent.includes('scoped-${RUN_ID:-local}')"
      intent: Wait until the repo-B-scoped worker appears after submit
    - run: |
        set -e
        run="${RUN_ID:-local}"
        name="scoped-$run"
        repo_b="$(cat "$AFT_WORK_DIR/task-repo-b.name")"
        curl -sf "$AFT_BASE_URL/api/workspaces/E2E-TR-${AFT_CASE_KEY}/agents" > "$AFT_WORK_DIR/tsk-d13-agents.json"
        python3 - "$AFT_WORK_DIR/tsk-d13-agents.json" "$name" "$repo_b" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        name, repo_b = sys.argv[2], sys.argv[3]
        agents = d.get("data") if isinstance(d, dict) else []
        matches = [a for a in agents or [] if a.get("name") == name]
        assert len(matches) == 1, agents
        a = matches[0]
        assert not a.get("cross_repo"), a
        assert a.get("repos") == [repo_b], a
        PY
      intent: An operator reads back that the scoped worker stores only repo B
    - run: |
        set -e
        run="${RUN_ID:-local}"
        repo_a_source="$(cat "$AFT_WORK_DIR/task-repo-a.source")"
        python3 - "$run" "$repo_a_source" > "$AFT_WORK_DIR/tsk-d13-issue.json" <<'PY'
        import json, sys
        run, repo = sys.argv[1], sys.argv[2]
        print(json.dumps({
            "title": f"task-runner repo-scope {run}",
            "issue_type": "task",
            "priority": 2,
            "design": f"AFT repo-scope design {run}",
            "source_repo": repo,
        }))
        PY
        curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-TR-${AFT_CASE_KEY}/issues" \
          -H "Content-Type: application/json" \
          -d @"$AFT_WORK_DIR/tsk-d13-issue.json" \
          > "$AFT_WORK_DIR/tsk-d13-issue.resp.json"
        python3 - "$AFT_WORK_DIR/tsk-d13-issue.resp.json" > "$AFT_WORK_DIR/tskD13IssueId" <<'PY'
        import json, sys
        print(json.load(open(sys.argv[1]))["data"]["id"])
        PY
      intent: An API client creates a designed task attributed to repo A
    - run: |
        set -e
        run="${RUN_ID:-local}"
        name="scoped-$run"
        repo_b_source="$(cat "$AFT_WORK_DIR/task-repo-b.source")"
        PATH="$AFT_TESTS_DIR/../../e2e/stubs:$PATH" \
        LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" \
        LOOM_SERVER_URL="$AFT_API_URL" \
        LOOM_WORKSPACE_ID=E2E-TR-${AFT_CASE_KEY} \
        LOOM_SOURCE_REPOS="$repo_b_source" \
        "$AFT_LOOM_BIN" --workspace E2E-TR-${AFT_CASE_KEY} --backend codex task "$name" \
          > "$AFT_WORK_DIR/tsk-d13-repo-b.out" 2>&1
        grep -F "No tasks available for implementation." "$AFT_WORK_DIR/tsk-d13-repo-b.out"
      intent: The local runtime starts the repo-B-scoped Task Runner and verifies repo-A work is filtered out
    - run: |
        set -e
        run="${RUN_ID:-local}"
        name="scoped-$run"
        repo_a_source="$(cat "$AFT_WORK_DIR/task-repo-a.source")"
        PATH="$AFT_TESTS_DIR/../../e2e/stubs:$PATH" \
        LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" \
        LOOM_SERVER_URL="$AFT_API_URL" \
        LOOM_WORKSPACE_ID=E2E-TR-${AFT_CASE_KEY} \
        LOOM_SOURCE_REPOS="$repo_a_source" \
        "$AFT_LOOM_BIN" --workspace E2E-TR-${AFT_CASE_KEY} --backend codex task "$name" \
          > "$AFT_WORK_DIR/tsk-d13-repo-a.out" 2>&1
        grep -F "Running IMPLEMENTATION agent in:" "$AFT_WORK_DIR/tsk-d13-repo-a.out"
        if grep -F "No tasks available for implementation." "$AFT_WORK_DIR/tsk-d13-repo-a.out"; then
          echo "repo A control unexpectedly reported no work"
          exit 1
        fi
      intent: The local runtime reruns with repo A scope and proves the same designed task passes the availability gate
  run-scenario-9-task-runner-logs-tab-shows-archive-mode-:
    intent: An operator opens a Task Runner Logs tab, sees the empty archive state, then refreshes runtime-seeded archive content
    actor: human
    via: ui
    steps:
    - open: "/ws/E2E-TR-${AFT_CASE_KEY}/agents/worker-a-${RUN_ID:-local}"
    - wait:
        fn: |-
          (() => {
            const page = document.querySelector('[data-testid=agents-page]');
            const add = Array.from(document.querySelectorAll('button'))
              .some((b) => (b.textContent || '').trim() === '+ Add agent');
            const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
            const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
            const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
            if (!page || !settled) {
              window.__aftAgentsPageStableSig = null;
              window.__aftAgentsPageStableAt = 0;
              return false;
            }
            if (window.__aftAgentsPageStableSig !== sig) {
              window.__aftAgentsPageStableSig = sig;
              window.__aftAgentsPageStableAt = Date.now();
              return false;
            }
            return Date.now() - window.__aftAgentsPageStableAt >= 300;
          })()
      intent: Wait until the worker-a agent detail page is ready
    - click:
        role: button
        name: Logs
        exact: true
