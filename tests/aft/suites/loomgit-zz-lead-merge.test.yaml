suite: loomgit-zz-lead-merge
classification: { area: reviews, feature: lead-merge, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: >-
  for c in queue green later deps; do bash "$AFT_TESTS_DIR/scripts/loomgit-lead-merge.sh" teardown "$c" || true; done
tests:
  - name: The lead queues a whole-stack merge with Lead may merge on
    intent: With Lead may merge off the lead's loom merge is refused with "Lead may merge is off" and nothing is queued; once a human turns it on, one loom merge queues the whole stack, the Pull Requests page shows it, and it lands bottom up when checks pass (AFT-G2)
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-lead-merge.sh" setup queue
        intent: Create a disposable repository and workspace through the product API
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-lead-merge.sh" run queue
        intent: Publish a native stack from real TaskRuns, see the lead's loom merge refused while Lead may merge is off, turn it on, queue the merge, see it on the Pull Requests page and watch it land
  - name: when_green merges after required checks pass and stops below changes requested
    intent: A human turns auto-merge on with loom git-settings; Reconcile merges only layers whose provider checks and reviews pass
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-lead-merge.sh" setup green
        intent: Create a disposable repository and workspace through the product API
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-lead-merge.sh" run green
        intent: Hold on a pending required check and a changes-requested review, then merge each layer once the provider shows it green
  - name: Loom backend merges up to B and later merges C
    intent: A human presses Merge up to here on B's PR (the button's API), then again on C's after B has landed
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-lead-merge.sh" setup later
        intent: Create a disposable repository and workspace through the product API
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-lead-merge.sh" run later
        intent: Merge the Loom stack in two rounds and require C on trunk after the second
  - name: cross-repo dependency holds loom/dependencies until its predecessor lands
    intent: An app task blocked by an api task keeps a pending loom/dependencies status, and does not merge, until the api PR lands on its trunk
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-lead-merge.sh" setup deps
        intent: Create two disposable repositories in one workspace through the product API
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-lead-merge.sh" run deps
        intent: Publish both changes, see pending loom/dependencies and a refused or held app merge, land the api PR, then see success and the app PR merge
