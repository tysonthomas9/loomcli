# Search filters the board, syncs to ?search= on the workspace route, and
# survives a reload (URL is the source of truth for filter state). The v5
# board toolbar has no group-by control, so this suite covers search only.
suite: filters
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: '"$AFT_TESTS_DIR/scripts/close-open-issues.sh"'

tests:
  - name: search filters the board and survives a reload
    intent: Typing in the board search narrows the kanban to matching issues, is reflected in the URL, and persists across a reload
    steps:
      - open: /ws/E2E-WS/kanban
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues" -H "Content-Type: application/json"
          -d "{\"title\":\"alpha $RUN_ID\",\"issue_type\":\"task\",\"priority\":1}" >/dev/null
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues" -H "Content-Type: application/json"
          -d "{\"title\":\"beta $RUN_ID\",\"issue_type\":\"task\",\"priority\":3}" >/dev/null
      - wait:
          fn: >-
            document.querySelectorAll('section[data-status=ready] article').length === 2
      - fill: { testid: search-input-field, value: alpha }
      - wait: { url: "**search=alpha**" }
      - expect: { count: { selector: "section[data-status=ready] article", equals: 1 } }
      - reload: true
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - expect: { url: "**search=alpha**" }
      - expect: { count: { selector: "section[data-status=ready] article", equals: 1 } }
      - expect: { value: { testid: search-input-field, equals: alpha } }

  # covers: LCLI-DV-004
  - name: deep link applies search priority type and label filters on load
    intent: URL filter params are parsed on first load and narrow the board before user interaction
    steps:
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues" -H "Content-Type: application/json"
          -d "{\"title\":\"filters-deeplink-${RUN_ID:-local}-match\",\"issue_type\":\"bug\",\"priority\":1,\"labels\":[\"aft-filter-${RUN_ID:-local}\"]}" >/dev/null
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues" -H "Content-Type: application/json"
          -d "{\"title\":\"filters-deeplink-${RUN_ID:-local}-wrong-priority\",\"issue_type\":\"bug\",\"priority\":2,\"labels\":[\"aft-filter-${RUN_ID:-local}\"]}" >/dev/null
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues" -H "Content-Type: application/json"
          -d "{\"title\":\"filters-deeplink-${RUN_ID:-local}-wrong-type\",\"issue_type\":\"task\",\"priority\":1,\"labels\":[\"aft-filter-${RUN_ID:-local}\"]}" >/dev/null
      - run: >-
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/${AFT_WS:-E2E-WS}/issues" -H "Content-Type: application/json"
          -d "{\"title\":\"filters-deeplink-${RUN_ID:-local}-wrong-label\",\"issue_type\":\"bug\",\"priority\":1,\"labels\":[\"other-filter-${RUN_ID:-local}\"]}" >/dev/null
      - open: /ws/E2E-WS/kanban?search=filters-deeplink-${RUN_ID:-local}&priority=1&type=bug&labels=aft-filter-${RUN_ID:-local}
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=board-toolbar]')
      - wait:
          fn: >-
            document.querySelectorAll('section[data-status=ready] article').length === 1
      - expect: { value: { testid: search-input-field, equals: "filters-deeplink-${RUN_ID:-local}" } }
      - expect: { count: { selector: "section[data-status=ready] article", equals: 1 } }
      - expect: { text: "filters-deeplink-${RUN_ID:-local}-match" }
      - expect: { notText: "filters-deeplink-${RUN_ID:-local}-wrong-priority" }
      - expect: { notText: "filters-deeplink-${RUN_ID:-local}-wrong-type" }
      - expect: { notText: "filters-deeplink-${RUN_ID:-local}-wrong-label" }
