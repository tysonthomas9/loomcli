# P1.26 (D29): a task with code awaiting review stays open, in status review
# with the code-review label, instead of closing when its attempt finishes.
# Approve (once applied) closes it, Reject sets it back to open, and an empty
# attempt still closes as "No changes". While it waits a dependent in its stack
# starts on its frozen code (Tyson, 2026-10-09): approving the dependent first
# waits for it, and rejecting it makes the dependent stale until a Rebuild. A
# dependent outside its stack stays blocked until it closes. The task
# page shows Review, and only the Revisions panel offers Approve/Reject. Real
# TaskRuns record the revisions.
suite: loomgit-task-review
classification: { area: reviews, feature: task-review, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: >-
  set -e;
  bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" setup E2E-WS-TREV stack;
  bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" setup E2E-WS-TREV-TRUNK trunk
teardown: >-
  bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" teardown E2E-WS-TREV;
  bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" teardown E2E-WS-TREV-TRUNK

tests:
  - name: stacked, a task with code waits in review until Approve closes it
    intent: The finished attempt leaves its task in review with its dependent outside the stack blocked; the task page offers Approve only in the Revisions panel; Approve closes the task and unblocks the dependent
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" attempt E2E-WS-TREV approve trev-approve.txt
        intent: A real TaskRun writes a file and records its revision
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" in-review E2E-WS-TREV approve
        intent: The task is in review with the code-review label, its dependent outside the stack is blocked and its epic is open
      - open: /ws/E2E-WS-TREV/kanban
        intent: Load the workspace before following the task deep link
      - wait:
          fn: "!!document.querySelector('[data-testid=board-toolbar]')"
        intent: The board has mounted, so the workspace is loaded before the deep link
      - run: >-
          agent-browser --session "$AFT_SESSION" open
          "$AFT_BASE_URL/ws/E2E-WS-TREV/issues/$(cat "$AFT_WORK_DIR/E2E-WS-TREV-approve-task")"
        intent: Open the task in review
      - wait:
          fn: "(document.querySelector('[data-testid=status-dropdown]') || document.querySelector('[data-testid=issue-status-badge]'))?.getAttribute('data-status') === 'review'"
        intent: The task page shows the task in review, not closed
      - wait:
          fn: "!!document.querySelector('[data-testid=issue-status-badge]') && !document.querySelector('[data-testid=status-dropdown]') && !document.querySelector('[data-testid=remove-label-code-review]')"
        intent: Its status is a badge, not a dropdown, and the code-review label has no remove button
      - wait:
          fn: "!document.querySelector('[data-testid=review-action-bar]') && !document.querySelector('[data-testid=panel-approve-button]')"
        intent: The header offers no plan Approve/Reject for code awaiting review
      - click: { role: tab, name: Changes, exact: true }
      - wait: { text: "Awaiting review" }
      - wait: { text: trev-approve.txt }
      - wait:
          fn: "[...document.querySelectorAll('[data-testid=task-changes-tab] button')].some(b => b.textContent === 'Approve and create PR')"
        intent: The Revisions panel owns Approve
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" approve E2E-WS-TREV approve
        intent: Approve applies the code and closes the task without the label; the dependent becomes ready
      - run: >-
          agent-browser --session "$AFT_SESSION" open
          "$AFT_BASE_URL/ws/E2E-WS-TREV/issues/$(cat "$AFT_WORK_DIR/E2E-WS-TREV-approve-task")"
        intent: Reopen the approved task
      - wait:
          fn: "(document.querySelector('[data-testid=status-dropdown]') || document.querySelector('[data-testid=issue-status-badge]'))?.getAttribute('data-status') === 'closed'"
        intent: The approved task shows Closed

  - name: stacked, Reject sends the task back to open
    intent: A rejected task leaves review without the label and is open for another attempt; its dependent stays blocked
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" attempt E2E-WS-TREV reject trev-reject.txt
        intent: A real TaskRun runs the task until it records its revision
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" in-review E2E-WS-TREV reject
        intent: The task waits in review with the code-review label, its dependent outside the stack is blocked and its epic is open
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" reject E2E-WS-TREV reject
        intent: Reject sets the task to open without the label
      - open: /ws/E2E-WS-TREV/kanban
        intent: Load the workspace before following the task deep link
      - wait:
          fn: "!!document.querySelector('[data-testid=board-toolbar]')"
        intent: The board has mounted, so the workspace is loaded before the deep link
      - run: >-
          agent-browser --session "$AFT_SESSION" open
          "$AFT_BASE_URL/ws/E2E-WS-TREV/issues/$(cat "$AFT_WORK_DIR/E2E-WS-TREV-reject-task")"
        intent: Open the rejected task
      - wait:
          fn: "(document.querySelector('[data-testid=status-dropdown]') || document.querySelector('[data-testid=issue-status-badge]'))?.getAttribute('data-status') === 'open'"
        intent: The rejected task shows Open

  - name: stacked, an empty attempt still closes as No changes
    intent: P1.25 is unchanged; a task whose agent changed nothing closes
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" attempt E2E-WS-TREV empty
        intent: A real TaskRun runs the task until it records its revision
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" no-changes E2E-WS-TREV empty
        intent: The empty attempt closed its task as No changes
      - open: /ws/E2E-WS-TREV/kanban
        intent: Load the workspace before following the task deep link
      - wait:
          fn: "!!document.querySelector('[data-testid=board-toolbar]')"
        intent: The board has mounted, so the workspace is loaded before the deep link
      - run: >-
          agent-browser --session "$AFT_SESSION" open
          "$AFT_BASE_URL/ws/E2E-WS-TREV/issues/$(cat "$AFT_WORK_DIR/E2E-WS-TREV-empty-task")"
        intent: Open the task whose attempt changed nothing
      - wait:
          fn: "(document.querySelector('[data-testid=status-dropdown]') || document.querySelector('[data-testid=issue-status-badge]'))?.getAttribute('data-status') === 'closed'"
        intent: The task shows Closed
      - wait: { text: "No changes" }
        intent: Its revision reads No changes

  - name: PR per task, the task waits in review, Approve closes it and Reject reopens it
    intent: In trunk mode the same task states hold
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" attempt E2E-WS-TREV-TRUNK approve trev-trunk-approve.txt
        intent: A real TaskRun runs the task until it records its revision
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" in-review E2E-WS-TREV-TRUNK approve
        intent: The task waits in review with the code-review label, its dependent outside the stack is blocked and its epic is open
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" approve E2E-WS-TREV-TRUNK approve
        intent: Approve applies the code and closes the task without the label; the dependent becomes ready
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" attempt E2E-WS-TREV-TRUNK reject trev-trunk-reject.txt
        intent: A real TaskRun runs the task until it records its revision
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" in-review E2E-WS-TREV-TRUNK reject
        intent: The task waits in review with the code-review label, its dependent outside the stack is blocked and its epic is open
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" reject E2E-WS-TREV-TRUNK reject
        intent: Reject sets the task back to open without the label; its dependent stays blocked
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" attempt E2E-WS-TREV-TRUNK empty
        intent: A real TaskRun runs the task until it records its revision
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" no-changes E2E-WS-TREV-TRUNK empty
        intent: The empty attempt closed its task as No changes

  - name: stacked, a dependent starts on its blocker's code in review, and approving it first waits
    intent: B starts once A's agent finished, built on A's revision while A waits in review; approving B first waits for A and says so; approving A then applies A and B in order
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" chain E2E-WS-TREV order
        intent: Real TaskRuns run A, then B on A's frozen revision while A is still in review with no verdict
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" approve-first E2E-WS-TREV order
        intent: Approving B before A is recorded and waits, with "waiting for A to be approved"
      - open: /ws/E2E-WS-TREV/kanban
        intent: Load the workspace before following the task deep link
      - wait:
          fn: "!!document.querySelector('[data-testid=board-toolbar]')"
        intent: The board has mounted, so the workspace is loaded before the deep link
      - run: >-
          agent-browser --session "$AFT_SESSION" open
          "$AFT_BASE_URL/ws/E2E-WS-TREV/issues/$(cat "$AFT_WORK_DIR/E2E-WS-TREV-order-b")"
        intent: Open the dependent B
      - click: { role: tab, name: Changes, exact: true }
      - wait:
          fn: "(document.querySelector('[data-testid=revision-waiting-dependency]')?.textContent || '').includes('to be approved')"
        intent: B's revision says it waits for A's approval
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" approve-blocker E2E-WS-TREV order
        intent: Approving A applies A, then B, and closes both

  - name: stacked, rejecting the blocker makes its dependent stale until a Rebuild
    intent: Rejecting A marks B stale with the reason; Approve on B is refused and nothing reruns it on its own; once A has a new revision, Rebuild reopens B and its next attempt is built on it
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" chain E2E-WS-TREV stale
        intent: Real TaskRuns run A, then B on A's frozen revision
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" stale E2E-WS-TREV stale
        intent: Rejecting A makes B stale; Approve on B is refused with the reason
      - open: /ws/E2E-WS-TREV/kanban
        intent: Load the workspace before following the task deep link
      - wait:
          fn: "!!document.querySelector('[data-testid=board-toolbar]')"
        intent: The board has mounted, so the workspace is loaded before the deep link
      - run: >-
          agent-browser --session "$AFT_SESSION" open
          "$AFT_BASE_URL/ws/E2E-WS-TREV/issues/$(cat "$AFT_WORK_DIR/E2E-WS-TREV-stale-b")"
        intent: Open the stale dependent B
      - click: { role: tab, name: Changes, exact: true }
      - wait:
          fn: "(document.querySelector('[data-testid=revision-stale]')?.textContent || '').includes('which was rejected')"
        intent: B's revision says it was built on a rejected revision
      - wait:
          fn: "[...document.querySelectorAll('[data-testid=task-changes-tab] button')].some(b => b.textContent === 'Approve and create PR' && b.disabled) && !document.querySelector('[data-testid=rebuild]')"
        intent: Approve is disabled, and there is no Rebuild until A has a new revision
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" rebuild E2E-WS-TREV stale
        intent: A's next attempt offers B a rebuild on it; an agent may not Rebuild; a human's Rebuild reopens B, whose next attempt is built on A's new revision

  - name: PR per task, a dependent starts on its blocker's code, waits when approved first, and goes stale on reject
    intent: In trunk mode the same dependency order and stale rules hold
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" chain E2E-WS-TREV-TRUNK order
        intent: Real TaskRuns run A, then B on A's frozen revision while A is in review
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" approve-first E2E-WS-TREV-TRUNK order
        intent: Approving B before A waits, with the reason
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" approve-blocker E2E-WS-TREV-TRUNK order
        intent: Approving A applies A, then B, and closes both
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" chain E2E-WS-TREV-TRUNK stale
        intent: Real TaskRuns run A, then B on A's frozen revision
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" stale E2E-WS-TREV-TRUNK stale
        intent: Rejecting A makes B stale; Approve on B is refused with the reason
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-task-review.sh" rebuild E2E-WS-TREV-TRUNK stale
        intent: Rebuild reopens B once A has a new revision, and B's next attempt is built on it
