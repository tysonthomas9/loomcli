kind: graph-transitions
version: 1
flow: issue-detail
group: description

transitions:
  edit-description:
    intent: A human edits and saves the issue description as markdown through the mounted editor.
    actor: human
    via: ui
    steps:
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=description-edit-button]')
        intent: Wait until the description editor control is ready.
      - wait: { load: networkidle }
      - run: >-
          for i in 1 2 3; do
          agent-browser --session "$AFT_SESSION" find testid description-edit-button click || true;
          sleep 1;
          agent-browser --session "$AFT_SESSION" eval "!!document.querySelector('[data-testid=description-textarea]')" | grep -q true && exit 0;
          done; echo "description edit click never opened the editor"; exit 1
        intent: A human retries the edit control until the mounted textarea opens.
      - fill:
          testid: description-textarea
          value: |-
            Updated **graph detail ${AFT_CASE_ID}**

            Description survives reload ${RUN_ID:-local}-${AFT_CASE_ID}.
      - click: { testid: description-save }

  reload-and-reopen-description:
    intent: A human reloads the explicit issue URL and verifies the routed slide-over restores the persisted description.
    actor: human
    via: ui
    steps:
      - reload: true
      - wait:
          fn: >-
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-state') === 'open' &&
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-loading') === 'false'
        intent: Wait until the reloaded issue URL restores its fully loaded slide-over.

  open-description-editor:
    intent: A human opens the description editor and types a draft without saving it.
    actor: human
    via: ui
    steps:
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=description-edit-button]')
        intent: Wait until the description editor control is ready.
      - wait: { load: networkidle }
      - run: >-
          for i in 1 2 3; do
          agent-browser --session "$AFT_SESSION" find testid description-edit-button click || true;
          sleep 1;
          agent-browser --session "$AFT_SESSION" eval "!!document.querySelector('[data-testid=description-textarea]')" | grep -q true && exit 0;
          done; echo "description edit click never opened the editor"; exit 1
        intent: A human retries the edit control until the mounted textarea opens.
      - fill:
          testid: description-textarea
          value: "discarded draft ${RUN_ID:-local}-${AFT_CASE_ID}"

  cancel-description-edit:
    intent: A human cancels the unsaved description draft through the mounted cancel control.
    actor: human
    via: ui
    steps:
      - click: { testid: description-cancel }

  reload-and-reopen-discarded:
    intent: A human reloads the explicit issue URL and verifies the routed slide-over discarded the cancelled draft.
    actor: human
    via: ui
    steps:
      - reload: true
      - wait:
          fn: >-
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-state') === 'open' &&
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-loading') === 'false'
        intent: Wait until the reloaded issue URL restores its fully loaded slide-over.
