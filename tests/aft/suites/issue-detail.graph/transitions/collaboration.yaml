kind: graph-transitions
version: 1
flow: issue-detail
group: collaboration

transitions:
  post-comment:
    intent: A human submits a case-specific comment through the mounted CommentForm.
    actor: human
    via: ui
    steps:
      - fill:
          testid: comment-textarea
          value: "graph comment ${RUN_ID:-local}-${AFT_CASE_ID}"
      - run: >-
          for i in 1 2 3; do
          agent-browser --session "$AFT_SESSION" find testid comment-submit click || true;
          sleep 1;
          agent-browser --session "$AFT_SESSION" eval "document.querySelector('[data-testid=comment-textarea]')?.value === ''" | grep -q true && exit 0;
          done; echo "comment submit click never posted the comment"; exit 1
        intent: A human retries submission until the mounted comment form clears.

  reload-and-reopen-comment:
    intent: A human reloads the explicit issue URL and verifies the routed slide-over restores the persisted comment.
    actor: human
    via: ui
    steps:
      - reload: true
      - wait:
          fn: >-
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-state') === 'open' &&
            document.querySelector('[data-testid=issue-detail-panel]')?.getAttribute('data-loading') === 'false'
        intent: Wait until the reloaded issue URL restores its fully loaded slide-over.

  attempt-empty-comment:
    intent: A human submits a whitespace-only comment with the keyboard shortcut and finds it blocked.
    actor: human
    via: ui
    steps:
      - fill:
          testid: comment-textarea
          value: "   "
      - focus: { testid: comment-textarea }
      - press: Control+Enter
