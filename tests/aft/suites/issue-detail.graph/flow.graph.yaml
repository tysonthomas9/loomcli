kind: graph
version: 1
classification: { area: issues, feature: issue-detail, surface: mixed, purpose: journey }
flow: issue-detail
intent: A human creates an issue and exercises the editable issue-detail panel through mounted UI controls.
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
teardown: '"$AFT_TESTS_DIR/scripts/close-open-issues.sh"'

imports:
  - shared-steps.yaml
  - states.yaml
  - transitions/entry-and-creation.yaml
  - transitions/description.yaml
  - transitions/metadata.yaml
  - transitions/title.yaml
  - transitions/collaboration.yaml
  - transitions/lifecycle.yaml
  - transitions/navigation.yaml
  - transitions/dependencies.yaml
  - transitions/claim.yaml

start: browser-ready

graph:
  browser-ready:
    open-kanban: board-ready

  board-ready:
    open-create-modal: create-form-ready

  create-form-ready:
    create-open-issue: detail-panel-ready
    create-claim-epic: claim-epic-panel-ready

  detail-panel-ready:
    edit-description: description-saved
    change-type: type-saved
    add-label: label-saved
    set-assignee: assignee-saved
    post-comment: comment-visible
    start-work: in-progress-detail
    defer-issue: deferred-detail
    send-to-review: review-detail
    open-title-editor: title-editor-open
    open-description-editor: description-editor-open
    close-panel: issue-card-ready

  description-saved:
    reload-and-reopen-description: description-persisted

  type-saved:
    close-and-filter-type: type-persisted

  label-saved:
    close-and-filter-label: label-persisted

  label-persisted:
    reopen-labeled-card: label-panel-reopened

  label-panel-reopened:
    remove-label: label-removed

  label-removed:
    close-and-refilter-label: label-removal-persisted

  assignee-saved:
    close-and-reload-assignee-board: assignee-persisted

  comment-visible:
    reload-and-reopen-comment: comment-persisted

  comment-persisted:
    attempt-empty-comment: empty-comment-blocked

  in-progress-detail:
    set-status-closed: closed-detail

  closed-detail:
    return-to-closed-board: closed-on-board

  deferred-detail:
    return-to-backlog-board: deferred-on-board

  review-detail:
    return-to-review-board: review-on-board

  title-editor-open:
    submit-empty-title: title-rejected-empty

  title-rejected-empty:
    rename-title: title-renamed

  title-renamed:
    reload-board-after-rename: title-persisted-on-board

  description-editor-open:
    cancel-description-edit: description-edit-cancelled

  description-edit-cancelled:
    reload-and-reopen-discarded: description-edit-discarded

  issue-card-ready:
    reopen-card: reopened-detail-panel
    create-blocker-issue: blocker-panel-ready

  blocker-panel-ready:
    reopen-original-from-blocker: original-panel-for-dependency

  original-panel-for-dependency:
    add-blocking-dependency: dependency-recorded

  dependency-recorded:
    reload-blocked-board: blocked-on-board

  blocked-on-board:
    agent-claim-refused-for-blocked-child: blocked-child-claim-refused

  # Claim under an epic (STACKED-PRS-29): the human builds the epic and child in
  # the UI; the agent's claim is an API step (see transitions/claim.yaml).
  claim-epic-panel-ready:
    open-child-form-under-epic: claim-child-form-ready

  claim-child-form-ready:
    create-epic-child: epic-child-panel-ready

  epic-child-panel-ready:
    agent-claims-ready-child: in-progress-detail
    close-epic-child-panel: issue-card-ready
    create-epic-blocker: epic-blocker-panel-ready

  epic-blocker-panel-ready:
    open-epic-from-lane: epic-panel-for-dependency

  epic-panel-for-dependency:
    add-epic-blocking-dependency: epic-dependency-recorded

  epic-dependency-recorded:
    reload-epic-blocked-board: child-blocked-by-epic-on-board

  child-blocked-by-epic-on-board:
    agent-claim-refused-under-blocked-epic: epic-child-claim-refused

coverage:
  strategy: transition
  goldenJourneys:
    - name: description-survives-fresh-page
      path:
        - open-kanban
        - open-create-modal
        - create-open-issue
        - edit-description
        - reload-and-reopen-description

    - name: human-starts-and-closes-issue
      path:
        - open-kanban
        - open-create-modal
        - create-open-issue
        - start-work
        - set-status-closed
        - return-to-closed-board

    # Pins the blocker claim to the epic prefix; coverage may route it either way.
    - name: agent-refused-blocked-child-under-open-epic
      path:
        - open-kanban
        - open-create-modal
        - create-claim-epic
        - open-child-form-under-epic
        - create-epic-child
        - close-epic-child-panel
        - create-blocker-issue
        - reopen-original-from-blocker
        - add-blocking-dependency
        - reload-blocked-board
        - agent-claim-refused-for-blocked-child
