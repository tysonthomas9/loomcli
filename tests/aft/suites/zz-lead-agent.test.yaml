# Lead interactive-agent template coverage. This suite owns its workspace
# because lead agents create durable role rows and PTY-backed terminal tabs.
suite: zz-lead-agent
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: |
  set -e
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD" >/dev/null || true
  repo="$AFT_WORK_DIR/lead-repo"
  mkdir -p "$repo"
  git -C "$repo" init -q
  printf '%s\n' "lead fixture ${RUN_ID:-local}" > "$repo/README.md"
  git -C "$repo" add README.md
  git -C "$repo" -c user.email=e2e@x -c user.name=e2e commit -q -m init
  python3 -c 'import json,sys; print(json.dumps({"name":sys.argv[1],"type":"empty","repos":[sys.argv[2]]}))' "e2e-ws-lead" "$repo" > "$AFT_WORK_DIR/lead-workspace.json"
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces" -H "Content-Type: application/json" -d @"$AFT_WORK_DIR/lead-workspace.json" > "$AFT_WORK_DIR/lead-workspace.resp.json"
  python3 - "${RUN_ID:-local}" > "$AFT_WORK_DIR/lead-worker.json" <<'PY'
  import json, sys
  run = sys.argv[1]
  print(json.dumps({
      "name": f"worker-{run}",
      "role_name": "task",
      "auto": False,
      "cross_repo": True,
      "repos": [],
      "backend": "codex",
  }))
  PY
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents" \
    -H "Content-Type: application/json" \
    -d @"$AFT_WORK_DIR/lead-worker.json" \
    > "$AFT_WORK_DIR/lead-worker.resp.json"
teardown: |
  set +e
  AFT_WS=E2E-WS-LEAD "$AFT_TESTS_DIR/scripts/close-open-issues.sh"
  curl -s "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$AFT_WORK_DIR/lead-tabs.teardown.json" || true
  python3 - "$AFT_WORK_DIR/lead-tabs.teardown.json" <<'PY' > "$AFT_WORK_DIR/lead-tabs.teardown.list"
  import json, sys
  try:
      d = json.load(open(sys.argv[1]))
  except Exception:
      d = {}
  tabs = d.get("data") or []
  if isinstance(tabs, list):
      for tab in tabs:
          name = tab.get("session_name")
          if name:
              print(name)
  PY
  while read -r session; do
    [ -n "$session" ] && curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs/$session" >/dev/null || true
  done < "$AFT_WORK_DIR/lead-tabs.teardown.list"
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD" >/dev/null || true

tests:
  # covers: LED-D10; Terminal page anonymous lead tabs; /api/workspaces/:ws/terminal/tabs
  - name: terminal page increments codex lead tab names
    intent: An operator opens the Terminal page and adds a second codex lead tab whose label and session name increment without collision
    steps:
      - open: /ws/E2E-WS-LEAD/terminal
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=terminal-view]')
        intent: "Wait until the lead workspace terminal view is ready"
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=terminal-tab-bar]')
        intent: "Wait until the terminal tab bar renders"
      - wait:
          fn: >-
            Array.from(document.querySelectorAll('[data-testid^="terminal-tab-label-"]'))
              .map((n) => (n.textContent || '').trim()).includes('lead-codex-1')
        intent: "Wait until the default codex lead tab is labelled lead-codex-1"
      - click: { testid: terminal-new-tab-button }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=new-terminal-tab-menu]')
        intent: "Wait until the new terminal backend menu is open"
      - click: { testid: new-tab-backend-codex }
      - wait:
          fn: >-
            Array.from(document.querySelectorAll('[data-testid^="terminal-tab-label-"]'))
              .map((n) => (n.textContent || '').trim()).includes('lead-codex-2')
        intent: "Wait until the second codex lead tab is labelled lead-codex-2"
      - run: |
          set -e
          for i in $(seq 1 20); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$AFT_WORK_DIR/lead-d10-tabs.json" &&
            python3 - "$AFT_WORK_DIR/lead-d10-tabs.json" "$AFT_WORK_DIR" <<'PY' && exit 0
          import json, pathlib, re, sys
          d = json.load(open(sys.argv[1]))
          tabs = d.get("data") or []
          assert isinstance(tabs, list), type(tabs)
          by_label = {t.get("label"): t for t in tabs}
          first = by_label.get("lead-codex-1")
          second = by_label.get("lead-codex-2")
          assert first and second, by_label
          assert re.match(r"^e2e-ws-lead--lead-codex-1$", first.get("session_name", ""), re.I), first
          assert re.match(r"^e2e-ws-lead--lead-codex-2$", second.get("session_name", ""), re.I), second
          work = pathlib.Path(sys.argv[2])
          (work / "leadSession-terminal-codex-1").write_text(first["session_name"], encoding="utf-8")
          (work / "leadSession-terminal-codex-2").write_text(second["session_name"], encoding="utf-8")
          PY
            sleep 2
          done
          echo "codex lead terminal tab metadata never resolved"
          cat "$AFT_WORK_DIR/lead-d10-tabs.json" 2>/dev/null || true
          exit 1
        intent: "An operator reads back terminal tab metadata and confirms workspace-prefixed lead-codex session names"

  # covers: LED-D11; Terminal page shell tab branch; lead-shell session parsing
  - name: shell lead tab is not an AI lead runtime
    intent: An operator adds a shell tab from the lead terminal menu and verifies it is a login shell session rather than a loom lead runtime
    steps:
      - open: /ws/E2E-WS-LEAD/terminal
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=terminal-tab-bar]')
        intent: "Wait until the terminal tab bar renders for the shell-tab check"
      - click: { testid: terminal-new-tab-button }
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=new-terminal-tab-menu]')
        intent: "Wait until the new terminal backend menu is open"
      - click: { testid: new-tab-backend-shell }
      - wait:
          fn: >-
            Array.from(document.querySelectorAll('[data-testid^="terminal-tab-label-"]'))
              .map((n) => (n.textContent || '').trim()).includes('lead-shell-1')
        intent: "Wait until the shell lead tab is labelled lead-shell-1"
      - wait:
          fn: >-
            (() => {
              const active = document.querySelector('[role=tabpanel][aria-hidden="false"]');
              const text = active ? (active.textContent || '') : '';
              const terminal = active?.querySelector('[data-testid=terminal-wrapper] .wterm');
              return !!active && !!terminal && !text.includes('Starting LEAD mode');
            })()
        intent: "Wait until the active shell pane renders a terminal grid and proves it is not rendering the lead startup banner"
      - run: |
          set -e
          for i in $(seq 1 20); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/terminal/tabs" > "$AFT_WORK_DIR/lead-d11-tabs.json" &&
            python3 - "$AFT_WORK_DIR/lead-d11-tabs.json" "$AFT_WORK_DIR/leadSession-terminal-shell" <<'PY' && exit 0
          import json, re, sys
          d = json.load(open(sys.argv[1]))
          tabs = d.get("data") or []
          assert isinstance(tabs, list), type(tabs)
          matches = [t for t in tabs if t.get("label") == "lead-shell-1"]
          assert matches, tabs
          t = matches[0]
          assert re.match(r"^e2e-ws-lead--lead-shell-1$", t.get("session_name", ""), re.I), t
          assert not t.get("launch"), t
          open(sys.argv[2], "w", encoding="utf-8").write(t["session_name"])
          PY
            sleep 2
          done
          echo "shell terminal tab metadata never resolved"
          cat "$AFT_WORK_DIR/lead-d11-tabs.json" 2>/dev/null || true
          exit 1
        intent: "An operator reads back the shell tab metadata and confirms it has no agent launch spec"

  # covers: LED-D1; CreateAgentModal lead template; GET /api/workspaces/:ws/agents; role list; no lead worktree
  - name: lead template creates an interactive lead agent and role
    intent: An operator creates a Lead agent through CreateAgentModal and verifies the stored agent, role, and absence of an agent worktree
    steps:
      - open: /ws/E2E-WS-LEAD/agents
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the agents page is ready"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-lead }
      - fill: { testid: create-agent-name, value: "atlas-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('atlas-${RUN_ID:-local}')
        intent: "Wait until the lead create dialog closes and the new lead appears"
      - run: |
          set -e
          name="atlas-${RUN_ID:-local}"
          for i in $(seq 1 10); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents" > "$AFT_WORK_DIR/lead-d1-agents.json" &&
            python3 - "$AFT_WORK_DIR/lead-d1-agents.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("role_name") == "lead", a
          assert not a.get("auto"), a
          PY
            sleep 1
          done
          echo "lead agent never persisted"
          cat "$AFT_WORK_DIR/lead-d1-agents.json" 2>/dev/null || true
          exit 1
        intent: "An operator's readback selects the created lead from the unordered agent list and pins role_name plus auto"
      - run: |
          set -e
          LOOM_CONFIG_DIR="$AFT_LOOM_CONFIG_DIR" "$AFT_LOOM_BIN" --workspace E2E-WS-LEAD role list --json > "$AFT_WORK_DIR/lead-d1-roles.json"
          python3 - "$AFT_WORK_DIR/lead-d1-roles.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          roles = d if isinstance(d, list) else d.get("roles", d.get("data", []))
          matches = [r for r in roles if r.get("name") == "lead"]
          assert len(matches) == 1, roles
          r = matches[0]
          assert r.get("kind") == "interactive", r
          assert not (r.get("prompt") or "").strip(), r
          assert not (r.get("prompt_file") or "").strip(), r
          PY
        intent: "An operator's CLI readback confirms the auto-created lead role is interactive with no prompt override"
      - api:
          method: "GET"
          path: "/api/workspaces/E2E-WS-LEAD/agents/atlas-${RUN_ID:-local}/git/diff-stat"
          status: 404
          assert:
            - path: "error"
              contains: "agent worktree"
        intent: "An operator confirms the interactive lead did not get an agent worktree at creation time"

  # covers: LED-D2; CreateAgentModal lead backend select; agent terminal launch argv/env
  - name: lead backend dropdown selects the runtime
    intent: An operator creates a Lead agent with the Claude backend selected and verifies the choice reaches the agent record and launch spec
    steps:
      - open: /ws/E2E-WS-LEAD/agents
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the agents page is ready for backend selection"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-lead }
      - fill: { testid: create-agent-name, value: "atlas-cl-${RUN_ID:-local}" }
      - wait:
          fn: >-
            document.querySelectorAll('[data-testid=create-agent-backend] option').length > 1
        intent: "Wait until backend options are loaded before selecting claude"
      - select: { testid: create-agent-backend, value: claude }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('atlas-cl-${RUN_ID:-local}')
        intent: "Wait until the Claude-backed lead appears after submit"
      - run: |
          set -e
          name="atlas-cl-${RUN_ID:-local}"
          for i in $(seq 1 10); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents" > "$AFT_WORK_DIR/lead-d2-agents.json" &&
            python3 - "$AFT_WORK_DIR/lead-d2-agents.json" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          matches = [a for a in agents or [] if a.get("name") == name]
          assert len(matches) == 1, agents
          a = matches[0]
          assert a.get("role_name") == "lead", a
          assert a.get("backend") == "claude", a
          assert not a.get("auto"), a
          PY
            sleep 1
          done
          echo "Claude-backed lead agent never persisted"
          cat "$AFT_WORK_DIR/lead-d2-agents.json" 2>/dev/null || true
          exit 1
        intent: "An operator's readback confirms the selected backend persisted on the lead agent"
      - run: |
          set -e
          name="atlas-cl-${RUN_ID:-local}"
          for i in $(seq 1 20); do
            curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name/terminal/session" > "$AFT_WORK_DIR/lead-d2-terminal.json" &&
            python3 - "$AFT_WORK_DIR/lead-d2-terminal.json" "$AFT_WORK_DIR/leadSession-atlas-cl" "$name" <<'PY' && exit 0
          import json, sys
          d = json.load(open(sys.argv[1]))["data"]
          name = sys.argv[3]
          assert d.get("backend") == "claude", d
          assert d.get("agent_id") == name, d
          assert d.get("role") == "lead", d
          launch = d.get("launch") or {}
          argv = " ".join(str(x) for x in (launch.get("argv") or []))
          env = launch.get("env") or {}
          assert "'--backend' 'claude'" in argv, argv
          assert argv.rstrip().endswith("'lead'"), argv
          assert env.get("LOOM_BACKEND") == "claude", env
          assert env.get("LOOM_AGENT_NAME") == name, env
          open(sys.argv[2], "w", encoding="utf-8").write(d["session_name"])
          PY
            sleep 2
          done
          echo "Claude-backed lead terminal launch metadata never resolved"
          cat "$AFT_WORK_DIR/lead-d2-terminal.json" 2>/dev/null || true
          exit 1
        intent: "An operator reads back the Claude lead terminal launch contract from the agent session endpoint"

  # covers: LED-D3; CreateAgentModal lead repo scope; cross_repo and repos readbacks
  - name: lead repo scope round trips workspace-wide and pinned choices
    intent: An operator creates one workspace-wide Lead and one repo-pinned Lead and verifies the derived repo scope on both agent records
    steps:
      - open: /ws/E2E-WS-LEAD/agents
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
        intent: "Wait until the agents page is ready for workspace-wide lead creation"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open"
      - click: { testid: create-agent-template-lead }
      - fill: { testid: create-agent-name, value: "atlas-all-${RUN_ID:-local}" }
      - click: { selector: "[data-testid='create-agent-repo-chips'] button", first: true }
      - wait:
          fn: >-
            (() => {
              const text = document.body.textContent.replace(/\s+/g, ' ');
              return text.includes('No repo selected — the agent gets workspace-wide scope.');
            })()
        intent: "Wait until the workspace-wide scope copy is rendered after clearing the repo chip"
      - expect: { text: "No repo selected — the agent gets workspace-wide scope." }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('atlas-all-${RUN_ID:-local}')
        intent: "Wait until the workspace-wide lead appears after submit"
      - click: { role: button, name: "+ Add agent", exact: true }
      - wait:
          fn: >-
            (() => {
              const overlay = document.querySelector('[data-testid=create-agent-overlay]');
              if (overlay) {
                window.__aftCreateAgentOverlayWaitStartedAt = 0;
                return true;
              }
              if (!window.__aftCreateAgentOverlayWaitStartedAt) {
                window.__aftCreateAgentOverlayWaitStartedAt = Date.now();
              }
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              if (Date.now() - window.__aftCreateAgentOverlayWaitStartedAt > 1000 && add && (location.pathname.endsWith("/agents") || location.pathname.includes("/agents/"))) {
                throw new Error('create-agent-overlay disappeared or never opened after + Add agent; agents page may have remounted during auto-select');
              }
              return false;
            })()
        intent: "Wait until the agent creation dialog is open for the pinned lead"
      - click: { testid: create-agent-template-lead }
      - fill: { testid: create-agent-name, value: "atlas-pin-${RUN_ID:-local}" }
      - click: { testid: create-agent-submit }
      - wait:
          fn: >-
            !document.querySelector('[data-testid=create-agent-overlay]') &&
            document.body.textContent.includes('atlas-pin-${RUN_ID:-local}')
        intent: "Wait until the repo-pinned lead appears after submit"
      - run: |
          set -e
          run="${RUN_ID:-local}"
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents" > "$AFT_WORK_DIR/lead-d3-agents.json"
          python3 - "$AFT_WORK_DIR/lead-d3-agents.json" "atlas-all-$run" "atlas-pin-$run" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          data = d.get("data", d)
          agents = data.get("agents") if isinstance(data, dict) else data
          by_name = {a.get("name"): a for a in agents or []}
          all_name, pin_name = sys.argv[2], sys.argv[3]
          assert all_name in by_name and pin_name in by_name, agents
          all_agent = by_name[all_name]
          pin_agent = by_name[pin_name]
          assert all_agent.get("role_name") == "lead", all_agent
          assert all_agent.get("cross_repo") is True, all_agent
          assert (all_agent.get("repos") or []) == [], all_agent
          assert pin_agent.get("role_name") == "lead", pin_agent
          assert not pin_agent.get("cross_repo"), pin_agent
          assert pin_agent.get("repos") == ["lead-repo"], pin_agent
          PY
        intent: "An operator's readback confirms lead repo-scope choices persisted with omitempty-safe booleans"

  # covers: LED-D4; CreateAgentModal lead name validation; normalized uppercase positive control
  - name: lead name validation blocks invalid submit
    intent: An operator cannot submit invalid Lead agent names, while uppercase input is normalized into a valid stored name
    steps:
      - open: /ws/E2E-WS-LEAD/agents
      - wait:
          fn: >-
            (() => {
              const page = document.querySelector('[data-testid=agents-page]');
              const add = Array.from(document.querySelectorAll('button'))
                .some((b) => (b.textContent || '').trim() === '+ Add agent');
              const agentCards = document.querySelectorAll('[aria-label^="Agent: "]');
              const settled = (location.pathname.split("/agents/")[1] || "").length > 0 || (add && agentCards.length === 0);
              const sig = [location.pathname, agentCards.length, add ? "add" : "no-add"].join("|");
              if (!page || !settled) {
                window.__aftAgentsPageStableSig = null;
                window.__aftAgentsPageStableAt = 0;
                return false;
              }
              if (window.__aftAgentsPageStableSig !== sig) {
                window.__aftAgentsPageStableSig = sig;
                window.__aftAgentsPageStableAt = Date.now();
                return false;
              }
              return Date.now() - window.__aftAgentsPageStableAt >= 300;
            })()
