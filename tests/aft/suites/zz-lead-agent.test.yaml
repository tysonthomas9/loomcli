          want="$(cat "$AFT_WORK_DIR/leadSession-atlas-d12")"
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-LEAD/agents/$name/terminal/session" > "$AFT_WORK_DIR/lead-d12-session-c.json"
