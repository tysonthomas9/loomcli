# B-219b-01/02/05; C.P3.3, C.P3.5, C.P3.7, C.P3.9e, C.P2.19c; D29(7/8).
# Runtime evidence is UNRUN. --screenshots captures each named checkpoint.
# Requires the reviewed journey-common helper and per-repository forge launcher.
# Sequential approved-predecessor setup does not settle the run-ahead policy.
suite: loomgit-journey-stacks
classification:
  area: git
  feature: stack-and-signed-feedback
  surface: mixed
  purpose: journey
baseUrl: ${AFT_BASE_URL:-http://127.0.0.1:3100}
teardown: >-
  cleanup_failed=0;
  for c in loom-stack loom-lower native-stack native-lower loom-feedback native-feedback trunk-feedback; do
  bash "$AFT_TESTS_DIR/scripts/loomgit-journey-stacks.sh" teardown "$c" || cleanup_failed=1; done;
  exit "$cleanup_failed"
tests:
  - name: Loom stack prefix continuation and mode switch
    intent: A human builds approved dependent PRs, merges the prefix through layer 2 and then continues through layer 3, observes layer 4 converge, and switches future tasks to trunk without changing existing PRs
    steps:
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-stacks.sh" setup loom-stack
        intent: Fixture provisioning creates an isolated local Git repository, public workspace and lead, and registers only its own simulated provider repository
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-stacks.sh" attempt loom-stack 1
        intent: API-client actor provisions and starts one stub-AI TaskRun; its approved predecessor dependency is retained
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-stacks.sh" open-task loom-stack 1
        intent: Human observer opens task 1 through its product deep link
      - click:
          role: tab
          name: Changes
          exact: true
        intent: Human observer opens the mounted Changes tab
      - wait:
          fn: "!!document.querySelector('[data-testid=task-changes-tab]')"
        intent: The task Changes panel is mounted
      - wait:
          text: journey-1.txt
        intent: The captured task file is shown in Changes
      - wait:
          text: task=
        intent: The diff shows the actual stub TaskRun marker contents
      - expect:
          enabled:
            testid: approve-create-pr
          visible:
            testid: task-diff-label
        intent: "Checkpoint REVIEW-1: the human sees this task patch before approving it"
      - click:
          testid: approve-create-pr
        intent: Human approves the mounted task diff and creates its PR
      - run: bash "$AFT_TESTS_DIR/scripts/loomgit-journey-stacks.sh" published loom-stack 1
        intent: Readback requires approved task closure, an applied revision, exactly one owned PR, and byte-exact task contents in its remote branch
      - expect:
          visible:
            testid: revision-pr
        intent: "Checkpoint PR-1: the approved task shows its existing PR"
