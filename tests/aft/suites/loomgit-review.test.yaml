# A real TaskRun produces the revision; the deterministic Codex CLI fixture only
# supplies the agent's file edit. The verdict is recorded through the mounted UI.
suite: loomgit-review
classification: { area: reviews, feature: revision-review, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL:-http://127.0.0.1:3100}"
setup: >-
  d="$AFT_WORK_DIR/review-repo";
  mkdir -p "$d"; git -C "$d" init -q -b main;
  git -C "$d" -c user.email=e2e@x -c user.name=e2e commit --allow-empty -m init -q;
  curl -sf -X POST "$AFT_BASE_URL/api/workspaces"
  -H "Content-Type: application/json"
  -d "{\"name\":\"e2e-ws-review\",\"type\":\"empty\",\"repos\":[\"$d\"]}"
  >/dev/null
teardown: >-
  AFT_WS=E2E-WS-REVIEW "$AFT_TESTS_DIR/scripts/close-open-issues.sh";
  curl -s -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW" >/dev/null || true

tests:
  - name: workspace deletion without a current work fingerprint is rejected
    intent: The deletion guard refuses an unconfirmed workspace removal and leaves its registered repository available
    steps:
      - run: >-
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW/delete/preview" > "$AFT_WORK_DIR/review-delete-preview.json";
          python3 -c 'import json,sys; assert len(json.load(open(sys.argv[1]))["fingerprint"]) == 64' "$AFT_WORK_DIR/review-delete-preview.json";
          status="$(curl -s -o "$AFT_WORK_DIR/review-delete-denied.json" -w '%{http_code}' -X DELETE "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW")";
          test "$status" = 409;
          grep -q 'unsaved_work' "$AFT_WORK_DIR/review-delete-denied.json";
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW" | grep -q 'E2E-WS-REVIEW'
        intent: Preview is read-only, and a missing confirmation cannot delete the workspace

  - name: operator approves a real task revision from the task detail panel
    intent: An agent edits a task repo through a TaskRun, then an operator approves the recorded head SHA in the Revisions section
    steps:
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-REVIEW/issues"
          body:
            title: "review epic $RUN_ID"
            issue_type: "epic"
            priority: 2
          save:
            - from: "data.id"
              as: "reviewEpicId"
        intent: "An orchestration client creates the review epic"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-REVIEW/issues"
          body:
            title: "review task $RUN_ID"
            issue_type: "task"
            priority: 2
            parent: "${var:reviewEpicId}"
            design: "STUB_CODEX_PATCH=review-output.txt"
          save:
            - from: "data.id"
              as: "reviewTaskId"
        intent: "An orchestration client creates a designed task whose deterministic backend edits its real task copy"
      - api:
          method: "POST"
          path: "/api/workspaces/E2E-WS-REVIEW/workflows/epic-runner"
          body:
            epicId: "${var:reviewEpicId}"
            runner: "local-task-runner"
        intent: "An orchestration client starts the real local TaskRun workflow"
      - run: >-
          task="$(cat "$AFT_WORK_DIR/reviewTaskId")";
          for i in $(seq 1 45); do
            curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW/issues/$task/revisions" | grep -q '"head_sha"' && exit 0;
            sleep 2;
          done;
          echo "TaskRun did not record a revision"; exit 1
        intent: "Wait until the TaskRun records a reviewable revision through the product path"
      - open: /ws/E2E-WS-REVIEW/kanban
        intent: "Load the new workspace before following a task deep link"
      - wait:
          fn: "!!document.querySelector('[data-testid=board-toolbar]')"
        intent: "Wait until the workspace board has finished mounting"
      - run: >-
          agent-browser --session "$AFT_SESSION" open
          "$AFT_BASE_URL/ws/E2E-WS-REVIEW/issues/$(cat "$AFT_WORK_DIR/reviewTaskId")"
        intent: "Open the recorded task through the same browser session using its runtime ID"
      - wait: { text: Revisions }
      - expect: { visible: { testid: revisions-section } }
      - run: >-
          task="$(cat "$AFT_WORK_DIR/reviewTaskId")";
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW/issues/$task/revisions" > "$AFT_WORK_DIR/review-before-verdict.json";
          change="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"][0]["change_id"])' "$AFT_WORK_DIR/review-before-verdict.json")";
          status="$(curl -s -o "$AFT_WORK_DIR/review-unapproved-apply.json" -w '%{http_code}' -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW/git/apply" -H 'Content-Type: application/json' -d "{\"change\":\"$change\",\"revision\":1,\"lead\":\"lead\"}")";
          test "$status" = 409;
          grep -q 'review_required' "$AFT_WORK_DIR/review-unapproved-apply.json"
        intent: "An unapproved revision is refused by the HTTP Apply gate before any working-area swap"
      - click: { role: button, name: Approve, exact: true }
      - api:
          method: "GET"
          path: "/api/workspaces/E2E-WS-REVIEW/issues/${var:reviewTaskId}/revisions"
          assert:
            - path: "data.0.verdict"
              equals: "approve"
        intent: "An operator confirms that the UI action persisted approval for the recorded revision"
      - run: >-
          task="$(cat "$AFT_WORK_DIR/reviewTaskId")";
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW/issues/$task/revisions" > "$AFT_WORK_DIR/review-revisions.json";
          python3 -c 'import json,sys; item=json.load(open(sys.argv[1]))["data"][0]; assert item["verdict"] == "approve"; assert len(item["head_sha"]) == 40; assert item["change_id"]; assert item["number"] > 0' "$AFT_WORK_DIR/review-revisions.json";
          git -C "$AFT_WORK_DIR/review-repo" cat-file -e "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"][0]["head_sha"])' "$AFT_WORK_DIR/review-revisions.json")^{commit}"
        intent: "An operator verifies the approved revision names a real commit in the workspace repository"
      - run: >-
          read change revision < <(python3 -c 'import json,sys; item=json.load(open(sys.argv[1]))["data"][0]; print(item["change_id"], item["number"])' "$AFT_WORK_DIR/review-revisions.json");
          curl -sf "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW/changes/$change/revisions/$revision/diff?repo=review-repo" > "$AFT_WORK_DIR/review-diff.json";
          grep -q 'review-output.txt' "$AFT_WORK_DIR/review-diff.json"
        intent: "The revision diff API names the file produced by the task runner"

  - name: legacy branch Push is rejected without moving the workspace branch
    intent: An API client tries the removed branch Push route and checks that the workspace branch remains unchanged
    steps:
      - run: >-
          before="$(git -C "$AFT_WORK_DIR/review-repo" rev-parse refs/heads/main)";
          status="$(curl -s -o "$AFT_WORK_DIR/review-legacy-push.json" -w '%{http_code}' -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW/agents/lead/git/push" -H 'Content-Type: application/json' -d '{}')";
          test "$status" = 400;
          grep -q 'branch Push is unavailable' "$AFT_WORK_DIR/review-legacy-push.json";
          after="$(git -C "$AFT_WORK_DIR/review-repo" rev-parse refs/heads/main)";
          test "$before" = "$after"
        intent: "The client sees the P2.8 validation error and confirms the local Git ref did not advance"

  - name: P2.14 approved Apply advances only the lead working area
    intent: An operator applies an approved revision over HTTP and sees the working area advance without a provider push
    steps:
      - run: >-
          test -s "$AFT_WORK_DIR/review-revisions.json";
          git -C "$AFT_WORK_DIR/review-repo" rev-parse refs/heads/main > "$AFT_WORK_DIR/apply-trunk-before"
        intent: "Record the trunk ref before the operator applies the approved revision"
      - run: >-
          read change revision < <(python3 -c 'import json,sys; item=json.load(open(sys.argv[1]))["data"][0]; print(item["change_id"], item["number"])' "$AFT_WORK_DIR/review-revisions.json");
          curl -sf -X POST "$AFT_BASE_URL/api/workspaces/E2E-WS-REVIEW/git/apply"
          -H 'Content-Type: application/json'
          -d "{\"change\":\"$change\",\"revision\":$revision,\"lead\":\"lead\"}"
          > "$AFT_WORK_DIR/review-applied.json";
          grep -q '"success":true' "$AFT_WORK_DIR/review-applied.json"
        intent: "The approved revision joins the local working area through the product Apply route"
      - run: >-
          test "$(cat "$AFT_WORK_DIR/apply-trunk-before")" = "$(git -C "$AFT_WORK_DIR/review-repo" rev-parse refs/heads/main)"
        intent: "Confirm that applying the layer did not advance trunk"

  - name: landed stacked change restacks its dependent into a derived revision
    skip: true
    intent: "Expected failure on 0b39b764b: daemon-managed dependent tasks do not record Loom Git lineage, so landing cannot offer a derived restack; a driver TaskRun dependent is still required"
    steps:
      - run: >-
          echo 'Prerequisite: create stacked task changes X and Y through TaskRuns, approve and Apply both through the UI, then POST /api/workspaces/E2E-WS-REVIEW/agents/lead/git/pr for X';
          exit 1
        intent: "Require actual stacked publications rather than seeding journal rows or Git refs as substitute evidence"
      - run: >-
          echo 'Merge X in the fake forge via /__merge and advance the bare remote trunk; restart serve to invoke its landing reconciliation entry point';
          exit 1
        intent: "P4.4 must detect the landed owned PR and mark Y restack_available"
      - run: >-
          echo 'Read Y revisions and assert a new restack operation derives from its source revision and uses the landed trunk SHA';
          exit 1
        intent: "P3.4 must create a real derived revision rather than an independently seeded revision"
