# LIVE paid OpenCode and public SSE. MATRIX:P1/L10-L12/R7, 1.4c delivered text.
# Ordinary cursor reconnect across owned serve restart, not an induced feed.gap.
suite: live-receipts-stream-sse
classification: { area: agents, feature: real-agent-sse-replay, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL}"
setup: |
  set -eu
  python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" preflight
teardown: |
  set -eu
  python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" cleanup
tests:
  - name: LIVE filtered SSE cursor reconnect matches paged events and full delivered text
    intent: Two real UI-created Leads have distinct saved histories; a saved cursor reconnects after an owned serve restart and matches exact paged EventIDs and full user text without foreign-agent events.
    steps:
      - run: 'test -x "$AFT_RESTART_SERVE" && test -x "$AFT_SELECT_AGENT_MODEL"'
        intent: "Confirm this run owns the serve restart and real-model selector"
      - open: /ws/${AFT_WS}/agents
      - click: { role: button, name: "+ Add agent", exact: true }
      - click: { testid: create-agent-template-lead }
      - fill: { testid: create-agent-name, value: "coverage-rs-stream-${RUN_ID}" }
      - select: { testid: create-agent-backend, value: opencode }
      - wait:
          fn: >-
            (() => { const r=Array.from(document.querySelectorAll('[data-testid=create-agent-repo-chips] button'));
              return r.length===1 && r[0].textContent.includes('source-repo') && r[0].getAttribute('aria-pressed')==='true'; })()
        intent: "Show the canonical source repo selected"
      - click: { testid: create-agent-submit }
      - wait: { url: "/ws/${AFT_WS}/chat/agt_" }
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" claim stream && "$AFT_SELECT_AGENT_MODEL"'
        intent: "Bind the primary UI-created Agent ID and selected real model"
      - fill: { label: Message, value: "STREAM_ONE-${RUN_ID}: use a tool to read README.md, then name its documented test command with the file citation." }
        intent: "Send a real repository question to the primary Lead"
      - press: Enter
      - wait:
          fn: >-
            (() => { const t=document.querySelector('[data-testid=chat-transcript]');
              return t?.textContent.includes('STREAM_ONE-${RUN_ID}') &&
                Array.from(t.querySelectorAll('li[data-kind=agent]')).some(x=>x.textContent.includes('README.md')) &&
                document.querySelector('section[aria-label="Agent chat"] header')?.textContent?.includes('idle'); })()
        budget: 180000
        intent: "Show a real answer and the primary Lead idle"
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" capture stream first && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" delivered stream first "STREAM_ONE-${RUN_ID}: use a tool to read README.md, then name its documented test command with the file citation." && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" sse stream before-restart message.delivered,agent.turn_completed'
        intent: "Save exact EventIDs and full delivered text from paged ListEvents and filtered SSE before restart"
      - open: /ws/${AFT_WS}/agents
      - click: { role: button, name: "+ Add agent", exact: true }
      - click: { testid: create-agent-template-lead }
      - fill: { testid: create-agent-name, value: "coverage-rs-other-${RUN_ID}" }
      - select: { testid: create-agent-backend, value: opencode }
      - wait:
          fn: >-
            (() => { const r=Array.from(document.querySelectorAll('[data-testid=create-agent-repo-chips] button'));
              return r.length===1 && r[0].textContent.includes('source-repo') && r[0].getAttribute('aria-pressed')==='true'; })()
        intent: "Show the same owned source repo for a distinct Lead"
      - click: { testid: create-agent-submit }
      - wait: { url: "/ws/${AFT_WS}/chat/agt_" }
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" claim other && "$AFT_SELECT_AGENT_MODEL"'
        intent: "Bind the independent UI-created Lead and selected real model"
      - fill: { label: Message, value: "OTHER_AGENT-${RUN_ID}: read README.md and give its exact filename in one sentence." }
        intent: "Create a real foreign-agent event oracle"
      - press: Enter
      - wait:
          fn: >-
            (() => { const t=document.querySelector('[data-testid=chat-transcript]');
              return t?.textContent.includes('OTHER_AGENT-${RUN_ID}') &&
                t.querySelectorAll('li[data-kind=agent]').length>0 &&
                document.querySelector('section[aria-label="Agent chat"] header')?.textContent?.includes('idle'); })()
        budget: 180000
        intent: "Show the second Agent's separate real reply"
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" capture other first && "$AFT_RESTART_SERVE"'
        intent: "Save the foreign Agent's EventIDs, then restart only the run-owned loom-local service"
      - open: /ws/${AFT_WS}/agents
      - click: { role: link, name: "coverage-rs-stream-${RUN_ID}" }
        intent: "Reopen the primary Lead through the Agents UI"
      - wait: { url: "/ws/${AFT_WS}/chat/agt_" }
      - wait:
          fn: >-
            (document.querySelector('[data-testid=chat-transcript]')?.textContent || '').includes('STREAM_ONE-${RUN_ID}')
        intent: "Show the primary history after service reconnect"
      - fill: { label: Message, value: "STREAM_TWO-${RUN_ID}: again use a tool to read README.md and name its documented test command with a file citation." }
        intent: "Send a second real request after restart"
      - press: Enter
      - wait:
          fn: >-
            (() => { const t=document.querySelector('[data-testid=chat-transcript]');
              return t?.textContent.includes('STREAM_ONE-${RUN_ID}') && t.textContent.includes('STREAM_TWO-${RUN_ID}') &&
                t.querySelectorAll('li[data-kind=agent]').length>=2 &&
                document.querySelector('section[aria-label="Agent chat"] header')?.textContent?.includes('idle'); })()
        budget: 180000
        intent: "Show both real exchanges in the restored Chat"
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" capture stream second && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" prefix stream first second && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" delivered stream second "STREAM_TWO-${RUN_ID}: again use a tool to read README.md and name its documented test command with a file citation." && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" sse stream after-restart message.delivered,agent.turn_completed first other'
        intent: "Compare cursor replay after restart to exact paged EventIDs, filtered kinds/Agent ID, and persisted full text"
      - reload: true
        intent: "Reload the primary Chat once more"
      - wait:
          fn: >-
            (() => { const t=document.querySelector('[data-testid=chat-transcript]');
              return t && Array.from(t.querySelectorAll('li[data-kind=user]')).filter(x=>x.textContent.includes('STREAM_ONE-${RUN_ID}')).length===1 &&
                Array.from(t.querySelectorAll('li[data-kind=user]')).filter(x=>x.textContent.includes('STREAM_TWO-${RUN_ID}')).length===1 &&
                t.querySelectorAll('li[data-kind=agent]').length>=2; })()
        intent: "Show one copy of each request and retained replies after a fresh UI reload"
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" capture stream reloaded && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" prefix stream second reloaded'
        intent: "Verify exact saved event prefix matches final visible Chat history"
