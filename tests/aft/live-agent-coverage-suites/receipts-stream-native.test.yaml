# LIVE paid OpenCode. MATRIX:S5/H6/L3, native-only service restart leg.
# The checked helper signals the exact OpenCode service PID inside the owned
# loom-local container. It never restarts loom serve or another compose stack.
suite: live-receipts-stream-native
classification: { area: agents, feature: real-opencode-native-recovery, surface: mixed, purpose: journey }
baseUrl: "${AFT_BASE_URL}"
setup: |
  set -eu
  python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" preflight
teardown: |
  set -eu
  python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" cleanup
tests:
  - name: LIVE native OpenCode process restarts during an active queued turn without duplicate input
    intent: A real Lead retains AgentID and NativeRef when only its owned OpenCode service restarts during a queued turn; the queued request delivers once, old history survives, and a fresh reply works.
    steps:
      - run: 'test -x "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-native.sh" && test -x "$AFT_SELECT_AGENT_MODEL"'
        intent: "Require a checked native-process helper and explicit real-model selection"
      - open: /ws/${AFT_WS}/agents
      - click: { role: button, name: "+ Add agent", exact: true }
      - click: { testid: create-agent-template-lead }
      - fill: { testid: create-agent-name, value: "coverage-rs-native-${RUN_ID}" }
      - select: { testid: create-agent-backend, value: opencode }
      - wait:
          fn: >-
            (() => { const r=Array.from(document.querySelectorAll('[data-testid=create-agent-repo-chips] button'));
              return r.length===1 && r[0].textContent.includes('source-repo') && r[0].getAttribute('aria-pressed')==='true'; })()
        intent: "Show the canonical owned repo selected"
      - click: { testid: create-agent-submit }
      - wait: { url: "/ws/${AFT_WS}/chat/agt_" }
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" claim native && "$AFT_SELECT_AGENT_MODEL"'
        intent: "Bind the exact UI-created Agent and select the real model"
      - fill: { label: Message, value: "NATIVE_FIRST-${RUN_ID}: read README.md with a tool and name its documented test command in one sentence." }
        intent: "Create an ordinary prior real turn"
      - press: Enter
      - wait:
          fn: >-
            (() => { const t=document.querySelector('[data-testid=chat-transcript]');
              return t?.textContent.includes('NATIVE_FIRST-${RUN_ID}') && t.querySelectorAll('li[data-kind=agent]').length>0 &&
                document.querySelector('section[aria-label="Agent chat"] header')?.textContent?.includes('idle'); })()
        budget: 180000
        intent: "Show the first real answer in saved Chat history"
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" capture native first && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" native native before'
        intent: "Save AgentID, registered NativeRef, exact native service PID and EventIDs before interruption"
      - fill: { label: Message, value: "Inspect README.md, BACKLOG.md, package.json, server.js and app.test.js with tools, then run npm test. Explain the message path with file citations. Keep files unchanged." }
        intent: "Start a naturally active real tool turn"
      - press: Enter
      - wait:
          fn: >-
            !!document.querySelector('[data-testid=working-row]') &&
            !!document.querySelector('[data-testid=tool-live], [data-testid=tool-call][data-status=running], [data-testid=tool-call][data-status=completed], [data-testid=tool-group]') &&
            !!document.querySelector('form button[title="Stop the running turn"]')
        budget: 120000
        intent: "Show an actual running OpenCode tool turn"
      - fill: { label: Message, value: "NATIVE_WAIT-${RUN_ID}: after the inspection, name the repository entry point exactly once." }
        intent: "Compose one queued follow-up"
      - press: Enter
      - wait:
          fn: >-
            (() => { const w=document.querySelectorAll('[data-testid=chat-transcript] li[data-kind=waiting]');
              return w.length===1 && w[0].textContent.includes('NATIVE_WAIT-${RUN_ID}'); })()
        intent: "Show one user-visible waiting message while the real turn runs"
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" capture native waiting && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" waiting native waiting "NATIVE_WAIT-${RUN_ID}: after the inspection, name the repository entry point exactly once." && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" native native interrupted restart'
        intent: "Save the queued slot and signal only the exact checked owned OpenCode service process"
      - wait:
          fn: >-
            (() => { const t=document.querySelector('[data-testid=chat-transcript]');
              return t && Array.from(t.querySelectorAll('li[data-kind=user]')).filter(x=>x.textContent.includes('NATIVE_WAIT-${RUN_ID}')).length===1 &&
                t.querySelectorAll('li[data-kind=agent]').length>=3 &&
                document.querySelector('section[aria-label="Agent chat"] header')?.textContent?.includes('idle'); })()
        budget: 180000
        intent: "Show the queued message delivered once and answered after native restart"
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" capture native resumed && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" prefix native first resumed && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" delivered native resumed "NATIVE_WAIT-${RUN_ID}: after the inspection, name the repository entry point exactly once." && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" native native after && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" native-compare native before after'
        intent: "Verify stable AgentID/NativeRef, changed native PID, exact history and one delivered input key"
      - reload: true
        intent: "Reload Chat after native recovery"
      - wait:
          fn: >-
            (() => { const t=document.querySelector('[data-testid=chat-transcript]');
              return t?.textContent.includes('NATIVE_FIRST-${RUN_ID}') && t.textContent.includes('NATIVE_WAIT-${RUN_ID}') &&
                Array.from(t.querySelectorAll('li[data-kind=user]')).filter(x=>x.textContent.includes('NATIVE_WAIT-${RUN_ID}')).length===1; })()
        intent: "Show old and queued messages once in reloaded history"
      - fill: { label: Message, value: "NATIVE_NEXT-${RUN_ID}: use a tool to read README.md again and name the file exactly." }
        intent: "Ask a fresh question on the recovered native session"
      - press: Enter
      - wait:
          fn: >-
            (() => { const t=document.querySelector('[data-testid=chat-transcript]');
              return t?.textContent.includes('NATIVE_NEXT-${RUN_ID}') && t.querySelectorAll('li[data-kind=agent]').length>=4 &&
                document.querySelector('section[aria-label="Agent chat"] header')?.textContent?.includes('idle'); })()
        budget: 180000
        intent: "Show the recovered OpenCode session answer a new real turn"
      - run: 'python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" capture native final && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" prefix native resumed final && python3 "$AFT_TESTS_DIR/scripts/coverage-receipts-stream-evidence.py" delivered native final "NATIVE_NEXT-${RUN_ID}: use a tool to read README.md again and name the file exactly."'
        intent: "Verify restored saved history, unique native input keys and exact next delivered text"
