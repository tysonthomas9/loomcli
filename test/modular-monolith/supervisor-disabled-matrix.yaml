schema_version: 1
suite: supervisor-disabled

rows:
  - id: deterministic-plan-coder
    phase: execution
    state: green
    owner: execution-reliability-lane
    coordinates:
      depth: end-to-end
      realness: deterministic
      provisioning: compose
      polarity: positive-and-negative
      target: loom-serve-prompt-agent-plane
    env:
      LOCAL_MODE_COMPOSE_FILES: test/local-mode/docker-compose.workflow-build.yml
      LOCAL_MODE_COMPOSE_UP_FLAGS: --build -d
    setup:
      - id: clean-project
        argv: [make, local-mode-down]
        timeout_seconds: 180
      - id: workflow-toolchain
        argv: [make, local-mode-workflow-build-check]
        timeout_seconds: 120
      - id: stack
        argv: [make, local-mode-up]
        timeout_seconds: 900
    verify:
      - id: deterministic-evidence
        argv: [make, local-mode-verify]
        timeout_seconds: 300
      - id: phase6-parity
        argv: [make, test-phase6-parity]
        timeout_seconds: 900
    teardown:
      - id: cleanup-stack
        argv: [make, local-mode-down]
        timeout_seconds: 180
    assertions:
      - prompt-agent-plane-default
      - task-ready-events-default
      - zero-auto-agentdefs
      - zero-daemon-processes
      - zero-daemon-sockets
      - public-api-plan-agent
      - public-api-task-agent
      - planner-review-design
      - coder-completion
      - planner-transcript
      - coder-transcript
      - coder-diff
      - stale-timeout-and-launch-heartbeats
      - explicit-task-type-arbitration
      - preflight-retry-recovery-concurrency-epic
      - periodic-desired-state-reconciliation
      - canonical-agentdef-migration
      - legacy-supervisor-paths-retired
