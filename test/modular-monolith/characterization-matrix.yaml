schema_version: 1
suite: modular-monolith-phase1-characterization
description: >-
  Behavior-preserving tests that must remain green while the modular-monolith
  migration changes package ownership and runtime composition.
rows:
  - id: workflow-approval
    package: ./internal/driver
    test_regex: '^TestVersionScopedApprovalDoesNotTrustSiblingVersions$'
    expected_tests:
      - TestVersionScopedApprovalDoesNotTrustSiblingVersions
    timeout: 2m
    expected_behavior:
      - Approval grants trust only to the selected workflow version, never to a sibling version.
      - Activation preserves existing approval metadata and does not implicitly approve the activated version.
      - Unapproval removes the selected version's approval.

  - id: trigger-admission
    package: ./internal/trigger
    test_regex: '^TestInternalSource(EmitValidation|HopDepthChainAndCap|IdempotentReEmit)$'
    expected_tests:
      - TestInternalSourceHopDepthChainAndCap
      - TestInternalSourceEmitValidation
      - TestInternalSourceIdempotentReEmit
    timeout: 2m
    expected_behavior:
      - Invalid or forged internal events fail admission without persisting events or creating runs.
      - A trigger chain is admitted through the configured hop-depth cap and is then dropped with auditable evidence.
      - Re-emitting the same event ID is idempotent and creates exactly one event and one run.

  - id: agent-provisioning
    package: ./internal/webui/handlers/agents
    test_regex: '^TestPromptAgentCreate(TransactionCreatesRecordBindingAndRole|WithoutBuildToolchainFailsAtomically|BindingFailureDeletesAgentRecord)$'
    expected_tests:
      - TestPromptAgentCreateTransactionCreatesRecordBindingAndRole
      - TestPromptAgentCreateWithoutBuildToolchainFailsAtomically
      - TestPromptAgentCreateBindingFailureDeletesAgentRecord
    timeout: 2m
    expected_behavior:
      - Successful prompt-agent provisioning creates its role, agent-service record, and attached binding with the requested configuration.
      - Build preflight failure persists no role, agent-service record, or binding.
      - Binding failure compensates the partially created agent-service record.

  - id: execution-recovery
    package: ./internal/driver
    test_regex: '^TestStaleTaskSweeperRunOnce$'
    expected_tests:
      - TestStaleTaskSweeperRunOnce
    timeout: 2m
    expected_behavior:
      - Stale task runs belonging to running driver runs are failed with the stale_task_run classification and a finished timestamp.
      - Fresh task runs and task runs whose driver is not running remain untouched.
      - The default recovery threshold is twenty minutes and workspace scoping is preserved.

  - id: supervisor-policy
    package: ./internal/cli/daemon/supervisor
    test_regex: '^TestShouldRestart_(Exhaustion_BlocksThenFreshBurst|BlockBudgetEscalatesToFastFail|FastFailClasses|Fatal_StillStops_NotBlocked)$'
    expected_tests:
      - TestShouldRestart_Exhaustion_BlocksThenFreshBurst
      - TestShouldRestart_BlockBudgetEscalatesToFastFail
      - TestShouldRestart_FastFailClasses
      - TestShouldRestart_Fatal_StillStops_NotBlocked
    timeout: 2m
    expected_behavior:
      - Transient restart exhaustion enters a bounded block cycle and then receives a fresh retry budget.
      - Repeated unknown failures escalate after the finite block budget instead of blocking forever.
      - Deterministic and fatal error classes stop immediately and are never converted into a block.
