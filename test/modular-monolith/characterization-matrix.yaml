schema_version: 1
suite: modular-monolith-phase1-characterization
description: >-
  Behavior-preserving tests that must remain green while the modular-monolith
  migration changes package ownership and runtime composition.
rows:
  - id: workflow-approval
    package: ./internal/modules/workflowcatalog
    test_regex: '^TestVersionScopedApprovalDoesNotTrustSiblingVersions$'
    expected_tests:
      - TestVersionScopedApprovalDoesNotTrustSiblingVersions
    timeout: 2m
    expected_behavior:
      - Approval grants trust only to the selected workflow version, never to a sibling version.
      - Activation requires prior approval and preserves every existing version-scoped approval.
      - Unapproval removes only the selected version's approval.

  - id: trigger-admission
    package: ./internal/modules/automation
    test_regex: '^Test(WorkflowAdmissionDerivesRunActorParentHopAndIgnoresForgedFields|WorkflowAdmissionReplaySurvivesOwnerHandoff|WorkflowHopCapDropsBeforeMatchingOrReservation)$'
    expected_tests:
      - TestWorkflowAdmissionDerivesRunActorParentHopAndIgnoresForgedFields
      - TestWorkflowAdmissionReplaySurvivesOwnerHandoff
      - TestWorkflowHopCapDropsBeforeMatchingOrReservation
    timeout: 2m
    expected_behavior:
      - Workflow event identity is derived from verified Execution ownership; forged fields are ignored and invalid authority fails before persistence.
      - A trigger chain is admitted through the configured hop-depth cap, then drops before matching, reservation, catalog lookup, or dispatch.
      - Re-emitting the same event ID after an owner handoff replays exactly one durable event, reservation, and dispatch.

  - id: agent-provisioning
    package: ./internal/webui/handlers/agents
    test_regex: '^TestPromptAgentCreate(TransactionCreatesRecordBindingAndRole|WithoutBuildToolchainFailsAtomically|BindingFailureRetainsCommittedAgentForRecovery)$'
    expected_tests:
      - TestPromptAgentCreateTransactionCreatesRecordBindingAndRole
      - TestPromptAgentCreateWithoutBuildToolchainFailsAtomically
      - TestPromptAgentCreateBindingFailureRetainsCommittedAgentForRecovery
    timeout: 2m
    expected_behavior:
      - Successful prompt-agent provisioning creates its role, agent-service record, and attached binding with the requested configuration.
      - Build preflight failure persists no role, agent-service record, or binding.
      - Binding failure retains the durable agent-service step so provisioning recovery can resume without duplicating prior work.

  - id: execution-recovery
    package: ./internal/modules/execution
    test_regex: '^Test(OwnedStaleTaskRunRecovery(UsesExactParentOwnerAndSafeCutoff|DefaultsAndRejectsMissingOwner)|RecoverStaleChildTaskRunsIsBoundToExactParentOwnerAndReplays)$'
    expected_tests:
      - TestOwnedStaleTaskRunRecoveryUsesExactParentOwnerAndSafeCutoff
      - TestOwnedStaleTaskRunRecoveryDefaultsAndRejectsMissingOwner
      - TestRecoverStaleChildTaskRunsIsBoundToExactParentOwnerAndReplays
    timeout: 2m
    expected_behavior:
      - Recovery is bound to the exact live parent DriverRun owner and rejects foreign, stale, or incomplete ownership.
      - Recovery uses a deterministic replay-safe request and preserves the stale_task_run classification.
      - The default recovery threshold is twenty minutes, and forward or backward wall-clock jumps cannot create an unsafe cutoff.

  - id: agent-retry-policy
    package: ./internal/agentpolicy
    test_regex: '^TestDecide_(Golden|DeterministicNeverBlocks)$'
    expected_tests:
      - TestDecide_Golden
      - TestDecide_DeterministicNeverBlocks
    timeout: 2m
    expected_behavior:
      - Auth and billing failures stop fatally, deterministic failures fast-fail or exhaust failover, and transient failures remain retryable.
      - Deterministic failures and unknown failures can never select an unbounded block.

  - id: runtime-host-recovery
    package: ./internal/platform/runtime
    test_regex: '^TestHost(OwnsTimeoutAndCappedFailureBackoff|IsolatesPanickingAndHealthyComponents)$'
    expected_tests:
      - TestHostOwnsTimeoutAndCappedFailureBackoff
      - TestHostIsolatesPanickingAndHealthyComponents
    timeout: 2m
    expected_behavior:
      - Component timeouts use capped failure backoff and a successful pass resets consecutive failure state.
      - A panicking component is degraded without preventing healthy runtime components from continuing.
