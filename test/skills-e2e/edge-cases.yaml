version: 1
scenarios:
  - id: skill-update-roundtrip
    behavior: an update selects and materializes the exact new revision
    test: TestSkillUpdateSelectsAndMaterializesExactRevision

  - id: stable-identical-reimport
    behavior: importing identical content retains the content revision
    test: TestIdenticalSkillReimportKeepsContentRevision

  - id: content-update-preserves-bundles
    behavior: updating only Skill content preserves every bundled file
    test: TestSkillContentUpdatePreservesBundledFiles

  - id: rematerialization-prunes-stale-files
    behavior: rematerialization removes files absent from the selected revision
    test: TestSkillRematerializationRemovesStaleFiles

  - id: deletion-prunes-materialization
    behavior: deleting a Skill prunes it from an existing materialization
    test: TestSkillDeletionPrunesExistingMaterialization

  - id: list-show-revision-agreement
    behavior: public list and show results report the same selected revision
    test: TestSkillListReportsSelectedRevision

cases:
  - id: 1
    behavior: binary bytes and executable mode round-trip exactly
    owner: loom
    seam: loom-fleet-e2e
    scenario: skill-update-roundtrip
    backends: [redis]
    providers: [minio]
    status: covered
    rationale: the materialized tree is compared byte-for-byte and mode-for-mode

  - id: 2
    behavior: a zero-byte bundled file round-trips exactly
    owner: loom
    seam: loom-fleet-e2e
    scenario: skill-update-roundtrip
    backends: [redis]
    providers: [minio]
    status: covered
    rationale: the fixture contains empty.dat and the exact tree comparison requires zero bytes

  - id: 3
    behavior: nested slash-separated paths round-trip exactly
    owner: loom
    seam: loom-fleet-e2e
    scenario: skill-update-roundtrip
    backends: [redis]
    providers: [minio]
    status: covered
    rationale: the fixture requires exact nested docs, assets, and scripts paths

  - id: 12
    behavior: non-root files retain arbitrary bytes and executable mode
    owner: loom
    seam: loom-fleet-e2e
    scenario: skill-update-roundtrip
    backends: [redis]
    providers: [minio]
    status: covered
    rationale: binary and executable non-root files are checked against literal fixtures

  - id: 15
    behavior: updating Skill content selects and materializes a new tree revision
    owner: loom
    seam: loom-fleet-e2e
    scenario: skill-update-roundtrip
    backends: [redis]
    providers: [minio]
    status: covered
    rationale: two public imports require different revisions and the second literal revision is selected
