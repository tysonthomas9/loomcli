# Local-mode dogfood stack.
#
# One command from the repo root:
#   make local-mode-up
#
# Host URLs:
#   UI:  http://localhost:8283/ws/LOCALMODE/kanban
#   API: http://localhost:8282

name: ${LOCAL_MODE_COMPOSE_PROJECT:-loomcli-local-mode}

networks:
  local-mode:
    driver: bridge

volumes:
  redis-data:
    driver: local
  loom-data:
    driver: local
  loom-workspace:
    driver: local
  # Durable artifact-content blobs (transcripts, logs, patches). fleet-db's
  # filesystem content store writes here; without a volume the blobs die on
  # container rebuild while their redis metadata survives, so a run's transcript
  # 500s "failed to load" after any fleet-db rebuild (#30).
  fleetdb-artifacts:
    driver: local

services:
  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks: [local-mode]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20

  fleet-db:
    image: ${LOCAL_MODE_FLEETDB_IMAGE:-loomcli-local-mode-fleet-db:latest}
    build:
      context: ${LOCAL_MODE_FLEETDB_SOURCE_ROOT:-../../../fleet-db}
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    # Run as root in local-mode ONLY so the artifact-content volume below is
    # writable (the distroless image is nonroot UID 65532; a named volume is
    # root-owned and docker-compose does not honor podman's :U chown). The
    # explicit content dir removes any dependency on $HOME/UserCacheDir.
    user: "0:0"
    environment:
      # fleet-db requires an explicit artifact content backend when issue-design
      # storage is artifact-backed (v5 DYNAMIC-WORKFLOWS-18). local keeps the
      # dogfood stack self-contained; without it fleet-db exits on startup.
      FLEETDB_ARTIFACT_CONTENT_BACKEND: local
      FLEETDB_ARTIFACT_CONTENT_DIR: /var/lib/fleetdb/artifacts
      # Local-mode exercises the production authentication and authorization
      # path. This deterministic bootstrap credential is a checked-in test
      # fixture for this disposable, loopback-bound stack only; never reuse it
      # for a shared or production FleetDB deployment.
      FLEET_AUTH_ENABLED: "true"
      FLEET_AUTH_DEV_MODE: "false"
      FLEET_AUTHZ_ENABLED: "true"
      # Phase 3 local-mode proof must advertise and exercise the complete
      # Automation contract; Loom composes this slice by default alongside
      # Workflow Catalog and fails readiness when Fleet leaves it disabled.
      FLEET_AUTOMATION_TRIGGER_ADMISSION_ENABLED: "true"
      FLEET_AUTH_BOOTSTRAP_ADMIN_ACTOR: "${LOCAL_MODE_FLEETDB_ADMIN_ACTOR:-local-mode-harness@fixture.local}"
      FLEET_AUTH_BOOTSTRAP_ADMIN_KEY: "${LOCAL_MODE_FLEETDB_API_KEY:-loom-local-mode-test-only-admin-key-v1}"
    command:
      - "--redis-addr"
      - "redis:6379"
      - "--addr"
      - ":8080"
    networks: [local-mode]
    volumes:
      - fleetdb-artifacts:/var/lib/fleetdb/artifacts
    ports:
      - "127.0.0.1:${LOCAL_MODE_FLEETDB_PORT:-8280}:8080"

  loom-local:
    image: ${LOCAL_MODE_LOOM_IMAGE:-loomcli-local-mode-loom:latest}
    build:
      context: ../..
      dockerfile: test/local-mode/Dockerfile
    depends_on:
      fleet-db:
        condition: service_started
    environment:
      HOME: /root
      LOOM_CONFIG_DIR: /root/.loom
      LOOM_WORKSPACE: LOCALMODE
      # Unscope the driver-run executor + task worker from LOOM_WORKSPACE so they
      # claim queued runs in EVERY workspace (e.g. SANDBOX cron fires), matching
      # the always-unscoped CronScheduler. "*" is the documented sentinel; unset
      # would inherit LOOM_WORKSPACE and leave SANDBOX runs queued forever.
      LOOM_DRIVER_EXECUTOR_WORKSPACE: "*"
      LOOM_ISSUE_BACKEND: fleetdb
      LOOM_FLEET_DB_URL: http://fleet-db:8080
      LOOM_FLEET_URL: http://fleet-db:8080
      # The Store/capability clients and the legacy fleet adapter resolve
      # different environment aliases; both must authenticate as the same
      # bootstrap admin in this test profile.
      LOOM_FLEET_DB_API_KEY: "${LOCAL_MODE_FLEETDB_API_KEY:-loom-local-mode-test-only-admin-key-v1}"
      LOOM_FLEET_API_KEY: "${LOCAL_MODE_FLEETDB_API_KEY:-loom-local-mode-test-only-admin-key-v1}"
      LOOM_FLEETDB_REDIS_URL: redis:6379
      LOOM_FLEET_DB_ACTOR: "${LOCAL_MODE_FLEETDB_ADMIN_ACTOR:-local-mode-harness@fixture.local}"
      LOOM_FLEET_ACTOR: "${LOCAL_MODE_FLEETDB_ADMIN_ACTOR:-local-mode-harness@fixture.local}"
      # This profile is the product proof for the Workflow Catalog slice; do
      # not make auth migration pass by disabling the capability.
      LOOM_WORKFLOW_CATALOG_ENABLED: "true"
      LOOM_AUTOMATION_ENABLED: "true"
      LOOM_BACKEND: localdogfood
      LOOM_SERVER_URL: http://127.0.0.1:8080
      LOOM_WEBUI_URL: http://127.0.0.1:8080
      LOCAL_MODE_API_URL: "http://localhost:${LOCAL_MODE_API_PORT:-8282}"
      LOCAL_MODE_UI_URL: "http://localhost:${LOCAL_MODE_UI_PORT:-8283}"
      LOCAL_MODE_CHECKOUT_ID: "${LOCAL_MODE_CHECKOUT_ID:?LOCAL_MODE_CHECKOUT_ID is required}"
      LOCAL_MODE_SOURCE_ROOT: "${LOCAL_MODE_SOURCE_ROOT:?LOCAL_MODE_SOURCE_ROOT is required}"
      LOCAL_MODE_COMPOSE_PROJECT: "${LOCAL_MODE_COMPOSE_PROJECT:?LOCAL_MODE_COMPOSE_PROJECT is required}"
      LOCAL_MODE_RUN_ID: "${LOCAL_MODE_RUN_ID:?LOCAL_MODE_RUN_ID is required}"
      # File-browser routes fail closed unless the loopback frontend origin
      # is explicitly allowed; Caddy preserves the browser's Host header.
      LOOM_FRONTEND_URL: "http://localhost:${LOCAL_MODE_UI_PORT:-8283},http://127.0.0.1:${LOCAL_MODE_UI_PORT:-8283}"
      LOOM_LOCAL_MODE_STEP_DELAY: "2"
      # Emit task.ready internal events when a task becomes ready, so a
      # prompt-agent binding on internal.task.ready fires on task creation
      # (Phase 4 prompt-agent packaging, ITEM E). Default-off elsewhere.
      LOOM_TASK_READY_EVENTS: "1"
      # Agent-plane selector (WS2c, Decision 5 — OPT-IN, default unchanged).
      # Unset seeds the Go role agents (planner/coder). Set to run the TS/workflow
      # plane uncontested (interim two-plane arbitration):
      #   LOOM_LOCAL_MODE_PLANE=ts make local-mode-up
      LOOM_LOCAL_MODE_PLANE: "${LOOM_LOCAL_MODE_PLANE:-}"
    labels:
      com.loom.local-mode.checkout-id: "${LOCAL_MODE_CHECKOUT_ID:?LOCAL_MODE_CHECKOUT_ID is required}"
      com.loom.local-mode.project: "${LOCAL_MODE_COMPOSE_PROJECT:?LOCAL_MODE_COMPOSE_PROJECT is required}"
      com.loom.local-mode.run-id: "${LOCAL_MODE_RUN_ID:?LOCAL_MODE_RUN_ID is required}"
    networks: [local-mode]
    ports:
      - "${LOCAL_MODE_API_PORT:-8282}:8080"
    volumes:
      - loom-data:/root/.loom
      - loom-workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/config > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  ui-local:
    image: docker.io/library/caddy:2-alpine
    depends_on:
      loom-local:
        condition: service_started
    environment:
      FRONTEND_PORT: "8080"
      LOOM_UPSTREAM: http://loom-local:8080
    ports:
      - "${LOCAL_MODE_UI_PORT:-8283}:8080"
    networks: [local-mode]
    volumes:
      - ../fleetdb/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../internal/webui/frontend/dist:/srv:ro
