# Daytona host-broker override for the local-mode dogfood stack.
#
# The daemon leaf remains the normal local runner. Daytona is selected by a
# workflow TaskRun, which carries the exact lease/fence required by the private
# host operation. Save provider credentials through Settings after startup;
# Compose never injects them into the runner or container environment.
#
# Usage:
#   podman compose -f test/local-mode/docker-compose.yml \
#     -f test/local-mode/docker-compose.daytona.yml up

services:
  loom-local:
    image: ${LOCAL_MODE_LOOM_CODEX_IMAGE:-loomcli-local-mode-loom-codex:latest}
    build:
      args:
        INSTALL_CODEX: "true"
        CODEX_CLI_VERSION: "${LOCAL_MODE_CODEX_CLI_VERSION:-latest}"
    environment:
      LOOM_BACKEND: codex
      LOOM_LOCAL_MODE_BACKEND: codex
      LOOM_LOCAL_MODE_PLAN_AGENT: codex-planner
      LOOM_LOCAL_MODE_CODE_AGENT: codex-coder
      # Flue and the Daytona SDK arrive through the workflow-build overlay.
      # No provider credential is admitted through Compose.
    volumes:
      - ${LOCAL_MODE_CODEX_HOME:-${HOME}/.codex}:/codex-host:ro
