# docker-compose.regression.yml — fleet-db regression stack for manual and
# automated regression validation after reference removal.
#
# Brings up:
#   - redis         shared Redis for fleet-db (port 6379, host not exposed)
#   - fleet-db      fleet-db server on :8080 (exposed as :8080 on host)
#   - loom-fleet    loomcli serve with LOOM_ISSUE_BACKEND=fleet-db pointing at
#                   fleet-db (host :8082)
#   - ui-fleet      Caddy frontend sidecar on :8083
#   - fleetdb-regression-seed-fleet one-shot seeder that populates fleet-db fixtures
#
# Usage (from loomcli repo root):
#   make fleetdb-regression-up
#   # open http://localhost:8082 (API) or http://localhost:8083 (UI)
#   make fleetdb-regression-down
#
# Prefer the make targets over raw `docker compose`: they build the gitignored
# Web UI bundle first. Without it the UI sidecar bind-mounts a directory Docker
# silently creates empty, and http://localhost:8083 serves 404 with no error
# anywhere. The seeder runs automatically on `up`; to re-seed, use
#   docker compose -f test/fleetdb/docker-compose.regression.yml run --rm fleetdb-regression-seed-fleet
#
# Build contexts are relative to this compose file's directory. The
# fleet-db context is the sibling repo next to loomcli (accessed as
# ../../../fleet-db from this file).
#
# Requires docker compose >= 2.22: the seeder declares a `service:` named build
# context (see fleetdb-regression-seed-fleet below), which is not known to be
# supported by podman-compose or `podman compose`. The make targets keep those
# fallbacks for parity with the empty stack, but on a podman engine the seeder
# build falls back to resolving the bare image tag and fails with `pull access
# denied` — the exact defect the named context exists to prevent.

name: loomcli-fleetdb-regression

networks:
  fleetdb-regression:
    driver: bridge

volumes:
  redis-data:
    driver: local
  codex-runtime:
    driver: local

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks: [fleetdb-regression]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20

  fleet-db:
    image: loomcli-fleetdb-regression-fleet-db:latest
    build:
      context: ../../../fleet-db
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FLEETDB_REDIS_ADDR: redis:6379
      FLEETDB_BIND: ":8080"
    # ENTRYPOINT is already `fleet-db`; command: is args.
    # -addr is the HTTP listen address. We leave -auth-enabled=true
    # because fleet-db's admin endpoints (workspace create/list) are
    # gated BEHIND auth and are unreachable without it. --auth-dev-mode
    # accepts the X-Actor request header as the authenticated identity,
    # which seed.sh + loom-fleet both provide.
    command:
      - "--redis-addr"
      - "redis:6379"
      - "--addr"
      - ":8080"
      - "--auth-dev-mode"
      - "--authz-enabled=false"
      # The browser regression suite drives two tabs against the same
      # fleet-db instance and intentionally fans out route probes. Rate
      # limiting is covered in fleet-db's own tests; keep this stack focused
      # on UI routing/rendering parity.
      - "--rate-limit-enabled=false"
    networks: [fleetdb-regression]
    ports:
      - "8080:8080"
    # NOTE: fleet-db's container image is distroless (no shell, no wget,
    # no curl). In-container healthchecks aren't viable. Liveness is
    # gated externally: `loom-fleet`'s startup script wgets
    # http://fleet-db:8080/healthz up to 30 times before exec'ing
    # `loom serve`, so a broken fleet-db cascades to a loom-fleet exit.
    # The Playwright preflight (Step 4) double-checks the routing path.

  loom-fleet:
    build:
      context: ../..
      dockerfile: test/fleetdb/Dockerfile.regression
    depends_on:
      fleet-db:
        condition: service_started
    environment:
      LOOM_ISSUE_BACKEND: fleet-db
      LOOM_FLEET_URL: http://fleet-db:8080
      LOOM_WORKSPACE: FLEETDB
      # This UI/store regression disables FleetDB authorization and does not
      # prove the Workflow Catalog lifecycle capability.
      LOOM_WORKFLOW_CATALOG_ENABLED: "false"
      LOOM_BACKEND: codex
      CODEX_HOME: /root/.codex
      LOOM_AGENT_NAME: fleetdb-regression-harness
      # X-Actor header required by fleet-db's --auth-dev-mode (the only auth
      # path enabled in this compose). Falls back to LOOM_AGENT_NAME, but
      # being explicit avoids a surprise if someone unsets the agent name.
      #
      LOOM_FLEET_ACTOR: fleetdb-regression-harness@fixture.local
      LOOM_FLEET_DB_ACTOR: fleetdb-regression-harness@fixture.local
      # Fail fast if loom boots thinking it has a local reference backend.
      # Any fallback to an embedded reference path in fleet mode should surface
      # as a startup error, not a silent re-route.
      LOOM_FLEET_REQUIRED: "1"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        cd /workspace
        mkdir -p "$$CODEX_HOME"
        if [ -f /run/secrets/codex-auth.json ]; then
          cp /run/secrets/codex-auth.json "$$CODEX_HOME/auth.json"
          chmod 600 "$$CODEX_HOME/auth.json" || true
        fi
        # Pre-flight: confirm fleet-db is reachable from inside this
        # container before starting loom. If fleet-db isn't responding,
        # stop now rather than letting loom come up with a broken backend.
        echo "[loom-fleet] checking fleet-db reachability at $$LOOM_FLEET_URL ..."
        for i in $$(seq 1 30); do
          if wget -qO- "$$LOOM_FLEET_URL/healthz" > /dev/null 2>&1; then
            echo "[loom-fleet] fleet-db OK"
            break
          fi
          echo "[loom-fleet] waiting for fleet-db ($$i/30)"
          sleep 1
        done
        wget -qO- "$$LOOM_FLEET_URL/healthz" > /dev/null || { echo "[loom-fleet] FATAL: fleet-db unreachable"; exit 1; }

        # Bootstrap a minimal git repo + FLEETDB loom workspace so the
        # webui has something to render.
        if [ ! -d .git ]; then
          git init -q -b main
          git config user.email "fleetdb-regression@fixture.local"
          git config user.name  "fleetdb-regression"
          echo "initial" > .init
          echo "# FleetDB Regression Fixture" > README.md
          git add .init
          git add README.md
          git commit -q -m "initial"
        fi
        loom workspace create FLEETDB --repos /workspace 2>&1 | tail -3 || true

        exec loom serve --bind 0.0.0.0 --port 8080
    networks: [fleetdb-regression]
    ports:
      - "8082:8080"
    volumes:
      - codex-runtime:/root/.codex
      - type: bind
        source: ${CODEX_AUTH_JSON:-${HOME}/.codex/auth.json}
        target: /run/secrets/codex-auth.json
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/config > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ──────────────────────────────────────────────────────────────────
  # Frontend-serving sidecars. loom serve is API-only (Dockerfile.regression
  # intentionally omits Node + the frontend build), so Playwright can't
  # render any SPA route directly against loom-fleet. Caddy
  # instance below serves the prebuilt React dist mounted from the host
  # and reverse-proxies /api/*, /healthz, /sse/* to its loom backend.
  # FLEETDB_FLEET_URL in playwright.config can either point at this sidecar
  # (8083) for full UI-rendering tests, or at raw loom port 8082 for API-only specs.
  # ──────────────────────────────────────────────────────────────────
  ui-fleet:
    image: docker.io/library/caddy:2-alpine
    depends_on:
      loom-fleet:
        condition: service_started
    environment:
      FRONTEND_PORT: "8080"
      LOOM_UPSTREAM: http://loom-fleet:8080
    ports:
      - "8083:8080"
    networks: [fleetdb-regression]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../internal/webui/frontend/dist:/srv:ro

  # Fleet-db-only seeder for browser regression mode.
  fleetdb-regression-seed-fleet:
    image: loomcli-fleetdb-regression_fleetdb-regression-seed-fleet
    build:
      context: .
      dockerfile: Dockerfile.seed
      # Makes the fleet-db service image a build-time dependency so `fdb` can be
      # copied out of it. Referencing the tag from a FROM line instead races the
      # parallel build and falls through to a registry pull (`pull access denied`).
      additional_contexts:
        fdb-source: "service:fleet-db"
    depends_on:
      fleet-db:
        condition: service_started
      loom-fleet:
        condition: service_started
    environment:
      FLEET_URL: http://fleet-db:8080
      FLEET_WORKSPACE: FLEETDB
    networks: [fleetdb-regression]
    volumes:
      - ./seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    restart: "no"
