# docker-compose.parity.yml — side-by-side beads vs fleet-db for manual
# and automated parity validation.
#
# Brings up:
#   - redis         shared Redis for fleet-db (port 6379, host not exposed)
#   - fleet-db      fleet-db server on :8080 (exposed as :8080 on host)
#   - loom-beads    loomcli serve with LOOM_ISSUE_BACKEND=beads (host :8081)
#   - loom-fleet    loomcli serve with LOOM_ISSUE_BACKEND=fleet pointing at
#                   fleet-db (host :8082)
#   - parity-seed   one-shot seeder that populates identical fixtures into
#                   both backends, then exits
#
# Usage (from loomcli repo root):
#   docker compose -f test/parity/docker-compose.parity.yml up --build -d
#   docker compose -f test/parity/docker-compose.parity.yml run --rm parity-seed
#   # open http://localhost:8081 (beads) and http://localhost:8082 (fleet)
#   docker compose -f test/parity/docker-compose.parity.yml down -v
#
# Build contexts are relative to this compose file's directory. The
# fleet-db context is the sibling repo ~/codebase/fleet-db (accessed as
# ../../../fleet-db here).

name: loomcli-parity

networks:
  parity:
    driver: bridge

volumes:
  # bd's SQLite lives in loom-beads container; keep ephemeral per-run so
  # each compose up starts fresh. Uncomment to persist across up/down:
  # beads-data:
  #   driver: local
  redis-data:
    driver: local

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks: [parity]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20

  fleet-db:
    build:
      # Sibling repo at ../../../../fleet-db (loomcli is at /codebase/2/loomcli/;
      # fleet-db is at /codebase/fleet-db/ → 4 levels up from this file).
      context: ../../../../fleet-db
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FLEETDB_REDIS_ADDR: redis:6379
      FLEETDB_BIND: ":8080"
    # ENTRYPOINT is already `fleet-db`; command: is args.
    # -addr is the HTTP listen address. We leave -auth-enabled=true
    # because fleet-db's admin endpoints (workspace create/list) are
    # gated BEHIND auth and are unreachable without it. --auth-dev-mode
    # accepts the X-Actor request header as the authenticated identity,
    # which seed.sh + loom-fleet both provide.
    command:
      - "--redis-addr"
      - "redis:6379"
      - "--addr"
      - ":8080"
      - "--auth-dev-mode"
      - "--authz-enabled=false"
    networks: [parity]
    ports:
      - "8080:8080"
    # NOTE: fleet-db's container image is distroless (no shell, no wget,
    # no curl). In-container healthchecks aren't viable. Liveness is
    # gated externally: `loom-fleet`'s startup script wgets
    # http://fleet-db:8080/healthz up to 30 times before exec'ing
    # `loom serve`, so a broken fleet-db cascades to a loom-fleet exit.
    # The Playwright preflight (Step 4) double-checks the routing path.

  loom-beads:
    build:
      context: ../..
      dockerfile: test/parity/Dockerfile.parity
    environment:
      LOOM_ISSUE_BACKEND: beads
      BD_ACTOR: parity-harness
      # Must NOT be set on this service — if LOOM_FLEET_URL is defined
      # here, a misconfigured resolver could flip the backend to fleet
      # silently. We deliberately leave it unset so a fallback is loud.
    # bd serve path: init a workspace on startup, then loom serve.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        cd /workspace
        if [ ! -d .beads ]; then
          git init -q
          git config user.email "parity-harness@fixture.local"
          git config user.name  "parity-harness"
          bd init
        fi
        bd daemon start &
        exec loom serve --bind 0.0.0.0 --port 8080
    networks: [parity]
    ports:
      - "8081:8080"
    healthcheck:
      # /api/config only reports {"mode":"open"} on this loom build — no
      # issue_backend field. Backend selection is verified by the Playwright
      # preflight via other channels (env var inspection, network probe to
      # fleet-db, etc.). Healthcheck is just liveness here.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/config > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    # volumes:
    #   - beads-data:/workspace

  loom-fleet:
    build:
      context: ../..
      dockerfile: test/parity/Dockerfile.parity
    depends_on:
      fleet-db:
        condition: service_healthy
    environment:
      LOOM_ISSUE_BACKEND: fleet
      LOOM_FLEET_URL: http://fleet-db:8080
      # The fleet backend's URL builder uses LOOM_FLEET_WORKSPACE (not
      # LOOM_WORKSPACE) — without this, requests go to .../workspaces/default/
      # and 404 because fleet-db has no "default" workspace seeded.
      LOOM_FLEET_WORKSPACE: PARITY
      LOOM_WORKSPACE: PARITY
      LOOM_AGENT_NAME: parity-harness
      # X-Actor header required by fleet-db's --auth-dev-mode (the only auth
      # path enabled in this compose). Falls back to LOOM_AGENT_NAME, but
      # being explicit avoids a surprise if someone unsets the agent name.
      LOOM_FLEET_ACTOR: parity-harness
      # Fail fast if loom boots thinking it has a local beads backend.
      # Any fallback to an embedded beads path in fleet mode should surface
      # as a startup error, not a silent re-route.
      LOOM_FLEET_REQUIRED: "1"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        cd /workspace
        # Pre-flight: confirm fleet-db is reachable from inside this
        # container before starting loom. If fleet-db isn't responding,
        # stop now rather than letting loom come up with a broken backend.
        echo "[loom-fleet] checking fleet-db reachability at $$LOOM_FLEET_URL ..."
        for i in $$(seq 1 30); do
          if wget -qO- "$$LOOM_FLEET_URL/healthz" > /dev/null 2>&1; then
            echo "[loom-fleet] fleet-db OK"
            break
          fi
          echo "[loom-fleet] waiting for fleet-db ($$i/30)"
          sleep 1
        done
        wget -qO- "$$LOOM_FLEET_URL/healthz" > /dev/null || { echo "[loom-fleet] FATAL: fleet-db unreachable"; exit 1; }

        # Bootstrap a minimal git repo + PARITY loom workspace so the
        # webui has something to render. loom-beads does this implicitly
        # via `bd init` + the auto-registered workspace; loom-fleet needs
        # it explicit because there's no beads daemon to piggy-back on.
        if [ ! -d .git ]; then
          git init -q
          git config user.email "parity@fixture.local"
          git config user.name  "parity"
          echo "initial" > .init
          git add .init
          git commit -q -m "initial"
        fi
        loom workspace create PARITY --repos /workspace 2>&1 | tail -3 || true

        exec loom serve --bind 0.0.0.0 --port 8080
    networks: [parity]
    ports:
      - "8082:8080"
    healthcheck:
      # See loom-beads healthcheck note. Backend verification is in the
      # Playwright preflight, not this healthcheck.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/config > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ──────────────────────────────────────────────────────────────────
  # Frontend-serving sidecars. loom serve is API-only (Dockerfile.parity
  # intentionally omits Node + the frontend build), so Playwright can't
  # render any SPA route directly against loom-{beads,fleet}. Each Caddy
  # instance below serves the prebuilt React dist mounted from the host
  # and reverse-proxies /api/*, /healthz, /sse/* to its loom backend.
  # PARITY_BEADS_URL / PARITY_FLEET_URL in playwright.config can either
  # point at these sidecars (8083/8084) for full UI-rendering tests, or
  # at the raw loom ports (8081/8082) for API-only specs.
  # ──────────────────────────────────────────────────────────────────
  ui-fleet:
    image: docker.io/library/caddy:2-alpine
    depends_on:
      loom-fleet:
        condition: service_started
    environment:
      FRONTEND_PORT: "8080"
      LOOM_UPSTREAM: http://loom-fleet:8080
    ports:
      - "8083:8080"
    networks: [parity]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../internal/webui/frontend/dist:/srv:ro

  ui-beads:
    image: docker.io/library/caddy:2-alpine
    depends_on:
      loom-beads:
        condition: service_started
    environment:
      FRONTEND_PORT: "8080"
      LOOM_UPSTREAM: http://loom-beads:8080
    ports:
      - "8084:8080"
    networks: [parity]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../internal/webui/frontend/dist:/srv:ro

  # One-shot fixture seeder. Runs after both loom-* services are up.
  # Builds a tiny image containing fdb (copied from fleet-db image) and bd
  # (copied from loom-beads image) so both CLIs are available in one place.
  parity-seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    depends_on:
      fleet-db:
        condition: service_healthy
      loom-beads:
        condition: service_started
      loom-fleet:
        condition: service_started
    environment:
      FLEET_URL: http://fleet-db:8080
      FLEET_WORKSPACE: PARITY
      BEADS_URL: http://loom-beads:8080
    networks: [parity]
    volumes:
      - ./seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    restart: "no"
