# GoReleaser configuration for loomcli
# See https://goreleaser.com for documentation

version: 2

before:
  hooks:
    - go mod tidy
    - cmd: bash -c "cd internal/webui/frontend && npm ci && npm run build"

builds:
  - id: loom
    main: ./cmd/loom
    binary: loom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/tysonthomas9/loomcli/internal/cli.Version={{.Version}}
      - -X github.com/tysonthomas9/loomcli/internal/cli.Build={{.ShortCommit}}
  - id: bd
    dir: third_party/beads
    main: ./cmd/bd
    binary: bd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: loom-binaries
    ids: [loom, bd]
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

  - id: loom-frontend
    meta: true
    format: tar.gz
    name_template: "loomcli-frontend_{{ .Version }}"
    files:
      - src: internal/webui/frontend/dist/**/*
        dst: dist
        strip_parent: true
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: tysonthomas9
    name: loomcli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## loom v{{.Version}}

    Pre-compiled binaries for Linux and macOS (Intel & Apple Silicon).

    ### Installation

    **Quick Install (macOS/Linux):**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/tysonthomas9/loomcli/main/scripts/install.sh | bash
    ```

    **Manual Install:**
    Download the appropriate binary for your platform below, extract it, and place it in your PATH.

    ### Frontend (web UI)

    The static frontend ships as `loomcli-frontend_{{.Version}}.tar.gz`. Extract
    to any static host (nginx, S3, CDN, Vercel) and configure your reverse proxy
    to forward `/api/*` to a running `loom serve`. See the `deploy/` directory in
    the repo for an example with Docker Compose + nginx.
