# docker-compose.dev.yml — one-command local stack smoke test.
#
# This file is NOT the day-to-day dev loop. For day-to-day development use
# `make dev` (native air + Vite, faster startup, instant HMR). This compose
# file exists for two narrower use cases:
#   (a) Smoke-testing the full containerized stack end-to-end against the
#       same Dockerfiles the production deploy uses (deploy/server,
#       deploy/frontend), exercising CORS the way a real cross-origin
#       deployment will.
#   (b) Running the optional fleet/Redis path locally without a native
#       Redis install (gated behind the `fleet` profile).
#
# Differences vs. deploy/docker-compose.yml (the production reference):
#   - Frontend is exposed on :3000 (distinct from the API on :8080), so
#     the browser exercises real cross-origin requests instead of going
#     through nginx same-origin proxying.
#   - VITE_API_BASE_URL is hard-baked to http://localhost:8080 so the
#     bundled SPA issues absolute URLs to the API container.
#   - LOOM_FRONTEND_URL is set to http://localhost:3000 so the Go server
#     allows the dev frontend origin in CORS preflights.
#   - Optional Redis under the `fleet` profile.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml --profile fleet up --build
#
# Note: image rebuilds are slow (deploy/frontend/Dockerfile runs `npm ci`
# from scratch every time). That's intentional — this is a smoke test, not
# an interactive dev loop. Use `make dev` for fast iteration.

services:
  server:
    build:
      context: .
      dockerfile: deploy/server/Dockerfile
    environment:
      LOOM_FRONTEND_URL: "http://localhost:3000"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8080"
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["fleet"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
