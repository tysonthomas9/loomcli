        issue:
          allOf: [{ $ref: "#/components/schemas/Issue" }]
          description: Current linked Issue projection. In managed artifact mode its current design artifact pointer is hydrated after the command result is resolved, including on replay.
        action: { $ref: "#/components/schemas/ActionLedger" }
        committed: { $ref: "#/components/schemas/TaskRunWorkItemDesignUpdateCommit" }
        replayed: { type: boolean }

    DriverRunChildStartRequest:
      type: object
      additionalProperties: false
      required: [request_id, node_id, lease_id, fencing_token, child_key, child_run_id, driver_id, driver_version_id, payload, max_depth, requested_at]
      properties:
        request_id: { type: string }
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token: { type: integer, format: int64, minimum: 1 }
        child_key: { type: string }
        child_run_id: { type: string }
        driver_id: { type: string }
        driver_version_id: { type: string }
        payload:
          description: Exact JSON child payload.
        max_depth: { type: integer, minimum: 1 }
        requested_at: { type: string, format: date-time }

    DriverRunChildStartResult:
      type: object
      required: [parent, child, parent_depth, child_depth, action, action_id, replay]
      properties:
        parent: { $ref: "#/components/schemas/DriverRun" }
        child: { $ref: "#/components/schemas/DriverRun" }
        parent_depth: { type: integer, minimum: 1 }
        child_depth: { type: integer, minimum: 2 }
        action: { $ref: "#/components/schemas/ActionLedger" }
        action_id: { type: string }
        replay: { type: boolean }

    DriverRunCascadeRequest:
      type: object
      additionalProperties: false
      required: [request_id, node_id, lease_id, fencing_token, parent_status, reason, error_class, cascaded_at, max_depth]
      properties:
        request_id: { type: string }
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token: { type: integer, format: int64, minimum: 1 }
        parent_status:
          type: string
          enum: [completed, failed, needs_review, cancelled]
        reason: { type: string }
        error_class: { type: string }
        cascaded_at: { type: string, format: date-time }
        max_depth: { type: integer, minimum: 1 }

    DriverRunCascadeRecoveryRequest:
      type: object
      additionalProperties: false
      required: [request_id, parent_status, reason, error_class, cascaded_at, max_depth]
      properties:
        request_id: { type: string }
        parent_status:
          type: string
          enum: [completed, failed, needs_review, cancelled]
        reason: { type: string }
        error_class: { type: string }
        cascaded_at: { type: string, format: date-time }
        max_depth: { type: integer, minimum: 1 }

    DriverRunCascadeCommit:
      type: object
      required: [workspace_key, parent_run_id, parent_status, reason, error_class, cascaded_at, max_depth, cancelled_run_ids, cancel_requested_run_ids, action_id]
      properties:
        workspace_key: { type: string }
        parent_run_id: { type: string }
        parent_status:
          type: string
          enum: [completed, failed, needs_review, cancelled]
        reason: { type: string }
        error_class: { type: string }
        cascaded_at: { type: string, format: date-time }
        max_depth: { type: integer, minimum: 1 }
        cancelled_run_ids:
          type: array
          items: { type: string }
        cancel_requested_run_ids:
          type: array
          items: { type: string }
        action_id: { type: string }

    DriverRunCascadeResult:
      type: object
      required: [cancelled_runs, cancel_requested_runs, committed, action, action_id, replay]
      properties:
        cancelled_runs:
          type: array
          items: { $ref: "#/components/schemas/DriverRun" }
        cancel_requested_runs:
          type: array
          items: { $ref: "#/components/schemas/DriverRun" }
        committed: { $ref: "#/components/schemas/DriverRunCascadeCommit" }
        action: { $ref: "#/components/schemas/ActionLedger" }
        action_id: { type: string }
        replay: { type: boolean }

    RecoverTerminalDriverRunWorkRequest:
      type: object
      additionalProperties: false
      required: [request_id, parent_status, reason, error_class, recovered_at]
      properties:
        request_id:
          type: string
          description: Deterministic identity derived from the DriverRun ID and terminal status.
        parent_status:
          type: string
          enum: [completed, failed, needs_review, cancelled]
        reason: { type: string }
        error_class: { type: string }
        recovered_at: { type: string, format: date-time }

    RecoverTerminalDriverRunWorkResult:
      type: object
      additionalProperties: false
      required: [workspace_key, driver_run_id, parent_status, reason, error_class, recovered_at, recovered_task_run_ids, released_work_item_ids, preserved_successor_work_item_ids, action, action_id, replayed]
      properties:
        workspace_key: { type: string }
        driver_run_id: { type: string }
        parent_status:
          type: string
          enum: [completed, failed, needs_review, cancelled]
        reason: { type: string }
        error_class: { type: string }
        recovered_at: { type: string, format: date-time }
        recovered_task_run_ids:
          type: array
          items: { type: string }
        released_work_item_ids:
          type: array
          items: { type: string }
        preserved_successor_work_item_ids:
          type: array
          items: { type: string }
        action: { $ref: "#/components/schemas/ActionLedger" }
        action_id: { type: string }
        replayed: { type: boolean }

    ListTaskRunsResponse:
      type: object
      required: [task_runs, count]
      properties:
        task_runs:
          type: array
          items:
            $ref: "#/components/schemas/TaskRun"
        count:
          type: integer

    FinishTaskRunRequest:
      type: object
      required: [status]
      properties:
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token: { type: integer, format: int64 }
        status:
          type: string
          enum: [completed, failed, cancelled]
        exit_code:
          type: integer
          nullable: true
        logs_ref: { type: string }
        artifacts_ref: { type: string }
        input_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
        cache_read_tokens: { type: integer, format: int64, minimum: 0 }
        cache_write_tokens: { type: integer, format: int64, minimum: 0 }
        estimated_cost_usd: { type: number, format: double, minimum: 0 }
        runtime_metadata:
          $ref: "#/components/schemas/StringMap"
        error_class: { type: string }
        error_message: { type: string }
        block_task:
          type: boolean
          description: >-
            Marks the underlying task issue as blocked when the retry budget
            is exhausted. Only valid with status=failed. Idempotent and
            best-effort: a missing, already-blocked, or terminal issue is
            skipped. Blocking releases any claim lock; the blocked status
            keeps the task out of the ready queue until a human moves the issue
            back to open.

    HeartbeatTaskRunRequest:
      type: object
      properties:
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token: { type: integer, format: int64 }
        logs_ref: { type: string }
        artifacts_ref: { type: string }
        runtime_metadata:
          $ref: "#/components/schemas/StringMap"

    RequeueTaskRunRequest:
      type: object
      properties:
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token: { type: integer, format: int64 }
        logs_ref: { type: string }
        artifacts_ref: { type: string }
        runtime_metadata:
          $ref: "#/components/schemas/StringMap"
        error_class: { type: string }
        error_message: { type: string }
        next_eligible_at:
          type: string
          format: date-time
          description: >-
            Retry backoff: the requeued run becomes claimable only after this
            time. Omitted or zero keeps the run immediately claimable.

    CompleteTaskRunRequest:
      type: object
      additionalProperties: false
      required: [completion_id, status]
      properties:
        completion_id: { type: string }
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token: { type: integer, format: int64 }
        status:
          type: string
          enum: [completed, failed, cancelled]
        exit_code:
          type: integer
          nullable: true
        logs_ref: { type: string }
        artifacts_ref: { type: string }
        required_artifact_ids:
          type: array
          items: { type: string }
        require_artifacts: { type: boolean }
        input_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
        cache_read_tokens: { type: integer, format: int64, minimum: 0 }
        cache_write_tokens: { type: integer, format: int64, minimum: 0 }
        estimated_cost_usd: { type: number, format: double, minimum: 0 }
        runtime_metadata:
          $ref: "#/components/schemas/StringMap"
        error_class: { type: string }
        error_message: { type: string }
        close_task: { type: boolean }
        close_reason: { type: string }
        finished_at:
          type: string
          format: date-time
          description: Explicit completion time. When omitted, FleetDB uses server commit time.

    CompleteTaskRunResponse:
      type: object
      required: [completion, task_run]
      properties:
        completion:
          $ref: "#/components/schemas/TaskRunCompletion"
        task_run:
          $ref: "#/components/schemas/TaskRun"
        action:
          $ref: "#/components/schemas/ActionLedger"

    TaskRunLogEntry:
      type: object
      required: [workspace_key, task_run_id, sequence, request_id, stream, text, timestamp, created_at]
      properties:
        workspace_key: { type: string }
        task_run_id: { type: string }
        sequence:
          type: integer
          format: int64
        request_id: { type: string }
        stream: { type: string }
        text: { type: string }
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token:
          type: integer
          format: int64
        timestamp: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    AppendTaskRunLogRequest:
      type: object
      additionalProperties: false
      required: [request_id, node_id, lease_id, fencing_token, text, timestamp]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token:
          type: integer
          format: int64
        stream: { type: string }
        text: { type: string }
        timestamp: { type: string, format: date-time }

    ListTaskRunLogsResponse:
      type: object
      required: [logs, count, next_sequence]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/TaskRunLogEntry"
        count:
          type: integer
        next_sequence:
          type: integer
          format: int64

    # --- Task Run Events & Outbox ---

    TaskRunEvent:
      type: object
      required: [workspace_key, event_id, seq, task_run_id, type, occurred_at, created_at]
      properties:
        workspace_key: { type: string }
        event_id:
          type: string
          description: Caller-supplied deterministic id (taskRunID#attempt#type).
        seq:
          type: integer
          format: int64
          description: Store-assigned per-workspace monotonic sequence number.
        epic_id: { type: string }
        driver_run_id: { type: string }
        task_id: { type: string }
        task_run_id: { type: string }
        type:
          $ref: "#/components/schemas/TaskRunEventType"
        status:
          $ref: "#/components/schemas/TaskRunStatus"
        scheduler_state: { type: string }
        attempt: { type: integer, minimum: 0 }
        error_class: { type: string }
        error_message: { type: string }
        logs_ref: { type: string }
        artifacts_ref: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    AppendTaskRunEventRequest:
      type: object
      required: [event_id, task_run_id, type, occurred_at]
      properties:
        event_id:
          type: string
          description: >-
            Caller-supplied deterministic id (taskRunID#attempt#type); appends
            are idempotent on it and replays return the stored event.
        epic_id: { type: string }
        driver_run_id: { type: string }
        task_id: { type: string }
        task_run_id: { type: string }
        type:
          $ref: "#/components/schemas/TaskRunEventType"
        status:
          $ref: "#/components/schemas/TaskRunStatus"
        scheduler_state: { type: string }
        attempt: { type: integer, minimum: 0 }
        error_class: { type: string }
        error_message: { type: string }
        logs_ref: { type: string }
        artifacts_ref: { type: string }
        occurred_at: { type: string, format: date-time }

    ListTaskRunEventsResponse:
      type: object
      required: [task_run_events, count]
      properties:
        task_run_events:
          type: array
          items:
            $ref: "#/components/schemas/TaskRunEvent"
        count:
          type: integer

    OutboxRecord:
      type: object
      required: [workspace_key, outbox_id, seq, kind, dedupe_key, status, created_at, updated_at]
      properties:
        workspace_key: { type: string }
        outbox_id: { type: string }
        seq:
          type: integer
          format: int64
          description: Store-assigned per-workspace monotonic sequence number.
        kind:
          $ref: "#/components/schemas/OutboxKind"
        epic_id: { type: string }
        driver_run_id: { type: string }
        task_run_id: { type: string }
        target_agent: { type: string }
        body: { type: string }
        dedupe_key: { type: string }
        status:
          $ref: "#/components/schemas/OutboxStatus"
        attempt: { type: integer, minimum: 0 }
        next_retry_at:
          type: string
          format: date-time
          nullable: true
        last_error: { type: string }
        inbox_message_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        delivered_at:
          type: string
          format: date-time
          nullable: true

    CreateOutboxRecordRequest:
      type: object
      required: [outbox_id, kind, dedupe_key]
      properties:
        outbox_id: { type: string }
        kind:
          $ref: "#/components/schemas/OutboxKind"
        epic_id: { type: string }
        driver_run_id: { type: string }
        task_run_id: { type: string }
        target_agent: { type: string }
        body: { type: string }
        dedupe_key:
          type: string
          description: >-
            Caller-supplied dedupe key; creates with an existing dedupe_key
            return the existing row instead of inserting a duplicate.
        next_retry_at:
          type: string
          format: date-time
          nullable: true

    ListOutboxRecordsResponse:
      type: object
      required: [outbox, count]
      properties:
        outbox:
          type: array
          items:
            $ref: "#/components/schemas/OutboxRecord"
        count:
          type: integer

    OutboxResultRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OutboxStatus"
        attempt: { type: integer, minimum: 0 }
        next_retry_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Next dispatch attempt time for non-terminal results. Terminal
            statuses (delivered, unsupported, failed) leave the due index.
        last_error: { type: string }
        inbox_message_id: { type: string }

    # --- Await-event registry schemas ---

    AwaitStatus:
      type: string
      enum: [pending, satisfied, timed_out, cancelled]

    AwaitInstance:
      type: object
      required: [workspace_key, instance_key, run_id, pattern, deadline, registered_at, status]
      properties:
        workspace_key: { type: string }
        instance_key:
          type: string
          description: Canonical identity, runID#await-{n} with n >= 1.
        run_id: { type: string }
        pattern:
          type: string
          description: >-
            Fully rendered subject-scoped key ("event_type:subject") matched
            by exact string equality only — no glob; '*' is a literal.
        actor_allow:
          type: array
          items: { type: string, minLength: 1, pattern: '.*\S.*' }
          description: Eligible-actor predicate; empty admits any actor; blank entries are rejected.
        deadline:
          type: string
          format: date-time
          description: Mandatory expiry; the timeout sweeper resumes the run past it.
        registered_at: { type: string, format: date-time }
        status:
          $ref: "#/components/schemas/AwaitStatus"
        satisfied_by_event_id:
          type: string
          description: Resolving trigger event (or synthetic await-timeout-* event).
        satisfied_actor: { type: string }
        satisfied_payload:
          description: Size-capped resume payload returned inline on replay.
        resumed_at:
          type: string
          format: date-time
          nullable: true

    RegisterAwaitRequest:
      type: object
      required: [instance_key, run_id, pattern, deadline]
      properties:
        instance_key: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1 }
        pattern: { type: string, minLength: 1 }
        actor_allow:
          type: array
          items: { type: string, minLength: 1, pattern: '.*\S.*' }
        deadline: { type: string, format: date-time }
        registered_at: { type: string, format: date-time }

    RegisterAwaitResponse:
      type: object
      required: [await, satisfied]
      properties:
        await:
          $ref: "#/components/schemas/AwaitInstance"
        satisfied:
          type: boolean
          description: >-
            false means pending — suspend the run. true means do not suspend;
            the row's status distinguishes satisfied from a timed-out or
            cancelled replay.

    ResolveRunOutcomeAwaitRequest:
      type: object
      additionalProperties: false
      required: [instance_key, event_id]
      properties:
        instance_key:
          type: string
          minLength: 1
          description: Canonical parent run await-instance key.
        event_id:
          type: string
          minLength: 1
          pattern: '^run-finished:'
          description: Stable run.finished event identity for idempotent replay.
        payload:
          description: >-
            Arbitrary JSON resume payload. The encoded JSON bytes are rejected,
            never truncated, above the 64 KiB await-resume cap.

    ResolveAwaitAndResumeRequest:
      type: object
      additionalProperties: false
      required: [instance_key, event_id, status]
      properties:
        instance_key:
          type: string
          minLength: 1
          description: Canonical parent run await-instance key.
        event_id:
          type: string
          minLength: 1
          description: Stable admitted-event identity for idempotent replay.
        status:
          type: string
          enum: [satisfied, timed_out]
          description: >-
            satisfied applies the verified event actor predicate; timed_out is
            the trusted deadline-sweeper outcome.
        actor:
          type: string
          description: Verified actor identity from the admitted event.
        payload:
          description: >-
            Arbitrary JSON resume payload. The encoded JSON bytes are rejected,
            never truncated, above the 64 KiB await-resume cap.

    ResolveAwaitAndResumeResponse:
      type: object
      additionalProperties: false
      required: [resolved]
      properties:
        resolved: { type: boolean, enum: [true] }

    ResolveRunOutcomeAwaitResponse:
      type: object
      additionalProperties: false
      required: [resolved]
      properties:
        resolved: { type: boolean, enum: [true] }

    ResolveAwaitRequest:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string }
        status:
          $ref: "#/components/schemas/AwaitStatus"
        actor:
          type: string
          description: Semantic event actor asserted by the authenticated service caller.
        payload:
          description: Resume payload, rejected (never truncated) above the cap.

    ResolveAwaitResponse:
      type: object
      required: [await, resume]
      properties:
        await:
          $ref: "#/components/schemas/AwaitInstance"
        resume:
          type: boolean
          description: >-
            true when this call won the pending -> terminal transition and
            the caller owns resuming the suspended run.

    ListAwaitsResponse:
      type: object
      required: [awaits, count]
      properties:
        awaits:
          type: array
          items:
            $ref: "#/components/schemas/AwaitInstance"
        count: { type: integer }

    SuspendDriverRunRequest:
      type: object
      additionalProperties: false
      required: [node_id, lease_id, fencing_token, await_instance_key]
      properties:
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token: { type: integer, format: int64, minimum: 1 }
        await_instance_key: { type: string }

    ResumeDriverRunRequest:
      type: object
      required: [await_instance_key, resume_event_id]
      properties:
        await_instance_key: { type: string }
        resume_event_id: { type: string }

    # --- First-class entity schemas (Repo / Agent / Role / DaemonProfile) ---

    Repo:
      type: object
      required: [workspace_key, name, remote_url, created_at, updated_at]
      properties:
        workspace_key: { type: string }
        name:          { type: string }
        remote_url:    { type: string }
        remote:        { type: string }
        default_branch: { type: string }
        groups:
          type: array
          items: { type: string }
        source_repo_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRepoRequest:
      type: object
      required: [name, remote_url]
      properties:
        name:          { type: string }
        remote_url:    { type: string }
        remote:        { type: string }
        default_branch: { type: string }
        groups:
          type: array
          items: { type: string }
        source_repo_id: { type: string }

    UpdateRepoRequest:
      type: object
      properties:
        remote_url:    { type: string }
        remote:        { type: string }
        default_branch: { type: string }
        groups:
          type: array
          items: { type: string }
        source_repo_id: { type: string }

    ListReposResponse:
      type: object
      required: [repos, count]
      properties:
        repos:
          type: array
          items: { $ref: "#/components/schemas/Repo" }
        count: { type: integer }

    Agent:
      type: object
      required: [workspace_key, name, role_name, state, created_at, updated_at]
      properties:
        workspace_key: { type: string }
        name:          { type: string }
        role_name:     { type: string }
        auto:          { type: boolean }
        backend:       { type: string }
        fallback_backends:
          type: array
          items: { type: string }
        repos:
          type: array
          items: { type: string }
        repo_groups:
          type: array
          items: { type: string }
        cross_repo: { type: boolean }
        parent:
          type: string
          description: Parent agent name (lowercase) or an existing epic/task issue ID in this workspace (e.g. PROJ-123) scoping this agent to an issue subtree.
        state:
          type: string
          enum: [idle, active, stopped]
        mode:
          type: string
          enum: [ephemeral, service]
        task_filter: { type: string }
        max_concurrency:
          type: integer
          minimum: 0
        budget_policy: { type: string }
        desired_state:
          type: string
          enum: [stopped, idle, running, draining]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        # Derived, read-only liveness — set by the read paths from the
        # session+lease join, never persisted. Absent unless computed.
        live_status:
          type: string
          enum: [working, idle]
        active_task_id: { type: string }
        active_phase:   { type: string }
        # error_class of the agent's most recent terminal session, surfaced only
        # when that latest run failed (a newer success clears it) and the agent
        # is not currently working. Lets a client explain a stalled idle agent.
        last_error_class: { type: string }

    CreateAgentRequest:
      type: object
      required: [name, role_name]
      properties:
        name:        { type: string }
        role_name:   { type: string }
        auto:        { type: boolean }
        backend:     { type: string }
        fallback_backends:
          type: array
          items: { type: string }
        repos:
          type: array
          items: { type: string }
        repo_groups:
          type: array
          items: { type: string }
        cross_repo: { type: boolean }
        parent:
          type: string
          description: Parent agent name (lowercase) or an existing epic/task issue ID in this workspace (e.g. PROJ-123) scoping this agent to an issue subtree.
        state:
          type: string
          enum: [idle, active, stopped]
        mode:
          type: string
          enum: [ephemeral, service]
        task_filter: { type: string }
        max_concurrency:
          type: integer
          minimum: 0
        budget_policy: { type: string }
        desired_state:
          type: string
