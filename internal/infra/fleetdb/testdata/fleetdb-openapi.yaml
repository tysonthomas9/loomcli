        name: { type: string }
        owner_type:
          $ref: "#/components/schemas/DriverOwnerType"
        owner_ref: { type: string }
        description: { type: string }
        active_version_id: { type: string }
        status:
          $ref: "#/components/schemas/DriverStatus"
        trust_level:
          $ref: "#/components/schemas/DriverTrustLevel"
        metadata:
          $ref: "#/components/schemas/StringMap"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DriverTrustLevel:
      type: string
      description: >-
        Sandbox placement policy input (step 9): only trusted drivers may run
        workflow runtimes in a host process; untrusted drivers require an
        isolating sandbox launcher. Missing/unknown values read as untrusted.
      enum: [trusted, untrusted]

    CreateDriverRequest:
      type: object
      required: [driver_id, name]
      properties:
        driver_id:
          type: string
          minLength: 1
          pattern: '^(?!.*:)\S(?:.*\S)?$'
          description: Exact identity; leading and trailing whitespace and the reserved colon delimiter are rejected.
        name: { type: string }
        owner_type:
          $ref: "#/components/schemas/DriverOwnerType"
        owner_ref: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [draft]
          description: New drivers must start in draft state.
        trust_level:
          allOf:
            - $ref: "#/components/schemas/DriverTrustLevel"
          description: Creating a trusted draft requires workflow_catalog.version_lifecycle permission; omitted values default to untrusted.
        metadata:
          allOf:
            - $ref: "#/components/schemas/StringMap"
          description: Workflow Catalog approved_version keys are rejected during creation.

    UpdateDriverRequest:
      type: object
      properties:
        name: { type: string }
        owner_type:
          $ref: "#/components/schemas/DriverOwnerType"
        owner_ref: { type: string }
        description: { type: string }
        active_version_id:
          type: string
          deprecated: true
          description: Deprecated old-Loom activation field. The exact identifier must not contain leading or trailing whitespace. Accepted only in the combined active_version_id, active status, and metadata patch; requires workflow_catalog.version_lifecycle permission, same-driver version ownership, and passed validation. This compatibility path never implicitly approves an untrusted version. New clients must use the activate operation.
        status:
          allOf:
            - $ref: "#/components/schemas/DriverStatus"
          description: Lifecycle-sensitive updates require workflow_catalog.version_lifecycle permission; new clients should use Workflow Catalog intent operations.
        trust_level:
          allOf:
            - $ref: "#/components/schemas/DriverTrustLevel"
          description: Requires workflow_catalog.version_lifecycle permission.
        metadata:
          allOf:
            - $ref: "#/components/schemas/StringMap"
          description: Ordinary replacement preserves existing approved_version lifecycle markers for callers without lifecycle permission. Adding, changing, or removing those markers is a deprecated old-Loom compatibility operation requiring workflow_catalog.version_lifecycle permission.

