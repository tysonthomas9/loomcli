        session_id:       { type: string }
        type:             { type: string }
        payload:
          type: object
          additionalProperties: { type: string }
        status:
          type: string
          enum: [queued]
          description: 'Optional; only "queued" is accepted on create. Server-assigned regardless.'

    AckAgentCommandRequest:
      type: object
      additionalProperties: false
      description: |
        Known lifecycle commands start/stop/restart/yield may omit all ownership
        proof fields only when no live ownership lease exists. Unknown targeted
        command types always require complete proof.
      required: [node_id, owner_id]
      properties:
        node_id:
          type: string
          minLength: 1
          description: Claimant daemon node. Ack atomically binds an untargeted command to this node.
        owner_id:
          type: string
          minLength: 1
          description: Stable supervisor owner identity used to recover an acknowledged command after process-node replacement.
        ownership_lease_id:
          type: string
          minLength: 1
          description: Required with ownership_token and ownership_fencing_token when proving a live owner.
        ownership_token:
          type: string
          minLength: 1
          writeOnly: true
          description: Request-only raw token for the current agent ownership lease. Never persisted on AgentCommand.
        ownership_fencing_token:
          type: integer
          format: int64
          minimum: 1
          description: Current ownership generation fence.

    CompleteAgentCommandRequest:
      type: object
      additionalProperties: false
      description: |
        Complete ownership proof is normally required. A proofless command
        acknowledged while no lease was live may report failed or canceled for
        any known lifecycle type, or succeeded only for Stop. Successful
        Start/Restart/Yield and Running require proof; unknown targeted types
        always require proof.
      required: [node_id, owner_id]
      properties:
        node_id:
          type: string
          minLength: 1
          description: Current claimant daemon node. Claim metadata remains bound to the original atomic Ack.
        owner_id:
          type: string
          minLength: 1
          description: Stable supervisor owner identity that must match acked_by.
        ownership_lease_id:
          type: string
          minLength: 1
          description: Ownership generation identifier persisted by Ack, or a newer same-owner generation.
        ownership_token:
          type: string
          minLength: 1
          writeOnly: true
          description: Request-only raw token proving the ownership generation. Never persisted on AgentCommand.
        ownership_fencing_token:
          type: integer
          format: int64
          minimum: 1
          description: Ownership generation fence, never lower than the command's persisted fence.
        status:
          type: string
          enum: [running, succeeded, failed, cancelled]
        result:      { type: string }
        error_class: { type: string }

    LegacyCompleteAgentCommandRequest:
      type: object
      additionalProperties: false
      deprecated: true
      description: |
        Fleet-first rolling-upgrade bridge for the previous Loom client.
        For a proof-backed command FleetDB infers and atomically revalidates
        the exact current ownership generation; X-Actor is the authenticated
        service caller, not the daemon node or stable owner. For a still-
        proofless command, X-Actor must match FleetDB's server-reserved marker.
        Failed/Canceled may converge after the exact inferred generation was
        released, but Running and Succeeded Start/Restart/Yield remain
        forbidden. New clients must use CompleteAgentCommandRequest.
      properties:
        status:
          type: string
          enum: [running, succeeded, failed, cancelled]
        result:      { type: string }
        error_class: { type: string }

    ListAgentCommandsResponse:
      type: object
      required: [agent_commands, count]
      properties:
        agent_commands:
          type: array
          items: { $ref: "#/components/schemas/AgentCommand" }
        count: { type: integer }

    AgentInboxMessage:
      type: object
      required: [workspace_key, inbox_message_id, cursor, target_agent_id, body, status, created_at, updated_at]
      properties:
        workspace_key:        { type: string }
        inbox_message_id:     { type: string }
        cursor:               { type: integer, format: int64 }
        target_agent_id:      { type: string }
        session_id:           { type: string }
        body:                 { type: string }
        status:
