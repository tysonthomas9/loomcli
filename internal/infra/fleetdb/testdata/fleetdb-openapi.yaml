      operationId: dispatchAutomationBinding
      parameters:
        - $ref: "#/components/parameters/AutomationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationBindingDispatchRequest" }
      responses:
        "200":
          description: Atomic manual dispatch result or exact replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationBindingDispatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: TriggerBinding was not found in this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "409":
          description: Idempotency or binding/Catalog snapshot conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "422":
