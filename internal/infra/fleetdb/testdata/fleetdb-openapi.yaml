    AutomationEffectiveVersionGuard:
      type: object
      additionalProperties: false
      required: [binding_id, driver_id, driver_revision, version_id, source_digest, bundle_digest]
      properties:
        binding_id: { type: string, minLength: 1 }
        driver_id: { type: string, minLength: 1 }
        driver_revision:
          type: integer
          format: int64
          minimum: 1
        version_id: { type: string, minLength: 1 }
        source_digest: { type: string, minLength: 1 }
        bundle_digest: { type: string, minLength: 1 }

    AutomationAdmissionReservationRequest:
      type: object
      additionalProperties: false
      description: >-
        Immutable event content plus optimistic binding and Catalog preconditions.
        workspace, route, origin, hop depth, emitting run, trust, and approval
        are server-derived and intentionally absent. Workflow admission also
        carries the server-verified execution owner tuple; external and system
        routes reject those three fields. A replay probe supplies replay_only=true
        and the same immutable event content while omitting mutable binding and
        Catalog preconditions. External and workflow routes reject
        event_type=run.finished and actor_ref values in the reserved system or
        system:* actor namespace. The system route admits run.finished only
        with actor_ref=system and a canonical source_event_id beginning with
        run-finished:.
      required: [event_type]
      oneOf:
        - required: [binding_set_revision, matched_binding_ids, effective_versions]
        - required: [replay_only]
      properties:
        replay_only:
          type: boolean
          enum: [true]
          description: Return only an exact committed replay; never reserve an Event or Delivery.
        binding_set_revision:
          type: integer
          format: int64
          minimum: 1
        effective_versions:
          type: array
          maxItems: 64
          description: >-
            Effective Catalog guards exactly for legs that survive actor
            filtering. Empty is valid when every matched leg is durably rejected.
          items: { $ref: "#/components/schemas/AutomationEffectiveVersionGuard" }
        matched_binding_ids:
          type: array
          minItems: 1
          maxItems: 64
          description: Exact-route binding first, followed by pattern matches sorted by binding ID.
          items: { type: string, minLength: 1 }
        node_id:
          type: string
          minLength: 1
          description: Required only for workflow admission; verified owner node for the emitting run.
        lease_id:
          type: string
          minLength: 1
          description: Required only for workflow admission; verified owner lease for the emitting run.
        fencing_token:
          type: integer
          format: int64
          minimum: 1
          description: Required only for workflow admission; verified owner fence for the emitting run.
        source_event_id:
          type: string
          maxLength: 512
          description: >-
            Immutable provider identity. System run.finished admission requires
            this value to begin with run-finished:.
        event_type:
          type: string
          minLength: 1
          maxLength: 256
          description: External and workflow admission cannot assert the reserved run.finished value.
        subject_ref: { type: string, maxLength: 1024 }
        actor_ref:
          type: string
          maxLength: 512
          description: >-
            External and workflow admission cannot assert system or system:*;
            system run.finished admission requires exactly system.
        occurred_at: { type: string, format: date-time }
        raw_payload_ref: { type: string, maxLength: 2048 }
        raw_payload_digest: { type: string }
        payload_base64:
          type: string
          format: byte
          description: Standard-base64 exact payload bytes; decoded bytes must be valid JSON.
        subject_attrs:
          type: object
          maxProperties: 64
          additionalProperties: { type: string }

    AutomationNonWorkflowAdmissionReservationRequest:
      allOf:
        - $ref: "#/components/schemas/AutomationAdmissionReservationRequest"
        - not:
            anyOf:
              - required: [node_id]
              - required: [lease_id]
              - required: [fencing_token]
      description: >-
        External and system admission reject all execution-owner fields. The
        shared immutable event schema also documents each lane's reserved
        run.finished and system actor identity rules.

    AutomationWorkflowAdmissionReservationRequest:
      allOf:
        - $ref: "#/components/schemas/AutomationAdmissionReservationRequest"
        - required: [node_id, lease_id, fencing_token]
      description: >-
        Workflow admission requires the server-verified execution owner tuple;
        the run identity itself remains server-derived from the route. It cannot
        assert run.finished or the reserved system or system:* actor namespace.

    AutomationDeliveryResult:
      type: object
      additionalProperties: false
      required:
        [workspace_key, delivery_id, trigger_event_id, trigger_binding_id, status, driver_id, target_entrypoint,
         source_kind, concurrency_policy, retry_max_attempts, retry_backoff_seconds,
         attempt, created_at, updated_at]
      properties:
        workspace_key: { type: string }
        delivery_id: { type: string }
        trigger_event_id: { type: string }
        trigger_binding_id: { type: string }
        status: { $ref: "#/components/schemas/TriggerDeliveryStatus" }
        rejection_reason: { type: string }
        driver_id: { type: string }
        driver_version_id:
          type: string
          description: Admission-time Catalog version snapshot.
        target_entrypoint: { type: string }
        target_agent_service_id: { type: string }
        source_kind: { type: string }
        concurrency_policy: { $ref: "#/components/schemas/TriggerBindingConcurrencyPolicy" }
        retry_max_attempts: { type: integer, minimum: 0 }
        retry_backoff_seconds: { type: integer, minimum: 0 }
        subject_key: { type: string }
        driver_run_id:
          type: string
          description: Execution-owned run linked by a later delivery transition; absent on reservation.
        attempt: { type: integer, minimum: 1 }
        next_retry_at: { type: string, format: date-time, nullable: true }
        error_class: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AutomationAdmissionReservationResult:
      type: object
      additionalProperties: false
      required: [event, deliveries, effective_versions, replayed]
      properties:
        event: { $ref: "#/components/schemas/TriggerEvent" }
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/AutomationDeliveryResult" }
        effective_versions:
          type: array
          maxItems: 64
          description: >-
            Immutable Catalog guards committed for accepted deliveries. Replays
            return this snapshot so dispatch does not consult live activation.
          items: { $ref: "#/components/schemas/AutomationEffectiveVersionGuard" }
        replayed: { type: boolean }

    AutomationCronClaimRequest:
      type: object
      additionalProperties: false
      required: [before, claim_until]
      properties:
        before:
          type: string
          format: date-time
          description: Stable due cutoff included in the idempotent claim fingerprint.
        claim_until:
          type: string
          format: date-time
          description: Reclaim boundary, after before and no more than five minutes later.
        limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }

    AutomationCronOccurrence:
      type: object
      additionalProperties: false
      required: [workspace_key, binding_id, occurrence_id, occurred_at]
      properties:
        workspace_key: { type: string }
        binding_id: { type: string, minLength: 1 }
        route_key: { type: string }
        occurrence_id:
          type: string
          pattern: '^cron:'
          description: Stable binding and scheduled-UTC-instant identity.
        occurred_at: { type: string, format: date-time }

    AutomationCronClaimResponse:
      type: object
      additionalProperties: false
      required: [occurrences, count]
      properties:
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/AutomationCronOccurrence" }
        count: { type: integer, minimum: 0 }

    AutomationCronCompletionStatus:
      type: string
      enum: [admitted, dropped, failed]

    AutomationCronCompletionRequest:
      type: object
      additionalProperties: false
      required: [binding_id, status]
      properties:
        binding_id: { type: string, minLength: 1 }
        status: { $ref: "#/components/schemas/AutomationCronCompletionStatus" }
        error_class:
          type: string
          maxLength: 256
          description: Empty for admitted; reason or failure class for dropped/failed.

    AutomationDeliveryClaimRequest:
      type: object
      additionalProperties: false
      required: [before, claim_until]
      properties:
        before:
          type: string
          format: date-time
          description: Stable due cutoff supplied by the caller and included in the replay fingerprint.
        claim_until:
          type: string
          format: date-time
          description: Bounded claim lease, after before and no more than five minutes later.
        limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }

    AutomationClaimedDelivery:
      type: object
      additionalProperties: false
      required: [event, delivery]
      properties:
        event:
          allOf:
            - $ref: "#/components/schemas/TriggerEvent"
          description: Durable admission envelope used for retry without caller reconstruction.
        delivery:
          allOf:
            - $ref: "#/components/schemas/TriggerDelivery"
          description: Includes every admission-time Driver, target, concurrency, and retry snapshot.

    ClaimDueAutomationDeliveriesResponse:
      type: object
      additionalProperties: false
      required: [deliveries, count]
      properties:
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/AutomationClaimedDelivery" }
        count: { type: integer, minimum: 0 }

    AutomationDeliveryDispatchRequest:
      type: object
      additionalProperties: false
      required: [expected_status, expected_attempt]
      properties:
        expected_status:
          type: string
          enum: [accepted, failed, held]
        expected_attempt: { type: integer, minimum: 1 }

    AutomationDeliveryDispatchOutcome:
      type: string
      enum: [run, busy, reused, superseded]

    AutomationBindingDispatchRequest:
      type: object
      additionalProperties: false
      description: >-
        A fresh dispatch supplies effective_version. An authenticated replay
        probe supplies replay_only=true with the same immutable caller intent
        but no effective_version; it can only return a prior committed result.
      oneOf:
        - required: [effective_version]
        - required: [replay_only]
      properties:
        replay_only:
          type: boolean
          enum: [true]
          description: Return only an intent-matching committed replay; never create a run.
        effective_version: { $ref: "#/components/schemas/AutomationEffectiveVersionGuard" }
        subject_ref: { type: string, maxLength: 1024 }
        epic_id: { type: string }
        actor_ref: { type: string, maxLength: 512 }
        raw_payload_ref: { type: string, maxLength: 2048 }
        payload_base64:
          type: string
          format: byte
          description: Standard-base64 exact payload bytes; decoded bytes must be valid JSON.
        subject_attrs:
          type: object
          maxProperties: 64
          additionalProperties: { type: string }

    AutomationBindingDispatchResult:
      type: object
      additionalProperties: false
      required: [outcome, run_reused, replayed]
      properties:
        driver_run:
          allOf:
            - $ref: "#/components/schemas/DriverRun"
          description: Full newly-created, reused, or superseded DriverRun; absent for busy outcomes.
        outcome: { $ref: "#/components/schemas/AutomationDeliveryDispatchOutcome" }
        busy_run_id:
          type: string
          description: Subject holder for forbid/queue busy outcomes.
        superseded_run_ids:
          type: array
          items: { type: string }
          description: Queued replace-policy siblings atomically canceled by this dispatch.
        run_reused: { type: boolean }
        replayed:
          type: boolean
          description: True only for the same workspace, binding, and Idempotency-Key replay.

    AutomationDeliveryDispatchResult:
      type: object
      additionalProperties: false
      required: [event, delivery, outcome, run_reused, replayed]
      properties:
        event:
          allOf:
            - $ref: "#/components/schemas/TriggerEvent"
          description: Immutable admitted Event; payload_base64 preserves exact bytes.
        delivery: { $ref: "#/components/schemas/AutomationDeliveryResult" }
        driver_run:
          allOf:
            - $ref: "#/components/schemas/DriverRun"
          description: Newly created or one-active-per-epic reused run; absent for busy outcomes.
        outcome: { $ref: "#/components/schemas/AutomationDeliveryDispatchOutcome" }
        busy_run_id:
          type: string
          description: Subject holder for forbid/queue busy outcomes.
        superseded_run_ids:
          type: array
          items: { type: string }
          description: Queued replace-policy siblings atomically canceled by this dispatch.
        run_reused:
          type: boolean
          description: True when one_active_per_epic or the stable delivery run identity reused a run.
        replayed:
          type: boolean
          description: True only for the same workspace, delivery, and Idempotency-Key replay.

    AutomationDeliveryTransitionRequest:
      type: object
      additionalProperties: false
      required: [expected_status, expected_attempt, status]
      properties:
        expected_status: { $ref: "#/components/schemas/TriggerDeliveryStatus" }
        expected_attempt: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/TriggerDeliveryStatus" }
        driver_run_id:
          type: string
          description: Required only for a legacy dispatched transition; identifies an already-created run.
        rejection_reason: { type: string }
        next_retry_at: { type: string, format: date-time }
        error_class: { type: string }

    ActionLedger:
