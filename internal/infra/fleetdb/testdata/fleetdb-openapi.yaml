  /api/v1/{workspace}/trigger-bindings:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Trigger Bindings]
      summary: Register a trigger binding
      description: >-
        Ordinary lifecycle only. target_agent_service_id is not accepted;
        AgentService-owned bindings use the dedicated Automation managed lane.
      operationId: createTriggerBinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTriggerBindingRequest"
      responses:
        "201":
          description: Trigger binding registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerBinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Trigger Bindings]
      summary: List trigger bindings
      operationId: listTriggerBindings
      parameters:
        - name: source_kind
          in: query
          schema: { type: string }
        - name: route_key
          in: query
          schema: { type: string }
        - name: driver_id
          in: query
          schema: { type: string }
        - name: target_agent_service_id
          in: query
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Trigger binding list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTriggerBindingsResponse"

  /api/v1/{workspace}/trigger-bindings/{binding_id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/TriggerBindingID"
    get:
      tags: [Trigger Bindings]
      summary: Get a trigger binding
      operationId: getTriggerBinding
      responses:
        "200":
          description: Trigger binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerBinding"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Trigger Bindings]
      summary: Update a trigger binding
      description: >-
        Ordinary lifecycle only. Ownership fields are rejected, and a current
        AgentService-owned row cannot be mutated through this route.
      operationId: updateTriggerBinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTriggerBindingRequest"
      responses:
        "200":
          description: Updated trigger binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerBinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Trigger Bindings]
      summary: Delete a trigger binding
      description: |
        Removes the binding and frees its route-key reservation. Historical
        trigger events and driver runs stamped with the binding id are left
        intact as an audit trail. A current AgentService-owned row is rejected;
        managed deletion uses the exact-snapshot Automation lane.
      operationId: deleteTriggerBinding
      responses:
        "204":
          description: Trigger binding deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/{workspace}/trigger-bindings/{binding_id}/webhook-secret:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/TriggerBindingID"
    get:
      tags: [Trigger Bindings]
      summary: Get a trigger binding's webhook signing secret
      description: |
        Returns the plaintext webhook signing secret for the binding. Guarded
        by the trigger-binding-secret-read permission so the secret is not
        exposed on the ordinary read/list surfaces; used by the webhook
        verifier to check inbound signatures.
      operationId: getTriggerBindingWebhookSecret
      responses:
        "200":
          description: Webhook signing secret
          content:
            application/json:
              schema:
                type: object
                required: [binding_id, webhook_secret]
                properties:
                  binding_id:
                    type: string
                  webhook_secret:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/connectors:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Connectors]
      summary: Register a connector
      description: |
        Creates one named per-source connector (first-writer-wins on
        connector_id; a duplicate create returns 409). The outbound
        credential must already be sealed ciphertext — serve's vault layer
        encrypts it before this call and fleet-db never sees plaintext.
        The response is redacted.
      operationId: createConnector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectorRequest"
      responses:
        "201":
          description: Connector registered (redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Connectors]
      summary: List connectors (redacted)
      operationId: listConnectors
      parameters:
        - name: source_kind
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Connector list with secrets redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConnectorsResponse"

  /api/v1/{workspace}/connectors/{connector_id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/ConnectorID"
    get:
      tags: [Connectors]
      summary: Get a connector (redacted)
      operationId: getConnector
      responses:
        "200":
          description: Connector with secrets redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/connectors/{connector_id}/secrets:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/ConnectorID"
    get:
      tags: [Connectors]
      summary: Resolve a connector's secrets (privileged)
      description: |
        Returns the plaintext inbound signing secrets (current plus the
        previous secret while the dual-secret rotation window is open) and
        the sealed outbound credential ciphertext. Guarded by the
        connector-secret-read permission so none of this is exposed on the
        ordinary read/list surfaces. A verifier that matches a signature
        against previous_inbound_secret must emit a stale-secret audit
        signal.
      operationId: getConnectorSecrets
      responses:
        "200":
          description: Inbound secrets and sealed outbound credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorSecrets"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/connectors/{connector_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/ConnectorID"
    post:
      tags: [Connectors]
      summary: Rotate a connector's secrets
      description: |
        Installs a new inbound signing secret, demoting the current secret
        to previous_inbound_secret until previous_secret_valid_until
        (default 15 minutes, capped at 24 hours), and optionally replaces
        the sealed outbound credential. When expected_updated_at is present,
        the rotation is rejected if the connector changed since that
        generation was read. The response is redacted.
      operationId: rotateConnectorSecrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateConnectorSecretsRequest"
      responses:
        "200":
          description: Rotated connector (redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/{workspace}/connector-grants:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Connector Grants]
      summary: Create a connector grant
      description: |
        Authorizes one {action, resource pattern} tuple for one binding
        against one connector. Grants are deny-by-default: egress fails
        closed until explicit grants exist.
      operationId: createConnectorGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectorGrantRequest"
      responses:
        "201":
          description: Connector grant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Connector Grants]
      summary: List active connector grants
      description: Revoked grants are filtered out; they never authorize egress.
      operationId: listConnectorGrants
      parameters:
        - name: binding_id
          in: query
          schema: { type: string }
        - name: connector_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Active connector grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConnectorGrantsResponse"

  /api/v1/{workspace}/connector-grants/{grant_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/ConnectorGrantID"
    post:
      tags: [Connector Grants]
      summary: Revoke a connector grant
      description: Revoking an already-revoked grant returns 409.
      operationId: revokeConnectorGrant
      responses:
        "200":
          description: Revoked connector grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorGrant"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/{workspace}/connector-audit:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Connector Audit]
      summary: Append a connector-call audit record
      description: |
        Appends one row to the dedicated connector-call journal (separate
        from task-run events). Granted AND denied egress calls are both
        journaled. The call_id is deterministic ("runID#action#seq", derived
        server-side when omitted) so retried appends return 409 instead of
        double-writing.
      operationId: appendConnectorCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendConnectorCallRequest"
      responses:
        "201":
          description: Audit record appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorCallRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Connector Audit]
      summary: List connector-call audit records
      description: |
        Walks the per-run journal (seq order) when run_id is given, or the
        per-binding index (occurrence order) when binding_id is given; one
        of the two is required.
      operationId: listConnectorCalls
      parameters:
        - name: run_id
          in: query
          schema: { type: string }
        - name: binding_id
          in: query
          schema: { type: string }
        - name: decision
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Connector-call audit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConnectorCallsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/{workspace}/trigger-events:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Trigger Events]
      summary: Create a trigger event
      operationId: createTriggerEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTriggerEventRequest"
      responses:
        "201":
          description: Trigger event created or idempotently returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Trigger Events]
      summary: List trigger events
      operationId: listTriggerEvents
      parameters:
        - name: trigger_binding_id
          in: query
          schema: { type: string }
        - name: source_kind
          in: query
          schema: { type: string }
        - name: subject_ref
          in: query
          schema: { type: string }
        - name: idempotency_key
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Trigger event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTriggerEventsResponse"

  /api/v1/{workspace}/trigger-events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/TriggerEventID"
    get:
      tags: [Trigger Events]
      summary: Get a trigger event
      operationId: getTriggerEvent
      responses:
        "200":
          description: Trigger event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/trigger-routes/{route_key}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: route_key
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Trigger Events]
      summary: Ingest a registered trigger route and queue its driver run
      operationId: createTriggerRouteRun
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
        - name: X-Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTriggerRouteRunRequest"
      responses:
        "201":
          description: Driver run queued from registered trigger route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/{workspace}/automation/binding-matches/{route_key}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: route_key
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Automation]
      summary: Match the current Automation binding fan-out set
      operationId: matchAutomationBindings
      responses:
        "200":
          description: Deterministic binding match snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationBindingMatchSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/automation/admissions/external/{route_key}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: route_key
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Automation]
      summary: Reserve an external Automation admission
      description: >-
        Atomically persists one external-origin Event and its Delivery progress
        records. It does not create DriverRuns; Loom dispatches each reserved
        delivery through Execution and records the result with the transition
        operation. External admission cannot assert event_type=run.finished or
        an actor_ref in the reserved system or system:* actor namespace.
      operationId: reserveExternalAutomationAdmission
      parameters:
        - $ref: "#/components/parameters/AutomationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationNonWorkflowAdmissionReservationRequest"
      responses:
        "200":
          description: Original reservation returned for an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationAdmissionReservationResult"
        "201":
          description: Event and Delivery records reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationAdmissionReservationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: Hop, Catalog, or fan-out precondition failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Complete Automation admission backend is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }

  /api/v1/{workspace}/automation/admissions/system/{route_key}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: route_key
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Automation]
      summary: Reserve a system Automation admission
      description: >-
        Server stamps origin=system and hop_depth=0; neither field is accepted
        in the request body. A run.finished reservation requires
        actor_ref=system and a canonical source_event_id beginning with
        run-finished:.
      operationId: reserveSystemAutomationAdmission
      parameters:
        - $ref: "#/components/parameters/AutomationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationNonWorkflowAdmissionReservationRequest" }
      responses:
        "200":
          description: Original reservation returned for an idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationAdmissionReservationResult" }
        "201":
          description: Event and Delivery records reserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationAdmissionReservationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: Catalog or fan-out precondition failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Complete Automation admission backend is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }

  /api/v1/{workspace}/driver-runs/{run_id}/automation/admissions/{route_key}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/DriverRunID"
      - name: route_key
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Automation]
      summary: Reserve a workflow-originated Automation admission
      description: >-
        Fleet derives emitting run identity, parent Event, origin=workflow, and
        hop_depth from the path and durable records. The body carries the
        server-verified node, lease, and fencing token for that emitting run;
        Fleet revalidates the exact running owner atomically on a fresh
        reservation. Exact committed replay is checked first, so it remains
        available after terminal completion or ownership handoff. Workflow
        admission cannot assert event_type=run.finished or an actor_ref in the
        reserved system or system:* actor namespace.
      operationId: reserveWorkflowAutomationAdmission
      parameters:
        - $ref: "#/components/parameters/AutomationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationWorkflowAdmissionReservationRequest" }
      responses:
        "200":
          description: Original reservation returned for an idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationAdmissionReservationResult" }
        "201":
          description: Event and Delivery records reserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationAdmissionReservationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Idempotency conflict or stale execution owner tuple
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: Hop, Catalog, or fan-out precondition failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Complete Automation admission backend is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }

  /api/v1/{workspace}/automation/cron/claim-due:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Automation]
      summary: Atomically claim due durable cron occurrences
      description: >-
        Claims stable binding/scheduled-instant occurrence identities through a
        bounded lease. Exact Idempotency-Key replay returns the original set;
        unfinished occurrences become reclaimable after claim_until, including
        after a FleetDB or Loom process restart.
      operationId: claimDueAutomationCron
      parameters:
        - $ref: "#/components/parameters/AutomationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationCronClaimRequest" }
      responses:
        "200":
          description: Stable claimed occurrence set, including an exact replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationCronClaimResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency-Key was reused with different claim content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Complete Automation backend is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }

  /api/v1/{workspace}/automation/cron/{occurrence_id}/complete:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: occurrence_id
        in: path
        required: true
        schema: { type: string, pattern: '^cron:' }
    post:
      tags: [Automation]
      summary: Complete or release one durable cron occurrence
      description: >-
        Admitted and dropped outcomes advance the schedule cursor exactly once.
        Failed releases the lease and retains the same occurrence without
        advancing. Completion is idempotent by workspace and occurrence ID.
      operationId: completeAutomationCron
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationCronCompletionRequest" }
      responses:
        "204": { description: Completion recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Occurrence was not found in this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "409":
          description: A terminal completion already exists with different content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Complete Automation backend is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }

  /api/v1/{workspace}/automation/bindings/{binding_id}/dispatch:
    parameters:
