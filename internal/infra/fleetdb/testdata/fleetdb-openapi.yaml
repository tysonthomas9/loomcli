  /api/v1/{workspace}/driver-runs/{run_id}/work-items/{task_id}/review-handoff:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/DriverRunID"
      - $ref: "#/components/parameters/TaskID"
    post:
      tags: [Driver Runs]
      summary: Atomically hand off a completed review work item
      description: >-
        Validates the live parent owner, exact claim generation, completed
        TaskRun lineage, and immutable retained-claim policy before moving the
        work item to open, review, or closed and retiring its claim in one
        transaction. A review handoff also atomically sets priority, adds
        normalized labels, and creates one server-authored comment. Exact
        command replay returns the immutable original response without creating
        another comment. For review handoffs, handed_off_at is commit metadata
        rather than part of idempotency identity, so timestamp-only retries
        replay the first committed issue, action, and comment. A claim
        originating in open may hand off only to review; a claim originating in
        review may hand off to open, review, or closed. Requires an authenticated
        service actor.
      operationId: handoffDriverRunReviewWorkItem
      parameters:
        - $ref: "#/components/parameters/XLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverRunReviewWorkItemHandoffRequest" }
      responses:
        "200":
          description: Review work-item handoff committed or replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverRunWorkItemCommandResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

