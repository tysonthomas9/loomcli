      required: [workspace_key, driver_id, revision, name, owner_type, status, created_at, updated_at]
      properties:
        workspace_key: { type: string }
        driver_id:
          type: string
          minLength: 1
          pattern: '^(?!.*:)\S(?:.*\S)?$'
          description: Exact identity; leading and trailing whitespace and the reserved colon delimiter are rejected.
