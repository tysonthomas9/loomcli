        field:
          type: string
        expected:
          type: string
        actual:
          type: string

    CreateAPIKeyRequest:
      type: object
      required: [actor_id]
      properties:
        actor_id:
          type: string
          description: Unique identifier for the actor this key authenticates as
          maxLength: 128
        display_name:
          type: string
          description: Human-readable name for the actor
          maxLength: 256
        ttl_seconds:
          type: integer
          description: Time-to-live in seconds. 0 means permanent. Minimum 60, maximum 31536000 (365 days).
          default: 0
        workspace:
          type: string
          description: Optional. Grant the new actor a workspace-scoped ACL role atomically with the key (set together with `role`). Co-expires with the key's TTL.
        role:
          type: string
          enum: [admin, maintainer, developer, viewer]
          description: Optional. ACL role to grant in `workspace` for least-privilege provisioning. Both `workspace` and `role` must be set together, or neither.

    CreateAPIKeyResponse:
      type: object
      required: [key, actor_id, display_name, expires_at]
      properties:
        key:
          type: string
          description: The full API key (only returned on creation)
        actor_id:
          type: string
        display_name:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiration timestamp, null if permanent
        workspace:
          type: string
          description: Workspace the actor was granted a scoped role in, if provisioning was requested.
        role:
          type: string
          description: ACL role granted in `workspace`, if provisioning was requested.

    APIKeyInfo:
      type: object
      required: [key_prefix, actor_id, display_name, ttl_seconds]
      properties:
        key_prefix:
          type: string
          description: Masked key prefix for identification (e.g., "fldb_abc1...")
        actor_id:
          type: string
        display_name:
          type: string
        ttl_seconds:
          type: integer
          description: Remaining TTL in seconds. -1 means the key never expires (permanent).
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Estimated expiration timestamp, null if permanent

    ListAPIKeysResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKeyInfo"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # --- Agent platform driver schemas ---

    StringMap:
      type: object
      additionalProperties:
        type: string

    DriverOwnerType:
      type: string
