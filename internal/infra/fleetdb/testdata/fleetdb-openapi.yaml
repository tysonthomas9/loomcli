openapi: 3.1.0
info:
  title: fleet-db
  description: |
    Issue tracking and work coordination API for fleet agents.

    fleet-db provides a Redis-backed issue tracker designed for autonomous agent
    workflows. It supports issue CRUD, dependency management, work claiming,
    real-time mutation events, and workspace isolation.
  version: 0.1.0
  license:
    name: MIT
  x-api-governance: docs/api-governance.md
  x-versioning-strategy: url-path

x-stability: pre-1.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Workspaces
    description: Workspace management (admin)
  - name: Issues
    description: Issue CRUD operations
  - name: Claim
    description: Issue claiming and work assignment
  - name: Dependencies
    description: Issue dependency management
  - name: Labels
    description: Issue label management
  - name: Metadata
    description: Issue key/value metadata management
  - name: Ready & Blocked
    description: Work queue queries
  - name: Comments
    description: Issue comments
  - name: Events
    description: Real-time mutation event streams
  - name: Workers
    description: Worker heartbeat and lifecycle
  - name: Drivers
    description: Driver definitions and published runtime versions
  - name: Worker Profiles
    description: Worker pool profile definitions used for task placement
  - name: Agent Services
    description: Long-running desired agent services and lifecycle state
  - name: Trigger Bindings
    description: Registered trigger bindings for platform routes and events
  - name: Trigger Events
    description: Durable trigger ingress events
  - name: Trigger Deliveries
    description: Durable trigger delivery attempts and dispatch records
  - name: Action Ledger
    description: Idempotent side-effect ledger records
  - name: Driver Runs
    description: Durable driver execution lifecycle
  - name: Driver Steps
    description: Auditable steps emitted by driver runs
  - name: Task Runs
    description: Durable child task execution lifecycle
  - name: Task Run Events
    description: Append-only task-run lifecycle event journal
  - name: Outbox
    description: Durable notification outbox queue
  - name: Awaits
    description: Await-event registry and DriverRun suspend/resume lifecycle
  - name: History
    description: Issue event history and point-in-time reconstruction
  - name: Admin
    description: Disaster recovery and administrative operations

paths:
  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Always returns 200. Use for container liveness checks.
      operationId: healthz
      responses:
        "200":
          description: Service is alive
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Returns 200 if Redis is reachable, 503 otherwise.
      operationId: readyz
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: not ready
                  error:
                    type: string
                    example: backend unavailable

  # ---------------------------------------------------------------------------
  # Workspaces (admin)
  # ---------------------------------------------------------------------------
  /api/v1/admin/workspaces:
    post:
      tags: [Workspaces]
      summary: Create workspace
      operationId: createWorkspace
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Workspaces]
      summary: List workspaces
      description: Returns all workspaces. No pagination.
      operationId: listWorkspaces
      x-pagination: none
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/workspaces/{key}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceKey"

    get:
      tags: [Workspaces]
      summary: Get workspace
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Workspaces]
      summary: Update workspace
      operationId: updateWorkspace
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Workspaces]
      summary: Delete workspace
      operationId: deleteWorkspace
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "204":
          description: Workspace deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/workspaces/{key}/integrity:
    parameters:
      - $ref: "#/components/parameters/WorkspaceKey"

    get:
      tags: [Workspaces]
      summary: Check workspace integrity
      description: |
        Runs a non-destructive referential integrity check on the workspace.
        Scans all issues for violations such as missing parent references,
        broken dependency targets, and orphaned index entries.
      operationId: checkWorkspaceIntegrity
      responses:
        "200":
          description: Integrity check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrityResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # API Keys (admin)
  # ---------------------------------------------------------------------------
  /api/v1/admin/apikeys:
    post:
      tags: [API Keys]
      summary: Create API key
      description: |
        Generates a new API key for the specified actor. The full key is returned
        only in this response — it cannot be retrieved again. Store it securely.
      operationId: createAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [API Keys]
      summary: List API keys
      description: |
        Returns metadata for all stored API keys. Key values are masked —
        only the first 12 characters are shown for identification.
      operationId: listAPIKeys
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIKeysResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/apikeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Actor ID of the API key
        schema:
          type: string

    get:
      tags: [API Keys]
      summary: Get API key metadata
      description: Returns metadata for the API key associated with the given actor ID.
      operationId: getAPIKey
      responses:
        "200":
          description: API key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyInfo"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [API Keys]
      summary: Revoke API key
      description: |
        Revokes (deletes) the API key associated with the given actor ID.
        Idempotent — returns 204 even if the key does not exist.
      operationId: revokeAPIKey
      responses:
        "204":
          description: API key revoked (or already absent)
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Issues
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    post:
      tags: [Issues]
      summary: Create issue
      description: |
        Creates a new issue in the workspace.

        **Idempotency:** Supports optional `X-Idempotency-Key` header. If
        provided and a request with the same key was already processed, the
        original response is replayed with 200 and `X-Idempotency-Replayed:
        true`. Keys are scoped per workspace and authenticated actor.

        **Soft-duplicate guard:** when the same actor created an open issue
        with the same title and type within the last 60 seconds, the existing
        issue is returned (200 + `X-Idempotency-Warning: soft-duplicate`)
        instead of minting a duplicate. Bypass with `X-Idempotency-Force:
        true`.
      operationId: createIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
        - $ref: "#/components/parameters/XIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "200":
          description: |
            Existing issue returned instead of a new one — either an
            idempotent replay (`X-Idempotency-Replayed: true`) or a
            soft-duplicate hit (`X-Idempotency-Warning: soft-duplicate`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            Idempotency conflict: the key was already used with a different
            request body (`conflict`), or a create with the same key is in
            flight and not yet recorded (`idempotency_in_progress` — retry
            shortly).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Issues]
      summary: List issues
      operationId: listIssues
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/IssueType"
        - name: assignee
          in: query
          schema:
            type: string
        - name: label
          in: query
          schema:
            type: string
        - name: repo
          in: query
          schema:
            type: string
        - name: parent_id
          in: query
          schema:
            type: string
        - name: sort
          in: query
          description: |
            Field to sort results by.
            **Status: planned** — not yet implemented in the API handler.
            The storage layer supports all four fields.
          schema:
            type: string
            enum: [priority, created_at, updated_at, id]
            default: priority
        - name: order
          in: query
          description: |
            Sort direction.
            **Status: planned** — not yet implemented in the API handler.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/search:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Issues]
      summary: Search issues
      description: |
        Full-text search across issue titles and descriptions.
        Returns matching issues ordered by relevance.

        **Pagination:** This endpoint supports `limit` to cap results.
        `offset` is a planned addition (not yet implemented).

        **Note:** The response uses `IssueListResponse` but currently only
        populates `issues` and `count`. The `total`, `offset`, and `limit`
        fields are not returned by this endpoint.
      operationId: searchIssues
      x-pagination: limit-only
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: |
            **Status: planned** — not yet implemented.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/count:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Issues]
      summary: Count issues
      description: |
        Returns aggregate counts of issues matching the given filters,
        optionally grouped by a specified dimension.

        **Grouping:** Use `group_by` to break down counts by status, type,
        priority, assignee, or label. When `group_by=label`, a single issue
        with multiple labels increments each label's group count, so
        `sum(groups)` may exceed `total`.

        **Pagination:** None. This endpoint returns aggregate data only.
      operationId: countIssues
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IssueStatus"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/IssueType"
        - name: assignee
          in: query
          schema:
            type: string
        - name: label
          in: query
          schema:
            type: string
        - name: repo
          in: query
          schema:
            type: string
        - name: parent_id
          in: query
          schema:
            type: string
        - name: group_by
          in: query
          description: Dimension to group counts by
          schema:
            type: string
            enum: [status, type, priority, assignee, label]
      responses:
        "200":
          description: Aggregate issue counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueCountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/batch:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    post:
      tags: [Issues]
      summary: Batch create issues
      description: |
        Creates multiple issues in a single request.

        **Atomicity:** All-or-nothing. If any issue fails validation, none are
        created and a 400 error is returned.

        **Limits:** Maximum 100 issues per batch. Maximum 10 MB request body.

        **Idempotency: planned, not implemented.** The `X-Idempotency-Key`
        header is currently ignored on this endpoint: the batch loop creates
        issues one by one (non-atomic), so a partial failure before the
        replay record is written would let a retry duplicate the already
        created prefix. Honoring the key here requires atomic or resumable
        batch semantics first.
      operationId: batchCreateIssues
      parameters:
        - $ref: "#/components/parameters/XActor"
        - $ref: "#/components/parameters/XIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateIssueRequest"
      responses:
        "201":
          description: All issues created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/batch/close:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    post:
      tags: [Issues]
      summary: Batch close issues
      description: |
        Closes multiple issues in a single request.

        **Atomicity:** Best-effort. Attempts all closures; issues that are
        already closed are skipped (not counted as errors).

        **Limits:** No explicit limit on the number of issue IDs.
      operationId: batchCloseIssues
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCloseIssuesRequest"
      responses:
        "204":
          description: Issues closed (best-effort)
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/{id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    get:
      tags: [Issues]
      summary: Get issue
      operationId: getIssue
      responses:
        "200":
          description: Issue details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Issues]
      summary: Update issue
      description: Partial update. Only provided fields are changed.
      operationId: updateIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Issues]
      summary: Delete issue
      description: |
        Deletes the issue and all associated data (indexes, dependencies, comments).
        Returns 409 `already_claimed` while a live worker holds the issue claim.
      operationId: deleteIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "204":
          description: Issue deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/{id}/close:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Issues]
      summary: Close issue
      description: |
        Closes a single issue. Idempotent: closing an already-closed issue
        returns 200 with the current issue (no error), matching batch/close's
        per-item no-op semantics. Use batch/close for closing multiple issues
        at once.
      operationId: closeIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseIssueRequest"
      responses:
        "200":
          description: Issue closed (or already closed — idempotent no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Issues]
      summary: Reopen issue
      description: |
        Reopens a closed issue. Returns 409 if the issue is not closed.
      operationId: reopenIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "200":
          description: Issue reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/{id}/defer:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Issues]
      summary: Defer issue
      description: |
        Defers an issue until a specified time. The issue will be excluded from
        the ready queue until `defer_until` has passed.
      operationId: deferIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defer_until]
              properties:
                defer_until:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Issue deferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/{id}/undefer:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Issues]
      summary: Undefer issue
      description: |
        Removes the deferral from an issue, making it immediately eligible
        for the ready queue (if unblocked and unassigned).
      operationId: undeferIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "200":
          description: Issue undeferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Issue is not deferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Claim
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/claim:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Claim]
      summary: Claim issue
      description: |
        Atomically acquires a lock on the issue for the actor. Transitions
        the issue to in_progress status and sets the assignee.
      operationId: claimIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimIssueRequest"
      responses:
        "200":
          description: Issue claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Issue already claimed by another worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Issue cannot be claimed (e.g. closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Claim]
      summary: Assign issue
      description: |
        Sets or clears an issue assignee without claiming a work lock. Use the
        claim endpoint for in_progress work ownership.
      operationId: assignIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignIssueRequest"
      responses:
        "200":
          description: Issue assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/lock:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    get:
      tags: [Claim]
      summary: Get current lock holder
      description: |
        Returns the current claim-lock holder and remaining TTL for an issue.
        Returns 404 if no lock is currently held.
      operationId: getIssueLockHolder
      responses:
        "200":
          description: Lock holder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockHolderResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/release-lock:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Claim]
      summary: Release claim lock only
      description: |
        Releases only the distributed claim lock without changing the issue's
        status or assignee. Used by supervisors to drop the lock after the
        agent has already transitioned the issue. Idempotent: a missing lock
        returns 204.
      operationId: releaseIssueLock
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "204":
          description: Lock released (or already absent)
        "409":
          description: A different actor holds the lock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/release:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Claim]
      summary: Release (unclaim) issue
      description: |
        Releases a previously claimed issue back to open status. Clears the
        assignee and makes the issue available in the ready queue again.
      operationId: releaseIssue
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "204":
          description: Issue released
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Actor does not match assignee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Issue cannot be released (e.g. not in_progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Children
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/children:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    get:
      tags: [Issues]
      summary: List child issues
      description: |
        Returns all child issues of a parent issue, sorted by priority.
        Returns the complete list with no pagination. Child counts per issue
        are typically small (<50).
      operationId: getChildren
      x-pagination: none
      responses:
        "200":
          description: List of child issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Issue agent sessions
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    get:
      tags: [ControlPlane]
      summary: List agent sessions for an issue
      description: |
        Returns canonical AgentSession records whose `task_id` matches the
        issue ID, newest first. This is an issue-centric read adapter over the
        AgentSession store; it does not create a separate issue-session record.

        Harness-specific identity belongs in AgentSession metadata. Transcript
        content should be referenced by `metadata.transcript_ref`, normally as
        an `artifact://{artifact_id}` URI readable through the Artifact API.
      operationId: listIssueAgentSessions
      x-pagination: none
      responses:
        "200":
          description: Agent sessions associated with the issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueAgentSessionListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Dependencies
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/deps:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Dependencies]
      summary: Add dependency
      operationId: addDependency
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDependencyRequest"
      responses:
        "201":
          description: Dependency created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependency"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Would create cyclic dependency or self-dependency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Dependencies]
      summary: List dependencies
      description: |
        Returns all dependencies for an issue. Returns the complete list
        with no pagination. Dependency counts per issue are typically small (<20).
      operationId: listDependencies
      x-pagination: none
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/DependencyType"
      responses:
        "200":
          description: List of dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/{id}/deps/{depends_on_id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"
      - name: depends_on_id
        in: path
        required: true
        schema:
          type: string

    delete:
      tags: [Dependencies]
      summary: Remove dependency
      operationId: removeDependency
      parameters:
        - $ref: "#/components/parameters/XActor"
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/DependencyType"
      responses:
        "204":
          description: Dependency removed
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Labels
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/labels:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Labels]
      summary: Add label to issue
      description: |
        Adds the given label to the issue. Idempotent: if the label is already
        present, returns 200 OK with the current issue unchanged (no event is
        emitted). Matches the `mkdir -p` / k8s-apply convention.
      operationId: addLabel
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
      responses:
        "200":
          description: Label added (or already present — idempotent no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/{id}/labels/{label}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"
      - name: label
        in: path
        required: true
        schema:
          type: string

    delete:
      tags: [Labels]
      summary: Remove label from issue
      description: |
        Removes the given label from the issue. Idempotent: if the label is
        not present on the issue, returns 204 No Content (no event is
        emitted). Matches the `rm -f` convention.
      operationId: removeLabel
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "204":
          description: Label removed (or already absent — idempotent no-op)
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Metadata (key/value)
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/metadata/{key}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"
      - name: key
        in: path
        required: true
        description: Metadata key. Must match `^[A-Za-z0-9._-]+$` (URL-path-safe).
        schema:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9._-]+$'

    put:
      tags: [Metadata]
      summary: Set issue metadata key
      description: |
        Sets (upserts) a key/value metadata pair on the issue. Idempotent: if
        the key already holds the given value, returns 200 OK with the issue
        unchanged (no event emitted).
      operationId: setMetadata
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        "200":
          description: Metadata set (or already at that value — idempotent no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Metadata]
      summary: Remove issue metadata key
      description: |
        Removes the given metadata key from the issue. Idempotent: if the key
        is absent, returns 204 No Content (no event emitted).
      operationId: removeMetadata
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "204":
          description: Metadata key removed (or already absent — idempotent no-op)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/labels:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Labels]
      summary: List workspace labels
      description: Returns all labels ever used in the workspace. Alphabetically sorted.
      operationId: listWorkspaceLabels
      x-pagination: none
      responses:
        "200":
          description: List of labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelsListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Ready & Blocked
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/ready:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Ready & Blocked]
      summary: Get ready issues
      description: |
        Returns issues eligible for work: open, unblocked, not deferred,
        ordered by priority then age.

        **Pagination:** This endpoint does not support offset pagination. Use
        `limit` to cap results. Designed for agents to consume the full
        available work list.
      operationId: getReadyIssues
      x-pagination: limit-only
      parameters:
        - name: status
          in: query
          description: Comma-separated status values to include
          schema:
            type: string
        - name: type
          in: query
          description: Comma-separated issue types to include
          schema:
            type: string
        - name: priority
          in: query
          description: Comma-separated priority values to include
          schema:
            type: string
        - name: assignee
          in: query
          schema:
            type: string
        - name: label
          in: query
          description: |
            Filter to issues carrying ALL specified labels (AND semantics).
            Repeatable (`?label=plan&label=review`); comma-separated values
            are also accepted (`?label=plan,review`).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: label_any
          in: query
          description: |
            Filter to issues carrying ANY specified label (OR semantics).
            Repeatable (`?label_any=p0&label_any=urgent`); comma-separated
            values are also accepted (`?label_any=p0,urgent`).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: parent_id
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [hybrid, priority, oldest]
            default: hybrid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: include_deferred
          in: query
          schema:
            type: boolean
        - name: include_assigned
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Ready issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/blocked:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Ready & Blocked]
      summary: Get blocked issues
      description: |
        Returns all issues that have open blockers, with blocker details.
        Returns the complete list with no pagination. Sorted by priority ascending.
      operationId: getBlockedIssues
      x-pagination: none
      responses:
        "200":
          description: Blocked issues with blocker details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/deferred:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Ready & Blocked]
      summary: Get deferred issues
      description: |
        Returns all deferred issues, sorted by `defer_until` ascending.
        Returns the complete list with no pagination.
      operationId: getDeferredIssues
      x-pagination: none
      responses:
        "200":
          description: Deferred issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Comments
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    post:
      tags: [Comments]
      summary: Add comment
      operationId: addComment
      x-status: planned
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Comments]
      summary: List comments
      description: |
        Returns all comments for an issue, newest first.
        Returns the complete list with no pagination. Comment counts per issue
        are typically small (<100).
      operationId: listComments
      x-status: planned
      x-pagination: none
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Events
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/events/mutations:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Events]
      summary: Poll mutation events
      description: |
        Returns mutation events after a cursor position. Uses cursor-based
        pagination.

        **Cursor contract:**
        - `since` is exclusive — returns events AFTER this ID.
        - `cursor` in the response is the last event ID — use as the next `since`.
        - `has_more` is `true` when `len(events) == limit` (more events available).
        - `"0"` means start from the beginning of the stream.

        **Long-polling:** Pass `timeout` (in milliseconds) to block until
        events arrive or the timeout expires. Without `timeout` (or
        `timeout=0`), the endpoint returns immediately.
      operationId: getMutations
      x-pagination: cursor
      parameters:
        - name: since
          in: query
          description: |
            Start position (exclusive). Use "0" for the beginning or a
            Redis Stream ID from a previous response cursor.
          schema:
            type: string
            default: "0"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: timeout
          in: query
          description: |
            Long-poll timeout in milliseconds. When set (>= 1000), the server
            blocks until events arrive or the timeout expires. Use 0 or omit
            for immediate (non-blocking) response. Valid values: 0 (no blocking)
            or 1000–120000 (2 minutes max).
          schema:
            oneOf:
              - type: integer
                enum: [0]
              - type: integer
                minimum: 1000
                maximum: 120000
            default: 0
      responses:
        "200":
          description: Mutation events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/events/stream:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Events]
      summary: Stream mutation events (SSE)
      description: |
        Server-Sent Events stream of real-time mutation events.

        **Event format:**
        ```
        event: {action}
        id: {event_id}
        data: {json_event}
        ```

        **Reconnection:** Pass `Last-Event-ID` header or `last_event_id`
        query parameter to resume from a specific position.

        **Special values:**
        - `$` (default) — subscribe to new events only
        - `0` — replay all historical events

        **Heartbeat:** A `:heartbeat` comment is sent every 30 seconds
        to keep the connection alive.
      operationId: streamEvents
      parameters:
        - name: Last-Event-ID
          in: header
          description: Resume from this event ID
          schema:
            type: string
        - name: last_event_id
          in: query
          description: Alternative to Last-Event-ID header
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Workers
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/workers/{worker_id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: worker_id
        in: path
        required: true
        schema:
          type: string

    delete:
      tags: [Workers]
      summary: Deregister worker
      description: |
        Removes a worker registration (its hash, active-set, and heartbeat-zset
        entries) and releases any issue lock the worker still holds. Idempotent:
        a missing worker is treated as success.
      operationId: deregisterWorker
      responses:
        "204":
          description: Worker deregistered (also returned when the worker was already absent)
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/workers/{worker_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: worker_id
        in: path
        required: true
        schema:
          type: string

    post:
      tags: [Workers]
      summary: Worker heartbeat
      description: Updates a worker's heartbeat timestamp to maintain its active status.
      operationId: workerHeartbeat
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # History
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/history:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    get:
      tags: [History]
      summary: Get issue history
      description: |
        Returns a timeline of events for an issue, with cursor-based pagination.
        Supports filtering by action type, actor, and time range.
      operationId: getIssueHistory
      parameters:
        - name: action
          in: query
          description: Comma-separated action types to filter by
          schema:
            type: string
        - name: actor
          in: query
          description: Filter events by actor
          schema:
            type: string
        - name: since
          in: query
          description: |
            Start position (exclusive). Use "0" for the beginning or a
            Redis Stream ID from a previous response cursor.
          schema:
            type: string
            default: "0"
        - name: before
          in: query
          description: End position (exclusive). A Redis Stream ID.
          schema:
            type: string
        - name: start_time
          in: query
          description: Filter events after this time (RFC3339)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: Filter events before this time (RFC3339)
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Issue history timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/issues/{id}/at/{timestamp}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"
      - name: timestamp
        in: path
        required: true
        description: RFC3339 timestamp for point-in-time reconstruction
        schema:
          type: string
          format: date-time
          example: "2025-02-15T10:30:00Z"

    get:
      tags: [History]
      summary: Reconstruct issue at point in time
      description: |
        Reconstructs the issue state as it existed at the given timestamp by
        replaying events from the creation event up to the specified time.
        Returns null issue if the issue was deleted before the timestamp.
      operationId: getIssueAtTimestamp
      responses:
        "200":
          description: Reconstructed issue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtTimestampResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Event data for this issue is malformed and cannot be reconstructed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Revert
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/issues/{id}/revert/{event_id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"
      - name: event_id
        in: path
        required: true
        description: Redis Stream ID of the event to revert
        schema:
          type: string
          example: "1708000000000-0"

    post:
      tags: [History]
      summary: Revert an event
      description: |
        Reverts a specific event by computing and applying inverse operations.
        The revert is recorded as new event(s) with metadata linking back to the
        original. Not all event types are revertible (e.g. issue.create,
        issue.delete, comment.add return 400). Returns 409 if a field changed
        by the target event has been modified since.
      operationId: revertEvent
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "200":
          description: Event reverted, updated issue returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # V2 Endpoints (Opaque Cursors)
  # ---------------------------------------------------------------------------
  # V2 endpoints use opaque cursor tokens instead of raw Redis stream IDs.
  # Cursors are base64url-encoded with a "c1." version prefix.
  # V1 endpoints remain unchanged for backward compatibility.

  /api/v2/{workspace}/events/mutations:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Events]
      summary: Poll mutation events (v2, opaque cursors)
      description: |
        Returns mutation events after a cursor position. Uses opaque cursor tokens
        instead of raw Redis stream IDs. Otherwise identical to v1.

        **Cursor contract:**
        - `since` must be "0" (beginning) or an opaque cursor from a previous response.
        - `cursor` in the response is an opaque token — use as the next `since`.
        - Raw Redis stream IDs are rejected with 400.
      operationId: getMutationsV2
      x-pagination: cursor
      parameters:
        - name: since
          in: query
          description: |
            Start position (exclusive). Use "0" for the beginning or an
            opaque cursor token from a previous response.
          schema:
            type: string
            default: "0"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: timeout
          in: query
          description: |
            Long-poll timeout in milliseconds. Same behavior as v1.
          schema:
            oneOf:
              - type: integer
                enum: [0]
              - type: integer
                minimum: 1000
                maximum: 120000
            default: 0
      responses:
        "200":
          description: Mutation events with opaque cursors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/{workspace}/events/stream:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Events]
      summary: Stream mutation events via SSE (v2, opaque cursors)
      description: |
        Server-Sent Events stream with opaque cursor tokens in `id:` fields.
        `Last-Event-ID` must be an opaque cursor from a previous v2 response.
        Raw Redis stream IDs are rejected with 400.
      operationId: streamEventsV2
      parameters:
        - name: Last-Event-ID
          in: header
          description: Resume from this opaque cursor token
          schema:
            type: string
        - name: last_event_id
          in: query
          description: Alternative to Last-Event-ID header (opaque cursor)
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream with opaque cursor IDs
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/{workspace}/issues/{id}/history:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"

    get:
      tags: [History]
      summary: Get issue history (v2, opaque cursors)
      description: |
        Returns a timeline of events with opaque cursor tokens. `since` and
        `before` must be opaque cursors from previous v2 responses (or "0").
      operationId: getIssueHistoryV2
      parameters:
        - name: action
          in: query
          description: Comma-separated action types to filter by
          schema:
            type: string
        - name: actor
          in: query
          description: Filter events by actor
          schema:
            type: string
        - name: since
          in: query
          description: Start position (exclusive). "0" or opaque cursor.
          schema:
            type: string
            default: "0"
        - name: before
          in: query
          description: End position (exclusive). Opaque cursor token.
          schema:
            type: string
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Issue history with opaque cursors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/{workspace}/issues/{id}/at/{timestamp}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"
      - name: timestamp
        in: path
        required: true
        description: RFC3339 timestamp for point-in-time reconstruction
        schema:
          type: string
          format: date-time
          example: "2025-02-15T10:30:00Z"

    get:
      tags: [History]
      summary: Reconstruct issue at point in time (v2, opaque cursors)
      description: |
        Same as v1 but `last_event_id` in the response is an opaque cursor.
      operationId: getIssueAtTimestampV2
      responses:
        "200":
          description: Reconstructed issue state with opaque last_event_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtTimestampResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Event data for this issue is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/{workspace}/issues/{id}/revert/{event_id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IssueID"
      - name: event_id
        in: path
        required: true
        description: Opaque cursor token for the event to revert
        schema:
          type: string

    post:
      tags: [History]
      summary: Revert an event (v2, opaque cursors)
      description: |
        Same as v1 but `event_id` must be an opaque cursor token from a v2
        history response. Raw Redis stream IDs are rejected with 400.
      operationId: revertEventV2
      parameters:
        - $ref: "#/components/parameters/XActor"
      responses:
        "200":
          description: Event reverted, updated issue returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Admin (Recovery)
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/admin/replay:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    post:
      tags: [Admin]
      summary: Start full replay
      description: |
        Triggers a full event replay to rebuild projections from the event
        stream. Returns 202 immediately; use the status endpoint to poll
        progress. Only one replay can run at a time (returns 409 if already
        running).
      operationId: startReplay
      responses:
        "202":
          description: Replay started
          content:
            application/json:
              schema:
                type: object
                required: [status, status_url]
                properties:
                  status:
                    type: string
                    example: started
                  status_url:
                    type: string
                    example: /api/v1/FLEET/admin/replay/status
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/admin/replay/status:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Admin]
      summary: Get replay status
      description: Returns the current status and progress of a replay operation.
      operationId: getReplayStatus
      responses:
        "200":
          description: Replay status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/admin/export:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    post:
      tags: [Admin]
      summary: Export workspace events
      description: |
        Streams all workspace events as JSONL (newline-delimited JSON).
        Returns a downloadable file attachment.
      operationId: exportEvents
      responses:
        "200":
          description: Event stream as JSONL
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON events
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/admin/import:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    post:
      tags: [Admin]
      summary: Import workspace events
      description: |
        Reads JSONL events from the request body and imports them into the
        workspace event stream.
      operationId: importEvents
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: Newline-delimited JSON events
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [events_imported]
                properties:
                  events_imported:
                    type: integer
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/{workspace}/admin/verify:
    parameters:
      - $ref: "#/components/parameters/Workspace"

    get:
      tags: [Admin]
      summary: Verify projection consistency
      description: |
        Replays all events in-memory and compares the resulting state against
        the actual projected state in Redis. Returns a report of discrepancies
        without modifying any data.
      operationId: verifyProjection
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
        "500":
          $ref: "#/components/responses/InternalError"

