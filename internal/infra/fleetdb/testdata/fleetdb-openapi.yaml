          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOwnershipLease"

  /api/v1/{workspace}/agent-ownership-leases/{agent_id}/acquire:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: agent_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [ControlPlane]
      summary: Acquire an agent ownership lease (upsert-with-guard)
      description: |
        Idempotent for the same `owner_id`: bumps the fencing token and refreshes the TTL.
        Returns 409 `already_claimed` if a live lease is held by a different owner.
      operationId: acquireAgentOwnershipLease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquireAgentOwnershipLeaseRequest"
      responses:
        "200":
          description: Lease acquired or refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOwnershipLease"
        "409":
          description: Live lease held by a different owner

  /api/v1/{workspace}/agent-ownership-leases/{agent_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: agent_id
        in: path
        required: true
        schema: { type: string }
      - name: X-Agent-Ownership-Lease-Token
        in: header
        required: true
        schema: { type: string }
    post:
      tags: [ControlPlane]
      summary: Renew an agent ownership lease
      operationId: heartbeatAgentOwnershipLease
      parameters:
        - name: ttl_seconds
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lease renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOwnershipLease"
        "403":
          description: Caller is not the lease owner
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /api/v1/{workspace}/agent-ownership-leases/{agent_id}/release:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: agent_id
        in: path
        required: true
        schema: { type: string }
      - name: X-Agent-Ownership-Lease-Token
        in: header
        required: true
        schema: { type: string }
    post:
      tags: [ControlPlane]
      summary: Release an agent ownership lease
      operationId: releaseAgentOwnershipLease
      responses:
        "200":
          description: Lease released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOwnershipLease"
        "403":
          description: Caller is not the lease owner

  /api/v1/{workspace}/agent-commands:
    parameters:
