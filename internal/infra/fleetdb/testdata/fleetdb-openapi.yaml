  # ---------------------------------------------------------------------------
  # Awaits (await-event registry + DriverRun suspend/resume lifecycle)
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/awaits/register-and-check:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Awaits]
      summary: Atomically register an await or satisfy it from the event journal
      description: >-
        The single registration entry point (RULE 2): one call either replays
        a recorded resolution, satisfies the await against an
        already-journaled event, or leaves it pending. There is deliberately no
        separate check or register endpoint.
      operationId: registerAwaitAndCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAwaitRequest"
      responses:
        "200":
          description: Registration outcome (pending, satisfied, or replayed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAwaitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/{workspace}/awaits:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Awaits]
      summary: List pending awaits matching a rendered subject pattern
      description: >-
        Returns ALL pending awaits whose pattern exactly equals the query
        pattern (resolve-ALL multi-waiter), RegisteredAt ascending.
      operationId: listAwaitsByPattern
      parameters:
        - name: pattern
          in: query
          required: true
          description: Fully rendered subject-scoped key (exact equality, no glob).
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Pending await list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAwaitsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/{workspace}/awaits/due:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Awaits]
      summary: List pending awaits whose deadline has passed
      operationId: listDueAwaits
      parameters:
        - name: before
          in: query
          description: RFC3339 deadline cutoff; defaults to the server clock.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Due await list, deadline ascending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAwaitsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/{workspace}/awaits/{instance_key}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AwaitInstanceKey"
    get:
      tags: [Awaits]
      summary: Get one await instance
      operationId: getAwait
      responses:
        "200":
          description: Await instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwaitInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/awaits/{instance_key}/satisfied:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AwaitInstanceKey"
    get:
      tags: [Awaits]
      summary: Get the satisfied (or timed-out) row for replay
      description: >-
        The replay surface: returns the terminal row with its size-capped
        resume payload inline. Pending or cancelled instances are 404.
      operationId: getSatisfiedAwait
      responses:
        "200":
          description: Satisfied or timed-out await with inline resume payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwaitInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/awaits/{instance_key}/resolve:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AwaitInstanceKey"
    post:
      tags: [Awaits]
      summary: Resolve one pending await as satisfied (actor-predicated lane)
      description: >-
        Transitions pending -> satisfied, persisting the verified actor and
        the size-capped resume payload. Only status=satisfied is accepted
        here — the actor predicate runs on this lane. timed_out/cancelled
        require the privileged resolve-system route. Idempotent: resolving an
        already-terminal await returns resume=false.
      operationId: resolveAwait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAwaitRequest"
      responses:
        "200":
          description: Resolution outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveAwaitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/awaits/{instance_key}/resolve-system:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AwaitInstanceKey"
    post:
      tags: [Awaits]
      summary: System-only await resolution (timed_out or cancelled)
      description: >-
        Privileged lane for the timeout sweeper and the cancel cascade,
        gated by the await.resolve_system permission (admin/maintainer
        keys only). Accepts status timed_out or cancelled exclusively;
        satisfied stays on the public resolve route where the actor
        predicate runs.
      operationId: resolveAwaitSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAwaitRequest"
      responses:
        "200":
          description: Resolution outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveAwaitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/driver-runs/{run_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/DriverRunID"
    post:
      tags: [Awaits]
      summary: Suspend a running driver run on its await instance
      description: >-
        running -> suspended_awaiting_event, owner-fenced, releasing the
        executor slot. 409 driver_run_already_resumed means the await
        resolved inside the pending->suspend window — do not suspend, continue
        inline.
      operationId: suspendDriverRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendDriverRunRequest"
      responses:
        "200":
          description: Suspended driver run (idempotent on re-suspend)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/{workspace}/driver-runs/{run_id}/resume:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/DriverRunID"
    post:
      tags: [Awaits]
      summary: Resume a suspended driver run after its await resolved
      description: >-
        suspended_awaiting_event -> queued, recording the resolving event.
        Tolerant of still-running runs (pending->suspend window): the run then
        stays running with a pending-resume marker and the response status
        reflects that. Of two racing resumes exactly one wins; the loser
        gets 409 invalid_transition.
      operationId: resumeDriverRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeDriverRunRequest"
      responses:
        "200":
          description: Driver run after the resume attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

