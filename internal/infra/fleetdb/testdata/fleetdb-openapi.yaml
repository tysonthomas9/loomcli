  /api/v1/{workspace}/artifact-commands/create:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [ControlPlane]
      summary: Create a TaskRun-owned artifact through an owner-fenced command
      description: >-
        Service-actor-only owner command. The raw lease token is required,
        hashed at the API boundary, and never returned. Exact command replay
        returns the original committed snapshot after later lifecycle changes.
      operationId: createArtifactCommand
      parameters:
        - name: X-Lease-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactCreateCommand"
      responses:
        "201":
          description: Artifact command committed or replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactCommandResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/{workspace}/artifacts/{artifact_id}/commands/upload:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/ArtifactID"
    post:
      tags: [ControlPlane]
      summary: Upload TaskRun-owned artifact bytes with owner fencing and revision CAS
      description: >-
        Service actor only. The raw lease token is hashed at the API boundary
        and never returned. A bounded retry body is hashed and checked against
        an immutable command receipt before the content store or live owner is
        consulted; exact replay returns the original committed snapshot and
        divergent same-ID replay conflicts. On first application, at most 64
        MiB is written to the configured content-addressed store before the
        resulting URI, size, and digest are committed through the atomic
        owner-fenced metadata command. A concurrent owner or revision change
        can leave only an unreferenced content-addressed object eligible for
        garbage collection; stale authority cannot attach it to the Artifact.
        The request Content-Type is persisted as the Artifact MIME type and is
        part of the immutable command fingerprint, so exact retries must send
        the same media type as well as the same bytes.
      operationId: uploadArtifactCommand
      parameters:
        - name: X-Command-ID
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: X-Task-Run-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-Node-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-Lease-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-Lease-Token
          in: header
          required: true
          schema: { type: string }
        - name: X-Fencing-Token
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: X-Expected-Revision
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
              maxLength: 67108864
      responses:
        "200":
          description: Content and metadata command committed or replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactCommandResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: Artifact content exceeds 64 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/{workspace}/artifacts/{artifact_id}/commands/finalize:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/ArtifactID"
    post:
      tags: [ControlPlane]
      summary: Finalize an artifact with owner fencing and revision CAS
      description: >-
        Service-actor-only owner command. An immutable command receipt is
        checked before content verification or live owner state; exact replay
