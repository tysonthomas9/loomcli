    TriggerEventOrigin:
      type: string
      enum: [external, workflow, system]
      description: >-
        Server-stamped event provenance: webhook ingest and the trusted Loom
        session-attestation lane stamp external (hop_depth 0), the workflow
        events API stamps workflow (hop_depth parent+1, capped), and system
        schedulers stamp system.

    TriggerEvent:
      type: object
      required: [workspace_key, event_id, source_kind, event_type, occurred_at, received_at]
      properties:
        workspace_key: { type: string }
        event_id: { type: string }
        trigger_binding_id: { type: string }
        route_key: { type: string }
        source_kind: { type: string }
        source_event_id: { type: string }
        event_type: { type: string }
