    # --- Await-event registry schemas ---

    AwaitStatus:
      type: string
      enum: [pending, satisfied, timed_out, cancelled]

    AwaitInstance:
      type: object
      required: [workspace_key, instance_key, run_id, pattern, deadline, registered_at, status]
      properties:
        workspace_key: { type: string }
        instance_key:
          type: string
          description: Canonical identity, runID#await-{n} with n >= 1.
        run_id: { type: string }
        pattern:
          type: string
          description: >-
            Fully rendered subject-scoped key ("event_type:subject") matched
            by exact string equality only — no glob; '*' is a literal.
        actor_allow:
          type: array
          items: { type: string }
          description: Eligible-actor predicate; empty admits any actor.
        deadline:
          type: string
          format: date-time
          description: Mandatory expiry; the timeout sweeper resumes the run past it.
        registered_at: { type: string, format: date-time }
        status:
          $ref: "#/components/schemas/AwaitStatus"
        satisfied_by_event_id:
          type: string
          description: Resolving trigger event (or synthetic await-timeout-* event).
        satisfied_actor: { type: string }
        satisfied_payload:
          description: Size-capped resume payload returned inline on replay.
        resumed_at:
          type: string
          format: date-time
          nullable: true

    RegisterAwaitRequest:
      type: object
      required: [instance_key, run_id, pattern, deadline]
      properties:
        instance_key: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1 }
        pattern: { type: string, minLength: 1 }
        actor_allow:
          type: array
          items: { type: string }
        deadline: { type: string, format: date-time }
        registered_at: { type: string, format: date-time }

    RegisterAwaitResponse:
      type: object
      required: [await, satisfied]
      properties:
        await:
          $ref: "#/components/schemas/AwaitInstance"
        satisfied:
          type: boolean
          description: >-
            false means pending — suspend the run. true means do not suspend;
            the row's status distinguishes satisfied from a timed-out or
            cancelled replay.

    ResolveAwaitRequest:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string }
        status:
          $ref: "#/components/schemas/AwaitStatus"
        actor: { type: string }
        payload:
          description: Resume payload, rejected (never truncated) above the cap.

    ResolveAwaitResponse:
      type: object
      required: [await, resume]
      properties:
        await:
          $ref: "#/components/schemas/AwaitInstance"
        resume:
          type: boolean
          description: >-
            true when this call won the pending -> terminal transition and
            the caller owns resuming the suspended run.

    ListAwaitsResponse:
      type: object
      required: [awaits, count]
      properties:
        awaits:
          type: array
          items:
            $ref: "#/components/schemas/AwaitInstance"
        count: { type: integer }

    SuspendDriverRunRequest:
      type: object
      required: [node_id, lease_id, fencing_token, await_instance_key]
      properties:
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token: { type: integer, format: int64 }
        await_instance_key: { type: string }

    ResumeDriverRunRequest:
      type: object
      required: [await_instance_key, resume_event_id]
      properties:
        await_instance_key: { type: string }
        resume_event_id: { type: string }

    # --- First-class entity schemas (Repo / Agent / Role / DaemonProfile) ---

