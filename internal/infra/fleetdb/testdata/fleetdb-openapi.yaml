      type: string
      enum: [external, workflow, system]
      description: >-
        Server-stamped event provenance: webhook ingest stamps external
        (hop_depth 0), the workflow events API stamps workflow
        (hop_depth parent+1, capped), system schedulers stamp system.

    TriggerEvent:
      type: object
      required: [workspace_key, event_id, source_kind, event_type, occurred_at, received_at]
      properties:
        workspace_key: { type: string }
        event_id: { type: string }
        trigger_binding_id: { type: string }
        source_kind: { type: string }
        source_event_id: { type: string }
        event_type: { type: string }
        subject_ref: { type: string }
        actor_ref: { type: string }
        origin:
          $ref: "#/components/schemas/TriggerEventOrigin"
        hop_depth:
          type: integer
          minimum: 0
          description: Workflow re-trigger hops from the originating external/system event (depth 0).
        occurred_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        idempotency_key: { type: string }
        raw_payload_ref: { type: string }
        raw_payload_digest: { type: string }
        signature_status: { type: string }
        replay_of_event_id: { type: string }

