  # ---------------------------------------------------------------------------
  # Awaits (await-event registry + DriverRun suspend/resume lifecycle)
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/awaits/register-and-check:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Awaits]
      summary: Atomically register an await or satisfy it from the event journal
      description: >-
        Service-actor-only runtime command. The single registration entry point
        (RULE 2) either replays a recorded resolution, satisfies the await
        against an already-journaled event, or leaves it pending. There is
        deliberately no separate check or register endpoint.
      operationId: registerAwaitAndCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAwaitRequest"
      responses:
        "200":
          description: Registration outcome (pending, satisfied, or replayed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAwaitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/{workspace}/awaits:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Awaits]
      summary: List pending awaits matching a rendered subject pattern
      description: >-
        Returns ALL pending awaits whose pattern exactly equals the query
        pattern (resolve-ALL multi-waiter), RegisteredAt ascending.
      operationId: listAwaitsByPattern
      parameters:
        - name: pattern
          in: query
          required: true
          description: Fully rendered subject-scoped key (exact equality, no glob).
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Pending await list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAwaitsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/{workspace}/awaits/due:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Awaits]
      summary: List pending awaits whose deadline has passed
      operationId: listDueAwaits
      parameters:
        - name: before
          in: query
          description: RFC3339 deadline cutoff; defaults to the server clock.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Due await list, deadline ascending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAwaitsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/{workspace}/awaits/resolve-and-resume:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Awaits]
      summary: Atomically resolve an event await and resume its parent
      description: >-
        Trusted Execution event-dispatch lane. It accepts only an API-key or
        Unix-socket service identity with await.resolve_system permission. The
        pending await transition and suspended-parent wakeup, or the
        pending-resume marker when resolution wins before suspension, commit
        atomically. Exact event replay converges the parent again; a different
        event cannot replace the recorded winner.
      operationId: resolveAwaitAndResume
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveAwaitAndResumeRequest" }
      responses:
        "200":
          description: Await resolution and parent-run state have converged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveAwaitAndResumeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/{workspace}/awaits/resolve-run-outcome:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Awaits]
      summary: Atomically resolve a run.finished await and resume its parent
      description: >-
        Trusted runtime-host lane. It accepts only an API-key or Unix-socket
        service identity with await.resolve_system permission. The pending
        await transition and suspended-parent wakeup (or pending-resume marker)
        commit atomically. Exact event replay converges the parent again; an
        actor-rejected co-waiter is a successful no-op and remains pending.
      operationId: resolveRunOutcomeAwaitAndResume
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRunOutcomeAwaitRequest" }
      responses:
        "200":
          description: Await resolution converged or was an intentional no-op
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveRunOutcomeAwaitResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/{workspace}/awaits/{instance_key}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AwaitInstanceKey"
    get:
      tags: [Awaits]
      summary: Get one await instance
      operationId: getAwait
      responses:
        "200":
          description: Await instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwaitInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/awaits/{instance_key}/satisfied:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AwaitInstanceKey"
    get:
      tags: [Awaits]
      summary: Get the satisfied (or timed-out) row for replay
      description: >-
        The replay surface: returns the terminal row with its size-capped
        resume payload inline. Pending or cancelled instances are 404.
      operationId: getSatisfiedAwait
      responses:
        "200":
          description: Satisfied or timed-out await with inline resume payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwaitInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/awaits/{instance_key}/resolve:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AwaitInstanceKey"
    post:
      tags: [Awaits]
      summary: Legacy service-only split resolution as satisfied
      description: >-
        Compatibility lane for an authenticated API-key or Unix-socket
        service identity. Transitions pending -> satisfied, persisting the
        service-verified semantic event actor and size-capped resume payload.
        Only status=satisfied is accepted here; timed_out/cancelled require
        resolve-system. New dispatchers use the atomic resolve-and-resume
        command instead. Idempotent: an already-terminal await returns
        resume=false.
      deprecated: true
      operationId: resolveAwait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAwaitRequest"
      responses:
        "200":
          description: Resolution outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveAwaitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/awaits/{instance_key}/resolve-system:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AwaitInstanceKey"
    post:
      tags: [Awaits]
      summary: Legacy service-only system resolution (timed_out or cancelled)
      description: >-
        Compatibility lane for an authenticated API-key or Unix-socket
        service identity with await.resolve_system. Accepts status timed_out
        or cancelled exclusively; satisfied stays on the actor-predicated
        resolve route. New timeout dispatchers use the atomic
        resolve-and-resume command.
      deprecated: true
      operationId: resolveAwaitSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAwaitRequest"
      responses:
        "200":
          description: Resolution outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveAwaitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/driver-runs/{run_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/DriverRunID"
    post:
      tags: [Awaits]
      summary: Suspend a running driver run on its await instance
      description: >-
        Service-actor-only owner command. The raw lease token is required and
        hashed at the API boundary. The running -> suspended_awaiting_event
        transition releases the executor slot. 409 driver_run_already_resumed
        means the await resolved inside the pending->suspend window; do not
        suspend and continue inline.
      operationId: suspendDriverRun
      parameters:
        - $ref: "#/components/parameters/XLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendDriverRunRequest"
      responses:
        "200":
          description: Suspended driver run (idempotent on re-suspend)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/{workspace}/driver-runs/{run_id}/resume:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/DriverRunID"
    post:
      tags: [Awaits]
      summary: Resume a suspended driver run after its await resolved
      description: >-
        Service-only compatibility command. The await must belong to this run,
        be satisfied or timed_out, and name the exact winning event.
        suspended_awaiting_event -> queued records that event. A still-running
        run may advance its pending-resume marker only to a higher await
        ordinal, preserving old-Loom pending->suspend behavior without letting
        delayed retries move execution backward. New dispatchers use the
        atomic resolve-and-resume command.
      deprecated: true
      operationId: resumeDriverRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeDriverRunRequest"
      responses:
        "200":
          description: Driver run after the resume attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ---------------------------------------------------------------------------
  # Repos (first-class entity, workspace-scoped)
  # ---------------------------------------------------------------------------
  /api/v1/{workspace}/repos:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Repos]
      summary: Create a Repo
      description: >-
        Atomically commits the first-class Repo, its `repo.create` audit event,
        and the legacy workspace admission mapping. A 201 response means all
        three are visible together; none survive a rejected request. Returns
        409 when the Repo name already exists or its legacy mapping is owned by
        another workspace. A retry after a lost successful response may
        therefore receive 409 rather than replaying the original 201.
      operationId: createRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
      responses:
        "201":
          description: Repo created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Repos]
      summary: List Repos
      operationId: listRepos
      x-pagination: none
      responses:
        "200":
          description: Repo list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReposResponse"

  /api/v1/{workspace}/repos/{name}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/EntityName"
    get:
      tags: [Repos]
      summary: Get a Repo
      operationId: getRepo
      responses:
        "200":
          description: Repo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Repos]
      summary: Update a Repo
      description: >-
        Atomically updates the existing repository and appends its audit event.
        Returns a conflict when the update is stale or when changing
        `source_repo_id` would orphan an identifier still referenced by work or
        execution provenance.
      operationId: updateRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepoRequest"
      responses:
        "204":
          description: Repo updated
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Repos]
      summary: Delete a Repo
      description: >-
        Deletes the first-class repository and its display-name workspace
        admission mapping in one commit, but only when neither its `name` nor
        effective source identifier (`source_repo_id`, falling back to `name`)
        is referenced by a non-terminal Work Item or a queued/running TaskRun
        placement. The last admitted Repo is also the implicit fallback for an
        open, repo-less, non-epic Work Item and cannot be deleted while such a
        card is dispatch-ready. A rejected deletion is atomic and leaves the
        repository, workspace mapping, work, execution, and audit state
        unchanged.
      operationId: deleteRepo
      responses:
        "204":
          description: Repo deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

