        "201":
          description: Exact committed managed binding snapshot, with secrets redacted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/{workspace}/automation/managed-bindings/{binding_id}/replace:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: binding_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      tags: [Automation]
      summary: Conditionally replace an AgentService-owned TriggerBinding
      description: >-
        Compares the exact owner, route, creation timestamp, and update
        timestamp before committing the replacement. This prevents stale
        writers and delete/recreate ABA from mutating a different generation.
      operationId: replaceManagedAutomationBinding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationManagedBindingReplaceRequest" }
      responses:
        "200":
          description: Exact committed managed binding snapshot, with secrets redacted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Managed binding owner or generation changed concurrently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/{workspace}/automation/managed-bindings/{binding_id}/delete:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: binding_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      tags: [Automation]
      summary: Conditionally delete a disabled AgentService-owned TriggerBinding
      description: >-
        Deletes only the exact disabled owner/generation snapshot. Ambiguous
        response recovery probes that snapshot before deciding whether retry
        is safe, so an intervening recreation is never deleted.
      operationId: deleteManagedAutomationBinding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationManagedBindingSnapshotRequest" }
      responses:
        "204": { description: Exact managed binding generation deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Managed binding owner or generation changed concurrently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

