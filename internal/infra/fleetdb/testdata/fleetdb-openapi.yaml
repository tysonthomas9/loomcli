      required: [agent_commands, count]
      properties:
        agent_commands:
          type: array
          items: { $ref: "#/components/schemas/AgentCommand" }
        count: { type: integer }

    AgentInboxMessage:
      type: object
      required: [workspace_key, inbox_message_id, cursor, target_agent_id, body, status, created_at, updated_at]
      properties:
        workspace_key:        { type: string }
        inbox_message_id:     { type: string }
        cursor:               { type: integer, format: int64 }
        target_agent_id:      { type: string }
        session_id:           { type: string }
        body:                 { type: string }
        status:
          type: string
          enum: [queued, delivered, failed]
        source_kind:          { type: string }
        source_ref:           { type: string }
        driver_run_id:        { type: string }
        task_run_id:          { type: string }
        trigger_event_id:     { type: string }
        trigger_delivery_id:  { type: string }
        dedupe_key:           { type: string }
        attempt:              { type: integer }
        claimed_by:           { type: string }
        claim_expires_at:
          type: string
          format: date-time
          nullable: true
        last_error:           { type: string }
        error_class:          { type: string }
        delivered_thread_id:  { type: string }
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:           { type: string, format: date-time }
        updated_at:           { type: string, format: date-time }

    CreateAgentInboxMessageRequest:
      type: object
      required: [target_agent_id, body]
      properties:
        inbox_message_id:     { type: string }
        target_agent_id:      { type: string }
        session_id:           { type: string }
        body:                 { type: string }
        source_kind:          { type: string }
        source_ref:           { type: string }
        driver_run_id:        { type: string }
        task_run_id:          { type: string }
        trigger_event_id:     { type: string }
        trigger_delivery_id:  { type: string }
        dedupe_key:           { type: string }

    ClaimAgentInboxMessageRequest:
      type: object
      required: [target_agent_id, claimed_by]
      properties:
        target_agent_id: { type: string }
        session_id:      { type: string }
        claimed_by:      { type: string }
        lease_ttl_ms:
          type: integer
          format: int64

    CompleteAgentInboxMessageRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [delivered, retry, failed]
        delivered_thread_id: { type: string }
        error_class:         { type: string }
        error:               { type: string }

    ListAgentInboxMessagesResponse:
      type: object
      required: [agent_inbox_messages, count]
      properties:
        agent_inbox_messages:
          type: array
          items: { $ref: "#/components/schemas/AgentInboxMessage" }
        count: { type: integer }

    Role:
      type: object
      required: [workspace_key, name, created_at, updated_at]
      properties:
        workspace_key: { type: string }
        name:          { type: string }
        description:   { type: string }
        kind:
          type: string
          enum: [interactive, worker]
        prompt:        { type: string }
        prompt_file:   { type: string }
        model:         { type: string }
        task_filter:   { type: string }
        backend:       { type: string }
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
        path_patterns:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { type: string }
        max_priority:    { type: integer }
        max_concurrency: { type: integer }
        read_only:       { type: boolean }
        allowed_tools:
          type: array
          items: { type: string }
        denied_tools:
          type: array
          items: { type: string }
        max_budget_usd: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [interactive, worker]
        prompt:      { type: string }
        prompt_file: { type: string }
        model:       { type: string }
        task_filter: { type: string }
        backend:     { type: string }
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
        path_patterns:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { type: string }
        max_priority:    { type: integer }
        max_concurrency: { type: integer }
        read_only:       { type: boolean }
        allowed_tools:
          type: array
          items: { type: string }
        denied_tools:
          type: array
          items: { type: string }
        max_budget_usd: { type: number }

    UpdateRoleRequest:
      type: object
      properties:
        description: { type: string }
        kind:
          type: string
          enum: ["", interactive, worker]
        prompt:      { type: string }
        prompt_file: { type: string }
        model:       { type: string }
        task_filter: { type: string }
        backend:     { type: string }
        effort:
          type: string
          enum: ["", low, medium, high, xhigh, max]
        path_patterns:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { type: string }
        max_priority:        { type: integer }
        clear_max_priority:  { type: boolean }
        max_concurrency:     { type: integer }
        clear_concurrency:   { type: boolean }
        read_only:           { type: boolean }
        allowed_tools:
          type: array
          items: { type: string }
        denied_tools:
          type: array
          items: { type: string }
        max_budget_usd:       { type: number }
        clear_max_budget_usd: { type: boolean }

    ListRolesResponse:
      type: object
      required: [roles, count]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        count: { type: integer }

    RestartPolicy:
      type: object
      properties:
        max_retries:         { type: integer }
        backoff_initial:     { type: integer }
        backoff_max:         { type: integer }
        backoff_multiplier:  { type: integer }
        reset_after_success: { type: integer }

    OTelSettings:
      type: object
      properties:
        enabled:      { type: boolean }
        endpoint:     { type: string }
        service_name: { type: string }
        sample_rate:  { type: number }
        headers:
          type: object
          additionalProperties: { type: string }

    DaemonProfile:
      type: object
      required: [workspace_key, updated_at]
      properties:
        workspace_key:   { type: string }
        pid_file:        { type: string }
        log_dir:         { type: string }
        events_dir:      { type: string }
        issue_backend:   { type: string }
        agent_backend:   { type: string }
        max_agents:      { type: integer }
        startup_timeout: { type: integer }
        restart_policy:  { $ref: "#/components/schemas/RestartPolicy" }
        otel:            { $ref: "#/components/schemas/OTelSettings" }
        updated_at:      { type: string, format: date-time }

    UpsertDaemonProfileRequest:
      type: object
      properties:
        pid_file:        { type: string }
        log_dir:         { type: string }
        events_dir:      { type: string }
        issue_backend:   { type: string }
        agent_backend:   { type: string }
        max_agents:      { type: integer }
        startup_timeout: { type: integer }
        restart_policy:  { $ref: "#/components/schemas/RestartPolicy" }
        otel:            { $ref: "#/components/schemas/OTelSettings" }

    PatchDaemonProfileRequest:
      type: object
      properties:
        pid_file:              { type: string }
        log_dir:               { type: string }
        events_dir:            { type: string }
        issue_backend:         { type: string }
        agent_backend:         { type: string }
        max_agents:            { type: integer }
        clear_max_agents:      { type: boolean }
        startup_timeout:       { type: integer }
        clear_startup_timeout: { type: boolean }
        restart_policy:        { $ref: "#/components/schemas/RestartPolicy" }
        clear_restart_policy:  { type: boolean }
        otel:                  { $ref: "#/components/schemas/OTelSettings" }
        clear_otel:            { type: boolean }

  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Caller is not allowed to mutate this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Gone:
      description: Lease exists but is no longer live (expired or released)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Resource conflict (already exists, already claimed)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BodyTooLarge:
      description: Request body exceeds size limit (1 MB for standard endpoints, 10 MB for batch endpoints)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
