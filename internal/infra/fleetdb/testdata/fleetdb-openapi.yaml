        - claim_work_item
        - release_work_item
        - handoff_review_work_item
        - update_status

    GenericActionLedgerCreateType:
      type: string
      description: Action types accepted by the generic ActionLedger create endpoint. Owner-fenced task_run_work_item_design_update receipts are created only by their atomic command.
      enum:
