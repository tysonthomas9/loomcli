        actor_ref: { type: string }
        emitting_run_id:
          type: string
          description: Server-derived emitting DriverRun for workflow-originated events.
        parent_event_id:
          type: string
          description: Server-derived parent TriggerEvent used to calculate durable hop depth.
        epic_id: { type: string }
        origin:
          $ref: "#/components/schemas/TriggerEventOrigin"
        hop_depth:
          type: integer
          minimum: 0
          description: Workflow re-trigger hops from the originating external/system event (depth 0).
        occurred_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        idempotency_key: { type: string }
        raw_payload_ref: { type: string }
        raw_payload_digest: { type: string }
        signature_status: { type: string }
        replay_of_event_id: { type: string }
        payload_base64:
          type: string
          format: byte
          description: Standard-base64 encoding of the exact immutable payload bytes.
        subject_attrs:
          type: object
          maxProperties: 64
          additionalProperties: { type: string }

    CreateTriggerEventRequest:
      type: object
      additionalProperties: false
      required: [source_kind, event_type]
      properties:
        event_id: { type: string }
        trigger_binding_id: { type: string }
        source_kind: { type: string }
        source_event_id: { type: string }
        event_type: { type: string }
        subject_ref: { type: string }
        actor_ref: { type: string }
        origin:
          type: string
          enum: [workflow, system, external]
          description: >-
            Provenance lane. Defaults to workflow (hop_depth derived
            server-side from parent_event_id, capped). External is a narrow
            operator-only service attestation: signature_status must be
            "session" and actor_ref must name the Loom-authenticated user.
            Fleet trusts the authenticated Loom service as the attester and
            never accepts this lane from human bearer/header authentication.
            Reserved system actor refs and the run.finished event type are
            rejected on the external lane.
        parent_event_id:
          type: string
          description: Trigger event whose handling produced this workflow-originated event.
        epic_id:
          type: string
          description: Optional durable epic correlation identifier.
        occurred_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        idempotency_key: { type: string }
        raw_payload_ref: { type: string }
        raw_payload_digest: { type: string }
        signature_status: { type: string }
        replay_of_event_id: { type: string }
        payload_base64:
          type: string
          format: byte
          description: Standard-base64 encoding of the exact immutable payload bytes.

