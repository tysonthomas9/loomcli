# =============================================================================
# Components
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    Workspace:
      name: workspace
      in: path
      required: true
      description: |
        Workspace key. Must match pattern: `^[A-Z]([A-Z0-9-]{0,30}[A-Z0-9])?$`
      schema:
        type: string
        pattern: "^[A-Z]([A-Z0-9-]{0,30}[A-Z0-9])?$"
        minLength: 1
        maxLength: 32
        example: FLEET

    WorkspaceKey:
      name: key
      in: path
      required: true
      description: Workspace key
      schema:
        type: string
        pattern: "^[A-Z]([A-Z0-9-]{0,30}[A-Z0-9])?$"
        minLength: 1
        maxLength: 32
        example: FLEET

    IssueID:
      name: id
      in: path
      required: true
      description: "Issue ID (e.g. FLEET-42)"
      schema:
        type: string
        example: FLEET-42

    XActor:
      name: X-Actor
      in: header
      required: true
      description: Identity of the actor performing the operation
      schema:
        type: string
        example: alice

    XIdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: |
        Optional idempotency key. If provided and a request with the same
        key was already processed in this workspace by the same
        authenticated actor, the original response is replayed (200 +
        `X-Idempotency-Replayed: true`) instead of creating again. Keys
        expire after 24 hours. Max 128 characters, printable ASCII without
        spaces; a present-but-empty header is rejected (400).

        Implemented for single issue create (POST /issues) on Redis-backed
        deployments. Stored at `fleet-db:{ws}:idempotency:{digest}` where
        digest = sha256(actor, key). Ignored on Postgres-backed deployments
        and on non-create endpoints (no error). The dedup guarantee is
        best-effort-strong: a create stalling past the 30s reservation
        window can admit a concurrent same-key mint.

        On key reuse with a different request body — compared as raw body
        bytes, not semantic JSON equality — returns 409 Conflict.

        **Batch create: planned, not implemented.** The batch loop is not
        atomic; honoring a key there could replay a partial prefix of
        created issues. Do not rely on the header for /issues/batch.

        Platform run-dispatch endpoints (e.g. POST /epics/{epic_id}/runs)
        also accept this header to dedupe run admission.
      schema:
        type: string
        maxLength: 128

    EntityName:
      name: name
      in: path
      required: true
      description: |
        Workspace-scoped entity name (Repo, Agent, or Role).
        Lowercase alphanumeric + dot/underscore/hyphen, 1-100 characters.
      schema:
        type: string
        pattern: "^[a-z0-9]([a-z0-9._-]{0,98}[a-z0-9])?$"
        minLength: 1
        maxLength: 100

    NodeID:
      name: node_id
      in: path
      required: true
      description: Runtime node identifier.
      schema:
        type: string
        minLength: 1

    AgentSessionID:
      name: session_id
      in: path
      required: true
      description: Agent session identifier.
      schema:
        type: string
        minLength: 1

    TerminalID:
      name: terminal_id
      in: path
      required: true
      description: Terminal session identifier.
      schema:
        type: string
        minLength: 1

    ArtifactID:
      name: artifact_id
      in: path
      required: true
      description: Artifact identifier.
      schema:
        type: string
        minLength: 1

    AgentLeaseID:
      name: lease_id
      in: path
      required: true
      description: Agent lease identifier.
      schema:
        type: string
        minLength: 1

    LeaseID:
      name: lease_id
      in: path
      required: true
      description: Generic lease identifier.
      schema:
        type: string
        minLength: 1

    AgentCommandID:
      name: command_id
      in: path
      required: true
      description: Agent command identifier.
      schema:
        type: string
        minLength: 1

    AgentInboxMessageID:
      name: inbox_message_id
      in: path
      required: true
      description: Agent inbox message identifier.
      schema:
        type: string
        minLength: 1

    DriverID:
      name: driver_id
      in: path
      required: true
      description: Driver identifier.
      schema:
        type: string
        minLength: 1

    DriverVersionID:
      name: version_id
      in: path
      required: true
      description: Driver version identifier.
      schema:
        type: string
        minLength: 1

    ProfileID:
      name: profile_id
      in: path
      required: true
      description: Worker profile identifier.
      schema:
        type: string
        minLength: 1

    ServiceID:
      name: service_id
      in: path
      required: true
      description: Agent service identifier.
      schema:
        type: string
        minLength: 1

    TriggerBindingID:
      name: binding_id
      in: path
      required: true
      description: Trigger binding identifier.
      schema:
        type: string
        minLength: 1

    ConnectorID:
      name: connector_id
      in: path
      required: true
      description: Connector identifier.
      schema:
        type: string
        minLength: 1

    ConnectorGrantID:
      name: grant_id
      in: path
      required: true
      description: Connector grant identifier.
      schema:
        type: string
        minLength: 1

    TriggerEventID:
      name: event_id
      in: path
      required: true
      description: Trigger event identifier.
      schema:
        type: string
        minLength: 1

    TriggerDeliveryID:
      name: delivery_id
      in: path
      required: true
      description: Trigger delivery identifier.
      schema:
        type: string
        minLength: 1

    ActionID:
      name: action_id
      in: path
      required: true
      description: Action ledger identifier.
      schema:
        type: string
        minLength: 1

    DriverRunID:
      name: run_id
      in: path
      required: true
      description: Driver run identifier.
      schema:
        type: string
        minLength: 1

    DriverStepID:
      name: step_id
      in: path
      required: true
      description: Driver step identifier.
      schema:
        type: string
        minLength: 1

    EpicID:
      name: epic_id
      in: path
      required: true
      description: Epic issue identifier.
      schema:
        type: string
        minLength: 1

    TaskRunID:
      name: task_run_id
      in: path
      required: true
      description: Task run identifier.
      schema:
        type: string
        minLength: 1

    OutboxID:
      name: outbox_id
      in: path
      required: true
      description: Outbox record identifier.
      schema:
        type: string
        minLength: 1

    AwaitInstanceKey:
      name: instance_key
      in: path
      required: true
      description: >-
        Canonical await instance key, runID#await-{n} with n >= 1. The '#'
        must be percent-encoded (%23) on the wire.
      schema:
        type: string
        minLength: 1

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # --- Domain Models ---

    Issue:
      type: object
      required: [id, workspace, title, has_design, status, priority, type, created_at, created_by, updated_at]
      properties:
        id:
          type: string
          example: FLEET-42
        workspace:
          type: string
          example: FLEET
        title:
          type: string
          maxLength: 500
        description:
          type: string
        design:
          type: string
          description: |
            Hydrated design body on single-issue responses. Collection
            responses omit the body; use has_design and design_artifact_id to
            detect an available design without loading large content.
        design_format:
          type: string
          enum: [markdown, html]
          description: Format of the hydrated design body, derived from artifact MIME metadata.
        design_artifact_id:
          type: string
          description: Managed artifact reference for newly written designs.
        has_design:
          type: boolean
          description: True for either a legacy inline design or an artifact-backed design.
        acceptance_criteria:
          type: string
        notes:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        priority:
          type: integer
          minimum: 0
          maximum: 4
          default: 2
          description: "0=critical, 1=high, 2=medium, 3=low, 4=backlog"
        type:
          $ref: "#/components/schemas/IssueType"
        assignee:
          type: string
        owner:
          type: string
        estimated_minutes:
          type: integer
          minimum: 0
          nullable: true
        labels:
          type: array
          items:
            type: string
        metadata:
          type: object
          description: |
            Free-form key/value metadata. Always present ({} when empty). New
            keys are subject to a best-effort 64-entry command-time limit;
            concurrent sets validated against the same snapshot can briefly
            exceed it.
          additionalProperties:
            type: string
        external_ref:
          type: string
        defer_until:
          type: string
          format: date-time
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        parent_id:
          type: string
        repo:
          type: string
        source_repo:
          type: string
          description: Alias for `repo` emitted for legacy Loom clients. Same value.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        close_reason:
          type: string

    Comment:
      type: object
      required: [id, issue_id, author, body, created_at]
      properties:
        id:
          type: string
          example: "1"
        issue_id:
          type: string
          example: FLEET-42
        author:
          type: string
          example: alice
        body:
          type: string
        created_at:
          type: string
          format: date-time

    Dependency:
      type: object
      required: [issue_id, depends_on_id, type, created_at, created_by]
      properties:
        issue_id:
          type: string
        depends_on_id:
          type: string
        type:
          $ref: "#/components/schemas/DependencyType"
        created_at:
          type: string
          format: date-time
        created_by:
          type: string

    Event:
      type: object
      required: [id, timestamp, actor, action, entity_type, entity_id, workspace_id]
      properties:
        id:
          type: string
          description: Redis Stream entry ID
          example: "1708000000000-0"
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          $ref: "#/components/schemas/Action"
        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity_id:
          type: string
        workspace_id:
          type: string
        before:
          type: string
          description: JSON-encoded state before mutation
        after:
          type: string
          description: JSON-encoded state after mutation
        metadata:
          type: object
          additionalProperties:
            type: string

    Workspace:
      type: object
      required: [key, name, created_at, updated_at]
      properties:
        key:
          type: string
          example: FLEET
        name:
          type: string
          maxLength: 200
          example: Fleet Project
        description:
          type: string
        repos:
          type: array
          items:
            type: string
            pattern: "^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$"
          example: ["tysonthomas9/fleet-db"]
        design_format:
          type: string
          enum: ["", markdown, html]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Worker:
      type: object
      required: [id, state, last_heartbeat, registered_at]
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/WorkerState"
        current_task:
          type: string
        current_task_title:
          type: string
        agent_type:
          type: string
        claimed_at:
          type: string
          format: date-time
          nullable: true
        last_heartbeat:
          type: string
          format: date-time
        registered_at:
          type: string
          format: date-time

    HeartbeatResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        ttl:
          type: integer
        error:
          type: string

    # --- Enums ---

    Status:
      type: string
      enum:
        - open
        - in_progress
        - blocked
        - deferred
        - review
        - closed
        - tombstone
        - pinned
        - hooked

    CreateIssueStatus:
      type: string
      description: Create-time status. Omit for open; deferred is supported for pre-scheduled work.
      enum: [open, deferred]

    IssueType:
      type: string
      enum: [task, bug, feature, epic, chore]

    DependencyType:
      type: string
      enum: [blocks, parent-child, related]

    Action:
      type: string
      enum:
        - issue.create
        - issue.update
        - issue.close
        - issue.reopen
        - issue.delete
        - issue.claim
        - issue.release
        - issue.assign
        - issue.defer
        - issue.undefer
        - dep.add
        - dep.remove
        - label.add
        - label.remove
        - comment.add
        - workspace.create
        - workspace.update
        - workspace.delete

    EntityType:
      type: string
      enum: [issue, dependency, label, comment, workspace]

    WorkerState:
      type: string
      enum: [idle, working]

    # --- Request Bodies ---

    CreateIssueRequest:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
        status:
          $ref: "#/components/schemas/CreateIssueStatus"
        priority:
          type: integer
          minimum: 0
          maximum: 4
          default: 2
        type:
          $ref: "#/components/schemas/IssueType"
        assignee:
          type: string
        owner:
          type: string
        labels:
          type: array
          items:
            type: string
        metadata:
          type: object
          description: |
            Free-form key/value metadata. Keys must match
            `^[A-Za-z0-9._-]+$`. New keys are subject to a best-effort 64-entry
            command-time limit; concurrent sets validated against the same
            snapshot can briefly exceed it.
          additionalProperties:
            type: string
        parent_id:
          type: string
        repo:
          type: string
        source_repo:
          type: string
          description: Alias for `repo` emitted for legacy Loom clients. Same value.
        design:
          type: string
        design_format:
          type: string
          enum: [markdown, html]
          description: Format of the supplied design body; defaults to markdown.
        notes:
          type: string
        defer_until:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time

    UpdateIssueRequest:
      type: object
      description: Partial update. Only provided fields are changed.
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 4
        type:
          $ref: "#/components/schemas/IssueType"
        design:
          type: string
        design_format:
          type: string
          enum: [markdown, html]
          description: |
            Format of the supplied design body; defaults to markdown. When
            design is omitted, the existing design body is re-persisted in
            this format. The issue must already have a design.
        notes:
          type: string
        owner:
          type: string
        due_at:
          type: string
          format: date-time
          nullable: true

    AssignIssueRequest:
      type: object
      required: [assignee]
      properties:
        assignee:
          type: string
          description: Assignee name. Empty string clears the assignee.

    BatchCreateIssueRequest:
      type: object
      required: [issues]
      description: |
        Batch create request. All-or-nothing semantics: if any issue fails
        validation, none are created.
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/CreateIssueRequest"
          maxItems: 100
          description: Issues to create (max 100)

    CloseIssueRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional close reason

    BatchCloseIssuesRequest:
      type: object
      required: [issue_ids]
      description: |
        Batch close request. Best-effort semantics: attempts all closures,
        issues already closed are skipped.
      properties:
        issue_ids:
          type: array
          items:
            type: string
          description: IDs of issues to close
        reason:
          type: string
          description: Optional close reason applied to all issues

    ClaimIssueRequest:
      type: object
      properties:
        lock_ttl:
          type: integer
          description: Lock TTL in seconds. Defaults to 300.
          default: 300

    LockHolderResponse:
      type: object
      required: [holder, ttl_ms]
      properties:
        holder:
          type: string
          description: Identifier of the actor currently holding the lock.
        ttl_ms:
          type: integer
          format: int64
          description: Remaining lock TTL in milliseconds.

    AddDependencyRequest:
      type: object
      required: [depends_on_id, type]
      properties:
        depends_on_id:
          type: string
        type:
          $ref: "#/components/schemas/DependencyType"

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string

    CreateWorkspaceRequest:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[A-Z]([A-Z0-9-]{0,30}[A-Z0-9])?$"
          minLength: 1
          maxLength: 32
        name:
          type: string
          maxLength: 200
        description:
          type: string
        repos:
          type: array
          items:
            type: string
            pattern: "^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$"
        design_format:
          type: string
          enum: ["", markdown, html]

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        add_repos:
          type: array
          items:
            type: string
        del_repos:
          type: array
          items:
            type: string
        design_format:
          type: string
          enum: ["", markdown, html]

    # --- Response Wrappers ---

    BatchCreateResponse:
      type: object
      required: [issues, count]
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        count:
          type: integer
          description: Number of issues created

    IssueListResponse:
      type: object
      required: [issues, count]
      description: |
        Paginated issue list. The `count` field reflects the number of items
        in this page. The `total`, `offset`, and `limit` fields are planned
        additions that will be included once the API handler passes through
        the storage layer's total count.
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        count:
          type: integer
          description: Number of items in this page
        total:
          type: integer
          description: |
            Total matching items before pagination.
            **Status: planned** — the storage layer computes this but the
            service/API layers do not yet return it.
        offset:
          type: integer
          description: Applied offset (echoed back)
        limit:
          type: integer
          description: Applied limit (echoed back)

    IssueCountResponse:
      type: object
      required: [total, groups]
      description: |
        Aggregate issue counts. When `group_by` is specified, `groups` maps
        each group key to its count. For `group_by=label`, `sum(groups)` may
        exceed `total` because multi-label issues are counted in each group.
      properties:
        total:
          type: integer
          format: int64
          description: Total number of matching issues
        groups:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Per-group counts (empty object when no group_by specified)

    CommentListResponse:
      type: object
      required: [comments, count]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        count:
          type: integer

    DependencyListResponse:
      type: object
      required: [dependencies]
      properties:
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"

    LabelsListResponse:
      type: object
      required: [labels, count]
      properties:
        labels:
          type: array
          items:
            type: string
        count:
          type: integer

    ReadyListResponse:
      type: object
      required: [issues, count]
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        count:
          type: integer

    BlockedListResponse:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/BlockedIssueEntry"

    BlockedIssueEntry:
      type: object
      required: [issue, blockers]
      properties:
        issue:
          $ref: "#/components/schemas/Issue"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/BlockerDetail"

    BlockerDetail:
      type: object
      required: [id, title, priority, status, dep_type]
      properties:
        id:
          type: string
        title:
          type: string
        priority:
          type: integer
        status:
          type: string
        dep_type:
          type: string
        reason:
          type: string

    MutationsResponse:
      type: object
      required: [events, cursor, has_more]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        cursor:
          type: string
          description: Use as `since` parameter for the next request
        has_more:
          type: boolean

    IntegrityResponse:
      type: object
      required: [workspace, violations, checked_at]
      properties:
        workspace:
          type: string
        violations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrityViolation"
        checked_at:
          type: string
          format: date-time

    IntegrityViolation:
      type: object
      required: [issue_id, field, reference, description]
      properties:
        issue_id:
          type: string
        field:
          type: string
        reference:
          type: string
        description:
          type: string

    HistoryResponse:
      type: object
      required: [history, cursor, has_more, total_events]
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"
        cursor:
          type: string
        has_more:
          type: boolean
        total_events:
          type: integer
          format: int64

    TimelineEntry:
      type: object
      required: [id, timestamp, actor, action, category, summary]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          $ref: "#/components/schemas/Action"
        category:
          type: string
        summary:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"
        metadata:
          type: object
          additionalProperties:
            type: string

    FieldChange:
      type: object
      required: [field]
      properties:
        field:
          type: string
        before:
          type: string
        after:
          type: string

    AtTimestampResponse:
      type: object
      required: [issue, events_applied, last_event_id, last_event_at, deleted]
      properties:
        issue:
          $ref: "#/components/schemas/Issue"
          nullable: true
        events_applied:
          type: integer
        last_event_id:
          type: string
        last_event_at:
          type: string
          format: date-time
        deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true

    ReplayStatusResponse:
      type: object
      required: [progress, done]
      properties:
        progress:
          type: object
          properties:
            events_processed:
              type: integer
              format: int64
            events_failed:
              type: integer
              format: int64
            elapsed_time:
              type: integer
              description: Elapsed time in nanoseconds
            last_event_id:
              type: string
            batch_number:
              type: integer
        done:
          type: boolean
        result:
          type: object
          nullable: true
          properties:
            events_processed:
              type: integer
              format: int64
            events_failed:
              type: integer
              format: int64
            duration:
              type: integer
              description: Duration in nanoseconds
            last_event_id:
              type: string
        error:
          type: string

    VerifyResult:
      type: object
      required: [consistent, events_checked, issues_checked, duration]
      properties:
        consistent:
          type: boolean
        events_checked:
          type: integer
          format: int64
        issues_checked:
          type: integer
        discrepancies:
          type: array
          items:
            $ref: "#/components/schemas/Discrepancy"
        duration:
          type: integer
          description: Duration in nanoseconds

    Discrepancy:
      type: object
      required: [issue_id, field, expected, actual]
      properties:
        issue_id:
          type: string
        field:
          type: string
        expected:
          type: string
        actual:
          type: string

    CreateAPIKeyRequest:
      type: object
      required: [actor_id]
      properties:
        actor_id:
          type: string
          description: Unique identifier for the actor this key authenticates as
          maxLength: 128
        display_name:
          type: string
          description: Human-readable name for the actor
          maxLength: 256
        ttl_seconds:
          type: integer
          description: Time-to-live in seconds. 0 means permanent. Minimum 60, maximum 31536000 (365 days).
          default: 0
        workspace:
          type: string
          description: Optional. Grant the new actor a workspace-scoped ACL role atomically with the key (set together with `role`). Co-expires with the key's TTL.
        role:
          type: string
          enum: [admin, maintainer, developer, viewer]
          description: Optional. ACL role to grant in `workspace` for least-privilege provisioning. Both `workspace` and `role` must be set together, or neither.

    CreateAPIKeyResponse:
      type: object
      required: [key, actor_id, display_name, expires_at]
      properties:
        key:
          type: string
          description: The full API key (only returned on creation)
        actor_id:
          type: string
        display_name:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiration timestamp, null if permanent
        workspace:
          type: string
          description: Workspace the actor was granted a scoped role in, if provisioning was requested.
        role:
          type: string
          description: ACL role granted in `workspace`, if provisioning was requested.

    APIKeyInfo:
      type: object
      required: [key_prefix, actor_id, display_name, ttl_seconds]
      properties:
        key_prefix:
          type: string
          description: Masked key prefix for identification (e.g., "fldb_abc1...")
        actor_id:
          type: string
        display_name:
          type: string
        ttl_seconds:
          type: integer
          description: Remaining TTL in seconds. -1 means the key never expires (permanent).
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Estimated expiration timestamp, null if permanent

    ListAPIKeysResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKeyInfo"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # --- Agent platform driver schemas ---

    StringMap:
      type: object
      additionalProperties:
        type: string

    DriverOwnerType:
      type: string
      enum: [user, team, lead_agent, system]

    DriverStatus:
      type: string
      enum: [draft, active, disabled, archived]

    DriverVersionValidationStatus:
      type: string
      enum: [pending, passed, failed]

    TriggerBindingConcurrencyPolicy:
      type: string
      enum: [allow, forbid, replace, queue, one_active_per_epic]

    TriggerDeliveryStatus:
      type: string
      enum: [accepted, rejected, duplicate, queued, dispatched, failed, replayed]

    ActionLedgerStatus:
      type: string
      enum: [pending, applied, failed, skipped]

    ActionLedgerType:
      type: string
      enum: [close_task, comment, create_pr, merge_pr, start_task_run, update_status]

    DriverRunStatus:
      type: string
      enum: [queued, running, suspended_awaiting_event, completed, failed, needs_review, cancelled]

    DriverStepStatus:
      type: string
      enum: [queued, running, waiting, completed, failed, skipped]

    TaskRunStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]

    TaskRunEventType:
      type: string
      enum: [task_run_queued, task_run_claimed, task_run_requeued, task_run_completed, task_run_failed, task_run_cancelled]

    OutboxKind:
      type: string
      enum: [lead_assignment, lead_task_message]

    OutboxStatus:
      type: string
      enum: [pending, delivered, unsupported, failed]

    Driver:
      type: object
      required: [workspace_key, driver_id, name, owner_type, status, created_at, updated_at]
      properties:
        workspace_key: { type: string }
        driver_id: { type: string }
        name: { type: string }
        owner_type:
          $ref: "#/components/schemas/DriverOwnerType"
        owner_ref: { type: string }
        description: { type: string }
        active_version_id: { type: string }
        status:
          $ref: "#/components/schemas/DriverStatus"
        trust_level:
          $ref: "#/components/schemas/DriverTrustLevel"
        metadata:
          $ref: "#/components/schemas/StringMap"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DriverTrustLevel:
      type: string
      description: >-
        Sandbox placement policy input (step 9): only trusted drivers may run
        workflow runtimes in a host process; untrusted drivers require an
        isolating sandbox launcher. Missing/unknown values read as untrusted.
      enum: [trusted, untrusted]

    CreateDriverRequest:
      type: object
      required: [driver_id, name]
      properties:
        driver_id: { type: string }
        name: { type: string }
        owner_type:
          $ref: "#/components/schemas/DriverOwnerType"
        owner_ref: { type: string }
        description: { type: string }
        active_version_id: { type: string }
        status:
          $ref: "#/components/schemas/DriverStatus"
        trust_level:
          $ref: "#/components/schemas/DriverTrustLevel"
        metadata:
          $ref: "#/components/schemas/StringMap"

    UpdateDriverRequest:
      type: object
      properties:
        name: { type: string }
        owner_type:
          $ref: "#/components/schemas/DriverOwnerType"
        owner_ref: { type: string }
        description: { type: string }
        active_version_id: { type: string }
        status:
          $ref: "#/components/schemas/DriverStatus"
        trust_level:
          $ref: "#/components/schemas/DriverTrustLevel"
        metadata:
          $ref: "#/components/schemas/StringMap"

    ListDriversResponse:
      type: object
      required: [drivers, count]
      properties:
        drivers:
          type: array
          items:
            $ref: "#/components/schemas/Driver"
        count:
          type: integer

    DriverVersion:
      type: object
      required: [workspace_key, version_id, driver_id, version, source_digest, bundle_digest, validation_status, created_at]
      properties:
        workspace_key: { type: string }
        version_id: { type: string }
        driver_id: { type: string }
        version: { type: integer, minimum: 1 }
        source_ref: { type: string }
        source_digest: { type: string }
        bundle_ref: { type: string }
        bundle_digest: { type: string }
        runtime: { type: string }
        manifest:
          $ref: "#/components/schemas/StringMap"
        build_diagnostics: { type: string }
        validation_status:
          $ref: "#/components/schemas/DriverVersionValidationStatus"
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    CreateDriverVersionRequest:
      type: object
      required: [version_id, version, source_digest, bundle_digest]
      properties:
        version_id: { type: string }
        version: { type: integer, minimum: 1 }
        source_ref: { type: string }
        source_digest: { type: string }
        bundle_ref: { type: string }
        bundle_digest: { type: string }
        runtime: { type: string }
        manifest:
          $ref: "#/components/schemas/StringMap"
        build_diagnostics: { type: string }
        validation_status:
          $ref: "#/components/schemas/DriverVersionValidationStatus"
        created_by: { type: string }

    ListDriverVersionsResponse:
      type: object
      required: [driver_versions, count]
      properties:
        driver_versions:
          type: array
          items:
            $ref: "#/components/schemas/DriverVersion"
        count:
          type: integer

    WorkerProfile:
      type: object
      required: [workspace_key, profile_id, name, role, enabled, created_at, updated_at]
      properties:
        workspace_key: { type: string }
        profile_id: { type: string }
        name: { type: string }
        role: { type: string }
        backend: { type: string }
        runtime_policy:
          $ref: "#/components/schemas/StringMap"
        repos:
          type: array
          items: { type: string }
        max_priority:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
        max_parallel:
          type: integer
          minimum: 0
        clear_max_priority:
          type: boolean
          description: Clear max_priority when true. Cannot be combined with max_priority.
        parent_epic: { type: string }
        labels:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        metadata:
          $ref: "#/components/schemas/StringMap"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateWorkerProfileRequest:
      type: object
      required: [profile_id, role]
      properties:
        profile_id: { type: string }
        name: { type: string }
        role: { type: string }
        backend: { type: string }
        runtime_policy:
          $ref: "#/components/schemas/StringMap"
        repos:
          type: array
          items: { type: string }
        max_priority:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
        max_parallel:
          type: integer
          minimum: 0
        clear_max_priority:
          type: boolean
          description: Clear max_priority when true. Cannot be combined with max_priority.
        parent_epic: { type: string }
        labels:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        metadata:
          $ref: "#/components/schemas/StringMap"

    UpdateWorkerProfileRequest:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        backend: { type: string }
        runtime_policy:
          $ref: "#/components/schemas/StringMap"
        repos:
          type: array
          items: { type: string }
        max_priority:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
        max_parallel:
          type: integer
          minimum: 0
        parent_epic: { type: string }
        labels:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        metadata:
          $ref: "#/components/schemas/StringMap"

    ListWorkerProfilesResponse:
      type: object
      required: [worker_profiles, count]
      properties:
        worker_profiles:
          type: array
          items:
            $ref: "#/components/schemas/WorkerProfile"
        count:
          type: integer

    AgentServiceKind:
      type: string
      enum:
        - lead
        - support
        - triage
        - on_call
        - scheduled
        - maintenance
        - orchestrator
        - always_on
        - cron
        - event
        - campaign_orchestrator

    AgentServiceDesiredState:
      type: string
      enum: [running, stopped, paused]

    AgentService:
      type: object
      oneOf:
