          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Connector Grants]
      summary: List active connector grants
      description: Revoked grants are filtered out; they never authorize egress.
      operationId: listConnectorGrants
      parameters:
        - name: binding_id
          in: query
          schema: { type: string }
        - name: connector_id
          in: query
