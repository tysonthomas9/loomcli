      summary: Activate an approved driver version
      operationId: activateDriverVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverVersionLifecycleRequest"
      responses:
        "200":
          description: Version activated or prior committed result replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverVersionLifecycleResponse"
        "400": { $ref: "#/components/responses/WorkflowCatalogLifecycleBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WorkflowCatalogLifecycleForbidden" }
        "404": { $ref: "#/components/responses/WorkflowCatalogLifecycleNotFound" }
        "409": { $ref: "#/components/responses/WorkflowCatalogLifecycleConflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422": { $ref: "#/components/responses/WorkflowCatalogLifecyclePreconditionFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/{workspace}/driver-versions:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Drivers]
      summary: List driver versions
      operationId: listDriverVersions
      parameters:
        - name: driver_id
          in: query
          schema: { type: string }
        - name: validation_status
          in: query
          schema:
            $ref: "#/components/schemas/DriverVersionValidationStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Driver version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDriverVersionsResponse"

  /api/v1/{workspace}/driver-versions/{version_id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/DriverVersionID"
    get:
      tags: [Drivers]
      summary: Get a driver version
      operationId: getDriverVersion
      responses:
        "200":
          description: Driver version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/{workspace}/worker-profiles:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Worker Profiles]
      summary: Create a worker profile
      operationId: createWorkerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerProfileRequest"
      responses:
        "201":
          description: Worker profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Worker Profiles]
      summary: List worker profiles
      operationId: listWorkerProfiles
      parameters:
        - name: role
          in: query
          schema: { type: string }
        - name: backend
          in: query
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean }
