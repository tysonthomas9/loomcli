    DriverRunReviewWorkItemHandoffRequest:
      type: object
      additionalProperties: false
      required: [command_id, node_id, lease_id, fencing_token, claim_action_id, task_run_id, target_status, handed_off_at]
      allOf:
        - if:
            properties:
              target_status: { const: review }
          then:
            required: [priority, comment_body]
          else:
            not:
              anyOf:
                - required: [priority]
                - required: [labels]
                - required: [comment_body]
      properties:
        command_id: { type: string, maxLength: 128 }
        node_id: { type: string }
        lease_id: { type: string }
        fencing_token: { type: integer, format: int64, minimum: 1 }
        claim_action_id:
          type: string
          description: Exact immutable claim ActionLedger ID retained by the completed review TaskRun.
        task_run_id: { type: string }
        target_status:
          type: string
          enum: [open, review, closed]
        reason:
          type: string
          description: Close reason when target_status is closed.
        priority:
          type: integer
          minimum: 0
          maximum: 4
          description: Required only when target_status is review.
        labels:
          type: array
          maxItems: 8
          description: >-
            Optional additive labels for a review handoff. FleetDB trims and
            stable-deduplicates entries. Normalized labels are non-empty,
            control-free, contain no comma or semicolon, and are at most 64
            UTF-8 bytes. Rejected for open and closed handoffs.
          items:
            type: string
            minLength: 1
            maxLength: 64
        comment_body:
          type: string
          minLength: 1
          maxLength: 10000
          description: >-
            Required only when target_status is review. Persisted as one
            server-authored immutable comment tied to this handoff command.
        handed_off_at: { type: string, format: date-time }

