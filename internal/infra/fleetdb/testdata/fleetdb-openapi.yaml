    AgentSessionStatus:
      type: string
      enum: [queued, leased, starting, running, idle, yielded, completed, failed, cancelled, expired]

    AgentSessionKind:
      type: string
      enum: [task, orchestration, terminal, maintenance, ad_hoc]

    AgentSessionMetadata:
      type: object
      description: |
        Extensible session metadata. Conventional keys are:
        - `harness`: free-form harness identifier such as `codex`,
          `claude-code`, or `pi`; new harnesses require no FleetDB change.
        - `external_session_id`: the harness provider's session identifier.
        - `label`: a short human-readable title for the run.
        - `transcript_ref`: transcript location, preferably an
          `artifact://{artifact_id}` reference. Raw transcript content does not
          belong in metadata.
      properties:
        harness:
          type: string
          example: codex
        external_session_id:
          type: string
        label:
          type: string
        transcript_ref:
          type: string
          example: artifact://transcript-session-123
      additionalProperties:
        type: string

    AgentSession:
      type: object
      required: [workspace_key, session_id, agent_id, kind, status, created_at, updated_at]
      properties:
        workspace_key:      { type: string }
        session_id:         { type: string }
        agent_id:           { type: string }
        node_id:            { type: string }
        kind:
          $ref: "#/components/schemas/AgentSessionKind"
        task_id:            { type: string }
        terminal_id:        { type: string }
        parent_session_id:  { type: string }
        status:
          $ref: "#/components/schemas/AgentSessionStatus"
        phase:              { type: string }
        attempt:
          type: integer
          minimum: 0
        started_at:         { type: string, format: date-time }
        last_heartbeat:     { type: string, format: date-time }
        finished_at:
          type: string
          format: date-time
          nullable: true
        summary:            { type: string }
        error_class:        { type: string }
        exit_code:
          type: integer
          nullable: true
        metadata:
          $ref: "#/components/schemas/AgentSessionMetadata"
        created_at:         { type: string, format: date-time }
        updated_at:         { type: string, format: date-time }

