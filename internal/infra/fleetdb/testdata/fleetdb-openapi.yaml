  /api/v1/{workspace}/driver-runs:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Driver Runs]
      summary: Create a driver run
      description: >-
        Authenticated operator submission. The idempotency_key is the durable
        request identity: exact replay returns the original committed DriverRun
        snapshot even after its lifecycle advances, while reuse for divergent
        run intent returns 409. Creation and its lifecycle event commit
        atomically. This endpoint creates root runs only; composed children must
        use the owner-fenced /driver-runs/{run_id}/children/start command.
      operationId: createDriverRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDriverRunRequest"
      responses:
        "201":
          description: Driver run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Driver Runs]
      summary: List driver runs
      description: |
        Runs are ordered newest-first by started_at (not-yet-started runs sort
        last), with created_at as the deterministic tiebreak. The order is
        applied before any limit, so limit returns the newest-by-started_at
        window rather than an arbitrary subset.
      operationId: listDriverRuns
      parameters:
        - name: driver_id
          in: query
          schema: { type: string }
        - name: driver_version_id
          in: query
          schema: { type: string }
        - name: epic_id
          in: query
          schema: { type: string }
        - name: node_id
          in: query
          schema: { type: string }
        - name: trigger_binding_id
          in: query
          description: >-
            Filter to runs a trigger-dispatch leg stamped with this binding id.
          schema: { type: string }
        - name: agent_service_id
          in: query
          description: Filter to runs stamped with this agent service at dispatch.
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DriverRunStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Driver run list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDriverRunsResponse"

