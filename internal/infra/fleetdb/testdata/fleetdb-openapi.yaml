        error:               { type: string }

    ListAgentInboxMessagesResponse:
      type: object
      required: [agent_inbox_messages, count]
      properties:
        agent_inbox_messages:
          type: array
          items: { $ref: "#/components/schemas/AgentInboxMessage" }
