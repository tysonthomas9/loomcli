  /api/v1/{workspace}/artifacts/{artifact_id}/content:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/ArtifactID"
    get:
      tags: [ControlPlane]
      summary: Download artifact bytes
      description: |
        Streams FleetDB-managed artifact content as an inert binary attachment.
        External or otherwise unmanaged artifact URIs are not fetched and return
        `404`, allowing clients to fall back to the URI stored in artifact metadata.
      operationId: getArtifactContent
      responses:
        "200":
          description: Raw artifact content
