      required: [workspace_key, command_id, cursor, type, status, created_at, updated_at]
      properties:
        workspace_key:    { type: string }
        command_id:       { type: string }
        cursor:
          type: integer
          format: int64
        target_agent_id:  { type: string }
        target_node_id:   { type: string }
        session_id:       { type: string }
        type:             { type: string }
        payload:
          type: object
          additionalProperties: { type: string }
        status:
          type: string
          enum: [queued, acked, running, succeeded, failed, cancelled]
        acked_by:
          type: string
          description: |
            Stable claimant supervisor owner identity used for daemon-restart
            recovery; not the authenticated request actor. During a deprecated
            Fleet-first rolling upgrade, a proofless legacy Ack briefly stores
            a server-reserved marker here until the first real Acquire
            atomically replaces it with the stable owner.
        acked_at:
          type: string
          format: date-time
          nullable: true
        ownership_lease_id:
          type: string
          description: Non-secret ownership generation identifier that authorized the command.
        ownership_fencing_token:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic non-secret ownership generation fence. The raw ownership token is never persisted on a command.
        result:           { type: string }
        error_class:      { type: string }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }

