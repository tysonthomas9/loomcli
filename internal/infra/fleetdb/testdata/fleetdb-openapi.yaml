          description: "The task-run-work-item-design-update: prefix is reserved for the atomic TaskRun Work Item design command."
        action_type:
          $ref: "#/components/schemas/GenericActionLedgerCreateType"
        target_ref: { type: string }
        requested_by: { type: string }
        status:
          $ref: "#/components/schemas/ActionLedgerStatus"
