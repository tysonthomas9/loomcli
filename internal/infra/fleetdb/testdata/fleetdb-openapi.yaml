  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------
  responses:
    WorkflowCatalogLifecycleBadRequest:
      description: Invalid request or driver/version ownership mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowCatalogLifecycleErrorResponse"

    WorkflowCatalogLifecycleForbidden:
      description: Authenticated actor does not have the lifecycle permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowCatalogLifecycleErrorResponse"

    WorkflowCatalogLifecycleNotFound:
      description: Driver or driver version was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowCatalogLifecycleErrorResponse"

    WorkflowCatalogLifecycleConflict:
      description: Driver revision does not match expected_revision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowCatalogLifecycleErrorResponse"

    WorkflowCatalogLifecyclePreconditionFailed:
      description: Version validation or approval precondition failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowCatalogLifecycleErrorResponse"

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication is required or the supplied credentials are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Caller is not allowed to mutate this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Gone:
      description: Lease exists but is no longer live (expired or released)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Resource conflict (already exists, already claimed)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BodyTooLarge:
      description: Request body exceeds size limit (1 MB for standard endpoints, 10 MB for batch endpoints)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
