    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AgentCommandID"
    get:
      tags: [ControlPlane]
      summary: Get an agent command
      operationId: getAgentCommand
      responses:
        "200":
          description: Agent command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCommand"

  /api/v1/{workspace}/agent-commands/{command_id}/ack:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AgentCommandID"
    post:
      tags: [ControlPlane]
      summary: Atomically claim and acknowledge an agent command
      operationId: ackAgentCommand
      requestBody:
        required: false
        description: |
          Modern clients must send node_id and the durable owner_id.
          Known lifecycle commands start/stop/restart/yield may omit ownership
          proof only when no live ownership lease exists; unknown targeted
          command types always require proof. When a live lease exists, clients
          must send its exact lease ID, request-only token, and fencing token.
          During the Fleet-first rolling upgrade only, an omitted body is
          accepted as a deprecated authenticated legacy request. FleetDB
          infers and atomically revalidates an exact live lease generation. If
          no lease is live, FleetDB persists an unmintable temporary claimant
          marker that the first real ownership Acquire atomically upgrades to
          its stable owner, node, lease ID, and fence.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AckAgentCommandRequest"
      responses:
        "200":
          description: Command bound to the claimant node and acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCommand"

  /api/v1/{workspace}/agent-commands/{command_id}/complete:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AgentCommandID"
    post:
      tags: [ControlPlane]
      summary: Complete an agent command
      operationId: completeAgentCommand
      requestBody:
        required: true
        description: |
          Modern clients must send the current node_id, durable owner_id, and
          the ownership generation proof persisted by Ack (or a newer current
          same-owner generation). The raw ownership token is request-only.
          A proofless command acknowledged while no lease was live may converge
          to failed or canceled for any known lifecycle type, or to succeeded
          only for Stop; successful Start/Restart/Yield and Running always
          require proof, and unknown targeted types always require proof.
          Legacy requests without claimant fields are deprecated and accepted
          only through the authenticated rolling-upgrade bridge. FleetDB
          infers and atomically revalidates the exact durable ownership
          generation, or requires X-Actor to match its server-reserved
          proofless marker. A legacy Failed/Canceled result may terminally
          converge after that exact generation was released; this exception
          never permits Running or Succeeded Start/Restart/Yield.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CompleteAgentCommandRequest"
                - $ref: "#/components/schemas/LegacyCompleteAgentCommandRequest"
      responses:
        "200":
          description: Command completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCommand"

