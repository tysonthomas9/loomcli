      - $ref: "#/components/parameters/DriverRunID"
    get:
      tags: [Driver Runs]
      summary: List driver run lifecycle events
      description: |
        Returns the driver run's audit events from the workspace event stream,
        filtered to driver_run entries. Paginate with `after` (a stream cursor
        from the previous response) and `limit`.
      operationId: listDriverRunEvents
      parameters:
        - name: after
          in: query
          required: false
          description: 'Stream cursor to resume from: "0" or a stream ID like "1707001234567-0".'
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max events to return (1-1000, default 100).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Driver run events
          content:
            application/json:
              schema:
                type: object
                required: [events, cursor]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  cursor:
                    type: string
                    description: Use as `after` for the next request
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

