          application/json:
            schema:
              $ref: "#/components/schemas/RequeueTaskRunRequest"
      responses:
        "200":
          description: Task run requeued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/{workspace}/task-runs/{task_run_id}/requeue-and-reset-step:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/TaskRunID"
    post:
      tags: [Task Runs]
      summary: Atomically requeue a task run and reset its linked driver step
      description: >-
        Service-actor-only owner-fenced retry command that commits the queued
        TaskRun projection, linked queued DriverStep, queued event, action, and
        immutable retry receipt together. X-Lease-Token is mandatory, hashed
        at the API boundary, and never returned.
      operationId: requeueTaskRunAndResetStep
      parameters:
        - name: X-Lease-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRunRequeueAtomicRequest" }
      responses:
        "200":
          description: Retry projection committed or replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRunRequeueAtomicResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/{workspace}/task-runs/{task_run_id}/exhaust-retries:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/TaskRunID"
    post:
      tags: [Task Runs]
      summary: Atomically exhaust task-run retries and conditionally block its linked task
      description: |
        Service-actor-only owner-fenced terminal command. FleetDB atomically
        commits the failed TaskRun, TaskRun lease release, completion receipt,
        terminal event, and applied action. If the TaskRun's exact durable Work
        Item generation is still current, the same transaction also blocks and
        unassigns that Issue. If a successor generation won, the stale TaskRun
        still terminalizes its own Execution records but cannot rewrite the
        successor Issue. A defensively deleted Issue is returned as `null`.

        The action response reference is the canonical immutable applied
        outcome; `committed.issue_blocked` is derived from it on replay.
        `issue` is the current Issue projection and may legitimately have
        advanced. `finished_at` is the
        execution occurrence time, while mutable projection, action, and
        receipt timestamps use FleetDB's non-regressing server commit time.
        X-Lease-Token is mandatory, hashed at the API boundary, and never
        returned.
      operationId: exhaustTaskRunRetriesAtomic
      parameters:
        - name: X-Lease-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRunRetryExhaustionRequest" }
      responses:
        "200":
          description: Retry exhaustion committed or replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRunRetryExhaustionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/{workspace}/task-runs/{task_run_id}/work-item/design:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/TaskRunID"
    post:
      tags: [Task Runs]
      summary: Atomically update the exact TaskRun Work Item design
      description: |
        Strict service-actor-only, design-only owner command. FleetDB derives
        the Issue identity from the running TaskRun; callers cannot supply an
        Issue or task ID. The same transaction validates the live TaskRun lease
        and exact typed Work Item generation, creates or reuses finalized
        Issue-owned design artifact metadata when managed design storage is
        enabled, updates only the Issue design representation, appends the
        audit event, and writes the immutable applied ActionLedger receipt.

        `command_id` is the explicit idempotency key. An exact lost-response
        retry checks the committed receipt before consulting current lease
        liveness or writing immutable content. Reusing it with a different
        owner tuple, body, or format returns 409. In managed artifact mode the
        response hydrates the current Issue projection from the current artifact pointer.
        A replay therefore cannot replace a newer design in the response with
        the older request body. Omitted or empty
        `design_format` defaults to `markdown`. Empty design bodies are
        rejected; clearing a design is outside this planner-save command.
        X-Lease-Token is mandatory, hashed at the API boundary, and never
        returned.
      operationId: updateTaskRunWorkItemDesign
      parameters:
        - $ref: "#/components/parameters/XLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRunWorkItemDesignUpdateRequest" }
      responses:
        "200":
          description: Work Item design committed or replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRunWorkItemDesignUpdateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/InternalError" }

  /api/v1/{workspace}/task-runs/{task_run_id}/complete:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/TaskRunID"
    post:
      tags: [Task Runs]
      summary: Complete a task run through the v2 acceptance contract
      description: |
        Service-actor-only owner command. The raw lease token is required,
        hashed at the API boundary, and never returned. FleetDB atomically
        commits TaskRun terminal state, TaskRun lease release, Work Item and
        audit mutations, artifact acceptance validation, and the immutable
        completion receipt. DriverStep terminal repair and TaskRun terminal
        event and notification convergence are separate durable legs.

        The first accepted request binds `completion_id` to the normalized
        request path, owner tuple, and payload. An exact retry returns the
        original immutable completion result before consulting current run or
        lease state. Reusing that ID with a different normalized request
        returns 409 conflict.

        Receipts written before request fingerprints were introduced retain
        their legacy same-TaskRun replay rule: the same workspace,
        `completion_id`, and `task_run_id` return the stored result, while
        cross-TaskRun reuse returns 409. FleetDB does not synthesize a v1
        fingerprint because old receipts did not persist every v1 intent field.
      operationId: completeTaskRun
      parameters:
        - $ref: "#/components/parameters/XLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRunRequest"
      responses:
        "200":
          description: Task run completion accepted or exactly replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteTaskRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ---------------------------------------------------------------------------
  # Task Run Events (append-only journal) & Outbox (notification queue)
