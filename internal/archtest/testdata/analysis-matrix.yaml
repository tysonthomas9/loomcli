    acceptance_criteria: Load the tagged package graph and report the exact profile for each violation.
  - name: testbackend
    goos: linux
    goarch: amd64
    tags: [testbackend]
    required_files: [internal/cli/backend_echo_testbackend.go]
    enforced: true
    owner: modular-monolith
