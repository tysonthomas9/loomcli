    required_files: [internal/cli/automode/race_enabled.go]
    enforced: true
    owner: modular-monolith
    acceptance_criteria: Load packages with the race detector source selection and report profile-specific violations.
ast_all_files:
  include_tests: true
  exclude_generated: true
  ignore:
    - path: internal/webui/app/sse_push_test.go
      reason: Historical SSE mutation tests require server-side RPC packages that are not present in this module.
      owner: web-runtime-lane
      expiry: "2026-12-31"
