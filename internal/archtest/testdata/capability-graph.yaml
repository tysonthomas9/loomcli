schema_version: 1
status: approved
completed_phase: 4
decision_dependencies:
  - MM-1
  - MM-2
  - MM-3
  - MM-4
  - MM-5
  - MM-6
  - MM-7
module_root: internal/modules
app_root: internal/app
platform_root: internal/platform
restrictions:
  platform_imports_capabilities: false
  serve_composition_only: true
  named_apps_public_roots_only: true
  named_apps_own_ports_only: true
  modules_reject_legacy_types: true
external_import_policy:
  core_allowed_prefixes:
    - github.com/robfig/cron/v3
  adapter_allowed_prefixes: []
  platform_allowed_prefixes: []
  core_denied_standard_prefixes:
    - database/sql
    - net/http
    - net/rpc
    - os
    - plugin
    - syscall
capabilities:
  - name: workspace
    root: workspace
    status: planned
  - name: workitems
    root: workitems
    status: planned
  - name: agents
    root: agents
    status: planned
  - name: workflowcatalog
    root: workflowcatalog
    status: active
  - name: automation
    root: automation
    status: active
  - name: execution
    root: execution
    status: active
  - name: interaction
    root: interaction
    status: planned
  - name: sourcecontrol
    root: sourcecontrol
    status: planned
  - name: connectors
    root: connectors
    status: planned
  - name: artifacts
    root: artifacts
    status: active
aggregate_ownership:
  - record: ActionLedger
    owner: execution
    cross_capability_rule: Records run-side-effect intent and outcomes; product mutations still go through the owning capability.
  - record: Activity, history, usage
    owner: read_projection
    cross_capability_rule: Combines immutable DTOs and never owns or mutates a product aggregate.
  - record: Agent, Role, desired state, AgentOwnershipLease
    owner: agents
    cross_capability_rule: Other capabilities retain IDs or immutable projections only.
  - record: AgentCommand
    owner: interaction
    cross_capability_rule: Transitional only and removed after lead and session daemon dependencies retire.
  - record: AgentSession, TerminalSession, AgentLease, inbox, lead-delivery Outbox
    owner: interaction
    cross_capability_rule: Session records remain distinct from batch execution; NodeID is an opaque reference.
  - record: Artifact
    owner: artifacts
    cross_capability_rule: Producers request create and finalize and retain durable references.
  - record: Connector, Grant, secret and audit state
    owner: connectors
    cross_capability_rule: Callers request granted actions and never receive plaintext credentials.
  - record: DaemonProfile
    owner: legacy_tombstone
    cross_capability_rule: No target module; delete with the daemon after parity proof.
  - record: Driver, DriverVersion, trust state
    owner: workflowcatalog
    cross_capability_rule: Automation resolves only activated versions through the catalog API.
  - record: DriverRun, DriverStep, TaskRun, TaskRunEvent, Node, Worker, WorkerProfile, Await
    owner: execution
    cross_capability_rule: Automation requests execution and consumes durable outcomes; Execution never imports Automation.
  - record: Generic fleet-db Lease
    owner: fleet-db
    mechanism: true
    discriminator: agent_service=agents;driver_run|task_run=execution;terminal=interaction;artifact_upload=artifacts
    cross_capability_rule: Loom exposes owner-scoped ports and fleet-db validates workspace, discriminator, resource, holder, token, and fence.
  - record: Issue, dependency, status, comment
    owner: workitems
    cross_capability_rule: Execution requests claim and finish through explicit atomic commands.
  - record: PlatformEvent and general mutation journal
    owner: fleet-db
    mechanism: true
    discriminator: mechanism_and_read_projection_only
    cross_capability_rule: Loom consumes the projection and no Loom capability writes it as a product aggregate.
  - record: TriggerBinding, Event, Delivery
    owner: automation
    cross_capability_rule: Webhooks enter only through Automation ingestion.
  - record: WorkflowProcessState
    owner: named_application_workflow
    mechanism: true
    discriminator: app_workflow_name
    cross_capability_rule: Owns coordination progress only and never mirrors participating aggregates.
  - record: Workspace, Repository
    owner: workspace
    cross_capability_rule: Source Control receives references and never rewrites catalog records.
  - record: Worktree, stack lineage, publication state
    owner: sourcecontrol
    cross_capability_rule: Workspace owns catalog configuration while Source Control owns materialization.
legacy_paths:
  - path: internal/domain
    owner: architecture-guardrail-lane
    removal_issue: MM-LEGACY-DOMAIN
    expires_after_phase: 7
  - path: internal/driver
    owner: execution-reliability-lane
    removal_issue: MM-LEGACY-DRIVER
    expires_after_phase: 6
  - path: internal/store
    owner: architecture-guardrail-lane
    removal_issue: MM-LEGACY-STORE
    expires_after_phase: 7
  - path: internal/webui/handlers
    owner: frontend-and-http-lane
    removal_issue: MM-LEGACY-HANDLERS
    expires_after_phase: 7
  - path: internal/webui/service
    owner: frontend-and-http-lane
    removal_issue: MM-LEGACY-SERVICE
    expires_after_phase: 7
  - path: internal/webui/svcimpl
    owner: frontend-and-http-lane
    removal_issue: MM-LEGACY-SVCIMPL
    expires_after_phase: 7
  - path: internal/workflows
    owner: workflow-distribution-lane
    removal_issue: MM-LEGACY-WORKFLOWS
    expires_after_phase: 5
    extension:
      reviewed_by: phase-3-architecture-review
      reviewed_at: 2026-07-16
      rationale: Phase 3 moved Automation callers through its module API without rewriting the mixed builtin-source, authoring, registration, and trusted runner-resolution package. Removing this path now would conflate the behavior-preserving Automation slice with Workflow Catalog authoring and Phase 4 Execution ownership work.
      replacement_apis:
        - internal/modules/execution
        - internal/modules/workflowcatalog
      remaining_call_sites:
        - internal/cli/agent/tsruntime/tsruntime.go
        - internal/cli/epic/run.go
        - internal/cli/serve/serveadapter/workflow_catalog.go
        - internal/cli/serve/workspacemgr/agent_identity_migration.go
        - internal/cli/serve/workspacemgr/agent_identity_migration_test.go
        - internal/cli/workflow/management_client_test.go
        - internal/cli/workflow/workflow_cmd.go
        - internal/cli/workflow/workflow_cmd_test.go
        - internal/cli/workflow/workflow_digest_test.go
        - internal/webui/handlers/agents/record_handlers.go
        - internal/webui/handlers/agents/record_handlers_driver_test.go
        - internal/webui/handlers/agents/record_handlers_test.go
        - internal/webui/handlers/workflows/builtins.go
        - internal/webui/handlers/workflows/module.go
        - internal/webui/handlers/workflows/module_test.go
        - internal/webui/handlers/workflows/preflight.go
