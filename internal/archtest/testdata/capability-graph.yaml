  - from: execution
    to: agents
    kinds: [import, query]
  - from: execution
    to: workitems
    kinds: [command, import, query]
  - from: execution
    to: workflowcatalog
    kinds: [import, query]
  - from: execution
    to: sourcecontrol
    kinds: [command, import]
  - from: execution
    to: connectors
    kinds: [command, import]
  - from: execution
    to: artifacts
    kinds: [command, import]
  - from: automation
