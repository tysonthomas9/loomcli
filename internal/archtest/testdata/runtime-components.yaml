  - {file: "internal/platform/runtime/host.go", function: "Host.Start", site: "go#1", callee: "host.runComponent", disposition: component, component_ids: [execution-await-timeout-recovery, execution-driver-run, execution-task-run-convergence, execution-task-run-workers, serve-agent-provisioning-recovery, serve-agents-desired-state-reconciliation, serve-await-event-notifications, serve-driver-run-outcomes, serve-interaction-session-recovery, serve-trigger-cron-scheduler, serve-trigger-delivery-sweeper, workspace-repository-admission-lease-renewal, workspace-repository-admission-recovery]}
