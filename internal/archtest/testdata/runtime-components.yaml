schema_version: 2
production_roots:
  - cmd
  - internal
  - sdk
exclusions:
  test_files: true
  generated_files: true
  directories:
    - .git
    - node_modules
    - third_party
    - vendor
    - worktrees
goroutine_disposition_policy: default-deny
goroutine_launches:
  - {file: "internal/archtest/agents_ownership.go", function: "snapshotPhase5AgentsMutations", site: "go#1", callee: "<anonymous>", disposition: bounded, reason: "profile workers are concurrency-limited and WaitGroup-joined before return"}
  - {file: "internal/archtest/direct_writes.go", function: "snapshotDirectWriteProfiles", site: "go#1", callee: "<anonymous>", disposition: bounded, reason: "profile workers are concurrency-limited and WaitGroup-joined before return"}
