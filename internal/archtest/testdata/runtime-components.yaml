  - {file: "internal/webui/filecoord/git_status.go", function: "fileServiceImpl.inspectWorkspaceCheckouts", site: "go#1", callee: "<anonymous>", disposition: bounded, reason: "checkout inspection uses a ten-second context and joins its fan-out before return"}
  - {file: "internal/webui/filecoord/history.go", function: "fileServiceImpl.startLegacyHistoryCleanup", site: "go#1", callee: "<anonymous>", disposition: component, component_ids: [legacy-file-history-boot-cleanup]}
  - {file: "internal/webui/fleet/timeout.go", function: "TimeoutEnforcer.Start", site: "go#1", callee: "t.run", disposition: component, component_ids: [fleet-task-timeout-enforcer]}
  - {file: "internal/webui/handlers/misc/auth_config.go", function: "NewAuthConfigLimiter", site: "go#1", callee: "l.CleanupLoop", disposition: component, component_ids: [auth-config-rate-limit-cleanup]}
  - {file: "internal/webui/handlers/misc/client_errors.go", function: "NewClientErrorLimiter", site: "go#1", callee: "l.CleanupLoop", disposition: component, component_ids: [client-error-rate-limit-cleanup]}
  - {file: "internal/webui/handlers/terminal/agent.go", function: "runAgentTerminalRelay", site: "go#1", callee: "<anonymous>", disposition: request, reason: "terminal kill watcher is canceled with the owning request context"}
