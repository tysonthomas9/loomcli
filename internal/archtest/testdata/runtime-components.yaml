  - {file: "internal/cli/monitor/monitor_collect.go", function: "runParallelTaskQueries", site: "go#4", callee: "<anonymous>", disposition: bounded, reason: "task-query fan-out is channel-joined before monitor collection returns"}
  - {file: "internal/cli/monitor/monitor_collect.go", function: "runParallelTaskQueries", site: "go#5", callee: "<anonymous>", disposition: bounded, reason: "task-query fan-out is channel-joined before monitor collection returns"}
