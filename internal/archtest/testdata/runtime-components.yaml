components:
  # Bounded command and startup polling.
  - id: fleet-dependency-state-wait
    kind: ticker
    file: internal/backend/fleet/fleet_dependencies.go
    function: FleetBackend.waitForDependencyState
    site: "time.NewTicker#1"
    capability: work-items
    owner: fleet backend compatibility
    cadence: "25ms, bounded by a 2s timer"
    cancellation: "caller context or the 2s operation timer"
    readiness_health: "success requires the requested dependency state to become observable"
    retry_backoff: "fixed 25ms read retry; the last backend error is returned at timeout"
    classification: command-poll

  - id: fleet-label-state-wait
    kind: ticker
    file: internal/backend/fleet/fleet_labels.go
    function: FleetBackend.waitForLabelState
    site: "time.NewTicker#1"
    capability: work-items
    owner: fleet backend compatibility
    cadence: "25ms, bounded by a 2s timer"
    cancellation: "caller context or the 2s operation timer"
    readiness_health: "success requires the requested label state to become observable"
    retry_backoff: "fixed 25ms read retry; the last backend error is returned at timeout"
    classification: command-poll

  - id: embedded-fleetdb-startup-wait
    kind: ticker
    file: internal/bootstrap/embedded.go
    function: waitForEmbeddedRuntime
    site: "time.NewTicker#1"
    capability: platform
    owner: embedded fleet-db bootstrap
    cadence: "100ms until the configured startup timeout"
    cancellation: "derived timeout context or caller cancellation"
    readiness_health: "gates startup on reusable runtime metadata and a successful healthz probe"
    retry_backoff: "fixed 100ms probe; returns the last runtime error on timeout"
    classification: startup-wait

  - id: embedded-fleetdb-recovery-wait
    kind: ticker
    file: internal/bootstrap/openstore.go
    function: recoverLocalStore
    site: "time.NewTicker#1"
    capability: platform
    owner: embedded fleet-db bootstrap
    cadence: "100ms while a borrowed local runtime shuts down and its replacement acquires ownership"
    cancellation: "caller context or the bounded startup timeout"
    readiness_health: "returns only after a reused or newly owned FleetDB satisfies required capabilities"
    retry_backoff: "fixed 100ms ownership retry; typed capability incompatibility fails closed"
    classification: startup-wait

  - id: local-runtime-startup-wait
    kind: ticker
    file: internal/cli/local/local_cmd.go
    function: EnsureRuntimeStarted
    site: "time.NewTicker#1"
    capability: platform
    owner: local runtime CLI
    cadence: "250ms while the spawned runtime initializes"
    cancellation: "startup context cancellation or bounded startup deadline"
    readiness_health: "returns only after the runtime status endpoint reports ready"
    retry_backoff: "fixed 250ms status probe until deadline"
    classification: startup-wait

  - id: local-runtime-health-wait
    kind: ticker
    file: internal/cli/local/runtime.go
    function: waitForRuntime
    site: "time.NewTicker#1"
    capability: platform
    owner: local runtime CLI
    cadence: "200ms health probe"
    cancellation: "caller context cancellation"
    readiness_health: "gates the command on a successful runtime health response"
    retry_backoff: "fixed 200ms retry"
    classification: startup-wait

  - id: local-workspace-readiness-wait
    kind: ticker
    file: internal/cli/local/runtime.go
    function: WaitForWorkspaceReady
    site: "time.NewTicker#1"
    capability: workspace
    owner: local runtime CLI
    cadence: "200ms workspace readiness probe"
    cancellation: "caller context cancellation"
    readiness_health: "gates the command on the workspace readiness endpoint"
    retry_backoff: "fixed 200ms retry"
    classification: startup-wait

  - id: codex-app-server-startup-wait
    kind: ticker
    file: internal/infra/interactionlead/codex_runtime.go
    function: waitForCodexAppServer
    site: "time.NewTicker#1"
    capability: interaction
    owner: lead control runtime
    cadence: "100ms endpoint probe"
    cancellation: "lead runtime context, app-server exit, or startup timeout"
    readiness_health: "gates lead discovery on a reachable Codex app-server endpoint"
    retry_backoff: "fixed 100ms retry with terminal process error propagation"
    classification: startup-wait

  - id: codex-lead-thread-discovery
    kind: component
    file: internal/infra/interactionlead/codex_runtime.go
    function: discoverCodexLeadThread
    site: component:bounded-thread-discovery
    capability: interaction
    owner: lead control runtime
    cadence: "500ms initial probe with exponential backoff capped at 5s, bounded by 45s"
    cancellation: "lead runtime context, successful discovery, or the 45s discovery deadline"
    readiness_health: "persists the discovered Codex thread identity or records a terminal delivery-attempt timeout"
    retry_backoff: "exponential from 500ms to a 5s cap"
    classification: startup-wait

  - id: automode-tmux-stream-poll
    kind: ticker
    file: internal/cli/automode/automode_tmux_session.go
    function: streamUntilExit
    site: "time.NewTicker#1"
    capability: interaction
    owner: automode tmux runtime
    cadence: "200ms when fixed polling is selected"
    cancellation: "shutdown channel, tmux session exit, or terminal signal"
    readiness_health: "stream progress and session exit are surfaced to the foreground command"
    retry_backoff: "fixed polling mode; adaptive poller is the alternative path"
    classification: command-poll

  - id: epic-workflow-run-wait
    kind: ticker
    file: internal/cli/epic/run.go
    function: executeWorkflowRun
    site: "time.NewTicker#1"
    capability: execution
    owner: epic workflow CLI
    cadence: "1s while the requested DriverRun remains non-terminal"
    cancellation: "foreground command context cancellation or terminal DriverRun state"
    readiness_health: "returns the terminal DriverRun status and surfaces failed runs as command errors"
    retry_backoff: "fixed 1s read polling; read failures fail the command closed"
    classification: command-poll

  # Standalone and serve-hosted managed loops.
  - id: lead-session-heartbeat
    kind: ticker
    file: internal/cli/agent/lead/lead.go
    function: heartbeatLeadSessionEvery
    site: "time.NewTicker#1"
    capability: interaction
    owner: standalone lead runtime
    cadence: "30s by default"
    cancellation: "lead stop channel with WaitGroup join"
    readiness_health: "advances AgentSession last_heartbeat; failures are debug logged"
    retry_backoff: "best effort; retry on the next cadence"
    classification: managed

  # Serve-hosted caches, execution workers, and automation reconcilers.
  - id: serve-metrics-cache-refresh
    kind: ticker
    file: internal/cli/serve/metricscmd/collector.go
    function: cachedCollector.startBackground
    site: "time.NewTicker#1"
    capability: platform
    owner: serve metrics adapter
    cadence: "constructor-supplied refresh interval"
    cancellation: "serve context cancellation"
    readiness_health: "warms the monitor snapshot cache; foreground reads retain their own fallback"
    retry_backoff: "fixed refresh cadence"
    classification: managed

  - id: serve-agent-provisioning-recovery
    kind: component
    file: internal/app/agentprovisioning/runtime.go
    function: RuntimeRegistration
    site: "component:agent-provisioning-recovery-registration"
    capability: agents
    owner: AgentProvisioning process manager hosted by platform runtime
    cadence: "10s after an immediate pending-intent recovery pass"
    cancellation: "platform runtime host cancellation and bounded Stop join"
    readiness_health: "runtime host records per-pass success, failure, panic, timeout, and next run"
    retry_backoff: "host exponential backoff from 1s to 1m; durable intent steps and progress CAS make every pass restart-safe"
    classification: managed

  - id: serve-agents-desired-state-reconciliation
    kind: component
    file: internal/modules/agents/runtime.go
    function: RuntimeRegistration
    site: "component:desired-state-reconciliation-registration"
    capability: agents
    owner: Agents runtime contribution hosted by platform runtime
    cadence: "30s after an immediate desired-state reconciliation pass"
    cancellation: "platform runtime host cancellation and a 30s per-pass timeout"
    readiness_health: "runtime host records per-pass success, failure, panic, timeout, and next run"
    retry_backoff: "host exponential backoff from 1s to 1m; exact-generation lifecycle CAS makes every pass restart-safe"
    classification: managed

  - id: execution-driver-run
    kind: component
    file: internal/modules/execution/runtime.go
    function: RuntimeRegistrations
    site: "component:driver-run-registration"
    capability: execution
    owner: Execution runtime contribution hosted by platform runtime
    cadence: "2s after an immediate recovery and execution pass"
    cancellation: "platform runtime host cancellation and bounded Stop join"
    readiness_health: "runtime host records per-pass success, failure, panic, and next run"
