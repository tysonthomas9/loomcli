schema_version: 1
status: reviewed
commands:
  - id: artifacts.declare
    phase: 4
    aggregate_owner: artifacts
    coordinating_owner: execution
    mechanism_discriminator: artifact:task_run
    instance_owner: artifacts
    accepted_authority: [execution]
    durable_commands: [fleetdb.declare_execution_artifact.v1]
    transaction_or_saga_boundary: FleetDB verifies the exact TaskRun owner resource, holder, lease, and fence while idempotently reserving the Artifact identity in one owner command.
    idempotency_key: workspace_id:task_run_id:artifact_id:declare
    semantic_events_or_read_models: [artifacts.lifecycle.v1]
    retry_restart_behavior: An exact retry returns the declared Artifact; a changed definition under the same identity is a terminal conflict and never falls back to generic Artifact create.
    negative_tests: [expired_execution, owner_mismatch, stale_fence, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: artifacts.finalize
    phase: 4
    aggregate_owner: artifacts
    coordinating_owner: execution
    mechanism_discriminator: artifact:task_run
    instance_owner: artifacts
    accepted_authority: [execution]
    durable_commands: [fleetdb.finalize_execution_artifact.v1]
    transaction_or_saga_boundary: FleetDB validates staged content, expected revision, and the exact TaskRun owner fence before one CAS transition publishes immutable finalized metadata.
    idempotency_key: workspace_id:task_run_id:artifact_id:content_hash:finalize
    semantic_events_or_read_models: [artifacts.lifecycle.v1]
    retry_restart_behavior: Exact command-receipt replay returns the original finalized Artifact snapshot even after later owner or projection changes. Loom retries the same deterministic command ID through a bounded 128-revision window ending at the current Artifact revision to find that receipt; divergent metadata or content under the same identity conflicts without rewriting the Artifact.
    negative_tests: [content_mismatch, expired_execution, owner_mismatch, stale_fence, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [concurrent_finalize, duplicate_request, lost_response_after_commit]
  - id: artifacts.reference
    phase: 4
    aggregate_owner: artifacts
    coordinating_owner: execution
    mechanism_discriminator: artifact_reference:task_run
    instance_owner: artifacts
    accepted_authority: [execution]
    durable_commands: [fleetdb.reference_execution_artifact.v1]
    transaction_or_saga_boundary: One FleetDB transaction verifies the exact TaskRun owner fence and expected Artifact revision, requires finalized state, inserts the immutable reference and command receipt, and increments the Artifact revision.
    idempotency_key: workspace_id:task_run_id:node_id:lease_id:fencing_token:artifact_id:reference_kind:target_ref
    semantic_events_or_read_models: [artifacts.reference.v1]
    retry_restart_behavior: Loom retries the same deterministic command ID through a bounded 128-revision window ending at the current Artifact revision until FleetDB replays the original immutable receipt; a changed kind or target is a different command and cannot redirect the reference.
    negative_tests: [artifact_not_finalized, divergent_reference_result, expired_execution, owner_mismatch, stale_fence, stale_revision, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit, response_validation]
  - id: artifacts.upload
    phase: 4
    aggregate_owner: artifacts
    coordinating_owner: execution
    mechanism_discriminator: artifact_upload:task_run
    instance_owner: artifacts
    accepted_authority: [execution]
    durable_commands: [fleetdb.upload_execution_artifact.v1]
    transaction_or_saga_boundary: FleetDB verifies the exact TaskRun owner fence and expected Artifact revision before writing a content-addressed object, then attaches its URI and digest with an owner-fenced revision CAS; a losing race can leave only an unreferenced object eligible for garbage collection.
    idempotency_key: workspace_id:task_run_id:artifact_id:content_hash:upload
    semantic_events_or_read_models: [artifacts.lifecycle.v1]
    retry_restart_behavior: Exact command-receipt replay returns the original uploaded Artifact snapshot without rewriting content. The deterministic identity binds the content digest, MIME type, and size; different bytes or metadata under that identity conflict without a separate upload lease.
    negative_tests: [content_mismatch, expired_execution, owner_mismatch, stale_fence, stale_revision, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [content_write_before_metadata, duplicate_request, lost_response_after_commit]
  - id: automation.admit-event
    phase: 3
    aggregate_owner: automation
    coordinating_owner: automation
    mechanism_discriminator: trigger_event_and_delivery
    instance_owner: automation
    accepted_authority: [execution, system, webhook]
    durable_commands: [fleetdb.dispatch_automation_delivery.v1, fleetdb.reserve_automation_admission.v1, fleetdb.transition_automation_delivery.v1]
    transaction_or_saga_boundary: One FleetDB reservation atomically validates the binding-set and Catalog snapshots and persists the Event plus every Delivery; each reserved Delivery then advances through idempotent dispatch and CAS transitions as a restartable process.
    idempotency_key: external=source_kind:source_event_id;internal=internal:workspace_id:source_event_id;cron=occurrence_id
    semantic_events_or_read_models: [automation.delivery.v1, automation.event.v1, execution.driver_run.v1]
    retry_restart_behavior: Exact reservation replay returns the immutable original match set; Delivery records retain target, attempt, and transition state so restart resumes without rematching or selecting a new Catalog version.
    negative_tests: [actor_excluded, expired_authority, hop_depth_exceeded, idempotency_conflict, inactive_catalog_version, missing_parent_event, stale_binding_snapshot, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, lost_dispatch_response, process_stop_after_reservation, transition_conflict]
  - id: automation.create-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: automation
    mechanism_discriminator: trigger_binding
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.create_trigger_binding.v1]
    transaction_or_saga_boundary: Automation validates the complete definition and effective Catalog target before one FleetDB create reserves the workspace binding ID and route identity.
    idempotency_key: workspace_id:binding_id:create
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: A committed duplicate is observed through the existing binding identity; management HTTP may ensure the same definition while create-only CLI requests preserve duplicate conflict semantics.
    negative_tests: [expired_operator, managed_binding_authority, secret_in_automation_payload, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, persistence_failure, response_validation]
  - id: automation.create-managed-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: agents
    mechanism_discriminator: trigger_binding:agent_service
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.create_trigger_binding.v1]
    transaction_or_saga_boundary: Agents supplies the exact owning AgentService ID; Automation verifies that identity and the Catalog target before one FleetDB binding create.
    idempotency_key: workspace_id:agent_service_id:binding_id:create
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: The stable binding ID and exact AgentService owner make retries converge or return a duplicate conflict without allowing an ordinary binding command to take ownership.
    negative_tests: [expired_operator, mismatched_agent_service_owner, ordinary_binding_authority, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, persistence_failure, response_validation]
  - id: automation.delete-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: automation
    mechanism_discriminator: trigger_binding
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.delete_trigger_binding.v1]
    transaction_or_saga_boundary: Automation rejects enabled or managed bindings before one FleetDB delete; the HTTP retirement workflow durably disables first and revokes connector grants before invoking this command.
    idempotency_key: workspace_id:binding_id:disabled_delete
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: Failure before delete leaves a durable disabled binding and idempotent grant revocation can resume; an already-absent authenticated HTTP retirement converges to deleted=true so a lost final response is safe to retry.
    negative_tests: [enabled_binding, expired_operator, managed_binding_authority, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [connector_failure_before_delete, delete_failure_after_disable, lost_response_after_delete, retry_from_disabled]
  - id: automation.delete-managed-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: agents
    mechanism_discriminator: trigger_binding:agent_service
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.delete_trigger_binding.v1]
    transaction_or_saga_boundary: Automation verifies the exact AgentService owner and requires the binding to be disabled before one FleetDB delete; Agents coordinates grant revocation and record archival around it.
    idempotency_key: workspace_id:agent_service_id:binding_id:disabled_delete
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: A failure before delete leaves the disabled managed binding available for an owner-matched retry; an ordinary delete command remains forbidden.
    negative_tests: [enabled_binding, expired_operator, mismatched_agent_service_owner, ordinary_binding_authority, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [grant_revocation_failure, persistence_failure, retry_from_disabled]
  - id: automation.disable-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: automation
    mechanism_discriminator: trigger_binding
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.update_trigger_binding.v1]
    transaction_or_saga_boundary: Automation verifies ordinary ownership and writes the disabled state through one FleetDB binding update before any retirement side effect.
    idempotency_key: workspace_id:binding_id:enabled=false
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: An already-disabled binding returns its durable snapshot without another write, making pre-delete restart safe.
    negative_tests: [expired_operator, managed_binding_authority, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, persistence_failure]
  - id: automation.disable-managed-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: agents
    mechanism_discriminator: trigger_binding:agent_service
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.update_trigger_binding.v1]
    transaction_or_saga_boundary: Automation verifies the exact AgentService owner and writes the disabled state through one FleetDB binding update.
    idempotency_key: workspace_id:agent_service_id:binding_id:enabled=false
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: An already-disabled owner-matched binding returns its durable snapshot; mismatched owners cannot resume or mutate it.
    negative_tests: [expired_operator, mismatched_agent_service_owner, ordinary_binding_authority, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, persistence_failure]
  - id: automation.dispatch-binding
    phase: 3
    aggregate_owner: execution
    coordinating_owner: automation
    mechanism_discriminator: driver_run:manual_binding
    instance_owner: execution
    accepted_authority: [operator]
    durable_commands: [fleetdb.dispatch_automation_binding.v1]
    transaction_or_saga_boundary: One FleetDB transaction locks the binding and concurrency-policy scope, revalidates the effective Catalog snapshot, and creates, reuses, supersedes, or reports the Execution-owned DriverRun atomically.
    idempotency_key: workspace_id:binding_id:caller_idempotency_key
    semantic_events_or_read_models: [automation.binding_run.v1, execution.driver_run.v1]
    retry_restart_behavior: Loom retries one ambiguous response with the same key; FleetDB replays the committed run and never falls back to generic DriverRun creation.
    negative_tests: [catalog_snapshot_conflict, expired_operator, inactive_binding, malformed_payload, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_forbid_policy, duplicate_request, lost_response_after_commit]
  - id: automation.enable-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: automation
    mechanism_discriminator: trigger_binding
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.update_trigger_binding.v1]
    transaction_or_saga_boundary: Automation verifies ordinary ownership and writes the enabled state through one FleetDB binding update.
    idempotency_key: workspace_id:binding_id:enabled=true
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: An already-enabled binding returns its durable snapshot without another write.
    negative_tests: [expired_operator, managed_binding_authority, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, persistence_failure]
  - id: automation.enable-managed-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: agents
    mechanism_discriminator: trigger_binding:agent_service
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.update_trigger_binding.v1]
    transaction_or_saga_boundary: Automation verifies the exact AgentService owner and writes the enabled state through one FleetDB binding update.
    idempotency_key: workspace_id:agent_service_id:binding_id:enabled=true
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: An already-enabled owner-matched binding returns its durable snapshot; mismatched owners remain rejected.
    negative_tests: [expired_operator, mismatched_agent_service_owner, ordinary_binding_authority, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, persistence_failure]
  - id: automation.retry-deliveries
    phase: 3
    aggregate_owner: automation
    coordinating_owner: automation
    mechanism_discriminator: trigger_delivery_retry
    instance_owner: automation
    accepted_authority: [system]
    durable_commands: [fleetdb.claim_due_automation_deliveries.v1, fleetdb.dispatch_automation_delivery.v1, fleetdb.transition_automation_delivery.v1]
    transaction_or_saga_boundary: FleetDB atomically claims due Delivery attempts with a reclaimable lease; each immutable target is dispatched and finalized by expected-status and expected-attempt CAS.
    idempotency_key: event_idempotency_key:binding_id:delivery_attempt
    semantic_events_or_read_models: [automation.delivery.v1, execution.driver_run.v1]
    retry_restart_behavior: A crash leaves a reclaimable durable attempt; repeated dispatch replays the same run intent and transition CAS prevents double advancement or target reselection.
    negative_tests: [expired_system_authority, malformed_candidate, stale_attempt, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [dispatch_failure, duplicate_claim, lost_dispatch_response, process_stop_after_claim, transition_conflict]
  - id: automation.sweep-cron
    phase: 3
    aggregate_owner: automation
    coordinating_owner: automation
    mechanism_discriminator: cron_occurrence
    instance_owner: automation
    accepted_authority: [system]
    durable_commands: [fleetdb.claim_due_automation_cron.v1, fleetdb.complete_automation_cron.v1, fleetdb.reserve_automation_admission.v1]
    transaction_or_saga_boundary: FleetDB atomically claims stable due occurrences with a reclaimable lease; Automation admits each occurrence through the one admission command and records idempotent completion before advancing the durable cursor.
    idempotency_key: claim=workspace_id:before:claim_until:limit;occurrence=cron:binding_id:scheduled_unix
    semantic_events_or_read_models: [automation.cron_cursor.v1, automation.event.v1]
    retry_restart_behavior: Exact claim replay and stable occurrence IDs prevent duplicate fires; a failed or abandoned claim becomes reclaimable without advancing the schedule window.
    negative_tests: [expired_system_authority, invalid_schedule, malformed_occurrence, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [completion_failure, duplicate_claim, process_stop_after_claim, restart_reclaim]
  - id: automation.update-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: automation
    mechanism_discriminator: trigger_binding
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.update_trigger_binding.v1]
    transaction_or_saga_boundary: Automation loads the ordinary binding, applies the typed patch, re-resolves a changed Catalog target, preserves enablement and identity, and writes one FleetDB binding update.
    idempotency_key: workspace_id:binding_id:canonical_binding_state
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: Repeating an identical patch converges on the same definition; managed bindings and immutable IDs remain rejected.
    negative_tests: [expired_operator, immutable_binding_id, managed_binding_authority, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, persistence_failure, response_validation]
  - id: automation.update-managed-binding
    phase: 3
    aggregate_owner: automation
    coordinating_owner: agents
    mechanism_discriminator: trigger_binding:agent_service
    instance_owner: automation
    accepted_authority: [operator]
    durable_commands: [fleetdb.update_trigger_binding.v1]
    transaction_or_saga_boundary: Automation verifies the exact AgentService owner before and after applying the typed patch, re-resolves a changed Catalog target, and writes one FleetDB binding update without allowing ownership transfer.
    idempotency_key: workspace_id:agent_service_id:binding_id:canonical_binding_state
    semantic_events_or_read_models: [automation.binding.v1]
    retry_restart_behavior: Repeating an identical owner-matched patch converges; an owner change or ordinary binding command fails closed.
    negative_tests: [expired_operator, immutable_binding_id, mismatched_agent_service_owner, ordinary_binding_authority, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, persistence_failure, response_validation]
  - id: execution.append-log
    phase: 4
    aggregate_owner: execution
    coordinating_owner: execution
    mechanism_discriminator: task_run_log
    instance_owner: execution
    accepted_authority: [execution]
    durable_commands: ["POST /api/v1/{workspace}/task-runs/{task_run_id}/logs"]
    transaction_or_saga_boundary: FleetDB atomically validates the current TaskRun owner, allocates one durable per-run sequence, and stores the request ID, timestamp, payload fingerprint, and immutable log-entry receipt in the same transition.
    idempotency_key: workspace_id:task_run_id:request_id
    semantic_events_or_read_models: [execution.task_run_log.v1]
    retry_restart_behavior: Exact request replay returns the original sequence and timestamp without appending duplicate text; divergent level, message, timestamp, or owner intent under the same request ID conflicts.
    negative_tests: [expired_execution, owner_mismatch, stale_fence, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [concurrent_append, divergent_request_reuse, duplicate_request, lost_response_after_commit]
  - id: execution.await-driver-run
    phase: 4
    aggregate_owner: execution
    coordinating_owner: execution
    mechanism_discriminator: await:driver_run
    instance_owner: execution
    accepted_authority: [execution]
    durable_commands: ["POST /api/v1/{workspace}/awaits/register-and-check", "POST /api/v1/{workspace}/driver-runs/{run_id}/resume", "POST /api/v1/{workspace}/driver-runs/{run_id}/suspend"]
    transaction_or_saga_boundary: FleetDB atomically registers and checks the Await, then Execution owner-fenced suspension and the persisted satisfied-state probe form the restartable close of the registration race.
    idempotency_key: workspace_id:driver_run_id:await_instance_key
    semantic_events_or_read_models: [execution.await.v1, execution.driver_run.v1]
    retry_restart_behavior: Registration replay returns the same Await; an already-satisfied registration or post-suspend satisfied probe resumes the same DriverRun without consuming another await index.
    negative_tests: [expired_execution, owner_mismatch, stale_fence, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [duplicate_event, duplicate_request, process_stop_after_registration, process_stop_after_suspend]
  - id: execution.cascade-child-driver-runs
    phase: 4
    aggregate_owner: execution
    coordinating_owner: execution
    mechanism_discriminator: driver_run_child_cascade
    instance_owner: execution
    accepted_authority: [execution]
    durable_commands: ["POST /api/v1/{workspace}/driver-runs/{run_id}/commands/cascade-children"]
    transaction_or_saga_boundary: One FleetDB child-lifecycle command validates the exact parent owner and atomically persists the bounded descendant terminal and cancellation-request set plus its action receipt.
    idempotency_key: workspace_id:parent_run_id:parent_fence:request_id
    semantic_events_or_read_models: [execution.driver_run.v1]
    retry_restart_behavior: The receipt freezes the affected descendant ID sets and cascade intent, while replay re-reads and returns those descendants' current projections so later legitimate lifecycle advancement is not hidden; divergent payload under the same request conflicts.
    negative_tests: [composition_depth_exceeded, cycle_detected, expired_execution, owner_mismatch, stale_fence, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [concurrent_descendant_finish, duplicate_request, lost_response_after_commit]
  - id: execution.claim-await-event-notifications
    phase: 4
    aggregate_owner: execution
    coordinating_owner: execution
    mechanism_discriminator: await_event_notification_claim
    instance_owner: execution
    accepted_authority: [system]
    durable_commands: ["POST /api/v1/{workspace}/await-event-notifications/claim"]
    transaction_or_saga_boundary: Execution fixes the bounded batch size and claim lease; one FleetDB command atomically leases due or expired await-event notification rows and increments each durable attempt.
    idempotency_key: "lease-based: workspace_id:event_id is owned by claim_id only until claim_until; there is no exact claim replay receipt"
    semantic_events_or_read_models: [execution.await_event_notification.v1]
    retry_restart_behavior: Retrying after a lost claim response before claim_until returns no row because the first lease is still authoritative; a registered Execution component reclaims it with a new claim and incremented attempt only after lease expiry, without bypassing persisted backoff.
    negative_tests: [expired_system_authority, oversized_limit, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [claim_before_lease_expiry_returns_empty, process_stop_after_claim, restart_reclaim_after_lease_expiry]
  - id: execution.claim-driver-run
    phase: 4
    aggregate_owner: execution
    coordinating_owner: execution
    mechanism_discriminator: driver_run_claim
    instance_owner: execution
    accepted_authority: [system]
    durable_commands: ["POST /api/v1/{workspace}/driver-runs/{run_id}/claim"]
    transaction_or_saga_boundary: The registered Driver executor invokes FleetDB's one DriverRun claim transition, which assigns the requested node and lease identity and advances the fence.
    idempotency_key: workspace_id:run_id:lease_id:request_id
    semantic_events_or_read_models: [execution.driver_run.v1]
    retry_restart_behavior: Exact request replay returns the immutable original claim receipt; a competing lease, divergent claimant, or non-queued live request conflicts instead of overwriting ownership.
    negative_tests: [expired_system_authority, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [concurrent_claimants, lost_response_after_commit]
  - id: execution.claim-driver-run-outcomes
    phase: 4
    aggregate_owner: execution
    coordinating_owner: execution
    mechanism_discriminator: driver_run_outcome_claim
    instance_owner: execution
    accepted_authority: [system]
    durable_commands: ["POST /api/v1/{workspace}/driver-run-outcomes/claim"]
    transaction_or_saga_boundary: Execution fixes the bounded batch size and claim lease; one FleetDB command atomically leases due or expired immutable terminal DriverRun outcomes and increments each durable attempt.
    idempotency_key: "lease-based: workspace_id:driver_run_id is owned by claim_id only until claim_until; there is no exact claim replay receipt"
    semantic_events_or_read_models: [execution.driver_run_outcome.v1]
    retry_restart_behavior: Retrying after a lost claim response before claim_until returns no row because the first lease is still authoritative; after lease expiry or persisted retry time a new claim increments the attempt, while downstream work reuses the deterministic run.finished identity.
    negative_tests: [expired_system_authority, oversized_limit, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [claim_before_lease_expiry_returns_empty, process_stop_after_claim, restart_reclaim_after_lease_expiry]
  - id: execution.claim-driver-run-work-item
    phase: 4
    aggregate_owner: execution
    coordinating_owner: execution
    mechanism_discriminator: driver_run_work_item_claim
    instance_owner: execution
    accepted_authority: [execution]
    durable_commands: ["POST /api/v1/{workspace}/driver-runs/{run_id}/work-items/{task_id}/claim"]
    transaction_or_saga_boundary: One FleetDB transaction validates the exact live parent DriverRun owner, claims the Work Item as the server-derived driver-run actor, projects the Issue, and commits the action receipt.
    idempotency_key: workspace_id:run_id:task_id:request_id
    semantic_events_or_read_models: [workitems.claim.v1]
    retry_restart_behavior: Exact request replay returns the immutable original claim receipt; a different parent owner, claim actor, Work Item, or command payload conflicts.
    negative_tests: [expired_execution, owner_mismatch, stale_fence, task_not_ready, unauthenticated, wrong_action, wrong_claim_actor, wrong_resource, wrong_workspace]
    fault_injection_tests: [concurrent_claimants, duplicate_request, lost_response_after_commit, transaction_rollback]
  - id: execution.claim-task-run
    phase: 4
    aggregate_owner: execution
    coordinating_owner: execution
    mechanism_discriminator: issue_claim_and_task_run_start
    instance_owner: execution
    accepted_authority: [system]
    durable_commands: ["POST /api/v1/{workspace}/task-runs/claim-next-and-start", "POST /api/v1/{workspace}/task-runs/{task_run_id}/claim-and-start"]
