schema_version: 1
status: reviewed
commands:
  - id: agentprovisioning.begin
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agentprovisioning
    mechanism_discriminator: agent_provisioning_intent
    instance_owner: agentprovisioning
    accepted_authority: [operator]
    durable_commands: [fleetdb.begin_agent_provisioning.v1, fleetdb.save_agent_provisioning_progress.v1]
    transaction_or_saga_boundary: FleetDB first-writer-wins persistence records the complete secret-free intent before the process manager converges Role, Agent, Binding, and Grant steps with deterministic command IDs and version-CAS progress.
    idempotency_key: workspace_id:provisioning_id:intent_fingerprint
    semantic_events_or_read_models: [agents.provisioning_progress.v1]
    retry_restart_behavior: Exact intent replay returns the durable record; a changed intent under the same provisioning ID conflicts, and startup recovery resumes only pending, running, or retryable-failed steps.
    negative_tests: [divergent_intent, expired_operator, secret_in_intent, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [crash_after_external_commit, duplicate_request, lost_response_after_commit, progress_cas_conflict]
  - id: agents.acquire-ownership
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_ownership_generation
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: [fleetdb.acquire_agent_ownership.v1]
    transaction_or_saga_boundary: FleetDB atomically claims the Agent ownership generation and returns one opaque lease credential plus its public fenced ownership record.
    idempotency_key: workspace_id:agent_id:owner_id:request_id
    semantic_events_or_read_models: [agents.ownership.v1]
    retry_restart_behavior: Exact acquisition replay returns the same generation; a live competing owner is rejected and expiry permits a later generation without reviving an old proof.
    negative_tests: [expired_system_authority, live_competing_owner, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.apply-lifecycle
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_lifecycle:agent_service:trigger_bindings:connector_grants
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [fleetdb.apply_agent_lifecycle.v1]
    transaction_or_saga_boundary: One FleetDB Redis script or PostgreSQL transaction CAS-fences the Agent revision and changes every owned managed binding together with desired state; deletion additionally revokes every binding-scoped active grant, retires and removes the bindings, and archives the Agent in the same visibility point.
    idempotency_key: workspace_id:agent_id:expected_revision:action:caller_idempotency_key
    semantic_events_or_read_models: [agents.identity.v1, agents.lifecycle_receipt.v1, automation.binding.v1, connectors.grant.v1]
    retry_restart_behavior: FleetDB persists the exact secret-free result in the same commit and returns it before live-revision checks on replay, so a lost response or Loom restart cannot expose or strand a half-enabled, half-disabled, or partially deleted Agent.
    negative_tests: [archived_agent, divergent_idempotency_key, expired_operator, retired_binding_grant_create, stale_revision, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_binding_create, concurrent_grant_create, lost_response_after_commit, restart_exact_replay]
  - id: agents.archive-agent
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_identity
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [fleetdb.archive_agent_service.v1]
    transaction_or_saga_boundary: FleetDB applies one expected-revision transition that archives the Agent identity without deleting its audit history or transferring ownership to Interaction or Execution.
    idempotency_key: workspace_id:agent_id:expected_revision:archive
    semantic_events_or_read_models: [agents.identity.v1]
    retry_restart_behavior: An exact receipt replays the archived snapshot; a stale revision or changed identity conflicts without a generic delete fallback.
    negative_tests: [expired_operator, stale_revision, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.bind-supervised-assignment-parent
    phase: 5
    aggregate_owner: agents
    coordinating_owner: execution
    mechanism_discriminator: supervised_assignment_parent:driver_run_generation
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: [agents.compat.bind_supervised_assignment_parent.v1]
    transaction_or_saga_boundary: The Driver API first verifies the exact running DriverRun node, lease, and fence through Execution; the application process manager then derives a single-action Agents system authority and compatstore compare-and-sets the expected parent.
    idempotency_key: workspace_id:agent_name:expected_parent:driver_run_id:lease_id:fencing_token
    semantic_events_or_read_models: [agents.supervised_assignment.v1]
    retry_restart_behavior: Exact same-generation replay converges on the bound parent; a stale DriverRun generation or changed expected parent conflicts and cannot fall back to a filesystem lock.
    negative_tests: [expired_system_authority, forged_proof, stale_fence, unauthenticated, wrong_action, wrong_driver_run, wrong_workspace]
    fault_injection_tests: [concurrent_parent_change, duplicate_request, lost_response_after_commit]
  - id: agents.create-agent
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_identity
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [fleetdb.create_agent_service.v1]
    transaction_or_saga_boundary: FleetDB reserves the workspace Agent identity and persists only Role or Driver behavior references plus desired intent; terminal, Git, trigger, and execution state are excluded.
    idempotency_key: workspace_id:agent_id:create
    semantic_events_or_read_models: [agents.identity.v1]
    retry_restart_behavior: Exact definition replay converges on the same Agent identity; a divergent definition under the same Agent ID conflicts.
    negative_tests: [divergent_identity, expired_operator, invalid_behavior_reference, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.create-role
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: role_definition
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [fleetdb.create_role.v1]
    transaction_or_saga_boundary: Agents validates the complete Role policy and FleetDB atomically reserves the workspace and Role-name natural key without embedding session, terminal, trigger, Git, or execution state.
    idempotency_key: workspace_id:role_name:definition_fingerprint
    semantic_events_or_read_models: [agents.role.v1]
    retry_restart_behavior: The stable natural key makes a committed Role discoverable after a lost response; duplicate create reports already exists, and concurrent or divergent reuse never overwrites the existing policy.
    negative_tests: [divergent_role, expired_operator, invalid_role, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.create-supervised-assignment
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: supervised_assignment_intent
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [agents.compat.create_supervised_assignment.v1]
    transaction_or_saga_boundary: Agents admits one operator-owned assignment definition and compatstore creates only configuration plus desired intent; observed runtime state and parent linkage are structurally absent.
    idempotency_key: workspace_id:agent_name:create
    semantic_events_or_read_models: [agents.supervised_assignment.v1]
    retry_restart_behavior: The workspace and agent-name natural key makes a committed create discoverable; duplicate or divergent create never overwrites the existing assignment.
    negative_tests: [invalid_definition, parent_in_create, runtime_state_in_create, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.delete-role
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: role_definition
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [fleetdb.delete_role_cas.v1]
    transaction_or_saga_boundary: FleetDB validates the expected Role revision and rejects deletion while an Agent still references the Role, then removes only that exact policy record in one atomic transition.
    idempotency_key: workspace_id:role_name:expected_revision:delete
    semantic_events_or_read_models: [agents.role.v1]
    retry_restart_behavior: A committed delete is observable as not found and cannot remove a recreated successor revision; stale revision or active reference conflicts require a fresh operator decision.
    negative_tests: [active_agent_reference, expired_operator, stale_revision, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_agent_create, concurrent_role_update, lost_response_after_commit]
  - id: agents.ensure-managed-agent
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agentprovisioning
    mechanism_discriminator: agent_identity:managed
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: [fleetdb.ensure_managed_agent_service.v1]
    transaction_or_saga_boundary: Agents validates the complete immutable managed definition and FleetDB creates it or returns the exact existing identity without adopting a divergent record.
    idempotency_key: workspace_id:agent_id:provisioning_id:agent_step
    semantic_events_or_read_models: [agents.identity.v1]
    retry_restart_behavior: The deterministic provisioning command ID makes crash replay converge; same-key divergent state is a permanent conflict.
    negative_tests: [divergent_identity, expired_system_authority, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.ensure-managed-role
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agentprovisioning
    mechanism_discriminator: role_definition:managed
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: [fleetdb.ensure_managed_role.v1]
    transaction_or_saga_boundary: Agents validates the complete Role definition and FleetDB creates it or returns the exact existing natural-key record; unused managed Roles remain retained and auditable.
    idempotency_key: workspace_id:role_name:provisioning_id:role_step
    semantic_events_or_read_models: [agents.role.v1]
    retry_restart_behavior: Exact replay converges on the same Role; a conflicting definition never overwrites or deletes the retained Role.
    negative_tests: [divergent_role, expired_system_authority, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.reconcile-desired-state
    phase: 6
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_desired_state:managed_bindings
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: ["POST /api/v1/{workspace}/agent-services/{service_id}/lifecycle"]
    transaction_or_saga_boundary: The registered Agents reconciler reads the canonical desired intent and binding projections, then uses FleetDB's one atomic lifecycle CAS to repair every managed binding without changing desired state.
    idempotency_key: workspace_id:agent_id:generation_id:expected_updated_at:reconcile
    semantic_events_or_read_models: [agents.identity.v1, agents.lifecycle_receipt.v1, automation.binding.v1]
    retry_restart_behavior: Converged projections are a no-op; drift uses a deterministic generation-and-revision key, exact replay returns the committed receipt, and any concurrent Agent revision fails closed for a fresh reconciliation pass.
    negative_tests: [expired_system_authority, invalid_generation, stale_revision, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [concurrent_binding_change, duplicate_request, lost_response_after_commit, restart_exact_replay]
  - id: agents.release-ownership
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_ownership_generation
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: [fleetdb.release_agent_ownership.v1]
    transaction_or_saga_boundary: FleetDB validates the complete opaque ownership proof and closes only that exact Agent ownership generation.
    idempotency_key: workspace_id:agent_id:lease_id:fencing_token:release
    semantic_events_or_read_models: [agents.ownership.v1]
    retry_restart_behavior: Releasing the same closed generation is replay-safe; stale or cross-owner proofs cannot affect the current generation.
    negative_tests: [expired_ownership, expired_system_authority, owner_mismatch, stale_fence, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, lost_response_after_commit, release_renew_race]
  - id: agents.renew-ownership
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_ownership_generation
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: [fleetdb.renew_agent_ownership.v1]
    transaction_or_saga_boundary: FleetDB validates lease ID, opaque credential, owner, runtime provider, node, and fence before extending only the exact live Agent ownership generation.
    idempotency_key: workspace_id:agent_id:lease_id:fencing_token:renewal_deadline
    semantic_events_or_read_models: [agents.ownership.v1]
    retry_restart_behavior: Repeated renewal of the same generation converges on a nondecreasing expiry; stale generations remain fenced out.
    negative_tests: [expired_ownership, expired_system_authority, owner_mismatch, stale_fence, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, lost_response_after_commit, renew_release_race]
  - id: agents.repair-managed-role-prompt-file
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: role_prompt_file:fill_if_empty
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: [agents.compat.repair_managed_role_prompt_file.v1]
    transaction_or_saga_boundary: Agents admits one exact startup repair request and compatstore invokes the Role store fill-if-empty primitive, so an existing nonempty prompt is never overwritten by read-then-write repair.
    idempotency_key: workspace_id:role_name:request_id:prompt_file
    semantic_events_or_read_models: [agents.role.v1]
    retry_restart_behavior: Repeating the same fill-if-empty repair returns the exact Role; a divergent nonempty value conflicts and remains unchanged.
    negative_tests: [divergent_prompt, expired_system_authority, nonempty_prompt_file, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_prompt_update, duplicate_request, lost_response_after_commit]
  - id: agents.retire-managed-supervised-assignment
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: supervised_assignment_retirement:managed
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: [agents.compat.retire_supervised_assignment.v1]
    transaction_or_saga_boundary: A narrow application workflow derives one audited system authority and Agents deletes only the named compatibility assignment after its owning migration has converged.
    idempotency_key: workspace_id:agent_name:managed_retirement
    semantic_events_or_read_models: [agents.supervised_assignment.v1]
    retry_restart_behavior: Missing is success, so restart replay converges; a wrong component, action, or workspace never reaches compatstore.
    negative_tests: [expired_system_authority, unauthenticated, wrong_action, wrong_component, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.retire-supervised-assignment
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: supervised_assignment_retirement:operator
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [agents.compat.retire_supervised_assignment.v1]
    transaction_or_saga_boundary: Agents admits the exact operator retirement and compatstore removes only the named transitional assignment without exposing the process-wide Store.
    idempotency_key: workspace_id:agent_name:operator_retirement
    semantic_events_or_read_models: [agents.supervised_assignment.v1]
    retry_restart_behavior: Missing is success, so a lost response or restart replay converges without deleting a differently named assignment.
    negative_tests: [expired_operator, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.set-desired-state
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_desired_state
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [fleetdb.set_agent_desired_state.v1]
    transaction_or_saga_boundary: FleetDB applies one expected-revision desired-state transition while leaving observed session and execution activity in their owning capabilities.
    idempotency_key: workspace_id:agent_id:expected_revision:desired_state
    semantic_events_or_read_models: [agents.desired_state.v1]
    retry_restart_behavior: Exact receipt replay returns the committed desired state; a stale revision conflicts without inferring state from activity.
    negative_tests: [expired_operator, invalid_transition, stale_revision, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.set-desired-state-owned
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_desired_state:ownership
    instance_owner: agents
    accepted_authority: [system]
    durable_commands: [fleetdb.set_agent_desired_state_owned.v1]
    transaction_or_saga_boundary: FleetDB validates the exact Agent ownership generation and expected identity revision before changing desired state for the owned Agent.
    idempotency_key: workspace_id:agent_id:lease_id:fencing_token:expected_revision:desired_state
    semantic_events_or_read_models: [agents.desired_state.v1]
    retry_restart_behavior: Exact owner-fenced replay returns the committed transition; an expired or superseded ownership generation cannot mutate desired state.
    negative_tests: [expired_ownership, expired_system_authority, owner_mismatch, stale_fence, stale_revision, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [duplicate_request, lost_response_after_commit, ownership_generation_change]
  - id: agents.update-agent
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: agent_identity
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [fleetdb.update_agent_service.v1]
    transaction_or_saga_boundary: FleetDB applies one expected-revision patch limited to identity and behavior references; desired state and ownership use dedicated commands.
    idempotency_key: workspace_id:agent_id:expected_revision:patch_fingerprint
    semantic_events_or_read_models: [agents.identity.v1]
    retry_restart_behavior: Exact receipt replay returns the updated identity; stale revision or an attempt to smuggle desired state through the identity patch fails closed.
    negative_tests: [desired_state_in_patch, expired_operator, stale_revision, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.update-role
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: role_definition
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [fleetdb.update_role_cas.v1]
    transaction_or_saga_boundary: FleetDB validates the expected Role revision and applies one bounded policy patch atomically while preserving the workspace and Role-name identity.
    idempotency_key: workspace_id:role_name:expected_revision:patch_fingerprint
    semantic_events_or_read_models: [agents.role.v1]
    retry_restart_behavior: After a lost response the caller reads the current Role and may accept the exact requested patch result; replay with the consumed revision conflicts, and a divergent concurrent patch never falls back to read-then-replace.
    negative_tests: [expired_operator, invalid_patch, stale_revision, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: agents.update-supervised-assignment-intent
    phase: 5
    aggregate_owner: agents
    coordinating_owner: agents
    mechanism_discriminator: supervised_assignment_intent_patch
    instance_owner: agents
    accepted_authority: [operator]
    durable_commands: [agents.compat.update_supervised_assignment_intent.v1]
    transaction_or_saga_boundary: Agents admits one bounded operator-intent patch and compatstore updates only configuration or desired state; observed runtime state and parent linkage are structurally absent.
    idempotency_key: workspace_id:agent_name:intent_patch_fingerprint
    semantic_events_or_read_models: [agents.supervised_assignment.v1]
    retry_restart_behavior: Exact patch replay converges on the same intent, while an empty patch or attempt to smuggle runtime or parent state is rejected before persistence.
    negative_tests: [empty_patch, expired_operator, parent_in_patch, runtime_state_in_patch, unauthenticated, wrong_action, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: artifacts.declare
    phase: 7
    aggregate_owner: artifacts
    coordinating_owner: execution_and_interaction
    mechanism_discriminator: artifact:task_run_or_session
    instance_owner: artifacts
    accepted_authority: [execution, session]
    durable_commands: [fleetdb.create_session_artifact.v1, fleetdb.declare_execution_artifact.v1]
    transaction_or_saga_boundary: TaskRun declarations remain one FleetDB owner-fenced command. For a session transcript, Artifacts verifies an issuer-bound exact Session generation before the generic create; Interaction later revalidates that generation in its atomic transcript-reference patch.
    idempotency_key: workspace_id:owner_type:owner_id:artifact_id:declare
    semantic_events_or_read_models: [artifacts.lifecycle.v1]
    retry_restart_behavior: TaskRun declaration replays its owner-command receipt. Session content treats an occupied identity as a read-and-compare recovery point; an exact finalized digest returns without rewriting, an incomplete exact envelope resumes upload, and any changed owner, metadata, or content conflicts.
    negative_tests: [expired_authority, foreign_issuer, owner_mismatch, stale_fence, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit]
  - id: artifacts.finalize
    phase: 7
    aggregate_owner: artifacts
    coordinating_owner: execution_and_interaction
    mechanism_discriminator: artifact:task_run_or_session
    instance_owner: artifacts
    accepted_authority: [execution, session]
    durable_commands: [fleetdb.finalize_execution_artifact.v1, fleetdb.finalize_session_artifact.v1]
    transaction_or_saga_boundary: TaskRun finalization remains one FleetDB owner-fenced revision CAS. Session finalization is admitted by Artifacts for the exact issuer-bound Session generation and seals the same content digest before Interaction atomically attaches the Artifact to that still-live generation.
    idempotency_key: workspace_id:owner_type:owner_id:artifact_id:content_hash:finalize
    semantic_events_or_read_models: [artifacts.lifecycle.v1]
    retry_restart_behavior: TaskRun command-receipt replay returns the original finalized snapshot even after later owner changes. Session retry first compares the complete Artifact envelope and digest, returns an exact finalized match without rewriting, or resumes only the same incomplete Artifact; divergent metadata or content conflicts.
    negative_tests: [content_mismatch, expired_authority, foreign_issuer, owner_mismatch, stale_fence, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [concurrent_finalize, duplicate_request, lost_response_after_commit]
  - id: artifacts.reference
    phase: 4
    aggregate_owner: artifacts
    coordinating_owner: execution
    mechanism_discriminator: artifact_reference:task_run
    instance_owner: artifacts
    accepted_authority: [execution]
    durable_commands: [fleetdb.reference_execution_artifact.v1]
    transaction_or_saga_boundary: One FleetDB transaction verifies the exact TaskRun owner fence and expected Artifact revision, requires finalized state, inserts the immutable reference and command receipt, and increments the Artifact revision.
    idempotency_key: workspace_id:task_run_id:node_id:lease_id:fencing_token:artifact_id:reference_kind:target_ref
    semantic_events_or_read_models: [artifacts.reference.v1]
    retry_restart_behavior: Loom retries the same deterministic command ID through a bounded 128-revision window ending at the current Artifact revision until FleetDB replays the original immutable receipt; a changed kind or target is a different command and cannot redirect the reference.
    negative_tests: [artifact_not_finalized, divergent_reference_result, expired_execution, owner_mismatch, stale_fence, stale_revision, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [concurrent_request, duplicate_request, lost_response_after_commit, response_validation]
  - id: artifacts.upload
    phase: 7
    aggregate_owner: artifacts
    coordinating_owner: execution_and_interaction
    mechanism_discriminator: artifact_upload:task_run_or_session
    instance_owner: artifacts
    accepted_authority: [execution, session]
    durable_commands: [fleetdb.upload_execution_artifact.v1, fleetdb.upload_session_artifact.v1]
    transaction_or_saga_boundary: TaskRun upload remains owner-fenced in FleetDB. Session upload is admitted by Artifacts for the exact issuer-bound Session generation, validates the returned owner and digest, and can leave only an unreferenced finalized Artifact if the later Interaction reference patch rejects a stale generation.
    idempotency_key: workspace_id:owner_type:owner_id:artifact_id:content_hash:upload
    semantic_events_or_read_models: [artifacts.lifecycle.v1]
    retry_restart_behavior: TaskRun command-receipt replay returns the original uploaded snapshot. Session retry reaches upload only for the same non-finalized semantic envelope, then validates returned owner, MIME type, size, and digest; a finalized exact match is returned without another upload.
    negative_tests: [content_mismatch, expired_authority, foreign_issuer, owner_mismatch, stale_fence, stale_revision, unauthenticated, wrong_action, wrong_resource, wrong_workspace]
    fault_injection_tests: [content_write_before_metadata, duplicate_request, lost_response_after_commit]
  - id: automation.admit-event
    phase: 3
    aggregate_owner: automation
    coordinating_owner: automation
    mechanism_discriminator: trigger_event_and_delivery
