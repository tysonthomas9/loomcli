<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#ffc736" />
    <meta
      name="description"
      content="Superfactory orchestrates work, scales agents, and helps teams ship everywhere."
    />
    <meta property="og:title" content="Superfactory" />
    <meta
      property="og:description"
      content="Orchestrate work. Scale agents. Ship everywhere."
    />
    <meta
      property="og:image"
      content="/brand/superfactory-social-tagline.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/brand/superfactory-social-tagline.png"
    />
    <link
      rel="icon"
      type="image/png"
      href="/brand/superfactory-app-icon.png"
    />
    <link rel="apple-touch-icon" href="/brand/superfactory-app-icon.png" />
    <title>Superfactory</title>
  </head>
  <body>
    <script>
      // Prevent flash of wrong theme before React hydrates
      (function () {
        try {
          var t =
            localStorage.getItem("cortex:theme") ||
            localStorage.getItem("theme-preference");
          var theme =
            t === "light" || t === "dark"
              ? t
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
