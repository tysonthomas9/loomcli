<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Onboarding typography: Fraunces (display, variable optical-
         sized serif), DM Sans (body grotesk with warmth), IBM Plex
         Mono (mono for command pills + numerics). Loaded from Google
         Fonts so they work in dev and prod without bundling extra
         woff2 files. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Loom</title>
  </head>
  <body>
    <script>
      // Prevent flash of wrong theme before React hydrates
      (function () {
        try {
          var t =
            localStorage.getItem("cortex:theme") ||
            localStorage.getItem("theme-preference");
          var theme =
            t === "light" || t === "dark"
              ? t
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
