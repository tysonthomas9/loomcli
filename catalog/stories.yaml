        title: Verify the server matches its OpenAPI contract
        persona: [platform-engineer, dogfood-operator]
        situation: I changed an HTTP handler and need to confirm the OpenAPI spec still matches.
        outcome: The contract test fails loudly if any endpoint drifts from `api/openapi.yaml`.
        flow:
          - Regenerate server stubs from `api/openapi.yaml` via oapi-codegen.
