      - id: validate-coder-e2e
        title: Validate a coder produces diff, commit, and push
        persona: [dogfood-operator]
        situation: I want to verify the implementation cycle end to end.
        outcome: Files change, commit lands, push succeeds, issue closes — all visible in the UI.
        flow:
          - Seed an issue with an approved design.
          - Start the coder.
          - Watch live diff in the Diff tab.
          - Verify gate / test results.
          - Verify commit appears and push status flips to success.
        priority: must
