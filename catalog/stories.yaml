        persona: [platform-engineer]
        situation: Before shipping a fleet change I want to validate two-node behavior on my laptop.
        outcome: Two `loom serve` instances share an external Redis and one fleet DB; tasks claim correctly.
        flow:
          - Start Redis (via the compose `fleet` profile or a standalone container).
          - Start node A with `loom serve --fleet-mode --redis-addr ...`.
          - Start node B with the same Redis and a distinct `--node-id`.
          - Seed tasks; watch claims split between nodes in Monitor.
