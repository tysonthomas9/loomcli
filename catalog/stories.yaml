      - id: validate-direct-cli-visibility
        title: Confirm a direct CLI run is visible in the UI
        persona: [dogfood-operator]
        situation: I run `loom plan` straight from a shell — not via the daemon.
        outcome: The UI's Sessions tab shows the run without any "invisible CLI" warning.
        flow:
          - Open the web UI.
          - Run `loom plan <agent>` from a separate shell.
          - Watch the agent rail update with the new session.
          - Open the issue — Sessions tab shows the running session.
