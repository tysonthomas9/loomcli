      - id: install-service
        title: Run loom as a persistent service
        persona: [platform-engineer, solo-dev]
        situation: I want `loom serve` to start at boot and survive reboots.
        outcome: A systemd unit (Linux) or launchd plist (macOS) supervises loom.
        flow:
          - Run `loom serve install-service --port 8080 --bind 127.0.0.1`.
          - Service unit is generated and installed.
          - Service starts; `loom doctor` confirms it.
          - Uninstall with `loom serve install-service --uninstall`.
        priority: could
        related_features: [features:loom-serve-install-service, features:loom-local-service]
        source: internal/cli/serve/install
        tags: [service, lifecycle]
      - id: operate-the-daemon
        title: Operate the workspace daemon (status, restart, drain)
        persona: [platform-engineer]
        situation: The daemon is misbehaving and I want to inspect or restart it without killing in-flight work.
        outcome: I can see daemon state, drain it cleanly, and bring it back.
        flow:
          - Run `loom daemon status` — see supervised agents, queue, restart counts.
          - Run `loom daemon queue` to inspect pending tasks.
          - Run `loom daemon stop --drain` for graceful shutdown.
          - Run `loom daemon start` (or rely on the OS service) to bring it back.
        priority: should
        related_features: [features:loom-daemon, features:loom-daemon, features:cooperative-drain-yield, features:loom-daemon, features:daemon-status-api]
        source: internal/cli/daemon/daemon_cmd.go
        tags: [daemon, ops, lifecycle]
      - id: rotate-fleet-jwt
        title: Rotate the fleet JWT signing key safely
        persona: [platform-engineer]
        situation: It's time to rotate the RS256 signing key without taking workers offline.
        outcome: New keys are issued, workers transparently re-auth, and old keys can be retired.
        flow:
          - Generate a new RS256 keypair and publish the new `kid` in JWKS.
          - Update the BetterAuth service to sign with the new `kid`.
          - Workers and CLIs refresh tokens on their next heartbeat.
          - Once metrics show zero traffic on the old `kid`, retire it.
        priority: should
        related_features: [features:fleet-jwt-rs256, features:standalone-betterauth-service, features:auth-proxy, features:auth-proxy]
        source: internal/webui/fleet/jwt.go
        tags: [auth, rotation, fleet]
      - id: upgrade-loom-across-nodes
        title: Roll a loom upgrade across all nodes without dropping work
        persona: [platform-engineer]
        situation: A new loom release is out and I run loom on several hosts.
        outcome: Every node upgrades, no in-flight task is lost, and post-upgrade health is green.
        flow:
          - Drain one node with `loom daemon stop --drain` while others keep serving.
          - Upgrade the binary on that node (npm or curl install).
          - Restart and confirm `loom doctor` is green.
          - Move to the next node; repeat until the fleet is uniform.
        priority: should
        related_features: [features:install-script, features:npm-package, features:loom-local-service, features:loom-doctor, features:cooperative-drain-yield]
        source: scripts/install.sh
        tags: [upgrade, fleet, lifecycle]
      - id: configure-external-redis
        title: Switch loom from embedded miniredis to external Redis
        persona: [platform-engineer]
        situation: I need durable, shared state across nodes; the embedded miniredis isn't enough.
        outcome: All workspaces use the external Redis; terminal state and fleet coordination survive restarts.
        flow:
          - Provision an external Redis (optionally with TLS).
          - Start `loom serve --redis-addr rediss://...` on each node.
          - Verify `loom doctor` reports the external backend.
          - Migrate or accept warm-cache loss on the first deploy.
        priority: should
        related_features: [features:external-redis-support, features:fleet-db-http-backend, features:loom-serve, features:loom-doctor]
        source: internal/cli/serve/serve.go
        tags: [storage, redis, fleet]
      - id: debug-jwt-failure
        title: Debug a 401 from a fleet worker
        persona: [platform-engineer]
        situation: A `loom serve worker` keeps getting 401s when calling claim.
        outcome: I identify the bad token, clock skew, or kid mismatch and the worker reconnects.
        flow:
          - Inspect the worker log — read the JWT validation error.
          - Confirm system clocks are within tolerance across nodes.
          - Check the JWKS endpoint exposes the current `kid`.
          - Re-issue a token or restart the worker; metrics show claims succeeding.
        priority: should
        related_features: [features:fleet-jwt-rs256, features:standalone-betterauth-service, features:auth-proxy, features:health-doctor-api]
        source: internal/webui/fleet/jwt.go
        tags: [auth, debugging, fleet]

  - id: administration
    name: Administration & Configuration
    summary: Workspace, role, and agent-def lifecycle plus per-workspace tuning.
    stories:
      - id: define-role-from-prompt-file
        title: Define a custom agent role from a prompt file
        persona: [solo-dev, team-lead]
        situation: I want a "reviewer" role that uses a specific prompt and a smaller model.
        outcome: A new role is registered and selectable when creating agents.
        flow:
          - Write the prompt as `roles/reviewer.md`.
          - Run `loom role add reviewer --prompt-file roles/reviewer.md --model claude-haiku --backend claude --read-only`.
          - Confirm with `loom role show reviewer`.
          - Create an agent with `--role reviewer` and run it.
        priority: should
        related_features: [features:loom-role, features:loom-agentdef, features:backend-capabilities]
        source: internal/cli/role/role_cmd.go
        tags: [config, roles, admin]
      - id: agentdef-lifecycle
        title: Manage an agent definition through its lifecycle
        persona: [team-lead, platform-engineer]
        situation: I need to add, pause, and eventually remove a long-running auto-mode agent.
        outcome: The agent def is created, started, paused for maintenance, then cleanly removed.
        flow:
          - Run `loom agentdef add bot1 --role task --backend claude --auto`.
          - Start it — daemon supervises and the agent appears in the rail.
          - Run `loom agentdef stop bot1` for a planned pause; supervisor drains it.
          - Run `loom agentdef remove bot1` once obsolete; lock files and state are cleaned.
        priority: should
        related_features: [features:loom-agentdef, features:loom-daemon, features:cooperative-drain-yield, features:loom-recover]
