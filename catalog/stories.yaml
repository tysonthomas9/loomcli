      - id: tune-daemon-profile
        title: Tune the daemon profile for a workspace
        persona: [platform-engineer, team-lead]
        situation: My workspace is hitting concurrency limits and I need to raise them.
        outcome: New limits are persisted and the daemon picks them up on next reconcile.
        flow:
          - Run `loom daemon profile show` to see current settings.
          - Run `loom daemon profile set max-agents 8 default-backend claude`.
          - Daemon reconciler reads the new profile and adjusts.
          - Verify with `loom daemon status` and Monitor.
        priority: should
        related_features: [features:loom-daemon-profile, features:loom-daemon, features:loom-daemon, features:daemon-status-api]
        source: internal/cli/daemon/profile_cmd.go
        tags: [admin, daemon, tuning]
      - id: purge-old-sessions
        title: Reclaim disk by purging old sessions and usage data
        persona: [platform-engineer, solo-dev]
        situation: Sessions and usage tables have grown large after months of running.
        outcome: Old data is removed within configurable retention windows; disk shrinks.
        flow:
          - Run `loom cleanup --sessions-older-than 30d --usage-older-than 90d --dry-run`.
          - Inspect the dry-run summary.
          - Re-run without `--dry-run` to apply.
          - Optionally automate via cron or systemd timer.
        priority: could
        related_features: [features:loom-cleanup, features:loom-sessions-clean, features:session-purge, features:usage-tracking]
