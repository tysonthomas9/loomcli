        tags: [dogfood, validation, cli]
      - id: validate-container-runner
        title: Validate the container runner produces the same artifacts as a local run
        persona: [dogfood-operator]
        situation: I want to confirm the dockerized runner behaves the same as a host-side agent.
        outcome: Same diff, transcript, and session shape from a container run as from a local run.
        flow:
          - Run the local-only baseline against a seeded issue.
          - Capture diff stats, transcript line count, and session metadata.
          - Re-run the same issue inside `Dockerfile.dev` with the container runner.
          - Diff the two artifact sets — should match byte-for-byte (modulo timestamps).
        priority: should
        related_features: [features:dev-container, features:dev-compose-stack, features:session-history, features:native-session-transcripts]
        source: docs/product/container-runner-mvp-spec.md
        tags: [dogfood, container, parity]
      - id: validate-transcripts-persist
        title: Validate session transcripts survive a server restart
        persona: [dogfood-operator]
        situation: I want to verify that closing and restarting `loom serve` doesn't lose history.
        outcome: After restart, every prior session is still readable with its full transcript.
        flow:
          - Run a planner and a coder against the same issue.
          - Stop `loom serve`, wait, then restart.
          - Open the issue's Sessions tab.
          - Both sessions appear with intact transcript and scrollback.
        priority: must
        related_features: [features:session-history, features:native-session-transcripts, features:native-session-transcripts, features:session-history-transcripts-api]
        source: docs/product/session-artifact-contract.md
        tags: [dogfood, sessions, persistence]
      - id: validate-epic-runner-e2e
        title: Validate the epic runner drains a multi-task epic
        persona: [dogfood-operator]
        situation: I need to confirm `loom epic run` spawns the right number of workers and closes all tasks.
        outcome: All child tasks reach `closed`, workers exit cleanly, and the epic itself closes.
        flow:
          - Seed an epic with N approved child tasks.
          - Run `loom epic run --parent <epic> --max-concurrency K`.
          - Observe at most K workers running at once via Monitor.
          - All N tasks close; orchestrator exits with code 0.
        priority: must
        related_features: [features:loom-epic-run, features:ephemeral-epic-workers, features:loom-daemon, features:loom-daemon, features:monitor-dashboard-api]
        source: docs/product/lead-agent-epic-runner-spec.md
        tags: [dogfood, epic, orchestration]
      - id: validate-fleet-claim-contention
        title: Validate two workers don't double-claim the same task
        persona: [dogfood-operator]
        situation: I'm running two `loom serve worker` processes against the same control plane.
        outcome: Each ready task is claimed by exactly one worker; metrics confirm zero double-claims.
        flow:
          - Start two workers pointing at the same fleet endpoint.
          - Seed K ready tasks on the control plane.
          - Watch the fleet claim metric and worker logs.
          - Verify each task ID appears in exactly one worker's session history.
        priority: must
        related_features: [features:fleet-claim-done-heartbeat-api, features:loom-serve-worker, features:loom-daemon, features:fleet-metrics, features:fleet-jwt-rs256]
        source: internal/webui/fleet
        tags: [dogfood, fleet, contention]
      - id: validate-auth-token-rotation
        title: Validate fleet JWT rotation without dropping in-flight tasks
        persona: [dogfood-operator]
        situation: I'm about to rotate the fleet signing key in production-like staging.
        outcome: Workers refresh their tokens and existing claims complete; no run is orphaned.
        flow:
          - Start one worker and one in-flight task.
          - Rotate the JWT signing key (issue a new kid).
          - Watch the worker re-authenticate within the heartbeat interval.
          - In-flight task completes; new tasks pick up the new signing kid.
        priority: should
        related_features: [features:fleet-jwt-rs256, features:auth-proxy, features:standalone-betterauth-service, features:loom-serve-worker]
        source: internal/webui/fleet/jwt.go
        tags: [dogfood, auth, rotation]

