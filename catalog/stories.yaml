        persona: [platform-engineer]
        situation: A request feels slow and I want to see where the time went.
        outcome: I get a distributed trace across the CLI, daemon, and HTTP server in my OTel backend.
        flow:
          - Set `OTEL_EXPORTER_OTLP_ENDPOINT` and `LOOM_TRACE=1`.
          - Reproduce the slow operation.
          - Open the OTel UI — trace spans the CLI, daemon, and HTTP server.
          - Identify the slow span.
