        outcome: Go gate + frontend gate + integration tests all pass with 60% coverage.
        flow:
          - Run `make check` (or `make gate`).
          - Format, vet, build, lint, LOC, package size, import fanout.
          - Frontend gate runs typecheck, eslint, and unit tests.
          - Integration tests run with the e2e tag.
