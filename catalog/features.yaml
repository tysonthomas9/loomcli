      - name: Activity log & comments
        id: activity-log-comments
        purpose: Timeline of issue events plus a markdown comment form.
        source: internal/webui/frontend/src/components/IssueDetailPanel
        tags: [issues, comments, activity]
      - name: Session history
        id: session-history
        purpose: Per-issue linked terminal sessions with phase, duration, and status.
        source: internal/webui/sessionhistory
        tags: [sessions, history]
      - name: File editor panel
        id: file-editor-panel
        purpose: CodeMirror-based viewer/editor with syntax highlighting and open-in-editor links.
        source: internal/webui/frontend/src/components/FileEditorPanel
        tags: [files, editor]
      - name: Onboarding flow
        id: onboarding-flow
        epic: epics:web-onboarding
        purpose: Step-by-step wizard — create workspace, attach repo, configure backend, first task.
        source: internal/webui/frontend/src/components/OnboardingFlow
        tags: [onboarding, wizard]
      - name: Theme system (light/dark)
        id: theme-system-light-dark
        purpose: System-aware light/dark theme with persistent toggle.
        source: internal/webui/frontend/src/components/ThemeToggle
        tags: [theme, ui]
      - name: Keyboard cheatsheet
        id: keyboard-cheatsheet
        purpose: Help overlay (press `?`) listing all keyboard shortcuts.
        source: internal/webui/frontend/src/components/KeyboardCheatsheet
        tags: [keyboard, a11y]
      - name: Auth gate & login
        id: auth-gate-login
        purpose: OIDC/OAuth gate with deep-link preservation and CLI auth proxy.
        source: internal/webui/frontend/src/components/AuthGate
        tags: [auth, oidc]
      - name: Workspace switcher
        id: workspace-switcher
        purpose: Dropdown to switch between or create workspaces, scoped to the URL.
        source: internal/webui/frontend/src/components/WorkspaceSwitcher
        tags: [workspace, navigation]
      - name: Stale data banner
        id: stale-data-banner
        epic: epics:real-time-ui
        purpose: Warning shown when disconnected from SSE with manual retry.
        source: internal/webui/frontend/src/components/StaleDataBanner
        tags: [real-time, resilience]
      - name: Approve / reject review flow
        id: approve-reject-review-flow
        purpose: Reviewer workflow with required reject comments for review-type issues.
        source: internal/webui/frontend/src/components/IssueDetailPanel
        tags: [review, workflow]
      - name: Usage dashboard
        id: usage-dashboard
        purpose: Token, cost, and session breakdown by agent, backend, and day for the Observability tab.
        source: internal/webui/frontend/src/components/UsageDashboard
        tags: [observability, usage, dashboard]
      - name: Monitor dashboard panels
        id: monitor-dashboard-panels
        purpose: Project-health, agent-activity, and blocking-dependencies canvases composed inside MonitorPage.
        source: internal/webui/frontend/src/components/MonitorDashboard
        tags: [monitor, dashboard, real-time]
      - name: Task drawer
        id: task-drawer
        purpose: Side drawer surfaces task detail, logs, sessions, and quick actions over any view.
        source: internal/webui/frontend/src/components/TaskDrawer
