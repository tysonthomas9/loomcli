      - name: Agent work panel
        id: agent-work-panel
        purpose: Live work view for a single agent — current task, status, and recent activity.
        source: internal/webui/frontend/src/components/AgentWorkPanel
        tags: [ui, agents]
      - name: Workspace unavailable overlay
        id: workspace-unavailable-overlay
        purpose: Full-screen overlay shown when the active workspace's runtime is down or draining.
        source: internal/webui/frontend/src/components/WorkspaceUnavailableOverlay
        tags: [ui, resilience, workspace]
      - name: Create-* modals
        id: create-modals
        epic: epics:web-onboarding
        purpose: Modal dialogs for creating issues, workspaces, and agents with validation.
        source: internal/webui/frontend/src/components/CreateIssueModal
        tags: [ui, modals]

  - id: server-api
    name: Server — HTTP API
    summary: REST endpoints exposed by `loom serve`. See api/openapi.yaml.
    features:
      - name: Issues API
        id: issues-api
        purpose: CRUD + close/reopen/claim/move/search over workspace issues.
        source: internal/webui/handlers/issues
        endpoints:
          - GET /api/workspaces/{ws}/issues
          - POST /api/workspaces/{ws}/issues
          - PATCH /api/workspaces/{ws}/issues/:id
          - DELETE /api/workspaces/{ws}/issues/:id
          - POST /api/workspaces/{ws}/issues/:id/close
          - POST /api/workspaces/{ws}/issues/:id/reopen
          - POST /api/workspaces/{ws}/issues/:id/claim
          - POST /api/workspaces/{ws}/issues/:id/move
          - GET /api/workspaces/{ws}/issues/search
        tags: [api, issues]
      - name: Comments & events API
        id: comments-events-api
        purpose: List/add comments and read issue event history.
        source: internal/webui/handlers/issues
        endpoints:
          - GET /api/workspaces/{ws}/issues/:id/comments
          - POST /api/workspaces/{ws}/issues/:id/comments
          - GET /api/workspaces/{ws}/issues/:id/events
        tags: [api, comments, activity]
      - name: Dependencies API
        id: dependencies-api
        purpose: List/add/remove issue dependency edges with type metadata.
        source: internal/webui/handlers/issues
        endpoints:
          - GET /api/workspaces/{ws}/issues/:id/dependencies
          - POST /api/workspaces/{ws}/issues/:id/dependencies
          - DELETE /api/workspaces/{ws}/issues/:id/dependencies/:depId
        tags: [api, dependencies]
      - name: Agents API
        id: agents-api
        purpose: Create / list / update / delete agents within a workspace.
        source: internal/webui/handlers/agents
        endpoints:
          - GET /api/workspaces/{ws}/agents
          - POST /api/workspaces/{ws}/agents
          - PATCH /api/workspaces/{ws}/agents/:name
          - DELETE /api/workspaces/{ws}/agents/:name
        tags: [api, agents]
      - name: Agent control API
        id: agent-control-api
        purpose: Start / stop / pause agents and send terminal input.
        source: internal/webui/handlers/agentcontrol
        endpoints:
          - POST /api/workspaces/{ws}/agents/:name/control/run
          - POST /api/workspaces/{ws}/agents/:name/control/stop
          - POST /api/workspaces/{ws}/agents/:name/control/pause
          - POST /api/workspaces/{ws}/agents/:name/input
        tags: [api, agents, control]
      - name: Workspace API
        id: workspace-api
        purpose: Workspace CRUD, default lookup, repo reordering, background jobs.
        source: internal/webui/handlers/workspace
        endpoints:
          - GET /api/workspaces
          - POST /api/workspaces
          - GET /api/workspaces/default
          - GET /api/workspaces/{ws}
          - PATCH /api/workspaces/{ws}
          - DELETE /api/workspaces/{ws}
          - POST /api/workspaces/{ws}/reorder
          - GET /api/workspaces/{ws}/jobs
        tags: [api, workspace]
      - name: Git API
        id: git-api
        purpose: Diff, diff-stats, blocked list, and dependency graph for visualizations.
        source: internal/webui/handlers/git
        endpoints:
          - GET /api/workspaces/{ws}/git/diff/:issueId
          - GET /api/workspaces/{ws}/git/diff-stat/:issueId
          - GET /api/workspaces/{ws}/git/blocked
