meta:
  app: loom
  tagline: Agent management CLI for parallel AI coding workflows backed by fleet-db.
  description: >
    Run multiple AI agents in parallel across git worktrees. Each agent works
    independently on its own branch, picks tasks from a shared issue tracker,
    and integrates back through a structured push/pull/sync workflow.
  repository: https://github.com/tysonthomas9/loomcli
  license: MIT
  generated: 2026-05-14
  generated_by: feature-cataloger
  refs_in:  [stories, epics]
  refs_out: [glossary]

categories:
  - id: cli-agents
    name: CLI — Agent Commands
    summary: Run, supervise, and recover AI coding agents from the terminal.
    features:
      - name: loom plan
        id: loom-plan
        purpose: Run a planning agent that researches tasks and produces designs for review.
        source: internal/cli/agent/plan.go
        flags: ["--auto/-a", "--interval/-i", "--max-tasks/-m", "--idle-timeout/-t", "--parent"]
        tags: [agent, planning, auto-mode]
      - name: loom task
        id: loom-task
        purpose: Run an implementation agent that builds approved designs.
        source: internal/cli/agent/task.go
        flags: ["--auto/-a", "--interval/-i", "--max-tasks/-m", "--idle-timeout/-t", "--parent"]
        tags: [agent, implementation, auto-mode]
      - name: loom lead
        id: loom-lead
        epic: epics:lead-driven-orchestration
        purpose: Interactive AI project management — review plans, triage the backlog.
        source: internal/cli/agent/lead.go
        flags: ["--message"]
        tags: [agent, interactive, triage]
      - name: loom agent
        id: loom-agent
        purpose: Run a custom agent with a user-defined prompt template.
        source: internal/cli/agent/agent_cmd.go
        flags: ["--prompt/-p", "--task-filter/-f", "--auto/-a", "--interval", "--max-tasks", "--idle-timeout", "--parent"]
        tags: [agent, custom, prompts]
      - name: loom monitor
        id: loom-monitor
        purpose: Live terminal dashboard for agent status and task progress.
        source: internal/cli/monitor/monitor.go
        flags: ["--branch/-b", "--no-watch/-n", "--interval/-i"]
        aliases: [mon, status]
        tags: [observability, dashboard, tui]
      - name: loom list
        id: loom-list
        purpose: List all agents (worktrees) and their status grouped by workspace.
        source: internal/cli/agent/list.go
        aliases: [ls]
        tags: [agents, inventory]
      - name: loom recover
        id: loom-recover
        epic: epics:failure-modes-recovery
        purpose: Recover an agent worktree from an error state — clears locks, analyzes orphans.
        source: internal/cli/agent/recover.go
        flags: ["--no-analyze", "--force"]
        tags: [agent, recovery, locks]
      - name: loom complete
        id: loom-complete
        purpose: Internal signal command — agents call it to mark task completion to auto mode.
        source: internal/cli/agent/complete.go
        tags: [agent, internal]
      - name: loom daemon
        id: loom-daemon
        purpose: Supervise multiple agents with auto-restart, queue management, and lifecycle control.
        source: internal/cli/daemon/daemon_cmd.go
        subcommands: [status, stop, start, restart, queue, logs, profile]
        flags: ["--dry-run"]
        tags: [daemon, supervisor, multi-agent]
      - name: loom daemon profile
        id: loom-daemon-profile
        purpose: View and configure the workspace's daemon profile (max agents, paths, backend, etc.).
        source: internal/cli/daemon/profile_cmd.go
        subcommands: [show, set, unset]
        tags: [daemon, config]
      - name: loom epic run
        id: loom-epic-run
        epic: epics:lead-driven-orchestration
        purpose: Reconcile loop that drains an epic by spawning ephemeral workers for ready child tasks.
        source: internal/cli/epic/run.go
        flags: ["--parent", "--max-concurrency", "--worker-prefix", "--interval-seconds", "--role", "--node-id", "--lead", "--dry-run"]
        tags: [epic, orchestration, fan-out]

  - id: cli-git
    name: CLI — Git Operations
    summary: Branch management with AI-assisted conflict resolution across worktrees.
    features:
      - name: loom push
        id: loom-push
        purpose: Push worktree branch to a target with AI-driven merge conflict resolution.
        source: internal/cli/git/push.go
        aliases: [merge]
        flags: ["--all/-a", "--workspace/-W"]
        tags: [git, merge, ai-conflict]
      - name: loom pull
        id: loom-pull
        purpose: Pull an integration branch into worktree(s) with AI conflict resolution.
        source: internal/cli/git/pull.go
        flags: ["--all/-a", "--workspace/-W"]
        tags: [git, pull, ai-conflict]
      - name: loom sync
        id: loom-sync
        purpose: Full sync — push all completed work, then pull latest into all worktrees.
        source: internal/cli/git/sync.go
        flags: ["--push-only", "--pull-only", "--workspace/-W"]
        tags: [git, sync, batch]
      - name: loom pr
        id: loom-pr
        purpose: Create a GitHub pull request from a worktree branch.
        source: internal/cli/git/pr.go
        flags: ["--all/-a", "--workspace/-W"]
        tags: [git, github, pr]
      - name: loom reset
        id: loom-reset
        purpose: Hard reset a worktree to a specific branch — discards local changes.
        source: internal/cli/git/reset.go
        flags: ["--all/-a", "--push/-p", "--force/-f"]
        tags: [git, reset, destructive]
      - name: AI conflict resolution
        id: ai-conflict-resolution
        purpose: Spawn a Claude agent during push/pull conflicts to resolve markers automatically.
        source: internal/cli/git/conflict_resolution.go
        tags: [git, ai, merge]

  - id: cli-config
    name: CLI — Configuration
    summary: Workspaces, repos, roles, agent definitions, and onboarding.
    features:
      - name: loom workspace
        id: loom-workspace
        purpose: Create / list / remove workspaces — the unit of isolation for repos and agents.
        source: internal/cli/workspace/workspace_cmd.go
        subcommands: [create, list, remove]
        flags: ["--repos", "--path", "--branch", "--force", "--keep-worktrees", "--json"]
        tags: [config, workspace]
      - name: loom repo
        id: loom-repo
        purpose: Register repos inside a workspace (URL, remote, default branch, groups).
        source: internal/cli/repo/repo_cmd.go
        subcommands: [add, list, show, remove]
        flags: ["--remote", "--branch", "--groups", "--source-repo-id", "--json"]
        tags: [config, git, repos]
      - name: loom role
        id: loom-role
        purpose: Define agent roles — prompts, models, backends, skills, tool allowlists.
        source: internal/cli/role/role_cmd.go
        subcommands: [add, list, show, remove, set, unset]
        flags: ["--description", "--prompt-file", "--model", "--backend", "--skills", "--max-concurrency", "--read-only"]
        tags: [config, roles, prompts]
      - name: loom agentdef
        id: loom-agentdef
        purpose: Bind a role + repo(s) to a named agent definition that the daemon can run.
        source: internal/cli/agentdef/agentdef_cmd.go
        subcommands: [add, list, show, remove, start, stop]
        flags: ["--role", "--auto", "--backend", "--repos", "--repo-groups", "--cross-repo", "--parent", "--mode", "--task-filter", "--max-concurrency", "--budget", "--task", "--orchestrator"]
        tags: [config, agents]
      - name: loom init
        id: loom-init
        purpose: Guided setup wizard — creates a workspace and initial worktrees.
        source: internal/cli/workspace/init.go
        flags: ["--yes/-y", "--worktrees-dir", "--names", "--workspace"]
        tags: [onboarding, wizard]
      - name: loom workspace (fleet-db)
        id: loom-workspace-fleet-db
        purpose: Fleet-db-backed workspace management — add, switch, show, and inspect lifecycle state.
        source: internal/cli/workspace/workspacev2_cmd.go
        subcommands: [add, use, show, status]
        tags: [config, workspace, fleet-db]
      - name: loom workspace ops
        id: loom-workspace-ops
        purpose: Agent-safe runtime operations — status, diagnose, and ensure-runtime for the local workspace daemon.
        source: internal/cli/workspace/ops_cmd.go
        subcommands: [status, diagnose, ensure-runtime]
        tags: [config, workspace, diagnostics]
      - name: loom cleanup
        id: loom-cleanup
        purpose: Purge old session, usage, and event data with per-store retention windows.
        source: internal/cli/cleanup/cleanup_cmd.go
        flags: ["--sessions-older-than", "--usage-older-than", "--events-older-than", "--dry-run"]
        tags: [cleanup, retention, maintenance]
      - name: loom sessions clean
        id: loom-sessions-clean
        purpose: Remove agent session directories older than a configurable retention window.
        source: internal/cli/cleanup/sessions_cmd.go
        subcommands: [clean]
        flags: ["--older-than"]
        tags: [cleanup, sessions]

  - id: cli-data
    name: CLI — Issue Data (HTTP backend)
    summary: Backend-aware CLI for working with issues via the server's API.
    features:
      - name: loom data create
        id: loom-data-create
        purpose: Create an issue from the CLI against a running server.
        source: internal/cli/data/create.go
        tags: [issues, api]
      - name: loom data show
        id: loom-data-show
        purpose: Show a single issue's details.
        source: internal/cli/data/doc.go
        tags: [issues, api]
      - name: loom data list
        id: loom-data-list
        purpose: List issues with optional filters.
        source: internal/cli/data/list.go
        tags: [issues, api]
      - name: loom data ready
        id: loom-data-ready
        purpose: List ready (unblocked) tasks.
        source: internal/cli/data/blocked.go
        flags: ["--limit"]
        tags: [issues, planning]
      - name: loom data blocked
        id: loom-data-blocked
        purpose: List blocked tasks and their blockers.
        source: internal/cli/data/blocked.go
        tags: [issues, dependencies]
      - name: loom data claim
        id: loom-data-claim
        purpose: Claim an issue (mark as in-progress with owner).
        source: internal/cli/data/claim.go
        tags: [issues, workflow]
      - name: loom data update
        id: loom-data-update
        purpose: Patch issue fields.
        source: internal/cli/data/close.go
        tags: [issues, api]
      - name: loom data close
        id: loom-data-close
        purpose: Close an issue with reason.
        source: internal/cli/data/close.go
        tags: [issues, workflow]
      - name: loom data comment
        id: loom-data-comment
        purpose: Add a comment to an issue.
        source: internal/cli/data/comment.go
        tags: [issues, comments]
      - name: loom data monitor
        id: loom-data-monitor
        purpose: Monitor an issue backend from the CLI (non-TUI).
        source: internal/cli/data/monitor.go
        tags: [issues, observability]
      - name: loom data agents
        id: loom-data-agents
        purpose: List agents managed by the loom daemon over HTTP.
        source: internal/cli/data/agents.go
        tags: [agents, api]
      - name: loom data agent
        id: loom-data-agent
        purpose: Send agent control commands (start, stop, restart, yield) over HTTP.
        source: internal/cli/data/agentctl.go
        subcommands: [start, stop, restart, yield]
        tags: [agents, control]

  - id: cli-server
    name: CLI — Server & Service
    summary: Start the web UI, HTTP API, and worker/log-router subprocesses.
    features:
      - name: loom serve
        id: loom-serve
        purpose: Start the HTTP API + SSE/WebSocket server and embedded web UI.
        source: internal/cli/serve/serve.go
        flags: ["--port", "--bind", "--cors-origin", "--frontend-url", "--redis-addr", "--redis-password", "--fleet-mode", "--auth-url", "--auth-issuer", "--auth-audience", "--auth-allow-insecure", "--no-daemon", "--hsts", "--sentry-dsn"]
        tags: [server, web-ui, api]
      - name: loom serve install-service
        id: loom-serve-install-service
        purpose: Generate or install a platform-native service (systemd/launchd).
        source: internal/cli/serve/install/install_service_cmd.go
        flags: ["--install", "--uninstall", "--name", "--port", "--bind", "--env"]
        tags: [service, systemd, launchd]
      - name: loom serve worker
        id: loom-serve-worker
        epic: epics:container-runners
        purpose: Run a remote agent worker that connects back to a control plane.
        source: internal/cli/serve/worker/worker_cmd.go
        hidden: true
        flags: ["--control-plane", "--workspace", "--agent", "--backend", "--interval", "--max-tasks", "--idle-timeout"]
        tags: [worker, remote, fleet]
      - name: loom serve log-router
        id: loom-serve-log-router
        purpose: Internal subprocess — routes stdin to agent/task log files with rotation.
        source: internal/cli/serve/logroutercmd/logrouter_cmd.go
        hidden: true
        flags: ["--agent", "--base-dir", "--lock-path", "--max-log-size", "--workspace-id"]
        tags: [internal, logs]
      - name: loom local (service)
        id: loom-local-service
        epic: epics:local-first
        purpose: Manage the local desktop runtime service (foreground, background, install, drain).
        source: internal/cli/local/local_cmd.go
        subcommands: [service, start, status, stop, restart, install-service, uninstall-service, drain]
        tags: [desktop, daemon, lifecycle]
      - name: loom doctor
        id: loom-doctor
        epic: epics:failure-modes-recovery
        purpose: Health check — diagnoses installation, tmux, redis, fleetdb, and config issues.
        source: internal/cli/doctor/doctor.go
        flags: ["--json", "--fix"]
        tags: [diagnostics, health]
      - name: loom hooks
        id: loom-hooks
        purpose: Hidden lifecycle hooks for backend integrations and daemon-level task gating.
        source: internal/cli/hooks/hooks_cmd.go
        hidden: true
        subcommands: [claude-code, session-start, user-prompt-submit, stop, pre-task, post-task, yield-guard, session-end, install, uninstall, status]
        tags: [hooks, integration]

  - id: webui-views
    name: Web UI — Views
    summary: Pages exposed by the React frontend served from `loom serve`.
    features:
      - name: Kanban board
        id: kanban-board
        purpose: Drag-and-drop swim-lane view grouped by status, priority, epic, assignee, repo, or label.
        source: internal/webui/frontend/src/views/KanbanPage.tsx
        tags: [view, kanban, drag-and-drop]
      - name: Table view
        id: table-view
        purpose: Sortable issue list with bulk actions, virtualization, and inline editing.
        source: internal/webui/frontend/src/views/TablePage.tsx
        tags: [view, table, bulk]
      - name: Graph view
        id: graph-view
        purpose: React Flow dependency graph with filters by status and edge type.
        source: internal/webui/frontend/src/views/GraphPage.tsx
        tags: [view, graph, dependencies]
      - name: Monitor dashboard
        id: monitor-dashboard
        purpose: Multi-agent operator view with project health, agent activity, and usage panels.
        source: internal/webui/frontend/src/views/MonitorPage.tsx
        tags: [view, monitoring, agents]
      - name: Observability dashboard
        id: observability-dashboard
        purpose: Trace analytics, error rates, and latency by endpoint and agent.
        source: internal/webui/frontend/src/views/ObservabilityPage.tsx
        tags: [view, observability, tracing]
      - name: Settings
        id: settings
        purpose: Backend configuration, per-agent backend overrides, terminal fonts, Redis, onboarding restart.
        source: internal/webui/frontend/src/views/SettingsPage.tsx
        tags: [view, settings]
      - name: Files
        id: files
        purpose: Tree-style file explorer for an agent's worktree with CodeMirror viewer.
        source: internal/webui/frontend/src/views/FilesPage.tsx
        tags: [view, files, editor]
      - name: Workspace overview
        id: workspace-overview
        purpose: Multi-repo workspace topology — repos, groups, agents.
        source: internal/webui/frontend/src/views/WorkspacePage.tsx
        tags: [view, workspace, multi-repo]
      - name: Issue detail page
        id: issue-detail-page
        purpose: Full-page issue view — markdown editor, design, dependencies, activity, sessions.
        source: internal/webui/frontend/src/views/IssueDetailPage.tsx
        tags: [view, issues]
      - name: Agents page
        id: agents-page
        purpose: Agent rail + embedded terminal + work panel — switch agents via URL.
        source: internal/webui/frontend/src/views/AgentsPage.tsx
        tags: [view, agents, terminal]

  - id: webui-features
    name: Web UI — Capabilities
    summary: Cross-cutting browser features layered on top of the views.
    features:
      - name: Talk to Lead terminal
        id: talk-to-lead-terminal
        epic: epics:lead-driven-orchestration
        purpose: Built-in terminal running `loom lead` over wterm + tmux via WebSocket.
        source: internal/webui/frontend/src/components/TalkToLeadButton
        tags: [terminal, ai, lead]
      - name: Per-agent embedded terminals
        id: per-agent-embedded-terminals
        epic: epics:real-time-ui
        purpose: Multi-tab xterm.js terminals attached to live agent tmux sessions.
        source: internal/webui/terminal/agent_tmux.go
        tags: [terminal, multiplex, tmux]
      - name: Real-time SSE mutations
        id: real-time-sse-mutations
        epic: epics:real-time-ui
        purpose: Server-Sent Events push issue/agent/dependency/comment mutations to all clients.
        source: internal/webui/server/realtime/hub.go
        tags: [real-time, sse]
      - name: Full-text issue search
        id: full-text-issue-search
        purpose: Cmd/Ctrl+K-driven workspace search with scope indicator and result highlighting.
        source: internal/webui/frontend/src/components/search
        tags: [search, keyboard]
      - name: Bulk action toolbar
        id: bulk-action-toolbar
        purpose: Batch status updates and label edits on selected issues in the table view.
        source: internal/webui/frontend/src/components/BulkActionToolbar
        tags: [bulk, table]
      - name: Dependency editor
        id: dependency-editor
        purpose: Add and remove dependency edges with type (blocks, parent-of, related, etc.).
