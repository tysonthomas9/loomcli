name: epic-agent
description: Plan, review, and implement a single task from an epic

shared_context_file: task-details.txt

eval_loop:
  gate: verify
  fix_steps:
    - fix
  max_passes: 3

steps:
  - id: select-task
    type: shell
    command: |
      set -euo pipefail
      EPIC_ID="${EPIC_ID:?EPIC_ID environment variable is required}"
      BD_DIR="${BD_ROOT:-$(pwd)}"

      if [ -n "${TASK_ID:-}" ]; then
        echo "==> Pre-assigned task: $TASK_ID"
        (cd "$BD_DIR" && bd update "$TASK_ID" --claim) || {
          echo "Claim failed for $TASK_ID"
          echo "EXIT_CODE=1"
          exit 0
        }
      else
        echo "==> Selecting task from epic: $EPIC_ID"
        (cd "$BD_DIR" && bd ready --parent "$EPIC_ID" --limit 50 --json) > .bd-ready.json 2>/dev/null || {
          echo "ERROR: bd ready failed"
          rm -f .bd-ready.json
          echo "EXIT_CODE=1"
          exit 0
        }
        TASK_LINE=$(jq -r '
          .[]
          | select(.status == "open")
          | select((.issue_type == "epic") | not)
          | select(.design == null or .design == "")
          | select(((.labels // []) | index("needs-revision")) | not)
          | "\(.priority // 4) \(.id) \(.title)"
        ' .bd-ready.json | sort -n | head -1)
        if [ -z "$TASK_LINE" ]; then
          TASK_LINE=$(jq -r '
            .[]
            | select(.status == "open")
            | select((.issue_type == "epic") | not)
            | select(.design != null and .design != "")
            | select(((.labels // []) | index("needs-revision")) | not)
            | "\(.priority // 4) \(.id) \(.title)"
          ' .bd-ready.json | sort -n | head -1)
        fi
        rm -f .bd-ready.json
        if [ -z "$TASK_LINE" ]; then
          echo "No tasks available in epic $EPIC_ID"
          echo "EXIT_CODE=1"
          exit 0
        fi
        TASK_ID=$(echo "$TASK_LINE" | awk '{print $2}')
        echo "==> Claiming task: $TASK_ID"
        (cd "$BD_DIR" && bd update "$TASK_ID" --claim) || {
          echo "Claim failed (race condition)"
          echo "EXIT_CODE=1"
          exit 0
        }
      fi

      echo "==> Writing task-details.txt"
      (cd "$BD_DIR" && bd show "$TASK_ID" --json) > .bd-show.json 2>/dev/null || echo "[{}]" > .bd-show.json
      TASK_TITLE=$(jq -r '.[0].title // "unknown"' .bd-show.json 2>/dev/null || echo "unknown")
      TASK_DESIGN=$(jq -r '.[0].design // ""' .bd-show.json 2>/dev/null || echo "")
      TASK_NOTES=$(jq -r '.[0].notes // ""' .bd-show.json 2>/dev/null || echo "")
      TASK_LABELS=$(jq -r '(.[0].labels // []) | join(", ")' .bd-show.json 2>/dev/null || echo "")
      HAS_DESIGN="false"
      [ -n "$TASK_DESIGN" ] && HAS_DESIGN="true"
      {
        echo "# Task: $TASK_ID"
        echo "Epic: $EPIC_ID"
        echo "Title: $TASK_TITLE"
        echo "Labels: $TASK_LABELS"
        echo "Has Design: $HAS_DESIGN"
        echo ""
        echo "## Notes"
        echo "$TASK_NOTES"
        echo ""
        echo "## Design"
        echo "$TASK_DESIGN"
      } > task-details.txt
      rm -f .bd-show.json
      echo "Task $TASK_ID claimed. Has design: $HAS_DESIGN"
      echo "EXIT_CODE=0"
    goal_gate: true

  - id: plan
    type: prompt
    prompt: prompts/plan.md
    context: compact
    after:
      - select-task
    when: passed

  - id: review-plan
    type: prompt
    prompt: prompts/review-plan.md
    context: full
    goal_gate: true
    after:
      - plan
    when: passed

  - id: revise-plan
    type: prompt
    prompt: prompts/revise-plan.md
    context: full
    after:
      - review-plan
    when: failed
    retry: 2
    retry_check: review-plan

  - id: execute
    type: prompt
    prompt: prompts/execute.md
    context: truncate
    after:
      - review-plan
    when: passed

  - id: verify
    type: shell
    command: |
      echo "==> Running quality gate"
      make gate 2>&1
      EXIT_STATUS=$?
      echo "EXIT_CODE=$EXIT_STATUS"
    goal_gate: true
    after:
      - execute
    when: passed

  - id: fix
    type: prompt
    prompt: prompts/fix.md
    context: truncate
    after:
      - verify
    when: failed
