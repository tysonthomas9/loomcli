# docker-compose.test.yml — Test-specific compose for full-stack auth E2E.
# Uses SQLite (no PostgreSQL service needed), fake OAuth credentials,
# and short healthcheck intervals for fast startup.
#
# Usage:
#   docker compose -f services/auth/docker-compose.test.yml up --build -d
#   # Wait for healthy, run smoke tests, then:
#   docker compose -f services/auth/docker-compose.test.yml down -v
services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${AUTH_TEST_PORT:-3099}:3001"
    environment:
      - BETTER_AUTH_SECRET=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      - BETTER_AUTH_URL=http://localhost:${AUTH_TEST_PORT:-3099}
      - DATABASE_URL=file:/app/data/test.db
      - DATABASE_PROVIDER=sqlite
      - NODE_ENV=development
      - GITHUB_CLIENT_ID=test-github-client-id
      - GITHUB_CLIENT_SECRET=test-github-client-secret
      - GOOGLE_CLIENT_ID=test-google-client-id
      - GOOGLE_CLIENT_SECRET=test-google-client-secret
      - JWT_AUDIENCE=loom
      - TRUSTED_ORIGINS=http://localhost:${AUTH_TEST_PORT:-3099}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    tmpfs:
      - /app/data
