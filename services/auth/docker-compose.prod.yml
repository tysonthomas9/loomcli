# Production overlay — adds Caddy for automatic HTTPS.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires: AUTH_DOMAIN in .env, DNS A record, ports 80/443 open

services:
  auth:
    ports: !override
      - "127.0.0.1:3001:3001"
    expose:
      - "9090"

  caddy:
    # caddy:2-alpine as of 2026-03-27
    image: caddy:2-alpine@sha256:fce4f15aad23222c0ac78a1220adf63bae7b94355d5ea28eee53910624acedfa
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - AUTH_DOMAIN=${AUTH_DOMAIN:?Set AUTH_DOMAIN in .env}

volumes:
  caddy-data:
  caddy-config:
