# Production Docker Compose deployment for loom.
#
# Two services behind an nginx reverse proxy:
#   - server:   Go API on :8080 (internal only)
#   - frontend: nginx serving the static SPA + proxying /api/* to server
#
# Build context is the repo root (one level up from deploy/).
#
# Usage:
#   cd deploy && docker compose up --build
#   # Open http://localhost:8080

services:
  server:
    build:
      context: ../
      dockerfile: deploy/server/Dockerfile
    environment:
      LOOM_FRONTEND_URL: "http://localhost"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: deploy/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
