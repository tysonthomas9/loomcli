# Standard WebSocket upgrade map: sets Connection: upgrade only when
# the client sent an Upgrade header, otherwise empty. Prevents the hop-by-hop
# `Connection: upgrade` header from leaking onto plain HTTP API responses.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't cache index.html — it references hashed asset bundles.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SSE endpoints — disable buffering so EventSource sees events immediately.
    # Must precede the generic /api/ block.
    location ~ ^/api/.*/events$ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # API proxy — forwards /api/* to the Go server (WebSocket-capable).
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for /api/workspaces/{ws}/terminal/ws etc.
        # `$connection_upgrade` is empty for non-WS requests so plain JSON
        # API calls don't get a stray `Connection: upgrade` header.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Health check passthrough (used by docker-compose healthcheck).
    location = /health {
        proxy_pass http://server:8080/health;
    }

    # SPA fallback — any non-/api path that isn't a real file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
