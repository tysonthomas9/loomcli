name: Desktop Release

# Builds, signs (Developer ID), notarizes, staples, and uploads the "Loom Agents"
# macOS desktop app DMG to a GitHub release.
#
# Trigger by pushing a desktop-specific tag (kept separate from the CLI's `v*`
# GoReleaser tag), e.g.:
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_CERTIFICATE          base64 of a .p12 export of the Developer ID
#                              Application certificate (`base64 -i cert.p12`)
#   APPLE_CERTIFICATE_PASSWORD password used when exporting the .p12
#   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: Tyson Kuthur Thomas (BN879H59CY)"
#   APPLE_API_ISSUER           App Store Connect API key issuer id (UUID)
#   APPLE_API_KEY_ID           App Store Connect API key id
#   APPLE_API_KEY_P8           contents of the AuthKey_XXXX.p8 file
#   FLEET_DB_TOKEN             (optional) PAT/deploy token to checkout the
#                              private tysonthomas9/fleet-db repo; omit if public

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. desktop-v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  desktop:
    # macOS arm64 runner: produces an aarch64-apple-darwin build with valid
    # darwin signatures (matches the locally-built artifact).
    runs-on: macos-latest
    steps:
      - name: Checkout loomcli
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout fleet-db sidecar repo
        uses: actions/checkout@v4
        with:
          repository: tysonthomas9/fleet-db
          path: fleet-db
          token: ${{ secrets.FLEET_DB_TOKEN || github.token }}

      - name: Read pinned flue commit
        id: flue-pin
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < internal/workflows/FLUE_COMMIT)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: FLUE_COMMIT is not a 40-char hex SHA: '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned flue build toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FLUE_REPOSITORY || 'withastro/flue' }}
          ref: ${{ steps.flue-pin.outputs.sha }}
          path: flue

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Read pinned Node.js version
        id: node-pin
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < desktop/NODE_VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: invalid desktop/NODE_VERSION: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-pin.outputs.version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.1.1'

      - name: Build pinned flue toolchain
        run: cd flue && pnpm install --frozen-lockfile && pnpm --filter @flue/runtime --filter @flue/cli build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install web UI deps
        run: cd internal/webui/frontend && npm ci

      - name: Install desktop deps
        run: cd desktop && npm ci

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/asc"
          printf '%s' "$APPLE_API_KEY_P8" > "${RUNNER_TEMP}/asc/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/asc/AuthKey.p8"

      # prepare-sidecar signs the Node resource before Tauri's bundle-signing
      # phase. Import the certificate here rather than relying on tauri-action's
      # later internal import, otherwise the beforeBuildCommand cannot resolve
      # APPLE_SIGNING_IDENTITY.
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/loom-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="${RUNNER_TEMP}/loom-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" \
            | grep -F "$APPLE_SIGNING_IDENTITY"
          rm -f "$certificate"

      - name: Build, sign, notarize & release DMG
        uses: tauri-apps/tauri-action@v0
        env:
          # Sidecar build: point prepare-sidecar.sh at paired runtime inputs.
          FLEET_DB_REPO: ${{ github.workspace }}/fleet-db
          FLUE_REPO: ${{ github.workspace }}/flue
          # The preceding step imports the identity early enough for Node's
          # beforeBuildCommand signing; Tauri reuses that unlocked keychain.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization via App Store Connect API key.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Loom Agents ${{ github.event.inputs.tag || github.ref_name }} (Apple Silicon)'
          releaseBody: 'Signed + notarized macOS desktop app. Apple Silicon (arm64).'
          releaseDraft: true
          prerelease: false
          # tauri-action's beforeBuildCommand (prepare-sidecar) builds the Go
          # sidecars; this just selects the bundle targets.
          args: --bundles app,dmg

      - name: Verify signed packaged Node.js runtime
        run: |
          set -euo pipefail
          app="desktop/src-tauri/target/release/bundle/macos/Loom Agents.app"
          node="$app/Contents/Resources/runtime/node"
          test -x "$node"
          test -f "$app/Contents/Resources/licenses/node-LICENSE"
          test "$("$node" --version)" = "v${{ steps.node-pin.outputs.version }}"
          "$node" -e 'if (new Function("return 42")() !== 42) process.exit(1)'
          codesign --verify --strict --verbose=2 "$node"
          codesign -d --entitlements - "$node" 2>&1 | grep -q 'com.apple.security.cs.allow-jit'
          codesign --verify --deep --strict --verbose=2 "$app"
          node_team="$(codesign -dv --verbose=4 "$node" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')"
          app_team="$(codesign -dv --verbose=4 "$app" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')"
          test -n "$node_team"
          test "$node_team" = "$app_team"
