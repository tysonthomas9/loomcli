name: Playwright E2E

on:
  push:
    branches: [main, v5]
  # No branch filter: this repo's trunk moved to v5 and stacked PRs target each
  # other, so a base-branch allowlist silently skips almost every pull request.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Browser E2E Tests (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: internal/webui/frontend/package-lock.json

      - name: Install frontend deps
        run: cd internal/webui/frontend && npm ci

      - name: Install Chromium
        run: cd internal/webui/frontend && npx playwright install --with-deps chromium

      # The chromium project mocks every API route, so this job needs no loom
      # serve, no fleet-db checkout and no repository secret.
      - name: Run mocked browser E2E tests
        run: make test-e2e-ci
        env:
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-browser
          path: internal/webui/frontend/playwright-report/
          retention-days: 7

  # The API tier is NOT here, deliberately. It drives a real `loom serve` via
  # scripts/start-e2e-server.sh, which needs a sibling checkout of the private
  # BrowserOperator/fleet-db; this workflow never had a checkout step for it.
  # Because the trigger above was wrong, that never showed — the job had not
  # run since 2026-08-11. Fixing the trigger without removing it turned every
  # pull request red on:
  #
  #     [e2e] ERROR: fleet-db repo not found at ../../fleet-db
  #
  # Restoring it needs a FLEET_DB_REPO_TOKEN repository secret plus the
  # actions/checkout step nightly.yml already uses. Until then the real-stack
  # tiers stay manual: `make test-e2e-api` and `make test-e2e-real-smoke`.
