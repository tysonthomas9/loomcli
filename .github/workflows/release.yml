name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  skills-compatibility:
    name: Skills compatibility (FleetDB main)
    # Deliberately float with FleetDB main. Loom and FleetDB ship as one
    # compatibility pair, so a Loom release must prove itself against the
    # server revision operators will deploy with it rather than an old pin.
    uses: ./.github/workflows/skills-compatibility.yml
    with:
      loom_ref: ${{ github.sha }}
      fleetdb_ref: main
    secrets:
      LOOMCLI_TOKEN: ${{ secrets.LOOMCLI_TOKEN }}
      FLEET_DB_TOKEN: ${{ secrets.FLEET_DB_TOKEN }}
      GCS_TEST_BUCKET: ${{ secrets.GCS_TEST_BUCKET }}
      GCS_HMAC_ACCESS_KEY_ID: ${{ secrets.GCS_HMAC_ACCESS_KEY_ID }}
      GCS_HMAC_SECRET_ACCESS_KEY: ${{ secrets.GCS_HMAC_SECRET_ACCESS_KEY }}

  goreleaser:
    needs: skills-compatibility
    # macOS runner so darwin binaries get valid linker signatures.
    # Cross-compiled darwin binaries from Linux are SIGKILL'd by
    # Gatekeeper on macOS 13+ (golang/go#63584).
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: cd internal/webui/frontend && npm ci && npm run build

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
