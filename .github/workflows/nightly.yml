name: Nightly Full Tests

on:
  schedule:
    # Run at 2am UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@loomcli.test"

      - name: Build
        run: go build -v ./...

      - name: Full Test Suite (including integration tests)
        run: go test -v -race -tags=integration -coverprofile=coverage.out -timeout=30m ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          MIN_COVERAGE=50
          WARN_COVERAGE=55
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "Coverage is below ${MIN_COVERAGE}% threshold"
            exit 1
          elif (( $(echo "$COVERAGE < $WARN_COVERAGE" | bc -l) )); then
            echo "Coverage is below ${WARN_COVERAGE}% (warning threshold)"
          else
            echo "Coverage meets threshold"
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  e2e:
    name: E2E Container Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@loomcli.test"

      - name: E2E Container Tests
        run: go test -tags container -v -timeout 15m ./e2e/
