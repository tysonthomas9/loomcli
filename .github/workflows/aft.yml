name: aft e2e

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "aft mode (strict runs the Claude recovery agent on failures; needs ANTHROPIC_API_KEY secret)"
        type: choice
        default: no-agent
        options: [no-agent, strict]

permissions:
  contents: read

concurrency:
  group: aft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aft:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a cold OpenCode build adds several minutes
    env:
      AFT_DIR: ${{ github.workspace }}/.aft
      FLEET_DB_REPO: ${{ github.workspace }}/.fleet-db
      FLUE_REPO: ${{ github.workspace }}/.flue
    steps:
      - uses: actions/checkout@v4

      # aft and fleet-db live in separate private repos. AFT_CHECKOUT_TOKEN must be
      # a token with read access to both tysonthomas9/aft and BrowserOperator/fleet-db.
      - uses: actions/checkout@v4
        with:
          repository: tysonthomas9/aft
          token: ${{ secrets.AFT_CHECKOUT_TOKEN }}
          path: .aft
          # Pinned like the flue checkout below; update deliberately with AFT changes.
          ref: 9048c927365f94c2ac8d530b8dd1bbfdbe59b1d6

      - uses: actions/checkout@v4
        with:
          repository: BrowserOperator/fleet-db
          token: ${{ secrets.AFT_CHECKOUT_TOKEN }}
          path: .fleet-db
          # Parent-child edges must be structural for epic-runner children to be
          # claimable. Pin the cross-repo fix just like AFT and flue.
          ref: 4029874207aad1d9048bee1e41612ec30d42ea14

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # agent-browser requires >= 24; flue needs >= 22.19
          cache: npm
          cache-dependency-path: |
            internal/webui/frontend/package-lock.json
            .aft/package-lock.json

      # flue runtime + cli, needed to build the builtin epic-runner workflow bundle
      # (zz-agent-flow suite). Public repo, pinned like ci.yml's builtin-bundle-pin
      # job — and like it, built AFTER setup-node so pnpm runs on node 24.
      - name: Read pinned flue commit
        id: flue-pin
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < internal/workflows/FLUE_COMMIT)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.FLUE_REPOSITORY || 'withastro/flue' }}
          ref: ${{ steps.flue-pin.outputs.sha }}
          path: .flue

      - uses: pnpm/action-setup@v4
        with:
          version: '11.1.1'

      - name: Build flue
        run: cd .flue && pnpm install --frozen-lockfile && pnpm --filter @flue/runtime --filter @flue/cli build

      - name: Install agent-browser, Chrome, and ffmpeg
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg

      - name: Build aft
        run: cd .aft && npm ci # prepare script compiles dist/

      - name: Build frontend
        run: cd internal/webui/frontend && npm ci && npm run build

      # Real OpenCode for the agents-v1 suites and their canary: the pinned build
      # (R22: 2.0.19, sst/opencode v2 at b30c4d0), built as in its BUILD-INFO.
      # run-aft.sh drives it with the scripted fake model; no paid model runs.
      - name: Cache pinned OpenCode
        id: opencode-cache
        uses: actions/cache@v4
        with:
          path: .opencode-bin
          key: opencode-2.0.19-b30c4d0-${{ runner.os }}-${{ runner.arch }}

      - if: steps.opencode-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: sst/opencode
          ref: b30c4d00d15ed20d15a19e5c07534514bc2ee0fe
          path: .opencode

      - if: steps.opencode-cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build pinned OpenCode
        if: steps.opencode-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd .opencode && bun install --frozen-lockfile
          cd packages/cli && OPENCODE_CHANNEL=latest OPENCODE_VERSION=2.0.19 bun run script/build.ts --single --skip-install
          mkdir -p "$GITHUB_WORKSPACE/.opencode-bin"
          cp dist/cli-linux-x64/bin/opencode "$GITHUB_WORKSPACE/.opencode-bin/opencode"

      - name: Use pinned OpenCode
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.opencode-bin/opencode" --version | grep -F 2.0.19
          echo "LOOM_OPENCODE_BIN=$GITHUB_WORKSPACE/.opencode-bin/opencode" >> "$GITHUB_ENV"

      - name: Run aft suites (deterministic)
        if: inputs.mode != 'strict'
        run: make test-aft AFT_ARGS="--record --screenshots --storyboard --junit tests/aft/reports/junit.xml"

      - name: Install claude CLI
        if: inputs.mode == 'strict'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run aft suites (strict — agent diagnoses failures)
        if: inputs.mode == 'strict'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make test-aft-strict AFT_ARGS="--record --screenshots --storyboard --junit tests/aft/reports/junit.xml"

      - name: Write step summary
        if: always()
        run: python3 tests/aft/scripts/report-summary.py tests/aft/reports/last-run.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports (JSON, JUnit, Storyboard, HTML report, screenshots, failure videos, server log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aft-reports
          path: tests/aft/reports/
          if-no-files-found: ignore
          retention-days: 14
