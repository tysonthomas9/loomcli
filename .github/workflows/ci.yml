name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single quality gate — runs the same 12-step check as local dev
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@loomcli.test"

      - name: Install frontend dependencies
        run: cd internal/webui/frontend && npm ci

      - name: make check
        run: make check

  # Coverage reporting (separate from quality gate)
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@loomcli.test"

      - name: Build frontend
        run: cd internal/webui/frontend && npm ci && npm run build

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -tags=integration -timeout 15m ./...

      - name: Check coverage threshold
        run: ./scripts/check-coverage.sh coverage.out 70

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage.out
          fail_ci_if_error: false

      - name: Check frontend coverage threshold
        run: cd internal/webui/frontend && npm run test:coverage

  # Frontend independently deployable: build + test without Go toolchain.
  frontend-standalone:
    name: Frontend (standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd internal/webui/frontend && npm ci

      - name: Build with VITE_API_BASE_URL
        run: cd internal/webui/frontend && VITE_API_BASE_URL=https://api.ci-test.example.com npm run build

      - name: Verify build output
        run: test -f internal/webui/frontend/dist/index.html

      - name: Verify VITE_API_BASE_URL was baked into the bundle
        run: grep -r "api.ci-test.example.com" internal/webui/frontend/dist/ > /dev/null

      - name: Unit tests
        run: cd internal/webui/frontend && npm run test:unit

      - name: Coverage threshold
        run: cd internal/webui/frontend && npm run test:coverage

      - name: Architectural checks
        run: cd internal/webui/frontend && npm run check:arch

  # Cross-platform verification (lightweight — Go tests only)
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@loomcli.test"

      - name: Build frontend
        run: cd internal/webui/frontend && npm ci && npm run build

      - name: Test
        run: go test -v -race -timeout 15m ./...
