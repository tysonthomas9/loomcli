name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Cross-platform test matrix
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          # Linux: full test suite with coverage
          - os: ubuntu-latest
            coverage: true
            test-flags: '-v -race -coverprofile=coverage.out'
          # macOS: full test suite, no coverage (faster)
          - os: macos-latest
            coverage: false
            test-flags: '-v -race'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@loomcli.test"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ${{ matrix.test-flags }} ./...

      - name: Check coverage threshold
        if: matrix.coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          MIN_COVERAGE=25
          WARN_COVERAGE=40
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "Coverage is below ${MIN_COVERAGE}% threshold"
            exit 1
          elif (( $(echo "$COVERAGE < $WARN_COVERAGE" | bc -l) )); then
            echo "Coverage is below ${WARN_COVERAGE}% (warning threshold)"
          else
            echo "Coverage meets threshold"
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.coverage && success()
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
