name: CI

on:
  push:
    branches: [main, v5]
  pull_request:
    # Empty branches filter = runs on PRs targeting any branch. The Go and
    # Frontend quality-gate jobs below are equivalent to `make gate`.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go-only quality gate — installs Go toolchain only, no Node.
  go-quality-gate:
    name: Go Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@loomcli.test"

      - name: Decoupling smoke (no frontend dist)
        run: |
          rm -rf internal/webui/frontend/dist
          make build

      - name: Validate release skills contract
        run: go test ./internal/cireport -count=1

      - name: make check-go
        run: make check-go

  # Frontend-only quality gate — installs Node toolchain only, no Go.
  frontend-quality-gate:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd internal/webui/frontend && npm ci

      - name: make check-frontend
        run: make check-frontend

  # Go coverage reporting (separate from quality gate)
  coverage-go:
    name: Go Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@loomcli.test"

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -tags=integration -timeout 15m ./...

      - name: Check coverage threshold
        run: ./scripts/check-coverage.sh coverage.out 60

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  # Frontend coverage reporting (separate from quality gate)
  coverage-frontend:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd internal/webui/frontend && npm ci

      - name: Run frontend tests with coverage
        run: cd internal/webui/frontend && npm run test:coverage

  # Frontend independently deployable: build + test without Go toolchain.
  frontend-standalone:
    name: Frontend (standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd internal/webui/frontend && npm ci

      - name: Build with VITE_API_BASE_URL
        run: cd internal/webui/frontend && VITE_API_BASE_URL=https://api.ci-test.example.com npm run build

      - name: Verify build output
        run: test -f internal/webui/frontend/dist/index.html

      - name: Verify VITE_API_BASE_URL is not baked into the bundle
        run: "! grep -r \"api.ci-test.example.com\" internal/webui/frontend/dist/ > /dev/null"

      - name: Unit tests
        run: cd internal/webui/frontend && npm run test:unit

      - name: Coverage threshold
        run: cd internal/webui/frontend && npm run test:coverage

      - name: Architectural checks
        run: cd internal/webui/frontend && npm run check:arch

  # Cross-platform verification (lightweight — Go tests only, no frontend)
  test-macos-go:
    name: Test (macOS, Go)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@loomcli.test"

      - name: Test
        run: go test -v -race -timeout 15m ./...

  # Builds the builtin workflow sources against pinned Flue in a scratch
  # directory and runs their Node tests. Generated bundle output is intentionally
  # not committed.
  builtin-bundle-pin:
    name: Builtin Bundle (flue pin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned flue commit
        id: pin
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < internal/workflows/FLUE_COMMIT)"
          # Validate before it flows into actions/checkout `ref:` — must be a 40-char hex SHA.
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: FLUE_COMMIT is not a 40-char hex SHA: '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out flue
        uses: actions/checkout@v4
        with:
          # Override via the FLUE_REPOSITORY repo variable if the source moves.
          repository: ${{ vars.FLUE_REPOSITORY || 'withastro/flue' }}
          ref: ${{ steps.pin.outputs.sha }}
          path: flue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # the bundle imports node:sqlite

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.1.1'

      - name: Build flue
        run: cd flue && pnpm install --frozen-lockfile && pnpm --filter @flue/runtime --filter @flue/cli build

      - name: Build builtin workflow bundle from source
        env:
          FLUE_REPO: ${{ github.workspace }}/flue
          BUILTIN_DIST_DEST: ${{ runner.temp }}/bundle-dist
        run: scripts/rebuild-builtin-bundle.sh

      - name: Builtin workflow node tests
        env:
          FLUE_REPO: ${{ github.workspace }}/flue
        run: make test-builtin-workflows
