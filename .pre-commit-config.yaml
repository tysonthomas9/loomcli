repos:
  - repo: local
    hooks:
      - id: bd-flush
        name: bd flush
        entry: bash -c 'command -v bd && bd sync --flush-only || true'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: gofmt
        name: gofmt
        entry: "bash -c 'output=$(gofmt -l \"$@\") && [ -z \"$output\" ] || (echo \"$output\"; echo \"Run: gofmt -w on the above files\"; exit 1)' --"
        language: system
        types: [go]
        pass_filenames: true

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --timeout=5m --new-from-rev=HEAD
        language: system
        types: [go]
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint & format
        entry: bash internal/webui/frontend/scripts/pre-commit-frontend.sh
        language: system
        files: '^internal/webui/frontend/src/.*\.(ts|tsx|css)$'
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
