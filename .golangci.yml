version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - cyclop
    - errcheck
    - funlen
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - depguard
    - unconvert
    - unparam

  settings:
    gosec:
      excludes:
        # Disable SSA taint-analysis rules whose sanitizer recognition is broken
        # in the current gosec version. The AST-based equivalents (G204, G304)
        # provide the same coverage and correctly recognize filepath.Clean etc.
        - G702 # Command injection — duplicate of G204, no sanitizer works
        - G703 # Path traversal — duplicate of G304, filepath.Clean not recognized
        - G704 # SSRF — no stdlib sanitizer exists
        - G705 # XSS — html.EscapeString not recognized; flags non-HTML writes
        - G706 # Log injection — strconv.Quote not recognized
    gocritic:
      disabled-tags:
        - experimental
        - opinionated
        - performance
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (*os.File).Write
        - (io.Closer).Close
        - (*io.PipeReader).Close
        - (*io.PipeWriter).Close
        - os.Remove
        - (*os.File).Sync
    cyclop:
      max-complexity: 20
    funlen:
      lines: 50
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 30
    misspell:
      locale: US
    depguard:
      rules:
        handler-layer-isolation:
          list-mode: lax
          files:
            - "**/handlers/**"
          deny:
            - pkg: github.com/tysonthomas9/loomcli/internal/notify
              desc: "Handlers must not import notify directly; call the owning capability public API"
          # Existing backend, Store, daemon, and webui/store imports are
          # grandfathered per file by make check-architecture. Keeping them in
          # depguard would turn this path correction into a big-bang rewrite.
        capability-httpapi-isolation:
          list-mode: lax
          files:
            - "**/internal/modules/*/httpapi/**"
          deny:
            - pkg: github.com/tysonthomas9/loomcli/internal/store
              desc: "Capability HTTP adapters must use their capability public API, not the composite Store"
            - pkg: github.com/tysonthomas9/loomcli/internal/domain
              desc: "Capability HTTP adapters must not leak the legacy global domain model"
            - pkg: github.com/tysonthomas9/loomcli/internal/infra
              desc: "Capability HTTP adapters must not import infrastructure implementations"
            - pkg: github.com/tysonthomas9/loomcli/internal/webui/service
              desc: "Capability HTTP adapters must use their capability public API, not the legacy service layer"
            - pkg: github.com/tysonthomas9/loomcli/internal/webui/svcimpl
              desc: "Capability HTTP adapters must not import legacy service implementations"
        # Module boundary rules — dependency direction: sdk → infra → web → cli
        # When adding new internal packages, add them to the appropriate rule below.
        # See /Users/tyson/.claude/plans/purrfect-weaving-stream.md for layer definitions.
        sdk-leaf:
          list-mode: lax
          files:
            - "**/internal/types/**"
            - "**/internal/entity/**"
            - "**/internal/backend/*.go"       # root only — sub-packages are infra
            - "**/internal/notify/**"
            - "**/internal/agenterr/**"
            - "**/internal/authmode/**"
            - "**/internal/workspaceerrors/**"
            - "**/internal/events/*.go"        # root only — otelexport is infra
            - "**/internal/ops/**"             # future: created by loomcli-rir82.2
            - "**/internal/httpclient/**"      # auth-aware HTTP client — sdk layer
          deny:
            # Infra-layer packages (SDK must not import infra)
            - pkg: github.com/tysonthomas9/loomcli/internal/rpc
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/sessions
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/lockfile
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/circuitbreaker
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/kv
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/configlock
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/usage
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/logrouter
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/atomicfile
              desc: "SDK-layer packages must not import infra packages"
            # NOTE: internal/workspace omitted — depguard prefix matching
            # falsely matches internal/workspaceerrors (SDK). No SDK package
            # imports workspace today; relies on code review if one ever does.
            - pkg: github.com/tysonthomas9/loomcli/internal/debug
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/testutil
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/backend/beads
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/backend/fleet
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/backend/agentipc
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/backend/api
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/events/otelexport
              desc: "SDK-layer packages must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/backend/mapping
              desc: "SDK-layer packages must not import infra packages"
            # Web-layer (SDK must not import webui)
            - pkg: github.com/tysonthomas9/loomcli/internal/webui
              desc: "SDK-layer packages must not import webui"
            # CLI-layer (SDK must not import cli)
            - pkg: github.com/tysonthomas9/loomcli/internal/cli
              desc: "SDK-layer packages must not import cli"
        infra-isolation:
          list-mode: lax
          files:
            - "**/internal/rpc/**"
            - "**/internal/sessions/**"
            - "**/internal/lockfile/**"
            - "**/internal/circuitbreaker/**"
            - "**/internal/kv/**"
            - "**/internal/configlock/**"
            - "**/internal/usage/**"
            - "**/internal/logrouter/**"
            - "**/internal/atomicfile/**"
            - "**/internal/gitbranch/**"
            - "**/internal/workspace/**"
            - "**/internal/debug/**"
            - "**/internal/testutil/**"
            - "**/internal/backend/mapping/**"
            - "**/internal/backend/beads/**"
            - "**/internal/backend/fleet/**"
            - "**/internal/backend/agentipc/**"
            - "**/internal/backend/api/**"
            - "**/internal/events/otelexport/**"
          deny:
            - pkg: github.com/tysonthomas9/loomcli/internal/webui
              desc: "Infra packages must not import webui"
            - pkg: github.com/tysonthomas9/loomcli/internal/cli
              desc: "Infra packages must not import cli"
        webui-isolation:
          list-mode: lax
          files:
            - "**/internal/webui/**"
          deny:
            - pkg: github.com/tysonthomas9/loomcli/internal/cli
              desc: "WebUI must not import cli"
        # cli/data is an sdk-only command package. It talks to a loom server over
        # HTTP exclusively using the generated OpenAPI client via api.APIBackend
        # and internal/httpclient for auth. It MUST NOT import cli root, cli
        # sub-packages, webui, or any infra package. Enforced by prefix match —
        # see the flat-layout note in loomcli-rir82.24 design.
        data-isolation:
          list-mode: lax
          files:
            - "**/internal/cli/data/**"
          deny:
            - pkg: github.com/tysonthomas9/loomcli/internal/cli
              desc: "cli/data must not import cli root or cli sub-packages (sdk-only; flat layout prevents prefix-match self-collision)"
            - pkg: github.com/tysonthomas9/loomcli/internal/webui
              desc: "cli/data must not import webui"
            - pkg: github.com/tysonthomas9/loomcli/internal/rpc
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/sessions
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/lockfile
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/circuitbreaker
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/kv
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/configlock
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/usage
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/logrouter
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/atomicfile
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/debug
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/testutil
              desc: "cli/data must not import infra packages"
            - pkg: github.com/tysonthomas9/loomcli/internal/backend/beads
              desc: "cli/data must not use the beads backend (HTTP only)"
            - pkg: github.com/tysonthomas9/loomcli/internal/backend/fleet
              desc: "cli/data must not use the fleet backend (HTTP only)"
            - pkg: github.com/tysonthomas9/loomcli/internal/backend/agentipc
              desc: "cli/data must not use the agentipc backend (HTTP only)"
            - pkg: github.com/tysonthomas9/loomcli/internal/backend/mapping
              desc: "cli/data must not import infra backend mapping"
            - pkg: github.com/tysonthomas9/loomcli/internal/events/otelexport
              desc: "cli/data must not import infra packages"
    staticcheck:
      checks:
        - "all"
        - "-QF*"   # Disable quick-fix suggestions (stylistic, low value)
        - "-ST1000" # Package comments are optional
        - "-ST1003" # Naming conventions are stylistic
        - "-ST1020" # Exported comment format is stylistic
        - "-ST1022" # Var/const comment format is stylistic
    revive:
      rules:
        # Disable rules that are too noisy
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        # Allow meaningful package names
        - name: var-naming
          arguments:
            - []  # No extra initialisms
            - []  # No skip packages
            - - upperCaseConst: false  # Allow lowercase constants

  exclusions:
    paths:
      - third_party
      - internal/backend/api/gen
    rules:
      # === Package naming exclusions ===
      # "misc" is a domain sub-package name within the webui handler hierarchy.
      - path: 'internal/webui/handlers/misc/'
        linters:
          - revive
        text: "var-naming: avoid meaningless package names"
      # "api" is the HTTP-API backend implementation, sibling to backend/beads,
      # backend/fleet, etc. The full import path is self-describing.
      - path: 'internal/backend/api/'
        linters:
          - revive
        text: "var-naming: avoid meaningless package names"
      # "log" is a domain sub-package (log streaming), distinct from stdlib log.
      - path: 'internal/webui/log/'
        linters:
          - revive
        text: "var-naming: avoid package names that conflict"

      # === Existing loomcli-specific exclusions ===

      # G104: Unhandled errors for cleanup operations (Close, Remove) are acceptable
      - linters:
          - gosec
        text: "G104"
      # G301: Directory permissions 0755 are standard for directories
      - linters:
          - gosec
        text: "G301"
      # G302: File/directory permissions - intentional for cross-process access and security hardening
      - path: 'internal/(cli/(lock|daemon/daemon_cmd)|rpc/socket_path)\.go'
        linters:
          - gosec
        text: "G302"
      # G304: File inclusion via variable - these are intentional file operations
      - path: 'internal/(cli/(automode/automode(_tmux)?|lock|agent/agent_cmd|config/(config|project)|daemon/daemon(_cmd|_config|_spawn|_supervisor)?|monitor/monitor|workspace/workspace_cmd)|rpc/auth|webui/(handlers/(misc/config|terminal/backend_config)|log/(open_unix|streamer)))\.go'
        linters:
          - gosec
        text: "G304"
      # G204: Subprocess launches are intentional for tmux, claude, bd, loom commands
      - path: 'internal/(cli/(automode/automode(_tmux)?|agent/recover|daemon/daemon(_spawn|_supervisor)?|migrate/)|kv/reconcile\.go|webui/terminal/)'
        linters:
          - gosec
        text: "G204"
      # G306: WriteFile 0644 is intentional for config files (world-readable)
      - linters:
          - gosec
        text: "G306"
      # G204: Subprocess launches for AI agent backends and daemon
      - path: 'internal/cli/(backends/backend_(claude|codex|opencode|external)|daemon/daemon(_spawn|_supervisor)?)\.go'
        linters:
          - gosec
        text: "G204"
      # G602: False positive - buf[0] access is after successful Read
      - path: 'internal/cli/automode/automode(_tmux)?\.go'
        linters:
          - gosec
        text: "G602"
      # var-naming: both driver packages (internal/driver epic-runner drivers,
      # internal/cli/driver CLI surface) intentionally share the name "driver";
      # the stdlib conflict (database/sql/driver) is nested and never imported
      # alongside these. Renaming would churn every importer for no clarity win.
      - path: '(internal/driver|internal/cli/driver)/.*\.go'
        linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library"
      # funlen/cyclop/gocognit: Large files with dedicated cleanup tasks
      # Remove exclusions as cleanup tasks complete
      # handlers split files — tracked by loomcli-6yk.5
      - path: "internal/webui/handlers_issues\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/handlers_deps\\.go"
        linters: [funlen, gocognit]
      - path: "internal/webui/handlers_health\\.go"
        linters: [funlen, cyclop, gocognit]
      # types.go — tracked by loomcli-6yk.6
      - path: "internal/types/types\\.go"
        linters:
          - funlen
          - cyclop
          - gocognit
      # automode.go — tracked by loomcli-6yk.7
      - path: "internal/cli/automode\\.go"
        linters:
          - funlen
          - cyclop
          - gocognit
      # automode_tmux*.go — same patterns as automode.go
      - path: "internal/cli/automode_tmux(_session)?\\.go"
        linters:
          - funlen
          - cyclop
          - gocognit
      # monitor*.go — tracked by loomcli-6yk.8
      - path: "internal/cli/monitor(_collect)?\\.go"
        linters:
          - funlen
          - cyclop
          - gocognit
      # task.go/plan.go — session lifecycle wrappers added complexity
      - path: "internal/cli/task\\.go"
        linters: [funlen, gocognit, cyclop]
      - path: "internal/cli/plan\\.go"
        linters: [funlen, gocognit, cyclop]
      # Existing complexity violations — TODO: address in follow-up cleanup
      - path: "internal/cli/agent_cmd\\.go"
        linters: [funlen]
      - path: "internal/cli/daemon_cmd\\.go"
        linters: [funlen, cyclop]
      - path: "internal/cli/daemon(_supervisor)?\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/cli/prompts\\.go"
        linters: [funlen]
      - path: "internal/cli/push\\.go"
        linters: [cyclop, gocognit]
      - path: "internal/cli/serve\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/cli/workspace_cmd\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/cli/worktree(_branch)?\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/server/middleware/cors\\.go"
        linters: [funlen, gocognit]
      - path: "internal/webui/fleet_handlers(_done|_claim)?\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/handlers_comments\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/handlers_logs\\.go"
        linters: [funlen, gocognit]
      - path: "internal/webui/handlers_terminal(_ws)?\\.go"
        linters: [funlen, gocognit, staticcheck]
      - path: "internal/webui/handlers_agent_terminal\\.go"
        linters: [funlen]
      - path: "internal/cli/monitor_display\\.go"
        linters: [funlen]
      - path: "internal/webui/log_streamer\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/server\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/sse\\.go"
        linters: [gocognit]
      # stack-aware PR publisher + epic-stack feature — pre-existing complexity,
      # cleanup tracked with the feature (introduced before the TS-leaf work).
      - path: "internal/stackpublish/reconciler\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/cli/epic/epic_stack\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/cli/epic/run\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/cli/stack/stack_cmd\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/driver/task_worktree_resolver\\.go"
        linters: [funlen, cyclop, gocognit, unparam]
      - path: "internal/driver/task_bridge\\.go"
        linters: [funlen, cyclop, gocognit]
      # funlen: Existing functions exceeding 50-line limit — cleanup tracked separately
      - path: "internal/cli/backend_.*\\.go"
        linters: [funlen]
      - path: "internal/cli/config(_cmd)?\\.go"
        linters: [funlen]
      - path: "internal/cli/daemon_(config|config_display|reconciler|spawn)\\.go"
        linters: [funlen]
      - path: "internal/cli/git_(api|diff)\\.go"
        linters: [funlen]
      - path: "internal/cli/hooks_(install|parse)\\.go"
        linters: [funlen]
      - path: "internal/cli/init(_helpers)?\\.go"
        linters: [funlen]
      - path: "internal/cli/recover(_helpers)?\\.go"
        linters: [funlen]
      - path: "internal/cli/serve_(observability|usage|workspace|workspace_info)\\.go"
        linters: [funlen]
      - path: "internal/cli/(doctor|fleetdb_server|pr|pull|push_helpers|reset|setup|status|task_router|usage_cmd|worker_cmd)\\.go"
        linters: [funlen]
      - path: "internal/events/otelexport/exporter\\.go"
        linters: [funlen]
      - path: "internal/kv/stale\\.go"
        linters: [funlen]
      - path: "internal/rpc/(client|metrics)\\.go"
        linters: [funlen]
      - path: "internal/sessions/(finalize|transcript_usage)\\.go"
        linters: [funlen]
      # Pre-existing funlen/gocognit in the native transcript capture paths.
      # These are shaped by backend JSONL formats and carry their own
      # branchiness; refactoring tracked as follow-up.
      - path: "internal/sessions/subagent_transcript\\.go"
        linters: [funlen]
      - path: "internal/sessions/transcript/claude/claude\\.go"
        linters: [funlen]
      - path: "internal/sessions/transcript/codex/codex\\.go"
        linters: [funlen]
      - path: "internal/sessions/transcript/opencode/opencode\\.go"
        linters: [funlen]
      - path: "internal/sessions/redact/redact\\.go"
        linters: [funlen, gocognit]
      - path: "internal/types/issue_hash\\.go"
        linters: [funlen]
      - path: "internal/webui/server/realtime/sse_token\\.go"
        linters: [funlen]
      - path: "internal/webui/handlers_(client_errors|config|csp|editors|graph|issue_tabs|issues_parse|ready|worker_api)\\.go"
        linters: [funlen]
      - path: "internal/webui/fleet_handlers_heartbeat\\.go"
        linters: [funlen]
      - path: "internal/webui/(agent_service_impl|file_service_impl|server_workspace|session_service_impl|terminal|terminal_context|terminal_service_impl|workspace_registry)\\.go"
        linters: [funlen]
      - path: "internal/webui/subscription(_poll)?\\.go"
        linters: [funlen]
      - path: "internal/webui/daemon/pool\\.go"
        linters: [funlen]
      - path: "internal/webui/server/middleware/(auth|jwks)\\.go"
        linters: [funlen]
      - path: "internal/webui/server/realtime/(handler|hub)\\.go"
        linters: [funlen]
      - path: "internal/webui/service/issue_move\\.go"
        linters: [funlen]

      # === Test file relaxations (matching beads patterns) ===

      # funlen: Table-driven tests naturally exceed function length limits
      - path: '_test\.go'
        linters:
          - funlen
      # gocognit: Complex test functions with setup/assertions naturally exceed limits
      - path: '_test\.go'
        linters:
          - gocognit
      # cyclop: Table-driven tests with many sub-cases naturally exceed cyclomatic limits
      - path: '_test\.go'
        linters:
          - cyclop
      # gosec: Various security checks relaxed in test files
      - path: '_test\.go'
        linters:
          - gosec
        text: "G304"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G306"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G115"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G404"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G204"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G302"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G602"
      # errcheck: Ignore unchecked errors in test files
      - path: '_test\.go'
        linters:
          - errcheck
      # ineffassign: Test functions often have intentionally unused intermediate assignments
      - path: '_test\.go'
        linters:
          - ineffassign
      # unparam: Test helper functions commonly have consistent signatures
      - path: '_test\.go'
        linters:
          - unparam
      # staticcheck: Some checks are overly strict in test code
      - path: '_test\.go'
        linters:
          - staticcheck
        text: "SA1019|SA1029|SA4000|SA4003|SA4006|SA5011|SA9003|S1021"

      # === New linter exclusions ===

      # gocritic: exitAfterDefer in CLI exit paths - process terminates intentionally
      - linters:
          - gocritic
        text: 'exitAfterDefer'
      # gocritic: ifElseChain is stylistic - some if-else chains are clearer than switches
      - linters:
          - gocritic
        text: 'ifElseChain'
      # gocritic: singleCaseSwitch - type assertions with single case are a common Go idiom
      - linters:
          - gocritic
        text: 'singleCaseSwitch'
      # misspell: "cancelled" is intentional - matching GitHub/API convention
      - linters:
          - misspell
        text: '[Cc]ancelled'

      # === errcheck exclusions for cleanup/HTTP patterns ===

      # errcheck: Close() on custom types in cleanup/defer paths
      - path: 'cmd/logrouter/'
        linters:
          - errcheck
        text: '\.Close'
      - path: 'internal/cli/logrouter_cmd\.go'
        linters:
          - errcheck
        text: '\.Close'
      - path: 'internal/logrouter/watcher\.go'
        linters:
          - errcheck
        text: '\.Close'
      - path: 'internal/cli/serve\.go'
        linters:
          - errcheck
        text: '\.Close'
      - path: 'internal/webui/'
        linters:
          - errcheck
        text: '\.Close'
      # errcheck: HTTP response writes where errors are non-actionable
      - path: 'internal/webui/'
        linters:
          - errcheck
        text: 'Encode|Fprintf'
      # errcheck: Prometheus metric writes where errors are non-actionable
      - path: 'internal/cli/serve(_metrics)?\.go'
        linters:
          - errcheck
        text: 'Fprintf'
      # errcheck: cli/data formatters write to os.Stdout; write errors are non-actionable
      - path: 'internal/cli/data/'
        linters:
          - errcheck
        text: 'Fprint'
      # errcheck: Terminal session cleanup is best-effort
      - path: 'internal/webui/handlers_terminal\.go'
        linters:
          - errcheck
        text: 'KillSessionByName'

      # === gosec exclusions for intentional patterns ===

      # G103: Unsafe calls for PTY window size detection
      - path: 'internal/cli/backend_codex\.go'
        linters:
          - gosec
        text: "G103"
      # G306: Config files use 0644 for readability
      - path: 'internal/cli/config\.go|internal/webui/handlers_config\.go'
        linters:
          - gosec
        text: "G306"
      # G115: Safe int-to-uint32 conversion for UID comparison
      - path: 'internal/cli/signal_dir_unix\.go|internal/rpc/socket_path\.go'
        linters:
          - gosec
        text: "G115"
      # G204: Subprocess launches for bd commands and tmux
      - path: 'internal/kv/reconcile\.go|internal/webui/terminal\.go'
        linters:
          - gosec
        text: "G204"
      # G304: Intentional file reads from known paths
      - path: 'internal/rpc/auth\.go|internal/webui/(auth|handlers_config|log_open_unix|log_streamer)\.go'
        linters:
          - gosec
        text: "G304"
      # G101: False positive on RPC operation constants and test token values
      - path: 'internal/rpc/protocol\.go'
        linters:
          - gosec
        text: "G101"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G101"
      # G302: Socket directory permissions 0700 are intentional
      - path: 'internal/rpc/socket_path\.go'
        linters:
          - gosec
        text: "G302"

      # === staticcheck exclusions ===

      # SA4032: Windows runtime check in non-windows file - cross-platform code
      - path: 'internal/rpc/socket_path'
        linters:
          - staticcheck
        text: "SA4032"
      # SA1019: Deprecated websocket library - migration tracked separately
      - path: 'internal/webui/handlers_(agent_)?terminal'
        linters:
          - staticcheck
        text: "SA1019"
      - path: 'internal/webui/server/realtime/terminal_relay\.go'
        linters:
          - staticcheck
        text: "SA1019"

      # === revive exclusions ===

      # revive: var-naming underscore names in tests where Go keywords conflict
      - path: '_test\.go'
        linters:
          - revive
        text: "don't use underscores in Go names"
      # revive: "types" is a standard meaningful package name
      - path: 'internal/types/'
        linters:
          - revive
        text: 'avoid meaningless package names'
      # revive: var-naming — "debug" and "rpc" package names conflict with stdlib but are intentional
      - path: 'internal/(debug|rpc)/'
        linters:
          - revive
        text: 'avoid package names that conflict'

      # === unparam exclusions ===

      # unparam: Cobra command handlers require (cmd, args) signature
      - path: 'internal/cli/init\.go'
        linters:
          - unparam
        text: 'is unused'
      # unparam: Parameter kept for API flexibility
      - path: '(cmd|internal)/logrouter/rotation\.go'
        linters:
          - unparam
        text: 'maxBackups'
      # unparam: Error return kept for future error paths
      - path: 'internal/cli/pr\.go'
        linters:
          - unparam
        text: 'generatePRInfo.*always nil'

issues:
  uniq-by-line: true

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tysonthomas9/loomcli
  exclusions:
    paths:
      - third_party
      - internal/backend/api/gen
