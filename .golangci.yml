version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - cyclop
    - errcheck
    - funlen
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam

  settings:
    gocritic:
      disabled-tags:
        - experimental
        - opinionated
        - performance
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (*os.File).Write
        - (io.Closer).Close
        - (*io.PipeReader).Close
        - (*io.PipeWriter).Close
        - os.Remove
        - (*os.File).Sync
    cyclop:
      max-complexity: 20
    funlen:
      lines: 100
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 30
    misspell:
      locale: US
    staticcheck:
      checks:
        - "all"
        - "-QF*"   # Disable quick-fix suggestions (stylistic, low value)
        - "-ST1000" # Package comments are optional
        - "-ST1003" # Naming conventions are stylistic
        - "-ST1020" # Exported comment format is stylistic
        - "-ST1022" # Var/const comment format is stylistic
    revive:
      rules:
        # Disable rules that are too noisy
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        # Allow meaningful package names
        - name: var-naming
          arguments:
            - []  # No extra initialisms
            - []  # No skip packages
            - - upperCaseConst: false  # Allow lowercase constants

  exclusions:
    paths:
      - third_party
    rules:
      # === Existing loomcli-specific exclusions ===

      # G104: Unhandled errors for cleanup operations (Close, Remove) are acceptable
      - linters:
          - gosec
        text: "G104"
      # G301: Directory permissions 0755 are standard for directories
      - linters:
          - gosec
        text: "G301"
      # G302: File/directory permissions - intentional for cross-process access and security hardening
      - path: 'internal/(cli/(lock|daemon_cmd)|rpc/socket_path)\.go'
        linters:
          - gosec
        text: "G302"
      # G304: File inclusion via variable - these are intentional file operations
      - path: 'internal/(cli/(automode|lock|agent_cmd|config|daemon|daemon_cmd|daemon_config|monitor|workspace_cmd)|rpc/auth|webui/(auth|handlers_config|log_open_unix|log_streamer))\.go'
        linters:
          - gosec
        text: "G304"
      # G204: Subprocess launches are intentional for tmux, claude, bd, loom commands
      - path: 'internal/(cli/(automode|recover|daemon)|kv/reconcile|webui/terminal)\.go'
        linters:
          - gosec
        text: "G204"
      # G306: WriteFile 0644 is intentional for config files (world-readable)
      - linters:
          - gosec
        text: "G306"
      # G204: Subprocess launches for AI agent backends and daemon
      - path: 'internal/cli/(backend_claude|backend_codex|backend_opencode|daemon)\.go'
        linters:
          - gosec
        text: "G204"
      # G602: False positive - buf[0] access is after successful Read
      - path: 'internal/cli/automode\.go'
        linters:
          - gosec
        text: "G602"
      # funlen/cyclop/gocognit: Large files with dedicated cleanup tasks
      # Remove exclusions as cleanup tasks complete
      # handlers split files — tracked by loomcli-6yk.5
      - path: "internal/webui/handlers_issues\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/handlers_deps\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/handlers_health\\.go"
        linters: [funlen, cyclop, gocognit]
      # types.go — tracked by loomcli-6yk.6
      - path: "internal/types/types\\.go"
        linters:
          - funlen
          - cyclop
          - gocognit
      # automode.go — tracked by loomcli-6yk.7
      - path: "internal/cli/automode\\.go"
        linters:
          - funlen
          - cyclop
          - gocognit
      # monitor.go — tracked by loomcli-6yk.8
      - path: "internal/cli/monitor\\.go"
        linters:
          - funlen
          - cyclop
          - gocognit
      # Existing complexity violations — TODO: address in follow-up cleanup
      - path: "internal/cli/agent_cmd\\.go"
        linters: [funlen]
      - path: "internal/cli/daemon_cmd\\.go"
        linters: [funlen, cyclop]
      - path: "internal/cli/daemon\\.go"
        linters: [cyclop, gocognit]
      - path: "internal/cli/prompts\\.go"
        linters: [funlen]
      - path: "internal/cli/push\\.go"
        linters: [cyclop, gocognit]
      - path: "internal/cli/serve\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/cli/workspace_cmd\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/cli/worktree\\.go"
        linters: [cyclop, gocognit]
      - path: "internal/webui/cors\\.go"
        linters: [gocognit]
      - path: "internal/webui/fleet_handlers\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/handlers_comments\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/handlers_logs\\.go"
        linters: [funlen, gocognit]
      - path: "internal/webui/handlers_terminal\\.go"
        linters: [funlen, gocognit]
      - path: "internal/webui/log_streamer\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/server\\.go"
        linters: [funlen, cyclop, gocognit]
      - path: "internal/webui/sse\\.go"
        linters: [gocognit]

      # === Test file relaxations (matching beads patterns) ===

      # gosec: Various security checks relaxed in test files
      - path: '_test\.go'
        linters:
          - gosec
        text: "G304"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G306"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G115"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G404"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G204"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G302"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G602"
      # errcheck: Ignore unchecked errors in test files
      - path: '_test\.go'
        linters:
          - errcheck
      # unparam: Test helper functions commonly have consistent signatures
      - path: '_test\.go'
        linters:
          - unparam
      # staticcheck: Some checks are overly strict in test code
      - path: '_test\.go'
        linters:
          - staticcheck
        text: "SA1019|SA1029|SA4000|SA4003|SA4006|SA5011|SA9003|S1021"

      # === New linter exclusions ===

      # gocritic: exitAfterDefer in CLI exit paths - process terminates intentionally
      - linters:
          - gocritic
        text: 'exitAfterDefer'
      # gocritic: ifElseChain is stylistic - some if-else chains are clearer than switches
      - linters:
          - gocritic
        text: 'ifElseChain'
      # gocritic: singleCaseSwitch - type assertions with single case are a common Go idiom
      - linters:
          - gocritic
        text: 'singleCaseSwitch'
      # misspell: "cancelled" is intentional - matching GitHub/API convention
      - linters:
          - misspell
        text: '[Cc]ancelled'

      # === errcheck exclusions for cleanup/HTTP patterns ===

      # errcheck: Close() on custom types in cleanup/defer paths
      - path: 'cmd/logrouter/'
        linters:
          - errcheck
        text: '\.Close'
      - path: 'internal/cli/serve\.go'
        linters:
          - errcheck
        text: '\.Close'
      - path: 'internal/webui/'
        linters:
          - errcheck
        text: '\.Close'
      # errcheck: HTTP response writes where errors are non-actionable
      - path: 'internal/webui/'
        linters:
          - errcheck
        text: 'Encode|Fprintf'
      # errcheck: Prometheus metric writes where errors are non-actionable
      - path: 'internal/cli/serve\.go'
        linters:
          - errcheck
        text: 'Fprintf'
      # errcheck: Terminal session cleanup is best-effort
      - path: 'internal/webui/handlers_terminal\.go'
        linters:
          - errcheck
        text: 'KillSessionByName'

      # === gosec exclusions for intentional patterns ===

      # G103: Unsafe calls for PTY window size detection
      - path: 'internal/cli/backend_codex\.go'
        linters:
          - gosec
        text: "G103"
      # G306: Config files use 0644 for readability
      - path: 'internal/cli/config\.go|internal/webui/handlers_config\.go'
        linters:
          - gosec
        text: "G306"
      # G115: Safe int-to-uint32 conversion for UID comparison
      - path: 'internal/cli/signal_dir_unix\.go|internal/rpc/socket_path\.go'
        linters:
          - gosec
        text: "G115"
      # G204: Subprocess launches for bd commands and tmux
      - path: 'internal/kv/reconcile\.go|internal/webui/terminal\.go'
        linters:
          - gosec
        text: "G204"
      # G304: Intentional file reads from known paths
      - path: 'internal/rpc/auth\.go|internal/webui/(auth|handlers_config|log_open_unix|log_streamer)\.go'
        linters:
          - gosec
        text: "G304"
      # G101: False positive on RPC operation constants and test token values
      - path: 'internal/rpc/protocol\.go'
        linters:
          - gosec
        text: "G101"
      - path: '_test\.go'
        linters:
          - gosec
        text: "G101"
      # G302: Socket directory permissions 0700 are intentional
      - path: 'internal/rpc/socket_path\.go'
        linters:
          - gosec
        text: "G302"

      # === staticcheck exclusions ===

      # SA4032: Windows runtime check in non-windows file - cross-platform code
      - path: 'internal/rpc/socket_path'
        linters:
          - staticcheck
        text: "SA4032"
      # SA1019: Deprecated websocket library - migration tracked separately
      - path: 'internal/webui/handlers_terminal\.go'
        linters:
          - staticcheck
        text: "SA1019"

      # === revive exclusions ===

      # revive: var-naming underscore names in tests where Go keywords conflict
      - path: '_test\.go'
        linters:
          - revive
        text: "don't use underscores in Go names"
      # revive: "types" is a standard meaningful package name
      - path: 'internal/types/'
        linters:
          - revive
        text: 'avoid meaningless package names'

      # === unparam exclusions ===

      # unparam: Cobra command handlers require (cmd, args) signature
      - path: 'internal/cli/init\.go'
        linters:
          - unparam
        text: 'is unused'
      # unparam: Parameter kept for API flexibility
      - path: 'cmd/logrouter/rotation\.go'
        linters:
          - unparam
        text: 'maxBackups'
      # unparam: Error return kept for future error paths
      - path: 'internal/cli/pr\.go'
        linters:
          - unparam
        text: 'generatePRInfo.*always nil'

issues:
  uniq-by-line: true

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tysonthomas9/loomcli
  exclusions:
    paths:
      - third_party
